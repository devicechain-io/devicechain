#
# promtool UNIT TESTS for the sign-in alerting rules.
#
# WHAT THESE ARE FOR, over and above the parse check
#
# CredentialAttemptStoreFull (and its device twin, DeviceCredentialAttemptStoreFull,
# further down) watches one outcome of a counter that moves on EVERY
# sign-in. The cases worth writing down are therefore the quiet ones: a sign-in flood
# that is being throttled normally -- mismatches and throttled attempts by the thousand --
# is the platform doing its job and must not page. Only attempts checked WITHOUT their
# backoff (outcome="store_full") mean the control is off.
#
# THE SERIES, and what is known about it:
#
#   - devicechain_usermanagement_credential_checks_total{kind, outcome} -- a CounterVec.
#     The checker exports {outcome="store_full"} at 0 for every throttled kind from
#     construction, so on a healthy instance that series EXISTS and reads 0. The scenarios
#     below carry it at zero for that reason, and the first case starts it at zero before
#     it moves: that is the shape which lets increase() see the very first fail-open.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml. Naming it below is not
# optional: promtool with no rule_files loads no rules, and every expected alert then
# reads as "the rule does not fire" rather than "there is no rule".
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # The store fills: a handful of attempts fail open, then it drains.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Zero for 10m, then ONE attempt checked without its backoff, then flat.
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="store_full"}'
        values: '0x10 1x50'
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="mismatch"}'
        values: '0+100x60'
    alert_rule_test:
      # Before anything failed open.
      - eval_time: 9m
        alertname: CredentialAttemptStoreFull
        exp_alerts: []
      # A single fail-open is enough, and there is no pending period.
      - eval_time: 12m
        alertname: CredentialAttemptStoreFull
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Password sign-ins are being checked without their per-account backoff"
              description: "The credential-attempt store is full, so user-management is checking password sign-ins WITHOUT slowing down repeated failures on any address that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 5 minutes. Sign-in itself still works -- refusing it would let whoever filled the store lock every user out -- but guessing is now limited only by the per-request field cap and the cost of each password check. The store fills when sign-ins are sent for a very large number of distinct email addresses inside ten minutes, which almost always means someone is spraying addresses. Find where the sign-in traffic comes from (the ingress logs, and user-management's rate-limited 'credential attempt store is full' warning) and block it upstream. The store drains on its own as entries expire, ten minutes after the flood stops. If the sign-in traffic is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."
      # Ten minutes after the last one, the window no longer holds it.
      - eval_time: 30m
        alertname: CredentialAttemptStoreFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE CASE THAT MAKES THE ALERT USABLE: a sign-in flood that the backoff is
  # handling. Mismatches and throttled attempts climb steeply, the store-full series
  # stays at zero, and nothing pages.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="store_full"}'
        values: '0x60'
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="mismatch"}'
        values: '0+500x60'
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="throttled"}'
        values: '0+5000x60'
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="unavailable"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: CredentialAttemptStoreFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # user-management restarts while the store is full: the counter resets and climbs
  # again. increase() treats the reset as a reset, not as a negative change, so the
  # alert holds across it.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="store_full"}'
        values: '0+20x20 0+20x20'
    alert_rule_test:
      - eval_time: 22m
        alertname: CredentialAttemptStoreFull
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Password sign-ins are being checked without their per-account backoff"
              description: "The credential-attempt store is full, so user-management is checking password sign-ins WITHOUT slowing down repeated failures on any address that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 5 minutes. Sign-in itself still works -- refusing it would let whoever filled the store lock every user out -- but guessing is now limited only by the per-request field cap and the cost of each password check. The store fills when sign-ins are sent for a very large number of distinct email addresses inside ten minutes, which almost always means someone is spraying addresses. Find where the sign-in traffic comes from (the ingress logs, and user-management's rate-limited 'credential attempt store is full' warning) and block it upstream. The store drains on its own as entries expire, ten minutes after the flood stops. If the sign-in traffic is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."

  # ------------------------------------------------------------------
  # Nothing scraped at all. This rule is quiet then -- with or without its
  # or vector(0), which alerting cannot tell apart from an empty result -- and it is
  # not the rule that reports a user-management nobody is scraping; the tenant-purge
  # group's visibility alert is.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: CredentialAttemptStoreFull
        exp_alerts: []
      - eval_time: 30m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts: []

  # ==================================================================
  # DeviceCredentialAttemptStoreFull -- the device twin, over
  # devicechain_devicemanagement_credential_checks_total{kind="device-credential"}.
  # device-management exports its store_full series at 0 from startup, as
  # user-management does.
  # ==================================================================

  # ------------------------------------------------------------------
  # The device store fills: one MQTT connect checked without its backoff fires the
  # WARNING, with no pending period, and the window lets go ten minutes later.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="store_full"}'
        values: '0x10 1x50'
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="success"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts: []
      - eval_time: 12m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "MQTT password connects are being checked without their per-username backoff"
              description: "The device credential-attempt store is full, so device-management is checking MQTT password connects WITHOUT slowing down repeated failures on any username that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 30 seconds. Connects still work -- refusing them would let whoever filled the store keep every password device off the platform -- but guessing a device's password is now limited only by how fast the broker accepts connects. Every connect, successful or not, holds an entry for ten minutes, so the store fills either when connects are sent for a very large number of distinct usernames (someone spraying usernames: find where the MQTT connects come from and block it upstream) or when a very large fleet reconnects all at once, for example after a broker restart. It drains on its own as entries expire, ten minutes after the wave stops. If the connect volume is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."
      - eval_time: 30m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE QUIET CASE: a fleet of misconfigured devices, or a guesser, being slowed
  # down normally. Wrong passwords and throttled connects by the thousand, the device
  # store_full series flat at zero, and nothing fires.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="store_full"}'
        values: '0x60'
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="mismatch"}'
        values: '0+2000x60'
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="throttled"}'
        values: '0+20000x60'
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="unavailable"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 EACH ALERT WATCHES ITS OWN SERVICE. A full PEOPLE's store fires only the people
  # alert, and a full DEVICE store only the device one. This is what a copy-paste of
  # the metric name between the two rules would break, in either direction.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="store_full"}'
        values: '0x5 1x55'
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="store_full"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 7m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts: []
      - eval_time: 7m
        alertname: CredentialAttemptStoreFull
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Password sign-ins are being checked without their per-account backoff"
              description: "The credential-attempt store is full, so user-management is checking password sign-ins WITHOUT slowing down repeated failures on any address that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 5 minutes. Sign-in itself still works -- refusing it would let whoever filled the store lock every user out -- but guessing is now limited only by the per-request field cap and the cost of each password check. The store fills when sign-ins are sent for a very large number of distinct email addresses inside ten minutes, which almost always means someone is spraying addresses. Find where the sign-in traffic comes from (the ingress logs, and user-management's rate-limited 'credential attempt store is full' warning) and block it upstream. The store drains on its own as entries expire, ten minutes after the flood stops. If the sign-in traffic is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", kind="identity", outcome="store_full"}'
        values: '0x60'
      - series: 'devicechain_devicemanagement_credential_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", kind="device-credential", outcome="store_full"}'
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 7m
        alertname: CredentialAttemptStoreFull
        exp_alerts: []
      - eval_time: 7m
        alertname: DeviceCredentialAttemptStoreFull
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "MQTT password connects are being checked without their per-username backoff"
              description: "The device credential-attempt store is full, so device-management is checking MQTT password connects WITHOUT slowing down repeated failures on any username that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 30 seconds. Connects still work -- refusing them would let whoever filled the store keep every password device off the platform -- but guessing a device's password is now limited only by how fast the broker accepts connects. Every connect, successful or not, holds an entry for ten minutes, so the store fills either when connects are sent for a very large number of distinct usernames (someone spraying usernames: find where the MQTT connects come from and block it upstream) or when a very large fleet reconnects all at once, for example after a broker restart. It drains on its own as entries expire, ten minutes after the wave stops. If the connect volume is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."

  # ==================================================================
  # Single sign-on: SsoIdpUnreachable, SsoUnverifiedIdentityRefused, SsoStateStoreFull,
  # over devicechain_usermanagement_sso_logins_total{connection,outcome} and
  # devicechain_usermanagement_sso_idp_fetch_failures_total{connection}.
  # ==================================================================

  # ------------------------------------------------------------------
  # A provider that keeps failing: one failed request is a blip and does not page; ten
  # minutes of them does; and once they stop the alert clears.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: "devicechain_usermanagement_sso_idp_fetch_failures_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\"}"
        values: '0x5 1+1x30 31x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: SsoIdpUnreachable
        exp_alerts: []
      - eval_time: 25m
        alertname: SsoIdpUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              connection: acme-idp
            exp_annotations:
              summary: "An identity provider cannot be reached for single sign-on"
              description: "user-management has been failing to reach the identity provider of connection acme-idp (its token endpoint or its signing keys) for ten minutes, so people who sign in through it are being refused. Password sign-in is unaffected. The connection's endpoints are the ones recorded and approved in its discovery snapshot, and every request goes through the egress guard: check that the provider is up, that its address resolves from the cluster, and that the egress allow list (instance.config.infrastructure.egress) permits an on-premises provider's range. If the provider moved an endpoint, run refreshIdpDiscovery and approve the new snapshot."
      - eval_time: 70m
        alertname: SsoIdpUnreachable
        exp_alerts: []

  # A single failure inside an otherwise healthy hour is not an alert.
  - interval: 1m
    input_series:
      - series: "devicechain_usermanagement_sso_idp_fetch_failures_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\"}"
        values: '0x20 1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: SsoIdpUnreachable
        exp_alerts: []

  # ------------------------------------------------------------------
  # refused_required_claim is a SECURITY event: one is enough, there is no pending period, and the 10m
  # window lets go ten minutes after the last.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"refused_required_claim\"}"
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 4m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts: []
      - eval_time: 7m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              connection: acme-idp
              outcome: refused_required_claim
            exp_annotations:
              summary: "Single sign-on refused a sign-in that an identity provider vouched for"
              description: "Connection acme-idp had a sign-in refused with outcome refused_required_claim. Nobody was signed in. Each of these outcomes is the platform's own check overriding the provider: refused_unverified_email (the provider did not vouch for the address), refused_unverified_domain (the address is not in a domain asserted for this connection), refused_required_claim (the token lacks a claim the connection requires, for example the Workspace domain or the Microsoft tenant id), or refused_system_role_identity (a tenant's provider asserted an identity that holds a system role). They are usually a misconfigured connection or someone probing one, and occasionally an attempt to sign in as another person. Look at the audit journal for the asserted address, and at the provider's own sign-in log."
      - eval_time: 30m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts: []

  # ------------------------------------------------------------------
  # refused_system_role_identity is a SECURITY event: one is enough, there is no pending period, and the 10m
  # window lets go ten minutes after the last.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"refused_system_role_identity\"}"
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 4m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts: []
      - eval_time: 7m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              connection: acme-idp
              outcome: refused_system_role_identity
            exp_annotations:
              summary: "Single sign-on refused a sign-in that an identity provider vouched for"
              description: "Connection acme-idp had a sign-in refused with outcome refused_system_role_identity. Nobody was signed in. Each of these outcomes is the platform's own check overriding the provider: refused_unverified_email (the provider did not vouch for the address), refused_unverified_domain (the address is not in a domain asserted for this connection), refused_required_claim (the token lacks a claim the connection requires, for example the Workspace domain or the Microsoft tenant id), or refused_system_role_identity (a tenant's provider asserted an identity that holds a system role). They are usually a misconfigured connection or someone probing one, and occasionally an attempt to sign in as another person. Look at the audit journal for the asserted address, and at the provider's own sign-in log."
      - eval_time: 30m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE QUIET CASE: a busy instance where sign-ins succeed, people are told to ask for a
  # link, tokens fail verification, and begin calls are rate limited. None of those is the
  # provider vouching for someone it should not have, and neither of the two alerts that
  # read this counter fires.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"success\"}"
        values: '0+500x60'
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"refused_link_required\"}"
        values: '0+200x60'
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"idp_error\"}"
        values: '0+50x60'
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"state_invalid\"}"
        values: '0+500x60'
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"rate_limited\"}"
        values: '0+500x60'
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"refused_token_invalid\"}"
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts: []
      - eval_time: 60m
        alertname: SsoStateStoreFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # The state bucket fills: begin fails closed, which the counter records.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: "devicechain_usermanagement_sso_logins_total{namespace=\"dci-devicechain\", pod=\"dc-user-management-7c9f-abcde\", job=\"devicechain/user-management\", connection=\"acme-idp\", outcome=\"state_store_full\"}"
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 4m
        alertname: SsoStateStoreFull
        exp_alerts: []
      - eval_time: 7m
        alertname: SsoStateStoreFull
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Single sign-on is refusing every sign-in because its state store is full"
              description: "The single sign-on state store is full, so user-management is refusing to begin any sign-in through any identity provider (it fails closed rather than drop the protection that makes a replayed callback useless). Password sign-in still works. The store fills when an enormous number of sign-ins are begun inside ten minutes, which almost always means someone is calling beginSso in a loop: the call is public and is limited per source address and globally, but a distributed sender can still fill it. Find the traffic in the ingress logs and block it upstream; the store drains on its own ten minutes after the flood stops. If the volume is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."
      - eval_time: 30m
        alertname: SsoStateStoreFull
        exp_alerts: []

  # Nothing scraped at all: none of the three fires (the tenant-purge group's visibility
  # alert is what reports a user-management nobody is scraping).
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: SsoIdpUnreachable
        exp_alerts: []
      - eval_time: 30m
        alertname: SsoUnverifiedIdentityRefused
        exp_alerts: []
      - eval_time: 30m
        alertname: SsoStateStoreFull
        exp_alerts: []

  # ==================================================================
  # Two-factor sign-in: MfaIdentityLocked (REQUIRED) and MfaVerificationFailuresSustained.
  #
  # MfaIdentityLocked reads a counter that user-management exports at 0 from startup, which is
  # what lets increase() see the very FIRST lock; the cases start it at zero for that reason.
  # ==================================================================

  # One account locks: the alert fires at once (no pending period) and clears when the window
  # no longer holds the increase.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_mfa_identity_locks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '0x10 1x50'
    alert_rule_test:
      - eval_time: 9m
        alertname: MfaIdentityLocked
        exp_alerts: []
      - eval_time: 12m
        alertname: MfaIdentityLocked
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "An account's password is in use by someone failing its second factor"
              description: "A second-factor lock armed on an account: twenty wrong authenticator codes were evaluated, each after a CORRECT password. Someone has this account's password and is guessing its code. The authenticator stays locked for at most fifteen minutes at a time (the person can still sign in with a recovery code), and a password holder can renew the lock. Find the account in the audit journal (operation mfa_locked, preceded by mfa_failed rows and mfa_challenged rows) and RESET ITS PASSWORD with setPassword: that rotates the account's session epoch, which also voids every outstanding sign-in challenge. Do not reset the second factor first -- while the password is known to someone else that would give them the account (the reset refuses without a new password for this reason). The source addresses are in the ingress logs."
      - eval_time: 30m
        alertname: MfaIdentityLocked
        exp_alerts: []

  # 🔴 THE QUIET CASE: a steady trickle of mistyped codes (one a minute) and a great many
  # successes. No account locked, and a trickle is not a sustained failure rate, so neither
  # alert fires. A lock-count that never moves is the platform doing its job.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_mfa_identity_locks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '0x60'
      - series: 'devicechain_usermanagement_mfa_verifications_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", method="totp", result="ok"}'
        values: '0+300x60'
      - series: 'devicechain_usermanagement_mfa_verifications_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", method="totp", result="invalid"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: MfaIdentityLocked
        exp_alerts: []
      - eval_time: 60m
        alertname: MfaVerificationFailuresSustained
        exp_alerts: []

  # A sustained failure rate (ten a minute for the whole hour) fires the warning, but only after
  # its pending period, and does not by itself raise the lock alert.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_mfa_identity_locks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '0x60'
      - series: 'devicechain_usermanagement_mfa_verifications_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", method="totp", result="invalid"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: MfaVerificationFailuresSustained
        exp_alerts: []
      - eval_time: 40m
        alertname: MfaVerificationFailuresSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Second-factor codes are being refused at a sustained rate"
              description: "user-management has refused more than one second-factor code every ten seconds, on average, for fifteen minutes (wrong, replayed, or refused by a lock). Each attempt follows a correct password, so this is people typing their codes wrong in large numbers (a clock-skew problem on the nodes, or an authenticator app out of sync) or someone using passwords they obtained. Check that the nodes' clocks are synchronised (authenticator codes are accepted one 30-second step either side), then look at the audit journal for mfa_failed rows grouped by account and at the ingress logs for the source addresses. An account that has locked raises MfaIdentityLocked on its own."
      - eval_time: 40m
        alertname: MfaIdentityLocked
        exp_alerts: []

  # Nothing scraped at all: neither fires (the tenant-purge group's visibility alert is what
  # reports a user-management nobody is scraping).
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: MfaIdentityLocked
        exp_alerts: []
      - eval_time: 30m
        alertname: MfaVerificationFailuresSustained
        exp_alerts: []
