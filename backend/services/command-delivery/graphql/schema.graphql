#
# Command Delivery GraphQL Schema
#

"""Fields common to every stored record."""
# Base elements in gorm RDB model.
interface Model {
    """
    Server-assigned numeric identifier, serialized as a string. Look entities up by token where
    one exists.
    """
    id: ID!
    """When the record was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the record was last modified, as an RFC 3339 timestamp."""
    updatedAt: String
    """
    When the record was deleted, as an RFC 3339 timestamp. Deleted records are not returned by
    this API, so this is null in practice.
    """
    deletedAt: String
}

"""An entity addressed by a tenant-unique token."""
# Entity referenced by unique token.
interface TokenReference {
    """Tenant-unique token that identifies the entity."""
    token: String!
}

"""An entity that carries free-form metadata."""
# Entity that provides metadata.
interface MetadataEntity {
    """Free-form metadata as a JSON document serialized to a string; null when none was supplied."""
    metadata: String
}

"""
Where one page of search results sits within the full result set. Positions are 1-based and
inclusive.
"""
# Pagination info for search results.
type SearchResultsPagination {
    """Position of the first result of this page within the full result set (1-based)."""
    pageStart: Int
    """
    Position of the last result of this page within the full result set (1-based, inclusive).
    Capped at totalRecords.
    """
    pageEnd: Int
    """Number of records matching the criteria across all pages."""
    totalRecords: Int
}

"""
A persisted command to one device. It is stored when accepted and moves through the lifecycle
states in status until it settles; it is never fire-and-forget.
"""
# A persisted, lifecycle-tracked command to a device (ADR-012).
type Command implements Model & TokenReference & MetadataEntity {
    """
    Server-assigned numeric identifier, serialized as a string. Look entities up by token where
    one exists.
    """
    id: ID!
    """When the record was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the record was last modified, as an RFC 3339 timestamp."""
    updatedAt: String
    """
    When the record was deleted, as an RFC 3339 timestamp. Deleted records are not returned by
    this API, so this is null in practice.
    """
    deletedAt: String
    """
    Tenant-unique token. For a command created with createCommand it is the idempotency key the
    caller chose; for a command created by a batch it is chosen by the platform.
    """
    token: String!
    """
    Free-form metadata supplied when the command was created, as a JSON document serialized to a
    string; null when none was supplied.
    """
    metadata: String
    """Token of the device the command is addressed to."""
    deviceToken: String!
    """The command's name, as defined in the command vocabulary of the device's profile."""
    name: String!
    """
    The command's arguments, as a JSON document serialized to a string; null when none was
    supplied.
    """
    payload: String
    """
    Lifecycle state: one of QUEUED, HELD, SENT, PARKED, SUCCESSFUL, FAILED, TIMEOUT, EXPIRED or
    CANCELLED.

    QUEUED: accepted and awaiting its first dispatch decision. HELD: withheld because the device
    is known to be absent; it returns to QUEUED when the device comes back. SENT: dispatched
    toward the device and awaiting its response. PARKED: dispatched, but the transport found the
    device unreachable so nothing reached it; it is delivered on the device's next wake.

    SUCCESSFUL and FAILED: the device answered, reporting success or failure (FAILED is also set
    when the platform gives up publishing the command, or loses the device's answer; see error).
    TIMEOUT: the command expired while SENT without an answer. EXPIRED: the command expired
    while QUEUED, HELD or PARKED, so it never reached the device. CANCELLED: called off by a
    caller or by cancelling its batch.

    SUCCESSFUL, FAILED, TIMEOUT, EXPIRED and CANCELLED are terminal: no further transition
    occurs.
    """
    status: String!
    """When the command was accepted, as an RFC 3339 timestamp."""
    queuedTime: String
    """
    When the command was last dispatched toward the device, as an RFC 3339 timestamp. Null if it
    has not been dispatched, or if the dispatch was handed back (the command returned to QUEUED
    or PARKED).
    """
    sentTime: String
    """
    When the device's answer was recorded, as an RFC 3339 timestamp; null until a device
    answers.
    """
    respondedTime: String
    """
    Instant after which an undelivered command expires, as an RFC 3339 timestamp. When none was
    given at creation the platform stamps its default time-to-live (7 days unless the deployment
    configures another). Null means the command does not expire.
    """
    expiresAt: String
    """
    The start of the maintenance-window opening the command may be sent in, as an RFC 3339
    timestamp; null when the command is not gated by a window. While the status is QUEUED, HELD
    or PARKED and this is in the future the command is waiting for the window; it stays QUEUED
    while it waits. A past value means the opening has begun. A command that is not sent before
    that opening closes is moved to the next one.
    """
    dispatchAfter: String
    """
    The token of the maintenance window that gates the command, or null when it is not gated.
    Editing that window moves the commands still waiting on it to the new schedule.
    """
    maintenanceWindowToken: String
    """
    The payload the device returned with its answer, as a JSON document serialized to a string;
    null until the device answers or when it returned none.
    """
    responsePayload: String
    """
    Why the command failed. Set when status is FAILED and a reason exists: the message the
    device reported, or the platform's own explanation when it gave up publishing, lost the
    answer, or failed a command waiting for a maintenance window because the device's profile no
    longer defines it. Null otherwise.
    """
    error: String
    """Token of the batch that created this command; null for a command issued one at a time."""
    # The batch that created this command; null for a command issued one at a time.
    #
    # It is the inverse of `CommandSearchCriteria.batchToken`, and it exists because the
    # two directions answer different questions. Searching BY the token asks what a fleet
    # write is doing now; reading it OFF a row asks why this command exists at all — which
    # is a question a single row cannot answer, because the interesting part of a batch is
    # the devices that got NO row. A command minted by a batch carries a platform-chosen
    # token rather than a caller's idempotency key, so this is also the only link back to
    # the name, payload and target the caller actually asked for.
    batchToken: String
    """
    What a finished command physically amounted to, recorded by the write that finished it; null
    while the command is still live. SUCCEEDED: the device reported success. NOT_DELIVERED: proven
    never to have reached the device (expired or cancelled while the platform held it, or the
    platform gave up publishing it, or failed it while it waited for a maintenance window because
    the device's profile no longer defines it), so sending it again cannot act twice. REJECTED:
    the device received it and answered that it did not do it. UNKNOWN: it may have reached the device and
    acted (sent and never answered, or answered and the answer lost), so sending it again may act
    twice. Commands that finished before this field existed are UNKNOWN unless their status alone
    decides it. Branch on this, not on error text.
    """
    # The stored outcome class. It is written by the terminating write, not derived from
    # status and error, because FAILED spans three different facts (never delivered, the
    # device said no, outcome unknown) and only the writer knows which one it is recording.
    # Retrying a batch's unsuccessful targets keys on this.
    outcome: String
    """
    When the platform first had evidence that the device had the command, as an RFC 3339
    timestamp; null when it has none. This is evidence beside the status, not a status: a
    command can be SUCCESSFUL with no delivery time (a channel with no acknowledgement and no
    answer to count) and a command that failed as NOT_DELIVERED never has one.
    """
    deliveredTime: String
    """
    What the delivery time rests on: DEVICE_ACK (the device acknowledged receipt on the HTTP
    pull channel) or DEVICE_RESPONSE (the device answered the command, on any channel). Null
    when deliveredTime is. The first piece of evidence is kept.
    """
    deliveryEvidence: String
    """
    ONEWAY for a command the device acknowledges and does not answer (the acknowledgement
    settles it as SUCCESSFUL), null for an ordinary two-way command.
    """
    deliveryMode: String
    """
    The most times the HTTP pull channel hands this command out before giving up on its
    acknowledgement; null for the platform default of 3.
    """
    maxAttempts: Int
    """
    How many times the HTTP pull channel has handed this command out; null for a command it
    never handed out.
    """
    deliveryAttempts: Int
}

"""Fields for issuing a command to one device."""
# Data required to issue a command.
input CommandCreateRequest {
    """
    Idempotency key for the command, unique within the tenant. Re-sending a token you already
    used returns the original command instead of creating a second one.
    """
    token: String!
    """Token of the device to command."""
    deviceToken: String!
    """
    Name of the command, which must exist in the command vocabulary of the device's profile;
    otherwise the request is refused with COMMAND_NOT_IN_VOCABULARY. At most 128 bytes, or the
    request is refused with COMMAND_NAME_TOO_LONG.
    """
    name: String!
    """
    The command's arguments as a JSON document serialized to a string. Must be valid JSON and,
    when the command definition declares a schema, conform to it. At most 65536 bytes
    (PAYLOAD_TOO_LARGE). Optional.
    """
    payload: String
    """
    RFC 3339 timestamp after which the command expires if undelivered. Optional; when omitted
    the platform's default time-to-live applies.
    """
    expiresAt: String
    """
    Free-form metadata as a JSON document serialized to a string. Must be valid JSON. At most
    65536 bytes (METADATA_TOO_LARGE). Optional.
    """
    metadata: String
    """
    ONEWAY for a command the device acknowledges and does not answer. Accepted only for a device
    whose type has the HTTP_PULL command channel; otherwise the request is refused with
    DELIVERY_OPTION_NOT_APPLICABLE (or DELIVERY_OPTION_INVALID for any other value). Optional.
    """
    deliveryMode: String
    """
    The most times the HTTP pull channel hands the command out before giving up on its
    acknowledgement, 1 to 10. Accepted only for a device on the HTTP_PULL channel, like
    deliveryMode. Optional; the platform default is 3.
    """
    maxAttempts: Int
}

"""
Why an enqueue was refused. A refusal is a decided answer about the request, not a failure of
the platform.
"""
# Why an enqueue was REFUSED — a decided verdict, not a failure.
#
# It is a payload rather than a GraphQL error because the two mean opposite things to
# a caller: a rejection says the request is wrong and describes exactly how, while a
# GraphQL error says the platform could not answer. A machine caller that cannot tell
# them apart retries a permanently-invalid command until its redelivery cap gives up,
# which is indistinguishable from an outage.
type CommandEnqueueRejection {
    """
    Stable, machine-readable classification: PAYLOAD_NOT_JSON, METADATA_NOT_JSON,
    COMMAND_NAME_TOO_LONG, PAYLOAD_TOO_LARGE, METADATA_TOO_LARGE, EXPIRES_AT_INVALID,
    HELD_CEILING_EXCEEDED, TOKEN_IN_USE, DEVICE_NOT_FOUND, DEVICE_DISABLED,
    COMMAND_NOT_IN_VOCABULARY, PAYLOAD_SCHEMA_VIOLATION, DELIVERY_OPTION_INVALID,
    DELIVERY_OPTION_NOT_APPLICABLE, or COMMAND_REJECTED when a refusal
    arrived without a classification.

    Branch on this, never on reason. The list is open: treat an unrecognized code as a refusal
    you cannot classify, never as success. HELD_CEILING_EXCEEDED is the only temporary one (the
    tenant is holding its limit of commands for absent devices and the limit frees as they
    return); the rest will be refused again if re-sent unchanged. TOKEN_IN_USE means the token
    belongs to a command you do not own, which in practice is one the platform created for a
    batch; choose another token.
    """
    # The stable, machine-readable classification. Branch on this, never on `reason`
    # — the reason is prose for a person and its wording may change.
    #
    # Produced here: PAYLOAD_NOT_JSON, METADATA_NOT_JSON, EXPIRES_AT_INVALID,
    # HELD_CEILING_EXCEEDED, TOKEN_IN_USE. Relayed from the enqueue gate that owns the
    # device and its command vocabulary: DEVICE_NOT_FOUND, DEVICE_DISABLED,
    # COMMAND_NOT_IN_VOCABULARY, PAYLOAD_SCHEMA_VIOLATION. COMMAND_REJECTED means a rejection arrived carrying no
    # classification. The list is open — treat an unrecognized code as a rejection you
    # cannot classify, never as a success.
    #
    # TOKEN_IN_USE is the rare one, and it does NOT mean "you sent this twice". A repeat
    # of a token you already own is an idempotent replay and returns the ORIGINAL command
    # in `command`. This code fires only when the row holding the token is one you do not
    # own — in practice one the platform minted for a batch. Returning it would hand you
    # another device's actuation as though it were yours, so the enqueue is refused
    # instead. Permanent for that token; pick another.
    #
    # HELD_CEILING_EXCEEDED is the only TEMPORARY one: the tenant is holding its limit
    # of commands for absent devices, and the limit frees as those devices return. The
    # rest describe a request that will be just as wrong on the next attempt.
    code: String!
    """
    Human-readable explanation, safe to show to a user. Its wording may change; do not parse it.
    """
    # Why it was refused, in client-safe terms: it names only the device token, the
    # command key and the offending parameter — never a service, host or internal id.
    reason: String!
}

"""The outcome of createCommand. Exactly one of command and rejection is non-null."""
# The outcome of an enqueue attempt. EXACTLY ONE of the two fields is non-null:
# `command` for a command that was created (or the ORIGINAL one returned by an
# idempotent replay of a token already in use), `rejection` for a request that was
# refused. A GraphQL error instead of either means the enqueue could not be decided.
type CreateCommandResult {
    """
    The command that was created, or the original command when the token was already in use by
    one of your own commands. Null when the request was refused.
    """
    command: Command
    """Why the request was refused. Null when a command was created."""
    rejection: CommandEnqueueRejection
}

"""
Filters and paging for searching commands. All supplied filters must match. Results are newest
first.
"""
# Criteria used when searching for commands.
input CommandSearchCriteria {
    """Page to return, starting at 1; values below 1 are treated as 1."""
    pageNumber: Int!
    """Results per page. Values below 1 become 100; values above 1000 are capped at 1000."""
    pageSize: Int!
    """Only commands addressed to this device."""
    deviceToken: String
    """
    Only commands created by this batch. This is how to ask what a fleet write is doing now,
    since the batch record keeps only counts from the moment it fired. Combine with status or
    statuses. Rows come back in the order the batch admitted its devices.
    """
    # Narrow to the commands one batch created.
    #
    # This is how you ask what a fleet write is DOING. A CommandBatch record carries
    # `resolved` and `accepted` as they were at the moment it fired — deliberately, so
    # the record stays self-auditing — so questions about the present ("of the 5,000
    # queued, how many have gone out?") are answerable only from the command rows.
    # Combine it with `status` or `statuses`.
    #
    # Rows of one batch come back in ADMITTED order — the order you gave the devices in,
    # which is also the order a partially-admitted batch admits them in. Every row of a
    # batch shares one creation instant, so the newest-first key ties across the whole
    # batch and the token tiebreak, minted from each device's position, carries that
    # order. Page 1 is therefore the head of the batch, not an arbitrary slice of it.
    batchToken: String
    """Only commands in exactly this lifecycle state (for example HELD)."""
    # Match a single lifecycle state exactly.
    status: String
    """
    Only commands in any of these lifecycle states. Combined with status, a command must satisfy
    both. An empty list is ignored rather than matching nothing.
    """
    # Match any of several lifecycle states. ANDed with `status` if both are given;
    # an empty list is ignored rather than matching nothing. Use this when the states
    # you care about are a set — a device waking from sleep drains everything the
    # platform is still holding for it: the commands withheld because it was known to
    # be absent (HELD) and those published while it was asleep and handed back (PARKED).
    # SENT is deliberately NOT part of that set: a sent command is at the device, and
    # re-dispatching one would actuate hardware a second time.
    statuses: [String!]
    """
    Only finished commands whose outcome is one of these (SUCCEEDED, NOT_DELIVERED, REJECTED or
    UNKNOWN). Live commands have no outcome and never match. An empty list is ignored.
    """
    outcomes: [String!]
    """
    Only commands sent at or after this instant (inclusive), as an RFC 3339 timestamp. A
    command never sent (queued, held, or expired or cancelled first) is placed at the time it
    was queued instead. Omit for no lower bound. A value that is not RFC 3339 is an error.
    """
    startTime: String
    """
    Only commands sent at or before this instant (inclusive), or queued at or before it when
    never sent, as an RFC 3339 timestamp. Omit for no upper bound. A value that is not RFC 3339
    is an error.
    """
    endTime: String
}

"""One page of commands."""
# Search results returned from command query.
type CommandSearchResults {
    """The commands on this page, newest first."""
    results: [Command!]!
    """Where this page sits within all matching commands."""
    pagination: SearchResultsPagination!
}

"""One device a batch did not enqueue to, and why."""
# One device a batch did NOT enqueue to, and why.
type CommandBatchDeviceRefusal {
    """Token of the refused device, as it was named or resolved."""
    # The device this refusal is about, exactly as it was resolved or named.
    deviceToken: String!
    """
    Machine-readable classification, from the same open vocabulary as
    CommandEnqueueRejection.code (for example DEVICE_NOT_FOUND, DEVICE_DISABLED,
    COMMAND_NOT_IN_VOCABULARY, PAYLOAD_SCHEMA_VIOLATION or HELD_CEILING_EXCEEDED). Branch on
    this, not on reason.
    """
    # The machine-readable classification. It is the SAME open vocabulary a single
    # enqueue rejection uses — DEVICE_NOT_FOUND, COMMAND_NOT_IN_VOCABULARY,
    # PAYLOAD_SCHEMA_VIOLATION relayed from the device's owner, HELD_CEILING_EXCEEDED
    # produced here. Branch on this, never on `reason`.
    code: String!
    """Human-readable explanation, safe to show to a user. Do not parse it."""
    # Why this device was refused, in client-safe terms.
    reason: String!
}

"""
The exact number of devices refused for one code. Unlike the refusals sample, a count is never
truncated.
"""
# The COMPLETE number of devices refused for one code — never truncated.
#
# It is the counterweight to the bounded `refusals` sample: a batch fired at a large
# group can refuse more devices than anyone can read, so the individual names are
# capped while these totals stay exact. `resolved` = `accepted` + the sum of these.
type CommandBatchRefusalCount {
    """The refusal code being counted."""
    code: String!
    """How many devices were refused with that code."""
    count: Int!
}

"""
One command fanned out to many devices, kept as a record. A device the batch refused gets no
command row, so this record is the only trace of what was attempted and what was refused.
"""
# One command fanned out to many devices, as a persisted record.
#
# It exists because the mutation response is consumed once. A refused device is given no
# command row — there is no state meaning "wanted but not created" — so without this
# record a refusal would leave no trace, and an operator who fires a fleet push and comes
# back in the morning would have nothing to read.
type CommandBatch implements Model & TokenReference & MetadataEntity {
    """
    Server-assigned numeric identifier, serialized as a string. Look entities up by token where
    one exists.
    """
    id: ID!
    """When the record was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the record was last modified, as an RFC 3339 timestamp."""
    updatedAt: String
    """
    When the record was deleted, as an RFC 3339 timestamp. Deleted records are not returned by
    this API, so this is null in practice.
    """
    deletedAt: String
    """Tenant-unique token; the idempotency key supplied when the batch was created."""
    token: String!
    """
    Free-form metadata supplied when the batch was created, as a JSON document serialized to a
    string; null when none was supplied.
    """
    metadata: String
    """The command name every device in the batch received."""
    # The command key every member of the batch received, and its payload. One key and
    # one payload for the whole batch is what makes validating a fleet affordable.
    name: String!
    """
    The payload every device in the batch received, as a JSON document serialized to a string;
    null when none was supplied.
    """
    payload: String
    """
    How the target was specified: DEVICE_LIST (devices named explicitly) or GROUP (an entity
    group resolved when the batch fired).
    """
    # How the target was named: DEVICE_LIST or GROUP.
    targetKind: String!
    """Token of the entity group the batch was fired at; null for a device-list batch."""
    # The entity group this was fired at; null for a device-list batch.
    groupToken: String
    """
    The frozen version of the group that the target set was resolved against. Null for a
    device-list batch and for a static group, which is not versioned.
    """
    # The FROZEN group version the target set was resolved against; null for a
    # device-list batch or a static group, which is never versioned. It is what lets an
    # audit answer what the group MEANT when this fired, after someone edits the selector.
    groupVersion: Int
    """
    Whether the caller accepted a partial fan-out, in which devices that could not be enqueued
    were skipped rather than failing the whole batch.
    """
    # Whether the caller accepted a partial fan-out.
    allowPartial: Boolean!
    """
    How many devices the target resolved to when the batch fired. A stored fact about that
    moment, not a live count.
    """
    # How many devices the target resolved to, and how many were actually enqueued to.
    #
    # 🔴 BOTH ARE STORED FACTS ABOUT THE MOMENT THE BATCH FIRED, NOT LIVE COUNTS. Command
    # rows are not immortal (they can be soft-deleted, or erased with a tenant), so
    # deriving `accepted` from a live query would let it drift below the creation-time
    # truth with no refusal explaining the gap. For present-tense delivery state, search
    # commands with `batchToken`.
    resolved: Int!
    """
    How many devices a command was enqueued for when the batch fired. A stored fact about that
    moment, not a live count; to see what those commands are doing now, search commands by
    batchToken. resolved equals accepted plus the sum of refusalCounts.
    """
    accepted: Int!
    """
    How many of the accepted commands were held for their device type's maintenance window when
    the batch fired. A stored fact about that moment, not a live count; null for a batch from
    before maintenance windows existed. To see which have gone out since, search commands by
    batchToken.
    """
    waiting: Int
    """
    A bounded sample of the devices that were refused (at most 100 per refusal code). Use
    refusalCounts for exact totals.
    """
    # A BOUNDED sample of the devices that were refused — enough to act on, capped so one
    # fleet write cannot store an unbounded blob. Use `refusalCounts` for exact totals.
    refusals: [CommandBatchDeviceRefusal!]!
    """The exact number of refused devices per refusal code."""
    # The complete per-code totals for every device refused.
    refusalCounts: [CommandBatchRefusalCount!]!
    """
    When the batch was first cancelled, as an RFC 3339 timestamp; null until it is cancelled.
    Cancelling again does not change it.
    """
    # When someone called this batch off, and how many commands that call caught.
    # Both null until a batch is cancelled.
    #
    # 🔑 `cancelledCount` IS WHAT THAT CALL CAUGHT, NOT A LIVE COUNT OF CANCELLED
    # COMMANDS, and the two drift apart legitimately. A command already handed to its
    # device when the cancel ran is reported as `alreadySent` and left alone — but if its
    # delivery then fails, it is retired as cancelled rather than retried, because the
    # batch it belongs to has been called off. That happens after this number is written.
    #
    # The stamp is FIRST-WINS: cancelling an already-cancelled batch reports what it
    # finds and leaves these two alone, so they keep describing the intervention that
    # actually stopped something.
    cancelledAt: String
    """
    How many commands the first cancel call stopped; null until the batch is cancelled. A
    snapshot from that call, not a live count of CANCELLED commands.
    """
    cancelledCount: Int
    """
    Token of the batch this one retries, when it was created by retryCommandBatch; null for an
    ordinary batch. A retry of a retry names the retry, not the first batch.
    """
    retryOf: String
    """
    Tokens of the batches that retried this one, oldest first, at most 100. Empty when none did.
    """
    retries: [String!]!
}

"""
Fields for issuing one command to many devices. Supply exactly one of deviceTokens and
groupToken; both or neither is refused with BATCH_TARGET_AMBIGUOUS.
"""
# Data required to issue a command to many devices at once.
#
# `deviceTokens` and `groupToken` are ALTERNATIVES: supply exactly one. Both or neither is
# refused rather than resolved by a precedence rule — a caller that sent both does not know
# what it asked for, and silently preferring one would fan a physical actuation across
# whichever set this service happened to favour.
input CommandBatchCreateRequest {
    """
    Idempotency key for the whole batch, unique within the tenant. Re-sending a token that
    already names a batch returns that batch unchanged and admits no further devices.
    """
    # The idempotency key for the whole operation. Re-issuing a token that already names a
    # batch returns THAT batch unchanged; it is never topped up, because admitting more
    # devices under the same token would make `accepted` a moving number.
    token: String!
    """
    Name of the command every targeted device receives, as defined in each device's command
    vocabulary. At most 128 bytes, or the request is refused with COMMAND_NAME_TOO_LONG.
    """
    # The command key every targeted device receives, and the payload it carries.
    name: String!
    """
    The payload every device receives, as a JSON document serialized to a string. Must be valid
    JSON. At most 65536 bytes (PAYLOAD_TOO_LARGE). Optional.
    """
    payload: String
    """
    RFC 3339 timestamp after which the batch's undelivered commands expire. Optional; when
    omitted the platform's default time-to-live applies.
    """
    expiresAt: String
    """
    Free-form metadata as a JSON document serialized to a string. Must be valid JSON. At most
    65536 bytes (METADATA_TOO_LARGE). Optional.
    """
    metadata: String
    """
    Tokens of the devices to command, at most 10000. The order is the order devices are admitted
    in when the batch is partially admitted. An empty list counts as not supplied.
    """
    # Name the devices explicitly. Order is meaningful: a partially-admitted batch admits
    # in this order, so it can express priority.
    deviceTokens: [String!]
    """
    Token of an entity group of devices, resolved to its members when the batch fires. A dynamic
    group must have been published. A group that resolves to more than 10000 devices is refused
    with BATCH_TOO_LARGE. Requires device:read in addition to command:write.
    """
    # Or name an entity group, resolved to its devices when the batch fires. The group
    # must collect DEVICES, and a dynamic group must have been published — its draft
    # selector is mutable, and a fleet actuation must not follow whatever someone last
    # typed.
    groupToken: String
    """
    A specific frozen version of a dynamic group to resolve against. Omit for the group's active
    published version. Naming a version without a group, or for a static group, is refused.
    """
    # Pin a specific frozen version of a dynamic group. Omit for the active published
    # version. Naming one for a static group is refused rather than ignored.
    groupVersion: Int
    """
    Required. When true, devices that cannot receive the command are skipped and recorded as
    refusals. When false, a batch in which any device cannot receive the command is refused
    whole (BATCH_PARTIAL_REFUSED) and nothing is created.
    """
    # Accept a partial fan-out. When false, a batch in which ANY device cannot receive the
    # command is refused whole and NOTHING is created — including the batch record, since
    # nothing happened to record.
    #
    # It is REQUIRED rather than defaulting to false, which is deliberate for a field that
    # decides whether a physical actuation may reach some of a fleet but not all of it: a
    # caller states its intent, instead of inheriting one from a schema it may not have
    # read.
    allowPartial: Boolean!
}

"""
Fields for re-issuing a batch's command to a chosen subset of its devices. The command name and
payload are copied from the original batch; they cannot be changed here.
"""
# A retry is the same operation to a subset of the same devices, so the command is not part of
# the request at all: the server reads name and payload from the original.
input CommandBatchRetryRequest {
    """
    Idempotency key for the retry, unique within the tenant and different from the original
    batch's. Re-sending it returns the retry unchanged and admits nothing further. Re-sending the
    ORIGINAL batch's token through createCommandBatch still returns the original and executes
    nothing.
    """
    token: String!
    """Token of the batch to retry. It may itself be a retry."""
    of: String!
    """
    Tokens of the devices to retry, at most 10000. Each must be a member of the original batch
    and unsuccessful (see includeUnknown). The order is the order devices are admitted in when the
    retry is partially admitted.
    """
    deviceTokens: [String!]!
    """
    Whether to also retry devices whose outcome is UNKNOWN: commands that may already have reached
    the device and acted. Devices with that outcome are refused with RETRY_UNKNOWN_NOT_ACKNOWLEDGED
    unless this is true. Only set it after confirming that acting twice is harmless.
    """
    includeUnknown: Boolean!
    """
    Required. As for createCommandBatch: when true, devices that cannot receive the command now
    are skipped and recorded as refusals; when false, any such device refuses the whole retry.
    """
    allowPartial: Boolean!
    """
    RFC 3339 timestamp after which the retry's undelivered commands expire. Optional; when omitted
    the platform's default time-to-live applies.
    """
    expiresAt: String
    """Free-form metadata for the retry batch, as a JSON document serialized to a string. Optional."""
    metadata: String
}

"""
Why a batch was refused. A refusal is a decided answer about the request, not a failure of the
platform.
"""
# Why a batch was REFUSED — a decided verdict, not a failure.
type CommandBatchRejection {
    """
    Stable, machine-readable classification: BATCH_TARGET_AMBIGUOUS, BATCH_TOO_LARGE,
    BATCH_GROUP_UNUSABLE (the group does not exist, collects something other than devices, was
    never published, or the named version does not exist or was named for a static group),
    PAYLOAD_NOT_JSON, METADATA_NOT_JSON, COMMAND_NAME_TOO_LONG, PAYLOAD_TOO_LARGE,
    METADATA_TOO_LARGE, EXPIRES_AT_INVALID, BATCH_PARTIAL_REFUSED or HELD_CEILING_EXCEEDED.

    Branch on this, never on reason. The list is open: treat an unrecognized code as a refusal
    you cannot classify. HELD_CEILING_EXCEEDED is temporary; the others will be refused again if
    re-sent unchanged. There is no TOKEN_IN_USE here: re-sending a batch token returns the
    original batch.
    """
    # The stable, machine-readable classification. Branch on this, never on `reason`.
    #
    # BATCH_TARGET_AMBIGUOUS (both or neither target given, or a version with no group),
    # BATCH_TOO_LARGE, BATCH_GROUP_UNUSABLE (the group does not exist, collects something
    # other than devices, or was never published — the owner's own code travels in the
    # reason), PAYLOAD_NOT_JSON, METADATA_NOT_JSON, EXPIRES_AT_INVALID,
    # BATCH_PARTIAL_REFUSED, and HELD_CEILING_EXCEEDED.
    #
    # Note there is no TOKEN_IN_USE here, unlike createCommand. A batch token that is
    # already in use is not a conflict — it is an idempotent replay, and it returns the
    # ORIGINAL batch as `batch`.
    #
    # The last two are the ones to expect in practice: BATCH_PARTIAL_REFUSED is the
    # ordinary answer for a heterogeneous fleet when `allowPartial` is off, and
    # HELD_CEILING_EXCEEDED is temporary — the tenant is full now and drains as its
    # devices come back. The rest describe a request that will be just as wrong next time.
    # The list is open; treat an unrecognized code as a refusal you cannot classify.
    code: String!
    """Human-readable explanation, safe to show to a user. Do not parse it."""
    # Why the batch was refused, in client-safe terms.
    reason: String!
    """
    How many devices the target resolved to before the refusal. Null means no target set was
    established (the refusal came first); zero means the target genuinely resolved to no
    devices.
    """
    # How many devices the target resolved to before the refusal.
    #
    # NULL IS NOT ZERO. Null means no target set was ever established — the refusal
    # happened first. Zero would mean a target that genuinely resolved to no devices,
    # which is a real (and successful) batch, not a refusal.
    resolved: Int
    """
    A bounded sample (at most 100) of the devices responsible. Populated only for
    BATCH_PARTIAL_REFUSED and empty for every other code.
    """
    # A bounded sample of the devices responsible. It is populated for exactly ONE code —
    # BATCH_PARTIAL_REFUSED — and empty for every other, including HELD_CEILING_EXCEEDED.
    #
    # That asymmetry is not an oversight. A partial refusal is caused BY specific devices
    # (this one is not in the vocabulary, that one does not exist), so naming them is what
    # makes the default whole-batch refusal actionable — otherwise an operator would bisect
    # a fleet by hand to find the offender. A ceiling refusal is caused by the tenant's
    # backlog, not by any device in the request: no device is at fault, nothing about the
    # batch would change if you swapped its members, and a list here would invite fixing
    # devices that are fine. What to do about it is in `reason`.
    #
    # (Per-device HELD_CEILING_EXCEEDED entries DO exist — on the RECORD of a batch that
    # was allowed to fan out partially, where they say which devices did not fit. That is
    # a different object answering a different question.)
    refusals: [CommandBatchDeviceRefusal!]!
    """The exact per-code totals behind the refusals sample."""
    # The complete per-code totals behind that sample.
    refusalCounts: [CommandBatchRefusalCount!]!
}

"""The outcome of createCommandBatch. Exactly one of batch and rejection is non-null."""
# The outcome of a batch attempt. EXACTLY ONE of the two fields is non-null: `batch` for
# one that was created (or the ORIGINAL returned by an idempotent replay), `rejection` for
# one that was refused. A GraphQL error instead of either means the batch could not be
# decided at all — device-management unreachable, group resolution unavailable — and
# NOTHING was created, so the token is unspent and the request can simply be retried.
type CreateCommandBatchResult {
    """
    The batch that was created, or the original batch when the token was already in use. Null
    when the request was refused.
    """
    batch: CommandBatch
    """Why the batch was refused. Null when a batch was created."""
    rejection: CommandBatchRejection
}

"""
What cancelling a batch was able to do. The four counts are not guaranteed to sum to matched; if
matched exceeds their sum, some commands returned to the delivery queue after the cancel, and
calling cancelCommandBatch again stops them.
"""
# What cancelling a fleet write was able to do.
#
# 🔴 `cancelled` IS MEASURED; THE OTHER THREE ARE OBSERVED A MOMENT LATER. `cancelled` is
# how many commands the platform actually moved. The rest come from counting the batch's
# commands immediately afterwards, in a table other writers are still using.
#
# 🔴 THE FOUR NEED NOT SUM, AND THE GAP MEANS SOMETHING. A command can return to the
# delivery queue between the cancel and the count — its dispatcher tried to send it and
# failed — and such a command is in none of the three buckets, because it is neither
# stopped, nor sent, nor finished. It is left out rather than folded into
# `alreadyFinished`, which would report a live command as a finished one.
#
# So if `matched` exceeds the sum, some commands are back in the delivery queue and this
# cancel did not stop them. **Cancel again** — that is the fix, and it is the only one;
# nothing retries on your behalf. It cannot keep happening: once a cancel is recorded, a
# failed delivery retires its command rather than requeueing it, so the second call finds
# a settled batch.
type CancelCommandBatchResult {
    """Commands the platform still held and has now stopped. They will not be delivered."""
    # Commands the platform still held and has now stopped. They will not be delivered.
    cancelled: Int!
    """
    Commands already handed to their devices. They cannot be recalled and the devices will still
    act on them.
    """
    # Commands already handed to their devices. 🔴 THOSE DEVICES WILL STILL ACT ON THEM.
    # A command in flight cannot be recalled, and reporting it as cancelled would say the
    # fleet was stopped when part of it was not.
    alreadySent: Int!
    """
    Commands that had already succeeded, failed, timed out, expired or been cancelled before
    this call. Nothing to do.
    """
    # Commands that had already succeeded, failed, timed out, expired or been cancelled
    # before this call. Nothing to do.
    alreadyFinished: Int!
    """
    How many of the batch's commands exist right now. May be lower than the batch's accepted
    count, because commands can be deleted.
    """
    # How many of the batch's commands exist right now.
    #
    # It is NOT the batch's `accepted`, which is a stored fact about the moment the batch
    # fired. Commands can be deleted, so `matched` below `accepted` is ordinary and says
    # nothing about the cancel.
    matched: Int!
}

"""
Filters and paging for searching command batches. All supplied filters must match. Results are
newest first.
"""
# Criteria used when searching for command batches.
input CommandBatchSearchCriteria {
    """Page to return, starting at 1; values below 1 are treated as 1."""
    pageNumber: Int!
    """Results per page. Values below 1 become 100; values above 1000 are capped at 1000."""
    pageSize: Int!
    """Only batches that fanned out this command name."""
    # The command key the batch fanned out.
    name: String
    """Only batches fired at this entity group. Device-list batches never match."""
    # The entity group it was fired at. Matches nothing for device-list batches.
    groupToken: String
    """
    Only batches of this kind: DEVICE_LIST or GROUP. An unrecognized value matches nothing
    rather than raising an error.
    """
    # DEVICE_LIST or GROUP. An unrecognized value matches nothing rather than erroring.
    targetKind: String
}

"""One page of command batches."""
# Search results returned from command batch query.
type CommandBatchSearchResults {
    """The batches on this page, newest first."""
    results: [CommandBatch!]!
    """Where this page sits within all matching batches."""
    pagination: SearchResultsPagination!
}

"""
What the platform is holding for one device because it is disabled.
"""
# A disabled device is cut off from the platform, and commands already queued for it are neither
# sent nor cancelled: they are held until the device is enabled again (then they go out, oldest
# first) or until their own expiry lapses them. This is the operator's view of that hold.
type DeviceCommandHold {
    """True while the platform has the device recorded as disabled."""
    disabled: Boolean!
    """
    How many commands are held on the device's account: every command it still has that has not
    been sent (queued, held or parked). Zero for an enabled device, whatever its backlog, because
    nothing is held on its account then. This is exactly the set `cancelDeviceCommands` cancels.
    """
    heldCount: Int!
}

"""What `cancelDeviceCommands` did."""
type CancelDeviceCommandsResult {
    """Commands the platform still held for the device and has now cancelled."""
    cancelled: Int!
}

"""
A scheduled, tracked fan-out of command steps to the devices of an entity group. It is a
definition: each time its trigger fires it plans a cycle, and a cycle holds one element per
device per step, so which devices did not receive a command, and why, is a query. A campaign is
not edited in place: to change one, delete it and create it again. The new campaign sends
nothing that fell due before it was created.
"""
type Campaign {
    """Server-assigned numeric identifier, as a string."""
    id: ID!
    """When the campaign was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the campaign was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Identifier of the campaign, unique within the tenant."""
    token: String!
    """Human-readable name; null when none is set."""
    name: String
    """
    False when the campaign is switched off: it plans and sends nothing. Switched back on, it
    does not send what fell due while it was off.
    """
    enabled: Boolean!
    """
    The trigger as a JSON document: kind (CRON, CALENDAR or SOLAR), zone, and the fields of
    that kind (cron; dates and times; event and offsetMinutes), plus optional holidays.
    """
    trigger: String!
    """The command steps, in order."""
    steps: [CampaignStep!]!
    """Kind of target. Always GROUP in this release."""
    targetKind: String!
    """Token of the entity group whose devices the campaign targets."""
    groupToken: String!
    """How late, in seconds, a planned command may still be sent. Later ones are skipped as MISSED."""
    maxLatenessSeconds: Int!
    """Time-to-live, in seconds, of each command the campaign creates."""
    expiresInSeconds: Int!
    """The instant up to which cycles have been planned; null before the first plan."""
    plannedThrough: String
    """Why the last planning attempt failed; null when it succeeded."""
    lastError: String
}

"""One step of a campaign."""
type CampaignStep {
    """COMMAND."""
    type: String!
    """The command name."""
    name: String
    """The command payload as a JSON document; null when none."""
    payload: String
    """Seconds after the trigger at which the step fires, per device."""
    delaySeconds: Int!
}

"""One step of a new campaign."""
input CampaignStepInput {
    """COMMAND. ARTIFACT is recognised and refused with CAMPAIGN_STEP_UNSUPPORTED."""
    type: String!
    """The command name. Required for a COMMAND step."""
    name: String
    """The command payload as a JSON document. Optional."""
    payload: String
    """Seconds after the trigger at which the step fires, 0 to 86400. Optional; default 0."""
    delaySeconds: Int
}

"""Fields for creating a campaign."""
input CampaignCreateRequest {
    """Identifier for the campaign, unique within the tenant."""
    token: String!
    """Human-readable name, at most 128 characters. Optional."""
    name: String
    """
    The trigger, as a JSON document. kind CRON: {"kind":"CRON","zone":"Europe/Berlin","cron":"30 18 * * *"}.
    kind CALENDAR: dates (YYYY-MM-DD) and times (HH:MM) in the zone. kind SOLAR: event SUNRISE or
    SUNSET and offsetMinutes, computed per device from its installed position (Device.installedPosition). Every kind
    requires an IANA zone and may carry holidays (YYYY-MM-DD local dates on which it does not fire).
    """
    trigger: String!
    """The steps, one to ten."""
    steps: [CampaignStepInput!]!
    """Token of the entity group to target, at most 128 characters."""
    groupToken: String!
    """GROUP, or omitted."""
    targetKind: String
    """How late a planned command may still be sent, 1 to 86400. Optional; default 900."""
    maxLatenessSeconds: Int
    """Time-to-live of each command, 1 to 604800. Optional; default 3600."""
    expiresInSeconds: Int
    """Whether the campaign starts switched on. Optional; default true."""
    enabled: Boolean
}

"""The outcome of createCampaign. Exactly one of campaign and rejection is non-null."""
type CreateCampaignResult {
    """The created campaign."""
    campaign: Campaign
    """Why the campaign was refused: CAMPAIGN_TRIGGER_INVALID, CAMPAIGN_STEPS_INVALID, CAMPAIGN_STEP_UNSUPPORTED, CAMPAIGN_TARGET_INVALID, CAMPAIGN_FIELD_INVALID, PAYLOAD_NOT_JSON, PAYLOAD_TOO_LARGE, COMMAND_NAME_TOO_LONG or TOKEN_IN_USE."""
    rejection: CommandBatchRejection
}

"""One firing of a campaign."""
type CampaignCycle {
    """Stable key of the firing; pass it as cycleKey."""
    key: String!
    """When the cycle was planned, as an RFC 3339 timestamp."""
    createdAt: String
    """The local civil date (YYYY-MM-DD) of a SOLAR cycle; null otherwise."""
    day: String
    """The fire instant of a CRON or CALENDAR cycle; null for SOLAR, whose instant is per device."""
    at: String
    """How many devices the group held when the cycle was planned."""
    resolved: Int!
    """Where the cycle's elements and their commands stand now."""
    counts: CampaignCycleCounts!
}

"""
Where a cycle stands. The first five count elements by campaign state; the rest count the
commands behind the dispatched elements, by what the latest command for each did.
"""
type CampaignCycleCounts {
    """Planned and not yet due."""
    pending: Int!
    """Due and being sent."""
    claimed: Int!
    """Sent: a command was created."""
    dispatched: Int!
    """Not admitted by the command batch (vocabulary, ceiling, maintenance window...)."""
    refused: Int!
    """
    Never commanded: NO_SITE, POLAR_DAY, POLAR_NIGHT, MISSED, CANCELLED, PREDATES_CAMPAIGN,
    DISABLED, SUPERSEDED or NOT_IN_GROUP.
    """
    skipped: Int!
    """Commands that succeeded."""
    succeeded: Int!
    """Commands not yet finished."""
    inFlight: Int!
    """Of the in-flight commands, how many are held for a maintenance window."""
    waiting: Int!
    """Commands that finished without success and are safe to send again."""
    failed: Int!
    """Commands that finished with an outcome that cannot be vouched for; a retry needs includeUnknown."""
    unknown: Int!
}

"""One device's step in one cycle."""
type CampaignElement {
    """Server-assigned numeric identifier; pass the last one on a page as afterId."""
    id: ID!
    """Token of the device."""
    deviceToken: String!
    """Zero-based index of the step."""
    step: Int!
    """When the element falls due, as an RFC 3339 timestamp."""
    dueAt: String!
    """PENDING, CLAIMED, DISPATCHED, REFUSED or SKIPPED."""
    status: String!
    """
    Why the element is REFUSED (the batch's refusal code) or SKIPPED: NO_SITE, POLAR_DAY or
    POLAR_NIGHT (no event to fire at), MISSED (not sent within maxLatenessSeconds), CANCELLED (the
    campaign was deleted), PREDATES_CAMPAIGN (due before the campaign was created), DISABLED (due
    while the campaign was switched off), SUPERSEDED (a newer firing of the same step for the same
    device was due at the same time, and only the newest was sent) or NOT_IN_GROUP (the device had
    left the group when the cycle fell due).
    """
    reason: String
    """Token of the batch that carried the command; null before it is sent."""
    batchToken: String
    """Token of the batch a retry re-sent it in; null when it was not retried."""
    retryBatchToken: String
    """Status of the latest command for the element; null when it has none."""
    commandStatus: String
    """Outcome class of that command once finished: SUCCEEDED, NOT_DELIVERED, REJECTED or UNKNOWN."""
    commandOutcome: String
}

"""What a retry-from-failed did."""
type CampaignRetryResult {
    """Tokens of the retry batches created or replayed."""
    batches: [String!]!
    """How many elements were re-sent."""
    retried: Int!
    """How many were left alone because re-sending is unsafe: still in flight, or unknown without includeUnknown."""
    held: Int!
}

type Query {
    """
    Returns the commands with the given ids, in no particular order. Ids that match nothing are
    omitted; a non-numeric id is an error. Requires command:read.
    """
    # Find commands by unique id.
    commandsById(
        """Numeric ids of the commands, as strings. More than 1000 is refused with LIMIT_EXCEEDED."""
        ids: [String!]!
    ): [Command!]!
    """
    Returns the commands with the given tokens, in no particular order. Tokens that match
    nothing are omitted. Requires command:read.
    """
    # Find commands by unique token.
    commandsByToken(
        """Tokens of the commands. More than 1000 is refused with LIMIT_EXCEEDED."""
        tokens: [String!]!
    ): [Command!]!
    """
    Reports whether a device is disabled and how many commands are held for it (see
    DeviceCommandHold). Answers for any device token: an unknown or enabled device reports
    `disabled: false, heldCount: 0`. Requires command:read.
    """
    # The console's "N commands held while this device is disabled" banner reads this.
    deviceCommandHold(
        """Token of the device."""
        deviceToken: String!
    ): DeviceCommandHold!
    """Searches the tenant's commands, newest first, one page at a time. Requires command:read."""
    # List all commands that match the given criteria.
    commands(
        """Filters and page to return."""
        criteria: CommandSearchCriteria!
    ): CommandSearchResults!
    """
    Returns the command batches with the given ids, in no particular order. Ids that match
    nothing are omitted; a non-numeric id is an error. Requires command:read. Reading a batch
    that targeted a group additionally requires device:read.
    """
    # Find command batches by unique id.
    commandBatchesById(
        """Numeric ids of the batches, as strings. More than 1000 is refused with LIMIT_EXCEEDED."""
        ids: [String!]!
    ): [CommandBatch!]!
    """
    Returns the command batches with the given tokens, in no particular order. Tokens that match
    nothing are omitted. Requires command:read. Reading a batch that targeted a group
    additionally requires device:read.
    """
    # Find command batches by unique token.
    commandBatchesByToken(
        """Tokens of the batches. More than 1000 is refused with LIMIT_EXCEEDED."""
        tokens: [String!]!
    ): [CommandBatch!]!
    """
    Searches the tenant's command batches, newest first, one page at a time. Requires
    command:read. Reading a batch that targeted a group additionally requires device:read.
    """
    # List all command batches that match the given criteria.
    commandBatches(
        """Filters and page to return."""
        criteria: CommandBatchSearchCriteria!
    ): CommandBatchSearchResults!
    """
    Returns a device's still-waiting commands (HELD and PARKED) that have not expired, oldest
    first, for a transport delivering the backlog when the device comes back. Dispatch the list
    in the order given. Empty when nothing is waiting. Requires command:claim, a system-tier
    authority: tenant user tokens cannot call it.
    """
    # The head of one device's still-waiting command backlog, for a transport draining it
    # when the device comes back: HELD and PARKED commands that have not passed their
    # expiry horizon, OLDEST FIRST.
    #
    # Oldest-first is a delivery guarantee, not a display choice. A firmware update is a
    # sequence whose order is its meaning, and this is where that order survives an
    # outage — so the caller dispatches the list as given and does not re-sort it.
    #
    # `limit` bounds ONE drain, not the backlog: absent, null or <= 0 means 32, and
    # anything above 1000 is clamped to 1000. A device with more waiting takes the rest on
    # its next registration.
    #
    # Requires `command:claim`, which is system-tier — so this read is reachable only by a
    # service or identity token, never by a tenant user token, matching markCommandSent and
    # parkCommand. That is deliberately TIGHTER than the other command reads on this schema
    # (they take the tenant-tier `command:read`): the answer to this query is the list a
    # machine is about to actuate hardware from, and its only caller is a transport that
    # already holds `command:claim` to claim each row it drains.
    drainableCommands(
        """Token of the device whose backlog to read."""
        deviceToken: String!
        """
        Maximum commands to return. Absent, null or 0 or less means 32; values above 1000 are
        capped at 1000. A device with more waiting returns the rest on a later call.
        """
        limit: Int
    ): [Command!]!
    """Returns one campaign by token, or null. Requires command:read and device:read."""
    campaign(
        """Token of the campaign."""
        token: String!
    ): Campaign
    """Lists the tenant's campaigns, newest first. Requires command:read and device:read."""
    campaigns(
        """Maximum campaigns to return, 1 to 200. Absent or out of range means 100."""
        limit: Int
    ): [Campaign!]!
    """Lists a campaign's cycles, newest first. Requires command:read and device:read. A SOLAR campaign also requires location:installed:read (or location:read)."""
    campaignCycles(
        """Token of the campaign."""
        campaignToken: String!
        """Maximum cycles to return, 1 to 200. Absent or out of range means 50."""
        limit: Int
    ): [CampaignCycle!]!
    """Pages through a cycle's elements in id order. Requires command:read and device:read. A SOLAR campaign also requires location:installed:read (or location:read)."""
    campaignElements(
        """Token of the campaign."""
        campaignToken: String!
        """Key of the cycle."""
        cycleKey: String!
        """
        Only elements in this status: PENDING, CLAIMED, DISPATCHED, REFUSED or SKIPPED. Optional;
        any other value is refused.
        """
        status: String
        """Return elements after this id. Optional."""
        afterId: ID
        """Maximum elements to return, 1 to 1000. Absent or out of range means 200."""
        limit: Int
    ): [CampaignElement!]!
}

"""A command the HTTP pull channel handed to a device."""
type PulledCommand {
    """Token of the command; the device quotes it when it acknowledges and when it answers."""
    token: String!
    """The command's name, as defined in the command vocabulary of the device's profile."""
    name: String!
    """The command's arguments as a JSON document serialized to a string; null when none."""
    payload: String
    """ONEWAY if the device only acknowledges the command; null if it must also answer."""
    deliveryMode: String
    """How many times this command has now been handed out, counting this one."""
    attempt: Int!
    """When the command expires, as an RFC 3339 timestamp; null if it does not."""
    expiresAt: String
}

type Mutation {
    """
    Issues a command to one device. Returns the created command, or a typed rejection when the
    request is refused; a GraphQL error means the enqueue could not be decided at all.
    Re-sending a token you already used returns the original command. Requires command:write.
    """
    # Issue (persist) a new command to a device. Returns either the command or a
    # typed rejection (see CreateCommandResult); a GraphQL error means the enqueue
    # could not be decided at all.
    createCommand(
        """The command to issue."""
        request: CommandCreateRequest!
    ): CreateCommandResult!
    """
    Issues one command to many devices, named explicitly or resolved from an entity group, as a
    single recorded and cancellable operation. Returns the batch or a typed rejection; a GraphQL
    error means the batch could not be decided and nothing was created, so the token is unspent
    and the request can be retried. Requires command:write, and also device:read when targeting
    a group.
    """
    # Issue one command to MANY devices as a single, recorded operation — named
    # explicitly or resolved from an entity group.
    #
    # It replaces looping createCommand, and the difference is not convenience: the loop
    # leaves no record of what was attempted, is not serialized against other fleet
    # writes competing for the same tenant ceiling, pins no group version (so a selector
    # edit mid-loop silently changes the target), and cannot be cancelled or audited as
    # one operation. (Both paths ARE bounded by the same tenant ceiling — that is not
    # what the batch adds.)
    #
    # Requires `command:write`. A batch targeting a GROUP additionally requires
    # `device:read`, because resolving a group to its members is a read of the device
    # registry, and the answer — which devices were refused, how many there were — comes
    # back to the caller. Naming devices explicitly needs only `command:write`, since a
    # caller doing that already knows them.
    #
    # Returns either the batch or a typed rejection (see CreateCommandBatchResult).
    createCommandBatch(
        """The batch to issue."""
        request: CommandBatchCreateRequest!
    ): CreateCommandBatchResult!
    """
    Re-issues a batch's command to a chosen subset of its devices that did not succeed, as a new
    batch linked to the original. The server copies the command name and payload from the original
    and re-validates every device exactly as a fresh batch does (disabled devices, the command
    vocabulary, the held-command ceiling). Each device must be a member of the original and
    NOT_DELIVERED or REJECTED; UNKNOWN only with includeUnknown. Refused with RETRY_ORIGINAL_NOT_FOUND,
    RETRY_NO_TARGETS, RETRY_NOT_A_MEMBER, RETRY_NOT_ELIGIBLE, RETRY_UNKNOWN_NOT_ACKNOWLEDGED or
    RETRY_TOKEN_IN_USE, or with any code createCommandBatch refuses with. Requires command:write,
    and also device:read when the original targeted a group.
    """
    # Retry selected unsuccessful targets of a fleet write. Never a silent re-execution: the
    # retry has its own idempotency token, the original is untouched and linked, and a target
    # whose first attempt may have acted is retried only on explicit acknowledgement.
    retryCommandBatch(
        """The retry to issue."""
        request: CommandBatchRetryRequest!
    ): CreateCommandBatchResult!
    """
    Cancels a command the platform still holds (QUEUED, HELD or PARKED) and returns it. A
    command in any other state is returned unchanged, so check the status you get back: a SENT
    command is already at the device and cannot be recalled. An unknown token is an error.
    Requires command:write.
    """
    # Cancel a command the platform still holds, by token: QUEUED, HELD or PARKED.
    #
    # A command that has been SENT is returned UNCHANGED rather than cancelled. It is at
    # the device, so cancelling it stops no actuation — it only makes the platform stop
    # listening for the device's answer, and the fleet then acts while the record says the
    # operation was called off. Returning it unchanged rather than raising matches what
    # cancelling an already-finished command does, and describes a race a caller cannot
    # avoid: the command may have been dispatched a millisecond before the request landed.
    # Check the `status` you get back.
    cancelCommand(
        """Token of the command to cancel."""
        token: String!
    ): Command!
    """
    Cancels every command the platform still holds for one device (QUEUED, HELD or PARKED) and
    reports how many. Commands already sent cannot be recalled and are not touched. It is
    `cancelCommand` over a device, and the way to discard what a disabled device was holding.
    Requires command:write.
    """
    cancelDeviceCommands(
        """Token of the device."""
        deviceToken: String!
    ): CancelDeviceCommandsResult!
    """
    Calls off a fleet write: stops every command of the batch the platform still holds (QUEUED,
    HELD or PARKED) and reports what it did. Commands already sent cannot be recalled. An
    unknown batch token is an error. Requires command:write, and also device:read when the batch
    targeted a group.
    """
    # Call off a fleet write: every command the platform still holds for the batch is
    # stopped. Reports what it was able to do, and never refuses — a brake that declined
    # to engage because part of the fleet had already moved would leave the rest of the
    # fleet commanded.
    #
    # It stops QUEUED, HELD and PARKED commands — the three that mean the platform still
    # has it. A command that has been SENT is at the device and is reported as
    # `alreadySent` instead; cancelling it would stop no actuation and only discard the
    # answer the device sends back. `cancelCommand` draws the same line, so a loop of it
    # over a batch's commands does the same thing as this, one command at a time.
    #
    # Requires `command:write`. A batch that targeted a GROUP additionally requires
    # `device:read`, for the same reason reading one does: the answer describes a set the
    # device registry owns. The check happens BEFORE anything is cancelled.
    #
    # An unknown batch token is an error, not a result.
    cancelCommandBatch(
        """Token of the batch to cancel."""
        token: String!
    ): CancelCommandBatchResult!
    """
    For a transport that dispatches a backlog itself: claims a QUEUED, HELD or PARKED command
    for immediate delivery and moves it to SENT. Claim before dispatching. Returns the dispatch
    nonce, which must be quoted back when reporting the outcome; returns null if the command
    could not be claimed (already sent, answered or cancelled). Requires command:claim, a
    system-tier authority.
    """
    # Claim a still-dispatchable command (QUEUED, HELD or PARKED) for immediate delivery,
    # moving it to SENT. For a transport that dispatches a device's backlog itself
    # rather than waiting for the delivery sweep — an LwM2M device draining its held
    # commands over the CoAP session it just opened. Claim BEFORE dispatching: the
    # claim is what stops the sweep from publishing the same command a second time,
    # and a command is a physical actuation.
    #
    # Returns the DISPATCH NONCE this claim stamped, which the caller must quote back when
    # it reports the command's outcome — a response that names no dispatch is refused, and
    # one that names a superseded dispatch cannot settle the command that replaced it.
    # Returns null if the command was not claimable (already sent, answered or cancelled),
    # which is a benign race: there is no dispatch, so there is nothing to name and nothing
    # to deliver.
    markCommandSent(
        """Token of the command to claim."""
        token: String!
    ): String
    """
    For the HTTP pull channel: hands a device the commands it may be sent, oldest first, and
    claims each one (QUEUED, HELD or PARKED to SENT) in the same conditional update markCommandSent
    uses, so two pulls can never both be handed one. A command an earlier pull handed out and
    never saw acknowledged for 60 seconds is handed out again, until its maxAttempts are spent;
    a command whose attempts are spent is first failed as NOT_DELIVERED. Requires command:claim,
    a system-tier authority; the caller must already have authenticated the device.
    """
    pullCommands(
        """Token of the device pulling."""
        deviceToken: String!
        """At most this many commands, up to 16. Omit it for 16."""
        limit: Int
    ): [PulledCommand!]!
    """
    For the HTTP pull channel: records that the device acknowledged a command a pull handed it,
    which sets the command's deliveredTime and deliveryEvidence (DEVICE_ACK) and settles a ONEWAY
    command as SUCCESSFUL. Idempotent. Answers RECORDED (this call recorded it, or an earlier
    one did), NOT_FOUND (no such command for the device), NOT_PULLED (the command was never
    handed to a pull), or NOT_AWAITING (the command is already finished without a delivery, for
    instance failed as NOT_DELIVERED). Requires command:claim, a system-tier authority.
    """
    acknowledgeCommandDelivery(
        """Token of the command."""
        token: String!
        """Token of the device that acknowledged."""
        deviceToken: String!
    ): String!
    """
    For the HTTP pull channel: records the device's answer to a command a pull handed it,
    settling it as SUCCESSFUL or FAILED and recording delivery evidence (DEVICE_RESPONSE) if no
    acknowledgement came first. Idempotent for a command that is already finished. Answers
    RECORDED, NOT_FOUND, NOT_PULLED, or NOT_ANSWERABLE (the command is not awaiting an answer
    from this device). Requires command:claim, a system-tier authority.
    """
    respondToPulledCommand(
        """Token of the command."""
        token: String!
        """Token of the device that answered."""
        deviceToken: String!
        """True if the device carried the command out."""
        success: Boolean!
        """The device's answer payload as text. At most 65536 bytes. Optional."""
        payload: String
        """Why the device did not carry the command out. Optional."""
        error: String
    ): String!
    """
    For a transport that received a command on the live delivery stream: confirms, just before
    actuating, that the delivery is still the dispatch the platform holds. Returns a new
    dispatch nonce to quote when reporting the outcome, or null when the delivery is stale
    (re-armed, re-sent, answered, cancelled or its batch cancelled) or its maintenance window
    has closed, in which case discard it without actuating. A command refused because its
    window closed is moved back to PARKED, to be delivered in the next opening. Requires
    command:claim, a system-tier authority.
    """
    # Confirm, immediately before actuating it, that a command a transport RECEIVED on the
    # live delivery stream is still the dispatch the platform is holding. For a transport that
    # delivers over its own session: a delivery can arrive late (redelivered after a timeout,
    # or after a failover), by which time the platform may have re-armed or re-sent the
    # command, and actuating the late copy would move the hardware a second time.
    #
    # `dispatchNonce` is the value carried in the delivery envelope. Returns a NEW dispatch
    # nonce when the delivery is confirmed, and the caller must quote that new value when it
    # reports the command's outcome — the command is now on the new dispatch, and an answer
    # naming the old one is refused. Returns null when the delivery names a dispatch the
    # command is no longer on (re-armed, re-sent, answered, cancelled, or its batch called
    # off); the caller must then discard it without actuating.
    confirmCommandDispatch(
        """Token of the command."""
        token: String!
        """The dispatch nonce carried in the delivery."""
        dispatchNonce: String!
    ): String
    """
    For a transport that found the device unreachable: hands a SENT command back, moving it to
    PARKED to be delivered on the device's next wake. Returns false, a settled outcome that must
    not be retried, when the command moved on (answered, cancelled, expired or re-claimed) or
    the nonce names a superseded dispatch. Requires command:park, a system-tier authority.
    """
    # Hand back a command whose transport found the device UNREACHABLE, moving it
    # SENT -> PARKED so the record says it went nowhere. The platform decides to publish
    # from presence — is the device registered — but a queue-mode device can be registered
    # and asleep, and only the transport discovers there is no live session to deliver
    # over. A parked command is delivered on the device's next wake, can be cancelled, and
    # if its TTL lapses first it records EXPIRED rather than TIMEOUT, because nothing ever
    # reached the device to time out.
    #
    # `dispatchNonce` is the value carried in the delivery envelope this command arrived
    # in. Quoting it is what makes the hand-back apply to THAT dispatch and no other: a
    # retried request names a dispatch that has since been superseded and moves nothing,
    # rather than dragging a command the device has already run back into the queue.
    #
    # Returns false when the command moved on under the request — answered, cancelled,
    # expired, or re-claimed by a wake drain. That is a settled outcome, not a failure,
    # and must not be retried.
    parkCommand(
        """Token of the command."""
        token: String!
        """The dispatch nonce carried in the delivery this command arrived in."""
        dispatchNonce: String!
    ): Boolean!
    """
    Returns a device's HELD commands to the delivery queue (QUEUED) because the device has come
    back, and returns how many were released; zero when nothing was waiting. It queues rather
    than delivers: the delivery sweep still decides whether each command goes out. Requires
    command:wake, a system-tier authority.
    """
    # Return a device's WITHHELD commands to the delivery queue because the device has
    # come back. For a transport that owns the device's connection and therefore learns
    # of its return the instant it happens, rather than waiting for the periodic pass
    # that reconciles holds. Returns how many commands were released; zero is the
    # ordinary answer for a device with nothing waiting.
    #
    # It queues rather than delivers: the delivery sweep still decides whether each
    # command goes out, re-reading presence and re-applying every other gate. So a wake
    # changes WHEN that question is asked, never what the answer is.
    releaseHeldCommands(
        """Token of the device that came back."""
        deviceToken: String!
    ): Int!
    """
    Creates a campaign. A refused definition comes back as a rejection. Requires command:write and
    device:read.
    A SOLAR campaign also requires location:installed:read (or location:read).
    """
    createCampaign(
        """The campaign to create."""
        request: CampaignCreateRequest!
    ): CreateCampaignResult!
    """Switches a campaign on or off and returns it. Requires command:write and device:read."""
    setCampaignEnabled(
        """Token of the campaign."""
        token: String!
        """Whether the campaign should run."""
        enabled: Boolean!
    ): Campaign!
    """
    Deletes a campaign and cancels the commands it had planned but not sent. Commands already
    created are untouched, and an element whose batch was being sent is recorded from that batch,
    not as cancelled. There is no update: to change a campaign, delete it and create it again.
    Requires command:write and device:read.
    """
    deleteCampaign(
        """Token of the campaign."""
        token: String!
    ): Boolean!
    """
    Re-sends a cycle's command to the elements that did not succeed, through the batch retry, so a
    device whose command is in flight or already succeeded is never sent a second copy, and one whose
    outcome is unknown is sent one only with includeUnknown. Requires command:write and device:read.
    A SOLAR campaign also requires location:installed:read (or location:read).
    """
    retryCampaignFailed(
        """Token of the campaign."""
        campaignToken: String!
        """Key of the cycle."""
        cycleKey: String!
        """Whether to also re-send elements whose command may already have acted."""
        includeUnknown: Boolean!
    ): CampaignRetryResult!
}

schema {
    query: Query
    mutation: Mutation
}
