# SPDX-License-Identifier: Apache-2.0
#
# Validation CI for the DeviceChain monorepo.
#
# This workflow validates only -- it never publishes images or artifacts.
# Image publishing lives in a separate, tag-triggered workflow.
#
# Services are enumerated dynamically from backend/services/* (via
# hack/list-services.sh), so adding a new service needs no edits here.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: validation jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Enumerate services (image-smoke matrix) and Go modules (go matrix).
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.svc.outputs.services }}
      modules: ${{ steps.mod.outputs.modules }}
      smoke: ${{ steps.smoke.outputs.smoke }}
    steps:
      # 🔴 fetch-depth: 0 — the upgrade-rig self-test below reads the TAG HISTORY.
      # It checks that the rig would refuse to deploy the working tree's chart around
      # some other release's images, and the only honest way to ask that is against
      # real releases. On the default shallow clone it sees no tags at all and
      # (correctly) refuses to report clean, so the job fails for want of history
      # rather than for anything wrong with the tree. The clone is ~50 MB.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Proves the coverage check can fail before its green run is used as evidence.
      - name: dependabot module-coverage self-test
        run: hack/check-dependabot-modules.sh --self-test

      # A workspace module missing from Dependabot's gomod `directories` does not go
      # quietly stale — it BREAKS. Each module replaces core with the local ../../core
      # and CI resolves it with GOWORK=off, so the next bump of core leaves an
      # unlisted module's go.mod stale and it fails with `go: updates to go.mod
      # needed`. The module that fails is never the one that was bumped, which is what
      # made the original gap take four weekly PRs to read correctly. Runs here, in
      # discover, so it fails before the whole go matrix fans out.
      - name: dependabot covers every workspace module
        run: hack/check-dependabot-modules.sh

      # The release pipeline calls this guard from two places (the workflow's first job
      # and build-release-manifest.sh), and it only runs on a tag — so without this the
      # first time anyone learns it is broken is mid-release. The self-test is the part
      # that runs on every PR; the guard itself has nothing to check until there is a tag.
      - name: release-highlights guard self-test
        run: hack/check-release-highlights.sh --self-test

      # The govulncheck wrapper decides which findings are allowed to pass. Its
      # allowlist is the one place in CI where a known vulnerability is waved
      # through on purpose, so proving the checker can still fail — on an
      # unreviewed finding AND on an exception that has gone stale — matters more
      # here than anywhere else. Runs in discover, before the matrix fans out.
      - name: govulncheck wrapper self-test
        run: hack/govulncheck.sh --self-test

      # The upgrade drill needs an hour and a kind cluster, so no part of it runs
      # on a PR -- which makes its string handling exactly the code that rots
      # unwatched, correct the day it was written and next exercised while a
      # release is waiting on it. This is the part that runs every time.
      #
      # 🔴 The POSITIVE case is what this buys. The drill's operator check is
      # expected to FAIL on every real run until the operator gap is closed, so its
      # red says almost nothing on its own -- a check hard-wired to fail would look
      # identical. Proving it reports AGREEMENT when the versions agree is what
      # makes the red mean something.
      - name: upgrade-rig self-test
        run: hack/upgrade-rig.sh selftest

      - name: Discover services
        id: svc
        run: |
          services="$(hack/list-services.sh)"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services: $services"

      - name: Discover Go modules
        id: mod
        run: |
          # Full set of Go module dirs = non-service modules + discovered services.
          # Derived by finding every dir that holds a go.mod under the known roots.
          modules="$(
            for d in backend/cli backend/core backend/k8s backend/edge/*/ backend/services/*/ backend/sims/*/ backend/tools/*/; do
              [ -f "${d%/}/go.mod" ] && echo "${d%/}"
            done | jq -R . | jq -s -c .
          )"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Modules: $modules"

      - name: Build image-smoke module list
        id: smoke
        run: |
          # ko-buildable image modules = each discovered service (mapped to its
          # backend/services/<name> dir) PLUS the operator at backend/k8s PLUS the Tier-1
          # edge agent at backend/edge/dc-edge-agent (a standalone image, not a service —
          # list-services.sh globs backend/services/* only, so it is added explicitly).
          # Keep this list in step with release.yml's guard job (they are two textual
          # copies of the same set).
          smoke="$(
            { hack/list-services.sh | jq -r '.[] | "backend/services/" + .'
              echo "backend/k8s"
              echo "backend/edge/dc-edge-agent"
            } | jq -R . | jq -s -c .
          )"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Smoke modules: $smoke"

  # ---------------------------------------------------------------------------
  # Per-module Go validation: fmt, build, vet, test.
  # go.work makes the module the working directory for each matrix entry.
  # ---------------------------------------------------------------------------
  go:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          # Per-module cache key, NOT the shared "**/go.sum". Every matrix entry
          # hashing all go.sum files computed the SAME key, and a GitHub cache key is
          # write-once — so the first job to finish its post-step saved the cache and
          # every other entry skipped saving. The slowest module (outbound-connectors,
          # whose Bento tree is ~1,240 extra packages) is the LEAST likely to win that
          # race, so its build cache was almost never persisted and it recompiled Bento
          # cold on nearly every run. A per-module key gives each entry its own cache to
          # restore from.
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          # gofmt -l prints files that need formatting; any output is a failure.
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # The workspace sum must already contain every hash this module's build
      # needs. It is checked HERE, right after the build, because the build is
      # what reveals the gap: a `go` command in workspace mode silently APPENDS
      # missing hashes to go.work.sum rather than failing, so an incomplete file
      # looks fine everywhere until something refuses to run on a dirty tree.
      #
      # 🔴 THAT SOMETHING IS THE RELEASE. goreleaser aborts with "git is in a
      # dirty state" before it publishes anything, and the release job builds a
      # verification binary before it gets there — so an incomplete go.work.sum
      # is invisible on every PR and then kills the release. It did exactly that
      # on v0.12.1-rc.1, after a Dependabot bump regenerated the per-module
      # go.sum files it can reach and left the workspace sum, which it cannot,
      # nine hashes short.
      #
      # Per module rather than once, deliberately: each module needs its own
      # subset of hashes, and this way the failure names the module that wants
      # the missing one. Fix by running `go build ./...` in the named module and
      # committing the resulting go.work.sum.
      - name: workspace sum is complete
        run: |
          if ! git diff --quiet -- go.work.sum; then
            echo "::error::Building ${{ matrix.module }} appended hashes to go.work.sum, so the committed file is incomplete. Run 'go build ./...' in that module and commit go.work.sum."
            git --no-pager diff -- go.work.sum
            exit 1
          fi
          echo "go.work.sum already covers $(basename ${{ matrix.module }})"

      # Build-tagged tests are invisible to every step above: `go build`, `go vet` and
      # `go test` all skip a file whose tags are not set, so a tagged suite compiles
      # against nothing and rots silently — its first sign of trouble is the day someone
      # needs it and it no longer builds. The `integration` suite (event-management's
      # real-TimescaleDB write-path tests) and the `interop` suite (Leshan) both live
      # behind tags for good reasons: they need a server this job does not have.
      #
      # Vetting them RUNS nothing and needs no server; it only keeps them compiling
      # against the code they test. That is the cheap half of the guarantee, and it is
      # the half that actually decays. Running them is a separate, deliberate job.
      - name: go vet (build-tagged suites)
        working-directory: ${{ matrix.module }}
        run: go vet -tags "integration interop" ./...

      # graph-gophers/graphql-go silently discards input-object entries the schema
      # does not define when the value arrives through a VARIABLE (the literal path
      # rejects them correctly). The spec requires a request error, so a misnamed
      # field returning success is a fail-open: it yields a half-configured entity
      # that is indistinguishable from a correctly configured one. We carry the fix
      # in a fork until it lands upstream — see "Forked dependencies" in CLAUDE.md.
      #
      # A `replace` applies ONLY in the main module, so every module that resolves
      # graphql-go needs its own. Four modules (cli, mcp, dc-simulator,
      # migrationdiff) depend on it TRANSITIVELY and so are invisible to a grep of
      # go.mod — exactly how a module silently reverts to the unpatched library. The
      # check runs with GOWORK=off so it proves the module's own go.mod carries the
      # replace, rather than inheriting it from the workspace.
      - name: graphql-go fork guard
        working-directory: ${{ matrix.module }}
        env:
          # Pin the exact expected replacement. Matching only the module PATH would
          # accept github.com/devicechain-io/graphql-go@v1.10.2 — a real tag on the
          # fork that points at upstream's UNPATCHED code, since a fork inherits the
          # upstream tags. Matching the version closes that.
          WANT: "=> github.com/devicechain-io/graphql-go v1.10.2-dc.2"
        run: |
          set -o pipefail
          # Distinguish "not a dependency" (fine) from a genuine failure such as a
          # proxy outage or a broken go.mod. Swallowing both would let the guard
          # print "nothing to check" and pass while proving nothing.
          if ! stderr="$(GOWORK=off go list -m github.com/graph-gophers/graphql-go 2>&1 >/dev/null)"; then
            case "$stderr" in
              *"not a known dependency"*|*"not a required module"*|*"no required module provides"*)
                echo "graphql-go is not in this module's dependency graph; nothing to check."
                exit 0
                ;;
              *)
                echo "::error::Could not resolve graphql-go, so the fork could not be verified."
                echo "$stderr"
                exit 1
                ;;
            esac
          fi
          resolved="$(GOWORK=off go list -m github.com/graph-gophers/graphql-go)"
          echo "resolved: $resolved"
          case "$resolved" in
            *"$WANT"*) echo "OK: patched fork in use." ;;
            *)
              echo "::error::This module does not resolve the patched graphql-go fork."
              echo "Unknown GraphQL input fields would be silently dropped instead of rejected."
              echo "Expected a replacement matching: $WANT"
              echo "Fix with:"
              echo "  go mod edit -replace github.com/graph-gophers/graphql-go=github.com/devicechain-io/graphql-go@v1.10.2-dc.2"
              exit 1
              ;;
          esac

      # Known-vulnerability scan of this module's dependency graph. It lives here,
      # in the go matrix, rather than in a workflow of its own because govulncheck
      # has to run INSIDE a module (same constraint as every other Go gate here) and
      # this job already provides a warm per-module build cache. Measured on a warm
      # cache: 3.4s for core, 4.7s for outbound-connectors — the Bento tree, and the
      # slowest module here.
      #
      # 🔑 A GREEN RUN DOES NOT MEAN "no vulnerable dependencies". It means nothing
      # REACHABLE — govulncheck resolves advisories down to the call graph, and a
      # vulnerability in a module we require but never call is reported and does not
      # fail. That is deliberate: core requires x/crypto@v0.54.0 carrying
      # GO-2026-5932 with "Fixed in: N/A", so failing on require-but-do-not-call
      # would paint the whole tree permanently red over a package nobody can
      # upgrade away from.
      #
      # The wrapper exists for the one module where that advisory IS reachable —
      # backend/cli, via helm's package-init chain — and it carries a reviewed,
      # justified, per-module exception that FAILS ONCE IT GOES STALE. The full
      # reasoning, and the JSON-mode exit-code trap that shapes the script, are in
      # hack/govulncheck.sh. Note the deliberate absence of continue-on-error.
      #
      # The vulnerability DB is fetched at run time, so this step can start failing
      # with no change to this repo. That is the point of it — a newly published
      # advisory against a dependency we already ship is exactly the news we want.
      #
      # COVERAGE GAP, stated rather than left to be inferred from a green run: this
      # rides the discover matrix, which globs backend/{cli,core,k8s,edge/*,
      # services/*,sims/*,tools/*} — 21 modules. `deploy` is the 22nd workspace
      # module (deploy/assets.go) and no CI job builds, vets or tests it, so it is
      # not scanned here either. The codeql workflow DOES cover it, because that one
      # builds from `go list -m` and so follows go.work rather than a glob.
      - name: govulncheck (reachable vulnerabilities)
        run: hack/govulncheck.sh "${{ matrix.module }}"

      - name: go test
        working-directory: ${{ matrix.module }}
        # The operator's controllers suite is a kubebuilder envtest scaffold with
        # no specs yet — it boots a control plane but asserts nothing, and is
        # environment-sensitive. Exclude it from unit CI; add a dedicated envtest
        # job when real controller specs land. All other packages run normally.
        #
        # -count=1 disables TEST-RESULT caching, and it is load-bearing here rather
        # than a habit. `go test` decides a cached result is still valid from the
        # module's own sources, and it does NOT track files outside the module at
        # all — not their contents, not their directory listings. Several gates read
        # exactly such files: the sim's golden dashboard fixtures and /dash paste
        # samples both live under frontend/testdata. Measured, not assumed: with a
        # cached pass in place, breaking a sample and re-running printed
        # "ok (cached)" over the broken tree, and only -count=1 failed.
        #
        # The setup-go cache above restores GOCACHE, so those stale results survive
        # into CI — a PR touching only a fixture is precisely the shape that would
        # replay someone else's green. This disables result caching only; the BUILD
        # cache (the expensive part — outbound-connectors' Bento tree) is untouched.
        run: |
          if [ "${{ matrix.module }}" = "backend/k8s" ]; then
            # Read into an array rather than splitting an unquoted $(...). The
            # word-splitting was intended, but written that way it is
            # indistinguishable from the accidental kind — to shellcheck and to a
            # reader — and it would also glob. The array says "one argument per
            # package" outright.
            mapfile -t pkgs < <(go list ./... | grep -v '/controllers$')
            go test -count=1 "${pkgs[@]}"
          else
            go test -count=1 ./...
          fi

  # NOTE: a golangci-lint job is intentionally omitted for now — no golangci-lint
  # release yet supports Go 1.26 (it refuses: "the Go language version used to
  # build golangci-lint is lower than the targeted Go version"). gofmt + go vet
  # in the `go` job are the Go gates; re-add golangci-lint once a 1.26-compatible
  # release ships.

  # ---------------------------------------------------------------------------
  # Subscribe confirmation: a subscription the broker has never confirmed, and an
  # MQTT SUBACK whose result is never read.
  #
  # Both defects are silent by construction. Core NATS DROPS a publish with no
  # subscriber, so a component that subscribes, reports itself started, and is
  # handed nothing looks healthy from every side — the auth callout shipped that
  # way and refused real devices with a bare EOF. paho, meanwhile, never turns a
  # broker's REFUSAL into an error, so `token.Error()` is nil on a 0x80 and the
  # obvious spelling of "did my subscribe work" always says yes.
  #
  # 🔴 The guard is a go/analysis pass rather than a grep, and that is the point
  # of it. `.Subscribe(` matches four unrelated APIs in this repo and only two of
  # them are broken; the first inventory of the sites was done textually and was
  # wrong in both directions. The receiver's TYPE is the only thing that separates
  # them. See backend/tools/subconfirm/analyzer for what satisfies the check and
  # how a deliberate exemption is written.
  # ---------------------------------------------------------------------------
  subscriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Proves the checker can still fail, BEFORE its green run is read as
      # evidence. It plants a bare subscribe in a package inside backend/core, so
      # the analyzer is exercised against the REAL nats.go and paho rather than
      # against a stub that would only prove it agrees with the stub — and then
      # plants the same code written correctly, because "reports a bad subscribe"
      # is also satisfied by a checker that reports everything.
      #
      # The analyzer's own unit tests are not repeated here: backend/tools/subconfirm
      # is a workspace module, so the `go` matrix above already runs them.
      - name: subscribe-confirmation self-test
        run: hack/check-subscribe-confirmed.sh --self-test

      - name: every subscription is confirmed
        run: hack/check-subscribe-confirmed.sh

  # ---------------------------------------------------------------------------
  # Data access: the query shapes that are unsafe in a way no call site shows.
  #
  # gorm's inline-condition form, `db.Find(&out, ids)`, DROPS an empty slice
  # instead of rendering a predicate that matches nothing — so it silently
  # degrades into an unfiltered, unpaginated SELECT. `xById(ids: [])` is a legal
  # GraphQL document, so that is reachable from the public API, and twenty-one
  # lookups across two services carried it at once.
  #
  # This is a job rather than a step inside `go` because it is a property of the
  # TREE, not of a module: the `go` matrix would run it once per module and still
  # only ever look at the whole repo. It needs no toolchain, so it is cheap.
  # ---------------------------------------------------------------------------
  data-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Self-test first, as with every guard here — this one is a grep, and a grep
      # whose pattern or path has drifted reports a clean tree it never read. It
      # also exercises the EXEMPTION list in both directions, which is the part
      # most likely to quietly swallow the repo.
      - name: inline-id-condition guard self-test
        run: hack/check-inline-id-conditions.sh --self-test

      - name: no inline id conditions outside rdb.FindByIds
        run: hack/check-inline-id-conditions.sh

      - name: rejection-code label guard self-test
        run: hack/check-rejection-code-labels.sh --self-test

      - name: every declared rejection code is allowed in a metric label
        # `batch_refusals_total` carries a `code` label, so the codes that may
        # reach it are an allowlist rather than whatever a caller sends — a label
        # fed from an open vocabulary is the unbounded-cardinality vector the
        # no-tenant-label rule exists to prevent.
        #
        # The failure this catches is silent in the direction that matters: a new
        # rejection code that nobody allowlists still WORKS, it just folds into
        # "other", so the panel that answers WHY fleet writes are being refused
        # quietly stops naming it. Nothing goes red at runtime.
        run: hack/check-rejection-code-labels.sh

  # ---------------------------------------------------------------------------
  # Migrations: prove every area's chain still reproduces its golden schema.
  #
  # THIS IS THE ONLY THING THAT CHECKS THE MIGRATIONS AT ALL. The unit tests build
  # their schema by AutoMigrating the LIVE structs on SQLite; nothing but main.go
  # and this harness ever runs a gormigrate chain, and nothing but this runs it
  # against real Postgres + Timescale. A migration can therefore be broken, or
  # silently changed, with every other gate green.
  #
  # What it catches that review cannot: a migration is supposed to be frozen in
  # time, but it is written in Go, so anything it REFERENCES can move underneath
  # it — and the diff that moves it need not touch the migration, the service, or
  # even the module. A core/rdb mixin embedded in a migration's snapshot struct is
  # the live example (~111 of them across the areas today). Gorm's own conventions
  # are another: adding a TableName() to a model that lacked one silently renames
  # its indexes, because core/rdb pins the NamingStrategy TablePrefix and that
  # prefix applies only to DERIVED names. That one was found by this harness, on a
  # change that looked like pure cleanup and passed every other gate.
  #
  # If it fails: either the change was unintended — fix it — or the schema really
  # did change, in which case re-snapshot the goldens IN THE SAME PR
  # (hack/migration-diff.sh snapshot) so the diff shows a human what moved.
  # ---------------------------------------------------------------------------
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Proves the duplicate-index check can fail, BEFORE its green run is used as
      # evidence of anything. Plants a duplicate in a copy of the goldens and
      # requires detection, then requires the clean goldens to still pass.
      - name: duplicate-index check self-test
        run: hack/check-duplicate-indexes.sh --self-test

      # Reads the goldens only — no container, no Postgres — so it is cheap and
      # runs before the two verify passes below. It asserts no area declares two
      # indexes over an identical key, which is a property of the EMITTED schema
      # rather than of the code style that produced it: the defect it was written
      # for (two snapshot structs describing one table, one pinning TableName) is
      # only one of the ways indexes can collide.
      - name: no duplicate indexes in any golden schema
        run: hack/check-duplicate-indexes.sh

      # Runs the production rdb.RdbManager path against a throwaway TimescaleDB
      # the script starts in docker (present on ubuntu-latest), then diffs each
      # area's pg_dump against backend/tools/migrationdiff/golden/.
      - name: migration-diff verify (PostgreSQL 16, the image the goldens came from)
        run: hack/migration-diff.sh verify

      # The SAME goldens, on the PostgreSQL 17 operand image the `tsdb` cluster
      # actually runs (ADR-020 A2.4). The pass above is NOT the deployed image —
      # it is the one the goldens were captured on, and it stays because the
      # goldens are version-sensitive. Measured, not assumed: the two
      # schemas are byte-identical today, which is why this can be `verify`
      # against the committed goldens rather than a separate golden set.
      #
      # It runs on EVERY pull request rather than only when the image directory
      # changes, and that is the whole point — the failure this catches is a new
      # migration that is fine on 16 and broken on 17, which lives in
      # backend/services/**, nowhere near deploy/images/. Catching it at the
      # cutover instead would mean discovering it as a pile of unrelated PRs to
      # unpick.
      # Retried with backoff, matching the image-smoke job below. This build
      # reaches ghcr (the CNPG base), deb.debian.org and packagecloud.io, which
      # puts three third-party hosts on the critical path of EVERY pull request
      # in the monorepo — a packagecloud 5xx would otherwise red-line a PR that
      # has nothing to do with any of them. The same failure class took out all
      # 12 image-smoke jobs on 2026-07-16, which is why that job already does
      # this. A real build failure still fails all three attempts.
      - name: Build the PostgreSQL 17 operand image
        run: |
          for attempt in 1 2 3; do
            if deploy/images/timescaledb/build.sh operand:ci; then
              exit 0
            fi
            echo "::warning::operand image build attempt ${attempt}/3 failed (likely a transient registry/apt blip); retrying..." >&2
            sleep $((attempt * 15))
          done
          echo "::error::operand image build failed after 3 attempts" >&2
          exit 1

      - name: migration-diff verify (PostgreSQL 17 operand image)
        env:
          MDIFF_IMAGE: operand:ci
          MDIFF_LAUNCH: operand
          MDIFF_CONTAINER: dc-mdiff-operand
        run: hack/migration-diff.sh verify

  # ---------------------------------------------------------------------------
  # License header check (backend only, per CLAUDE.md).
  # ---------------------------------------------------------------------------
  # The integration-tagged suites, RUN rather than merely compiled.
  #
  # 🔴 UNTIL THIS JOB EXISTED, CI ONLY EVER VETTED THEM. The `go` job runs
  # `go vet -tags "integration interop" ./...`, which type-checks a tagged test and never
  # executes it — so device-management's geofence TOCTOU test, event-management's hypertable
  # and compression tests, core/rdb's guest-connection tests and migrationdiff's purge drill
  # could all have been failing for months with no red mark anywhere. They exist precisely
  # because sqlite cannot answer the questions they ask: row locking under real concurrency,
  # chunks, columnar compression, a real catalog, a real second database.
  #
  # The container, the module discovery and the per-module verdicts all live in the script, so
  # a maintainer runs exactly what CI runs — and a module that GAINS an integration test is
  # covered the day it does, with no list here to fall out of step with go.work.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # The guard before the gate, the way the other hack/ checks do it. A `-run` filter that
      # matches nothing exits 0 with "no tests to run", which is indistinguishable from a pass
      # in every summary — and that is not hypothetical: the first draft of the runner covered
      # 8 of the 13 tagged tests and reported success. This proves the runner can tell an empty
      # run from a real one BEFORE its green result is used as evidence of anything.
      - name: integration runner self-test
        run: hack/integration-tests.sh --self-test

      - name: integration tests against a real PostgreSQL
        run: hack/integration-tests.sh

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Check SPDX headers
        # Go + hand-authored GraphQL/proto sources + the C# SDK. YAML and the
        # operator Dockerfile are excluded: those manifests are controller-gen-
        # generated, so a header would drift away on every `make manifests`
        # regeneration. .NET project/build files are excluded (addlicense has no
        # header style for them); the .cs sources are checked.
        run: >
          go run github.com/google/addlicense@latest -check
          -ignore '**/*.yaml' -ignore '**/Dockerfile'
          -ignore '**/*.csproj' -ignore '**/*.sln' -ignore '**/*.props'
          -ignore '**/bin/**' -ignore '**/obj/**'
          -ignore '**/migrationdiff/golden/*.sql'
          -f hack/license-header.txt backend sdks

  # ---------------------------------------------------------------------------
  # Workflow hygiene: the CI configuration is itself un-gated code.
  #
  # Nothing else in this repo validates .github/workflows. A typo in a `runs-on`
  # label, an expression referencing a context field that does not exist, or a
  # `${{ github.event.* }}` interpolated straight into a `run:` block (a script
  # INJECTION — attacker-controlled text executing as shell in our runner) all
  # ship silently and are discovered, at best, on the next run and, at worst,
  # never. actionlint catches all three statically.
  # ---------------------------------------------------------------------------
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Proves the pin guard can fail before its green run is used as evidence —
      # same reason the guards in `discover` self-test. This one covers the two
      # extraction traps that make a pin checker silently vacuous (a substring
      # match on `statuses: write`, and subpath actions like
      # github/codeql-action/upload-sarif being skipped by an owner/repo pattern).
      - name: action-pin guard self-test
        run: hack/check-action-pins.sh --self-test

      # A mutable `@v4` ref is code an outsider can change without a diff here.
      - name: Every action is pinned to a commit SHA
        run: hack/check-action-pins.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: false

      # 🔑 actionlint runs shellcheck against every `run:` block, but ONLY if a
      # shellcheck binary is on PATH — otherwise it silently skips that entire
      # class of check and still exits 0. ubuntu-latest ships one, so CI gets the
      # shell checks; a developer's machine usually does not, so a local green run
      # is WEAKER than this job and does not predict it. Measured: with shellcheck
      # absent, actionlint reported nothing on this repo; with it present, it found
      # two real defects (an unquoted $(...) here and an unquoted ${REGISTRY} in
      # release.yml). Run it locally as:
      #   actionlint -shellcheck=/path/to/shellcheck
      - name: actionlint
        run: |
          GOWORK=off go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on PATH; actionlint would silently skip"
            echo "all shell checks and still pass. Refusing to report a weaker result"
            echo "than this job promises."
            exit 1
          }
          "$(go env GOPATH)/bin/actionlint"

      # actionlint above covers the shell INSIDE workflows (`run:` blocks). The
      # standalone scripts were ungated, and that is where most of this repo's
      # shell actually lives — both validation rigs, every CI guard, the local
      # bring-up, the operand-image build.
      #
      # Self-test first, for the usual reason: this guard enumerates its own
      # inputs, and an enumeration that silently returns nothing is the classic
      # way a check reports "clean" about a tree it never looked at.
      - name: shellcheck guard self-test
        run: hack/shellcheck.sh --self-test

      - name: shellcheck every tracked script
        run: hack/shellcheck.sh

      # The base image of every artifact we publish lives on one line of
      # .ko.yaml, and no scanner reads it — Scorecard only parses Dockerfiles,
      # which is how it came to flag a dead kubebuilder Dockerfile while missing
      # this. The guard checks the pin is a digest AND that the workflow which
      # advances it is still alive; a frozen pin is worse than the mutable tag.
      - name: ko base-image pin guard self-test
        run: hack/check-ko-base-pin.sh --self-test

      - name: ko base image is pinned and its bumper is alive
        env:
          GH_TOKEN: ${{ github.token }}
          # The liveness half needs the API. Without this, a missing token would
          # make the guard quietly check half of what it advertises — the same
          # shape as actionlint silently skipping shellcheck.
          REQUIRE_LIVENESS: '1'
        run: hack/check-ko-base-pin.sh

      # The default basemap is the OpenStreetMap standard tile layer, whose usage
      # policy needs a Referer from browser clients. Adding a restrictive
      # Referrer-Policy is a one-line hardening that breaks nothing HERE and
      # blanks the map on installs nobody here can see — so the argument has to
      # meet the person writing that line. Self-test first, as ever: this is a
      # grep, and a grep with a wrong path reports a clean tree it never read.
      - name: OSM tile-policy guard self-test
        run: hack/check-osm-tile-policy.sh --self-test

      - name: No Referrer-Policy strips the Referer the default basemap needs
        run: hack/check-osm-tile-policy.sh

      # The ci-complete gate is the single check branch protection requires, and
      # it is only as complete as a hand-written `needs` list. A job added to this
      # file is unguarded by default — it runs, it can fail, and the gate goes
      # green — so this asserts the list still names every job, and that the gate
      # kept the two properties that make it work (always(), and a body).
      #
      # Self-test first, and it plants each defect ALONE: a self-test that plants
      # all of them at once is satisfied by a checker that finds any one.
      - name: ci-complete gate guard self-test
        run: hack/check-ci-gate-complete.sh --self-test

      - name: the required gate depends on every job
        run: hack/check-ci-gate-complete.sh

      # The upgrade gate runs on a PR only when the PR touches something that can
      # change what an existing instance holds, and hack/check-upgrade-gate-paths.sh
      # owns that rule outright: the workflow fires on every PR and asks the script,
      # so the drill can be a REQUIRED check without leaving unrelated PRs pending.
      #
      # A rule that stops matching fails in the worst direction available: nothing
      # errors, the drill simply does not appear, and "the upgrade drill did not
      # object" is indistinguishable from "the upgrade drill passed". This checks the
      # two claims that can be checked from the tree — every migration and baseline
      # file is matched, and the workflow has not grown a `paths:` filter that would
      # AND with the script invisibly. Same self-test-first rule as the guard above,
      # and its self-test covers the decision itself, which nothing here can.
      - name: upgrade-gate rule guard self-test
        run: hack/check-upgrade-gate-paths.sh --self-test

      - name: every migration triggers the upgrade drill
        run: hack/check-upgrade-gate-paths.sh

  # ---------------------------------------------------------------------------
  # Published documentation hygiene.
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Prove the guard can fail before trusting it to pass — it is a grep, and a
      # grep with a typo'd pattern is indistinguishable from a clean tree.
      - name: ADR-reference guard self-test
        run: hack/check-docs-adr-refs.sh --self-test

      # ADRs live in the private strategy repo, so a reference to one in the docs
      # site is a dead citation for every reader who has it.
      - name: No ADR references in published docs
        run: hack/check-docs-adr-refs.sh

      # Same reasoning as the guard above: prove it can fail first. This one
      # greps the tree for names, and a grep that finds everything is
      # indistinguishable from a tree that still matches.
      - name: Feature-draft rot guard self-test
        run: hack/check-docs-drafts-rot.sh --self-test

      # A feature draft's value is that every claim was checked against the code.
      # That decays silently as files move, and a stale map is worse than none.
      - name: Feature drafts still match the tree
        run: hack/check-docs-drafts-rot.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      # The schema publisher's gates, including its own negative controls. The two
      # guards above cannot see the published schemas at all: they scan committed
      # sources, and these files are generated at build time into a gitignored
      # directory, so they exist only on Netlify. This is what covers that.
      - name: Schema publishing self-tests
        run: node --test docs/scripts/schema-publish.test.mjs

      # Netlify builds the docs site, not Actions — so a backend rename would break
      # the docs deploy AFTER merge, in a Go pull request that triggers no docs
      # build at all. Running the generator in check mode here puts the failure on
      # the pull request that caused it.
      - name: GraphQL schemas reconcile with the publish manifest
        run: node docs/scripts/generate-schema.mjs --check

  # ---------------------------------------------------------------------------
  # Frontend: codegen drift check, typecheck, unit tests, build.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches the frontend Dockerfile build stage (node:26-alpine) and
          # satisfies vite 8's engines floor (^20.19 || ^22.12 || >=24).
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 🔴 BEFORE `npm ci`, deliberately: these tests need no dependencies, and what
      # they cover is the RELEASE plumbing — the ordered package list, the version
      # stamper and the publisher helpers — which nothing else in CI executes at all.
      # Its one chance to be wrong is a tag, where the packages it publishes are
      # immutable, so it should fail in the first seconds of this job rather than
      # behind a two-minute install.
      - name: Release package plumbing tests
        run: npm run test:scripts

      - name: Install dependencies
        run: npm ci

      # 🔴 BEFORE codegen, typecheck, lint and test — not merely before the build.
      # The apps consume the packages' `dist`, not their sources, so every step below
      # resolves @devicechain/{client,dashboards,widgets} through built artifacts that
      # do not exist in a fresh checkout. (Each app script also depends on this through
      # a `pre*` hook, so the same thing cannot be reached stale by hand; the step is
      # here as well so a build failure is reported as a build failure rather than as a
      # confusing typecheck error twenty lines later.)
      - name: Build publishable packages
        run: npm run build:packages

      # 🔴 THE GATE THAT READS WHAT WOULD ACTUALLY BE UPLOADED. Everything else in this
      # job compiles the packages as workspace SOURCE; this packs them and checks the
      # tarball — the `files` allowlist, the `exports` targets, `publishConfig`, the
      # exact-pinned internal peer ranges, no bundler dialect in the portable entries,
      # and every entry loading under bare Node ESM out of a node_modules built only
      # from what the manifest declares.
      #
      # It runs on every pull request, and not only on a tag, because the release job's
      # copy of it is the LAST thing between a defect and an immutable npm version. A
      # gate whose first execution is the release is a gate nobody has seen work.
      - name: Verify the packed artifacts
        run: npm run verify:packages

      - name: Codegen drift check
        run: |
          # Regenerate and fail if the committed output in the console's src/gql
          # is stale (workspace layout: apps/console).
          npm run codegen
          git diff --exit-code -- apps/console/src/gql

      - name: Typecheck
        run: npm run typecheck

      # i18n gate (ADR-066): the console's eslint `no-literal-string` rule fails
      # on any hard-coded user-facing string, keeping the app fully externalized
      # into the react-i18next catalogs. Only apps/console defines a lint script,
      # so `--workspaces --if-present` runs exactly that gate.
      - name: Lint (i18n no-literal-string gate)
        run: npm run lint

      - name: Test
        run: npm test

      # Brand drift gate. `npm run build` already fails if a generated stylesheet
      # is stale against tokens.json; this catches the other direction — a
      # consumer that stops importing and hand-declares the brand blue again.
      # That is not hypothetical: it is how the console, the dashboard and the
      # marketing site each ended up on a DIFFERENT blue, and a comment saying
      # "keep this in step" is what failed to stop it.
      #
      # The marketing site lives in another repo and is checked by hand with
      # DC_WEBSITE=... — nothing here can see it.
      - name: Brand token drift check
        run: npm run verify -w @devicechain/brand

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # C# SDK (sdks/csharp): restore, build both TFMs (netstandard2.1 + net8.0), test.
  # TreatWarningsAsErrors + IsAotCompatible keep the Unity/IL2CPP guarantee honest.
  # ---------------------------------------------------------------------------
  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      # The MQTT client is tested against the broker the platform actually ships, not a
      # generic one — nats-server's MQTT gateway has its own behaviour (3.1.1 only, session
      # handling, client-id rules) and a different broker would prove the wrong thing.
      #
      # It is BUILT FROM THE VERSION THE BACKEND ALREADY PINS rather than downloaded: nats-server
      # is a direct dependency of backend/core, so `go build` yields exactly the version that
      # ships, with no second pin to keep in step and no checksum to maintain. A downloaded
      # release binary would be a version claim that drifts away from go.mod silently.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Start the MQTT broker the platform ships
        working-directory: backend/core
        run: |
          go build -o "$RUNNER_TEMP/nats-server" github.com/nats-io/nats-server/v2
          "$RUNNER_TEMP/nats-server" --version
          mkdir -p "$RUNNER_TEMP/js"
          # ack_wait is how long the broker waits for a PUBACK before REDELIVERING a QoS-1
          # message, and it is set here because it is the only knob that makes redelivery
          # observable in a test: the default is 30 seconds, so a redelivery test on the default
          # either runs for half a minute or silently proves nothing. The SDK's redelivery test
          # FAILS rather than skips if no redelivery arrives, so dropping this line breaks the
          # csharp job loudly instead of quietly reducing what it covers.
          cat > "$RUNNER_TEMP/nats.conf" <<CONF
          port: 4222
          jetstream { store_dir: "$RUNNER_TEMP/js" }
          mqtt { port: 1883, ack_wait: "1s" }
          CONF
          "$RUNNER_TEMP/nats-server" -c "$RUNNER_TEMP/nats.conf" > "$RUNNER_TEMP/nats.log" 2>&1 &
          for _ in $(seq 1 30); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1883' 2>/dev/null; then
              echo "MQTT gateway is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "the MQTT gateway never came up:"; cat "$RUNNER_TEMP/nats.log"; exit 1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # DC_REQUIRE_MQTT_BROKER is the half that stops a broken broker step from going unnoticed:
      # the real-broker tests skip themselves when DC_MQTT_BROKER is unset, and a skip reads as a
      # pass, so without this a silently-dead broker would leave the job green while testing
      # nothing. MqttRealBrokerGuardTests turns that into a failure.
      - name: Test
        env:
          DC_MQTT_BROKER: tcp://127.0.0.1:1883
          DC_REQUIRE_MQTT_BROKER: '1'
        run: dotnet test --no-build -c Release

      # The rung the SDK README has been naming as missing. IsAotCompatible only turns on the
      # trim/AOT ANALYZERS, which read our source; they say nothing about whether the whole
      # closure — including MQTTnet's un-annotated IL — survives a real AOT compiler.
      #
      # 🔴 THE BINARY IS RUN, NOT JUST BUILT. AOT failures are overwhelmingly runtime failures
      # (a type that cannot be constructed, a path trimmed away), so a publish that is never
      # executed proves only that the compiler accepted the IL. The host drives a real MQTT
      # round-trip against an in-process scripted broker and exits non-zero if it breaks —
      # verified by breaking it deliberately and watching this step fail.
      #
      # 🔴 BOUNDARY, so a green run is not over-read: NativeAOT is NOT IL2CPP. They are
      # different AOT compilers, and dotnet test above runs on CoreCLR/JIT. This job is strong
      # evidence about the Unity path and proof of nothing about it; only a native Unity player
      # closes that gap.
      #
      # The broker started above is still running, so the native binary drives a REAL round-trip
      # rather than only the in-process scripted one — which is the strongest rung available here:
      # the platform's own broker, exercised by natively-compiled code.
      - name: Native-AOT publish-and-run gate
        env:
          DC_MQTT_BROKER: tcp://127.0.0.1:1883
          # Same reason as the Test step: this host skips its real-broker leg when the variable is
          # unset, and a skip reads as a pass. Without this the gate would quietly degrade to
          # scripted-only if the broker step ever broke.
          DC_REQUIRE_MQTT_BROKER: '1'
        run: |
          dotnet publish tests/DeviceChain.Sdk.AotHost -c Release -r linux-x64
          ./tests/DeviceChain.Sdk.AotHost/bin/Release/net8.0/linux-x64/publish/DeviceChain.Sdk.AotHost

      # Pack the package that will actually be published. Nothing else in CI does:
      # restore/build/test never open the packaging properties, so a <PackageIcon> or
      # <PackageReadmeFile> pointing at a file that is not there stays invisible until
      # a release run tries to publish and dies there (NU5019/NU5046). A version is
      # passed because the checked-in default is a deliberate placeholder, which also
      # makes this the only exercise of the release's own -p:Version= path.
      #
      # 🔴 A GREEN PACK IS NOT A GOOD PACKAGE, so the artifact is opened and read.
      # Measured, not assumed: NuGet reports a package with NO README as an
      # informational "missing a readme" line, packs it happily, and exits 0 — even
      # under -warnaserror, which does not promote it. Every listing field behaves the
      # same way. Deleting <PackageProjectUrl>, or dropping a Pack="true", produces a
      # package that builds clean and quietly lists worse. The assertions below are
      # what actually hold the listing together; -warnaserror is kept for the genuine
      # NU-warnings it does catch, and is not doing this job.
      - name: Pack the NuGet package
        run: |
          dotnet pack src/DeviceChain.Sdk -c Release --no-build \
            -p:Version=0.0.0-ci -warnaserror -o "$RUNNER_TEMP/nupkg"

          nupkg="$(ls "$RUNNER_TEMP/nupkg"/*.nupkg)"

          # The files a listing is made of must be IN the archive, not merely named.
          for want in avatar-400.png PACKAGE.md; do
            unzip -l "$nupkg" | grep -q " $want\$" \
              || { echo "::error::$want is missing from the packed nupkg"; exit 1; }
          done

          # ...and the nuspec must still carry the fields nuget.org renders from.
          nuspec="$(unzip -p "$nupkg" DeviceChain.Sdk.nuspec)"
          for el in icon readme projectUrl description tags copyright; do
            grep -q "<$el>" <<<"$nuspec" \
              || { echo "::error::the packed nuspec has no <$el>"; exit 1; }
          done
          # <repository> carries the url as an ATTRIBUTE, and packs with a commit but
          # no url when RepositoryUrl is unset -- so the element being present proves
          # nothing. Match the attribute.
          grep -q '<repository[^>]*url="http' <<<"$nuspec" \
            || { echo "::error::the packed nuspec has no repository url"; exit 1; }

          echo "packed and verified:"
          ls -1 "$RUNNER_TEMP/nupkg"

  # ---------------------------------------------------------------------------
  # Unity package (sdks/unity) tier-1 verification: compile the Runtime + Sample C# against real
  # UnityEngine reference assemblies (UnityEngine.Modules, reference-only) in BOTH platform branches
  # — desktop (#else) and WebGL (#if UNITY_WEBGL). Catches wrong-API / branch typos with no Editor,
  # license, or GUI. Editor/WebGL runtime behavior is out of scope here (game-ci + a browser smoke).
  # ---------------------------------------------------------------------------
  unity-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Tier-1 compile check (both platform branches)
        run: ./sdks/unity/tools/UnityCompileCheck/compile-check.sh

  # ---------------------------------------------------------------------------
  # Helm chart: lint and template render.
  # ---------------------------------------------------------------------------
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: helm lint
        run: helm lint deploy/helm/devicechain

      - name: cnpg-cluster chart
        # The database-store chart (ADR-020 A2.3). It lives under the OpenTofu
        # modules tree rather than in deploy/helm because it is an implementation
        # detail of a module — a Cluster custom resource cannot be a
        # kubernetes_manifest without its CRD existing at PLAN time, so a
        # helm_release is how the resource gets created at all.
        #
        # Linted here rather than nowhere: it is a Helm chart, it ships inside
        # dcctl, and until this step existed the ONLY thing that rendered it was a
        # real bootstrap against a real cluster.
        run: |
          helm lint deploy/opentofu/modules/cnpg-cluster/chart \
            --set name=dc-rdb --set imageName=example/pg:17 --set instances=3 \
            --set aliasServiceName=dc-postgresql --set storage.size=8Gi \
            --set bootstrap.database=devicechain --set bootstrap.owner=devicechain \
            --set bootstrap.secretName=dc-rdb-app-credentials

          # The guard that costs a third node, asserted rather than trusted.
          # Synchronous replication at two instances turns any standby loss into a
          # total write outage, and CloudNativePG's own webhook does NOT refuse it
          # (it refuses only number >= instances). If this render ever succeeds,
          # that topology has become reachable.
          if helm template dc-rdb deploy/opentofu/modules/cnpg-cluster/chart \
               --set name=dc-rdb --set imageName=example/pg:17 --set instances=2 \
               --set aliasServiceName=dc-postgresql --set storage.size=8Gi \
               --set bootstrap.database=devicechain --set bootstrap.owner=devicechain \
               --set bootstrap.secretName=dc-rdb-app-credentials \
               --set synchronous.enabled=true >/dev/null 2>&1; then
            echo "FAIL: the chart rendered synchronous replication at 2 instances." >&2
            echo "That topology stalls every write on the loss of a single standby." >&2
            exit 1
          fi
          echo "ok: synchronous replication is refused below three instances"

          # The reserved-owner guard (ADR-020 A2.4), asserted for the same reason:
          # it is refused today only because this chart happens to render a managed
          # role for the owner, and CloudNativePG's webhook rejects a reserved name
          # THERE. Measured on 1.30.0, `bootstrap.initdb.owner: postgres` is accepted
          # on its own — so make that block conditional and the store comes up
          # connecting as the real superuser, with enableSuperuserAccess: false
          # rendered meaningless and nothing reporting a problem.
          for reserved in postgres streaming_replica; do
            if helm template dc-tsdb deploy/opentofu/modules/cnpg-cluster/chart \
                 --set name=dc-tsdb --set imageName=example/pg:17 --set instances=3 \
                 --set aliasServiceName=dc-timescaledb-single --set storage.size=8Gi \
                 --set bootstrap.database=devicechain --set "bootstrap.owner=$reserved" \
                 --set bootstrap.secretName=dc-tsdb-app-credentials >/dev/null 2>&1; then
              echo "FAIL: the chart rendered a Cluster owned by the reserved role '$reserved'." >&2
              echo "The platform connects as the owner, so this means connecting as a" >&2
              echo "CloudNativePG-reserved role rather than as an application." >&2
              exit 1
            fi
          done
          echo "ok: reserved owner names are refused"

          # The counterweight. Refusing reserved owners is only safe while a valid
          # owner still renders — a guard that rejects everything passes the two
          # checks above and breaks every install.
          helm template dc-tsdb deploy/opentofu/modules/cnpg-cluster/chart \
            --set name=dc-tsdb --set imageName=example/pg:17 --set instances=3 \
            --set aliasServiceName=dc-timescaledb-single --set storage.size=8Gi \
            --set bootstrap.database=devicechain --set bootstrap.owner=devicechain \
            --set bootstrap.secretName=dc-tsdb-app-credentials >/dev/null
          echo "ok: a valid owner still renders"

      # Self-test first, and it plants each defect ALONE: a self-test that plants
      # all of them at once is satisfied by a checker that finds any one. Ten
      # defects here — a required group that stopped rendering, a render with no
      # rules at all, unparseable PromQL, a group accounted for nowhere, a listed
      # group that renders nothing, an untested alert, a stale test, a group with
      # no alerts, a missing test file, and a rule inverted so it can never fire.
      - name: PrometheusRules guard self-test
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          hack/check-prometheus-rules.sh --self-test

      - name: PrometheusRules parse
        # Prometheus loads rule groups ATOMICALLY: one unparseable expression and
        # the entire group is rejected, every other alert in it included. It fails
        # in the server's log and in a counter — the PrometheusRule object stays
        # present and healthy-looking, and the alerts simply never fire.
        #
        # Nothing else catches this. `helm lint` checks YAML, not PromQL, and the
        # Prometheus Operator's admission webhook is optional and speaks only once
        # the release is already being applied. The chart ships five rule files now
        # (DETECT/REACT, JetStream replication, database backups, database control
        # plane, command delivery), and a break in one takes its neighbours down
        # with it.
        #
        # 🔴 IT CANNOT SEE A MISSPELLED SERIES. promtool parses PromQL and has no
        # idea which metrics this platform registers, so a rule naming a series
        # that does not exist parses perfectly and evaluates an empty vector —
        # which is not false, so the alert simply never fires. That gap is the
        # dashboard guard's, below.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          hack/check-prometheus-rules.sh

      # Self-test first, and it plants each defect ALONE: a self-test that plants
      # all of them at once is satisfied by a checker that finds any one.
      - name: dashboard guard self-test
        run: hack/check-dashboards.sh --self-test

      - name: dashboards parse and name real series
        # Two gaps nothing else covers, both silent.
        #
        # templates/grafana-dashboard.yaml embeds each dashboard with
        # `.Files.Get | indent`, which turns ANY bytes into a valid YAML block
        # scalar — so helm lint, helm template, the profile render and kubectl
        # apply all pass on malformed JSON, and it fails in the Grafana sidecar's
        # log at runtime, on somebody else's cluster.
        #
        # And nothing checked that a series name exists. A misspelled metric in a
        # panel draws an empty graph; in an alert it never fires and never
        # complains.
        #
        # It also pins the dashboard ConfigMap names, which became a real risk
        # when that template stopped hardcoding one filename and became a glob.
        run: hack/check-dashboards.sh

      - name: cnpg-cluster chart vs the real CRD schemas
        # The one failure the chart cannot protect itself from.
        #
        # Every guard in the step above is a `fail` on a VALUE. None of them can
        # see a misspelled FIELD, because Helm prunes unknown fields silently —
        # measured: `kubectl apply` rejects `spec.postgresql.synchronus` outright
        # while `helm install` exits 0 and creates an object without it. The
        # module applies through Helm, so a one-character slip yields a green
        # apply and a Cluster missing whatever that field controlled.
        #
        # A2.5 adds a second instance of the same shape and a worse one: misspell
        # `isWALArchiver` and the Cluster still carries the plugin and still names
        # its ObjectStore, but Postgres gets no archive_command and the instance
        # is not backed up. Nothing else in this repo would notice.
        #
        # Validates the rendered objects against the CRDs of the PINNED chart
        # versions, read from the OpenTofu variables rather than restated. Also
        # asserts the one field a schema CANNOT check — `barmanObjectName` lives
        # in a free-form parameters map, so it is checked by name and against the
        # ObjectStore actually rendered beside it.
        run: |
          # The runner image ships PyYAML today; installing it if absent keeps
          # this step from going red on an image change rather than on the chart.
          # The script still refuses to run without it, so this cannot turn into a
          # silent skip.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          hack/check-cnpg-chart-schema.sh

      - name: profile workloads
        # Renders EVERY profile and pins the workloads each one produces.
        #
        # This replaces a pair of render-to-/dev/null calls that caught template
        # errors and asserted nothing about the output. It still catches render
        # errors — a failed render fails the diff — but it also pins what an install
        # actually runs, which is what the published footprint measurement is taken
        # against. Moving a functional area into a profile used to invalidate that
        # number silently; now it fails here with instructions.
        #
        # It also covers telemetry and ingest-only, which were rendered by nothing.
        run: hack/check-profile-workloads.sh

  # ---------------------------------------------------------------------------
  # OpenTofu: format, init (no backend), validate.
  # ---------------------------------------------------------------------------
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/opentofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          # The action's default is to install a Node WRAPPER on the PATH ahead of
          # the real binary, so that a step's tofu output can be read back as step
          # outputs. Nothing here consumes those, and the wrapper does not forward
          # the step's stdin to the child process — which is fatal for the
          # `tofu console` invocations below. They do not fail against it, they
          # BLOCK: the child waits on a pipe that is never closed, so the job holds
          # a runner until the workflow ceiling and the PR's check never resolves
          # rather than going red. fmt/init/validate read no stdin, which is why
          # only the last step hung and every earlier one passed.
          tofu_wrapper: false

          # 🔴 PINNED, AND PINNED TO THE SAME VERSION AS loadtest-gate.yml. Unpinned,
          # this job installed whatever OpenTofu was newest while the gate that
          # bootstraps real clusters ran 1.9.1 — so the two disagreed about the
          # LANGUAGE, and the cheaper job was the one running the more forgiving
          # semantics. That skew already cost a release: OpenTofu added boolean
          # short-circuiting in 1.10 (opentofu/opentofu#3501), so
          #
          #   length(x) > 0 && length(x[0].y) > 0
          #
          # is fine on >=1.10 and an "Invalid index" APPLY FAILURE on <=1.9.x. The
          # `variable validation blocks` step below asserts the very output that
          # contained that expression, at both HA postures, and reported ok — on a
          # tree where every non-HA bootstrap died. The check was right, the
          # interpreter was not the one users get.
          #
          # 🔑 SO PIN THE OLDER SEMANTICS DELIBERATELY, not the newest release.
          # versions.tf declares `required_version = ">= 1.6"` and dcctl's findTofu
          # takes the first of `tofu`/`terraform` on PATH with no version check, so
          # an eager-evaluation interpreter is squarely inside what this tree claims
          # to support. Testing >=1.10 here would make the whole class invisible to
          # CI while leaving it live for anyone on the floor.
          #
          # Two ways to change this, both fine, both deliberate: raise the pin AND
          # `required_version` together (>= 1.10 buys short-circuiting as a language
          # guarantee), or lower the pin toward the real floor. Do not raise this one
          # alone — that is how the skew came back.
          tofu_version: 1.9.1

      - name: tofu fmt
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

      # `tofu validate` evaluates variables at their DEFAULTS and never runs a
      # validation block, so an inverted or misdirected condition passes every step
      # above. This supplies real values and asserts what is refused and — the
      # counterweight — what is still accepted.
      - name: variable validation blocks
        run: hack/check-tofu-validations.sh
        working-directory: .

      # nats-server refuses to hot-reload the auth_callout block (and JetStream's
      # memory/store ceilings), and the refusal is wholesale — so without the pod
      # template's config checksum, a change is applied, reported successful by every
      # layer, and never adopted by the running broker. The only trace is one [ERR]
      # line in the broker's own log.
      - name: NATS config adoption
        run: hack/check-nats-config-adoption.sh
        working-directory: .

      # An unpinned chart version has to be resolved at APPLY time, so a chart-repo
      # hiccup surfaces as the helm provider's "inconsistent final plan ... .version:
      # was known, but now unknown" — which names neither the chart nor the network.
      # It also means two bootstraps of this commit install different software, under
      # modules that are sized against chart internals.
      - name: chart version pins
        run: hack/check-chart-pins.sh
        working-directory: .

  # ---------------------------------------------------------------------------
  # Image smoke build: ko builds each service image locally (no push). This
  # catches image-build breakage. The matrix covers the discovered services
  # plus the operator (backend/k8s).
  # ---------------------------------------------------------------------------
  image-smoke:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Discovered services (mapped to backend/services/<name>) plus the
        # operator at backend/k8s -- assembled by the discover job.
        module: ${{ fromJson(needs.discover.outputs.smoke) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          # Per-module cache key, NOT the shared "**/go.sum". Every matrix entry
          # hashing all go.sum files computed the SAME key, and a GitHub cache key is
          # write-once — so the first job to finish its post-step saved the cache and
          # every other entry skipped saving. The slowest module (outbound-connectors,
          # whose Bento tree is ~1,240 extra packages) is the LEAST likely to win that
          # race, so its build cache was almost never persisted and it recompiled Bento
          # cold on nearly every run. A per-module key gives each entry its own cache to
          # restore from.
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # Install ko ourselves rather than via ko-build/setup-ko. The action has now
      # failed this job in two different ways, and both come from it fetching over the
      # network with no retry and no verification:
      #
      #   1. Its default "latest-release" resolution is, inside the action:
      #        tag=$(curl -L -s -u "username:${GH_TOKEN}" \
      #                https://api.github.com/repos/ko-build/ko/releases/latest | jq -r '.tag_name')
      #      which makes every image-smoke job depend on GitHub's AUTHENTICATED API being
      #      healthy at that moment — and when it is not, the action pipes an HTML error
      #      page straight into jq, which dies with "Invalid numeric literal at line 1,
      #      column 10" and an empty tag, failing the job in ~10s before anything is
      #      built. That took out all 12 image-smoke jobs on 2026-07-16: GitHub was
      #      503-ing authenticated api.github.com requests while unauthenticated ones
      #      still returned 200, so the failure looked like a code problem and was not.
      #      Pinning a version dodged this by taking the action's `*)` branch.
      #
      #   2. Its download is `curl -fsL <url> | tar xzf -`, and 🔴 A PIPE CANNOT BE
      #      RETRIED. A truncated body is not visible to curl at all — it surfaces only
      #      downstream as `gzip: stdin: unexpected end of file`, after tar has already
      #      consumed the stream, so neither `--retry` nor a wrapper around the action
      #      can recover it. On 2026-08-12 this failed 2-3 of the ~15 matrix jobs on
      #      EVERY run, a different random subset each time, and one job failed three
      #      consecutive attempts. ~15 jobs pulling the same 12MB asset simultaneously
      #      is enough to get some of them throttled mid-stream.
      #
      # Downloading to a FILE is what makes the retry meaningful: curl can then restart
      # a failed transfer, and the checksum is checked before anything is unpacked or
      # executed. That turns a corrupt download into a named error instead of a
      # confusing tar failure — or, worse, a silently truncated binary.
      #
      # 🔴 KO_VERSION and KO_SHA256 must be bumped TOGETHER. The digest is the one for
      # ko_<version>_Linux_x86_64.tar.gz in that release's own checksums.txt — read it
      # from there, never from a local download, which would just be attesting to
      # whatever you happened to receive. Pinning both keeps the image build
      # reproducible (the same ko every run, not whatever shipped that morning) and is
      # what a pinned build tool is for.
      # 🔴 TWO INDEPENDENT SOURCES, BECAUSE RETRYING ONE HOST IS NOT RESILIENCE. Within
      # twenty minutes on 2026-08-12 the release-asset host went from truncating bodies
      # to returning a hard 503 for every request, and no retry policy reaches a host
      # that is down. The fallback is deliberately on DIFFERENT infrastructure — the Go
      # module proxy — so a single provider outage cannot stop every image build.
      #
      # The release tarball stays FIRST because it is a 12MB download versus compiling
      # ko from source. Its deps are not in any matrix module's go.sum, so setup-go's
      # per-module cache cannot hold them and the fallback recompiles on every job that
      # takes it. Fast path first, working path second.
      #
      # Both paths are pinned to KO_VERSION and both are integrity-checked: the tarball
      # against KO_SHA256, and `go install` against the Go checksum database, which is a
      # transparency log rather than a digest written down here. GOWORK=off matches how
      # this workflow already installs actionlint — without it the tool resolves against
      # this repo's workspace instead of its own module graph. GOWORK=off also discards
      # go.work's `toolchain` line, but setup-go has already installed the version named
      # in go.work, which satisfies ko's own floor; a box whose default toolchain is
      # older just downloads one via GOTOOLCHAIN rather than failing.
      - name: Install ko (pinned, verified, two sources)
        env:
          KO_VERSION: v0.19.1
          KO_SHA256: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
        run: |
          set -euo pipefail
          url="https://github.com/ko-build/ko/releases/download/${KO_VERSION}/ko_${KO_VERSION#v}_Linux_x86_64.tar.gz"
          dest="${RUNNER_TEMP}/ko-bin"
          mkdir -p "$dest"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --connect-timeout 15 \
                 -o "${RUNNER_TEMP}/ko.tar.gz" "$url"; then
              if echo "${KO_SHA256}  ${RUNNER_TEMP}/ko.tar.gz" | sha256sum -c -; then
                tar xzf "${RUNNER_TEMP}/ko.tar.gz" -C "$dest" ko
                echo "$dest" >> "$GITHUB_PATH"
                "$dest/ko" version
                exit 0
              fi
              echo "::warning::ko checksum mismatch on attempt ${attempt} (truncated or corrupt download)"
            fi
            echo "ko install attempt ${attempt} failed; retrying"
            rm -f "${RUNNER_TEMP}/ko.tar.gz"
            sleep $((attempt * 5))
          done

          echo "::warning::release asset unavailable after 3 attempts; building ${KO_VERSION} from the Go module proxy"
          GOWORK=off GOBIN="$dest" go install "github.com/google/ko@${KO_VERSION}"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/ko" version

      - name: ko build (local, no push)
        working-directory: ${{ matrix.module }}
        env:
          KO_DOCKER_REPO: ghcr.io/devicechain-io
        # --local loads to the runner's Docker daemon and never pushes to a
        # registry. --base-import-paths keeps the local tag deterministic.
        #
        # Retry with backoff: the distroless base (cgr.dev/chainguard/static)
        # lives on a public registry that intermittently returns
        # MANIFEST_UNKNOWN for the :latest tag, flaking otherwise-green builds.
        # The retry absorbs those transient blips without masking a real
        # build failure (which fails all three attempts deterministically).
        run: |
          for attempt in 1 2 3; do
            if ko build --local --base-import-paths ./; then
              exit 0
            fi
            echo "::warning::ko build attempt ${attempt}/3 failed (likely a transient base-image registry blip); retrying..." >&2
            sleep $((attempt * 15))
          done
          echo "::error::ko build failed after 3 attempts" >&2
          exit 1

  # ---------------------------------------------------------------------------
  # The single required check.
  #
  # This job exists so branch protection has ONE stable name to require. The
  # alternative — listing the individual jobs — drifts silently in both
  # directions, and 38 of the ~56 check names are matrix-generated from the
  # workspace module list: adding a service leaves its `go (…)` check unrequired
  # (so it may go red and still merge), and removing one leaves a required name
  # that never reports again (so every PR waits forever).
  #
  # 🔴 `if: always()` IS LOAD-BEARING, AND WITHOUT IT THIS JOB IS WORSE THAN
  # NOTHING. A job whose `needs` failed is SKIPPED, not failed — and GitHub counts
  # a skipped required check as satisfied. So the obvious spelling of this job
  # (no `if:`, no body) reports success on exactly the runs it exists to block,
  # and does so while looking green in the UI. `always()` makes it run regardless,
  # and the step below is what turns the upstream results into a verdict.
  #
  # 🔴 The `needs` list is hand-written because Actions has no "needs: every job".
  # That is the same drift hazard one level up, so hack/check-ci-gate-complete.sh
  # asserts the list names every job in this file, and runs in the `actions` job.
  # ---------------------------------------------------------------------------
  ci-complete:
    name: ci-complete
    if: always()
    runs-on: ubuntu-latest
    needs:
      - discover
      - go
      - subscriptions
      - data-access
      - migrations
      - integration
      - license
      - actions
      - docs
      - frontend
      - csharp
      - unity-compile-check
      - helm
      - opentofu
      - image-smoke
    steps:
      # ANY result other than success fails the gate, including `skipped` and
      # `cancelled`. No job in this workflow is conditional, so a skip here means
      # an upstream failed or the run was cancelled — both of which must block.
      # The results arrive through the environment rather than interpolated into
      # the script, so nothing from the workflow context is ever executed as shell.
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort > /tmp/results
          if [ ! -s /tmp/results ]; then
            echo "::error::no upstream results were reported; this gate examined nothing"
            exit 1
          fi
          column -t /tmp/results || cat /tmp/results
          if grep -qv '^success' /tmp/results; then
            echo "::error::one or more required jobs did not succeed (see the table above)"
            exit 1
          fi
          echo "all $(wc -l < /tmp/results) jobs succeeded"
