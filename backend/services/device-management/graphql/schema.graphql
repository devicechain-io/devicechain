"""Why an alarm ended, when it was cleared for a lifecycle reason."""
enum AlarmClearReason {
    """The alarm's originator was deleted, so the alarm was cleared with it."""
    ORIGINATOR_DELETED
}

"""
A single alarm state change, pushed live to a subscriber. It is the transition envelope emitted by
the alarm engine and the operator actions, not the stored Alarm row: it carries the kind of
transition and, for a severity move, the prior severity, alongside a snapshot of the alarm after the
change. Address the alarm by alarmToken to re-query it.
"""
type AlarmEvent {
    """The lifecycle reason for clearing the alarm; absent for ordinary clears."""
    clearReason: AlarmClearReason
    """
    The transition: RAISED, ESCALATED, DEESCALATED, CLEARED or ACKNOWLEDGED. Treat an unknown value
    as a change you do not handle.
    """
    eventType: String!
    """Token of the alarm this event is about. Stable across the alarm's life."""
    alarmToken: String!
    """Entity type of the originator. Always device today."""
    originatorType: String!
    """Numeric id of the originator within the tenant, as a string."""
    originatorId: ID!
    """
    The originator's token, resolved on demand. Null when the originator is not a device or no
    longer exists.
    """
    originatorToken: String
    """The alarm key of the alarm, as on Alarm.alarmKey."""
    alarmKey: String!
    """Key of the measurement the raising rule watches, as on Alarm.metricKey."""
    metricKey: String!
    """The alarm's state after the transition: ACTIVE or CLEARED."""
    state: String!
    """The alarm's severity after the transition."""
    severity: String!
    """The severity held before an in-place change. Set only for ESCALATED and DEESCALATED; null otherwise."""
    previousSeverity: String
    """Whether the alarm is acknowledged after the transition."""
    acknowledged: Boolean!
    """Subject that acknowledged the alarm, or null when it is not acknowledged."""
    acknowledgedBy: String
    """The alarm's last recorded reading after the transition, as on Alarm.lastValue. Null when none."""
    lastValue: Float
    """
    When the alarm's current cycle began, as an RFC 3339 timestamp. Pair it with occurredTime to
    show how long the alarm has been active.
    """
    raisedTime: String
    """
    The event time that drove the transition, as an RFC 3339 timestamp: the measurement time, or the
    time of the operator's acknowledge or clear.
    """
    occurredTime: String!
    """Live suppression deadline carried by the event, as RFC 3339; null when absent."""
    suppressedUntil: String
    """Live window token carried by the event; null when absent, "restricted" for scoped humans when hidden or deleted."""
    suppressionWindowToken: String
    """Window token stamped at this cycle's raise; null when absent, "restricted" for scoped humans when hidden or deleted."""
    raisedDuringSuppression: String
}

"""Live feeds. Delivery is best-effort and at most once."""
type Subscription {
    """
    Streams alarm state changes for the subscriber's tenant, from subscribe time onward with no
    backfill; use the alarm queries for current state. Delivery is best-effort: an event can be
    dropped (a transient publish failure or a slow consumer), and the stored alarm is the source of
    truth. A client merging this stream into a live list must re-run the alarm queries on reconnect
    and periodically, so a dropped event cannot leave a ghost row, such as a missed CLEARED showing
    an active alarm. The optional filters narrow the feed to one originator, state, severity or
    alarm key. When originatorToken is given, originatorType is required, and the token is resolved
    to its id once at subscribe time.
    """
    alarmStream(
        """
        Entity type of the originator to follow, for example device. Required when originatorToken
        is set.
        """
        originatorType: String
        """Only events of the originator with this token. Requires originatorType."""
        originatorToken: String
        """Only events whose alarm is in this state after the change: ACTIVE or CLEARED."""
        state: String
        """Only events whose alarm is at this severity after the change."""
        severity: String
        """Only events of alarms with this alarm key."""
        alarmKey: String
        """
        Only events of alarms stamped with this anchor (see AlarmAnchor), judged on every pushed
        event, with the same limit to the subscriber's own devices as the queries. A customer
        outside the subscriber's access is refused when subscribing.
        """
        anchor: AlarmAnchor
    ): AlarmEvent!
}

"""How a suppression window opens."""
enum AlarmSuppressionKind {
    """A single bounded interval."""
    ONE_SHOT
    """Weekly openings in an IANA time zone."""
    RECURRING
}
"""One population of devices covered by a window."""
type AlarmSuppressionTarget {
    """DEVICE, DEVICE_TYPE, ENTITY_GROUP, AREA, ASSET, CUSTOMER or TENANT."""
