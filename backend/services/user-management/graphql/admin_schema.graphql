# exact-match allowlist; scopes is the set the client may request. hasSecret tells
# whether it is a confidential client (authenticates at the token endpoint with a
# secret) or a public PKCE client — the cleartext secret is never exposed here.
type AdminOAuthClient {
    """Server-assigned identifier. Address a client by its clientId, not by this."""
    id: ID!
    """When the client was registered, as an RFC 3339 timestamp."""
    createdAt: String
    """When the client was last changed, as an RFC 3339 timestamp."""
    updatedAt: String
    """The client's public identifier, as presented in authorization requests. It cannot be changed."""
    clientId: String!
    """Human-readable name. Null when none has been set."""
    name: String
    """Free-text description. Null when none has been set."""
    description: String
    """False when the client is disabled; the authorization and token endpoints then reject it."""
    enabled: Boolean!
    """The redirect addresses the client may use. A request must match one of them exactly."""
    redirectUris: [String!]!
    """The scopes the client may request."""
    scopes: [String!]!
    """
    True for a confidential client, which authenticates with a secret. False for a public
    client, which authenticates with PKCE instead.
    """
    hasSecret: Boolean!
}

"""
The result of registering a client or rotating its secret. This is the only time the
secret is shown.
"""
# The result of registering or rotating a client. clientSecret is the cleartext,
# returned EXACTLY ONCE (only its bcrypt hash is stored) — null for a public client.
# Capture it now; it cannot be retrieved again.
type AdminOAuthClientSecret {
    """The registered client as it now stands."""
    client: AdminOAuthClient!
    """
    The client's secret in clear text, returned only in this response and stored only as a
    hash, so it cannot be retrieved again; keep it now. Null when the client is public.
    """
    clientSecret: String
}

"""Fields for registering an OAuth client."""
# Data to register an OAuth client. clientId is its stable public identifier; each
# redirectUri must be https (or http for a loopback host) with no fragment; each
# scope must name a scope the AS grants (e.g. "read-only"). confidential requests a
# server-generated client secret (returned once) for a confidential client;
# omitted/false registers a public PKCE client.
input AdminOAuthClientCreateRequest {
    """
    The client's public identifier: letters, digits, `-`, `_` and `.`, at most 128
    characters. It cannot be changed.
    """
    clientId: String!
    """Human-readable name."""
    name: String
    """Free-text description."""
    description: String
    """
    The redirect addresses the client may use; at least one and at most 16, each at most
    2048 characters. Each must be an absolute https URL with no fragment and no embedded
    credentials. Plain http is accepted only for loopback hosts (`localhost`, `127.0.0.1`,
    `::1`). A longer list or entry is refused with error code LIMIT_EXCEEDED.
    """
    redirectUris: [String!]!
    """
    The scopes the client may request; at least one and at most 16, each at most 64
    characters. Supported scopes are `read-only` and `location`. A longer list or entry is
    refused with error code LIMIT_EXCEEDED.
    """
    scopes: [String!]!
    """
    True to register a confidential client, for which a secret is generated and returned
    once. False or omitted registers a public client that uses PKCE.
    """
    confidential: Boolean
}

"""
A partial update to an OAuth client. Omit a field to keep it, send a value to set it, or
send null to clear it. The client is named by the mutation's clientId argument, which
cannot be changed.
"""
# Data to update a client (its clientId is fixed and named by the mutation's own
# argument).
#
# A PARTIAL update: omitting a field leaves the stored value alone, sending null clears
# it, sending a value sets it. It used to be a full replace, so renaming a client also
# rewrote both of its allowlists from whatever the caller happened to send.
input AdminOAuthClientUpdateRequest {
    """New name, or null to clear it."""
    name: String
    """New description, or null to clear it."""
    description: String
    # The exact-match redirect allowlist and the scopes the client may request, each
    # REPLACED wholesale when sent. Nullable so the absent state exists — a non-null list
    # would be required by validation, leaving no way to say "leave these alone".
    #
    # EMPTYING EITHER IS REFUSED, by the same rules the create path applies: a client with
    # no redirect URI can never complete an authorization, and one registered for no scope
    # describes a permission set nobody can read. Null and [] are the same request here,
    # and both are rejected rather than one being quietly read as "leave it alone".
    """
    The complete new list of redirect addresses, replacing the current list and validated as
    for registration, including its bounds (at most 16, each at most 2048 characters; more
    is refused with error code LIMIT_EXCEEDED). It cannot be emptied: null or an empty list
    is rejected, so to keep the list unchanged omit the field.
    """
    redirectUris: [String!]
    """
    The complete new list of scopes the client may request, replacing the current list and
    validated as for registration, including its bounds (at most 16, each at most 64
    characters; more is refused with error code LIMIT_EXCEEDED). It cannot be emptied: null
    or an empty list is rejected, so to keep the list unchanged omit the field.
    """
    scopes: [String!]
}

"""One storage system's line in a tenant deletion's progress record."""
# One storage system's line in a deletion's ledger (ADR-077).
#
# A line is REWRITTEN on every pass rather than appended, so it is a standing claim about
# the store right now, not a log entry.
type TenantDeletionStore {
    """
    Short key of the storage system this line reports on, such as `rdb` for the relational
    database or `blob` for the object store.
    """
    # The store's ledger key: rdb, tsdb, broker, kv, detect, blob.
    store: String!
    """True once this storage system has reported that it holds nothing for the tenant."""
    # Whether this store has reported that it holds nothing for the tenant.
    complete: Boolean!
    """
    How much this storage system has erased so far, in records, counted across all passes.
    It shows that erasure ran; it is not a percentage of progress.
    """
    # How much this store has erased, ACCUMULATED ACROSS PASSES. It is evidence the sweep
    # ran, never a percentage: an erasure is idempotent and a deletion cannot finish on the
    # pass that erased something, so the per-pass figure is zero on every pass that could
    # complete one.
    rowsErased: Int!
    """
    A sentence describing data this storage system still holds and has not erased. Null
    means it holds nothing outstanding. While set it blocks the deletion from finishing and
    does not clear by itself; something has to change first.
    """
    # Data this store still HOLDS and did not erase, in a sentence. Null means nothing.
    # This is the field that blocks completion, and it does not clear on its own — it clears
    # when someone changes something.
    retaining: String
    """
    A sentence describing why the latest pass could not confirm this storage system is
    clean. Null when it succeeded. Unlike retaining, this is expected to clear by itself on
    a later pass.
    """
    # Why the last pass could not establish that the store is clean. Null on success. Unlike
    # retaining, this is expected to clear by itself on a later pass.
    lastError: String
    """
    A sentence describing something this storage system deliberately did not examine, or why
    it reported clean while erasing nothing, such as a store that does not exist on this
    instance. It qualifies a clean result and is not a problem to act on.
    """
    # What this store DECLINED TO LOOK AT, or the ground on which it reported clean while
    # erasing nothing — for example a telemetry database that does not exist on this
    # instance, or the key-value buckets a purge deliberately exempts.
    #
    # It is a QUALIFIER on a clean line and never a problem to act on: a store carrying a
    # note is working as designed. Present it as a footnote to "clean", not as a warning.
    note: String
    """When this storage system was last checked, as an RFC 3339 timestamp. Null if it has not been checked yet."""
    # When this store was last asked (RFC3339).
    attemptedAt: String
    """
    When this storage system first reported clean and has stayed clean on every check since,
    as an RFC 3339 timestamp. Null unless it is clean now.
    """
    # When this store FIRST reported clean and has reported clean on every pass since. Null
    # unless it is clean right now. The settle window is measured from the LATEST of these
    # across all stores, so one store going clean late holds the whole deletion.
    cleanSince: String
}

"""What a tenant deletion is currently waiting on."""
# What a deletion is currently waiting on (ADR-077).
#
# The three waits have different remedies — fix something, wait minutes, wait hours — and a
# surface that cannot tell them apart teaches an operator to escalate a healthy deletion.
enum DeletionWait {
    """
    At least one storage system has not reported clean. This is the only wait that needs a
    person; blockedBy says which system and why.
    """
    # At least one storage system has not reported clean. The only one a human can act on;
    # blockedBy says which and why.
    STORES
    """Every storage system is clean but has not yet stayed clean for the required settling period."""
    # Everything is clean, and has not been clean for long enough yet.
    SETTLE
    """
    Everything is clean and settled, but the deletion is not yet old enough to release the
    tenant's token for reuse.
    """
    # Everything is clean and settled; the deletion is not yet old enough to release its
    # token for reuse.
    TOKEN_HOLD
    """Nothing is outstanding."""
    # Nothing outstanding.
    NONE
}

"""
The durable record of one tenant deletion. It outlives the tenant: once the deletion
completes the tenant is gone, and this record is the evidence that its data was erased.
It deliberately holds no tenant name.
"""
# The durable record of one tenant deletion (ADR-077).
#
# 🔴 IT OUTLIVES THE TENANT, BY DESIGN. Completing a deletion removes the tenant row — that
# removal IS the token release — so a finished deletion has no tenant to hang off, and this
# record is the only surviving evidence that the erasure happened.
#
# A record is identified by (token, epoch) and NEVER by token alone: the token is released on
# completion and can be taken by a new tenant, so a lookup by token alone would attribute a
# predecessor's record to whoever holds that name now.
#
# It deliberately carries no tenant NAME. A record retaining "Acme Manufacturing GmbH" would
# leave the erasure's own evidence as the last place the customer's details lived.
type TenantDeletion {
    """
    Token of the deleted tenant. A token can be reused after a deletion finishes, so it
    identifies a deletion only together with epoch.
    """
    # The deleted tenant's token. Not unique on its own — see the type comment.
    token: String!
    """
    When the deletion was requested, as an RFC 3339 timestamp with fractional seconds. With
    the token it identifies the record; pass it back exactly as returned.
    """
    # When the deletion was requested (RFC3339). With the token, this identifies the record.
    epoch: String!
    """
    The tenant value the deleted tenant's audit journal entries are kept under: the token and
    the epoch joined by `~`. The entries are kept as evidence of the deletion, with the names
    in them removed, and are moved off the token so that a new tenant created later with the
    same token does not see them. Pass this as the `tenant` filter of `auditEvents` to read
    them.
    """
    # tenantpurge.RetainedTenant(token, epoch): what the purge re-keys every area's retained
    # audit_events rows to. One value per deletion, so two deletions of one token stay apart.
    retainedAuditTenant: String!
    """
    When every storage system had reported clean and the token was released, as an RFC 3339
    timestamp. Null while the deletion is in progress.
    """
    # When every storage system had reported clean and the token was released (RFC3339).
    # Null while the deletion is still in flight.
    completedAt: String
    """Total number of records erased across all storage systems."""
    # Total erased across every storage system.
    rowsErased: Int!
    """One line per storage system, ordered by name."""
    # One line per storage system, ordered by name.
    stores: [TenantDeletionStore!]!
    """
    One sentence for each storage system that is not yet clean, in that system's own words.
    Empty means nothing is blocking, which is not the same as finished: the deletion may
    still be waiting out a settling period or the token hold.
    """
    # One sentence per storage system that is not clean, in that store's own words. Empty
    # means nothing is blocking — which is NOT the same as finished, since a deletion with
    # nothing blocking is still waiting out one of its two windows.
    blockedBy: [String!]!
    """What the deletion is currently waiting on."""
    # Which wait is outstanding.
    awaiting: DeletionWait!
    """
    When the current waiting period ends, as an RFC 3339 timestamp. Null when the wait is
    not a timed period: while awaiting is STORES the deletion waits on the systems, not on
    a clock, and when awaiting is NONE nothing is pending.
    """
    # When the outstanding WINDOW elapses (RFC3339), or null when the wait is not a window.
    #
    # Null for STORES deliberately: a storage system holding data does not clear on a timer,
    # and a countdown there would promise something nothing will deliver.
    elapsesAt: String
}

"""
An identity provider connection: an external OpenID Connect provider that people sign in
through. The provider's client secret is write-only and is never returned.
"""
type IdpConnection {
    """Short unique token of the connection; it appears in the connection's callback address."""
    token: String!
    """Display name."""
    name: String!
    """
    Whose provider this is: `tenant` for a provider that serves one or more tenants' own people
    (its sign-ins can enter only those tenants and can never reach an identity holding a system
    role), or `instance` for the operator's own provider (linked to identities only by explicit
    action, and entering a tenant only as a superuser).
    """
    kind: String!
    """Whether sign-ins through this connection are accepted. A connection is created disabled."""
    enabled: Boolean!
    """The provider's issuer. Fixed when the connection is created."""
    issuer: String!
    """The client identifier registered at the provider."""
    clientId: String!
    """Whether a client secret is stored. The secret itself can never be read."""
    hasSecret: Boolean!
    """OAuth scopes requested at sign-in."""
    scopes: [String!]!
    """Name of the claim carrying the person's email address."""
    emailClaim: String!
    """
    Name of the claim carrying the person's group values, which role mappings match. Only a
    tenant connection reads it.
    """
    groupsClaim: String!
    """
    Whether a first sign-in creates an identity for a person no identity has the address of. An
    address that already has an identity is never linked automatically: it leaves a link request.
    """
    jitEnabled: Boolean!
    """Tokens of the tenant roles everyone who signs in through the connection holds in each tenant it serves."""
    defaultTenantRoles: [String!]!
    """The group-to-role mappings, across the tenants the connection serves."""
    roleMappings: [IdpRoleMapping!]!
    """Claims every sign-in must carry with exactly these values."""
    requiredClaims: [IdpClaimRequirement!]!
    """Authentication methods of which a sign-in must report at least one; empty for none required."""
    requiredAmr: [String!]!
    """
    How long a session through this connection lasts, in seconds, counted from the moment this
    service accepted the sign-in (not the provider's own authentication time) and never extended
    by a refresh. When it passes, the session ends at its next exchange and the person signs in
    again. 12 hours (43200) unless changed with setIdpSessionMaxAge.
    """
    sessionMaxAgeSeconds: Int!
    """Email domains this connection speaks for."""
    domains: [IdpDomain!]!
    """Tokens of the tenants a tenant connection serves; empty for an instance connection."""
    tenants: [String!]!
    """The address to register at the provider as this connection's redirect (callback) URI."""
    callbackUrl: String!
    """
    Whether signing out also signs the person out at the provider, through its approved
    sign-out endpoint. Off unless switched on with updateIdpConnection: signing out at the
    provider ends the person's session there for every application it serves. Has no effect
    while the approved discovery document names no sign-out endpoint.
    """
    providerSignOut: Boolean!
    """
    The certificates of the private CA bundle this provider's TLS certificate is verified
    against, in addition to the system's trusted roots. Empty when none is set.
    """
    caCertificates: [IdpCaCertificate!]!
    """
    The addresses to register at the provider as post-logout redirect URIs, one per app (the
    console's sign-in page and the dashboard app), for signing out at the provider. Empty when
    the instance has no public address.
    """
    signOutReturnUrls: [String!]!
    """The provider's discovery document as last fetched; sign-ins use only the endpoints approved here."""
    discovery: IdpDiscovery!
    """When the connection was created."""
    createdAt: String
    """When the connection was last changed."""
    updatedAt: String
}

"""A mapping from a provider group to a tenant role, within one tenant a connection serves."""
type IdpRoleMapping {
    """Token of the tenant."""
    tenant: String!
    """The group value in the provider's groups claim."""
    group: String!
    """Token of the tenant role members of the group hold."""
    role: String!
    """Whether the role carries the tenant's super-authority."""
    fullAuthority: Boolean!
}

"""One group-to-role mapping to set."""
input IdpRoleMappingInput {
    """The group value in the provider's groups claim."""
    group: String!
    """Token of a tenant role. System roles are refused."""
    role: String!
}

"""A claim a sign-in must carry, with the value it must have."""
type IdpClaimRequirement {
    """Claim name."""
    name: String!
    """Required value."""
    value: String!
}

"""A claim requirement to set on a connection."""
input IdpClaimRequirementInput {
    """Claim name, for example `hd` or `tid`."""
    name: String!
    """Required value."""
    value: String!
}

"""An email domain asserted for a connection."""
type IdpDomain {
    """The domain, lower-case ASCII."""
    domain: String!
    """When it was asserted."""
    verifiedAt: String!
    """Who asserted it."""
    verifiedBy: String!
}

"""The endpoints a connection will use, as fetched from the provider's discovery document."""
type IdpDiscovery {
    """The authorization endpoint."""
    authorizationEndpoint: String!
    """The token endpoint."""
    tokenEndpoint: String!
    """The address of the provider's signing keys."""
    jwksUri: String!
    """The provider's sign-out endpoint, when it has one."""
    endSessionEndpoint: String
    """When the document was fetched."""
    fetchedAt: String
    """Identifies this exact set of endpoints; pass it to approveIdpDiscovery to approve what you reviewed."""
    fingerprint: String!
    """Whether a person has approved these endpoints. Sign-ins are refused until they have."""
    approved: Boolean!
    """Who approved them."""
    approvedBy: String
    """When they were approved."""
    approvedAt: String
}

"""One certificate of a connection's private CA bundle."""
type IdpCaCertificate {
    """SHA-256 fingerprint of the certificate, in hex; compare it with the one your CA publishes."""
    fingerprintSha256: String!
    """Subject distinguished name."""
    subject: String!
    """Issuer distinguished name."""
    issuer: String!
    """Start of the validity period."""
    notBefore: String!
    """End of the validity period. The provider cannot be reached once the root it chains to has expired."""
    notAfter: String!
    """Whether the certificate says it is a certificate authority. A certificate that is not one is accepted (it pins that exact certificate) but is usually not what was meant."""
    isCa: Boolean!
}

"""Data to create a connection."""
input IdpConnectionCreateRequest {
    """Short unique token for the connection (letters, digits and hyphens)."""
    token: String!
    """Display name."""
    name: String!
    """`tenant` or `instance`."""
    kind: String!
    """The provider's issuer, an https address. A shared multi-tenant issuer must be pinned to your organisation by a required claim."""
    issuer: String!
    """The client identifier registered at the provider."""
    clientId: String!
    """The client secret. Write-only; leave out for a public client."""
    clientSecret: String
    """OAuth scopes to request; defaults to openid, email and profile."""
    scopes: [String!]
    """Name of the claim carrying the email address; defaults to `email`."""
    emailClaim: String
    """Name of the claim carrying group values; defaults to `groups`."""
    groupsClaim: String
    """Claims every sign-in must carry with exactly these values (Google needs `hd`, Microsoft needs `tid`)."""
    requiredClaims: [IdpClaimRequirementInput!]
    """Authentication methods of which a sign-in must report at least one."""
    requiredAmr: [String!]
    """
    For an instance connection with no required authentication methods: your statement that the
    provider enforces multi-factor sign-in. It is recorded in the audit journal.
    """
    mfaEnforcedByIdp: Boolean
    """
    PEM text of private CA certificates to trust, besides the system's roots, for this provider's
    TLS certificate (an on-premises provider whose certificate a private CA signed). Up to 64 KiB
    of CERTIFICATE blocks; a private key is refused. The provider's discovery document must be
    reachable under it.
    """
    caBundle: String
}

"""
Changes to a connection. A partial update: leaving a field out keeps its stored value. The
issuer, kind and token cannot be changed.
"""
input IdpConnectionUpdateRequest {
    """New display name."""
    name: String
    """True to accept sign-ins through the connection; enabling needs approved discovery."""
    enabled: Boolean
    """New client identifier."""
    clientId: String
    """New email claim name."""
    emailClaim: String
    """New groups claim name."""
    groupsClaim: String
    """The complete new list of scopes."""
    scopes: [String!]
    """The complete new list of required authentication methods."""
    requiredAmr: [String!]
    """True to sign people out at the provider too when they sign out; see IdpConnection.providerSignOut."""
    providerSignOut: Boolean
}

"""A sign-in that was refused because it matched an existing identity with no link. It grants nothing."""
type SsoLinkRequest {
    """Identifier of the request."""
    id: ID!
    """Token of the connection the sign-in came through."""
    connection: String!
    """The external account's subject at the provider."""
    subject: String!
    """The email address the provider asserted."""
    email: String!
    """When the sign-in was refused."""
    createdAt: String
    """Whether an identity with that email exists now."""
    identityExists: Boolean!
    """True when that identity is already linked on this connection under a different subject, which is what a recycled email address looks like."""
    subjectChanged: Boolean!
    """Tenants this connection serves where the identity already has a membership that no connection manages."""
    manualMemberships: [String!]!
}

"""
Read operations of the instance administration API. This API takes an identity token, not
a tenant access token, and each operation additionally requires the authority named in its
description. A superuser holds every authority.
"""
# Admin queries. Each requires a system authority (superusers hold "*").
type Query {
    """Liveness check. Always returns the string "pong"."""
    # Liveness placeholder.
    ping: String!
    """
    The names of the functional areas deployed on this instance, so a client can tell a
    feature that was never deployed from a server that is failing. It reports what the
    operator enabled, not whether each area is healthy. Requires only a valid identity token.
    """
    # The functional areas this instance deployed, so the admin console can tell
    # "this feature was never deployed here" apart from "the server is broken"
    # instead of surfacing a raw HTTP status. Reports DESIRED state (what the
    # operator deployed), never health.
    functionalAreas: [String!]!
    """
    Every identity on the instance, with its system roles and memberships. The list is not
    paged. Requires user:read.
    """
    # List the full identity directory (requires user:read).
    identities: [AdminIdentity!]!
    """
    Every tenant, including any that are being deleted. The list is not paged. Requires
    tenant:read.
    """
    # List every tenant (requires tenant:read).
    tenants: [AdminTenant!]!
    """The tier catalog in the operator's listing order. Requires tenant:read."""
    # List the tenant tier catalog (requires tenant:read). Gated on the tenant
    # authorities rather than one of its own: a tier is tenant-registry packaging,
    # administered on the same plane by the same operator.
    tenantTiers: [AdminTenantTier!]!
    """
    The governance dimensions the platform defines, so an editor can offer exactly the
    settings a tier or tenant may carry. The answer does not depend on the tenant. Requires
    tenant:read.
    """
    # The governance dimensions the platform declares (requires tenant:read), so a
    # tier editor can offer exactly the settings a tier may carry rather than keep
    # its own list of them. Static for a given build; not tenant-specific.
    governanceDimensions: [AdminGovernanceDimension!]!
    """The color names a tier may be given. Requires tenant:read."""
    # The tier color palette (requires tenant:read) — the closed set a tier's color is
    # chosen from, so the console picker offers exactly what the server will accept.
    # Static for a given build.
    tierColorPalette: TierColorPalette!
    """
    The role catalog, optionally limited to one scope. Fails if scope is neither `system`
    nor `tenant`. Requires role:read.
    """
    # List the role catalog, optionally filtered to a scope (requires role:read).
    roles(
        """`system` or `tenant`. Omit it to list roles of both scopes."""
        scope: String
    ): [AdminRole!]!
    """
    The authorities that can be granted to a role, sorted, including `*`. With a scope, only
    the authorities a role of that scope may grant, since a role cannot be granted an
    authority that belongs to the other scope. Fails if scope is neither `system` nor
    `tenant`. Requires role:read.
    """
    # The authority vocabulary (sorted, includes "*"), for offering a checklist when
    # defining a role rather than free-text entry (requires role:read). With a scope
    # ("system" | "tenant") it returns only the authorities a role at that scope may
    # grant: an authority's tier and a role's scope must agree (ADR-065), so an
    # unfiltered list would offer a tenant role an operator authority the write path
    # then refuses. Omit the scope for the whole vocabulary.
    authorities(
        """`system` or `tenant`. Omit it to list every authority."""
        scope: String
    ): [String!]!
    """
    Searches the audit journal of sign-ins, token refreshes and administrative changes,
    across all tenants, newest first. Requires audit:read.
    """
    # Query the instance audit journal for user-management — auth events plus
    # identity/role/tenant administration, newest first (requires audit:read).
    auditEvents(
        """Filters and paging for the search."""
        criteria: AdminAuditEventSearchCriteria!
    ): AdminAuditEventSearchResults!
    """
    Searches the work the platform accepted and gave up on, across all tenants, newest
    first. Requires audit:read.
    """
    # Work the platform accepted and gave up on, newest first. Instance-wide: the
    # question an operator asks here is "what has been failing", which is not a
    # per-tenant question even though every answer names a tenant.
    deadLetters(
        """Filters and paging for the search."""
        criteria: DeadLetterSearchCriteria!
    ): DeadLetterSearchResults!

    """
    One dead-letter record by its id. Returns null if there is none; fails if the id is not
    a number. Requires audit:read.
    """
    # One dead letter by id, or null.
    deadLetter(
        """Id of the record, as returned in the id field."""
        id: ID!
    ): DeadLetter

    """
    The deletion record for one tenant token, with the progress of each storage system.
    Returns null if there is no such record. Requires tenant:read.
    """
    # One tenant deletion record with its per-store ledger (requires tenant:read).
    #
    # Omit epoch to ask for the token's IN-FLIGHT deletion, which is unambiguous because at
    # most one can be in flight at a time. A historical one must name its epoch: the token is
    # reusable, so token alone does not identify a deletion. Null when there is no such
    # record.
    tenantDeletion(
        """Token of the deleted tenant."""
        token: String!
        """
        The epoch of the deletion, as returned in the epoch field, to select a particular
        past deletion. Omit it to get the deletion currently in progress for the token. It
        must be an RFC 3339 timestamp and is matched exactly, fractional seconds included.
        """
        epoch: String
    ): TenantDeletion
    """
    Tenant deletion records, newest first, including those that have finished. They cover
    the whole instance and outlive the tenants they describe. Requires tenant:read.
    """
    # Deletion records newest cut first (requires tenant:read). Instance-wide and
    # cross-tenant, because a record outlives the tenant it describes — there is no tenant to
    # scope it to. Pass completed to filter to finished or in-flight deletions.
    tenantDeletions(
        """Paging and an optional filter on whether the deletion has finished."""
        criteria: TenantDeletionSearchCriteria!
    ): TenantDeletionSearchResults!
    """The registered OAuth clients. Requires client:read."""
    # List the OAuth 2.1 client registry (requires client:read).
    oauthClients: [AdminOAuthClient!]!

    """
    Lists the configured identity provider connections. Client secrets are never included.
    Requires user:read.
    """
    idpConnections: [IdpConnection!]!
    """
    Returns one identity provider connection, or null if there is none with that token.
    Requires user:read.
    """
    idpConnection(
        """Token of the connection."""
        token: String!
    ): IdpConnection
    """
    Lists the sign-ins refused because they matched an existing identity with no link, oldest
    first, for a superuser to approve or reject. Requires user:read.
    """
    ssoLinkRequests: [SsoLinkRequest!]!
}

"""
Write operations of the instance administration API. This API takes an identity token, not
a tenant access token, and each operation additionally requires the authority named in its
description. A superuser holds every authority.
"""
# Admin mutations. Identity + membership administration requires user:write
# (superusers hold "*"). All return the affected identity (re-loaded) unless noted.
type Mutation {
    """
    Creates an identity with the given system roles and returns it. Fails if the email is
    already in use (error code CONFLICT), if the password is empty, or if a system role does
    not exist. Requires user:write.
    """
    # Create a global identity with the given system roles.
    createIdentity(
        """The identity to create."""
        request: AdminIdentityCreateRequest!
    ): AdminIdentity!
    """
    Enables or disables an identity and returns it. A disabled identity cannot sign in.
    Disabling also ends every session the identity has, so re-enabling does not revive them;
    tokens already issued stop working when they expire (15 minutes by default). Fails if the
    identity does not exist. Requires user:write.
    """
    # Enable or disable an identity (disabled identities cannot authenticate).
    # Disabling also ends every refresh session the identity holds, so re-enabling
    # does not bring them back; identity and access tokens already issued run out
    # their own (short) lifetime.
    setIdentityEnabled(
        """Email of the identity."""
        email: String!
        """True to enable, false to disable."""
        enabled: Boolean!
    ): AdminIdentity!
    """
    Replaces the identity's system roles with exactly those given and returns the identity.
    An empty list removes them all. Fails if the identity does not exist or a role does not
    exist with system scope. Requires user:write.
    """
    # Replace an identity's system-role assignments (role tokens, system scope).
    setSystemRoles(
        """Email of the identity."""
        email: String!
        """Tokens of the system roles the identity should hold."""
        roleTokens: [String!]!
    ): AdminIdentity!
    """
    Replaces an identity's password and returns the identity. This also ends every session
    the identity has, so it must sign in again; tokens already issued stop working when they
    expire (15 minutes by default). Fails if the password is empty or the identity does not
    exist. Requires user:write.
    """
    # Replace an identity's password (hashed server-side). Also ends every refresh
    # session the identity holds; identity and access tokens already issued run out
    # their own (short) lifetime.
    setPassword(
        """Email of the identity."""
        email: String!
        """The new password. It must not be empty."""
        password: String!
    ): AdminIdentity!
    """
    Deletes an identity together with its memberships. Returns true if one was deleted and
    false if there was no such identity. Its sessions end with it, and an identity later
    created with the same email does not inherit them. Requires user:write.
    """
    # Delete an identity and its memberships; returns whether one was removed. Its
    # refresh sessions end with it, and an identity created again under the same
    # email does not inherit them.
    deleteIdentity(
        """Email of the identity."""
        email: String!
    ): Boolean!
    """
    Removes an identity's two-factor authentication (a lost phone): the authenticator, the
    recovery codes and the stored secret go, every session the identity has ends, and the next
    password sign-in asks for no code. Returns the identity.

    If the factor has wrong codes on record or is locked, the password may be in use by someone
    else, so newPassword is required and is set in the same step; without it the call fails
    with the error code MFA_RESET_NEEDS_PASSWORD and changes nothing. Resetting an identity that
    holds a system role needs a superuser caller. An identity with no second factor fails with
    an error. Requires user:write.
    """
    resetIdentityMfa(
        """Email of the identity."""
        email: String!
        """A new password to set together with the reset. Required while the factor has failed attempts outstanding."""
        newPassword: String
    ): AdminIdentity!

    """
    Adds an identity to a tenant with the given tenant roles and returns the identity. The
    membership starts enabled. The roles may be instance roles with tenant scope or roles the
    tenant defined for itself. Fails if the identity or tenant does not exist, if the tenant
    is being deleted, if a role is not assignable in the tenant, if the scope has more than
    16 anchors (LIMIT_EXCEEDED) or names a group (INVALID_VALUE), or if the identity is
    already a member of the tenant (error code CONFLICT). Requires user:write.
    """
    # Bind an identity to an existing tenant with the given tenant roles and scope.
    addMembership(
        """Email of the identity."""
        email: String!
        """Token of the tenant."""
        tenant: String!
        """Tokens of the tenant roles to grant in the tenant."""
        roleTokens: [String!]!
        """
        The customers to limit the membership to. Omit it, or send an empty list, for the
        whole tenant.
        """
        scope: [ScopeAnchorInput!]
    ): AdminIdentity!
    """
    Replaces the customers and groups a membership is limited to and returns the identity. An empty list
    gives the whole tenant. The change takes effect at the identity's next token refresh
    (within 15 minutes; 5 for customer-scoped access): an access token already issued keeps
    its old scope until it expires, and its sessions in other tenants are not affected. Fails if the identity has no membership in
    the tenant, or for more than 16 anchors (LIMIT_EXCEEDED).
    Requires user:write.
    """
    setMembershipScope(
        """Email of the identity."""
        email: String!
        """Token of the tenant."""
        tenant: String!
        """The customers to limit the membership to; empty for the whole tenant."""
        scope: [ScopeAnchorInput!]!
    ): AdminIdentity!
    """
    Replaces the tenant roles an identity holds in a tenant with exactly those given and
    returns the identity. Fails if the identity has no membership in the tenant or a role is
    not assignable in the tenant. Adding or taking away authorities takes effect at the
    identity's next token refresh (within 15 minutes; 5 for customer-scoped access): an access
    token already issued keeps its old authorities until it expires. Requires user:write.
    """
    # Replace a membership's tenant-role assignments (role tokens, tenant scope).
    setMembershipRoles(
        """Email of the identity."""
        email: String!
        """Token of the tenant."""
        tenant: String!
        """Tokens of the tenant roles the identity should hold in the tenant."""
        roleTokens: [String!]!
    ): AdminIdentity!
    """
    Enables or disables an identity's membership in a tenant and returns the identity. A
    disabled membership cannot be used to enter the tenant: disabling one takes effect at the
    identity's next token refresh (within 15 minutes; 5 for customer-scoped access), which is
    refused for this tenant, while an access token already issued keeps working until it
    expires. Its sessions in other tenants are not affected. Fails if the identity has no membership in the tenant. Requires user:write.
    """
    # Enable or disable a membership (a disabled membership cannot be selected).
    setMembershipEnabled(
        """Email of the identity."""
        email: String!
        """Token of the tenant."""
        tenant: String!
        """True to enable, false to disable."""
        enabled: Boolean!
    ): AdminIdentity!
    """
    Removes an identity's membership in a tenant and returns the identity. This takes effect
    as disabling the membership does, at the identity's next token refresh. Fails if the identity has no membership in
    the tenant. Requires user:write.
    """
    # Remove an identity's membership in a tenant.
    removeMembership(
        """Email of the identity."""
        email: String!
        """Token of the tenant."""
        tenant: String!
    ): AdminIdentity!

    """
    Creates a role and returns it. Fails if the scope is not `system` or `tenant`, if an
    authority is unknown or belongs to the other scope, or if the token is already used in
    that scope (error code CONFLICT). Requires role:write.
    """
    # Create a role granting a set of authorities (requires role:write).
    createRole(
        """The role to create."""
        request: AdminRoleCreateRequest!
    ): AdminRole!
    """
    Applies a partial update to a role and returns it. Fails if the role does not exist or
    the resulting authorities are not valid for its scope. Requires role:write.
    """
    # Apply a partial update to a role by scope + token: an omitted field is left
    # alone, a null clears it, a value sets it (requires role:write).
    updateRole(
        """`system` or `tenant`: the scope of the role to update."""
        scope: String!
        """Token of the role to update."""
        token: String!
        """The changes to apply."""
        request: AdminRoleUpdateRequest!
    ): AdminRole!
    """
    Deletes a role and removes it from everything it was assigned to. Returns true if it was
    deleted and false if there was no such role. The `superuser` system role cannot be
    deleted, so the instance cannot be locked out of this API. Requires role:write.
    """
    # Delete a role by scope + token; returns whether one was removed. The
    # superuser system role is protected (requires role:write).
    deleteRole(
        """`system` or `tenant`: the scope of the role to delete."""
        scope: String!
        """Token of the role to delete."""
        token: String!
    ): Boolean!

    """
    Creates a tier and returns it. It is placed at display order 0. Fails if the config has
    an unknown key or an out-of-range value, if the color is not in the palette, or if the
    token is already used (error code CONFLICT). The catalog holds at most 100 tiers; a
    create beyond that is refused with error code LIMIT_EXCEEDED. Requires tenant:write.
    """
    # Create a tenant tier (requires tenant:write).
    createTenantTier(
        """The tier to create."""
        request: AdminTenantTierCreateRequest!
    ): AdminTenantTier!
    """
    Applies a partial update to a tier and returns it. This changes the limits of every
    tenant at the tier, taking effect within about a minute and without a deployment. Fails
    if the tier does not exist, the config has an unknown key or an out-of-range value, or the
    color is not in the palette. Requires tenant:write.
    """
    # Apply a partial update to a tier by token: an omitted field is left alone, a
    # null clears it, a value sets it. This changes behavior for every tenant at the
    # tier, live and with no deploy (requires tenant:write).
    updateTenantTier(
        """Token of the tier to update."""
        token: String!
        """The changes to apply."""
        request: AdminTenantTierUpdateRequest!
    ): AdminTenantTier!
    """
    Deletes a tier. Returns true if it was deleted and false if there was no such tier.
    Fails (error code REFERENCE_VIOLATION) while any tenant is still at the tier. Requires
    tenant:write.
    """
    # Delete a tier by token; returns whether one was removed. Refused while any
    # tenant is still packaged at it (requires tenant:write).
    deleteTenantTier(
        """Token of the tier to delete."""
        token: String!
    ): Boolean!
    # Set the operator's listing order for the whole tier catalog (requires
    # tenant:write). orderedTokens must be exactly the current tiers — a stale client
    # (one that has not seen a tier just added or deleted) is refused rather than
    # silently dropping it. Presentation only: it changes where tiers appear, nothing
    # about what any tier grants.
    """
    Sets the listing order of the tiers and returns them in the new order. The list must
    name every existing tier exactly once; if it omits, repeats or invents a tier the
    request fails and nothing changes, which also catches a client working from a stale
    list. A list longer than 100 (the catalog's own bound), or a token longer than 128
    characters, is refused with error code LIMIT_EXCEEDED. It changes only how tiers are
    ordered in lists, not what any tier grants. Requires tenant:write.
    """
    reorderTenantTiers(
        """Tokens of every tier, in the desired order, first to last."""
        orderedTokens: [String!]!
    ): [AdminTenantTier!]!

    """
    Creates a tenant at the given tier and returns it. The tenant starts enabled. Fails if
    the tier does not exist, a limit is out of range, the token is already used by an active
    tenant (error code CONFLICT), or the token is reserved by a tenant that is still being
    deleted. Requires tenant:write.
    """
    # Create a tenant, enabled by default, at the requested tier (requires tenant:write).
    createTenant(
        """The tenant to create."""
        request: AdminTenantCreateRequest!
    ): AdminTenant!
    """
    Applies a partial update to a tenant and returns it. If any value is invalid the whole
    update is rejected and nothing is changed. Fails if the tenant does not exist. Requires
    tenant:write.
    """
    # Apply a partial update to a tenant by token: an omitted field is left alone, a
    # null clears it, a value sets it. Omitting a governance override no longer clears
    # it — a null does, reverting the tenant to its tier and then to the platform
    # default, never to unlimited (requires tenant:write).
    updateTenant(
        """Token of the tenant to update."""
        token: String!
        """The changes to apply."""
        request: AdminTenantUpdateRequest!
    ): AdminTenant!
    """
    Enables or disables a tenant and returns it. Members of a disabled tenant cannot enter it
    (a superuser still can); sessions already open are refused at their next refresh. Fails if
    the tenant does not exist. Requires tenant:write.
    """
    # Enable or disable a tenant (requires tenant:write).
    setTenantEnabled(
        """Token of the tenant."""
        token: String!
        """True to enable, false to disable."""
        enabled: Boolean!
    ): AdminTenant!
    """
    Begins permanently deleting a tenant, which cannot be undone. Sign-ins and token
    refreshes for the tenant are refused at once for its members (a superuser can still enter,
    to operate the deletion), and its data is then erased from every storage system in the
    background; track that with tenantDeletion. Returning true means the deletion has started, not that the data
    is already gone. The tenant's token stays reserved until the deletion completes (see tenantDeletion). Returns
    false, changing nothing, if there is no such tenant or it is already being deleted. Fails
    (error code REFERENCE_VIOLATION) while any identity still has a membership in the
    tenant: remove the memberships first. Requires tenant:write.
    """
    # Begin deleting a tenant by token; returns whether the delete was accepted.
    # It does NOT remove the row: the tenant moves to `purging` with its access cut
    # immediately, and its data is reclaimed afterwards by the purge coordinator,
    # which removes the row and releases the token once every store reports clean.
    # Idempotent in both directions — an unknown or already-purging tenant returns
    # false. Rejected while the tenant still has memberships (requires tenant:write).
    deleteTenant(
        """Token of the tenant to delete."""
        token: String!
    ): Boolean!

    """
    Registers an OAuth client and returns it. The client starts enabled. For a confidential
    client the response also carries its secret, shown only this once. Fails if the clientId is
    invalid or already used (error code CONFLICT), or a redirect address or scope is not
    acceptable. Requires client:write.
    """
    # Register an OAuth client, enabled by default (requires client:write). Returns
    # the client plus, for a confidential client, its one-time cleartext secret.
    createOauthClient(
        """The client to register."""
        request: AdminOAuthClientCreateRequest!
    ): AdminOAuthClientSecret!
    """
    Applies a partial update to a client and returns it. Neither the redirect addresses nor
    the scopes may be emptied. Fails if the client does not exist or a value is not
    acceptable. Requires client:write.
    """
    # Apply a partial update to a client by clientId: an omitted field is left alone, a
    # null clears it, a value sets it. Neither allowlist may be emptied (requires
    # client:write).
    updateOauthClient(
        """The clientId of the client to update."""
        clientId: String!
        """The changes to apply."""
        request: AdminOAuthClientUpdateRequest!
    ): AdminOAuthClient!
    """
    Enables or disables a client and returns it. A disabled client is rejected at the
    authorization and token endpoints. Fails if the client does not exist. Requires
    client:write.
    """
    # Enable or disable a client; a disabled client is rejected at the authorize /
    # token endpoints (requires client:write).
    setOauthClientEnabled(
        """The clientId of the client."""
        clientId: String!
        """True to enable, false to disable."""
        enabled: Boolean!
    ): AdminOAuthClient!
    """
    Generates a new secret for a client and returns it once, invalidating the previous
    secret. Rotating the secret of a public client makes it a confidential client. Fails if
    the client does not exist. Requires client:write.
    """
    # Mint a fresh secret for a client (promotes a public client to confidential),
    # invalidating any previous one. Returns the new one-time secret (requires
    # client:write).
    rotateOauthClientSecret(
        """The clientId of the client."""
        clientId: String!
    ): AdminOAuthClientSecret!
    """
    Deletes a client. Returns true if it was deleted and false if there was no such client.
    Requires client:write.
    """
    # Delete a client by clientId; returns whether one was removed (requires
    # client:write).
    deleteOauthClient(
        """The clientId of the client to delete."""
        clientId: String!
    ): Boolean!

    """
    Creates an identity provider connection and returns it. The connection starts disabled and
    its discovery document is fetched (through the egress guard) and held for approval; review it
    with idpConnection, then approveIdpDiscovery and updateIdpConnection to enable it. Fails if
    this instance has no public issuer address ("sso requires a public issuer URL"), the token is
    taken, the issuer cannot be pinned to one organisation (Microsoft needs its tenant id and a
    `tid` requirement; Google needs an `hd` requirement), the provider cannot be reached, or an
    instance connection has neither required authentication methods nor mfaEnforcedByIdp.
    Requires user:write.
    """
    createIdpConnection(
        """The connection to create."""
        request: IdpConnectionCreateRequest!
    ): IdpConnection!
    """
    Applies a partial update to a connection and returns it. Enabling a connection needs its
    discovery snapshot approved. Disabling it ends its sessions at their next exchange: their
    refresh tokens stop working at once, and an access token already issued runs until it
    expires (15 minutes by default). An identity token already issued for an instance connection
    likewise keeps working on the admin API until it expires. Disabling the last enabled
    connection serving a tenant that requires single sign-on is refused with the error code
    SSO_ENFORCED_TENANT_STRANDED (its `tenants` extension names them): turn the requirement off
    with setTenantSsoEnforced first. Requires user:write.
    """
    updateIdpConnection(
        """Token of the connection."""
        token: String!
        """The changes to apply."""
        request: IdpConnectionUpdateRequest!
    ): IdpConnection!
    """
    Replaces the claims every sign-in through the connection must carry, and returns the
    connection. The issuer rules still apply: a Google connection cannot drop `hd` nor a
    Microsoft one `tid`. Requires user:write.
    """
    setIdpRequiredClaims(
        """Token of the connection."""
        token: String!
        """The complete new list of required claims."""
        claims: [IdpClaimRequirementInput!]!
    ): IdpConnection!
    """
    Deletes a connection together with its tenants, domains, links, pending requests and sealed
    client secret. Memberships it managed are disabled, not removed. Its sign-ins end at their next
    exchange; an identity token already issued for an instance connection keeps working on the
    admin API until it expires (15 minutes by default). Deleting the last enabled connection
    serving a tenant that requires single sign-on is refused with the error code
    SSO_ENFORCED_TENANT_STRANDED: turn the requirement off with setTenantSsoEnforced first.
    Returns true if it was deleted and false if there was no such
    connection. Requires user:write.
    """
    deleteIdpConnection(
        """Token of the connection."""
        token: String!
    ): Boolean!
    """
    Stores a connection's client secret, replacing any earlier one, and returns the connection.
    The secret is write-only and can never be read back. Requires user:write.
    """
    setIdpConnectionSecret(
        """Token of the connection."""
        token: String!
        """The client secret."""
        secret: String!
    ): IdpConnection!
    """
    Replaces a connection's private CA bundle and returns the connection; an empty bundle clears
    it, returning the connection to the system's trusted roots alone. A new bundle must verify the
    provider: its discovery document is fetched under it before anything is saved, and when that
    document names different endpoints than the approved ones the approval is withdrawn. The
    bundle is PEM text (up to 64 KiB of CERTIFICATE blocks); a private key is refused and never
    echoed. Requires user:write.
    """
    setIdpCaBundle(
        """Token of the connection."""
        token: String!
        """The PEM certificates, or an empty string to clear."""
        caBundle: String!
    ): IdpConnection!
    """
    Sets exactly which tenants a tenant connection serves, and returns it. Sign-ins through it
    can enter those tenants and no others. Fails for an instance connection or an unknown tenant,
    and refuses to drop a tenant that requires single sign-on when this is the last enabled
    connection serving it, with the error code SSO_ENFORCED_TENANT_STRANDED. Requires user:write.
    """
    setIdpConnectionTenants(
        """Token of the connection."""
        token: String!
        """Tokens of the tenants it serves."""
        tenants: [String!]!
    ): IdpConnection!
    """
    Asserts that a connection speaks for an email domain, recorded with your name, and returns the
    connection. Freemail providers and public suffixes are refused, and a domain belongs to one
    connection. Requires user:write.
    """
    addIdpDomain(
        """Token of the connection."""
        token: String!
        """The domain, for example `example.com`."""
        domain: String!
    ): IdpConnection!
    """Removes a domain from a connection and returns the connection. Requires user:write."""
    removeIdpDomain(
        """Token of the connection."""
        token: String!
        """The domain to remove."""
        domain: String!
    ): IdpConnection!
    """
    Fetches the provider's discovery document again and returns the connection. If the endpoints
    changed, the new ones replace the snapshot and its approval is withdrawn: the connection
    refuses sign-ins until approveIdpDiscovery. Requires user:write.
    """
    refreshIdpDiscovery(
        """Token of the connection."""
        token: String!
    ): IdpConnection!
    """
    Approves the connection's current discovery snapshot and returns the connection. Fails if the
    snapshot is no longer the one with this fingerprint. Requires user:write.
    """
    approveIdpDiscovery(
        """Token of the connection."""
        token: String!
        """The fingerprint of the snapshot you reviewed."""
        fingerprint: String!
    ): IdpConnection!
    """
    Links an external account to an identity: signing in at the provider as this subject signs in
    as this identity. This is how an instance connection reaches an identity. A tenant connection
    refuses an identity that holds a system role. Fails if the identity or connection does not
    exist, or either side is already linked. Requires user:write.
    """
    linkIdentity(
        """Email of the identity."""
        email: String!
        """Token of the connection."""
        connection: String!
        """The external account's subject at the provider."""
        subject: String!
    ): Boolean!
    """
    Removes an identity's link on a connection; its sign-ins through that connection end at their
    next exchange. Returns true if a link was removed. Requires user:write.
    """
    unlinkIdentity(
        """Email of the identity."""
        email: String!
        """Token of the connection."""
        connection: String!
    ): Boolean!
    """
    Approves a pending link request: the external account is linked to the identity that has the
    request's email NOW. If that identity already holds memberships in the connection's tenants
    that no connection manages, say what becomes of them: `convert` makes the connection manage
    them, `keep_manual` leaves them. Requires user:write.
    """
    approveSsoLinkRequest(
        """Identifier of the request."""
        id: ID!
        """`convert` or `keep_manual`; required when the identity has such memberships."""
        membershipDisposition: String
    ): Boolean!
    """
    Replaces a tenant connection's group-to-role mappings for one tenant it serves, and returns
    the connection. At each sign-in the person's membership in that tenant is recomputed: the
    connection's default roles plus the role of every mapping whose group they hold; none at all
    disables it. Only memberships the connection manages are touched, never manual ones. Roles
    are tenant roles only: a system role is refused. A role with full authority in the tenant
    needs acknowledgeFullAuthority. Takes effect at each person's next sign-in. Requires user:write.
    """
    setIdpRoleMappings(
        """Token of the connection."""
        connection: String!
        """Token of the tenant; the connection must serve it."""
        tenant: String!
        """The complete new set of mappings for the tenant."""
        mappings: [IdpRoleMappingInput!]!
        """Must be true to map a group to a role with full authority."""
        acknowledgeFullAuthority: Boolean
    ): IdpConnection!
    """
    Sets whether a tenant connection creates identities at first sign-in (only for an address no
    identity has) and the tenant roles everyone who signs in through it holds, and returns the
    connection. An instance connection takes neither. A role with full authority needs
    acknowledgeFullAuthority. Requires user:write.
    """
    setIdpJit(
        """Token of the connection."""
        connection: String!
        """Whether first sign-ins create identities."""
        enabled: Boolean!
        """Tokens of the tenant roles every person holds in each tenant the connection serves."""
        defaultTenantRoles: [String!]!
        """Must be true to grant a role with full authority to everyone."""
        acknowledgeFullAuthority: Boolean
    ): IdpConnection!
    """
    Requires (or stops requiring) that a tenant's people sign in through single sign-on, and
    returns the tenant. Turning it on needs at least one enabled connection serving the tenant,
    so its people are not locked out (refused otherwise with the error code
    SSO_ENFORCE_NO_CONNECTION), and ends the password sessions already inside the tenant
    at their next refresh. Superusers are exempt and each of their entries is audited, so an
    identity provider outage never locks the operator out. Requires user:write.
    """
    setTenantSsoEnforced(
        """Token of the tenant."""
        tenant: String!
        """Whether single sign-on is required."""
        enforced: Boolean!
    ): AdminTenant!
    """
    Requires (or stops requiring) a second factor of a tenant's password sign-ins and returns the
    tenant. While it is on, a member whose sign-in did not use a second factor is refused entry
    (error codes MFA_REQUIRED and MFA_ENROLLMENT_REQUIRED) and password sessions already inside
    are refused at their next refresh; a member can still sign in and set up their own
    authenticator, so nobody is stranded. Superusers are exempt and each of their entries is
    audited. It cannot turn off a requirement the tenant's tier sets. Requires user:write.
    """
    setTenantMfaRequired(
        """Token of the tenant."""
        tenant: String!
        """Whether a second factor is required."""
        required: Boolean!
    ): AdminTenant!
    """
    Sets how long a session through a connection lasts, in seconds, and returns the connection.
    The allowed range is 900 (15 minutes) to 604800 (7 days); the upper bound is lower when the
    deployment's refresh token lifetime is shorter, and a value set before that lifetime was
    shortened is held to the new bound when sessions are checked. The lifetime counts from the moment this
    service accepted the sign-in and is never extended by a refresh. It applies to sessions
    already open, at their next exchange. Requires user:write.
    """
    setIdpSessionMaxAge(
        """Token of the connection."""
        connection: String!
        """The session lifetime in seconds."""
        seconds: Int!
    ): IdpConnection!
    """
    Ends every session an identity has, on every device: password and single sign-on, console,
    dashboard and MCP. Each ends at its next exchange; the access and identity tokens already
    issued stop working when they expire, 15 minutes by default (on the admin API too). The password
    is unchanged and the person can sign in again at once. Returns how many sign-ins it ended.
    Fails if the identity does not exist. Requires user:write.
    """
    revokeSessions(
        """Email of the identity."""
        email: String!
    ): Int!
    """
    Removes an identity's password, so it can sign in only through single sign-on, and ends
    every session it has. Returns the identity. Fails if the identity does not exist, and is
    refused unless the identity is linked to an enabled connection it can sign in through (an
    instance connection for an identity holding a system role), so it is never left with no way
    in. Requires user:write.
    """
    clearPassword(
        """Email of the identity."""
        email: String!
    ): AdminIdentity!
    """Rejects a pending link request, deleting it. Returns true if it existed. Requires user:write."""
    rejectSsoLinkRequest(
        """Identifier of the request."""
        id: ID!
    ): Boolean!
}

schema {
    query: Query
    mutation: Mutation
}
