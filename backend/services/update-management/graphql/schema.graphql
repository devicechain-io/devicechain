# The update-management data plane: the per-tenant catalogue of update artifacts (firmware,
# software and configuration images). An artifact is declared here, its bytes are uploaded
# to the content endpoint PUT /updates/artifacts/{token}/content, and it is then AVAILABLE.
# Artifacts are immutable once available. An available artifact is assigned to a device, which
# downloads it through a short-lived grant and reports its progress; the platform tracks each
# update attempt through to the running version.
schema {
    query: Query
    mutation: Mutation
}

"""Pagination info for search results."""
type SearchResultsPagination {
    """Zero-based index of the first record on this page."""
    pageStart: Int
    """Zero-based index of the last record on this page."""
    pageEnd: Int
    """Total number of records matching the search."""
    totalRecords: Int
}

"""Static service identity: the deployed functional area (non-sensitive)."""
type ServiceInfo {
    """The functional area this service is deployed as."""
    area: String!
    """
    Whether this instance lets an UNVERIFIED artifact be assigned (updates.allowUnverifiedArtifacts).
    Every artifact is UNVERIFIED today, so false means nothing can be assigned. True is a
    development setting: it is shown here so an instance running with it can be seen to be.
    """
    allowUnverifiedArtifacts: Boolean!
}

"""What an update artifact is."""
enum ArtifactKind {
    """A device firmware image."""
    FIRMWARE
    """An application or agent software package."""
    SOFTWARE
    """A configuration bundle installed as an update."""
    CONFIGURATION
}

"""Where an artifact is in its lifecycle."""
enum ArtifactState {
    """Declared, with no verified content yet. The only state in which content can be uploaded."""
    UPLOADING
    """The content is stored and matches the declared size and digest. The artifact is immutable."""
    AVAILABLE
    """Withdrawn from new use. Its metadata and content remain."""
    RETIRED
}

"""
How far an artifact's origin has been established. The only value is UNVERIFIED: the
platform checks that the bytes are the bytes that were declared, and does not authenticate
who produced them.
"""
enum ArtifactTrustStatus {
    """The artifact's origin is not authenticated."""
    UNVERIFIED
}

"""A tenant-scoped, immutable update artifact."""
type Artifact {
    """Internal identifier."""
    id: ID!
    """When the artifact was declared, as an RFC 3339 timestamp."""
    createdAt: String
    """When the artifact last changed state, as an RFC 3339 timestamp."""
    updatedAt: String
    """The artifact's token, unique within the tenant."""
    token: String!
    """What the artifact is."""
    kind: ArtifactKind!
    """The artifact's name. Together with component and version it is the artifact's identity, unique per tenant."""
    name: String!
    """The artifact's version label. It is opaque to the platform."""
    version: String!
    """The part of the device the artifact updates, for example firmware or app/agent."""
    component: String!
    """The size of the content in bytes, as a decimal string (it can exceed a 32-bit integer)."""
    sizeBytes: String!
    """The content's SHA-256 digest, as sha256: followed by 64 lowercase hex digits."""
    digest: String!
    """The IANA media type of the content."""
    mediaType: String!
    """Tokens of the device profiles the artifact may be assigned to."""
    compatibleProfiles: [String!]!
    """How far the artifact's origin has been established."""
    trustStatus: ArtifactTrustStatus!
    """Who declared the artifact and any source or notes they recorded, as a JSON object; null when none."""
    provenance: String
    """Where the artifact is in its lifecycle."""
    state: ArtifactState!
}

"""The data needed to declare an artifact. No content travels with it."""
input ArtifactCreateRequest {
    """The artifact's token, unique within the tenant."""
    token: String!
    """What the artifact is."""
    kind: ArtifactKind!
    """The artifact's name."""
    name: String!
    """The artifact's version label. Name, component and version together must be unique within the tenant."""
    version: String!
    """The part of the device the artifact updates, for example firmware or app/agent."""
    component: String!
    """
    The exact size of the content in bytes, as a decimal string. An upload that delivers any
    other number of bytes is refused.
    """
    sizeBytes: String!
    """The content's SHA-256 digest, as sha256: followed by 64 hex digits. An upload that hashes differently is refused."""
    digest: String!
    """The IANA media type of the content. Defaults to application/octet-stream."""
    mediaType: String
    """Tokens of the device profiles the artifact may be assigned to. At least one; each must exist."""
    compatibleProfiles: [String!]!
    """Where the artifact came from, recorded as provenance."""
    source: String
    """Free-form notes, recorded as provenance."""
    notes: String
}

"""Criteria for searching artifacts. Every filter is optional."""
input ArtifactSearchCriteria {
    """Zero-based page number."""
    pageNumber: Int!
    """Records per page."""
    pageSize: Int!
    """Only artifacts of this kind."""
    kind: ArtifactKind
    """Only artifacts in this state."""
    state: ArtifactState
    """Only artifacts for this component."""
    component: String
}

"""A page of artifacts."""
type ArtifactSearchResults {
    """The artifacts on this page, newest first."""
    results: [Artifact!]!
    """Pagination info for the search."""
    pagination: SearchResultsPagination!
}

"""Where one update attempt is. The platform maps what the device reports to these states."""
enum UpdateState {
    """The platform created the attempt and the device has not reported."""
    QUEUED
    """The device acknowledged the assignment."""
    INITIATED
    """The device is downloading the artifact."""
    DOWNLOADING
    """The device holds all the bytes."""
    DOWNLOADED
    """The bytes the device holds hash to the artifact's digest. This is integrity only: it does not say who produced them."""
    VERIFIED
    """The device is installing."""
    UPDATING
    """The device is rebooting into the new version."""
    REBOOTING
    """The device is running the target version. Reached only on confirmation evidence: the version, and a new boot when the artifact needs one."""
    UPDATED
    """The device reported a failure, or came back on the wrong version."""
    FAILED
    """A phase deadline passed before installation was reported started."""
    TIMED_OUT
    """A phase deadline passed during installation or reboot. The attempt waits for evidence and is neither failed nor succeeded."""
    UNKNOWN
    """The update was cancelled before installation began."""
    CANCELLED
}

"""Download progress an attempt last reported, in bytes."""
type UpdateProgress {
    """Bytes the device holds, as a decimal string."""
    bytes: String!
    """Total bytes, as a decimal string; 0 when the device did not say."""
    total: String!
}

"""Why an attempt failed or timed out."""
type UpdateFailure {
    """The stage the attempt was in, empty when the failure has no device stage."""
    stage: String!
    """A machine-readable code: the device's own, or DEADLINE or NOT_RUNNING_TARGET when the platform decided."""
    code: String!
    """The device's human-readable detail."""
    detail: String!
    """True when the platform decided, rather than the device reporting."""
    platform: Boolean!
}

"""One try at moving one component of one device to an assignment's artifact."""
type UpdateAttempt {
    """The attempt's token, the attemptId on the wire."""
    token: String!
    """Where the attempt is."""
    state: UpdateState!
    """The version the artifact installs."""
    targetVersion: String!
    """The digest the device must verify."""
    targetDigest: String!
    """Whether the update needs a reboot to take effect, in which case UPDATED needs a boot other than the install boot."""
    requiresReboot: Boolean!
    """When the platform last accepted a report from the device, or created the attempt."""
    lastReportAt: String
    """The last download progress reported; null when none was."""
    progress: UpdateProgress
    """Why the attempt failed or timed out; null otherwise."""
    failure: UpdateFailure
    """True once a cancel was requested and the device has not yet confirmed it."""
    cancelRequested: Boolean!
    """True when the attempt left UNKNOWN on a device's evidence."""
    reconciled: Boolean!
}

"""A decision that a device should install an artifact, with the attempt that carries it out."""
type UpdateAssignment {
    """Internal identifier."""
    id: ID!
    """When the artifact was assigned, as an RFC 3339 timestamp."""
    createdAt: String
    """The assignment's token, the assignmentId on the wire."""
    token: String!
    """The device the artifact was assigned to."""
    deviceToken: String!
    """The component being updated."""
    component: String!
    """The artifact being installed."""
    artifact: Artifact!
    """Who assigned it."""
    actor: String
    """When a newer assignment replaced this one; null while it is the device's current assignment."""
    supersededAt: String
    """True while this is the device's current assignment for the component."""
    current: Boolean!
    """The attempt that carries the assignment out."""
    attempt: UpdateAttempt!
}

"""Criteria for searching update assignments. Every filter is optional."""
input UpdateAssignmentSearchCriteria {
    """Zero-based page number."""
    pageNumber: Int!
    """Records per page."""
    pageSize: Int!
    """Only this device's assignments."""
    deviceToken: String
    """Only this component's assignments."""
    component: String
    """Only each device's current assignment, not the superseded history."""
    currentOnly: Boolean
}

"""A page of update assignments."""
type UpdateAssignmentSearchResults {
    """The assignments on this page, newest first."""
    results: [UpdateAssignment!]!
    """Pagination info for the search."""
    pagination: SearchResultsPagination!
}

"""The update-management read operations."""
type Query {
    """Non-sensitive service identity (the deployed functional area)."""
    updateManagementInfo: ServiceInfo!
    """Look up an artifact by token. Requires artifact:read. Null when there is none in the caller's tenant."""
    artifact(token: String!): Artifact
    """Search the tenant's artifacts, newest first. Requires artifact:read."""
    artifacts(criteria: ArtifactSearchCriteria!): ArtifactSearchResults!
    """Look up an update assignment by token. Requires artifact:read. Null when there is none in the caller's tenant."""
    updateAssignment(token: String!): UpdateAssignment
    """Search the tenant's update assignments, newest first. Requires artifact:read."""
    updateAssignments(criteria: UpdateAssignmentSearchCriteria!): UpdateAssignmentSearchResults!
}

"""The update-management write operations."""
type Mutation {
    """
    Declare an artifact in the UPLOADING state. Requires artifact:write. The compatible
    profiles are checked against device-management, and the size against the artifact and
    tenant ceilings. Upload the content afterwards with PUT /updates/artifacts/{token}/content.
    """
    createArtifact(request: ArtifactCreateRequest!): Artifact!
    """
    Withdraw an artifact from new use. Requires artifact:write. Idempotent. The content is
    kept: removing it is not offered until update assignments exist to check it against.
    """
    retireArtifact(token: String!): Artifact!
    """
    Tell a device to install an AVAILABLE artifact. Requires artifact:write. The device must exist and its
    profile must be on the artifact's compatible list, and an UNVERIFIED artifact is refused unless the
    instance allows it. A device works toward one target per component: assigning while its previous
    update is still live is refused until that is cancelled, assigning the same artifact again returns
    the same assignment, and assigning after the previous update finished supersedes it (the history is kept).
    """
    assignArtifact(deviceToken: String!, artifactToken: String!): UpdateAssignment!
    """
    Cancel an update. Requires artifact:write. A queued update is cancelled at once; before installation the
    request is recorded and completes when the device confirms; from installation on it is refused because it
    cannot be recalled. The device is told in every accepted case.
    """
    cancelUpdate(assignmentToken: String!): UpdateAssignment!
    """
    Stop waiting for an update whose outcome is UNKNOWN. Requires artifact:write. This is an explicit
    operator decision, separate from cancelUpdate (which refuses an UNKNOWN update because the device may
    have installed it): the update ends CANCELLED, the required reason is stored on it, the change is
    journaled under the caller, and the device is sent a cancel. It frees the component for a new
    assignment. It does not find out what the device runs, and the device may be on either version, so check
    its inventory before relying on either.
    """
    abandonUnknownUpdate(assignmentToken: String!, reason: String!): UpdateAssignment!
}
