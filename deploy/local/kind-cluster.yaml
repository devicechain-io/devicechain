# Local kind cluster for full-stack DeviceChain testing.
# Cluster name 'devicechain' => kube-context 'kind-devicechain', which is the
# value deploy/opentofu/terraform.tfvars.example already defaults to.
#
#   kind create cluster --name devicechain --config kind-cluster.yaml
#
# (dcctl install local does this for you, and dcctl also wires the localhost:5000 registry.)
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: devicechain

# Pull-through / local registry so ~a dozen service images are pulled by
# reference (localhost:5000/...) instead of side-loaded into every node — far
# more disk-efficient. dcctl starts the registry container and connects it.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]

nodes:
  - role: control-plane
    # ingress-ready label lets ingress-nginx schedule onto this node and bind
    # the host ports below. With cloud-provider-kind running you can instead use
    # the LoadBalancer IP; these mappings give a reliable localhost path too
    # (and, under WSL2 mirrored networking, reach the Windows browser).
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Every mapping binds LOOPBACK only. kind binds a mapping with no listenAddress on every
    # host interface, which would put the console (plain HTTP under --no-tls, superuser
    # sign-in included) and the MQTT broker on the LAN. `dcctl install local --expose-lan`
    # creates the cluster with 0.0.0.0 here instead, for a device or a browser on another
    # machine; dcctl swaps exactly these values, and refuses a config that has a different
    # number of them than it has mappings.
    extraPortMappings:
      - containerPort: 80      # ingress HTTP
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443     # ingress HTTPS
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 31883   # NATS MQTT device ingress (NodePort)
        hostPort: 1883
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Two more MQTT node ports, so a second and a third instance on this cluster reach their
      # brokers from the host too (dcctl gives each new local instance the first free one; see
      # localMQTTNodePorts in backend/cli/bootstrap/singletons.go, which a test holds to this list).
      - containerPort: 31884   # NATS MQTT, second local instance
        hostPort: 1884
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 31885   # NATS MQTT, third local instance
        hostPort: 1885
        listenAddress: "127.0.0.1"
        protocol: TCP

  # Uncomment to exercise PodDisruptionBudgets / anti-affinity / multi-node
  # scheduling. Each node is a full kubelet+containerd container, so only add
  # these when you actually need topology — single-node is lighter.
  #
  # THREE workers, not two, for anything that needs three SCHEDULABLE nodes —
  # An instance on a `dcctl install --ha` cluster places one NATS server per node under a hard spread
  # constraint. kind removes the control-plane NoSchedule taint only when the
  # cluster has exactly one node, so the control plane stops being schedulable the
  # moment you add the first worker: 1 control-plane + 2 workers is a 3-node
  # cluster with 2 usable nodes, and --ha is refused on it.
  # - role: worker
  # - role: worker
  # - role: worker
