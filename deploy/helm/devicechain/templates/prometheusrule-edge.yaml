{{/*
Alerting rules for the edge ingest services: sparkplug-ingest and lwm2m-ingest.

WHY THIS GROUP EXISTS. Both services read a transport that has no consumer group to share: one
replica holds a lease and is the only one reading, and the others stand by Ready. So "nobody is
reading this transport" is a state the platform can be in with every pod healthy, every probe
green and no error anywhere, while each device on it is silently unreachable. Each service
exports <area>_is_leader (1 on the serving replica, 0 elsewhere); the sum across replicas is 1
when the transport is read exactly once. That is the first thing here, and the rest watch the
ways a leader can be alive and still lose data: LwM2M's leader wedged in building its term
(leader without serving), Sparkplug ingest abandoning samples it accepted, a Sparkplug group
subscription the broker refused, a Sparkplug source broker that cannot be reached, and LwM2M
Notify samples dropped because ingest refused them. Until this group, none of the edge services'
metrics fed any alert.

NO absent() ARM ON THE COUNT ALERTS, for the same reason the external MQTT source alert has none:
`sum(x) != 1` over a series that does not exist is empty and never fires, but a bare absent()
would page every instance that does not run the area, because the rule file is not told which
services an install runs. ABSENCE IS ITS OWN PAIR OF ALERTS, GATED ON THE DEPLOYMENT: the
*LeaderMetricAbsent alerts fire when kube-state-metrics says the area's Deployment has pods
available and NO is_leader series exists in the namespace (a broken scrape, a changed monitor
or network policy). Keying on the Deployment is what separates "absent" from "not installed":
an area the profile does not run, or one an operator turned off, has no Deployment or none
available, so the alert is empty there. They are separate alerts (not an `or` arm on the count
alerts) because the count alerts' description quotes the number of replicas holding the lease and an
absence has no count; the remedy differs too (the scrape, not the lease). A Deployment with no
available pod is InstanceAreaUnavailable's business. A handover or rollout keeps the series
present (the standby exports 0 throughout) and `for: 5m` rides out a fresh pod's first scrape.
Needs kube-state-metrics, like InstanceAreaUnavailable; without it these are empty and the
count alerts keep their sum-only behaviour.

A Sparkplug ingest pod deployed with NO sources configured registers is_leader at start and never
acquires a lease, so it reads 0 for the life of the pod and SparkplugIngestLeaderCountNotOne fires
on it. That is deliberate: a transport service with nothing to serve is a configuration to fix or
a service to leave out of the deployment.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: edge
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.edge
      rules:
        # `sum`, not `max`: the question is how many replicas serve the transport, and each
        # reports only itself. `for: 2m` rides out a handover, where the lease is briefly held
        # by nobody; both services raise the gauge at acquisition, so a normal takeover does not
        # read as leaderless while the new leader rebuilds its state.
        - alert: Lwm2mIngestLeaderCountNotOne
          expr: sum(devicechain_lwm2mingest_is_leader{namespace="{{ $ns }}"}) != 1
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#lwm2mingestleadercountnotone"
            summary: "LwM2M ingest is not served by exactly one replica"
            description: "For at least 2 minutes, {{ "{{ $value }}" }} lwm2m-ingest replicas have reported holding the leadership lease; it should be exactly 1. At 0, nobody is reading the CoAP/DTLS transport and every LwM2M device is silently unreachable, although every pod looks healthy. Above 1, two replicas are serving at once. Check the lwm2m-ingest logs for why no replica acquired the lease (typically the platform's message broker is unreachable)."
        - alert: SparkplugIngestLeaderCountNotOne
          expr: sum(devicechain_sparkplugingest_is_leader{namespace="{{ $ns }}"}) != 1
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugingestleadercountnotone"
            summary: "Sparkplug ingest is not served by exactly one replica"
            description: "For at least 2 minutes, {{ "{{ $value }}" }} sparkplug-ingest replicas have reported holding the leadership lease; it should be exactly 1. At 0, no Sparkplug source is being read and every device behind it is silently unreachable, although every pod looks healthy. Above 1, two replicas are connecting the same sources. A pod deployed with no sources configured never takes the lease and reads 0 permanently: configure its sources or leave the service out of the deployment. Otherwise check the sparkplug-ingest logs for why no replica acquired the lease."
        # ABSENCE, gated on the Deployment. See the header. count(...) > 0, not sum(0 * ...): the
        # value is irrelevant, and a bare comparison is what keeps this from being an always-firing shape.
        - alert: Lwm2mIngestLeaderMetricAbsent
          expr: |
            count(
              kube_deployment_status_replicas_available{namespace="{{ $ns }}", deployment="lwm2m-ingest"} > 0
              unless on (namespace)
              devicechain_lwm2mingest_is_leader{namespace="{{ $ns }}"}
            ) > 0
          for: 5m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#lwm2mingestleadermetricabsent"
            summary: "LwM2M ingest has pods available but exports no leader series"
            description: "For at least 5 minutes, the lwm2m-ingest deployment has had pod(s) available while no replica exports devicechain_lwm2mingest_is_leader, so whether the transport is being read cannot be known: Lwm2mIngestLeaderCountNotOne reads an empty sum as healthy and cannot fire. The usual causes are a broken scrape (a ServiceMonitor or PodMonitor change, a network policy, a metrics port or TLS change) or a build without the metric. Check the scrape target for lwm2m-ingest in Prometheus, then the pods' /metrics, before reading the logs. This does not fire for an area that is not deployed or has no pod available (InstanceAreaUnavailable covers that)."
        - alert: SparkplugIngestLeaderMetricAbsent
          expr: |
            count(
              kube_deployment_status_replicas_available{namespace="{{ $ns }}", deployment="sparkplug-ingest"} > 0
              unless on (namespace)
              devicechain_sparkplugingest_is_leader{namespace="{{ $ns }}"}
            ) > 0
          for: 5m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugingestleadermetricabsent"
            summary: "Sparkplug ingest has pods available but exports no leader series"
            description: "For at least 5 minutes, the sparkplug-ingest deployment has had pod(s) available while no replica exports devicechain_sparkplugingest_is_leader, so whether the transport is being read cannot be known: SparkplugIngestLeaderCountNotOne reads an empty sum as healthy and cannot fire. The usual causes are a broken scrape (a ServiceMonitor or PodMonitor change, a network policy, a metrics port or TLS change) or a build without the metric. Check the scrape target for sparkplug-ingest in Prometheus, then the pods' /metrics, before reading the logs. This does not fire for an area that is not deployed or has no pod available (InstanceAreaUnavailable covers that)."
        # Read the pair together: is_leader goes up when the lease is acquired, is_serving only when
        # the read loop runs. Leader and not serving past a takeover's worth of time is a leader
        # wedged in building its term, which readiness, liveness and is_leader all report as healthy.
        - alert: Lwm2mIngestLeaderNotServing
          expr: devicechain_lwm2mingest_is_leader{namespace="{{ $ns }}"} == 1 and on (namespace, pod) devicechain_lwm2mingest_is_serving{namespace="{{ $ns }}"} == 0
          for: 5m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#lwm2mingestleadernotserving"
            summary: "The LwM2M ingest leader holds the lease but is not serving"
            description: "For at least 5 minutes, {{ "{{ $labels.pod }}" }} has held the LwM2M leadership lease while its CoAP/DTLS read loop is not running. It is stuck building its term (typically reading the asserted-active devices from device-state), and it keeps the lease, so no standby can take over. No LwM2M device is being served. Check this pod's log around 'Acquired LwM2M leadership' and restart it so a standby can acquire."
        # `for` equals the increase window, never less: an abandonment that stops clears inside one
        # window, and one that goes on for a full window is ingest failing, not a blip.
        - alert: SparkplugIngestDroppingData
          expr: sum(increase(devicechain_sparkplugingest_ingest_failures_total{namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugingestdroppingdata"
            summary: "Sparkplug ingest is abandoning accepted messages"
            description: "For at least 10 minutes, sparkplug-ingest has been abandoning accepted messages: their samples or presence transitions were dropped after the retry budget was spent (device-management or the message broker unreachable), at once under backpressure, or on shutdown. A Sparkplug Host gets no broker redelivery, so each one is lost. Check device-management and the platform's message broker, and the sparkplug-ingest log for 'Dropping Sparkplug samples'."
        - alert: SparkplugIngestSubscriptionRefused
          expr: sum(increase(devicechain_sparkplugingest_subscribe_failures_total{namespace="{{ $ns }}"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugingestsubscriptionrefused"
            summary: "A Sparkplug source's broker refused a group subscription"
            description: "For at least 5 minutes, a Sparkplug source has been abandoned and retried because its broker accepted the connection but refused (or never acknowledged) a group subscription, most likely because the source's credential may not read that group. While any group is refused the source ingests none of its groups and never announces ONLINE. Check the broker's access rules for the source's credential against the groups configured for it."
        - alert: SparkplugIngestBrokerUnreachable
          expr: sum(increase(devicechain_sparkplugingest_connect_failures_total{namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugingestbrokerunreachable"
            summary: "Sparkplug ingest cannot connect to a configured broker"
            description: "For at least 10 minutes, sparkplug-ingest has been failing to connect to a configured Sparkplug broker. Readiness is deliberately not gated on broker reachability, so the pod looks healthy while that source ingests nothing. A bad host, a rejected credential or a broker outage all raise this; the sparkplug-ingest log names the source and the reason."
        - alert: Lwm2mIngestDroppingNotifications
          expr: sum(increase(devicechain_lwm2mingest_notify_ingest_dropped_total{namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#lwm2mingestdroppingnotifications"
            summary: "LwM2M ingest is dropping Notify samples"
            description: "For at least 10 minutes, lwm2m-ingest has been dropping the samples of Notify messages because ingest failed or refused them, backpressure included. There is no retry in the Notify path (the next Notify supersedes), so a device that reports rarely loses its reading. Check the platform's message broker and the inbound-events stream's backlog, and the lwm2m-ingest log."
        # --- Sparkplug command downlink -------------------------------------------------------
        # Off unless a source sets commands.enabled, and then these watch it. A deployment with the
        # downlink off exports commands_total at zero and a breaker at 0, so none of the three
        # can fire there.
        #
        # Sparkplug has no command acknowledgement, so a command is "confirmed" only when the node
        # later REPORTS the requested value. A whole fleet of unconfirmed commands is therefore the
        # sign of a path that does not work (publish ACL, wrong host role, nodes that ignore a
        # secondary host), not of any one device. The ratio needs 20 published commands in the
        # window so that a handful of ordinary non-responders on a quiet site cannot page, and it is
        # over 30m because a command is only counted unconfirmed when its confirm window (2 minutes
        # by default, 10 for a reboot) ends, after it was counted published.
        - alert: SparkplugCommandsUnconfirmed
          expr: |
            (
              sum(increase(devicechain_sparkplugingest_commands_total{namespace="{{ $ns }}", result="unconfirmed"}[30m]))
              /
              sum(increase(devicechain_sparkplugingest_commands_total{namespace="{{ $ns }}", result="published"}[30m]))
            ) > 0.9
            and
            sum(increase(devicechain_sparkplugingest_commands_total{namespace="{{ $ns }}", result="published"}[30m])) >= 20
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugcommandsunconfirmed"
            summary: "Sparkplug commands are being published but not confirmed"
            description: "For at least 15 minutes, more than 90% of the Sparkplug commands sparkplug-ingest published in the last 30 minutes (at least 20 of them) ended without the node reporting the requested value. Sparkplug has no command acknowledgement, so this is how a command path that does not work looks: the customer broker may be dropping the publishes (check the source credential may publish on the NCMD and DCMD topics), the nodes may be ignoring a host that is not their primary (commands.hostRole), or the confirm window may be shorter than the nodes' reporting delay (commands.confirmWindowSeconds). Commands are recorded as TIMEOUT, not as failed."
        # "Opened in the last 20 minutes", not "is not closed". The breaker opens (1) on a trip, moves
        # to half-open (2) when its pause ends, and closes (0) only when a command is published
        # afterwards without a disconnect. A source with no commands waiting therefore reads 2 for as
        # long as it is idle, so any test of "not closed" would fire on one session blip and stay
        # firing until someone sent a command. Looking for a 1 in the window fires on every trip, and
        # keeps firing for a source that fails every probe, because each re-open puts a new 1 in the
        # window (the pause between re-opens, 5 minutes doubling to an hour, is mostly spent at 1).
        # A pause that outlasts the window is spent at 1 throughout. It resolves 20 minutes after the
        # last open.
        - alert: SparkplugCommandBreakerOpen
          expr: max by (tenant, source) (max_over_time((devicechain_sparkplugingest_command_breaker_state{namespace="{{ $ns }}"} == 1)[20m:1m])) > 0
          for: 2m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugcommandbreakeropen"
            summary: "Sparkplug commands to a source were paused"
            description: "In the last 20 minutes the command circuit breaker for source {{ "{{ $labels.source }}" }} (tenant {{ "{{ $labels.tenant }}" }}) opened. It opens when the customer broker drops sparkplug-ingest's session right after a command is published, which almost always means the source's credential may not publish on spBv1.0/<group>/NCMD/+ and spBv1.0/<group>/DCMD/+/+. While it is open, commands to that source fail at once as not delivered; telemetry from the source is not affected. Grant the publish permission on the broker. This alert resolves 20 minutes after the last time the breaker opened, whether or not it has closed: after its pause it is half-open and closes only when the next command is published without a disconnect."
        # Every result that is a fault of the service or the platform and not an outcome about the
        # command: a claim, a park, a publish or the awaiting store failing, or a response that could
        # not be delivered to command-delivery. Refusals (disabled, breaker, expired, payload,
        # metric, datatype, not allowed, reboot gate) and unconfirmed commands are NOT faults and are
        # not counted here.
        - alert: SparkplugCommandResponsesFailing
          expr: sum by (result) (increase(devicechain_sparkplugingest_commands_total{namespace="{{ $ns }}", result=~"claim_failed|park_failed|publish_failed|kv_failed|response_failed"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#sparkplugcommandresponsesfailing"
            summary: "Sparkplug commands are failing inside the platform"
            description: "For at least 5 minutes, sparkplug-ingest has been counting commands it could not carry through, with result {{ "{{ $labels.result }}" }}: claim_failed, park_failed and response_failed mean command-delivery could not be reached or refused the call (the command stays SENT or is never answered until its lifetime ends); kv_failed means the store of commands awaiting confirmation could not be written, so the command was not published; publish_failed means a publish may or may not have reached the node. Check command-delivery and the message broker, and the sparkplug-ingest log."
{{- end }}
