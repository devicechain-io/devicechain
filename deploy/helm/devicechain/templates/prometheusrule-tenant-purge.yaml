{{/*
Alerting rules for the tenant-purge coordinator.

WHY THIS GROUP EXISTS AT ALL. The coordinator already publishes the periodic-task
metrics every scheduled loop in this platform publishes, and for this one loop they
answer the wrong question. A tenant whose purge can never finish is visited on every
pass, returns no error, and leaves the pass COMPLETE -- so the task's last-success
gauge keeps moving while the tenant's data is not erased. Deleting a tenant is an
obligation with a deadline attached, and "the loop is running" is not evidence that the
obligation is being met. These two gauges are; this file is what watches them.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
{{/*
  🔴 THE THRESHOLD IS DERIVED FROM THE WAIT, NOT WRITTEN DOWN BESIDE IT. A purge cannot
  complete before its token hold elapses -- that window is measured from the cut and is
  the dominant one (the settle window is minutes against its hours) -- so a fixed number
  here would fire on every deletion the day an operator raised tokenHoldSeconds, and the
  alert would be tuned by silencing it. Reading the same value the coordinator reads
  means the two cannot disagree. The default mirrors the service's own
  defaultTenantPurgeTokenHoldSeconds, which is the NATS credential lifetime.

  🔴 AND IT READS 0 THE WAY THE SERVICE DOES. The service treats an explicit
  tokenHoldSeconds: 0 as "use the default", and so do the docs. `dig` returns an explicit
  0 as it is, so without the trailing `default` a values file carrying 0 rendered a
  threshold of 0 -- an alert that fired 15 minutes after every deletion opened, inside
  its legitimate hold. Sprig's `default` treats 0 as empty, which is the reading wanted.
  hack/check-prometheus-rules.sh renders both an explicit 0 and a set value.
*/}}
{{- $hold := dig "user-management" "config" "tenantPurge" "tokenHoldSeconds" 43200 .Values.functionalAreas | default 43200 }}
{{- $stalled := mul $hold 2 }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tenant-purge
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.tenant-purge
      rules:
        - alert: TenantPurgeStalled
          expr: max(devicechain_usermanagement_tenant_purge_oldest_age_seconds{namespace="{{ $ns }}"}) > {{ $stalled }}
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A tenant deletion has been open for more than twice its token hold"
            description: "The oldest open tenant deletion is older than {{ $stalled }}s, which is twice the configured token hold ({{ $hold }}s) and therefore well past the point where every mandatory wait has elapsed. The purge is not progressing: some store is not reporting clean, or is reporting clean and then dirty again. The tenant's data has NOT been erased and its token is still reserved. The coordinator's own pass metrics will look healthy throughout, because a tenant it cannot finish is still a tenant it visited without error -- this alert is the only signal that the deletion is stuck. The admin API's tenantDeletions query names the tenant and the store still outstanding."
        - alert: TenantPurgeVisibilityLost
          expr: absent(devicechain_usermanagement_tenant_purge_in_flight{namespace="{{ $ns }}"})
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Nothing is reporting whether tenant deletions are progressing"
            description: "The tenant-purge gauges have not been scraped for 15m, so TenantPurgeStalled above cannot fire and an open deletion would be invisible rather than green. This is the absent() counterweight: the in-flight gauge is unlabelled and registered at process start, so it reads 0 on a healthy instance rather than going missing -- its absence means user-management is not being scraped at all, not that no deletion is open."
        - alert: TenantPurgeStoreFailing
          expr: max by (store) (devicechain_usermanagement_tenant_purge_store_blocked{namespace="{{ $ns }}", reason="error"}) > 0
          for: 1h
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A storage system cannot be asked to erase a deleted tenant's data"
            description: "For an hour, the {{ "{{ $labels.store }}" }} store has returned an error to the erase request for at least one open tenant deletion, so the coordinator cannot tell whether that tenant's data there is gone. Stores are rdb (relational data), tsdb (telemetry), broker (streams), kv (key-value buckets), detect (rule state) and blob (object storage); other is a store this alert's vocabulary does not name. The error is in user-management's log (\"Tenant purge store did not report clean\") and in the admin API's tenantDeletions query. The deletion cannot complete until the store answers."
        - alert: TenantPurgeStoreHolding
          expr: max by (store) (devicechain_usermanagement_tenant_purge_store_blocked{namespace="{{ $ns }}", reason="deferred"}) > 0
          for: {{ $hold }}s
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A storage system has reported a deleted tenant's data still present for longer than the token hold"
            description: "The {{ "{{ $labels.store }}" }} store has answered the erase request for at least one open tenant deletion with data still present or still arriving, continuously for the length of the token hold ({{ $hold }}s). A store normally goes clean within a few passes; one that does not is either retaining data on purpose (a stream with a retention the purge cannot cut, a bucket that refuses deletes) or being refilled by something still writing for the deleted tenant. The admin API's tenantDeletions query names the tenant and the store's stated reason. TenantPurgeStalled fires later, at twice the hold, without naming the store."
        - alert: TenantPurgeCoordinatorFailing
          expr: sum(increase(devicechain_usermanagement_tenant_purge_failures_total{namespace="{{ $ns }}"}[1h])) > 0
          for: 30m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The tenant-deletion coordinator keeps failing to carry a deletion through a pass"
            description: "The coordinator has failed to take at least one tenant deletion through a pass (re-reading the tenant, writing the ledger, lifting a fence or completing it) and the rate has stayed above zero for 30 minutes. This is a fault in the coordinator's own work, not a store holding data: a store's refusal is reported by TenantPurgeStoreFailing and TenantPurgeStoreHolding. User-management's log names the tenant and the step."
{{- end }}
