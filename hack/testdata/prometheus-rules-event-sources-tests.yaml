#
# promtool UNIT TESTS for the event-sources alerting rules.
#
# WHAT THESE ARE FOR, over and above the parse check
#
# ExternalMqttSourceNotReadByOnePod counts, per external MQTT source, the pods that report
# reading it. Every event-sources pod exports the gauge for every external source from
# start, so a standby reports 0 rather than nothing: a healthy source sums to exactly 1.
# The quiet cases carry as much weight as the firing ones:
#
#   - a healthy source with a standby beside its reader must not page;
#   - a HANDOVER, where the source is read by nobody for a scrape or two and then by the
#     standby, must not page (the `for: 2m`);
#   - an install with no external source exports no series and must not page.
#
# THE SERIES:
#
#   - devicechain_eventsources_external_mqtt_owner{source} -- a GaugeVec, set to 0 at
#     start on every pod and to 1 on the pod reading the source.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml.
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # Healthy: pod a reads ext-a, pod b stands by. Quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '1x30'
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", source="ext-a"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts: []

  # ------------------------------------------------------------------
  # A handover: pod a stops reading at 10m, pod b reads from 11m. One minute with
  # nobody reading is shorter than the pending period. Quiet throughout.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '1x9 0x20'
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", source="ext-a"}'
        values: '0x10 1x19'
    alert_rule_test:
      - eval_time: 11m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts: []
      - eval_time: 25m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 NOBODY READS THE SOURCE: the operator's broker went down at 10m and the pods stand
  # by. Every pod still reports, at 0, so the sum is 0 and the alert fires once the
  # pending period has passed. The other source on the same pods is healthy and must not
  # be named.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '1x9 0x20'
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", source="ext-a"}'
        values: '0x30'
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-b"}'
        values: '0x30'
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", source="ext-b"}'
        values: '1x30'
    alert_rule_test:
      # Inside the pending period.
      - eval_time: 11m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts: []
      - eval_time: 15m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              source: ext-a
            exp_annotations:
              summary: "An external MQTT source is not being read by exactly one pod"
              description: "External MQTT source ext-a has been read by 0 event-sources pods for 2m; it should be read by exactly one. At 0, nothing is reading it, and whatever your broker delivers meanwhile is lost, because the session is not persistent. The usual cause is that your broker is unreachable or refusing the connection: the pod that took the source over logs why, releases the source and tries again every 15 seconds. Another cause is that event-sources cannot reach the platform's message broker to agree which pod reads the source; its log says so. Above 1, more than one pod reports reading it. A pod that has lost the source drops what it is still delivered rather than storing it, and stops reporting within a lease renewal, so a value above 1 that lasts points at a pod that has lost contact with the platform's message broker."

  # ------------------------------------------------------------------
  # Two pods both report reading the source, for longer than a renewal could explain.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '1x30'
      - series: 'devicechain_eventsources_external_mqtt_owner{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", source="ext-a"}'
        values: '0x9 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              source: ext-a
            exp_annotations:
              summary: "An external MQTT source is not being read by exactly one pod"
              description: "External MQTT source ext-a has been read by 2 event-sources pods for 2m; it should be read by exactly one. At 0, nothing is reading it, and whatever your broker delivers meanwhile is lost, because the session is not persistent. The usual cause is that your broker is unreachable or refusing the connection: the pod that took the source over logs why, releases the source and tries again every 15 seconds. Another cause is that event-sources cannot reach the platform's message broker to agree which pod reads the source; its log says so. Above 1, more than one pod reports reading it. A pod that has lost the source drops what it is still delivered rather than storing it, and stops reporting within a lease renewal, so a value above 1 that lasts points at a pod that has lost contact with the platform's message broker."

  # ------------------------------------------------------------------
  # An install with no external source exports no owner series at all. Quiet; any other
  # event-sources series is present, to show the rule is not quiet only because the
  # whole service is missing.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_total_inbound_messages{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="gateway"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ExternalMqttSourceNotReadByOnePod
        exp_alerts: []

  # ------------------------------------------------------------------
  # ExternalMqttSourceLosingEvents. Every pod exports the lost-event counter at 0 for every
  # external source from start. A healthy source never moves it: quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_total_msg_publish_failed{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ExternalMqttSourceLosingEvents
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE PLATFORM BROKER REFUSES PUBLISHES from 10m on: ext-a loses events every minute.
  # Quiet inside the pending period, firing after it and naming only ext-a; ext-b on the
  # same pod is healthy.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_total_msg_publish_failed{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '0x10 3+3x30'
      - series: 'devicechain_eventsources_total_msg_publish_failed{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-b"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ExternalMqttSourceLosingEvents
        exp_alerts: []
      - eval_time: 25m
        alertname: ExternalMqttSourceLosingEvents
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              source: ext-a
            exp_annotations:
              summary: "An external MQTT source is losing events it has already read"
              description: "For at least 10 minutes, external MQTT source ext-a has been losing events: they were read from your broker and decoded, but publishing them to the platform's event stream failed. That source does not retry, and your broker was already told they arrived, so each one is gone. The cause is on the platform's side, not your broker's: its message broker is refusing or not answering publishes. Check the platform's message broker, and the event-sources log for 'is lost: this transport does not retry', which names the source and tenant of each."

  # ------------------------------------------------------------------
  # A one-off burst (a settle that timed out at a handover) that then stops: it clears
  # within one window and never outlasts the pending period. Quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_total_msg_publish_failed{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="ext-a"}'
        values: '0x10 128x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ExternalMqttSourceLosingEvents
        exp_alerts: []
      - eval_time: 30m
        alertname: ExternalMqttSourceLosingEvents
        exp_alerts: []

  # BrokerPresenceLosingTransitions. Every pod exports the failed-transition counter at 0 from
  # start. Healthy pods never move it: quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources"}'
        values: '0x40'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE PLATFORM BROKER REFUSES PUBLISHES from 10m on: one pod fails 3 transitions a
  # minute. Quiet inside the pending period, firing after it. One instance-wide alert, not
  # one per pod: the cause is the broker both pods publish to.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources"}'
        values: '0x10 3+3x30'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts: []
      - eval_time: 25m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Broker presence transitions are not reaching the event stream"
              description: "For at least 10 minutes, event-sources has been failing to write device connects and disconnects to the platform's event stream (30 in the last 10 minutes). The broker does not resend connection notices, so each one is lost until the next reconciliation pass (every 5 minutes by default) puts the device right; until then a device can read offline while it is connected, or the other way round, and a reconnecting device's held commands are not released early. The cause is the platform's message broker refusing or not answering publishes. Check it, and the event-sources log for 'Failed to emit a broker presence transition', which names each device."

  # ------------------------------------------------------------------
  # A one-off burst (a stop that gave up waiting on what it held) that then stops: it clears
  # within one window and never outlasts the pending period. Quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources"}'
        values: '0x10 128x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts: []
      - eval_time: 30m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts: []

  # ------------------------------------------------------------------
  # A ROLLING RESTART: each old pod's series ends and its replacement's starts at 0, three
  # pods one after another, two minutes apart. A transition refused because the tap was
  # stopping is not counted, so nothing moves and nothing pages.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-old-a", job="devicechain/event-sources"}'
        values: '0x10'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-old-b", job="devicechain/event-sources"}'
        values: '0x12'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-old-c", job="devicechain/event-sources"}'
        values: '0x14'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-new-a", job="devicechain/event-sources"}'
        values: '_x10 0x30'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-new-b", job="devicechain/event-sources"}'
        values: '_x12 0x28'
      - series: 'devicechain_eventsources_presence_events_failed_total{namespace="dci-devicechain", pod="dc-event-sources-new-c", job="devicechain/event-sources"}'
        values: '_x14 0x26'
    alert_rule_test:
      - eval_time: 20m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts: []
      - eval_time: 35m
        alertname: BrokerPresenceLosingTransitions
        exp_alerts: []

  # ------------------------------------------------------------------
  # MqttFailClosedDurableMissing. The series exist only with infrastructure.nats.mqttFailClosed
  # on. Healthy: two pods, every durable present, the missing counters flat at 0. Quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-command-responses"}'
        values: '1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '0x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MqttFailClosedDurableMissing
        exp_alerts: []

  # ------------------------------------------------------------------
  # The setting off: no fail-closed series at all, while event-sources is otherwise
  # exporting. Neither alert can fire.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_total_inbound_messages{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", source="gateway"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MqttFailClosedDurableMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE EVENTS DURABLE IS DELETED at 10m; pod a's check finds it missing and creates it
  # again in the same pass. The gauge never reads 0, so only the counter can say it: the
  # alert fires AT ONCE (no `for`, each count is loss already), names only that durable,
  # and clears once the increase leaves the 10-minute window.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '1x40'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-command-responses"}'
        values: '1x40'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '0x9 1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-command-responses"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: MqttFailClosedDurableMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: MqttFailClosedDurableMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              durable: inst-1_event-sources_mqtt-msgs-events
            exp_annotations:
              summary: "A platform durable on the MQTT message store is missing"
              description: "Durable inst-1_event-sources_mqtt-msgs-events on the MQTT gateway's message store has been missing within the last 10 minutes. While it is missing, the broker acknowledges device QoS 1 publishes of its kind without keeping them, so each one is lost although the device was told it arrived. event-sources creates it again within 30 seconds, and this alert clears 10 minutes after the last time it was found missing; while it cannot be created, the alert stays. A rolling update does not remove a durable, so it does not raise this alert. Find what deleted it (a command run against the broker's consumers, or a tool that manages them), and check the event-sources log for 'platform durable on the MQTT message store'."
      - eval_time: 25m
        alertname: MqttFailClosedDurableMissing
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE DURABLE CANNOT BE CREATED: from 10m pod b reports it absent (0) while pod a
  # still reports 1. Any one pod is enough (`min`), and it fires for as long as it lasts,
  # well past the counter's window.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '1x40'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '1x9 0x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '0x40'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", durable="inst-1_event-sources_mqtt-msgs-events"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: MqttFailClosedDurableMissing
        exp_alerts: []
      - eval_time: 35m
        alertname: MqttFailClosedDurableMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              durable: inst-1_event-sources_mqtt-msgs-events
            exp_annotations:
              summary: "A platform durable on the MQTT message store is missing"
              description: "Durable inst-1_event-sources_mqtt-msgs-events on the MQTT gateway's message store has been missing within the last 10 minutes. While it is missing, the broker acknowledges device QoS 1 publishes of its kind without keeping them, so each one is lost although the device was told it arrived. event-sources creates it again within 30 seconds, and this alert clears 10 minutes after the last time it was found missing; while it cannot be created, the alert stays. A rolling update does not remove a durable, so it does not raise this alert. Find what deleted it (a command run against the broker's consumers, or a tool that manages them), and check the event-sources log for 'platform durable on the MQTT message store'."

  # ------------------------------------------------------------------
  # MqttFailClosedStoreNotAsDeclared. Healthy: no other instance, the repair counters flat.
  # Quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_failclosed_foreign_instances{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources"}'
        values: '0x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_foreign_instances{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources"}'
        values: '0x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_store_repaired_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", setting="discard"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE DISCARD POLICY IS CHANGED OUT OF BAND at 10m and put back by pod a's next check.
  # Fires at once, and clears once the repair leaves the window.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_failclosed_foreign_instances{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources"}'
        values: '0x40'
      - series: 'devicechain_eventsources_mqtt_failclosed_store_repaired_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", setting="discard"}'
        values: '0x9 1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_store_repaired_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", setting="maxBytes"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts: []
      - eval_time: 11m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "The MQTT message store is not as the platform declared it"
              description: "Within the last 10 minutes event-sources found the MQTT gateway's message store changed from its fail-closed configuration, or found another DeviceChain instance on the same broker. A changed setting (the discard policy, the size bound, or the store deleted outright) is put back within 30 seconds, but while it lasted a full store could discard messages it had already acknowledged, or refuse every publish. Another instance on the broker shares the store and its bound, so one instance's backlog refuses the other's devices: give each instance its own broker, or turn infrastructure.nats.mqttFailClosed off. The event-sources log names the setting it put back, or the other instances."
      - eval_time: 25m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 ANOTHER INSTANCE APPEARS ON THE BROKER at 10m. Nothing is repaired (it is not this
  # instance's to fix), and the alert fires for as long as the other instance is there.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_failclosed_foreign_instances{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources"}'
        values: '0x9 1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_foreign_instances{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources"}'
        values: '0x9 1x30'
      - series: 'devicechain_eventsources_mqtt_failclosed_store_repaired_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", setting="discard"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts: []
      - eval_time: 35m
        alertname: MqttFailClosedStoreNotAsDeclared
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              summary: "The MQTT message store is not as the platform declared it"
              description: "Within the last 10 minutes event-sources found the MQTT gateway's message store changed from its fail-closed configuration, or found another DeviceChain instance on the same broker. A changed setting (the discard policy, the size bound, or the store deleted outright) is put back within 30 seconds, but while it lasted a full store could discard messages it had already acknowledged, or refuse every publish. Another instance on the broker shares the store and its bound, so one instance's backlog refuses the other's devices: give each instance its own broker, or turn infrastructure.nats.mqttFailClosed off. The event-sources log names the setting it put back, or the other instances."

  # ------------------------------------------------------------------
  # MqttGatewayStreamUnbounded. $MQTT_msgs cannot be bounded from 5m on (the broker has no
  # storage to reserve the limit); $MQTT_out is fine throughout. Fires for the one stream,
  # only after 10 minutes, and clears when the pod bounds it.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_mqtt_gateway_stream_unbounded{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", stream="$MQTT_msgs"}'
        values: '0x4 1x20 0x20'
      - series: 'devicechain_eventsources_mqtt_gateway_stream_unbounded{namespace="dci-devicechain", pod="dc-event-sources-5d8f-bbbbb", job="devicechain/event-sources", stream="$MQTT_msgs"}'
        values: '0x45'
      - series: 'devicechain_eventsources_mqtt_gateway_stream_unbounded{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", stream="$MQTT_out"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 12m
        alertname: MqttGatewayStreamUnbounded
        exp_alerts: []
      - eval_time: 20m
        alertname: MqttGatewayStreamUnbounded
        exp_alerts:
          - exp_labels:
              stream: "$MQTT_msgs"
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "An MQTT gateway stream has no size limit"
              description: "For at least 10 minutes the broker's MQTT gateway stream $MQTT_msgs has had no size limit and event-sources could not set one. The broker creates these streams without a limit when the first MQTT device connects, and an unbounded one can fill the broker's storage and take the whole instance down. Check that the broker has storage free to reserve the limit and look in the event-sources log for 'Could not bound the MQTT gateway'. It clears on its own once the limit is set."
      - eval_time: 40m
        alertname: MqttGatewayStreamUnbounded
        exp_alerts: []

  # ==================================================================
  # INBOUND INTEGRATIONS
  # ==================================================================

  # IntegrationAuthFailuresSustained. Healthy traffic: nothing refused. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="CHIRPSTACK_V4", result="accepted"}'
        values: '0+20x60'
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="unknown", result="unauthorized"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: IntegrationAuthFailuresSustained
        exp_alerts: []

  # A switched-off integration is refused 100 times a minute. That is a decision, not a credential
  # problem: quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="CHIRPSTACK_V4", result="disabled"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: IntegrationAuthFailuresSustained
        exp_alerts: []

  # A trickle of one wrong token a minute (a stale token on one device, say) stays under the
  # threshold: quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="unknown", result="unauthorized"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: IntegrationAuthFailuresSustained
        exp_alerts: []

  # 🔴 A SPRAY OR A TOKEN NOBODY UPDATED: five refusals a minute from 10m on, some of them the
  # budget answering for the integration. Quiet inside the pending period, firing after it.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="unknown", result="unauthorized"}'
        values: '0x10 5+5x40'
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="unknown", result="bad_auth_limited"}'
        values: '0x10 2+2x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: IntegrationAuthFailuresSustained
        exp_alerts: []
      - eval_time: 40m
        alertname: IntegrationAuthFailuresSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Requests to an integration are being refused for a bad token"
              description: "For at least 10 minutes, more than 30 requests in each 10 minutes to an inbound integration have been refused because the bearer token was wrong, the integration does not exist, or the integration's failure budget was spent. If a sender stopped delivering after you rotated an integration's token, update the token in the network server or webhook. If nothing of yours changed, someone who knows the URL is trying tokens: the integration's 'last authentication failure' time in the console shows which one, and the sprayed integration keeps serving senders that are already known."

  # IntegrationShedAccepted. Nothing shed: quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="TTS_V3", result="shed_accepted"}'
        values: '0x60'
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="shed"}'
        values: '0x60'
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="published"}'
        values: '0+50x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: IntegrationShedAccepted
        exp_alerts: []

  # 🔴 A TENANT OVER ITS CEILING from 10m on: requests answered 202 and discarded. Quiet before it
  # starts, firing shortly after, and cleared once the window has passed.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="TTS_V3", result="shed_accepted"}'
        values: '0x10 3+3x25 78x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: IntegrationShedAccepted
        exp_alerts: []
      - eval_time: 15m
        alertname: IntegrationShedAccepted
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Integration uplinks are being accepted and discarded at a tenant's ingest ceiling"
              description: "In the last 10 minutes, uplinks from inbound integrations were discarded because a tenant is over its ingest ceiling. They were answered 202 so the network server would not suspend its webhook, which means the sender believes they arrived and they did not. Raise the tenant's ingest ceiling, or reduce what the integration sends."
      - eval_time: 60m
        alertname: IntegrationShedAccepted
        exp_alerts: []

  # The same at the reading stage: uplinks shed one by one while requests are admitted.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="shed"}'
        values: '0x10 2+2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: IntegrationShedAccepted
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Integration uplinks are being accepted and discarded at a tenant's ingest ceiling"
              description: "In the last 10 minutes, uplinks from inbound integrations were discarded because a tenant is over its ingest ceiling. They were answered 202 so the network server would not suspend its webhook, which means the sender believes they arrived and they did not. Raise the tenant's ingest ceiling, or reduce what the integration sends."

  # IntegrationUndecodedHigh. Mostly decoded: quiet however many are not.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="undecoded"}'
        values: '0+5x70'
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="published"}'
        values: '0+100x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: IntegrationUndecodedHigh
        exp_alerts: []

  # Mostly undecoded but only a handful of uplinks (a test device, a first connection): quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="undecoded"}'
        values: '0+0.2x70'
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="published"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: IntegrationUndecodedHigh
        exp_alerts: []

  # 🔴 THE CODEC IS MISSING on the sender's side: from 10m on, ten uplinks a minute carry nothing to
  # store and two are stored. Quiet inside the window, firing once it has lasted.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="undecoded"}'
        values: '0x10 10+10x70'
      - series: 'devicechain_eventsources_integration_uplinks_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", result="published"}'
        values: '0x10 2+2x70'
    alert_rule_test:
      - eval_time: 25m
        alertname: IntegrationUndecodedHigh
        exp_alerts: []
      - eval_time: 80m
        alertname: IntegrationUndecodedHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Most integration uplinks carry nothing to store"
              description: "For at least 30 minutes, more than half of the uplinks arriving over inbound integrations have had no decoded values to store. The network server forwards the raw frame but the device profile there has no payload codec configured (or the codec returns nothing), or a generic sender posts only text. Configure the codec in the network server; the integration's 'last undecoded' sample in the console shows a frame it could not read."

  # A SHORT BURST: a single minute of shed requests at 11m, then nothing. It is still seen, because
  # the window holds it for ten minutes and the pending period is one.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_integration_requests_total{namespace="dci-devicechain", pod="dc-event-sources-5d8f-aaaaa", job="devicechain/event-sources", type="TTS_V3", result="shed_accepted"}'
        values: '0x10 4x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: IntegrationShedAccepted
        exp_alerts: []
      - eval_time: 14m
        alertname: IntegrationShedAccepted
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "Integration uplinks are being accepted and discarded at a tenant's ingest ceiling"
              description: "In the last 10 minutes, uplinks from inbound integrations were discarded because a tenant is over its ingest ceiling. They were answered 202 so the network server would not suspend its webhook, which means the sender believes they arrived and they did not. Raise the tenant's ingest ceiling, or reduce what the integration sends."
      - eval_time: 40m
        alertname: IntegrationShedAccepted
        exp_alerts: []
