{{/*
Alerting rules for device-management's in-memory caches.

WHY THIS GROUP EXISTS. device-management keeps device credentials and per-device lookups
(relationships, group membership, and so on) in bounded in-process caches, so the hot path
answers from memory instead of the database or the key-value bucket. A cache smaller than
the fleet that reports through it does not degrade gently: it cycles through the fleet, so
nearly every read is a miss and every miss evicts an entry another device is about to
need. Throughput then falls off a cliff (about fourfold in the 60,000-device measurements)
while every pod stays Ready and nothing logs an error. The counters below are how that
state is seen.

Both alerts are RATIOS of capacity evictions to lookups, not rates of evictions. A dense
fleet evicts a little all the time and that is healthy; what marks an undersized cache is
that a large share of lookups end in an eviction because the cache was full. Per pod,
because each replica holds its own copy and is sized (and fails) on its own.

NO absent() ARM. A pod that exports nothing is a crash-looping pod, which the
container-restart alerts already catch, and a cache built without the in-memory copy has
no kv_cache_local_ series at all.

THE LOOKUP ALERT NAMES ITS CACHES. Of device-management's five key-value caches, only the
three keyed by device (device-by-token, relationships-by-source, memberships-by-entity) are
bounded by inMemoryCache.perDeviceCacheMiB, which is the knob the alert tells an operator
to raise. The other two are keyed by device type and by tenant, keep the library default
bound and have no knob; an alert on them would give advice that does not apply. A cache
added to the per-device set is added to the matcher here.

MqttStoreBackoffEngaged is the back-off ahead of overflow on the fail-closed MQTT
acknowledgement (infrastructure.nats.mqttFailClosed). With it on, a full MQTT message store
refuses a device's publish by closing its connection, and every refused device reconnects into
the same full store. device-management samples the store's fill and, above 80% of its bound,
has the auth callout refuse every new device connection until the fill is below 60%, so the
devices already connected drain it. The series exists only with the setting on, so the alert
has nothing to read anywhere else. It is a warning, not a page: nothing is lost while it
fires (the store refuses what it cannot keep, and the device keeps it), but devices are being
kept off the platform. The 2m hold skips a back-off a fill spike engages and the next samples
lift.

The provisioning alerts watch device self-registration (POST /provisioning/{tenant}/register).
Every series they read is created at zero when the service starts, so they can be quiet on a
healthy instance and still fire on the first failure:

  - ProvisioningAuthFailuresSustained is the only throttle on guessing a provision secret
    from outside, because the secret itself is 256 random bits and is not rate limited per
    key. A flood of refusals at a steady rate is either a fleet with the wrong secret or
    someone probing, and neither goes away on its own. Its result label counts every way
    authentication can fail together (unknown tenant, unknown key, wrong secret, disabled or
    expired profile), on purpose, so the alert cannot be used to tell them apart either.
  - ProvisioningRateLimited is the endpoint saying no to its own devices: either one source
    (usually every device behind one ingress, when trustedProxies does not name it) or one
    tenant ran out of its allowance. Unlike the failures above, the devices are right and
    the limits are what is wrong, so it names which bucket refused.
  - ProvisioningMisconfigured is an operator's problem alone: a profile whose device type was
    deleted, whose strategy is not in the vocabulary, or which mints a credential type this
    build does not support. Every device using that profile is refused until it is fixed.

0/0 IS QUIET. Every series is created at zero, so an idle pod divides zero by zero; the
result is NaN, NaN > 0.05 is false, and nothing fires. The promtool tests pin that case.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: device-management
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.device-management
      rules:
        - alert: DeviceCredentialCacheTooSmall
          expr: |
            sum by (pod) (rate(devicechain_devicemanagement_credential_cache_evictions_total{reason="capacity",namespace="{{ $ns }}"}[10m]))
            /
            sum by (pod) (rate(devicechain_devicemanagement_credential_cache_lookups_total{namespace="{{ $ns }}"}[10m]))
            > 0.05
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The device credential cache is too small for the fleet"
            description: "On {{ "{{ $labels.pod }}" }}, more than 5% of device credential lookups have pushed another credential out of a full cache for 15m (now {{ "{{ $value | humanizePercentage }}" }}). The cache is smaller than the set of devices reporting through it, so it is cycling and most checks go to the database. Raise inMemoryCache.credentialCacheMiB for device-management, and raise its memory limit with it."
        - alert: DeviceLookupCacheTooSmall
          expr: |
            sum by (pod, cache) (rate(devicechain_devicemanagement_kv_cache_local_evictions_total{reason="capacity",cache=~"device-by-token|relationships-by-source|memberships-by-entity",namespace="{{ $ns }}"}[10m]))
            /
            sum by (pod, cache) (rate(devicechain_devicemanagement_kv_cache_local_lookups_total{cache=~"device-by-token|relationships-by-source|memberships-by-entity",namespace="{{ $ns }}"}[10m]))
            > 0.05
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A device-management per-device cache is too small for the fleet"
            description: "On {{ "{{ $labels.pod }}" }}, more than 5% of lookups in the {{ "{{ $labels.cache }}" }} cache have pushed another entry out of a full cache for 15m (now {{ "{{ $value | humanizePercentage }}" }}). The cache is smaller than the set of devices reporting through it, so it is cycling and most lookups go to the key-value bucket. Raise inMemoryCache.perDeviceCacheMiB for device-management, and raise its memory limit with it."
        - alert: MqttStoreBackoffEngaged
          expr: max(devicechain_devicemanagement_mqtt_store_backoff_engaged{namespace="{{ $ns }}"}) == 1
          for: 2m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "New MQTT device connections are being refused: the broker's MQTT message store is nearly full"
            description: "For 2m device-management has refused every new MQTT device connection, because the broker's MQTT message store is above 80% of its bound. Devices already connected keep publishing, and connections are accepted again once the store is below 60%. The platform is reading device publishes more slowly than devices send them: look at event-sources and at what reads inbound-events. Refused devices are told their connection is not authorized (MQTT CONNACK code 5) and must keep retrying."
        - alert: ProvisioningAuthFailuresSustained
          expr: sum(rate(devicechain_devicemanagement_provisioning_requests_total{result="auth_failed",namespace="{{ $ns }}"}[5m])) > 1
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Device self-registration is being refused for a wrong provision key or secret, steadily"
            description: "For 15m device-management has refused more than one self-registration request a second ({{ "{{ $value | humanize }}" }}/s now) because the provision key or secret was not valid. Either a fleet is registering with a secret that is wrong, was rotated or belongs to a disabled or expired profile, or someone is probing the endpoint. The answer is the same for every cause, so check the provisioning profile the fleet should be using (enabled, not expired, secret current) and the sources in the ingress log."
        - alert: ProvisioningRateLimited
          expr: sum by (result) (rate(devicechain_devicemanagement_provisioning_requests_total{result=~"rate_limited_source|rate_limited_tenant",namespace="{{ $ns }}"}[5m])) > 0.1
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Device self-registration is refusing requests with 429 because a rate limit is exhausted"
            description: "For 15m device-management has refused self-registration requests with 429 at {{ "{{ $value | humanize }}" }}/s, from the {{ "{{ $labels.result }}" }} limit. rate_limited_source means one client address used up its allowance: if it is the ingress controller's address, every device is sharing one allowance because infrastructure.http.trustedProxies does not name the controller. rate_limited_tenant means the tenant's registrations per second are at its governance ceiling. Devices retry on their own after the Retry-After they are told."
        - alert: ProvisioningMisconfigured
          expr: sum(increase(devicechain_devicemanagement_provisioning_requests_total{result=~"misconfigured|unsupported_type",namespace="{{ $ns }}"}[10m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A provisioning profile cannot register devices because it is misconfigured"
            description: "In the last 10m device-management refused {{ "{{ $value | humanize }}" }} self-registration request(s) against a provisioning profile that cannot work: its device type was deleted, its strategy is not one the platform knows, or it mints a credential type this build does not support. Every device using that profile is refused until the profile is fixed. The service logs the profile's token at ERROR."
{{- end }}
