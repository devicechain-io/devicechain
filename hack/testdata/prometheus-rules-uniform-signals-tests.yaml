# Run via hack/check-prometheus-rules.sh against the rendered chart group.
# Quiet cases guard lock losers, undeclared intervals, startup and policy refusals.
rule_files:
  - rendered-rules.yaml
evaluation_interval: 1m
tests:
  - name: all replicas NaN on young processes
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: 60x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 1500x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: 1500x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: interval unset despite an old process
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: unset interval also suppresses stale success
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: '0x60'
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: fresh lock winner suppresses stale and never winning replicas
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: '0x60'
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: 0+60x60
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: 60x60
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="c"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="c"}
        values: 60x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: -3600x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="c"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: stalled success respects threshold and ten minute hold
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: '0x60'
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 8m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 18m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 19m
        alertname: PeriodicTaskStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: maintenance
              task: sweep
            exp_annotations: &id001
              runbook_url: https://docs.devicechain.io/deployment/alert-runbook#periodictaskstalled
              summary: A maintenance task is not completing successful passes
              description: No replica of this job and task has succeeded within three declared pass intervals plus five minutes (a task that completes less often than it polls declares its expected success interval, and that longer interval is used), or the task has never succeeded and a replica declaring its interval has been running longer than that allowance. This has persisted for ten minutes. Check the job and task labels, service logs, database and broker health, and distributed lock ownership. A replica that skips a pass because another replica holds the lock is normal; investigate whether any replica is completing the task.
  - name: three declared intervals rather than a fixed timeout
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: '0x60'
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 600x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 35m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 45m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 46m
        alertname: PeriodicTaskStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: maintenance
              task: sweep
            exp_annotations: *id001
  - name: all NaN on old processes fires once per job and task
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: 60x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="b"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 9m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: PeriodicTaskStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: maintenance
              task: sweep
            exp_annotations: *id001
  - name: never succeeded without a process age stays quiet
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: tasks and jobs are independent
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: '0x60'
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
      - series: devicechain_devicemanagement_other_task_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 0+60x60
      - series: devicechain_devicemanagement_other_task_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 60x60
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-devicechain",job="other",instance="a"}
        values: 0+60x60
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-devicechain",job="other",instance="a"}
        values: 60x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x60
      - series: process_start_time_seconds{namespace="dci-devicechain",job="other",instance="a"}
        values: -3600x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: maintenance
              task: sweep
            exp_annotations: *id001
  # A task that polls every 5m but completes hourly (idle polls are skipped and do not count
  # as success) declares its expected success interval; the allowance is 3 x 3900s + 300s.
  - name: healthy hourly cooldown does not stall
    interval: 1m
    input_series:
      - series: devicechain_eventmanagement_rollup_tail_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 0x59 3600x60 7200x60 10800x60
      - series: devicechain_eventmanagement_rollup_tail_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 300x240
      - series: devicechain_eventmanagement_rollup_tail_expected_success_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 3900x240
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x240
    alert_rule_test:
      - eval_time: 50m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 100m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 160m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: hourly cooldown task that really stalls still fires
    interval: 1m
    input_series:
      - series: devicechain_eventmanagement_rollup_tail_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: '0x240'
      - series: devicechain_eventmanagement_rollup_tail_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 300x240
      - series: devicechain_eventmanagement_rollup_tail_expected_success_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 3900x240
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: -3600x240
    alert_rule_test:
      - eval_time: 200m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 205m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 211m
        alertname: PeriodicTaskStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: maintenance
              task: rollup_tail
            exp_annotations: *id001
  # Never succeeded, expected interval 3900s: the allowance is 12000s of process age (200m), not
  # the 1500s the polling interval alone would give.
  - name: expected interval never succeeded stays quiet inside its allowance and fires after
    interval: 1m
    input_series:
      - series: devicechain_eventmanagement_rollup_tail_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_eventmanagement_rollup_tail_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 300x240
      - series: devicechain_eventmanagement_rollup_tail_expected_success_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 3900x240
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="a"}
        values: 0x240
    alert_rule_test:
      - eval_time: 100m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 205m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 211m
        alertname: PeriodicTaskStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: maintenance
              task: rollup_tail
            exp_annotations: *id001
  # Rolling upgrade: the old pod exports only the 300s pass interval and no expected interval, and
  # has not won the lock for hours; the new pod declares 3900s and completes hourly. Success is
  # aggregated across replicas, so the new pod's fresh success keeps the task quiet, and the old
  # pod's missing gauge must not make the rule drop or misjudge the task.
  - name: mixed version rollout with an old pod that has no expected interval
    interval: 1m
    input_series:
      - series: devicechain_eventmanagement_rollup_tail_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="old"}
        values: '0x240'
      - series: devicechain_eventmanagement_rollup_tail_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="old"}
        values: 300x240
      - series: devicechain_eventmanagement_rollup_tail_last_success_timestamp_seconds{namespace="dci-devicechain",job="maintenance",instance="new"}
        values: 0x59 3600x60 7200x60 10800x60
      - series: devicechain_eventmanagement_rollup_tail_pass_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="new"}
        values: 300x240
      - series: devicechain_eventmanagement_rollup_tail_expected_success_interval_seconds{namespace="dci-devicechain",job="maintenance",instance="new"}
        values: 3900x240
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="old"}
        values: -3600x240
      - series: process_start_time_seconds{namespace="dci-devicechain",job="maintenance",instance="new"}
        values: -3600x240
    alert_rule_test:
      - eval_time: 50m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 100m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 160m
        alertname: PeriodicTaskStalled
        exp_alerts: []
  - name: unwanted increments are not give ups
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="processor",instance="a",result="unwanted"}
        values: 0+1x60
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  - name: device state drops have a dedicated alert
    interval: 1m
    input_series:
      - series: devicechain_devicestate_state_messages_total{namespace="dci-devicechain",job="processor",instance="a",result="dropped"}
        values: 0+1x60
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  - name: non device state drops fire immediately and clear after the window
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="processor",instance="a",result="dropped"}
        values: 0x9 1x50
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="processor",instance="b",result="dropped"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: ProcessorLoopDropping
        exp_alerts: []
      - eval_time: 11m
        alertname: ProcessorLoopDropping
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: processor
            exp_annotations: &id002
              runbook_url: https://docs.devicechain.io/deployment/alert-runbook#processorloopdropping
              summary: A job has processor loops giving up on messages
              description: 'In the last 15 minutes, processor loops in this job gave up on messages after their delivery attempts were exhausted. To find the loop, query {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_messages_total", result="dropped"} restricted to this job. Check the service logs for the failed operation, then its database, broker and downstream dependencies. Policy-refused traffic counted as unwanted does not trigger this alert. Device-state discards are covered separately by DeviceStateDroppingEvents.'
      - eval_time: 26m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  # At 30m the range is (15m, 30m]: reset at 21m, then nine drops.
  # increase is positive; reset-blind delta sees 9 - 100 and stays quiet.
  - name: counter reset inside the window still detects drops
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="processor",instance="a",result="dropped"}
        values: 100x20 0+1x39
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessorLoopDropping
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: processor
            exp_annotations: *id002
  # 🔴 THE v1.8.0-rc.1 REGRESSION. A real device-management runs several processing loops
  # in ONE pod, and their *_messages_total series differ only by metric name. increase()
  # drops __name__, so an expression that does not carry the name into a label first
  # leaves identical label sets, Prometheus refuses the evaluation ("vector cannot contain
  # metrics with the same labelset") and the alert can never fire. Every other case here
  # has one metric name per target, which is why they all passed while it was broken.
  - name: several loops on one target, one of them dropping
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: '0x60'
      - series: devicechain_devicemanagement_device_reports_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: '0x60'
      - series: devicechain_devicemanagement_raise_alarm_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: 0x9 1x50
    alert_rule_test:
      - eval_time: 9m
        alertname: ProcessorLoopDropping
        exp_alerts: []
      - eval_time: 11m
        alertname: ProcessorLoopDropping
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: device-management
            exp_annotations: *id002
      - eval_time: 26m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  - name: several loops on one target, none dropping
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: '0x60'
      - series: devicechain_devicemanagement_device_reports_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: '0x60'
      - series: devicechain_devicemanagement_raise_alarm_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  # A loop's FIRST drop, between its seeded zero and the next scrape, on a 30-second
  # scrape (the default when the ServiceMonitor names no interval). The subquery must
  # sample at least as often as the scrape, or it can step over the zero entirely: at a
  # one-minute step it sees nothing at 0s and 1 from 60s on, and never fires.
  - name: a first drop right after the seeded zero, on a 30-second scrape
    interval: 30s
    input_series:
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: _ 0 0x40
      - series: devicechain_devicemanagement_raise_alarm_messages_total{namespace="dci-devicechain",job="device-management",instance="10.0.0.7:9090",pod="device-management-0",result="dropped"}
        values: _ 0 1x40
    alert_rule_test:
      - eval_time: 5m
        alertname: ProcessorLoopDropping
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: device-management
            exp_annotations: *id002
  - name: idle installation
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 30m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  - name: another namespace is excluded
    interval: 1m
    input_series:
      - series: devicechain_devicemanagement_sweep_last_success_timestamp_seconds{namespace="dci-other",job="maintenance",instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: devicechain_devicemanagement_sweep_pass_interval_seconds{namespace="dci-other",job="maintenance",instance="a"}
        values: 60x60
      - series: process_start_time_seconds{namespace="dci-other",job="maintenance",instance="a"}
        values: -3600x60
      - series: devicechain_devicemanagement_resolve_messages_total{namespace="dci-other",job="processor",instance="a",result="dropped"}
        values: 0+1x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PeriodicTaskStalled
        exp_alerts: []
      - eval_time: 30m
        alertname: ProcessorLoopDropping
        exp_alerts: []
  - name: an old replica without the task cannot age a fresh declaring replica
