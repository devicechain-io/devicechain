#
# promtool UNIT TESTS for the database-backup alerting rules (ADR-028, ADR-020 A2.5).
#
# WHY THESE EXIST RATHER THAN JUST `promtool check rules`
#
# `check rules` PARSES. It never evaluates an expression against a single sample,
# so every rule in the group can be syntactically perfect and semantically
# inverted and it reports SUCCESS. That is not hypothetical here: the first
# version of these rules passed `check rules`, passed `helm lint`, passed a
# render-and-eyeball, and was green on the exact failure it was written to catch —
# a Cluster with its backup configuration deleted, where CloudNativePG's
# `archive_command` returns 0 for every segment and `pg_stat_archiver` reports
# healthy continuous archiving forever.
#
# An alert is a claim about which states are bad. The only way to check a claim
# about states is to feed it states. So each case below is a SCENARIO with a name,
# and the negative cases — the healthy cluster, the idle cluster — matter as much
# as the positive ones: a rule that fires on everything passes every "does it
# fire" test and gets switched off within a week.
#
# 🔴 THE SERIES ARE THE SPEC. If these do not match what CloudNativePG and the
# barman plugin actually export, the tests are self-consistent fiction. Sourced:
#   - cnpg_pg_stat_archiver_*  — CNPG config/manager/default-monitoring.yaml,
#     `cnpg_` prefix + query name + column. Every timestamp column is
#     COALESCE(..., -1), which is why -1 appears below as a real value and not as
#     a stand-in for "missing".
#   - barman_cloud_cloudnative_pg_io_*  — the plugin's own observability doc,
#     exported through the instance manager's endpoint, hence the same pod labels.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first: these
# assert against the SHIPPED rules, not against a copy of them.

rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # -------------------------------------------------------------------------
  # THE FINDING. A Cluster with no barman plugin attached.
  #
  # archive_command is still set and still returns 0, so archived_count climbs
  # and no failure is ever recorded. The plugin sidecar does not exist, so no
  # barman_cloud_* series does either. This is a database that cannot be
  # restored, reporting perfect health.
  # -------------------------------------------------------------------------
  - name: a cluster with no WAL archiver attached is not silently healthy
    interval: 1m
    input_series:
      # Archiving "succeeds" every minute. A perfectly healthy-looking archiver.
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1+1x120"
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dc-system", pod="dc-rdb-1"}'
        values: "30+0x120"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1780000000+60x120"
      # Never failed, because nothing was ever attempted for real.
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-1+0x120"
      # NOTE the absence: no barman_cloud_* series at all. That IS the condition.
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresWALArchivingNotConfigured
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dc-system
              pod: dc-rdb-1
            exp_annotations:
              summary: "A PostgreSQL cluster has no WAL archiver attached and is NOT being backed up"
              description: >-
                dc-rdb-1 is running with archiving switched on and NO backup plugin behind it, so
                every WAL segment is being "archived" by a command that discards it and reports
                success. Nothing else will tell you: archived_count rises, no failure is ever
                recorded, disk does not grow, and every other backup alert stays green. This database
                cannot be restored to any point in time. Check that the Cluster still carries its
                barman-cloud entry under spec.plugins and that its ObjectStore exists.
      # 🔴 The counterweight, and the reason this scenario is worth more than a
      # single assertion: every OTHER rule must stay quiet here. If one of them
      # also fired, the pg_stat_archiver-based rules would look like they cover
      # this case and the finding would be hidden rather than fixed.
      - eval_time: 20m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: PostgresHasNeverArchivedWAL
        exp_alerts: []
      - eval_time: 20m
        alertname: PostgresNoRecentBaseBackup
        exp_alerts: []

  # -------------------------------------------------------------------------
  # The healthy case. Nothing may fire, or none of the above means anything.
  # -------------------------------------------------------------------------
  - name: a healthy backed-up cluster raises nothing
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1+1x120"
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dc-system", pod="dc-rdb-1"}'
        values: "45+0x120"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1780000000+60x120"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-1+0x120"
      # The plugin is attached, and its last backup is recent. promtool's clock
      # starts at 0, so `time() - x > 129600` needs x above -129600 to stay quiet.
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dc-system", pod="dc-rdb-1"}'
        values: "0+0x120"
      - series: 'kubelet_volume_stats_available_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "16000000000+0x120"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x120"
      # An archiver that keeps up: a couple of segments waiting at any moment.
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dc-system", pod="dc-rdb-1", value="ready"}'
        values: "2+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: PostgresWALArchivingNotConfigured
        exp_alerts: []
      - eval_time: 90m
        alertname: PostgresWALArchiveBacklog
        exp_alerts: []
      - eval_time: 90m
        alertname: BackupDestinationFillingFast
        exp_alerts: []
      - eval_time: 90m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: PostgresHasNeverArchivedWAL
        exp_alerts: []
      - eval_time: 90m
        alertname: PostgresNoRecentBaseBackup
        exp_alerts: []
      - eval_time: 90m
        alertname: BackupDestinationAlmostFull
        exp_alerts: []

  # -------------------------------------------------------------------------
  # A ScheduledBackup that has quietly stopped running. Archiving is healthy, so
  # nothing else here fires; only the age of the last base backup gives it away.
  #
  # 🔴 THIS RULE HAD NO FIRING CASE until the coverage check started requiring one
  # of every alert. The two assertions above both say it stays quiet, and a quiet
  # assertion is satisfied just as well by a rule that can never fire -- or by a
  # rule file that never loaded.
  #
  # promtool's clock starts at 0, so a backup timestamp of -200000 is 200000s old
  # at the start: past the 36h (129600s) threshold from the first sample, with the
  # 30m `for` still to run.
  # -------------------------------------------------------------------------
  - name: a cluster with no recent base backup fires, after its for window
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1+1x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1780000000+60x60"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-1+0x60"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-200000+0x60"
    alert_rule_test:
      # Still inside `for: 30m`: one missed run is not yet a page.
      - eval_time: 25m
        alertname: PostgresNoRecentBaseBackup
        exp_alerts: []
      - eval_time: 35m
        alertname: PostgresNoRecentBaseBackup
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              namespace: dc-system
              pod: dc-rdb-1
            exp_annotations:
              summary: "No successful database base backup in 36 hours"
              description: >-
                dc-rdb-1 has taken no successful base backup in 36 hours against a
                daily schedule. WAL archiving alone restores NOTHING — a recovery replays WAL forward
                from a base backup, so an ever-growing archive with no recent base is a longer and
                longer replay onto older and older state. Retention pruning has stopped too: obsolete
                backups are deleted only after a new backup completes.
      # Archiving itself is fine, and must not be reported as anything else.
      - eval_time: 35m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: PostgresWALArchivingNotConfigured
        exp_alerts: []

  # -------------------------------------------------------------------------
  # The IDLE cluster. This is the false-positive test, and it is the reason
  # there is no "seconds since last archival" threshold rule.
  #
  # archive_timeout does NOT force a WAL switch when no important WAL has been
  # logged since the last one (PostgreSQL CheckArchiveTimeout), so a quiet
  # database genuinely archives nothing for hours while being entirely healthy.
  # A staleness threshold would page on every small install.
  # -------------------------------------------------------------------------
  - name: an idle but working cluster raises nothing
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "7+0x180"
      # Four hours since the last segment, and climbing. Healthy: nothing has
      # been written.
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "14400+60x180"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "1780000000+0x180"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "-1+0x180"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "0+0x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: PostgresWALArchivingNotConfigured
        exp_alerts: []
      - eval_time: 150m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 150m
        alertname: PostgresHasNeverArchivedWAL
        exp_alerts: []

  # -------------------------------------------------------------------------
  # A configured destination that is now erroring.
  # -------------------------------------------------------------------------
  - name: a failing archiver fires
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dc-system", pod="dc-rdb-1"}'
        values: "40+0x120"
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dc-system", pod="dc-rdb-1"}'
        values: "600+60x120"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1780000000+0x120"
      # Failing more recently than it last succeeded.
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "1780000600+60x120"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dc-system", pod="dc-rdb-1"}'
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresWALArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dc-system
              pod: dc-rdb-1
            exp_annotations:
              summary: "PostgreSQL WAL archiving is failing"
              description: >-
                dc-rdb-1 last FAILED to archive a WAL segment more recently than it last succeeded,
                so this database is no longer being backed up. Nothing will stall and nothing will
                crash: writes continue and every health check stays green. Two things are
                accumulating — the recovery gap, and unshipped WAL on the database's own volume,
                which will eventually fill it and stop PostgreSQL. Check the object store is
                reachable, has space, and still accepts these credentials.

  # -------------------------------------------------------------------------
  # 🔴 THE SAME FAILURE IN THE INSTANCE'S OWN NAMESPACE — and this group exists to
  # stop the rest of this file going vacuous.
  #
  # These rules select TWO namespaces: the shared relational store's (dc-system) and
  # this instance's own, which holds the event store. Every other group naming the
  # instance's namespace above asserts `exp_alerts: []`, and a negative assertion
  # passes just as well when the series are not selected AT ALL — so if the rules'
  # namespace selector and these fixtures' labels ever part company, those groups go on
  # passing over series the rules can no longer see, and the file reports green having
  # tested the event store not at all. Measured: renaming the instance's namespace and
  # leaving this file alone did exactly that, and only this group turns it red.
  #
  # So one POSITIVE assertion in the instance's namespace, asserting the namespace label
  # on the alert it produces. It is the same archiver failure as the group above, one
  # store over.
  # -------------------------------------------------------------------------
  - name: a failing archiver in the instance's own namespace fires
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "40+0x120"
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "600+60x120"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "1780000000+0x120"
      # Failing more recently than it last succeeded.
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "1780000600+60x120"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresWALArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dci-devicechain
              pod: dc-tsdb-1
            exp_annotations:
              summary: "PostgreSQL WAL archiving is failing"
              description: >-
                dc-tsdb-1 last FAILED to archive a WAL segment more recently than it last succeeded,
                so this database is no longer being backed up. Nothing will stall and nothing will
                crash: writes continue and every health check stays green. Two things are
                accumulating — the recovery gap, and unshipped WAL on the database's own volume,
                which will eventually fill it and stop PostgreSQL. Check the object store is
                reachable, has space, and still accepts these credentials.

  # -------------------------------------------------------------------------
  # Never archived, with the plugin attached. The gap between "failing" and
  # "stale" that the first version of these rules left uncovered: BOTH
  # timestamps are the -1 sentinel, so the failing rule computes 0 > 1 and the
  # old staleness rule computed -1 > 900. Neither fired.
  # -------------------------------------------------------------------------
  - name: a cluster that has never archived a segment fires
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dc-system", pod="dc-rdb-1"}'
        values: "0+0x180"
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-1+0x180"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-1+0x180"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dc-system", pod="dc-rdb-1"}'
        values: "-1+0x180"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dc-system", pod="dc-rdb-1"}'
        values: "0+0x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: PostgresHasNeverArchivedWAL
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dc-system
              pod: dc-rdb-1
            exp_annotations:
              summary: "PostgreSQL has never successfully archived a WAL segment"
              description: >-
                dc-rdb-1 has archived no WAL segment, ever. The first base backup forces a segment
                switch, so a working cluster leaves this state within minutes of creation — an hour
                in it means archiving has never worked here, not that the database is quiet. Note
                this records no FAILURE either, so the failing-archival alert cannot see it: an
                archiver that hangs rather than errors looks exactly like this.
      # The two -1 timestamps must NOT look like a failure to the other rule.
      - eval_time: 150m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []

  # -------------------------------------------------------------------------
  # The destination filling up, before it reaches the databases.
  # -------------------------------------------------------------------------
  - name: a nearly-full backup destination fires
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "2000000000+0x120"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupDestinationAlmostFull
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dc-system
              persistentvolumeclaim: dc-object-store-data
            exp_annotations:
              summary: "The backup destination is almost full"
              description: >-
                dc-object-store-data is over 85% full. When it fills, WAL archiving starts failing —
                and failed archiving does not stall commits, it accumulates WAL on the DATABASES'
                volumes until those fill and PostgreSQL stops. So this ends as a database outage
                whose cause points nowhere near a database. Grow the volume, shorten
                backup_retention, remove archives left behind by instances that no longer exist,
                or move to an external destination.

  # -------------------------------------------------------------------------
  # A PVC in some other namespace must not be attributed to this instance. The
  # first version of this rule had no namespace selector at all.
  # -------------------------------------------------------------------------
  - name: another namespace's object store is not this instance's problem
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="somebody-else", persistentvolumeclaim="dc-object-store-data"}'
        values: "1000000+0x120"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="somebody-else", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupDestinationAlmostFull
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 🔴 THE ARCHIVER THAT HANGS. Nothing fails: last_failed_time stays -1 and
  # archived_count simply stops rising, so PostgresWALArchivingFailing — which
  # compares the failure time against the success time — is silent by
  # construction, and PostgresHasNeverArchivedWAL is silent because this primary
  # HAS archived before. Meanwhile segments pile up in pg_wal waiting to ship, on
  # the primary's own volume, 20 a minute. Only the backlog rule sees it.
  # -------------------------------------------------------------------------
  - name: a hung archiver that records no failure fires on its backlog
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "500+0x20"
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "30+60x20"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "1780000000+0x20"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "-1+0x20"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="dci-devicechain", pod="dc-tsdb-1"}'
        values: "0+0x20"
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dci-devicechain", pod="dc-tsdb-1", value="ready"}'
        values: "0+20x20"
      # A standby marks what it receives done, so it holds no backlog of its own.
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dci-devicechain", pod="dc-tsdb-2", value="ready"}'
        values: "0+0x20"
    alert_rule_test:
      # Past the threshold since 2m, and the `for` still running.
      - eval_time: 6m
        alertname: PostgresWALArchiveBacklog
        exp_alerts: []
      - eval_time: 8m
        alertname: PostgresWALArchiveBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dci-devicechain
              pod: dc-tsdb-1
              value: ready
            exp_annotations:
              summary: "PostgreSQL is holding WAL it has not shipped to the backup destination"
              description: >-
                dc-tsdb-1 has 160 WAL segments (16 MiB each) waiting to be archived. They stay on
                this database's own volume until they ship — the replicas do not help, because a
                standby does not keep the primary's unshipped WAL — and when the volume fills,
                PostgreSQL stops and does not fail over. If the WAL archiving failing alert is also
                firing, the destination is refusing writes: check that the object store is
                reachable and has space. If it is not, the archiver is slow or hung, or ingest is
                producing WAL faster than it ships: check the backup sidecar's logs and the object
                store's free space, and grow the database volume if the backlog keeps rising.
      # The gap this rule closes: the failure rule cannot see a hang.
      - eval_time: 8m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: PostgresHasNeverArchivedWAL
        exp_alerts: []

  # -------------------------------------------------------------------------
  # NEGATIVE CONTROLS for the backlog. A primary that keeps up holds a handful of
  # ready segments; one catching up after its store came back holds a burst that
  # drains inside the `for`; another instance's primary is not this instance's.
  # -------------------------------------------------------------------------
  - name: a keeping-up archiver, a catch-up burst and another namespace's backlog do not fire
    interval: 1m
    input_series:
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dc-system", pod="dc-rdb-1", value="ready"}'
        values: "3+0x60"
      # 100 ready for four minutes — a reconnect catching up — then drained.
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dci-devicechain", pod="dc-tsdb-1", value="ready"}'
        values: "0+0x10 100+0x3 0+0x46"
      # The `done` series of the same metric is never the backlog.
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dci-devicechain", pod="dc-tsdb-1", value="done"}'
        values: "500+0x60"
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="dci-some-other-instance", pod="dc-tsdb-1", value="ready"}'
        values: "500+0x60"
    alert_rule_test:
      - eval_time: 14m
        alertname: PostgresWALArchiveBacklog
        exp_alerts: []
      - eval_time: 30m
        alertname: PostgresWALArchiveBacklog
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 🔴 THE MEASURED CASE FOR THE STORE. On a v0.18.0 benchmark cluster the 20 GiB
  # default store began a sustained-ingest run with about 6 GB free — the rest held
  # by a destroyed instance's archive — and the run's WAL took it to full within
  # minutes. Replayed here as 500 MB a minute from 6 GB free: full at 12m.
  #
  # BackupDestinationAlmostFull is still PENDING at 7m (under 15 % only since ~5.6m,
  # and it holds for 15m) and would fire only after the store is full. The rate
  # rule fires at 7m, five minutes before. Then the volume is doubled, and the rate
  # alert clears on its own.
  # -------------------------------------------------------------------------
  - name: a backup destination filling in minutes fires before it is full, and clears when grown
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "6000000000-500000000x7 23474836480-500000000x12"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x7 42949672960+0x12"
    alert_rule_test:
      - eval_time: 5m
        alertname: BackupDestinationFillingFast
        exp_alerts: []
      - eval_time: 7m
        alertname: BackupDestinationFillingFast
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              namespace: dc-system
              persistentvolumeclaim: dc-object-store-data
            exp_annotations:
              summary: "The backup destination will be full within the hour at its current rate"
              description: >-
                dc-object-store-data is more than 65% full and filling fast enough to run out of
                space within the hour. When it is full, WAL archiving fails for EVERY database
                archiving into it, and each primary keeps its unshipped WAL on its own volume until
                that fills and PostgreSQL stops. Likely causes, in order: an instance ingesting
                faster than the store was sized for; archives left in the store by instances that
                no longer exist (list the bucket and compare with the instances that are running);
                a scheduled base backup that stopped, so nothing is being pruned. Grow the volume,
                remove what no running instance owns, or move backups to an object store you run
                yourself.
      - eval_time: 7m
        alertname: BackupDestinationAlmostFull
        exp_alerts: []
      - eval_time: 18m
        alertname: BackupDestinationFillingFast
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 🔴 THE CASE THE FREE-SPACE GATE IS FOR, and the only one that reaches it. A long
  # base backup on a store with room: 200 MB a minute for 15 minutes from 12.5 GB free
  # of 20 GiB. The 10m slope projects the store empty within the hour from about 3m
  # on, and stays that steep past the 5m `for` — so without the gate this fires at 8m.
  # It ends at 9.5 GB free, 44% of the store, never under the 35% gate. (The short
  # burst in the next group flattens before the `for` completes, so the `for` alone
  # quiets it; it proves nothing about the gate.)
  # -------------------------------------------------------------------------
  - name: a long base backup on a store with room is not filling fast
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "12500000000-200000000x15 9500000000+0x30"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x45"
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupDestinationFillingFast
        exp_alerts: []
      - eval_time: 15m
        alertname: BackupDestinationFillingFast
        exp_alerts: []

  # -------------------------------------------------------------------------
  # NEGATIVE CONTROLS for the store's rate rule. A small base backup lands
  # gigabytes in minutes and then stops — on a store with room, that is not a page.
  # A store creeping up over days is AlmostFull's to report, not this rule's. And
  # another namespace's store, however fast it falls, is not this instance's.
  # -------------------------------------------------------------------------
  - name: a base backup burst, a slow creep and another namespace's store do not fire as filling fast
    interval: 1m
    input_series:
      # Half free, then 2 GB in four minutes (a base backup), then flat.
      - series: 'kubelet_volume_stats_available_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "10737418240+0x30 10237418240-500000000x3 8737418240+0x60"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x94"
      # 20 % free, creeping by a megabyte a minute.
      - series: 'kubelet_volume_stats_available_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data-2"}'
        values: "4294967296-1000000x94"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="dc-system", persistentvolumeclaim="dc-object-store-data-2"}'
        values: "21474836480+0x94"
      - series: 'kubelet_volume_stats_available_bytes{namespace="somebody-else", persistentvolumeclaim="dc-object-store-data"}'
        values: "6000000000-500000000x11"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="somebody-else", persistentvolumeclaim="dc-object-store-data"}'
        values: "21474836480+0x11"
    alert_rule_test:
      - eval_time: 10m
        alertname: BackupDestinationFillingFast
        exp_alerts: []
      - eval_time: 40m
        alertname: BackupDestinationFillingFast
        exp_alerts: []
      - eval_time: 90m
        alertname: BackupDestinationFillingFast
        exp_alerts: []
