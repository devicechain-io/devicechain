{{/*
Alerting rules for the event-processing (DETECT + REACT) pipeline (Slice 8).
A Prometheus-Operator PrometheusRule CRD, gated on metrics.enabled + metrics.alerts
(same operator assumption as the ServiceMonitor). Every expression is scoped to THIS
instance's namespace, so one rule object alerts only on its own instance. Thresholds are
conservative defaults tuned for alert-quietness; operators tune per deployment.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: event-processing
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.event-processing
      rules:
        - alert: DetectHasNoLeader
          expr: |
            max(devicechain_eventprocessing_detect_is_leader{namespace="{{ $ns }}"}) == 0
            or absent(devicechain_eventprocessing_detect_is_leader{namespace="{{ $ns }}"})
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "No replica holds the DETECT partition"
            description: "Nothing has owned the DETECT partition for 2m, so no detection rule is being evaluated for any tenant. The absent() half is not optional: a pod in CrashLoopBackOff publishes no series at all, so a rule written only against the value would go quiet at exactly the moment it should fire."
        - alert: DetectLeaderIsNotConsuming
          expr: |
            max(devicechain_eventprocessing_detect_is_leader{namespace="{{ $ns }}"}) == 1
            and max(devicechain_eventprocessing_detect_live{namespace="{{ $ns }}"}) == 0
            and max(increase(devicechain_eventprocessing_detect_checkpoints_total{namespace="{{ $ns }}"}[10m])) == 0
          for: 10m
          labels:
            severity: critical
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "A DETECT leader is holding the partition without consuming"
            description: "A replica owns the partition but is not inside a live term and has committed nothing for 10m — it is stuck building a term, which holds the partition against every standby while detecting nothing. The checkpoint term is what keeps this quiet during a long replay, which checkpoints as it goes."
        - alert: DetectConsumerBacklogHigh
          expr: max(devicechain_eventprocessing_detect_consumer_pending{namespace="{{ $ns }}"}) > 50000
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "DETECT consumer is falling behind"
            description: "The resolved-events durable consumer has >50k undelivered messages for 10m; the DETECT engine is not keeping up with ingest."
        - alert: DetectWatermarkLagHigh
          expr: max(devicechain_eventprocessing_detect_watermark_lag_seconds{namespace="{{ $ns }}"}) > 300
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "DETECT watermark is lagging wall-clock"
            description: "The engine watermark is >5m behind wall-clock for 10m; time-based detections (absence/duration) will fire late."
        - alert: DetectCheckpointsStalledWithBacklog
          expr: |
            max(increase(devicechain_eventprocessing_detect_checkpoints_total{namespace="{{ $ns }}"}[15m])) == 0
            and max(devicechain_eventprocessing_detect_consumer_pending{namespace="{{ $ns }}"}) > 0
          for: 15m
          labels:
            severity: critical
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "DETECT is not checkpointing while a backlog exists"
            description: "No committed checkpoint in 15m while undelivered work waits — the single-writer loop is likely stuck (broker/store outage or a halted stale writer)."
        - alert: DetectFanoutEvalErrors
          expr: sum(rate(devicechain_eventprocessing_detect_fanout_eval_errors_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "DETECT leaf-predicate evaluation errors"
            description: "Rule leaf predicates are erroring during fan-out. The sample is SKIPPED, not treated as a non-match, so firings may be silently missed. This counter is unlabelled and nothing logs the rule id — use the canvas preview on each suspect rule to attribute the error."
        - alert: GeoFenceSetPublishFailing
          expr: sum(rate(devicechain_devicemanagement_geofence_set_publish_failures_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "Geofence edits are not being announced to the detection engine"
            description: "device-management could not publish a geofence-set manifest — a marshal error, a broker refusal, or a transport fault. The fence edit itself succeeded and is durable; what failed is telling event-processing about it, so containment holds the previous fence set until the five-minute reconcile sweep repairs it. A sustained rate means every fence edit is taking minutes to take effect. If this started after a broker configuration change, check that infrastructure.nats.streamMaxMsgSize is not set below what a manifest needs — the service logs a warning naming both sizes at startup."
        - alert: DetectFenceGeometryUnresolved
          expr: sum(rate(devicechain_eventprocessing_detect_fence_geometry_unresolved_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "Geofence geometry cannot be read back from device-management"
            description: "A geofence set names fences whose geometry this service could not fetch from device-management's archive. Those fences are installed carrying their error, so containment reports unresolvable for them rather than answering — which also shows up as DetectFanoutEvalErrors. It repairs on the next reconcile sweep if the cause was transient; sustained means the archive read is failing. Check device-management's health and the service-token seam. The tenant and fence are named in event-processing's error log, never in this counter."
        - alert: DetectFenceGeometryHashMismatch
          expr: sum(rate(devicechain_eventprocessing_detect_fence_geometry_hash_mismatch_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "Geofence geometry did not match the content address it was served under"
            description: "A geometry document did not hash to the address it was requested under. This is never transient and never benign: an address IS the SHA-256 of the document stored under it, so either device-management served the wrong row, something re-encoded the document in transit, or the archive is corrupt. The affected fences are refused rather than compiled, which is why containment degrades instead of answering wrongly. Investigate before restarting anything — a restart hides the symptom and changes nothing."
        - alert: DetectFenceArchiveSkew
          expr: sum(rate(devicechain_eventprocessing_detect_fence_archive_skew_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "device-management does not serve the geofence manifest doors"
            description: "event-processing asked device-management for a fence-set manifest and was told the query does not exist, which means the two are running builds from either side of the manifest-delivery change. Expected briefly while an upgrade rolls, since the two services are independent Deployments and neither waits for the other. Sustained means device-management is behind — most likely rolled back on its own — and fence edits are not reaching the detection engine until it rolls forward."
        - alert: ReactPoisonDropping
          expr: sum(rate(devicechain_eventprocessing_react_events_poison_dropped_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 10m
          labels:
            severity: critical
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "REACT is giving up on un-dispatchable derived events"
            description: "Derived events are hitting the redelivery cap — raised alarms and dispatched commands are not reaching their sinks. A REACT sink (alarm/command) is likely down. The events are dead-lettered rather than lost, so they can be inspected; nothing replays them, so the alarms and commands they carried still did not happen."
        - alert: DeadLetterWriteLost
          expr: |
            sum(rate(devicechain_eventprocessing_react_events_dead_letter_lost_total{namespace="{{ $ns }}"}[5m]))
              + sum(rate(devicechain_notificationmanagement_notifications_dead_letter_lost_total{namespace="{{ $ns }}"}[5m]))
              + sum(rate(devicechain_commanddelivery_command_delivery_responses_dead_letter_lost_total{namespace="{{ $ns }}"}[5m]))
              > 0
          for: 5m
          labels:
            severity: critical
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "work is being lost with no record of it"
            description: "A consumer gave up on a message AND could not write it to the dead-letter stream, on a delivery that will not repeat — so the work is gone and nothing anywhere records what it was. This is the one failure on these paths with no evidence left behind, which is why it is separate from the giving-up alerts and fires faster than they do. The dead-letter stream is the thing to look at: JetStream unreachable, or the stream at its byte ceiling."
        - alert: ReactConnectorEgressShedding
          expr: sum by (action) (rate(devicechain_eventprocessing_react_connector_egress_shed_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "Connector actions are being shed at the source for over-quota egress"
            description: "REACT is dropping httpCall/publish actions at the source because a tenant is over its outbound egress quota (ADR-060 SD-3) for 15m — a source shed destroys the action (this counter is its only evidence). Expected governance back-pressure, but sustained shedding is likely a runaway/misconfigured rule or a per-tenant outbound limit set too low. Raise the tenant's outboundMessagesPerSecond/outboundBurst if legitimate."
        - alert: DetectTenantOverStateBudget
          expr: |
            max(devicechain_eventprocessing_detect_tenants_over_rule_budget{namespace="{{ $ns }}"}) > 0
            or max(devicechain_eventprocessing_detect_tenants_over_live_key_budget{namespace="{{ $ns }}"}) > 0
            or max(devicechain_eventprocessing_detect_tenants_over_retained_sample_budget{namespace="{{ $ns }}"}) > 0
          for: 30m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "A tenant is over its DETECT state budget"
            description: "One or more tenants exceed the per-tenant rule-count, live-key or retained-sample budget (ADR-023) for 30m. Find the offender in the event-processing warn log. Check all three memory gauges before concluding memory is fine — devicechain_eventprocessing_detect_live_keys stays FLAT for the two shapes that fill the heap fastest: a long-window rule on one busy device moves detect_retained_samples only, and a long absence/session timeout under frequent reporting moves detect_pending_timers only (that one is instance-wide, not per-tenant, and has no budget arm here)."
        - alert: EventProcessingStreamNearFull
          expr: |
            max by (stream) (
              devicechain_eventprocessing_jetstream_stream_used_bytes{namespace="{{ $ns }}"}
              / clamp_min(devicechain_eventprocessing_jetstream_stream_limit_bytes{namespace="{{ $ns }}"}, 1)
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $ns }}
          annotations:
            summary: "A JetStream stream is near its ceiling"
            description: "Stream {{`{{ $labels.stream }}`}} is over 80% of its byte ceiling for 10m; the oldest messages will be evicted (DiscardOld) once full."
{{- end }}
