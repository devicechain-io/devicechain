{{/*
Alerting rules for event-sources' external MQTT sources and its broker presence tap.

WHY THIS GROUP EXISTS. A source that reads an operator's own MQTT broker is read by ONE
event-sources pod at a time, chosen by a per-source lease: the broker gives every session
on a filter every message and that path carries no dedup id, so a second reading pod would
store everything twice. The other pods stand by and stay Ready, because they still serve
HTTP ingest, the platform gateway and presence. So "nobody is reading this source" is a
state the platform can be in WITHOUT anything failing: the operator's broker is down and
the pod that took the source over could not connect (it releases the source and tries
again rather than taking the rest of ingest down with it), or the lease bucket cannot be
reached. This alert is how that state is seen.

Every pod exports devicechain_eventsources_external_mqtt_owner{source} for every external
source from the moment it starts: 1 on the pod reading it, 0 on the others. Per source,
the sum across pods is 1 when the source is healthy, 0 when nobody reads it, and 2 or more
when more than one pod does.

NO absent() ARM, deliberately, unlike DetectHasNoLeader. An install with no external
source exports no series at all, and an absent() arm would fire on every such install.
The chart cannot tell which installs have one: the sources are free-form service
configuration. A crash-looping event-sources exports nothing either, and that is a pod
failing loudly in its own right.

BrokerPresenceLosingTransitions watches presence_events_failed_total, which counts a
presence transition (from the tap or from a reconciliation repair) that the inbound stream
refused or never acknowledged. The tap's advisories arrive on core NATS with no
redelivery, so a failed transition is gone until the next reconciliation pass repairs it.
A transition refused because the tap was stopping is NOT counted (the writer is closed only
in the stop hook), so a rolling restart does not move it. Every pod exports it at 0 from
start, so the first failure after a restart is an increase.

MqttFailClosedDurableMissing and MqttFailClosedStoreNotAsDeclared watch the fail-closed MQTT
acknowledgement (infrastructure.nats.mqttFailClosed). With it on, the MQTT gateway's message
store is declared by event-sources (discard new, bounded) with one platform durable per kind
of device publish, and every pod re-checks both every 30 seconds, creating again what is
missing and putting back what was changed. A missing durable is the loss case that looks like
success: the broker skips a publish nobody is interested in and still acknowledges it. So that
alert is critical and has no `for`: each count is loss already, and the gauge arm covers a
durable the check could not create. The series exist ONLY with the setting on, so an install
with it off exports none and neither alert can fire there; no absent() arm, for the same reason
as above. The counters are exported at 0 from start, so the first event is an increase.
Neither counts a planned change: a rolling update hands the store over without removing a
durable (a pod with the setting off removes them only once no pod with it on holds the store
and they are drained), and a bound or replica count changed in the configuration is a
take-over or a raise, not a repair.

MqttGatewayStreamUnbounded watches the broker's own MQTT gateway streams ($MQTT_msgs, $MQTT_out,
$MQTT_qos2in). nats-server creates them when the first MQTT device connects, with no size limit, so
event-sources puts a ceiling on them and re-checks every 30 seconds in every pod, which covers a stream
created long after startup. The gauge is 1 only when a stream is found unbounded AND the ceiling could
not be set (typically the broker has no storage left to reserve it), so the alert has a `for` that rides
out a failed leader election and never fires while the platform is bounding streams normally. The
series are exported by every pod at 0 from start, whatever mqttFailClosed says.

IngestShedBeyondLagCredit and IngestAppendSkewLarge watch the lag-credited ingest gate
(eventSources.ingestMetering: lagCredit). Its series are registered on every pod but carry no
child until that gate meters something, so with the default (legacy) both expressions are empty
and neither alert can fire; no absent() arm, for the same reason as above. None carries a tenant.

IngestShedBeyondLagCredit is the case the gate exists to remove coming back: messages shed at the
tenant's ceiling on the fresh route while fresh admissions on the same reader stream were being
judged against more than a second of lag credit, so the platform's readers were measurably behind
when the shed happened. That is either a stall longer than the tenant's burst covers (the credit
is capped there, never above 5 seconds) or a tenant above its ceiling during a stall; the series
cannot tell which, because they carry no tenant. NO `for`, like MqttIngestShedAfterAcknowledgement
and for its reason: the shed is a burst of seconds, and an MQTT message shed here was already
acknowledged to its device. The two fire together for such a shed; this one says the lag credit was
in play, the other says data was lost.

IngestAppendSkewLarge is the broker's clock more than 2 seconds from a pod's: the gate corrects the
age of a message by the measured offset, up to 2 seconds either way, and counts every message read
while the estimate sits at that clamp. Beyond it the gate under- or over-credits by the difference.
`for` equals the increase window, as for the sibling alerts: one clock step that the estimate
relearns clears inside a window, a clock that stays out lasts the whole window.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: event-sources
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.event-sources
      rules:
        - alert: ExternalMqttSourceNotReadByOnePod
          # `sum`, not `max`: the question is how many pods read the source, and each pod
          # reports only itself. `for: 2m` rides out a handover, where the source is
          # briefly read by nobody (a graceful one takes about two seconds, an abrupt one
          # about the lease's 30 seconds plus a reconnect).
          expr: sum by (source) (devicechain_eventsources_external_mqtt_owner{namespace="{{ $ns }}"}) != 1
          for: 2m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#externalmqttsourcenotreadbyonepod"
            summary: "An external MQTT source is not being read by exactly one pod"
            description: "External MQTT source {{ "{{ $labels.source }}" }} has been read by {{ "{{ $value }}" }} event-sources pods for 2m; it should be read by exactly one. At 0, nothing is reading it, and whatever your broker delivers meanwhile is lost, because the session is not persistent. The usual cause is that your broker is unreachable or refusing the connection: the pod that took the source over logs why, releases the source and tries again every 15 seconds. Another cause is that event-sources cannot reach the platform's message broker to agree which pod reads the source; its log says so. Above 1, more than one pod reports reading it. A pod that has lost the source drops what it is still delivered rather than storing it, and stops reporting within a lease renewal, so a value above 1 that lasts points at a pod that has lost contact with the platform's message broker."
        # One event per failed publish, lost: that transport is at-most-once and never retries.
        # `for` equals the increase window, as for the sibling ingest-loss alerts: a failure
        # that stops clears inside one window, one that lasts a full window is ingest losing
        # data. Every pod exports the series at 0 for every external source from start, so
        # the first loss after a restart is an increase and not a series appearing at 1.
        - alert: ExternalMqttSourceLosingEvents
          expr: sum by (source) (increase(devicechain_eventsources_total_msg_publish_failed{namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#externalmqttsourcelosingevents"
            summary: "An external MQTT source is losing events it has already read"
            description: "For at least 10 minutes, external MQTT source {{ "{{ $labels.source }}" }} has been losing events: they were read from your broker and decoded, but publishing them to the platform's event stream failed. That source does not retry, and your broker was already told they arrived, so each one is gone. The cause is on the platform's side, not your broker's: its message broker is refusing or not answering publishes. Check the platform's message broker, and the event-sources log for 'is lost: this transport does not retry', which names the source and tenant of each."
        # NO `for`, unlike the sibling ingest-loss alerts, and that is the point of this one. A
        # platform stall that sheds a tenant's queued traffic is a single burst of seconds, and a
        # `for` as long as the window would let it come and go unseen. Every message counted here
        # was acknowledged to its device (PUBACK) before it was read, so one is already data lost:
        # the alert fires on the first, holds for the 10-minute window, and clears 10 minutes after
        # the last. Every pod exports the series at 0 for every MQTT source from start, so the
        # first shed after a restart is an increase and not a series appearing at 1.
        - alert: MqttIngestShedAfterAcknowledgement
          expr: sum by (source) (increase(devicechain_eventsources_total_msg_shed_acknowledged{namespace="{{ $ns }}"}[10m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#mqttingestshedafteracknowledgement"
            summary: "MQTT messages were dropped at the ingest ceiling after the device was told they arrived"
            description: "In the last 10 minutes, {{ "{{ $value }}" }} messages from MQTT source {{ "{{ $labels.source }}" }} were dropped at their tenant's ingest ceiling. The broker had already acknowledged each one to its device (PUBACK), so the device will not resend it: these messages are lost, not deferred. Either a tenant is sending above its ceiling, or the platform stalled briefly and the messages queued behind it arrived together; the shed counters carry the shed class but not the tenant, so raise event-sources to debug logging to name the tenant. Compare devicechain_eventsources_total_msg_rate_limited and total_msg_reading_limited, check whether the tenant's ceiling (ingestReadingsPerSecond, ingestBurst) matches what its devices send, and look at the platform's message broker for a stall (a log line saying an internal subscription took too long) at the same time."
        # `for` equals the increase window, as for the sibling ingest-loss alerts: a failure
        # that stops clears inside one window, one that lasts a full window is presence being
        # lost faster than reconciliation is meant to repair it.
        - alert: BrokerPresenceLosingTransitions
          expr: sum(increase(devicechain_eventsources_presence_events_failed_total{namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#brokerpresencelosingtransitions"
            summary: "Broker presence transitions are not reaching the event stream"
            description: "For at least 10 minutes, event-sources has been failing to write device connects and disconnects to the platform's event stream ({{ "{{ $value }}" }} in the last 10 minutes). The broker does not resend connection notices, so each one is lost until the next reconciliation pass (every 5 minutes by default) puts the device right; until then a device can read offline while it is connected, or the other way round, and a reconnecting device's held commands are not released early. The cause is the platform's message broker refusing or not answering publishes. Check it, and the event-sources log for 'Failed to emit a broker presence transition', which names each device."
        # Both arms by durable. The gauge is per pod; `min` because any pod that could not
        # create the durable is enough. No `for`: see the header.
        - alert: MqttFailClosedDurableMissing
          expr: (min by (durable) (devicechain_eventsources_mqtt_failclosed_durable_present{namespace="{{ $ns }}"}) == 0) or (sum by (durable) (increase(devicechain_eventsources_mqtt_failclosed_durable_missing_total{namespace="{{ $ns }}"}[10m])) > 0)
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#mqttfailcloseddurablemissing"
            summary: "A platform durable on the MQTT message store is missing"
            description: "Durable {{ "{{ $labels.durable }}" }} on the MQTT gateway's message store has been missing within the last 10 minutes. While it is missing, the broker acknowledges device QoS 1 publishes of its kind without keeping them, so each one is lost although the device was told it arrived. event-sources creates it again within 30 seconds, and this alert clears 10 minutes after the last time it was found missing; while it cannot be created, the alert stays. A rolling update does not remove a durable, so it does not raise this alert. Find what deleted it (a command run against the broker's consumers, or a tool that manages them), and check the event-sources log for 'platform durable on the MQTT message store'."
        # Instance-wide: the store is one per broker account.
        - alert: MqttFailClosedStoreNotAsDeclared
          expr: (max(devicechain_eventsources_mqtt_failclosed_foreign_instances{namespace="{{ $ns }}"}) > 0) or (sum(increase(devicechain_eventsources_mqtt_failclosed_store_repaired_total{namespace="{{ $ns }}"}[10m])) > 0)
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#mqttfailclosedstorenotasdeclared"
            summary: "The MQTT message store is not as the platform declared it"
            description: "Within the last 10 minutes event-sources found the MQTT gateway's message store changed from its fail-closed configuration, or found another DeviceChain instance on the same broker. A changed setting (the discard policy, the size bound, or the store deleted outright) is put back within 30 seconds, but while it lasted a full store could discard messages it had already acknowledged, or refuse every publish. Another instance on the broker shares the store and its bound, so one instance's backlog refuses the other's devices: give each instance its own broker, or turn infrastructure.nats.mqttFailClosed off. The event-sources log names the setting it put back, or the other instances."
        # Per stream, `max` across pods: any pod that cannot bound it leaves it unbounded.
        - alert: MqttGatewayStreamUnbounded
          expr: max by (stream) (devicechain_eventsources_mqtt_gateway_stream_unbounded{namespace="{{ $ns }}"}) == 1
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#mqttgatewaystreamunbounded"
            summary: "An MQTT gateway stream has no size limit"
            description: "For at least 10 minutes the broker's MQTT gateway stream {{ "{{ $labels.stream }}" }} has had no size limit and event-sources could not set one. The broker creates these streams without a limit when the first MQTT device connects, and an unbounded one can fill the broker's storage and take the whole instance down. Check that the broker has storage free to reserve the limit and look in the event-sources log for 'Could not bound the MQTT gateway'. It clears on its own once the limit is set."
        # Inbound integrations (a LoRaWAN network server or a webhook posting under a bearer token).
        #
        # IntegrationAuthFailuresSustained counts requests refused for a bad or unknown token, plus
        # those refused because the integration's own failure budget was spent. A network server whose
        # token was rotated and never updated looks exactly like this, and so does someone spraying
        # tokens at a URL they know. Disabled integrations are NOT counted: switching one off is a
        # decision. The series are exported at 0 from start, so the first failure after a restart is
        # an increase.
        - alert: IntegrationAuthFailuresSustained
          expr: sum(increase(devicechain_eventsources_integration_requests_total{namespace="{{ $ns }}", result=~"unauthorized|bad_auth_limited"}[10m])) > 30
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#integrationauthfailuressustained"
            summary: "Requests to an integration are being refused for a bad token"
            description: "For at least 10 minutes, more than 30 requests in each 10 minutes to an inbound integration have been refused because the bearer token was wrong, the integration does not exist, or the integration's failure budget was spent. If a sender stopped delivering after you rotated an integration's token, update the token in the network server or webhook. If nothing of yours changed, someone who knows the URL is trying tokens: the integration's 'last authentication failure' time in the console shows which one, and the sprayed integration keeps serving senders that are already known."
        # A tenant over its ingest ceiling is answered 202 on these routes, because a refusal would
        # lose the message anyway and a network server may suspend the webhook for a while after one.
        # So the data is accepted on paper and discarded here, and this is the only place it is seen.
        # A short `for`: the window is already ten minutes, so a burst that stops still holds the alert
        # for that long, and a long `for` would let a short burst of discarded data pass unseen.
        - alert: IntegrationShedAccepted
          expr: (sum(increase(devicechain_eventsources_integration_requests_total{namespace="{{ $ns }}", result="shed_accepted"}[10m])) > 0) or (sum(increase(devicechain_eventsources_integration_uplinks_total{namespace="{{ $ns }}", result="shed"}[10m])) > 0)
          for: 1m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#integrationshedaccepted"
            summary: "Integration uplinks are being accepted and discarded at a tenant's ingest ceiling"
            description: "In the last 10 minutes, uplinks from inbound integrations were discarded because a tenant is over its ingest ceiling. They were answered 202 so the network server would not suspend its webhook, which means the sender believes they arrived and they did not. Raise the tenant's ingest ceiling, or reduce what the integration sends."
        # An uplink the network server forwarded without decoding is accepted and stores nothing: the
        # commonest way for an integration to look connected and be empty. More than half of at least
        # 20 uplinks in half an hour means a codec is missing on the sender's side.
        - alert: IntegrationUndecodedHigh
          expr: (sum(increase(devicechain_eventsources_integration_uplinks_total{namespace="{{ $ns }}", result="undecoded"}[30m])) > 20) and (sum(increase(devicechain_eventsources_integration_uplinks_total{namespace="{{ $ns }}", result="undecoded"}[30m])) / sum(increase(devicechain_eventsources_integration_uplinks_total{namespace="{{ $ns }}"}[30m])) > 0.5)
          for: 30m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#integrationundecodedhigh"
            summary: "Most integration uplinks carry nothing to store"
            description: "For at least 30 minutes, more than half of the uplinks arriving over inbound integrations have had no decoded values to store. The network server forwards the raw frame but the device profile there has no payload codec configured (or the codec returns nothing), or a generic sender posts only text. Configure the codec in the network server; the integration's 'last undecoded' sample in the console shows a frame it could not read."
        # The lag-credited gate (ingestMetering: lagCredit); see the header. Joined by reader
        # stream: a fresh-route ceiling shed, and fresh admissions on that stream judged against
        # more than one second of credit (the histogram's count above its le="1" bucket).
        - alert: IngestShedBeyondLagCredit
          expr: (sum by (stream) (increase(devicechain_eventsources_ingest_shed_cause_total{namespace="{{ $ns }}", route="fresh", cause="ceiling"}[10m])) > 0) and on (stream) (sum by (stream) (increase(devicechain_eventsources_ingest_lag_credit_seconds_count{namespace="{{ $ns }}"}[10m])) > sum by (stream) (increase(devicechain_eventsources_ingest_lag_credit_seconds_bucket{namespace="{{ $ns }}", le="1"}[10m])))
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#ingestshedbeyondlagcredit"
            summary: "Messages were shed at the ingest ceiling while the platform's readers were behind"
            description: "In the last 10 minutes, {{ "{{ $value }}" }} messages read from stream {{ "{{ $labels.stream }}" }} were shed at their tenant's ingest ceiling by the lag-credited gate (eventSources.ingestMetering: lagCredit), at a time when the platform's readers of that stream were more than a second behind. The gate grows a tenant's allowance by what its rate earns over the measured delay, up to the time its burst covers and never more than 5 seconds, so a shed here is either a platform stall longer than that or a tenant above its ceiling during a stall. Check the platform's message broker and event-sources for a stall at the same time (devicechain_eventsources_reader_lag_seconds shows how far behind each stream was), and raise event-sources to debug logging to name the tenant. If the tenant was within its ceiling, report it: it is the case this metering mode exists to prevent. MQTT messages shed this way were already acknowledged to their devices; MqttIngestShedAfterAcknowledgement fires for them as well."
        - alert: IngestAppendSkewLarge
          expr: sum by (stream) (increase(devicechain_eventsources_append_skew_clamped_total{namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#ingestappendskewlarge"
            summary: "The message broker's clock is more than 2 seconds from event-sources'"
            description: "For at least 10 minutes, the lag-credited ingest gate (eventSources.ingestMetering: lagCredit) has measured the message broker's append stamps on stream {{ "{{ $labels.stream }}" }} as more than 2 seconds away from the clock of an event-sources pod. The gate corrects a message's age for that offset only up to 2 seconds, so beyond it a tenant is credited too little after a stall (the broker's clock ahead) or too much (behind). devicechain_eventsources_append_skew_seconds shows the offset each pod measured, positive when the broker's clock is behind. Check time synchronisation (NTP) on the nodes running the message broker and event-sources; the alert clears once the clocks agree again."
{{- end }}
