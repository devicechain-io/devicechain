#
# cert-manager's Issuer and Certificate, the cert-manager kinds the devicechain chart renders
# (the self-signed CA chain is an Issuer, a Certificate and an Issuer), as
# the smallest CRDs a real API server will serve. It exists only so Helm can install
# the WHOLE release in TestEveryRenderedProfileIsAcceptedByAnAPIServer. Nothing here
# validates its fields; the group, version, kind, plural and scope are the project's
# own (cert-manager.io/v1, namespaced).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: issuers.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Issuer
    listKind: IssuerList
    plural: issuers
    singular: issuer
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
