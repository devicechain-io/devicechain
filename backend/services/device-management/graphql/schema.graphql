    """Creation instant, as an RFC 3339 timestamp."""
    createdAt: String
    """Last write instant, as an RFC 3339 timestamp."""
    updatedAt: String
    """Deletion instant, as an RFC 3339 timestamp; null for live records."""
    deletedAt: String
    """Required explanation for holding pages."""
    reason: String!
    """Whole target list; windows are visible only when every target is visible."""
    targets: [AlarmSuppressionTarget!]!
    """Alarm keys to suppress; an empty list matches every key."""
    alarmKeys: [String!]!
    """Alarms at or above this severity bypass the window; null disables bypass."""
    bypassSeverity: String
    """Single interval or recurring weekly schedule."""
    kind: AlarmSuppressionKind!
    """Inclusive ONE_SHOT start, as an RFC 3339 timestamp."""
    startTime: String
    """Exclusive ONE_SHOT end, as an RFC 3339 timestamp."""
    endTime: String
    """IANA time zone for RECURRING openings."""
    timezone: String
    """Weekly slots as a JSON array of day, start and durationMinutes."""
    slots: String
    """Optional inclusive recurrence bound, as an RFC 3339 timestamp."""
    validFrom: String
    """Optional exclusive recurrence bound, as an RFC 3339 timestamp."""
