{{/*
Alerting rules for password sign-in.

WHY THIS GROUP EXISTS. Failed password sign-ins are slowed down per email address, and
the counts live in a size-bounded NATS KV bucket. Every address that is tried takes an
entry, real account or not, so anyone who sprays enough distinct addresses can fill it.
When it is full the checker FAILS OPEN: sign-in keeps working, but no address that is not
already inside a running delay is slowed down -- not only new ones, since a replicated
bucket refuses updates of existing records too -- and a running delay protects its address
only until it ends. That is the smaller of the two failures -- failing closed would let
the same spray stop every password sign-in on the instance -- but it switches off a
security control without a single request failing, so nothing else would notice. This
alert is how an operator finds out.

Devices connecting to the MQTT gateway with a password are slowed down the same way, per
MQTT username, with the counts in a SEPARATE bucket in device-management, and the second
alert watches that one. Separate because each bucket fails open for everything in it: a
spray of MQTT usernames must not switch off the backoff on people's passwords, nor the
reverse.

SINGLE SIGN-ON (the Sso* rules at the end of the group) has three failures worth waking
someone for, each over the counters user-management exports once an issuer URL is set
(devicechain_usermanagement_sso_logins_total{connection,outcome} and
devicechain_usermanagement_sso_idp_fetch_failures_total{connection}): the identity provider
cannot be reached, so nobody can sign in through it; a refusal that is a SECURITY event, where
a provider vouched for someone it should not have been able to; and the state bucket full, where
sign-in through every connection fails closed. They are on a per-connection or per-outcome
breakdown deliberately, because the connection label is bounded by what a superuser created.

TWO-FACTOR SIGN-IN (the Mfa* rules at the very end) watches the counters user-management exports
for an account's second factor (devicechain_usermanagement_mfa_identity_locks_total and
devicechain_usermanagement_mfa_verifications_total{method,result}). A guess at the second factor
is only ever made by someone who ALREADY holds the account's password, so a lock is not noise:
MfaIdentityLocked is REQUIRED, fires on any single occurrence, and its remedy is to reset the
password -- not the factor. Resetting the factor while the password is compromised would hand the
account to whoever is using it.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sign-in
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.sign-in
      rules:
        - alert: CredentialAttemptStoreFull
          # 🔑 increase() CAN SEE THE FIRST FAIL-OPEN only because the checker exports the
          # store_full series at 0 from startup. A series born at 1 has no earlier sample
          # to difference against, and the first increment would be invisible.
          #
          # No `for`: a single attempt checked without its backoff is the event, and the
          # 10m window holds the alert for ten minutes after the last one, which is also
          # how long the entries that filled the bucket take to expire.
          #
          # The parentheses around `or vector(0)` bind the comparison to the whole
          # expression. Without them `>` binds to `vector(0)` alone and the alert fires on
          # every sample, which hack/check-prometheus-rules.sh refuses. The clause itself
          # changes nothing an alert can do -- an empty result and a false one both leave
          # it inactive -- which is why the dead-letter rules no longer carry it.
          expr: (sum(increase(devicechain_usermanagement_credential_checks_total{namespace="{{ $ns }}", outcome="store_full"}[10m])) or vector(0)) > 0
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Password sign-ins are being checked without their per-account backoff"
            description: "The credential-attempt store is full, so user-management is checking password sign-ins WITHOUT slowing down repeated failures on any address that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 5 minutes. Sign-in itself still works -- refusing it would let whoever filled the store lock every user out -- but guessing is now limited only by the per-request field cap and the cost of each password check. The store fills when sign-ins are sent for a very large number of distinct email addresses inside ten minutes, which almost always means someone is spraying addresses. Find where the sign-in traffic comes from (the ingress logs, and user-management's rate-limited 'credential attempt store is full' warning) and block it upstream. The store drains on its own as entries expire, ten minutes after the flood stops. If the sign-in traffic is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."

        - alert: DeviceCredentialAttemptStoreFull
          # The DEVICE twin of the alert above, over device-management's own counter and
          # its own bucket: MQTT password connects are slowed per username, and those
          # counts live in a bucket of their own so that filling one store cannot switch
          # off the other's backoff. Same expression shape, and the same reason increase()
          # sees the first fail-open: device-management exports store_full at 0 from
          # startup.
          #
          # WARNING, not critical, and on purpose. Unlike the people's store, this one
          # also fills on LEGITIMATE traffic: every connect leaves an entry for ten
          # minutes, successful ones included, so a large enough reconnect wave (a broker
          # restart bringing a whole fleet back at once) fills it with nobody attacking.
          # And a full store only returns device connects to what they were before they
          # were slowed down at all.
          expr: (sum(increase(devicechain_devicemanagement_credential_checks_total{namespace="{{ $ns }}", outcome="store_full"}[10m])) or vector(0)) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "MQTT password connects are being checked without their per-username backoff"
            description: "The device credential-attempt store is full, so device-management is checking MQTT password connects WITHOUT slowing down repeated failures on any username that is not already waiting out a delay -- and one that is waiting is protected only until that delay ends, at most 30 seconds. Connects still work -- refusing them would let whoever filled the store keep every password device off the platform -- but guessing a device's password is now limited only by how fast the broker accepts connects. Every connect, successful or not, holds an entry for ten minutes, so the store fills either when connects are sent for a very large number of distinct usernames (someone spraying usernames: find where the MQTT connects come from and block it upstream) or when a very large fleet reconnects all at once, for example after a broker restart. It drains on its own as entries expire, ten minutes after the wave stops. If the connect volume is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."
        - alert: SsoIdpUnreachable
          # Sustained, not a blip: a provider that fails to answer for ten minutes running
          # (the token endpoint, or the key set a sign-in verifies against) is a connection
          # nobody can sign in through. The 5m window with a 10m `for` ignores a single
          # slow request and a provider restart.
          expr: sum by (connection) (increase(devicechain_usermanagement_sso_idp_fetch_failures_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "An identity provider cannot be reached for single sign-on"
            description: "user-management has been failing to reach the identity provider of connection {{ "{{ $labels.connection }}" }} (its token endpoint or its signing keys) for ten minutes, so people who sign in through it are being refused. Password sign-in is unaffected. The connection's endpoints are the ones recorded and approved in its discovery snapshot, and every request goes through the egress guard: check that the provider is up, that its address resolves from the cluster, and that the egress allow list (instance.config.infrastructure.egress) permits an on-premises provider's range. If the provider moved an endpoint, run refreshIdpDiscovery and approve the new snapshot."

        - alert: SsoUnverifiedIdentityRefused
          # A security event, so no `for`: one is enough. These outcomes mean a provider
          # vouched for a sign-in this platform then refused on its own checks -- an email
          # the provider did not verify, an address outside the connection's domains, a
          # token missing the claim that pins the provider to this customer, or a tenant
          # connection asserting an identity that holds a system role.
          expr: sum by (connection, outcome) (increase(devicechain_usermanagement_sso_logins_total{namespace="{{ $ns }}", outcome=~"refused_unverified_email|refused_unverified_domain|refused_required_claim|refused_system_role_identity"}[10m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Single sign-on refused a sign-in that an identity provider vouched for"
            description: "Connection {{ "{{ $labels.connection }}" }} had a sign-in refused with outcome {{ "{{ $labels.outcome }}" }}. Nobody was signed in. Each of these outcomes is the platform's own check overriding the provider: refused_unverified_email (the provider did not vouch for the address), refused_unverified_domain (the address is not in a domain asserted for this connection), refused_required_claim (the token lacks a claim the connection requires, for example the Workspace domain or the Microsoft tenant id), or refused_system_role_identity (a tenant's provider asserted an identity that holds a system role). They are usually a misconfigured connection or someone probing one, and occasionally an attempt to sign in as another person. Look at the audit journal for the asserted address, and at the provider's own sign-in log."

        - alert: SsoStateStoreFull
          # The state bucket holds one record per begun sign-in and is written by an
          # UNAUTHENTICATED call. When it is full beginSso fails closed for every connection
          # until entries expire (ten minutes), which is the outcome counted here. Password
          # sign-in does not use the bucket and is unaffected.
          expr: sum(increase(devicechain_usermanagement_sso_logins_total{namespace="{{ $ns }}", outcome="state_store_full"}[10m])) > 0
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Single sign-on is refusing every sign-in because its state store is full"
            description: "The single sign-on state store is full, so user-management is refusing to begin any sign-in through any identity provider (it fails closed rather than drop the protection that makes a replayed callback useless). Password sign-in still works. The store fills when an enormous number of sign-ins are begun inside ten minutes, which almost always means someone is calling beginSso in a loop: the call is public and is limited per source address and globally, but a distributed sender can still fill it. Find the traffic in the ingress logs and block it upstream; the store drains on its own ten minutes after the flood stops. If the volume is legitimate, raise instance.config.infrastructure.nats.kvStateMaxBytes, which sizes every state bucket."

        - alert: MfaIdentityLocked
          # REQUIRED, and no `for`: one occurrence is the signal. The identity-wide lock arms only
          # after twenty wrong authenticator codes, and every one of those was made by someone who
          # had already passed the PASSWORD step (a code is never evaluated for a challenge that
          # was not earned), so a lock is evidence that an account's password is in use by someone
          # who fails its second factor. increase() sees the first lock only because the counter is
          # exported at 0 from startup.
          expr: sum(increase(devicechain_usermanagement_mfa_identity_locks_total{namespace="{{ $ns }}"}[5m])) > 0
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "An account's password is in use by someone failing its second factor"
            description: "A second-factor lock armed on an account: twenty wrong authenticator codes were evaluated, each after a CORRECT password. Someone has this account's password and is guessing its code. The authenticator stays locked for at most fifteen minutes at a time (the person can still sign in with a recovery code), and a password holder can renew the lock. Find the account in the audit journal (operation mfa_locked, preceded by mfa_failed rows and mfa_challenged rows) and RESET ITS PASSWORD with setPassword: that rotates the account's session epoch, which also voids every outstanding sign-in challenge. Do not reset the second factor first -- while the password is known to someone else that would give them the account (the reset refuses without a new password for this reason). The source addresses are in the ingress logs."

        - alert: MfaVerificationFailuresSustained
          # The instance-wide shape of the same thing at lower volume: wrong, replayed or
          # locked-out codes arriving steadily for a quarter of an hour. Ordinary typing mistakes
          # are a handful an hour; this needs a sustained rate.
          expr: sum(rate(devicechain_usermanagement_mfa_verifications_total{namespace="{{ $ns }}", result=~"invalid|replay|locked"}[10m])) > 0.1
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Second-factor codes are being refused at a sustained rate"
            description: "user-management has refused more than one second-factor code every ten seconds, on average, for fifteen minutes (wrong, replayed, or refused by a lock). Each attempt follows a correct password, so this is people typing their codes wrong in large numbers (a clock-skew problem on the nodes, or an authenticator app out of sync) or someone using passwords they obtained. Check that the nodes' clocks are synchronised (authenticator codes are accepted one 30-second step either side), then look at the audit journal for mfa_failed rows grouped by account and at the ingress logs for the source addresses. An account that has locked raises MfaIdentityLocked on its own."
{{- end }}
