#
# promtool UNIT TESTS for the tenant-purge alerting rules.
#
# WHAT THESE ARE FOR, over and above the parse check
#
# TenantPurgeStalled is a threshold over a gauge that RISES ON ITS OWN. Age climbs one
# second per second for as long as a deletion is open, so the alert is not "did something
# go wrong" but "has this been open longer than it can legitimately take". That makes the
# quiet cases the ones worth writing down: a healthy deletion spends hours above zero and
# must not page, and it is the only alert in this repository whose subject is normal for
# most of its life.
#
# 🔴 THE QUIET CASES ARE THE HALF THAT CAN ROT. "It fires on a stuck purge" survives
# almost any edit to the threshold — halve it and every firing case below still passes.
# What goes red is "a deletion inside its token hold must stay quiet", which is the case
# that separates this alert from one that pages on every tenant anyone ever deletes.
#
# THE SERIES, and what is known about each:
#
#   - devicechain_usermanagement_tenant_purge_oldest_age_seconds — an unlabelled Gauge,
#     registered at process start, so it EXISTS and reads 0 on an instance with no open
#     deletions rather than being absent. That is why the quiet scenarios below carry it
#     AT ZERO instead of omitting it: an alert that is silent because its series is
#     missing and one that is silent because the platform is healthy look identical, and
#     only one of them is a working alert.
#   - devicechain_usermanagement_tenant_purge_in_flight — same shape, same reason. It is
#     what TenantPurgeVisibilityLost watches, precisely because a gauge that always
#     exists is one whose ABSENCE means something.
#
# 🔑 THE THRESHOLD IS 86400 BECAUSE THE CHART DERIVES IT as twice the configured token
# hold, whose default is 43200 (the NATS credential lifetime). These tests run against
# the RENDERED rule, so if that derivation changes they go red rather than drifting — the
# numbers below are the rendered ones, not a second copy of the policy.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml. Naming it below is not
# optional and its absence is not an error: promtool with no rule_files loads no rules,
# every alert_rule_test then expects an alert and gets none, and the failure reads as
# "the rule does not fire" rather than "there is no rule".
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # A deletion that is stuck: open well past twice its token hold.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Starts at 30h and climbs, which is what a stuck deletion looks like.
      - series: 'devicechain_usermanagement_tenant_purge_oldest_age_seconds{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '108000+60x60'
      - series: 'devicechain_usermanagement_tenant_purge_in_flight{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '1x60'
    alert_rule_test:
      # Over the threshold from the first sample, but `for: 15m` has not elapsed.
      - eval_time: 10m
        alertname: TenantPurgeStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantPurgeStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "A tenant deletion has been open for more than twice its token hold"
              description: "The oldest open tenant deletion is older than 86400s, which is twice the configured token hold (43200s) and therefore well past the point where every mandatory wait has elapsed. The purge is not progressing: some store is not reporting clean, or is reporting clean and then dirty again. The tenant's data has NOT been erased and its token is still reserved. The coordinator's own pass metrics will look healthy throughout, because a tenant it cannot finish is still a tenant it visited without error -- this alert is the only signal that the deletion is stuck. The admin API's tenantDeletions query names the tenant and the store still outstanding."
      # The gauges are being scraped throughout, so the visibility alert stays quiet.
      - eval_time: 20m
        alertname: TenantPurgeVisibilityLost
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE CASE THAT MAKES THE ALERT USABLE: a deletion that is progressing
  # normally is ABOVE ZERO for its whole life and must never page.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Six hours in, climbing: inside the 12h token hold, so it cannot have completed
      # yet and nothing is wrong.
      - series: 'devicechain_usermanagement_tenant_purge_oldest_age_seconds{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '21600+60x60'
      - series: 'devicechain_usermanagement_tenant_purge_in_flight{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: TenantPurgeStalled
        exp_alerts: []
      - eval_time: 60m
        alertname: TenantPurgeVisibilityLost
        exp_alerts: []

  # ------------------------------------------------------------------
  # Nothing purging: both gauges present and zero. The healthy steady state.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_oldest_age_seconds{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '0x60'
      - series: 'devicechain_usermanagement_tenant_purge_in_flight{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: TenantPurgeStalled
        exp_alerts: []
      - eval_time: 60m
        alertname: TenantPurgeVisibilityLost
        exp_alerts: []

  # ------------------------------------------------------------------
  # The counterweight to the whole group: user-management stops being scraped.
  # TenantPurgeStalled goes quiet because its series is gone, which is exactly
  # the silence that must not read as health.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantPurgeVisibilityLost
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantPurgeVisibilityLost
        exp_alerts:
          # 🔑 namespace IS ON THIS ALERT AND NOT ON THE OTHER ONE. absent() returns a
          # vector carrying the label matchers from its argument, so the selector's
          # namespace survives into the alert; TenantPurgeStalled goes through max(),
          # which drops every label it was not told to keep. Two rules over the same
          # series, two different label sets, and promtool is the only thing that says so.
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              namespace: dci-devicechain
            exp_annotations:
              summary: "Nothing is reporting whether tenant deletions are progressing"
              description: "The tenant-purge gauges have not been scraped for 15m, so TenantPurgeStalled above cannot fire and an open deletion would be invisible rather than green. This is the absent() counterweight: the in-flight gauge is unlabelled and registered at process start, so it reads 0 on a healthy instance rather than going missing -- its absence means user-management is not being scraped at all, not that no deletion is open."
      - eval_time: 20m
        alertname: TenantPurgeStalled
        exp_alerts: []

  # ------------------------------------------------------------------
  # Per-store blocked gauge. Every store x reason series is exported at zero, so the
  # quiet cases carry ALL of them: a quiet alert over a missing series is not a
  # working alert.
  # ------------------------------------------------------------------

  # kv returns an error for two hours: TenantPurgeStoreFailing names it after its hour;
  # the deferred alert stays quiet because kv is not deferring.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="kv", reason="error"}'
        values: '1x120'
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="kv", reason="deferred"}'
        values: '0x120'
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="broker", reason="error"}'
        values: '0x120'
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="broker", reason="deferred"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 50m
        alertname: TenantPurgeStoreFailing
        exp_alerts: []
      - eval_time: 70m
        alertname: TenantPurgeStoreFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              store: kv
            exp_annotations:
              summary: "A storage system cannot be asked to erase a deleted tenant's data"
              description: "For an hour, the kv store has returned an error to the erase request for at least one open tenant deletion, so the coordinator cannot tell whether that tenant's data there is gone. Stores are rdb (relational data), tsdb (telemetry), broker (streams), kv (key-value buckets), detect (rule state) and blob (object storage); other is a store this alert's vocabulary does not name. The error is in user-management's log (\"Tenant purge store did not report clean\") and in the admin API's tenantDeletions query. The deletion cannot complete until the store answers."
      - eval_time: 70m
        alertname: TenantPurgeStoreHolding
        exp_alerts: []

  # broker defers for 11h: a store working through its data normally defers for hours,
  # and this must not page before the 12h token hold has elapsed.
  - interval: 5m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="broker", reason="deferred"}'
        values: '1x132'
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="broker", reason="error"}'
        values: '0x132'
    alert_rule_test:
      - eval_time: 11h
        alertname: TenantPurgeStoreHolding
        exp_alerts: []
      - eval_time: 11h
        alertname: TenantPurgeStoreFailing
        exp_alerts: []

  # broker still deferring after the full 12h hold: fires, naming the store.
  - interval: 5m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="broker", reason="deferred"}'
        values: '1x200'
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="broker", reason="error"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 13h
        alertname: TenantPurgeStoreHolding
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              store: broker
            exp_annotations:
              summary: "A storage system has reported a deleted tenant's data still present for longer than the token hold"
              description: "The broker store has answered the erase request for at least one open tenant deletion with data still present or still arriving, continuously for the length of the token hold (43200s). A store normally goes clean within a few passes; one that does not is either retaining data on purpose (a stream with a retention the purge cannot cut, a bucket that refuses deletes) or being refilled by something still writing for the deleted tenant. The admin API's tenantDeletions query names the tenant and the store's stated reason. TenantPurgeStalled fires later, at twice the hold, without naming the store."

  # A store that blocks briefly and recovers (error for 20m, then clean) never pages.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="tsdb", reason="error"}'
        values: '1x20 0x100'
      - series: 'devicechain_usermanagement_tenant_purge_store_blocked{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", store="tsdb", reason="deferred"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: TenantPurgeStoreFailing
        exp_alerts: []
      - eval_time: 100m
        alertname: TenantPurgeStoreHolding
        exp_alerts: []

  # ------------------------------------------------------------------
  # Coordinator failures: a counter that moves for an hour pages; a flat one is quiet.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_failures_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantPurgeCoordinatorFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: TenantPurgeCoordinatorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "The tenant-deletion coordinator keeps failing to carry a deletion through a pass"
              description: "The coordinator has failed to take at least one tenant deletion through a pass (re-reading the tenant, writing the ledger, lifting a fence or completing it) and the rate has stayed above zero for 30 minutes. This is a fault in the coordinator's own work, not a store holding data: a store's refusal is reported by TenantPurgeStoreFailing and TenantPurgeStoreHolding. User-management's log names the tenant and the step."

  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_tenant_purge_failures_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management"}'
        values: '4x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: TenantPurgeCoordinatorFailing
        exp_alerts: []
