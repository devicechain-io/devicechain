# Dependabot configuration for DeviceChain.
#
# Goal: security + freshness signal without a flood of one-PR-per-dependency.
# Strategy:
#   - Weekly schedule (batched, predictable) rather than daily.
#   - Minor + patch bumps are GROUPED into a single PR per ecosystem.
#   - Major bumps are left UNGROUPED so each lands as its own reviewable PR
#     (Go major bumps here have bitten us before, e.g. pgx / tablewriter).
#
# The Go workspace (go.work) has one go.mod per module; the `directories`
# glob below fans Dependabot across all of them in one ecosystem entry.
#
# 🔴 THIS LIST MUST COVER EVERY WORKSPACE MODULE, and the reason is not tidiness.
# Every module outside core carries `replace github.com/devicechain-io/dc-microservice
# => ../../core`, and CI validates each module with GOWORK=off — so a module resolves
# against the LOCAL core on disk, not a published version. The moment Dependabot moves
# core's requirements without moving a module that replaces it, that module's own
# go.mod/go.sum are stale relative to the core it points at and it fails with
# `go: updates to go.mod needed`. It is not the bumped module that breaks; it is the
# one Dependabot could not see.
#
# That is exactly what happened: this list omitted /backend/edge/*, /backend/sims/*
# and /backend/tools/*, so every weekly gomod PR broke the same four modules
# (dc-edge-agent, dc-simulator, drdrill, migrationdiff) — and, worse, those four
# received no dependency or security updates at all. Keep it in step with go.work.
version: 2

updates:
  # ---- Go modules (all workspace members) --------------------------------
  - package-ecosystem: "gomod"
    directories:
      - "/backend/core"
      - "/backend/cli"
      - "/backend/k8s"
      - "/backend/services/*"
      # The three trees below are NOT optional — see the note above. They are
      # workspace modules with a local replace onto core, so leaving them out
      # does not merely skip them, it breaks them on every core bump.
      - "/backend/edge/*"
      - "/backend/sims/*"
      - "/backend/tools/*"
      - "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # ---- npm trees (one entry per lockfile) --------------------------------
  # /frontend is the app workspace — a single lockfile at frontend/ covers all of
  # apps/* and packages/*. /docs is the Docusaurus site, with its own lockfile.
  #
  # 🔴 EVERY LOCKFILE IN THE REPO MUST BE LISTED HERE, and for a reason that is easy
  # to miss: security updates and version updates are different subsystems. Security
  # updates are driven by the dependency graph and need no entry at all, so a tree
  # left out of this list still raises alerts and still gets its transitive CVEs
  # fixed — it just never gets a freshness bump, and nothing says so. /docs sat
  # exactly there: five security PRs arrived while Docusaurus itself quietly aged,
  # and the queue looked alive the whole time.
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # ---- Container base images --------------------------------------------
  #
  # 🔴 SAME COVERAGE TRAP AS THE TWO ECOSYSTEMS ABOVE, and it already bit here:
  # this list held only /backend/k8s and /frontend while the repo has FOUR
  # Dockerfiles. Measured rather than assumed — every docker PR Dependabot has
  # ever opened says "across 2 directories", and the other two have never
  # received a single bump. The two below are the shipped images, and both are
  # now digest-pinned, which makes the coverage load-bearing rather than merely
  # nice: an unwatched digest pin is a base image frozen at whatever was current
  # the day it was written, which is worse than the floating tag it replaced.
  #
  # The other two Dockerfiles are deliberately absent, not overlooked:
  #   - backend/services/lwm2m-ingest/interop/leshan-client — an interop test
  #     harness that ships nowhere, deliberately on Temurin 11 because Leshan
  #     2.0.0-M15 is Java-8 bytecode. Bumps there would be churn against a pin
  #     that exists on purpose.
  #   - deploy/images/timescaledb — reaches its base through
  #     `ARG PG_IMAGE=... ` + `FROM ${PG_IMAGE}`, and whether Dependabot follows
  #     that indirection is UNVERIFIED. Adding it blind would be a config that
  #     cannot fail: it would look like coverage and might update nothing.
  #     Worth an experiment, but it must be confirmed against a real weekly run
  #     before anyone counts it as covered. Note also that digest-pinning THAT
  #     file is blocked on a separate defect — operand-image.yml derives the PG
  #     minor with `${PG_IMAGE##*:}`, which returns the digest hex once a
  #     `@sha256:` suffix is present.
  - package-ecosystem: "docker"
    directories:
      - "/backend/k8s"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # ---- GitHub Actions ----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
