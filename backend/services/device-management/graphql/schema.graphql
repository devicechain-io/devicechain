    token: String!
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    # References the DeviceProfile this type adopts (ADR-045). Optional; empty or
    # omitted leaves the type with no profile. An unknown token is rejected.
    profileToken: String
    manufacturer: String
    model: String
    metadata: String
}

# A PARTIAL update to a device type. Every field is optional in three senses, not
# two: omit it to leave the stored value untouched, send null to clear it, send a
# value to set it. Sending only `name` renames the type and changes nothing else.
#
# There is deliberately no `token` field — the type is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the
# field arrive already-populated for a caller who never sent it, which collapses
# "omitted" back into "sent", and turns this input back into the full replace it
# replaces.
input DeviceTypeUpdateRequest {
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    # Re-points the DeviceProfile this type adopts (ADR-045). Omit to keep the
    # current profile; null or an empty token detaches it. An unknown token is
    # rejected and the whole update is refused.
    profileToken: String
    manufacturer: String
    model: String
    metadata: String
}

# Criteria used when searching for device types.
input DeviceTypeSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
}

# Search results returned from device type query.
type DeviceTypeSearchResults {
    results: [DeviceType!]!
    pagination: SearchResultsPagination!
}

# Data required to create a device profile (ADR-045).
input DeviceProfileCreateRequest {
    token: String!
    name: String
    description: String
    category: String
    metadata: String
    # Whether devices built on this profile report their own position, and what to
    # expect of it. Replaced wholesale on update like every other field here, so
    # leaving it out of an update clears an existing declaration.
    location: DeviceLocationDeclarationInput
}

# Criteria used when searching for device profiles.
input DeviceProfileSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
}

# Search results returned from device profile query.
type DeviceProfileSearchResults {
    results: [DeviceProfile!]!
