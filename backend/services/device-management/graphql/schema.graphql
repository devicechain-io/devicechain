"""
A kind of relationship between entities, such as assigned or contains. One table of types serves
every entity family. A tracked type marks relationships whose edges are denormalized onto events for
indexing, and only tracked relationships count as ownership for members whose access is limited to
part of the tenant.
"""
type EntityRelationshipType implements Model & TokenReference & NamedEntity & MetadataEntity {
    """
    Server-assigned numeric identifier, as a string. Address a relationship type by its token
    instead where you can.
    """
    id: ID!
    """When the relationship type was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the relationship type was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: a deleted relationship type is removed outright and is not returned."""
    deletedAt: String
    """Identifier of the relationship type, unique within the tenant. It cannot be changed after creation."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    """
    Whether relationships of this type are tracked: denormalized onto events so they can be indexed
    and filtered by, and counted as ownership for scoped access.
    """
    tracked: Boolean!
    """
    The vocabulary predicate this relationship is (for example brick:feeds), or null when it
    is bound to none.
    """
    semanticPredicate: SemanticTerm
    """The predicate's inverse (for example brick:isFedBy), or null when there is none."""
    semanticInverse: SemanticTerm
}

"""Data required to create an entity relationship type."""
input EntityRelationshipTypeCreateRequest {
    """Identifier for the new relationship type, unique within the tenant. Cannot be changed later."""
    token: String!
    """Human-readable name, up to 128 characters."""
    name: String
    """Free-text description, up to 1024 characters."""
    description: String
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
    """
    Whether relationships of this type are tracked: denormalized onto events and counted as
    ownership for scoped access. A device may carry only a bounded number of tracked relationships.
    """
    tracked: Boolean!
    """
    A PREDICATE of an enabled vocabulary pack, as a CURIE or full IRI. A term of the wrong
    kind, deprecated, or outside the enabled vocabularies fails the request with
    INVALID_ARGUMENT naming it. Stored as an expanded IRI.
    """
    semanticPredicate: String
    """
    The predicate's inverse. Omitted, it is the inverse the vocabulary declares for the
    predicate (none when it declares none), and the stored value is that resolved term. An
    inverse without a predicate is refused.
    """
    semanticInverse: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
"""
A partial update of an entity relationship type. Each field has three states: omit it to keep the
stored value, send null to clear it, or send a value to set it.
"""
input EntityRelationshipTypeUpdateRequest {
    """Human-readable name; null clears it."""
    name: String
    """Free-text description; null clears it."""
    description: String
    """New metadata (valid JSON, replacing the stored document), or null to clear it."""
    metadata: String
    """
    Whether relationships of this type are tracked. Null is refused rather than read as false, which
    would stop denormalizing the type's relationships onto events and report success.
    """
    tracked: Boolean
    """
    New predicate: null clears it, and the inverse with it. Omit to leave it alone. Validated
    as on create.
    """
    semanticPredicate: String
    """
    New inverse: null clears it. Omitted while the predicate changes, it becomes the inverse
    the vocabulary declares for the new predicate. An inverse is refused while no predicate
    is bound.
    """
    semanticInverse: String
}

