#
# Release CI for the DeviceChain monorepo.
#
# Triggered EXCLUSIVELY by a version tag (vX.Y.Z, optionally a -rc.N prerelease).
# A release is therefore a deliberate, auditable act -- `main` never publishes.
#
# On a tag this workflow:
#   - guard:  validates the tag is strict semver, computes version + prerelease,
#             and enumerates the image build matrix (hack/list-services.sh).
#   - images: ko-builds + pushes every service image and the operator image to
#             ghcr.io/devicechain-io, multi-arch (amd64 + arm64).
#   - chart:  packages the Helm chart at the tag version and pushes it as an OCI
#             artifact to ghcr.io/devicechain-io/charts.
#   - cli:    goreleaser cross-compiles dcctl and creates the GitHub Release.
#   - npm-packages / nuget:
#             publish the four @devicechain/* npm packages and the C# SDK, after
#             the correctness gates — these are the only IMMUTABLE artifacts a
#             release produces, so they go last.
#
# Auth is the built-in GITHUB_TOKEN -- no PAT. New ghcr packages come out PUBLIC:
# measured on v0.9.0-rc.1, which pushed three package names for the first time
# (lwm2m-ingest, sparkplug-ingest, dc-edge-agent) and all three answered an
# ANONYMOUS manifest GET with 200, same as long-established ones. No flip to do.
# (This comment previously claimed the opposite, which sends a maintainer hunting
# through org Packages settings for a problem that is not there.)

name: release

# Trigger on semver-shaped tags. The `*` suffix admits prerelease/build segments
# (e.g. v1.2.3-rc.1); the guard job enforces the strict format and fails fast.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only by DEFAULT; each job re-grants exactly the write it needs, below.
#
# The difference is blast radius, not paperwork. A top-level `contents: write` +
# `packages: write` is handed to EVERY job in the workflow, so a compromised
# action anywhere in the release — in `guard`, which only reads a tag, or in the
# manifest publisher — gets a token that can push images and rewrite releases.
# Declaring the grant on the job that actually publishes means a step can only
# abuse what its own job was already trusted with.
#
# Derived from what each job does, not from what looked safe:
#   guard             — reads the tag                       -> contents: read
#   images/chart/     — ko / helm / docker push to ghcr      -> packages: write
#     frontend
#   npm-packages      — npm trusted publishing (OIDC)        -> id-token: write
#   nuget             — nuget.org trusted publishing (OIDC)  -> id-token: write
#   cli               — goreleaser creates the Release       -> contents: write
#   edge-agent        — gh release upload                    -> contents: write
#   publish-manifest  — gh release VIEW; the website push
#                       uses its own PAT, not GITHUB_TOKEN   -> contents: read
permissions:
  contents: read

# Never run two releases for the same tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/devicechain-io

jobs:
  # ---------------------------------------------------------------------------
  # Validate the tag, derive the version + prerelease flag, and enumerate the
  # image build matrix (same source of truth as ci.yml's discover job).
  # ---------------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
      smoke: ${{ steps.smoke.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release highlights are the one part of the published manifest a machine cannot
      # derive: generated from commit subjects they would read as `fix(events): give payload
      # rows and anchors identities of their own`, which is a developer's sentence, not a
      # feature bullet. So a human writes them — and the failure mode of a human-written file
      # in a release pipeline is that it is FORGOTTEN, publishing the previous release's
      # highlights against this release's version. Confidently wrong is worse than absent.
      #
      # Checked HERE, in the first job, deliberately: a forgotten update costs a re-run rather
      # than a release that has already pushed 17 images before anyone notices.
      # The rule itself, and why a candidate is allowed to reuse its release's highlights,
      # lives in the script. Checked HERE, in the first job, deliberately: a forgotten
      # update costs a re-run rather than a release that has already pushed 17 images
      # before anyone notices. The script runs its own self-test in CI (`discover`).
      #
      # 🔴 Call the SCRIPT, never re-implement the comparison inline. This check used to
      # exist twice — here and in build-release-manifest.sh — and the copies drifted the
      # first time the rule changed, which cost a full release run: the rc passed this job,
      # built every image, passed the load gate, and died in publish-manifest.
      - name: Release highlights match the tag
        run: hack/check-release-highlights.sh "${GITHUB_REF_NAME}"

      - name: Validate tag is strict semver
        id: semver
        run: |
          version="${GITHUB_REF_NAME}"
          # Strict semver with an optional prerelease segment: vMAJOR.MINOR.PATCH[-pre]
          if ! echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$version' is not a valid semver release tag (expected vX.Y.Z or vX.Y.Z-rc.N)."
            exit 1
          fi
          # A '-' in the tag marks a prerelease (e.g. v1.2.3-rc.1).
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$is_prerelease)"

      - name: Build image module list
        id: smoke
        run: |
          # ko-buildable image modules = each discovered service (mapped to its
          # backend/services/<name> dir) PLUS the operator at backend/k8s PLUS the Tier-1
          # edge agent at backend/edge/dc-edge-agent. Keep this list in step with ci.yml's
          # discover job -- they are two textual copies of the same set.
          smoke="$(
            { hack/list-services.sh | jq -r '.[] | "backend/services/" + .'
              echo "backend/k8s"
              echo "backend/edge/dc-edge-agent"
            } | jq -R . | jq -s -c .
          )"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Image modules: $smoke"

  # ---------------------------------------------------------------------------
  # Build + push every service image and the operator image, multi-arch.
  # ---------------------------------------------------------------------------
  images:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      packages: write # ko push to ghcr
    strategy:
      fail-fast: false
      matrix:
        # Discovered services (backend/services/<name>) plus the operator
        # (backend/k8s) -- assembled by the guard job.
        module: ${{ fromJson(needs.guard.outputs.smoke) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Pinned for the same reasons as ci.yml's image-smoke — and it matters more here.
      # The action's default "latest-release" resolves ko by curl-ing GitHub's
      # AUTHENTICATED API and piping the body to jq, so an API blip fails the job with
      # an "Invalid numeric literal" jq error before anything builds (all 12 CI jobs,
      # 2026-07-16). On a RELEASE that would mean a tag that publishes no images for a
      # reason that has nothing to do with the code. It also means the released images
      # are built by whichever ko happened to be current that day; a release should be
      # reproducible. Keep this in step with ci.yml — bump both together, deliberately.
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      - name: Log in to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | ko login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Compute ko repo + tags
        id: ko
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ needs.guard.outputs.version }}
          IS_PRERELEASE: ${{ needs.guard.outputs.is_prerelease }}
        run: |
          # Every image publishes at an EXPLICIT repo via ko --bare (KO_DOCKER_REPO
          # used verbatim as the image name), matching the names the Helm chart
          # deploys and dcctl's local --build path produces:
          #   operator (backend/k8s)      -> ".../operator"  (NOT "k8s")
          #   service (backend/services/X) -> ".../X"         (the directory basename
          #                                   == the functional-area name the chart
          #                                   renders, e.g. device-management)
          # NOTE: do NOT use --base-import-paths here — it names the image after the
          # Go MODULE base (dc-<name>, since the modules are dc-device-management etc.),
          # which the chart does not deploy, yielding an un-deployable release.
          if [ "$MODULE" = "backend/k8s" ]; then
            echo "repo=${REGISTRY}/operator" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${REGISTRY}/$(basename "$MODULE")" >> "$GITHUB_OUTPUT"
          fi
          # :latest moves ONLY on stable releases -- never on prereleases.
          if [ "$IS_PRERELEASE" = "false" ]; then
            echo "tags=${VERSION},latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: ko build + push
        working-directory: ${{ matrix.module }}
        env:
          KO_DOCKER_REPO: ${{ steps.ko.outputs.repo }}
        run: |
          # Multi-arch image published verbatim at the repo computed above
          # (--bare names the image exactly from KO_DOCKER_REPO):
          #   service  -> ghcr.io/devicechain-io/<dir>       (e.g. device-management)
          #   operator -> ghcr.io/devicechain-io/operator
          ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags="${{ steps.ko.outputs.tags }}" \
            ./

  # ---------------------------------------------------------------------------
  # Package the Helm chart at the release version and push it as an OCI artifact.
  # ---------------------------------------------------------------------------
  chart:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      packages: write # helm push (OCI) to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin Helm for the same reproducibility reason as ko above — and, here,
      # for correctness: Helm versions after v3.18.6 regressed OCI push to ghcr
      # (helm/helm#31223), failing with `Tag on destination: <digest>: not found`
      # AFTER packaging succeeds. The unpinned action installs the latest Helm,
      # so a tag would package a chart it then cannot publish. v3.18.6 is verified
      # to push to ghcr; bump deliberately, and re-verify the OCI push when doing so.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Log in to ghcr (helm registry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package + push chart
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # The chart version/appVersion are SemVer WITHOUT the leading 'v'.
          # OCI tags follow chart version, so strip the prefix for the chart only.
          chart_version="${VERSION#v}"

          # Pin every rendered image to this release tag. `helm package` cannot
          # override values, so the chart defaults image.tag to .Chart.AppVersion
          # (templates/_helpers.tpl); setting --app-version to the release version
          # therefore makes the packaged chart deploy the matching images by
          # default, with no value override needed.
          helm package deploy/helm/devicechain \
            --version "$chart_version" \
            --app-version "$VERSION"

          # helm package writes devicechain-<chart_version>.tgz to the cwd.
          helm push "devicechain-${chart_version}.tgz" "oci://${REGISTRY}/charts"

  # ---------------------------------------------------------------------------
  # Build + push the web console image (static nginx SPA), multi-arch.
  #
  # The console is not a Go service, so it is built with docker buildx from
  # frontend/Dockerfile rather than ko. It publishes as ".../frontend", the name
  # the chart resolves by default ({image.registry}/frontend:{image.tag}).
  # ---------------------------------------------------------------------------
  frontend:
    needs: guard
    runs-on: ubuntu-latest
    # A HANG HERE USED TO COST SIX HOURS. When arm64 `npm ci` died under QEMU on
    # 2026-08-22, buildx swallowed the child's SIGILL and the step simply stopped
    # producing output -- it never failed, so the job ran on the 360-minute default
    # while looking indistinguishable from slow work. The Dockerfile fix removes that
    # emulation, but the shape is what this bounds: any future stall fails in minutes
    # and can be re-run, rather than holding a release for most of a day. Eight runs
    # before the fix took 3m10s-3m43s, and the cross-build is faster still.
    timeout-minutes: 20
    permissions:
      packages: write # docker buildx push to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          IS_PRERELEASE: ${{ needs.guard.outputs.is_prerelease }}
        run: |
          # :latest moves ONLY on stable releases -- never on prereleases
          # (mirrors the ko images job).
          tags="${REGISTRY}/frontend:${VERSION}"
          if [ "$IS_PRERELEASE" = "false" ]; then
            tags="${tags},${REGISTRY}/frontend:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Frontend tags: $tags"

      - name: Build + push console image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  # ---------------------------------------------------------------------------
  # ADR-064 correctness-under-load gate. Reuses the loadtest-gate workflow on its
  # PULL path (build=false, version=<this tag>): it bootstraps a throwaway
  # --compact kind cluster from the images `images` just pushed and drives the
  # L1-L3 oracles, each of which fails the job on any correctness violation.
  #
  # `needs` on the image-publishing jobs is load-bearing -- the pull path can only
  # bootstrap tags that already exist in ghcr, so the gate must run AFTER the push,
  # not beside it. That means BOTH `images` (the ko service/operator matrix) AND
  # `frontend` (the console image, built in parallel and cross-compiled arm64 under
  # QEMU, so it can finish well after `images`): the --compact bootstrap deploys the
  # console by default (chart `frontend.enabled: true`, which dcctl never overrides),
  # so a gate that waited only on `images` could ImagePullBackOff on `frontend:<tag>`
  # and go red for a pure orchestration race. `chart` is deliberately NOT needed --
  # dcctl bootstraps from its embedded chart, not the pushed OCI artifact.
  #
  # The gate then blocks `cli` (below), so a red gate means no GitHub Release for this
  # tag even though the raw images are already on ghcr; a human investigates rather
  # than an unvalidated build becoming an official release. Runs on every release
  # tag including -rc.N (a pre-release-tag gate, ADR-064 decision 1); it is never
  # invoked per-PR (this workflow has no push/pull_request trigger).
  #
  # The in-cluster pull is ANONYMOUS, so the tag's ghcr packages must be public. Every
  # existing area package is already public; the first release that adds a NEW service
  # module pushes it private (ghcr default, see the header) and the gate will red on
  # the pull until it is flipped public once -- that is now release-blocking, not just
  # a post-release nuisance.
  loadtest-gate:
    needs: [guard, images, frontend]
    permissions:
      contents: read
    uses: ./.github/workflows/loadtest-gate.yml
    with:
      build: false
      version: ${{ needs.guard.outputs.version }}
      skip_preflight: true

  # ---------------------------------------------------------------------------
  # The upgrade drill. Does an existing instance's DATA survive this release?
  #
  # Nothing else in this pipeline asks that question. `migration-diff` compares
  # `pg_dump --schema-only`, so it captures no ROWS -- a migration that creates
  # every table perfectly and then rewrites the data inside them passes it with
  # every area green. The load gate above seeds its own world on a FRESH install.
  # A fresh bootstrap is the INSTALL path, which structurally cannot see an upgrade
  # defect at all. So this job installs the PREVIOUS release, writes one of every
  # entity through its real API, upgrades the way the documentation tells an
  # operator to, and reads every row back.
  #
  # Same `needs` as loadtest-gate and for the same reason -- it bootstraps the
  # baseline from ghcr and then upgrades to THIS tag's published images, so both
  # the ko matrix and the (slower, cross-compiled) console image must already be
  # pushed. It runs BESIDE loadtest-gate on its own runner rather than after it:
  # the two share no state, and serialising them would add this drill's whole wall
  # clock to every release for nothing.
  #
  # `build: false` is the load-bearing input. The rig's default builds the working
  # tree, which is right for a developer and wrong here: a source build of this
  # commit is not the same bytes as the release, was not produced by this pipeline,
  # and has never been pushed anywhere. The release path upgrades to the artifact
  # an operator actually installs. `baseline` is left empty on purpose -- the gate
  # derives the highest stable tag below this one, so a release never drills a hop
  # its own notes do not claim.
  #
  # This gate was landed RED on purpose: its operator step asserts that the
  # controller is running the version the services were upgraded to, which the
  # documented procedure could not achieve -- the operator is not in the chart and
  # nothing moved it afterwards. That is closed. `dcctl upgrade` exists, the drill
  # runs it as the second half of the documented procedure, and the step now
  # measures a fix rather than recording a gap.
  #
  # It still blocks `cli` (below), so a red drill means no GitHub Release for this
  # tag even though the images are already on ghcr; a human investigates rather
  # than an unvalidated upgrade claim becoming an official release.
  upgrade-gate:
    needs: [guard, images, frontend]
    permissions:
      contents: read
    uses: ./.github/workflows/upgrade-gate.yml
    with:
      build: false
      version: ${{ needs.guard.outputs.version }}

  # ---------------------------------------------------------------------------
  # Publish the four @devicechain/* packages to npmjs.com.
  #
  # 🔴 AUTH IS OIDC — there is no NPM_TOKEN in this repo and there must not be one.
  # npm's 2FA-bypass granular access tokens lost account/org/package management on
  # 2026-07-31 and lose DIRECT PUBLISHING around January 2027, reduced to reading
  # private packages and staging for human approval. Trusted publishing is therefore
  # not the nicer option, it is the only durable automated one. The CLI mints its own
  # short-lived credential from the `id-token: write` grant below; provenance comes
  # with it automatically, so `--provenance` is NOT passed (npm's docs are explicit
  # that the flag is unnecessary on GitHub Actions).
  #
  # 🔴 WHAT MAKES THIS JOB TRUSTED IS A SETTING ON npmjs.com, PER PACKAGE, and it names
  # THIS FILE. Each of the four packages has a trusted publisher configured with the
  # repository and the workflow FILENAME (`release.yml`, filename only, no path) and no
  # environment. Renaming this workflow, or moving these steps into a reusable workflow
  # that runs under a different filename, silently revokes publishing rights for all
  # four — and the symptom is a 404/403 from `npm publish`, not anything that mentions
  # the rename.
  #
  # 🔴 THE FIRST VERSION OF EACH PACKAGE CANNOT COME FROM HERE. A trusted publisher can
  # only be configured on a package that already EXISTS, and npm cannot stage a
  # brand-new package either. So version one of each is a manual, interactive, 2FA'd
  # `npm publish` from a maintainer's machine; this job takes over from version two.
  # scripts/publish-packages.mjs detects the not-yet-bootstrapped case and says so,
  # rather than leaving a bare registry error to be decoded.
  #
  # Gated on BOTH correctness gates, like `cli`, and for a stronger reason than `cli`
  # has: a GitHub Release can be deleted and recut, and an image tag can be moved, but
  # an npm version is IMMUTABLE. Unpublishing is possible for 72 hours and burns the
  # number permanently. So this runs after everything in the release that can still
  # say "no".
  npm-packages:
    needs: [guard, loadtest-gate, upgrade-gate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — see above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches ci.yml's frontend job and the frontend Dockerfile build stage.
          # Node 26 bundles an npm far above the 11.5.1 floor trusted publishing needs;
          # the publisher script asserts that floor rather than trusting this line.
          node-version: 26
          # npm's own guidance for release builds: never publish from a cache. The
          # dependency tree a release is built against should come from the lockfile,
          # not from whatever a previous run happened to leave behind.
          package-manager-cache: false
          #
          # 🔴 `registry-url:` IS DELIBERATELY ABSENT, AND npm's OWN DOCUMENTED EXAMPLE
          # INCLUDES IT. Setting it makes this action write
          #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # into an .npmrc. With no NODE_AUTH_TOKEN — which is the whole point of
          # trusted publishing — that expands to empty, and the npm CLI reads the line
          # as "auth is already configured", never attempts the OIDC exchange, and fails
          # with ENEEDAUTH or a bare E404 that says nothing about the cause.
          # (actions/setup-node#1551, npm/documentation#1960.) The default registry is
          # registry.npmjs.org already, so the input buys nothing here.
          #
          # Not left to a comment: scripts/publish-packages.mjs asserts, before it
          # publishes anything, that the resolved npm config carries no _authToken and
          # that the OIDC request URL is actually present.

      - name: Install dependencies
        run: npm ci

      # Built BEFORE the version stamp, deliberately. The build reads `exports` and
      # writes `dist`; it does not care what the version says, and doing it first keeps
      # the window between "manifests rewritten" and "packages published" as short as
      # possible — see the 🔴 on the stamp step.
      - name: Build the publishable packages
        run: npm run build:packages

      # 🔴 NOTHING MAY RUN `npm ci` OR `npm install` AFTER THIS STEP. The stamp rewrites
      # every package.json to the tag; package-lock.json still says 0.0.0-dev, so an
      # install here would either fail or quietly rewrite the tree the release is about
      # to publish. The script asserts its own result — including that the internal
      # @devicechain/* peer ranges moved with the version, which is the half that makes
      # the packages installable at all.
      - name: Stamp the release version into the manifests
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: node scripts/set-package-versions.mjs "$VERSION"

      # 🔴 THE LAST THING BETWEEN A DEFECT AND AN IMMUTABLE VERSION. It reads the same
      # tarballs `npm publish` is about to upload — packed from the STAMPED manifests,
      # so this is the only place the release version and the internal peer ranges are
      # checked on the artifact rather than on the object the stamper just wrote.
      #
      # `npm pack` runs no lifecycle script in these packages (none declares `prepare`
      # or `prepack`) and never installs, so it is safe on this side of the stamp — see
      # the 🔴 above, which nothing here may violate.
      #
      # The same gate runs on every pull request against the committed placeholder, so
      # a failure here is a release-only defect: the stamp, or something the tag
      # changed. ci.yml is where the shape of the packages is settled.
      - name: Verify the packed artifacts
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: node scripts/verify-packages.mjs --version "$VERSION"

      - name: Publish to npmjs.com
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          IS_PRERELEASE: ${{ needs.guard.outputs.is_prerelease }}
        run: |
          # `latest` moves ONLY on a stable release, mirroring the image and chart tags.
          # A prerelease goes to `next`, so `npm install @devicechain/widgets` keeps
          # resolving to the last stable one — an rc exists precisely to be discarded.
          tag=latest
          if [ "$IS_PRERELEASE" = "true" ]; then
            tag=next
          fi
          node scripts/publish-packages.mjs --version "$VERSION" --tag "$tag"

  # ---------------------------------------------------------------------------
  # Publish the C# SDK to nuget.org.
  #
  # 🔴 THERE IS NO AUTH ASYMMETRY ANY MORE, AND THE NOTE THAT SAID SO WAS WRONG WITHIN A
  # DAY OF BEING WRITTEN. This job first shipped with a stored NUGET_API_KEY on the stated
  # premise that "NuGet has no OIDC equivalent to npm's trusted publishing". NuGet shipped
  # exactly that, and then closed the other door: new API keys are capped at 30 DAYS from
  # 2026-08-17, and every key created before then expires 2026-11-01. A stored key is
  # therefore not the lesser option here, it is an unusable one — any release cadence
  # slower than a month would meet an expired credential at every single tag.
  #
  # So both publishing legs of this release are keyless OIDC now, for the same reason and
  # in the same shape. nuget.org validates a short-lived GitHub token against a policy and
  # returns an API key good for about an hour.
  #
  # 🔴 WHAT MAKES THIS JOB TRUSTED IS A SETTING ON nuget.org, AND IT NAMES THIS FILE —
  # exactly like the npm leg above. The policy is owner `devicechain`, repository
  # `devicechain-io/devicechain`, workflow file `release.yml` (filename only), no
  # environment. Renaming this workflow, or moving these steps into a reusable workflow
  # running under a different filename, silently revokes publishing; the symptom is a
  # failed token exchange, not anything that mentions the rename.
  #
  # 🔴 AND UNLIKE npm, THIS LEG NEEDS NO MANUAL BOOTSTRAP. A trusted publishing policy
  # carries a SCOPE that can permit publishing NEW packages, matched by a glob
  # (`DeviceChain.*`), so the first ever version of DeviceChain.Sdk can come from here.
  # npm cannot do that — a trusted publisher can only be configured on a package that
  # already exists — which is why the four @devicechain/* packages needed a manual first
  # publish and this one does not.
  #
  # The version comes from the tag with its leading `v` STRIPPED, matching the chart.
  # NuGet rejects `v0.13.0` outright, so passing it unstripped fails loudly rather than
  # publishing something odd. The committed <Version>0.0.0-dev is not "the current
  # version" — it is what a pack that forgot to pass one produces.
  #
  # ci.yml's `csharp` job already packs this project and reads the artifact back
  # (icon, readme, repository url, description, tags), so a packaging-metadata defect
  # fails on the pull request rather than here. This job is the push.
  #
  # Gated on both correctness gates for the same reason as npm-packages: a NuGet
  # version is immutable too — unlisting hides a package from search, it does not free
  # the number.
  nuget:
    needs: [guard, loadtest-gate, upgrade-gate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/csharp
    permissions:
      contents: read
      id-token: write # nuget.org trusted publishing (OIDC) — see above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          version="${VERSION#v}"
          dotnet pack src/DeviceChain.Sdk -c Release -p:Version="$version" -warnaserror \
            -o "$RUNNER_TEMP/nupkg"

          # Assert the artifacts exist and carry the version, rather than trusting that
          # a green pack produced the right file. -warnaserror does NOT promote the
          # informational lines NuGet emits for missing package metadata, so "packed"
          # and "packed well" are different claims; ci.yml checks the second one.
          # Both files are named, and the exact names were MEASURED by packing this
          # project rather than assumed: <IncludeSymbols> produces
          # DeviceChain.Sdk.<version>.nupkg and .snupkg, side by side. The push below
          # names only the .nupkg — `dotnet nuget push` documents `--no-symbols` as
          # "doesn't push symbols (even if present)", i.e. a symbols package sitting
          # next to the .nupkg goes up unless you opt out — so a .snupkg that failed to
          # pack would otherwise vanish without a word.
          for ext in nupkg snupkg; do
            f="$RUNNER_TEMP/nupkg/DeviceChain.Sdk.$version.$ext"
            [ -f "$f" ] || { echo "::error::pack did not produce $(basename "$f")"; exit 1; }
            echo "packed $(basename "$f")"
          done

      # 🔴 REQUESTED IMMEDIATELY BEFORE THE PUSH, DELIBERATELY. The key nuget.org returns
      # is valid for about an hour and each OIDC token buys exactly one key, so moving
      # this step earlier — beside the pack, say — would trade a working release for one
      # that expires behind a slow gate. It is the last thing before the push.
      #
      # `user` is the nuget.org USERNAME, not an email address. nuget.org's own docs call
      # that out, and the failure for getting it wrong is an authentication error that
      # says nothing about which field was wrong.
      - name: NuGet login (OIDC → short-lived key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: devicechain

      - name: Push to nuget.org
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Asserted rather than assumed. A login step that silently produced nothing
          # would otherwise reach `dotnet nuget push` as an empty --api-key, and that
          # arrives as a bare 401 — which reads like a revoked credential rather than a
          # missing one, and sends the reader to the wrong page on nuget.org.
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::the OIDC token exchange returned no API key. Check that the trusted"
            echo "::error::publishing policy on nuget.org names repository devicechain-io/devicechain,"
            echo "::error::workflow file release.yml, user devicechain, and a scope permitting NEW"
            echo "::error::packages matching DeviceChain.* — and that this job kept id-token: write."
            exit 1
          fi
          version="${VERSION#v}"
          # --skip-duplicate demotes a 409 Conflict to a warning, so re-running this job
          # after a later step failed does not die on the version it already pushed.
          # There is no way to withdraw and retry a version, so a re-run has to be
          # survivable. What actually decides whether the package is published is the
          # step below, not this command's exit status.
          dotnet nuget push "$RUNNER_TEMP/nupkg/DeviceChain.Sdk.$version.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # 🔴 ASSERT THE REGISTRY, not the exit status of the push. `--skip-duplicate` above
      # exits 0 for a version that was never accepted in the first place as readily as
      # for one that was, so the push's own status cannot distinguish "published" from
      # "quietly skipped".
      #
      # A TIMEOUT HERE MEANS "RE-RUN THIS JOB", NOT "THE RELEASE IS BROKEN". nuget.org
      # runs an asynchronous validation pipeline (virus scan, signature checks) before a
      # package appears on the flat container, and a brand-new package id can sit in it
      # for several minutes. The bound is generous and then hard, because a poll that
      # gave up quietly would make "never appeared" and "appeared late" the same result.
      - name: Confirm nuget.org serves it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          version="${VERSION#v}"
          url=https://api.nuget.org/v3-flatcontainer/devicechain.sdk/index.json
          for i in $(seq 1 45); do
            if curl -fsS "$url" | jq -e --arg v "$version" 'any(.versions[]; . == $v)' >/dev/null 2>&1; then
              echo "nuget.org lists DeviceChain.Sdk $version."
              exit 0
            fi
            echo "attempt $i: $version not listed yet"
            sleep 20
          done
          echo "::error::DeviceChain.Sdk $version did not appear on nuget.org within 15 minutes."
          echo "::error::The push was accepted; this is nuget.org's validation pipeline. Re-run this job."
          exit 1

  # ---------------------------------------------------------------------------
  # Cross-compile dcctl and create the GitHub Release (goreleaser).
  # ---------------------------------------------------------------------------
  cli:
    # Depends on `images` as well as `guard` so the verification step below runs
    # against a registry that already has this release's tags. Without that
    # ordering the check would race the push and fail on a correct release.
    # Also gated on `loadtest-gate` and `upgrade-gate`: the GitHub Release is the
    # auditable release artifact, so it is not created unless the
    # correctness-under-load gate passed AND an existing instance's data was shown
    # to survive the upgrade to this tag.
    needs: [guard, images, loadtest-gate, upgrade-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser needs full history (tags + commits) for changelog/version.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # goreleaser derives the changelog range by walking back from the tag's
      # PARENT to the nearest tag, and that rule silently truncates the notes
      # whenever a release candidate had to be re-cut.
      #
      # 🔴 IT ALREADY DID. v0.12.1 published a changelog of ONE commit — the fix
      # that made the release possible — omitting the two fixes the release
      # existed for. v0.12.1-rc.1 failed and was re-cut as rc.2 after one more
      # commit, which left rc.1 sitting on the stable tag's parent, so that is
      # what goreleaser measured from. v0.12.0's notes were complete only by
      # luck: its single rc sat on the SAME commit as the stable tag, so the
      # walk skipped past it to the previous cycle.
      #
      # A reader wants "what changed since the last release I could have been
      # running", which is the previous STABLE tag, and never depends on how
      # many candidates it took to get here. Computed explicitly below.
      #
      # Same-commit tags are excluded: re-running a candidate that a stable tag
      # later pinned to the same commit would otherwise measure zero commits.
      # An empty result is left unset so goreleaser keeps its own fallback,
      # which is what the very first release needs.
      - name: Changelog spans from the previous STABLE release
        run: |
          cur="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          prev=""
          while read -r t; do
            [ -z "$t" ] && continue
            [ "$(git rev-list -n1 "$t")" = "$cur" ] && continue
            prev="$t"; break
          done <<< "$(git tag --list 'v*' --merged "${GITHUB_REF_NAME}" --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
            echo "Changelog: $prev..${GITHUB_REF_NAME} ($(git rev-list --count "$prev..${GITHUB_REF_NAME}") commits)"
          else
            echo "No earlier stable tag; leaving goreleaser to pick its own range."
          fi

      # Build ONE target first, with the same ldflags the release will use, so the
      # verification below can gate publication. Verifying after `release` would
      # only tell us the broken release is already public.
      - name: goreleaser build (verification target)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: build --clean --single-target
          workdir: backend/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # The released dcctl deploys ghcr.io/<registry>/<area>:<its stamped tag> when
      # `dcctl bootstrap` runs with no --version. If that tag does not exist, every
      # workload lands in ImagePullBackOff several minutes into a bootstrap that
      # looked healthy — and nothing upstream catches it, because the stamped value
      # is shaped exactly like a real tag. Only asking the registry can tell.
      #
      # This shipped broken in v0.8.1 and v0.8.2: goreleaser's {{ .Version }} strips
      # the leading "v" while ko tags images with the raw git tag, so a released
      # dcctl went looking for :0.8.2 against a registry holding :v0.8.2.
      #
      # Run the freshly built binary rather than re-deriving the tag from the
      # workflow: re-deriving would test this file's arithmetic against itself,
      # which is precisely the check that passed while the bug shipped.
      - name: Verify the released dcctl deploys a tag that exists
        env:
          REGISTRY: ghcr.io/devicechain-io
        run: |
          set -euo pipefail
          binary="$(find backend/cli/dist -type f -name dcctl -path '*linux_amd64*' | head -1)"
          if [ -z "$binary" ]; then
            echo "::error::Could not find the built linux/amd64 dcctl to verify."
            exit 1
          fi
          tag="$("$binary" version | awk '$1 == "images:" { print $2 }')"
          if [ -z "$tag" ]; then
            echo "::error::Could not read the image tag from 'dcctl version'."
            "$binary" version
            exit 1
          fi
          echo "Released dcctl would deploy image tag: $tag"

          # device-management stands in for the whole set — every area is pushed by
          # the same ko job with the same tag list, so one resolving means all do.
          token="$(curl -fsSL "https://ghcr.io/token?scope=repository:devicechain-io/device-management:pull&service=ghcr.io" | jq -r .token)"
          code="$(curl -sSL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/devicechain-io/device-management/manifests/${tag}")"
          if [ "$code" != "200" ]; then
            echo "::error::dcctl would deploy ${REGISTRY}/<area>:${tag}, which does not exist in the registry (HTTP ${code}). A bootstrap from this release would ImagePullBackOff on every workload."
            exit 1
          fi
          echo "OK: ${REGISTRY}/device-management:${tag} resolves."

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
          # The dcctl module is the goreleaser project root; its config and
          # main.go live under backend/cli.
          workdir: backend/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin goreleaser to the pushed tag. A stable release (v0.8.0) is often
          # cut on the SAME commit as its final RC (v0.8.0-rc.4); with two tags on
          # one commit, goreleaser's `git describe` version detection can resolve to
          # the prerelease and then try to upload assets to the RC's existing
          # release (422 already_exists). GITHUB_REF_NAME is unambiguous.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Cross-compile the Tier-1 edge agent (dc-edge-agent) static binaries and attach
  # them to the GitHub Release the `cli` job just created.
  #
  # This does NOT run `goreleaser release` in publish mode: dcctl's goreleaser (the
  # `cli` job) owns the single Release for the tag, and two goreleasers both creating a
  # Release on one tag collide. The edge module's .goreleaser.yaml sets `release.disable:
  # true`, so `goreleaser release` here builds the archives + a UNIQUELY named checksum
  # file (dc-edge-agent_checksums.txt, so it cannot clobber dcctl's checksums.txt) without
  # any GitHub write; the upload step then attaches them to the existing Release.
  #
  # `needs: cli` orders it AFTER the Release exists (cli in turn needs loadtest-gate), so
  # the edge binaries never land on a Release that the correctness-under-load gate failed.
  # The edge container IMAGE is published separately by the `images` matrix (the module is
  # in the guard's smoke list). Its ghcr package came out PUBLIC on the first release that
  # pushed it (v0.9.0-rc.1, verified by anonymous manifest GET), so there is no visibility
  # flip to perform -- see the header.
  edge-agent:
    needs: [guard, images, loadtest-gate, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser needs full history (tags + commits) for version/commit stamping.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: goreleaser build (archives + checksums, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: backend/edge/dc-edge-agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same tag-disambiguation reason as the cli job above.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # A `-ldflags -X` to a renamed/nonexistent var is NOT an error — it silently no-ops,
      # shipping a binary that reports "dev". Run the freshly built binary and confirm it
      # reports the release tag before attaching it, so a var rename in main.go fails the
      # release instead of shipping unstamped binaries (mirrors the cli job's verify).
      - name: Verify the edge-agent binary is version-stamped
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          binary="$(find backend/edge/dc-edge-agent/dist -type f -name dc-edge-agent -path '*linux_amd64*' | head -1)"
          if [ -z "$binary" ]; then
            echo "::error::Could not find the built linux/amd64 dc-edge-agent to verify."
            exit 1
          fi
          out="$("$binary" version)"
          echo "reported: $out"
          # goreleaser strips the leading 'v' for .Version, so match the tag with or without it.
          if ! echo "$out" | grep -qE "dc-edge-agent (v?${TAG#v})[ (]"; then
            echo "::error::edge-agent 'version' reported '$out', which does not carry tag '${TAG}' — ldflags stamping is broken (renamed main.version var?)."
            exit 1
          fi

      - name: Attach edge-agent artifacts to the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # --clobber makes a re-run idempotent (it only ever overwrites the edge module's
        # own uniquely-named assets, never dcctl's).
        run: |
          gh release upload "$TAG" \
            backend/edge/dc-edge-agent/dist/dc-edge-agent_*.tar.gz \
            backend/edge/dc-edge-agent/dist/dc-edge-agent_checksums.txt \
            --clobber

  # ---------------------------------------------------------------------------
  # Publish the release manifest to the public website (https://devicechain.io/releases.json).
  #
  # 🔴 THIS RUNS LAST, AND THAT ORDERING IS THE POINT. It needs `cli` (which creates the
  # Release and its dcctl archives) and `edge-agent` (the last job to attach assets), so by
  # the time it runs the release is fully published. A failure here therefore means
  # "release shipped, website not updated" — recoverable by re-running this one job — and
  # never "images pushed, no Release", which is the shape the loadtest gate ordering exists
  # to avoid. Do not move it earlier to save a minute.
  #
  # It is also NOT `continue-on-error`. A stale manifest makes the website's download menu
  # confidently offer an old version, which is worse than the menu being broken: the failure
  # has to be visible.
  #
  # WEBSITE_PUBLISH_TOKEN is a fine-grained PAT scoped to devicechain-io/website with
  # contents:write and nothing else — the narrowest credential that can do this. Every other
  # job in this workflow uses the built-in GITHUB_TOKEN; this is the one exception, and it
  # exists because a cross-repo write is not something GITHUB_TOKEN can do by design.
  # 🔴 It EXPIRES. When this job fails, check the token's expiry before anything else.
  publish-manifest:
    needs: [guard, cli, edge-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # gh release view; the website push uses its own PAT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the release manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Stamp the manifest with the Release's own publication time rather than "now",
          # so a re-run does not report a different release date for the same version.
          RELEASED_AT="$(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          export RELEASED_AT
          hack/build-release-manifest.sh "$TAG" releases.json
          jq . releases.json

      # 🔴 NOT run for a prerelease. devicechain.io/releases.json is what the site's download
      # menu and the docs banner read, so publishing an rc there would advertise a release
      # candidate as the current version — and an rc exists precisely to be discarded. The
      # step below this one already said a prerelease "is deliberately not what
      # devicechain.io should advertise"; only the VERIFICATION was skipped, while the push
      # ran regardless, so the intent was written down and never implemented. The manifest is
      # still BUILT above on an rc, which is the half worth exercising: it proves the script,
      # the highlights and goreleaser's checksums all line up before the stable tag.
      - name: Publish to the website repo
        if: needs.guard.outputs.is_prerelease == 'false'
        env:
          TOKEN: ${{ secrets.WEBSITE_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::WEBSITE_PUBLISH_TOKEN is not set — the manifest cannot be published."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/devicechain-io/website.git" site
          cp releases.json site/releases.json
          cd site
          # A re-run of an unchanged release is a no-op rather than an empty commit.
          if git diff --quiet -- releases.json; then
            echo "releases.json already current for $TAG — nothing to publish."
            exit 0
          fi
          git config user.name "devicechain-release"
          git config user.email "noreply@devicechain.io"
          git add releases.json
          git commit -m "Publish release manifest for $TAG"
          git push origin HEAD:main

      # Netlify deploys on push; give it a moment, then verify the PUBLISHED file rather
      # than trusting that a green push means a live site. Skipped for a prerelease because
      # nothing was pushed — see the step above.
      - name: Confirm the site serves it
        if: needs.guard.outputs.is_prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 20); do
            live="$(curl -fsS https://devicechain.io/releases.json | jq -r '.version' 2>/dev/null || true)"
            if [ "$live" = "$TAG" ]; then
              echo "devicechain.io/releases.json is serving $TAG."
              exit 0
            fi
            echo "attempt $i: serving '${live:-<none>}', waiting for $TAG"
            sleep 15
          done
          echo "::error::devicechain.io/releases.json did not report $TAG within 5 minutes. The commit landed; check the Netlify deploy."
          exit 1
