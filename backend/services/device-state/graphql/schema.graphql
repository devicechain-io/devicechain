#
# Device State GraphQL Schema
#

# Base elements in gorm RDB model.
interface Model {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
}

# Pagination info for search results.
type SearchResultsPagination {
	pageStart: Int
	pageEnd: Int
	totalRecords: Int
}

# Live current-state projection for a single device (connectivity + activity).
type DeviceState implements Model {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    deviceToken: String!
    active: Boolean!
    lastConnectTime: String
    lastDisconnectTime: String
    lastActivityTime: String
    inactivityAlarmTime: String
    inactivityTimeout: Int!
    # externalId is the device's transport-native identity, denormalized from the
    # resolved event (ADR-049); null when the device has no external id.
    externalId: String
    # source is the event source that last drove this device (e.g. "mqtt", "lwm2m",
    # "sparkplug:{hostId}"), denormalized from the resolved event. Null before the
    # device has produced an event carrying one. It answers "which transport is this
    # device on", which callers need to know whether a command can reach it at all —
    # the transports differ in whether they have a command path, not only in whether
    # the device is currently connected.
    source: String
    # presenceSource discriminates authoritative presence from inferred (ADR-067):
    # INFERRED (activity + inactivity sweep) or ASSERTED (Active driven only by a
    # StateChange). sessionId is the last-applied transition's ordering epoch, returned
    # as a String because it is a UnixNano value that overflows a 32-bit GraphQL Int
    # (0 until the first StateChange). presenceTime is that transition's time.
    presenceSource: String!
    sessionId: String!
    presenceTime: String
}

# Current (most-recent) value of a single named measurement for a device — the
# live "what is it now?" projection beside the append-only history. occurredTime
# is the RFC3339 time of the reading; value is null only for a non-numeric reading
# (not stored in v1).
type LatestMeasurement implements Model {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    deviceToken: String!
    name: String!
    value: Float
    classifier: Int
    # unit + dataType are denormalized from the bound metric definition (ADR-016) so
    # the last-known value is self-describing; both are null for an undeclared
    # measurement. dataType lets a consumer render a 0/1 BOOLEAN value as false/true.
    unit: String
    dataType: String
    occurredTime: String!
}

# Last-known position of a device — the O(1) "where is it right now?" projection
# beside the append-only location history. One per device. Coordinates are WGS84 /
# EPSG:4326 decimal degrees; elevation and accuracy are metres (elevation above the
# ellipsoid, not mean sea level), speed is metres per second, heading is degrees
# clockwise from true north in [0, 360). Every coordinate is nullable because a fix
# reports only what its sensor produced — null means "not reported", which is not the
# same claim as 0. occurredTime is the RFC3339 time of the fix itself.
#
# Reading this requires the location:read authority, which is separate from the
# state:read that covers the rest of this API and is not part of the read-only
# baseline: where a device is differs in kind from what it is measuring.
type LatestLocation implements Model {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    deviceToken: String!
    latitude: Float
    longitude: Float
    elevation: Float
    accuracy: Float
    speed: Float
    heading: Float
    occurredTime: String!
}

# Criteria used when searching for device states. Device-token lookups are served
# by the deviceStatesByDeviceToken query instead of a criteria field.
input DeviceStateSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    active: Boolean
}

# Search results returned from device state query.
type DeviceStateSearchResults {
    results: [DeviceState!]!
    pagination: SearchResultsPagination!
}

# Queries for accessing device state.
type Query {
    # Get device states for one or more devices by device token.
    deviceStatesByDeviceToken(deviceTokens: [String!]!): [DeviceState!]!
    # Get device states for one or more devices by their (denormalized) external id.
    deviceStatesByExternalId(externalIds: [String!]!): [DeviceState!]!
    # ASSERTED device states for the calling tenant AND the given event source — the
    # set an adapter reconciles against on failover (ADR-067 SP4b): it enumerates the
    # devices the platform believes that source has online, floors its epoch generator
    # from the max sessionId here, and probes each for liveness. The source scope stops
    # two sources on one tenant from cross-disconnecting each other's devices.
    #
    # activeOnly:true answers "who does the projection believe is online". false adds
    # the asserted devices it believes are OFFLINE, whose stored sessionId a repair
    # needs in order to be one presence ordering will accept — a broker node with a
    # trailing clock mints a LOWER session on reconnect, and a lower session is
    # rejected forever. There is no default: the two are different questions.
    assertedDeviceStates(source: String!, activeOnly: Boolean!): [DeviceState!]!
    # Search for device states that match the given criteria.
    deviceStates(criteria: DeviceStateSearchCriteria!): DeviceStateSearchResults!
    # Current value of every measurement name for a device (live readings).
    latestMeasurements(deviceToken: String!): [LatestMeasurement!]!
    # Last-known position of one device; null when it has never been located.
    # Requires location:read.
    latestLocation(deviceToken: String!): LatestLocation
    # Last-known position of each of the given devices — the fleet-map batch. A device
    # that has never been located is absent from the result rather than present with
    # null coordinates. Requires location:read.
    latestLocations(deviceTokens: [String!]!): [LatestLocation!]!
}

schema {
    query: Query
}
