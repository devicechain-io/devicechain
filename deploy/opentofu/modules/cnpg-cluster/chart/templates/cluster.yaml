{{- /*
A DeviceChain database store as a CloudNativePG Cluster.

WHY THIS CHART EXISTS AT ALL, and why it is ours rather than cnpg/cluster.

It exists because a `kubernetes_manifest` resource requires its CRD to be
present at PLAN time, and the CNPG CRDs are installed by an earlier apply in
the same run (A2.2). Helm renders and applies together, so a `helm_release`
sidesteps that ordering trap entirely. The cert-manager module documents the
same problem for the ingress Issuer.

It is OURS because the upstream cnpg/cluster chart is an unversioned 0.x
*values* API layered over a stable v1 Kubernetes API, and it fails open on the
two fields this slice exists to set. Measured on chart 0.8.1: misspelling
`cluster.services` or `cluster.roles` renders a Cluster with NO `managed:`
block whatsoever and exits 0. The result deploys cleanly, the `dc-postgresql`
alias never appears, every service dies on `permission denied to create
database`, and nothing points back at the values file. (A typo under
`cluster.postgresql` IS caught -- but only by a deprecation guard carrying a
hardcoded allow-list, which is luck rather than design.)

Its defaults are also wrong for us in a way that is specifically invisible:
`affinity.topologyKey` defaults to `topology.kubernetes.io/zone`, and a node
without that label simply does not participate in the anti-affinity term. On
kind, on bare metal, and on any cluster that has not been zone-labelled, three
instances land on one node and the HA is decorative. That is the A0 false-HA
shape exactly, so we set `kubernetes.io/hostname` and make it a value.

So: no translation layer. The values here ARE the Cluster spec, and the
load-bearing ones are `required` so a missing value is a render error rather
than a silently absent field.

🔴 ONE THING THIS CANNOT PROTECT AGAINST, and the rig must: a field misspelled
in THIS FILE is pruned silently on the way in. Measured both ways, because the
two clients differ and only one of them is the path we use:

  kubectl apply   REJECTS it -- `strict decoding error: unknown field
                  "spec.postgresql.synchronus"`. Loud, immediate, unmissable.
  helm install    ACCEPTS it. Exit 0, release deployed, and the created object
                  has no `synchronous` block at all.

This module applies through Helm. So a one-character slip in the block below
yields three healthy pods replicating ASYNCHRONOUSLY, with `tofu apply` green
and every pod-counting check agreeing. That is the false-HA shape A0 closed for
the broker, reachable here by a typo.

"The YAML we sent" is therefore not "the spec in the cluster", and no amount of
care in this file changes that. The rig reads the load-bearing fields back from
the live object -- see the `synchronous replication is configured` check in
hack/ha-rig.sh, which asserts against the API server, not against this file.
*/ -}}

{{- $name := required "cnpg-cluster: .Values.name is required" .Values.name -}}
{{- $instances := required "cnpg-cluster: .Values.instances is required" .Values.instances | int -}}
{{- $owner := required "cnpg-cluster: .Values.bootstrap.owner is required" .Values.bootstrap.owner -}}

{{- /*
The owner must not be a role CloudNativePG reserves, and this guard exists
because the failure is only HALF loud.

Measured on CNPG 1.30.0 with `owner: postgres`:

  spec.managed.roles      REJECTED by the webhook -- `Invalid value: "postgres":
                          This role is reserved for operator use`.
  spec.bootstrap.initdb.owner   ACCEPTED. No complaint at all.

So today the combination is refused, but only because this chart happens to
render a managed role for the owner. Make that block conditional -- or set an
owner CNPG reserves in some future field that does not validate -- and the
cluster comes up with the platform connecting as the ACTUAL superuser, its
password in a Secret we wrote, and `enableSuperuserAccess: false` above rendered
meaningless. Nothing would report a problem.

This matters here rather than being theoretical: the event store's app username
was `postgres` for as long as it was a plain StatefulSet, because the stock
postgres image's POSTGRES_USER *is* the superuser. A2.4 renames it to
`devicechain`, and this refuses the old value rather than trusting that the
webhook will keep catching it somewhere else.
*/ -}}
{{- if has $owner (list "postgres" "streaming_replica" "cnpg_pooler_pgbouncer") -}}
  {{- fail (printf "cnpg-cluster %q: bootstrap.owner is %q, which CloudNativePG reserves for its own use. Pick an application role name -- the platform connects as the owner, and naming it after a reserved role means connecting as the superuser rather than as an application." $name $owner) -}}
{{- end -}}

{{- /*
The instance-count invariant, enforced rather than documented.

Synchronous replication with `number: N` needs N standbys present to accept a
write. Tolerating the loss of one of them therefore needs N+1 standbys, i.e.
N+2 instances. At N=1 that is three -- which is the fact the roadmap left out
when it said "synchronous for rdb", and the reason this is a `fail` and not a
comment. Two instances would convert ANY replica loss into a total write
outage: strictly worse for availability than the single node it replaced,
while being better for durability. That trade should never be entered by
accident.

This is NOT redundant with CloudNativePG's own admission webhook, though the
two look similar and it is worth being precise about the gap. Measured: the
webhook refuses `instances: 1` under `number: 1` with "the number of
synchronous replicas must be less than the total number of instances" -- so it
rejects the IMPOSSIBLE (a cluster that could never accept a write). It accepts
two instances quite happily. This guard rejects the UNWISE, one step further
out, and that step is the entire availability argument for the third node.
*/ -}}
{{- if .Values.synchronous.enabled -}}
  {{- $need := add (.Values.synchronous.number | int) 2 -}}
  {{- if lt $instances $need -}}
    {{- fail (printf "cnpg-cluster %q: synchronous replication with number=%d requires at least %d instances (got %d). At fewer, losing a single standby stalls every write -- worse availability than one node, which is not a trade to make silently." $name (.Values.synchronous.number | int) $need $instances) -}}
  {{- end -}}
{{- end -}}

{{- /*
RESTORE PRECONDITIONS.

Each of these is a way to write a Cluster that CloudNativePG accepts and that
does not restore what the operator believes it is restoring. They are `fail`s
because every one of them is discovered during an incident, on the one path
where there is no time to debug the configuration.
*/ -}}
{{- $restore := .Values.restore -}}
{{- $restoreStore := "" -}}
{{- if $restore.enabled -}}

  {{- /*
  (1) No source. The obvious default -- "this cluster's own name" -- is exactly
  wrong: on a fresh install that path is EMPTY, so the recovery finds no base
  backup and the cluster never reaches a primary. Worse, if the name happens to
  collide with a real server the restore silently brings back the wrong
  database. There is no safe inference here, so there is no default.
  */ -}}
  {{- if not $restore.sourceServerName -}}
    {{- fail (printf "cnpg-cluster %q: restore.enabled is true but restore.sourceServerName is unset. That is the folder inside the bucket the backup was written under -- without it there is nothing to say WHICH database is being restored, and the only available inference (this cluster's own name) points at an empty path on a fresh install." $name) -}}
  {{- end -}}

  {{- /*
  (2) Nowhere to read from. The ObjectStore defaults to the one this release
  renders for its OWN archiving, which only exists when backup.enabled is true.
  With backups off and no explicit name, the externalCluster would reference an
  object that is not in this release and may not be in the cluster at all --
  and the plugin reports that as a restore failure well after the PVCs have
  been created.
  */ -}}
  {{- $restoreStore = $restore.objectStoreName | default (printf "%s-backup" $name) -}}
  {{- if and (not $restore.objectStoreName) (not .Values.backup.enabled) -}}
    {{- fail (printf "cnpg-cluster %q: restore.enabled is true with backup.enabled false and no restore.objectStoreName. This release renders no ObjectStore, so there is no destination to read the backup from. Name an ObjectStore that already exists in the namespace, or turn backups on so the restored cluster archives too." $name) -}}
  {{- end -}}

  {{- /*
  (3) 🔴 THE ARCHIVE-OVER-THE-SOURCE WEDGE, and the reason this guard is worth
  more than the other two put together.

  A restored cluster that also archives MUST write under a different serverName
  than it recovered from. CloudNativePG has a safety check for exactly this --
  it refuses to begin archiving into a non-empty archive -- so the failure is
  loud rather than silent: the cluster sits in `Setting up primary` with the
  pod logging that the WAL archive is not empty, and it stays there.

  Loud, but loud during a restore, which is the worst time to be reading pod
  logs. And the recovery is not resumable from that state without editing the
  Cluster in place. So the combination is refused at render time instead, where
  the message can say what to set.

  Equal names are refused, and so is an UNSET backup.serverName -- because unset
  means "use the Cluster's own name", and a cluster restored under the name it
  is restoring from is the same collision written differently.
  */ -}}
  {{- if .Values.backup.enabled -}}
    {{- if not .Values.backup.serverName -}}
      {{- fail (printf "cnpg-cluster %q: restoring from %q with archiving on, but backup.serverName is unset -- so the restored cluster would archive under its own name. If that equals the source it collides; if it does not, it is still an accident rather than a decision. Set backup.serverName to the path this restored cluster should own." $name $restore.sourceServerName) -}}
    {{- end -}}
    {{- if eq .Values.backup.serverName $restore.sourceServerName -}}
      {{- fail (printf "cnpg-cluster %q: backup.serverName and restore.sourceServerName are both %q. CloudNativePG refuses to archive into a non-empty archive, so this cluster would recover and then hang in `Setting up primary` with its WAL going nowhere -- and it would do it during a restore. Give the restored cluster its own path." $name $restore.sourceServerName) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: opentofu
spec:
  instances: {{ $instances }}
  imageName: {{ required "cnpg-cluster: .Values.imageName is required" .Values.imageName }}

  # CNPG's own default is false. The upstream chart flips it to true; we do not.
  # A superuser whose password sits in a Secret is a standing credential the
  # platform never uses -- every service connects as the app owner.
  enableSuperuserAccess: {{ .Values.enableSuperuserAccess }}

  # A PodDisruptionBudget so a node drain cannot take the quorum with it — but
  # ONLY above one instance.
  #
  # 🔴 It does NOT "cost nothing to have on from the start", which is what an
  # earlier version of this comment claimed. At `instances: 1` CNPG emits a PDB
  # with minAvailable=1 over a single pod, so ALLOWED DISRUPTIONS is 0 and
  # `kubectl drain` on that node blocks forever. Since decision D4 makes one
  # instance the default topology for every non-HA install, that is the COMMON
  # case, and the operation it breaks is the one you most need during a node
  # upgrade. CNPG's own guidance is to disable the PDB for single-instance
  # clusters.
  #
  # Above one instance the budget is doing real work and stays on.
  enablePDB: {{ gt $instances 1 }}

  storage:
    size: {{ required "cnpg-cluster: .Values.storage.size is required" .Values.storage.size }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  {{- if .Values.walStorage.enabled }}
  # A separate WAL volume. Worth it once archiving is on (A2.5): WAL that cannot
  # be archived accumulates, and on a shared volume it fills the one the data is
  # on and stops Postgres. On its own volume that failure is bounded.
  walStorage:
    size: {{ required "cnpg-cluster: .Values.walStorage.size is required when walStorage.enabled" .Values.walStorage.size }}
    {{- with .Values.walStorage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- end }}

  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if .Values.backup.enabled }}
  # WAL archiving and base backups, via the Barman Cloud CNPG-I plugin
  # (ADR-028, ADR-020 A2.5). The destination is the ObjectStore rendered by
  # objectstore.yaml in this same release; the ScheduledBackup that drives the
  # recurring base backup is scheduledbackup.yaml.
  #
  # 🔴 `isWALArchiver: true` is what actually turns archiving on. Without it the
  # plugin is attached, the ObjectStore is referenced, `kubectl get cluster`
  # looks configured for backup -- and Postgres has no archive_command, so
  # nothing is shipped anywhere. At most one plugin may claim it, which is why it
  # is a field on the entry rather than a property of the plugin.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $name }}-backup
        {{- with .Values.backup.serverName }}
        # 🔑 The path WITHIN the bucket, and the one knob a restore has to move.
        #
        # It defaults to the Cluster's own name, which is what makes a plain
        # install self-describing. A cluster recovered from this bucket, however,
        # comes up with the SAME name -- and CloudNativePG refuses, by design, to
        # let a restored cluster archive back over the path it just recovered
        # from. So the restore sets this to something new and the recovered
        # cluster starts a fresh timeline alongside the old one rather than
        # writing into it.
        serverName: {{ . }}
        {{- end }}
  {{- end }}

  # 🔴 hostname, NOT zone. See the header: a topologyKey no node carries makes
  # the anti-affinity term inert, and three instances on one node look exactly
  # like three instances on three nodes from every check that counts pods.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: {{ .Values.topologyKey }}
    # `required` at more than one instance: a soft rule that silently colocates
    # is the false-HA failure this whole workstream exists to remove. At one
    # instance there is nothing to spread, and `required` with a single pod on a
    # single-node cluster would refuse to schedule at all.
    podAntiAffinityType: {{ gt $instances 1 | ternary "required" "preferred" }}

  postgresql:
    {{- with .Values.sharedPreloadLibraries }}
    # 🔴 A library named here that the image does not carry makes the server
    # refuse to start, and CNPG cannot self-heal out of it -- it is an
    # unrecoverable-without-hands state, not a degraded one.
    shared_preload_libraries:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.synchronous.enabled }}
    synchronous:
      method: {{ .Values.synchronous.method }}
      number: {{ .Values.synchronous.number | int }}
      dataDurability: {{ .Values.synchronous.dataDurability }}
    {{- end }}
    {{- $parameters := .Values.parameters | default dict }}
    {{- if .Values.backup.enabled }}
    {{- /*
    🔴 archive_timeout IS WHAT MAKES BOTH THE RPO AND THE ALERT MEAN ANYTHING, and
    it is set here rather than left to the caller because it is a property of
    ARCHIVING, not of either store.

    Postgres ships archive_timeout = 0, i.e. never force a WAL switch. A segment
    is shipped when it FILLS. So on a quiet instance the most recent archived WAL
    can be hours or days old while everything is perfectly healthy, and the
    unshipped tail is unbounded — an instance taking one write an hour can lose a
    day of them to a node failure and still show a green backup.

    That also breaks the obvious alert. "Seconds since last archival > N" is red
    on every idle instance, forever, caused by nothing — which is a check that
    gets switched off, exactly like the policy_telemetry job the event store
    deletes for the same reason. Forcing a switch every archive_timeout makes the
    signal well-defined: past that interval plus slack, silence means broken
    rather than quiet.

    The cost is a mostly-empty 16MB segment per interval on an idle cluster,
    which gzip compresses to almost nothing. The alert threshold in
    prometheusrule-database-backup.yaml is derived from this value; move one and
    move the other.
    */ -}}
    {{- $parameters = merge (dict "archive_timeout" .Values.backup.archiveTimeout) $parameters }}
    {{- end }}
    {{- with $parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  # 🔑 UNCONDITIONALLY TRUE, and that is a deliberate departure from how the
  # OPERATOR's own PodMonitor is handled one module over (modules/cnpg sets
  # enable_pod_monitor false and argues at length for not deriving it). The two
  # look like the same decision and are not, because they are created by
  # different things at different times:
  #
  #   - The operator's PodMonitor is rendered by a HELM RELEASE in the same apply
  #     that installs kube-prometheus-stack. A variable read creates no dependency
  #     edge, so it races the CRDs and a fresh apply fails nondeterministically on
  #     `no matches for kind "PodMonitor"`.
  #   - THIS one is created by the CNPG OPERATOR at reconcile time. Verified in
  #     the operator's source (internal/controller/cluster_create.go): a missing
  #     PodMonitor CRD logs `PodMonitor CRD not present. Cannot create the
  #     PodMonitor object` and returns nil. It does not fail the Cluster, and the
  #     next reconcile after the CRD appears creates it.
  #
  # So there is no race to lose and nothing to order. Both arguments the operator
  # module makes against deriving this then point the same way: `enable_monitoring
  # = false` documents "the cluster ALREADY has the Prometheus Operator", which is
  # precisely where scraping works — so deriving from it would disable metrics in
  # the case that needs no help, while a plain `true` is correct in both.
  #
  # 🔴 Without this the database exports NOTHING to Prometheus, and the whole
  # archive-lag alert becomes a rule with no series to evaluate — which does not
  # fail, it just never fires. That shape is already live elsewhere in this
  # platform and it is why this is on by default rather than opt-in.
  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      # Coupling (a), closed. Every DeviceChain service issues `CREATE DATABASE
      # <instanceId>` at startup (backend/core/rdb/postgres.go), and CNPG's app
      # role has rolcreatedb = f. Measured on the spike: `CREATE DATABASE` as the
      # app user returns `permission denied to create database`, so without this
      # grant every service fails to start on a stock CNPG cluster. `CREATE
      # SCHEMA` succeeds -- only the database half breaks, which is why the
      # symptom is narrower than "nothing works" and easier to misread.
      - name: {{ $owner }}
        ensure: present
        login: true
        createdb: true
        inRoles:
          # pg_monitor, so the HA verifier can see replication state through the
          # SAME credentials every service uses. (It connects to the primary pod
          # directly, not through the alias — the alias is checked separately,
          # against the Kubernetes API.)
          #
          # 🔴 This is not convenience, it is what makes the check honest, and
          # the alternative was measured. Without it `pg_stat_replication`
          # returns the right number of ROWS to the app user but NULLs
          # `state`, `sync_state` and `client_addr` -- so `count(*) where
          # sync_state in ('sync','quorum')` yields 0 with two perfectly
          # healthy standbys. That is a check that fails when the cluster is
          # fine and, far worse, one whose zero-standby PRECONDITION is
          # satisfied instantly -- which would let the synchronous-stall
          # negative control record a pass without the condition it is
          # supposedly testing ever holding.
          #
          # pg_monitor is read-only and grants statistics visibility, not data
          # access. This role already owns every database in the instance, so
          # it widens observability rather than authority.
          - pg_monitor
    services:
      additional:
        # The DNS contract (§2). Services reach this store at a name baked into
        # the config defaults, the Helm values, dcic-default.yaml, the loadtest
        # self-test and the DR rig. CNPG maintains this Service's selector
        # itself, so it follows the primary across a failover -- measured at ~3s
        # on the spike.
        #
        # It must be a MANAGED service, not a hand-rolled one of the same name:
        # only managed services are added to the server certificate's SANs, so
        # this is also what keeps `sslmode=verify-full` reachable later.
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: {{ required "cnpg-cluster: .Values.aliasServiceName is required" .Values.aliasServiceName }}

  bootstrap:
    {{- if $restore.enabled }}
    {{- /*
    RECOVERY, not initdb. The two are mutually exclusive in practice -- CNPG
    reads whichever is present -- and the switch is the whole difference between
    "stand up an empty database" and "bring this one back".

    🔑 database / owner / secret are NOT what create the database here. The
    database comes back with the backup, catalog and all. What they do is settle
    the CREDENTIALS afterwards: once recovery completes, the operator updates the
    owner's password from this Secret, but only if `owner` matches the
    `username` inside it. That condition holds by construction here -- the
    module renders both from the same variable -- and it is what makes a
    restored cluster reachable with the DSN the platform already ships, rather
    than with whatever password was in force when the backup was taken.

    🔴 postInitTemplateSQL does NOT run on this path, and that is correct rather
    than a gap: a physical restore brings template1 back with everything it
    carried, so the TimescaleDB extension arrives WITH the data instead of being
    re-declared over it. But the property is inherited rather than asserted, and
    an inherited property is one nobody notices losing -- so the restore drill in
    hack/dr-rig.sh queries a hypertable after recovery rather than trusting this
    comment.
    */}}
    recovery:
      # Must match an externalClusters entry by name. See the block below for
      # why that name is the source server name rather than something decorative.
      source: {{ $restore.sourceServerName }}
      database: {{ required "cnpg-cluster: .Values.bootstrap.database is required" .Values.bootstrap.database }}
      owner: {{ $owner }}
      secret:
        name: {{ required "cnpg-cluster: .Values.bootstrap.secretName is required" .Values.bootstrap.secretName }}
      {{- $target := $restore.recoveryTarget | default dict }}
      {{- if $restore.recoveryTargetImmediate }}
      {{- $target = merge (dict "targetImmediate" true) $target }}
      {{- end }}
      {{- with $target }}
      # Point-in-time recovery. Absent, every WAL in the archive is replayed.
      recoveryTarget:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ required "cnpg-cluster: .Values.bootstrap.database is required" .Values.bootstrap.database }}
      owner: {{ $owner }}
      # Our own Secret, so the credentials stay the ones the caller configured.
      # Left unset, CNPG generates a password and the DSN the Helm chart ships
      # would no longer be able to log in.
      secret:
        name: {{ required "cnpg-cluster: .Values.bootstrap.secretName is required" .Values.bootstrap.secretName }}
      # 🔴 EXPLICIT, because the operand image carries no locale. initdb with no
      # --encoding infers one from LANG, and with no locale set at all that
      # resolves to SQL_ASCII -- which does not fail here. It fails much later
      # and somewhere else: pgx's simple protocol requires client_encoding=UTF8,
      # so EVERY query returns an encoding error and the database looks broken
      # rather than mis-initialised. Measured while building the operand image.
      encoding: {{ .Values.bootstrap.encoding }}
      localeCollate: {{ .Values.bootstrap.localeCollate }}
      localeCType: {{ .Values.bootstrap.localeCType }}
      {{- with .Values.bootstrap.postInitTemplateSQL }}
      # Runs against template1, so every database the app subsequently CREATEs
      # inherits it. This is the hook that carries the TimescaleDB extension
      # (coupling (b)) -- NOT postInitApplicationSQL, which touches only the one
      # bootstrap database and would leave every app-created database without
      # the extension.
      #
      # 🔴 It is confined to initdb, so it does NOT run on a restore. A physical
      # restore brings template1 back with the backup, so this survives -- but
      # the property is inherited from the backup rather than declared, and the
      # restore drill is what has to prove it.
      postInitTemplateSQL:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}

{{- if $restore.enabled }}

  {{- /*
  Where the recovery reads from.

  🔑 THE ENTRY IS NAMED AFTER THE SOURCE SERVER, and that is a fail-safe rather
  than a naming preference. `serverName` below is what actually selects the
  folder inside the bucket -- but when it is ABSENT, CloudNativePG falls back to
  the externalCluster's own name. So naming the entry anything else would mean a
  dropped or misspelled `serverName` silently resolves to a decorative string
  and recovers from a path that does not exist. Named this way, the fallback
  lands on the right answer.

  And `parameters` is a free-form string map -- `additionalProperties` in the
  CRD -- so neither the API server nor the schema check can catch a misspelled
  key here. hack/check-cnpg-chart-schema.sh asserts these two by name for that
  reason, the same way it does for the archiver's own barmanObjectName.

  🔴 ORDERING, measured: Helm applies unknown kinds in alphabetical order by
  KIND, so this Cluster is applied BEFORE the ObjectStore rendered alongside it
  (renaming the template file does not move it -- tried). The plugin's
  documentation says the ObjectStore must exist before recovery begins. In
  practice the gap is milliseconds and the operator has to create PVCs and
  schedule a job before it can ask the plugin for anything, so the ObjectStore
  is there by the time it matters. "In practice" is not a guarantee, which is
  why the restore drill builds a recovery release from nothing and watches it
  reach a primary rather than assuming this is fine.
  */}}
  externalClusters:
    - name: {{ $restore.sourceServerName }}
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ $restoreStore }}
          serverName: {{ $restore.sourceServerName }}
{{- end }}
