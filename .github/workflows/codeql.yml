#
# CodeQL static analysis for Go.
#
# Go only, deliberately, to start: it is where essentially all of this repo's
# authored logic and its whole attack surface live (ingest decoding, auth, the
# GraphQL layer, the SSRF-hardened outbound webhook path). Adding
# javascript-typescript for the frontend and csharp for the SDK is a later,
# separate decision — each is another full analysis job, and a scanner nobody
# reads the output of is worse than no scanner.
#
# ---------------------------------------------------------------------------
# WHY build-mode: manual, AND WHY `paths-ignore` IS NOT THE ANSWER. Both of these
# are non-obvious and both were checked against the extractor's own source rather
# than assumed.
#
# 1. `build-mode: none` DOES NOT EXIST FOR GO. CodeQL's Go extractor declares
#    exactly two build modes (autobuild, manual); the no-build path is available
#    for C/C++, C#, Java and Rust, and not for Go. So the code has to be built.
#
# 2. AUTOBUILD WOULD SCAN `_legacy/`. The Go autobuilder does not run
#    `go build ./...` at the root (which fails here — the root is not a module).
#    It finds go.work, extracts each `use` entry, AND THEN adds every stray
#    go.mod not referenced by go.work as its own workspace. `_legacy/` — the
#    archived pre-migration SiteWhere tree that CLAUDE.md says not to edit —
#    holds 7 such go.mod files. Autobuild would extract all of them: 22 modules
#    become 29, and the extra alerts are against code we deliberately do not
#    maintain and would never fix.
#
# 3. 🔴 `paths-ignore` CANNOT FIX THAT. It applies only to interpreted languages
#    and to compiled languages analyzed WITHOUT building. For a compiled language
#    that is built — Go, here — GitHub's documented answer is "specify
#    appropriate build steps"; the filter is simply not consulted. A
#    `paths-ignore: [_legacy/**]` here would parse, validate, look correct in
#    review, and exclude nothing. It is a cannot-fail configuration, so it is
#    absent on purpose. Do not add it.
#
# Manual mode makes the build the filter. Go extraction is TRACER-based: CodeQL
# intercepts each `go` invocation, so whatever we build is exactly what gets
# analyzed. `go list -m` reads go.work, so `_legacy/` is never built and
# therefore never extracted — by construction, with nothing to keep in step.
# ---------------------------------------------------------------------------
name: codeql

on:
  # 🔴 DELIBERATELY UNFILTERED. Main's HEAD is always analyzed, so main's
  # code-scanning state describes main's actual HEAD rather than whatever was last
  # considered worth analyzing. (Pushes share one queue -- see concurrency below --
  # so a commit merged mid-burst is analyzed as part of the next HEAD, not alone.) This run blocks nobody — it
  # happens after the merge — so its cost is not the cost anyone was complaining
  # about, and paying it keeps the branch authoritative.
  push:
    branches: [main]

  # The PR run IS on the critical path, and it is the expensive one: measured at
  # ~9-11 min against ~5 min for the whole `ci` workflow. The split is not what it
  # looks like — 422s of that is "Build every workspace module" and only 87s is
  # the analysis. Go extraction is TRACER-based, so the compiler genuinely has to
  # run; the caches already hit (setup-go reports a hit, zero `go: downloading`),
  # and no amount of further caching removes a build CodeQL must observe.
  #
  # So the only lever is not running it when there is nothing to analyze. Measured
  # over the last 20 merges: 8 touched no Go at all — docs, frontend, CI, chart
  # prose. Each of those paid ~10 minutes to analyze an unchanged tree.
  #
  # 🔴 DO NOT CONFUSE THIS WITH `paths-ignore` IN THE CODEQL CONFIG. The header
  # above explains at length that CodeQL's OWN path filtering does not apply to a
  # compiled language that gets built, and that adding it would silently exclude
  # nothing. That warning is about a different mechanism and does NOT transfer
  # here: `paths` on a workflow trigger is evaluated by Actions before the job is
  # ever created, so it genuinely skips. The two look alike and behave oppositely.
  #
  # 🔴 A WORKFLOW SKIPPED BY A PATH FILTER LEAVES ITS CHECKS "PENDING", NOT
  # "SKIPPED" — GitHub's documented behaviour. It is a DEADLOCK for any PR the
  # filter skips if "Analyze Go" is ever required: the PR waits forever on a check
  # that is never going to report.
  #
  # ⚠️ The condition this warning used to rest on has CHANGED. It said "harmless
  # today because `main` carries no branch protection"; `main` HAS been protected
  # since 2026-08-14 (ruleset 20872119). What keeps it harmless now is narrower and
  # deliberate: that ruleset requires exactly `ci-complete`, `dependency-review`
  # and `cla`, and "Analyze Go" is NOT among them. So the guidance is no longer
  # conditional — leave "Analyze Go" out of the required set, or pair this with a
  # job that reports success on the skipped path. Verify before assuming:
  #   gh api repos/devicechain-io/devicechain/rulesets/20872119 \
  #     --jq '.rules[]|select(.type=="required_status_checks")
  #           |.parameters.required_status_checks[].context'
  #
  # 🔑 The same fact is why this workflow's ~10 min is not on the merge critical
  # path: measured on #766, the required three went green at 4.8 min and this
  # analysis finished at 11.1 min. It is not a merge gate; it is a scanner whose
  # result lands shortly after. Optimising its wall clock was considered and
  # declined on those grounds — see the analysis note below.
  #
  # If you ever DO want it faster, the measured lever is not parallelism. A
  # per-module matrix compiled 9754 packages against a 2749-package union (3.55x)
  # and would report a `backend/core` finding ~20 times, once per category. When
  # that was measured, the real weight was one dependency — the embedded stream
  # engine outbound-connectors then carried, whose AWS bundle alone pulled 817
  # packages (29.7% of the union) that nothing here used. That engine has since
  # been removed in favour of clients the service owns, so every figure in this
  # paragraph predates it: re-measure before optimising anything.
  #
  # Re-measured 2026-11-16, for a different reason than the wall clock: QUEUE LOAD.
  # Sixty PR runs in six hours, each ~14 min (build 8-12 min, analysis ~3.5 min), on a
  # runner pool the `ci` workflow already saturates. The lever taken is not a matrix
  # (every objection above still holds — one job, one category) but building FEWER
  # packages in the one job on a pull request: see "Select what to analyze".
  pull_request:
    branches: [main]
    paths:
      # Anything the extractor could see. `**/*.go` is exhaustive by construction,
      # so this cannot miss a Go file by living somewhere unexpected.
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - "go.work.sum"
      # A change to the analysis itself must re-run the analysis. Without this,
      # editing this file is the one change guaranteed not to be tested.
      - ".github/workflows/codeql.yml"
      # The module selection below; the same reasoning, one level out.
      - "hack/ci-select.py"
      # Negation LAST — order decides, and a later negative overrides an earlier
      # positive. `_legacy/` is the archived pre-migration tree that go.work does
      # not reference, so the build step never compiles it and the extractor never
      # sees it. A PR touching only `_legacy/**` would otherwise trigger ten
      # minutes of analysis over a tree whose Go files are not analyzed at all.
      - "!_legacy/**"

  # Analyze a chosen commit (a release tag, or one a merge burst skipped): pushes to
  # main share one queue, so not every main commit gets its own push run. Same recipe
  # as ci.yml: `gh workflow run <this file> --ref <tag or branch>`.
  workflow_dispatch:

  schedule:
    # Weekly, Wednesday 05:17 UTC. A scheduled run matters even though this also
    # runs per-PR: new QUERIES ship continuously, so the same unchanged code gets
    # re-analyzed against rules that did not exist when it merged.
    #
    # It is also the backstop for the PR filter above — `paths` is not evaluated
    # for scheduled events, so this run always analyzes the whole tree regardless
    # of what any recent PR touched.
    - cron: "17 5 * * 3"

permissions:
  contents: read

# One queue for pushes to main: at most one running main run plus ONE pending, and a
# newer push replaces the pending one (never the running one). See ci.yml's
# concurrency block for the full rule and why intermediate main commits can go
# without a run of their own. PR runs still cancel superseded runs; any other event
# (schedule, dispatch) gets a group of its own (run_id) and never waits behind main.
concurrency:
  group: codeql-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload results — required for every CodeQL workflow
      packages: read # fetch CodeQL packs
      actions: read
      contents: read

    steps:
      # A pull request needs history to find the merge base its diff is taken from (the
      # selection below). Push and schedule analyze every module and need none.
      # 🔴 '0' IS A STRING ON PURPOSE: in an Actions expression the NUMBER 0 is falsy, so
      # `cond && 0 || 1` is always 1, the merge base is never found, and every pull request
      # silently falls back to the full analysis.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry and a fallback off the module proxy, so
      # one dropped stream from proxy.golang.org does not fail the job inside whichever build
      # step happened to trigger the download. See hack/go-mod-download.sh.
      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      # Select what to build BEFORE init, on purpose. Between init and analyze every `go`
      # invocation is intercepted by the CodeQL tracer; `go list` and the selection are
      # queries, not builds, and there is no reason to make the extractor reason about them.
      # Resolving the list up front keeps the traced region to actual compilation.
      #
      # 🔴 ON A PULL REQUEST, ONLY THE PACKAGES THE CHANGE CAN REACH. The PR analysis is
      # DIFF-INFORMED: it reports alerts only in the files the pull request changed, so the
      # rest of the tree is analyzed for one reason alone — a data-flow path through a changed
      # file that starts or ends in unchanged code. hack/ci-select.py codeql selects every
      # package that imports a changed one, transitively (the callers, up to each main that
      # links it: a service handler flowing into a changed sink in core), and then every
      # workspace package those import (the callees a flow passes through). So every program
      # that links a changed package is built whole. Each package is named as a build target,
      # because building an imported module is not extracting it: the Go extractor extracts
      # bodies only for the packages it was asked to build. What is left out is code that is
      # in no program with the change.
      #
      # Everything is analyzed when a dependency version moves (go.work, go.work.sum, any
      # go.mod/go.sum), when this workflow or the selection changes, for a .go file outside
      # every module or in no package, and when the selection fails for any reason — a failure
      # falls back to every module rather than to nothing. Push to main and the weekly schedule
      # always analyze every module, and they remain what main's code-scanning state is made of.
      #
      # The plan is one line per module, `<dir><TAB><packages>`. A named package whose files a
      # plain build excludes (only test files, or build tags) is dropped here by `go list`,
      # because `go build` refuses such a package outright.
      - name: Select what to analyze
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.txt"
          go list -m -f '{{.Dir}}{{"\t"}}./...' > "${RUNNER_TEMP}/all.txt"
          all="$(grep -c . "${RUNNER_TEMP}/all.txt" || true)"
          if [ "$all" -eq 0 ]; then
            echo "::error::go list -m reported no workspace modules; there is nothing to analyze"
            exit 1
          fi
          if ! python3 hack/ci-select.py codeql > "${RUNNER_TEMP}/selected.txt"; then
            echo "::warning::the selection failed; analyzing every module"
            cp "${RUNNER_TEMP}/all.txt" "${RUNNER_TEMP}/selected.txt"
          fi
          : > "$plan"
          while IFS=$'\t' read -r m pkgs; do
            pkgs="${pkgs%$'\r'}"
            [ -n "$m" ] || continue
            if [ "$pkgs" = "./..." ]; then
              printf '%s\t./...\n' "$m" >> "$plan"
              continue
            fi
            # shellcheck disable=SC2086 # pkgs is a space-separated list of package args
            keep="$(cd "$m" && go list -e -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' $pkgs | paste -sd' ' -)"
            [ -z "$keep" ] || printf '%s\t%s\n' "$m" "$keep" >> "$plan"
          done < "${RUNNER_TEMP}/selected.txt"
          got="$(grep -c . "$plan" || true)"
          if [ "$got" -eq 0 ]; then
            echo "::warning::the selection chose nothing buildable; analyzing every module"
            cp "${RUNNER_TEMP}/all.txt" "$plan"
            got="$all"
          fi
          whole="$(grep -c $'\t\./\.\.\.$' "$plan" || true)"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$whole" -ne "$all" ]; then
            echo "::error::a $GITHUB_EVENT_NAME run must analyze all $all modules whole, and planned $whole"
            exit 1
          fi
          echo "Analyzing $got of $all modules ($whole whole):"
          cat "$plan"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: go
          build-mode: manual

      # The repo's own full-build idiom. Two details are load-bearing and are the
      # same trap CLAUDE.md documents for the local sweep:
      #
      #   - `rc=1` is accumulated rather than written as `... || echo "FAILED: $m"`.
      #     That obvious form makes the loop's exit status the status of the last
      #     `echo`, i.e. always 0 — every module could fail to compile and this
      #     step would still pass, leaving CodeQL to analyze whatever fragment did
      #     build and report success.
      #   - the subshell `( cd ... )` keeps each module's cd from leaking into the
      #     next iteration.
      - name: Build the selected packages
        run: |
          rc=0
          while IFS=$'\t' read -r m pkgs; do
            echo "::group::go build $m: $pkgs"
            # shellcheck disable=SC2086 # pkgs is a space-separated list of package args
            ( cd "$m" && go build $pkgs ) || { echo "FAILED: $m"; rc=1; }
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/plan.txt"
          exit "$rc"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:go"
