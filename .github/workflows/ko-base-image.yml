#
# Keeps the two Chainguard images DeviceChain pins by digest current:
# `.ko.yaml`'s base image, and the object store's MinIO image (the `image`
# variable's default in deploy/opentofu/modules/object-store/main.tf). And, on
# the same weekly run, checks that every digest-pinned image in the repository
# can still be pulled anonymously (hack/check-image-pulls.sh).
#
# `defaultBaseImage` is the base of every artifact DeviceChain publishes — all
# the service images, the operator and the edge agent. It is pinned by digest so
# a build is reproducible and the base cannot change without a pull request.
#
# 🔴 THIS WORKFLOW IS THE OTHER HALF OF THAT PIN, not a nicety. Chainguard
# rebuilds the base to ship its CVE fixes, so a digest nobody advances quietly
# serves a stale base while the config reads "pinned and secure" — strictly worse
# than the mutable tag it replaced. Dependabot does not parse `.ko.yaml` and
# neither does Scorecard, which is why no scanner ever flagged that line and why
# this has to exist at all.
#
# 🔴 THE OBJECT STORE'S IMAGE IS THE SAME KIND OF PIN, one level further out:
# it reaches every default install rather than every published artifact, and
# Chainguard rebuilds it the same way. It was first pinned by hand with no
# bumper, which is the frozen-pin trap above; it rides this workflow so there is
# one arrangement for both, not two that drift.
#
# A successful run is ALSO the liveness heartbeat that `hack/check-ko-base-pin.sh`
# reads: it records success whether or not a digest moved, so CI can tell
# "the pins are current" from "the bumper died and the pins are frozen". A run
# succeeds only if every digest-pinned image also pulled anonymously, so a
# withdrawn image stops the heartbeat — which is how that reaches pull requests
# without a registry call on every one of them.
#
# 🔴 THIS WORKFLOW DOES NOT OPEN A PULL REQUEST, AND THAT IS DELIBERATE
# (Derek, 2026-09-04). It pushes the bump to a branch and stops.
#
# It could not open one even if we wanted it to: the repository has
# `can_approve_pull_request_reviews: false`, which is the flag behind GitHub's
# combined "Allow GitHub Actions to create and approve pull requests" setting,
# so `gh pr create` fails with `GitHub Actions is not permitted to create or
# approve pull requests`. Enabling it would also let any workflow here APPROVE
# a pull request, which on a protected branch is the half that matters.
#
# Nor does it open an issue. The signal lives where someone is already looking:
# `hack/check-ko-base-pin.sh` runs on every pull request and reports that a bump
# is waiting on this branch, turning red once one has waited too long. That
# grants Actions nothing, cannot spam, and gives the bump a deadline — which the
# liveness window on its own never did.
#
# ⚠️ A pull request opened from this branch BY A PERSON carries full CI, which a
# GITHUB_TOKEN-opened one would not have. The smoke build below is still run
# before the push, because a base that cannot build must never be proposed.

name: ko base image

on:
  schedule:
    # Wednesday, deliberately not Monday: Dependabot's four ecosystems all land
    # then, and a bump PR that arrives in the middle of that batch is the one
    # that gets skimmed.
    - cron: '17 6 * * 3'
  workflow_dispatch:

# Least privilege: the job reads the repo and, only when the digest moved, needs
# to push a branch and open a pull request.
permissions:
  contents: read

concurrency:
  group: ko-base-image
  cancel-in-progress: false

env:
  KO_FILE: .ko.yaml
  OBJECT_STORE_MODULE: deploy/opentofu/modules/object-store/main.tf
  BRANCH: ci/ko-base-image

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open/refresh the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve each pin's tag to its current digest
        id: resolve
        run: |
          set -euo pipefail

          # resolve PINNED -> the digest the pin's TAG names today. The tag is
          # kept in each file next to the digest precisely so this step has
          # something to resolve; ko and the kubelet only use the digest.
          resolve() {
            local pinned="$1" ref repo tag path host token new
            ref="${pinned%@*}"          # cgr.dev/chainguard/static:latest
            repo="${ref%:*}"            # cgr.dev/chainguard/static
            tag="${ref##*:}"            # latest
            path="${repo#*/}"           # chainguard/static
            host="${repo%%/*}"          # cgr.dev

            # Resolved through the registry API rather than a third-party
            # action: this workflow exists to harden the supply chain, so it
            # should not add a new action to it. curl and jq are both on
            # ubuntu-latest.
            token="$(curl -fsS "https://${host}/token?scope=repository:${path}:pull&service=${host}" | jq -r '.token // empty')"
            if [ -z "$token" ]; then
              echo "::error::could not obtain an anonymous pull token for ${repo}" >&2; return 1
            fi

            # The DIGEST OF THE INDEX, which is what a multi-arch pin must be —
            # ask for the index media types explicitly, or a registry may hand
            # back a single-platform manifest and we would pin amd64 for
            # everyone.
            new="$(curl -fsS -o /dev/null -D - \
                     -H "Authorization: Bearer ${token}" \
                     -H 'Accept: application/vnd.oci.image.index.v1+json' \
                     -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                     "https://${host}/v2/${path}/manifests/${tag}" \
                   | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2; exit}')"

            case "$new" in
              sha256:[0-9a-f]*) printf '%s\n' "$new" ;;
              *) echo "::error::did not get a digest for ${ref} (got '${new}')" >&2; return 1 ;;
            esac
          }

          # report NAME PINNED NEW -> the step outputs for one pin.
          report() {
            local name="$1" pinned="$2" new="$3" old changed
            old="${pinned##*@}"
            if [ "$old" = "$new" ]; then
              changed=false
              echo "${name} is current: ${pinned%@*}@${new}"
            else
              changed=true
              echo "${name} moved:"
              echo "  from ${old}"
              echo "  to   ${new}"
            fi
            {
              echo "${name}_ref=${pinned%@*}"
              echo "${name}_old=$old"
              echo "${name}_new=$new"
              echo "${name}_changed=$changed"
            } >> "$GITHUB_OUTPUT"
          }

          # The base image, read from its one line of .ko.yaml by the ONE
          # shell reader of it (check-ko-base-pin and the pull check use it too).
          . hack/lib/ko-base-image.sh
          ko="$(ko_base_image_from "$KO_FILE")"
          if [ -z "$ko" ]; then
            echo "::error::no defaultBaseImage in $KO_FILE"; exit 1
          fi

          # The object store's image, read by the ONE shell reader of that
          # default (dr-rig and the pull check use it too), and refused unless
          # it is a digest pin: a malformed read must not be "resolved".
          . hack/lib/object-store-image.sh
          os="$(object_store_image_from "$OBJECT_STORE_MODULE")"
          if ! [[ "$os" =~ $OBJECT_STORE_IMAGE_PATTERN ]]; then
            echo "::error::could not read a digest-pinned image from $OBJECT_STORE_MODULE (read '$os')"; exit 1
          fi

          # Assignments, not `report ko "$ko" "$(resolve "$ko")"`: a failing
          # substitution inside an ARGUMENT does not trip `set -e`, so a
          # registry error would reach report() as an empty digest, read as
          # "moved", and be written into the file. As an assignment it stops
          # the step.
          ko_new="$(resolve "$ko")"
          os_new="$(resolve "$os")"
          report ko "$ko" "$ko_new"
          report objectstore "$os" "$os_new"

      # Only the REWRITE and the pull request are conditional. The toolchain
      # setup and the smoke-build below run every week whether or not the digest
      # moved, and that is a correction rather than a preference.
      #
      # 🔴 The heartbeat used to measure nothing. `check-ko-base-pin.sh` reads
      # "this workflow succeeded recently" as proof the pin is being maintained
      # — but when `changed=false` every expensive step was skipped, so a green
      # run said only that the resolve step could reach the registry. The
      # 2026-08-06 and 2026-08-12 runs are both green and both skipped the build.
      # The smoke-build had in fact NEVER passed: this workflow was written on
      # 2026-08-06 already unable to build (the workspace floor had moved to
      # 1.26.5 on 2026-07-13), and that only became visible on 2026-08-19, the
      # first week a digest moved and the step actually ran.
      #
      # Building unconditionally costs about a minute a week and makes a green
      # run mean the thing the guard is reading it as: the current pin builds.
      - name: Apply the new base-image digest
        if: steps.resolve.outputs.ko_changed == 'true'
        run: |
          set -euo pipefail
          old='${{ steps.resolve.outputs.ko_old }}'
          new='${{ steps.resolve.outputs.ko_new }}'
          # Rewrite only the defaultBaseImage line, so the surrounding rationale
          # comments (which are the reason anyone can follow this design later)
          # survive untouched.
          awk -v old="$old" -v new="$new" '
            /^defaultBaseImage:/ { sub(old, new) } { print }' "$KO_FILE" > "$KO_FILE.tmp"
          mv "$KO_FILE.tmp" "$KO_FILE"
          grep -q "$new" "$KO_FILE" || { echo "::error::rewrite did not take"; exit 1; }
          git diff --stat

      - name: Apply the new object-store digest
        if: steps.resolve.outputs.objectstore_changed == 'true'
        run: |
          set -euo pipefail
          old='${{ steps.resolve.outputs.objectstore_old }}'
          new='${{ steps.resolve.outputs.objectstore_new }}'
          ref='${{ steps.resolve.outputs.objectstore_ref }}'
          # Rewrite only the default line inside `variable "image"`, so the
          # rationale in its description survives untouched. The variable
          # deliberately states no MinIO version — `docker run --rm <ref>
          # --version` names it — so there is no second line to keep in step.
          awk -v old="$old" -v new="$new" '
            /^variable "image" \{/          { in_var = 1 }
            in_var && /^\}/                 { in_var = 0 }
            in_var && /^[ \t]*default[ \t]*=/ { sub(old, new) }
            { print }' "$OBJECT_STORE_MODULE" > "$OBJECT_STORE_MODULE.tmp"
          mv "$OBJECT_STORE_MODULE.tmp" "$OBJECT_STORE_MODULE"
          # Read back through the same reader everything else uses.
          . hack/lib/object-store-image.sh
          got="$(object_store_image_from "$OBJECT_STORE_MODULE")"
          [ "$got" = "${ref}@${new}" ] || { echo "::error::rewrite did not take (read '$got')"; exit 1; }
          git diff --stat

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go.work, NOT a module's go.mod. setup-go pins GOTOOLCHAIN=local, so
          # the version installed here is the only one available — and a module
          # go.mod carries the LANGUAGE version its own code needs, which is a
          # floor, not the workspace's. `backend/core/go.mod` says 1.26.0 while
          # go.work requires >= 1.26.6, and `go build` inside a workspace obeys
          # go.work. That drift broke this workflow silently for three weeks.
          go-version-file: go.work
          cache: false

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      # Runs every week, not only when the digest moves — see the note above the
      # rewrite step. When nothing moved this builds the CURRENT pin, which is
      # exactly the claim the liveness guard is making on this workflow's behalf.
      - name: Smoke-build an image against the base
        env:
          KO_DOCKER_REPO: ghcr.io/devicechain-io
        run: |
          set -euo pipefail
          # One representative service, DERIVED rather than named, so this does
          # not rot when the service list changes.
          svc="$(hack/list-services.sh | jq -r '.[0]')"
          if [ -z "$svc" ] || [ "$svc" = "null" ]; then
            echo "::error::no services discovered — cannot smoke-build the new base"
            exit 1
          fi
          echo "smoke-building backend/services/${svc} on ${KO_FILE}'s current base"
          cd "backend/services/${svc}"
          # This is the PR's only evidence — see the GITHUB_TOKEN note at the top
          # of this file. A base that cannot build must never be proposed.
          ko build --local --bare ./

      # Runs every week, like the smoke-build above: the object store's image
      # — the current pin, or the one just written — must start and name its
      # version. Its entrypoint is the minio binary, so `--version` is a real
      # execution of it, on the runner's architecture, from the pinned index.
      #
      # 🔴 `--version` is not all the platform asks of this image. The
      # create-buckets init container runs `/bin/sh -c 'mkdir -p ...'` as uid
      # 1000, and hack/dr-rig.sh probes readiness with bash's /dev/tcp because
      # the image has no curl. A rebuild without a shell would pass `--version`,
      # be pushed as smoke-tested, and break every fresh install's init
      # container, so both are run here too. (Measured against a shell-less
      # image, cgr.dev/chainguard/static: the first check refuses it.)
      - name: Smoke-run the object-store image
        run: |
          set -euo pipefail
          . hack/lib/object-store-image.sh
          ref="$(object_store_image_from "$OBJECT_STORE_MODULE")"
          [[ "$ref" =~ $OBJECT_STORE_IMAGE_PATTERN ]] || { echo "::error::no digest pin in $OBJECT_STORE_MODULE"; exit 1; }
          docker run --rm "$ref" --version | tee "${RUNNER_TEMP}/minio-version.txt"
          grep -q '^minio version RELEASE\.' "${RUNNER_TEMP}/minio-version.txt" ||
            { echo "::error::${ref} did not report a MinIO release"; exit 1; }
          # The init container: /bin/sh and mkdir, as uid 1000.
          docker run --rm --user 1000 --entrypoint /bin/sh "$ref" \
            -c 'mkdir -p /tmp/smoke/bucket && test -d /tmp/smoke/bucket' ||
            { echo "::error::${ref} cannot run the init container's /bin/sh + mkdir as uid 1000"; exit 1; }
          # dr-rig's readiness probe: bash's /dev/tcp, an unsigned S3 request,
          # and the 403 a ready server answers it with.
          status="$(docker run --rm --user 1000 --entrypoint bash "$ref" -c '
            minio server /tmp/data --address 127.0.0.1:9000 >/dev/null 2>&1 &
            for _ in {1..30}; do
              if (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; then
                exec 3<>/dev/tcp/127.0.0.1/9000
                printf "GET / HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3
                IFS=" " read -r -t 5 _ status _ <&3 && printf %s "$status"
                exit 0
              fi
              sleep 1
            done' || true)"
          [ "$status" = "403" ] ||
            { echo "::error::${ref} did not answer bash's /dev/tcp probe with 403 (got '${status}')"; exit 1; }

      - name: Push the bump to its branch
        if: steps.resolve.outputs.ko_changed == 'true' || steps.resolve.outputs.objectstore_changed == 'true'
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # A fixed branch, force-pushed: successive weeks refresh ONE branch
          # rather than stacking a new one every time an image moves. Both
          # pins ride it, so taking the branch takes both.
          git checkout -B "$BRANCH"
          git add "$KO_FILE" "$OBJECT_STORE_MODULE"

          # One line per pin that moved, for the message and the summary.
          moved=""
          if [ '${{ steps.resolve.outputs.ko_changed }}' = true ]; then
            moved+="- ${{ steps.resolve.outputs.ko_ref }} (.ko.yaml, the base of every published image)"$'\n'
            moved+="    from ${{ steps.resolve.outputs.ko_old }}"$'\n'
            moved+="    to   ${{ steps.resolve.outputs.ko_new }}"$'\n'
          fi
          if [ '${{ steps.resolve.outputs.objectstore_changed }}' = true ]; then
            moved+="- ${{ steps.resolve.outputs.objectstore_ref }} (the in-cluster backup store)"$'\n'
            moved+="    from ${{ steps.resolve.outputs.objectstore_old }}"$'\n'
            moved+="    to   ${{ steps.resolve.outputs.objectstore_new }}"$'\n'
          fi
          version="$(head -n 1 "${RUNNER_TEMP}/minio-version.txt")"

          # Heredocs, not `-m "…"`: every line here has to stay indented inside
          # the YAML block scalar, and a message written inline drifts back to
          # column 0 and silently breaks the workflow's own parse.
          cat >"${RUNNER_TEMP}/commit.txt" <<EOF
          chore(ci): bump the pinned Chainguard images

          EOF
          # Strip the YAML-level indentation the heredoc had to carry.
          sed -i 's/^          //' "${RUNNER_TEMP}/commit.txt"
          printf '%s\n' "$moved" >>"${RUNNER_TEMP}/commit.txt"
          cat >>"${RUNNER_TEMP}/commit.txt" <<EOF
          Pushed automatically by .github/workflows/ko-base-image.yml. Chainguard's
          rebuilds are how these images ship their CVE fixes - a pin nobody
          advances is worse than the mutable tag it replaced.

          Smoke-built against the base, and the object store started as
          "${version}", by ${run_url} before this was pushed.
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/commit.txt"
          git commit -F "${RUNNER_TEMP}/commit.txt"

          # 🔴 THE LEASE NEEDS A VALUE, and a bare `--force-with-lease` had none.
          # actions/checkout fetches only the triggering ref, so there is no
          # remote-tracking ref for this branch, and once the branch exists git
          # refuses the push as "(stale info)" — the 2026-09-23 run built and
          # smoke-tested its bump and then failed here with exactly that, so
          # the bump never reached the branch. Fetch the branch's tip and lease
          # on exactly that — or on "absent" when there is no branch yet — so a
          # human push to it in between is still refused rather than
          # overwritten.
          if git fetch --quiet --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            lease="${BRANCH}:$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          else
            lease="${BRANCH}:"
          fi
          git push --force-with-lease="$lease" origin "$BRANCH"

          {
            echo "### Pinned image bump pushed"
            echo
            echo '```'
            printf '%s' "$moved"
            echo '```'
            echo
            echo "Smoke-tested and pushed to \`${BRANCH}\`."
            echo "**Open a pull request from that branch to take it.**"
            echo
            echo "This workflow deliberately does not open one itself — see the note"
            echo "at the top of \`.github/workflows/ko-base-image.yml\`. Every pull"
            echo "request's \`ko base image is pinned\` check reports that a bump is"
            echo "waiting, and turns red once one has been waiting too long."
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 LAST, and it must pass for the run to succeed, because that success
      # is the heartbeat. A digest makes a pull reproducible, not permanent: the
      # object store's previous pin was withdrawn from its registry, and every
      # fresh install failed while clusters that had it cached looked fine. This
      # asks every registry anonymously, over the tree as it stands after any
      # rewrite above. It runs AFTER the push so that an unrelated image going
      # missing does not also hold back a bump; the run is red either way.
      # The self-test runs first: a check whose controls do not hold would
      # report a clean week it never saw.
      - name: Every digest-pinned image pulls anonymously
        run: |
          set -euo pipefail
          hack/check-image-pulls.sh --self-test
          hack/check-image-pulls.sh
