apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dc-executor
rules:
- apiGroups: [core.devicechain.io]
  resources: [instances, executorenrollments, instanceoperations]
  verbs: [get, list, watch]
- apiGroups: [core.devicechain.io]
  resources: [executorenrollments/status, instanceoperations/status]
  verbs: [get, update, patch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dc-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dc-executor
subjects:
- kind: ServiceAccount
  name: dc-executor
  namespace: dc-executor-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dc-executor
  namespace: dc-executor-system
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dc-executor
  namespace: dc-executor-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dc-executor
subjects:
- kind: ServiceAccount
  name: dc-executor
  namespace: dc-executor-system
