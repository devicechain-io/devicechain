#
# Rehearse the release manifest publish against a STAGING branch of the website repository.
#
# The release workflow's publish-manifest job runs hack/publish-release-manifest.sh against
# the website's main and polls https://devicechain.io/releases.json. That path only runs on a
# stable tag, so it is the last thing anyone gets to test and the first thing to fail. This
# workflow runs the SAME script with the branch and the verify URL as inputs, so a change to
# the website layout, the build or the script can be proven end to end before a release needs it.
#
# HOW TO RUN IT (branch deploys are off, so the verify URL is a PR deploy preview):
#   1. Push a staging branch of the website repo. To rehearse the NEW layout, branch from the
#      Astro cutover branch; to rehearse the legacy layout, branch from main.
#   2. Open a DRAFT pull request from that branch to main. Netlify builds a deploy preview for it.
#   3. gh workflow run publish-manifest-rehearsal.yml -R devicechain-io/devicechain
#        -f tag=<current stable tag> -f website_branch=<staging branch>
#        -f verify_url=https://deploy-preview-<PR number>--device-chain.netlify.app/releases.json
#      (one command; wrapped here for width)
#      The push to the branch triggers the preview rebuild; the script polls until the preview
#      serves the tag. Close the draft PR and delete the branch afterwards.
#
# This workflow never calls the Netlify build hook (BUILD_HOOK is deliberately not set): the hook
# rebuilds main, which is not what is being rehearsed. The script refuses a tag older than the one
# the branch already carries, so rehearse with the current stable tag. website_branch has no
# default and is refused if it is main.
name: publish-manifest-rehearsal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing STABLE release tag (vX.Y.Z) whose manifest to publish
        required: true
      website_branch:
        description: Branch of devicechain-io/website to push to (must exist; never main)
        required: true
      verify_url:
        description: URL that must report the tag after the push (the branch deploy or preview releases.json)
        required: true

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Stable tags only
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$TAG is not a stable vX.Y.Z tag"; exit 1; }
      - name: Build the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          RELEASED_AT="$(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          export RELEASED_AT
          # The highlights belong to the release being rehearsed, not to the branch this was
          # dispatched from: the builder requires the file's version to equal the tag, so a
          # rehearsal of any tag but the one main names would otherwise fail.
          HIGHLIGHTS_FILE="$RUNNER_TEMP/release-highlights.json"
          git show "refs/tags/$TAG:.github/release-highlights.json" > "$HIGHLIGHTS_FILE"
          export HIGHLIGHTS_FILE
          hack/build-release-manifest.sh "$TAG" releases.json
          jq . releases.json
      - name: Publish to the staging branch and confirm it is served
        env:
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          WEBSITE_BRANCH: ${{ inputs.website_branch }}
          VERIFY_URL: ${{ inputs.verify_url }}
          TAG: ${{ inputs.tag }}
        run: |
          [ "$WEBSITE_BRANCH" != main ] || { echo "::error::a rehearsal never targets main"; exit 1; }
          [ -n "$DEPLOY_KEY" ] || { echo "::error::WEBSITE_DEPLOY_KEY is not set"; exit 1; }
          hack/publish-release-manifest.sh "$TAG" releases.json
