# AGENT_PROPOSAL is reserved for the later agent rule-changeset slice. Do not
# expose it yet; adding it when that slice ships must remain an additive change.
"""The door through which a rule draft was saved. The door is declared by the client that saves the rule, so it is advisory origin metadata, not proof of how the content was produced and not proof of human review. Recorded doors are only ever added to, so a later save through another door never removes one, DESCRIBE included."""
enum AuthoredVia {
    """Saved from the console's rule form."""
    FORM
    """Saved from the console's visual automation canvas."""
    CANVAS
    """Drafted through the natural-language Describe door, which uses AI assistance, and then saved."""
    DESCRIBE
    """Saved by dcctl product apply from a product bundle."""
    PRODUCT_AS_CODE
    """Saved through the API by a client that declared no door. This is the default."""
    API
    """Saved before doors were recorded, so the door is not known."""
    UNKNOWN
}

"""
A detection rule declared on a device profile. The rule body, definition, is an opaque JSON
document: device-management stores it with the profile's draft but does not interpret the detection
language. It is compiled and cost-checked by the detection engine when the profile is published, and
a rule takes effect on devices only through a published profile version. Edge-triggered rules raise
and resolve alarms; an operator acknowledges and clears the alarms through the alarm mutations.
"""
type DetectionRule implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string. Address a rule by its token instead where you can."""
    id: ID!
    """When the rule was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the rule was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: a deleted rule is removed outright and is not returned."""
    deletedAt: String
    """Identifier of the rule, unique within the tenant. It cannot be changed after creation."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """The device profile the rule is declared on."""
    deviceProfile: DeviceProfile!
    """
    The authored rule as a JSON document in the detection engine's rule language. Stored as written
    once it parses as JSON; the engine validates its type and cost when the profile is published.
    """
    definition: String!
    """
    The visual automation canvas document the rule was authored with, as JSON, so the console can
    reopen it on the canvas. Null for a rule authored as a form. Authoring metadata only: it is
    stored verbatim, never interpreted by the platform, and not part of what a profile publish
    freezes.
    """
    authoringGraph: String
    """Sorted set of all recorded save doors. Saves accumulate doors, so editing through FORM never hides DESCRIBE. Legacy NULLs read UNKNOWN."""
    authoredVia: [AuthoredVia!]!
    """
    Whether the rule is live. A disabled rule is kept on the profile but is left out of the rules a
    published version runs.
    """
    enabled: Boolean!
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    """
    Token of the dynamic entity group that scopes the rule, or null for a rule that applies to every
    device of the profile. Set together with entityGroupVersion: the engine fires the rule only for
    events whose entity is a member of that published group version.
    """
    entityGroupToken: String
    """
    Published version of the entity group that scopes the rule. Null exactly when entityGroupToken
    is null.
    """
    entityGroupVersion: Int
}

"""
Data required to create a detection rule on a device profile. The definition is checked to be well-
