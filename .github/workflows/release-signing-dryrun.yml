#
# Release signing DRY RUN: exercise the signing + verification path BEFORE a tag.
#
# The `sign` and `verify-signatures` jobs in release.yml only ever run on a version tag, and
# every release-time-only step has cost a release candidate its first run (see the release
# plumbing checklist). This workflow runs the SAME scripts -- hack/sign-release-image.sh and
# hack/verify-release-signatures.sh -- against a throwaway registry that lives and dies with
# the job, so a change to either, or to this wiring, is proven on the pull request that makes
# it.
#
# WHAT IT DOES NOT TOUCH. Nothing is pushed to ghcr and nothing is published: the images are a
# copy of an already-pinned public image pushed to a `registry` SERVICE CONTAINER on
# localhost, so there is no scratch tag to clean up and no way for this to move `latest`.
# The signatures are real (a Fulcio certificate and a Rekor entry for this workflow's own
# identity), which is what makes the proof worth having.
#
# WHAT IT PROVES, each with a control that must FAIL:
#   - sign -> verify round-trips for an image (signature + SBOM attestation + provenance) and
#     for a chart (signature + provenance);
#   - the verifier binds IDENTITY: this run's artifacts are signed by THIS workflow, so
#     verifying them as release.yml's output must be rejected;
#   - the verifier rejects an unsigned/foreign image (hack/verify-release-signatures.sh's own
#     negative controls run inside the verification below);
#   - the signer refuses a tag reference (it signs by digest only).
#
# Fork pull requests cannot mint an OIDC token, so they skip the job (signing would fail for a
# reason that says nothing about the change).

name: release-signing-dryrun

on:
  pull_request:
    paths:
      - 'hack/sign-release-image.sh'
      - 'hack/verify-release-signatures.sh'
      - '.github/workflows/release-signing-dryrun.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-signing-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dryrun:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # Sigstore keyless signing identity
      attestations: write # record the provenance attestation
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      REG: localhost:5000/dryrun
      TAG: v0.0.0-dryrun
      # The image copied into the throwaway registry: pinned like every other image here, and
      # an Alpine image so syft has real packages to list.
      BASE: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.6

      - name: Verifier self-test
        run: hack/verify-release-signatures.sh --self-test

      - name: Push a stand-in image, a foreign image and a chart to the throwaway registry
        id: push
        run: |
          set -euo pipefail
          docker pull "$BASE"
          for n in svc-a foreign; do
            docker tag "$BASE" "$REG/$n:$TAG"
            docker push "$REG/$n:$TAG" | tee "push-$n.log"
          done
          digest_of() { sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "$1" | tail -n1; }
          echo "image_digest=$(digest_of push-svc-a.log)" >> "$GITHUB_OUTPUT"

          helm package deploy/helm/devicechain --version "${TAG#v}" --app-version "$TAG"
          helm push "devicechain-${TAG#v}.tgz" "oci://$REG/charts" --plain-http 2>&1 | tee push-chart.log
          echo "chart_digest=$(sed -n 's/^Digest: *\(sha256:[0-9a-f]\{64\}\).*/\1/p' push-chart.log | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: The signer refuses a tag reference (control)
        run: |
          if hack/sign-release-image.sh "$REG/svc-a:$TAG"; then
            echo "::error::the signer accepted a tag reference; it must sign by digest only"
            exit 1
          fi
          echo "refused, as it must"

      - name: Sign the image (signature + SBOM) and the chart (signature)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          CHART_DIGEST: ${{ steps.push.outputs.chart_digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST" && test -n "$CHART_DIGEST"
          hack/sign-release-image.sh "$REG/svc-a@$IMAGE_DIGEST"
          hack/sign-release-image.sh "$REG/charts/devicechain@$CHART_DIGEST" --no-sbom

      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/svc-a
          subject-digest: ${{ steps.push.outputs.image_digest }}
          push-to-registry: false

      - name: Attest build provenance (chart)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/charts/devicechain
          subject-digest: ${{ steps.push.outputs.chart_digest }}
          push-to-registry: false

      # The real verifier, the same script a user runs, with its two negative controls.
      # Provenance is checked below instead: `gh attestation verify oci://` talks https to the
      # registry, and this one is plain http on localhost.
      - name: Verify with hack/verify-release-signatures.sh (negative controls included)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          hack/verify-release-signatures.sh "$TAG" \
            --registry "$REG" --image svc-a --with-chart \
            --repo "$GITHUB_REPOSITORY" --workflow release-signing-dryrun.yml \
            --identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY//./\\.}/\\.github/workflows/release-signing-dryrun\\.yml@refs/(pull/[0-9]+/merge|heads/.+)\$" \
            --foreign-image "$REG/foreign:$TAG" \
            --skip-provenance

      # Identity binding, proven the way that matters: these artifacts WERE signed, by this
      # workflow, and the verifier -- told to demand release.yml's identity for this tag --
      # must refuse them. A workflow other than release.yml cannot produce a release.
      - name: Signed by another workflow is not a release (control)
        run: |
          set -uo pipefail
          out="$(hack/verify-release-signatures.sh "$TAG" --registry "$REG" --image svc-a \
            --repo "$GITHUB_REPOSITORY" --skip-provenance 2>&1)"
          rc=$?
          echo "$out" | tail -15
          if [ "$rc" -eq 0 ]; then
            echo "::error::an image signed by release-signing-dryrun.yml verified as release.yml's output"
            exit 1
          fi
          echo "$out" | grep -q "svc-a  signature" || { echo "::error::it failed, but not at the signature check"; exit 1; }
          echo "rejected, as it must be"

      - name: Verify provenance against the attestation store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          CHART_DIGEST: ${{ steps.push.outputs.chart_digest }}
        run: |
          set -euo pipefail
          # A manifest's digest IS the sha256 of its bytes, so fetching it back and handing
          # `gh` the file verifies the attestation for exactly that digest.
          accept='application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          check() { # <repo-path> <digest>
            curl -fsS -H "Accept: $accept" "http://localhost:5000/v2/dryrun/$1/manifests/$2" -o manifest.json
            [ "sha256:$(sha256sum manifest.json | cut -d' ' -f1)" = "$2" ] || { echo "::error::fetched manifest does not hash to $2"; exit 1; }
            gh attestation verify manifest.json --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-signing-dryrun.yml"
            # ...and the wrong workflow must not satisfy it.
            if gh attestation verify manifest.json --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null 2>&1; then
              echo "::error::provenance verified under release.yml's identity; it must not"
              exit 1
            fi
          }
          check svc-a "$IMAGE_DIGEST"
          check charts/devicechain "$CHART_DIGEST"
