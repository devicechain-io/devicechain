{{/*
Alerting rules for bulk changes.

The series are registered only by a build that serves bulk changes, so on any other build
every expression here evaluates an empty vector and nothing fires.

The gauges (operations, holds, the ages and lags, activated) are instance-wide aggregates
that every device-management replica computes from the database, so each rule reads them
with max() (min() for activated): one replica's stale or failed refresh cannot mask the
others. Driver silence is judged on the NEWEST pass any pod reports.

"Not advancing" is measured from the last applied line (or the start or resume), not from
when a line became due: a paced operation applying lines steadily stays young however many
lines it has left. A line that keeps failing retryably, rate sharing and a busy device are
not holds, so they age; the blocking holds (authority, activation, a pending control) are
excluded here and have their own alerts.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bulk-changes
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.bulk-changes
      rules:
        - alert: BulkChangesNotAdvancing
          expr: max(devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="{{ $ns }}"}) > 300
          for: 1m
          labels:
            severity: warning
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesnotadvancing"
            summary: "Bulk changes are not advancing"
            description: "A running bulk change with lines still to apply has gone more than five minutes without applying one, and no authority, activation or pending-control hold explains it. Read the bulk change's executor, holdCode and lastErrorCode. STALLED with POST_ERROR means a line keeps failing in a way that is retried (database contention, a timeout, a lost connection), and the bulk change pauses itself after 24 hours of that; a device held by another writer or a shared posting rate shows no hold. Look in the device-management logs for the error, and pause the bulk change if the cause will not clear soon."
        - alert: BulkChangesStalled
          expr: max(devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="{{ $ns }}"}) > 900
          for: 1m
          labels:
            severity: critical
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesstalled"
            summary: "Bulk changes have stalled"
            description: "A running bulk change with lines still to apply has gone more than fifteen minutes without applying one, and no authority, activation or pending-control hold explains it. Its executor reads STALLED. Read lastErrorCode and the device-management logs for why each attempt fails, fix the dependency, and pause the bulk change if it cannot be fixed now. Settling applied lines against device reports is separate and has its own deadline."
        - alert: BulkChangesDriverSilent
          expr: (max(devicechain_devicemanagement_bulk_change_operations{namespace="{{ $ns }}",dispatch="RUNNING"}) > 0) and (time() - max(devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="{{ $ns }}"}) > 60)
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesdriversilent"
            summary: "Bulk change drivers are silent"
            description: "Running bulk changes exist and no device-management pod has completed a bulk change driver pass in the last sixty seconds, for two minutes; their executor reads UNKNOWN. Check that the device-management pods are running and ready, and look in their logs for driver errors or database connection failures. Nothing is applied while the driver is silent, and lines continue where they stopped once a pod completes a pass."
        - alert: BulkChangesAuthorityUnavailable
          expr: max(devicechain_devicemanagement_bulk_change_holds{namespace="{{ $ns }}",code="AUTHORITY_UNAVAILABLE"}) > 0
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesauthorityunavailable"
            summary: "Bulk change authority checks are unavailable"
            description: "A running bulk change has been held for five minutes because device-management cannot get a fresh answer from user-management on whether the person it runs for still holds the authority to apply it. Nothing is applied while it is held, and it is not paused. Check that user-management is running and reachable from device-management, and read its logs. Posting resumes on the first fresh answer; there is no way around the check."
        - alert: BulkChangesSettlementLagging
          expr: (max(devicechain_devicemanagement_bulk_change_deadline_lag_seconds{namespace="{{ $ns }}"}) > 900) or (max(devicechain_devicemanagement_bulk_change_reconciler_lag_seconds{namespace="{{ $ns }}"}) > 900)
          for: 1m
          labels:
            severity: warning
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangessettlementlagging"
            summary: "Bulk change settlement is lagging"
            description: "An applied bulk change line is more than fifteen minutes past its settlement deadline, or a device report that could settle one has waited more than fifteen minutes. Check the device-management logs for settlement task errors and the database for load. Applied lines are not lost while this lags; they settle once the tasks catch up. An applied line is not proof that the device took the change, so read its evidence before resolving it by hand."
        - alert: BulkChangesFencePending
          expr: sum(rate(devicechain_devicemanagement_bulk_change_fence_pending_total{namespace="{{ $ns }}"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesfencepending"
            summary: "Bulk change controls keep waiting for posts"
            description: "For ten minutes, pause, abort, resume or start requests have kept timing out (FENCE_PENDING) while waiting for in-flight posting to finish. Look for long-running posting transactions and lock waits in the database. Retry the request once the in-flight work drains and confirm the dispatch state afterwards: a FENCE_PENDING answer means the change did not happen."
        - alert: BulkChangesNotActivated
          expr: min(devicechain_devicemanagement_bulk_change_activated{namespace="{{ $ns }}"}) == 0
          for: 15m
          labels:
            severity: critical
            devicechain_instance: {{ .Values.instance.id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesnotactivated"
            summary: "Bulk changes are not activated"
            description: "For fifteen minutes the database has not enforced the device attribute writer protocol that bulk changes post under, or its state could not be read. Starting and resuming are refused and running bulk changes hold (NOT_ACTIVATED). Check that device-management's database migrations completed and that the enforcing trigger on the device attribute table is installed and enabled. Do not turn enforcement off to let posting proceed."
{{- end }}
