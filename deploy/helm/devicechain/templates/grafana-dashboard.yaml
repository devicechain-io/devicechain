{{/*
Grafana operations dashboards, one ConfigMap per file in dashboards/*.json.
Each is labeled grafana_dashboard: "1" so the Grafana sidecar (kube-prometheus-stack)
auto-imports it — the same operator-based assumption the ServiceMonitor already makes.
Skipped when metrics are off or dashboards are opted out (clusters with the Prometheus
Operator but no Grafana sidecar).

🔴 EVERY INSTANCE SHIPS ITS OWN COPY OF EVERY BOARD, AND THE COPY IS SCOPED BY
CONSTRUCTION, NOT BY A PICKER. The sidecar is cluster-wide (searchNamespace ALL) and
writes every labeled ConfigMap's data keys into ONE directory, and Grafana holds one
board per uid. Before this template rendered per-instance values, every instance's
ConfigMap carried the same data key (`event-processing.json`), uid and title, so two
instances on a cluster were one file and one board. Measured on kind: deleting one
instance's ConfigMap made the sidecar delete the shared file, and the SURVIVING
instance's board returned 404 until the sidecar's next watch restart (a fixed ~60s cycle;
3s–20s of 404 observed), then came back as a NEW Grafana object (new numeric id,
`created` reset). Grafana never logged a duplicate uid. The instance picker the boards
used to carry could not help — it scoped the queries of a board that was not there.

So each ConfigMap now differs per instance in these places, and nowhere else:

  - the DATA KEY, `{instance}-<file>.json`. This is the file name the sidecar writes, so
    it is what keeps two instances' files apart. The sidecar's UNIQUE_FILENAMES option
    would do the same on the cluster side, but only on a cluster configured for it; a
    distinct key is distinct on any sidecar.
  - the `grafana_folder` ANNOTATION, `devicechain-{instance}`. A sidecar started with
    FOLDER_ANNOTATION=grafana_folder writes the file into that subdirectory, and a
    provider with foldersFromFilesStructure turns the subdirectory into a Grafana folder
    — one folder per instance (the cluster root's monitoring module sets both). ASCII,
    a fixed prefix plus a DNS label, because it becomes a directory name and a folder
    title. A sidecar without the option ignores it and the boards land flat, still apart.
  - the board `uid`, `dc-` + the first 20 hex characters of
    sha256("{instance}/<file stem>"). Grafana refuses a uid over 40 characters and an
    instance id may be 50 (values.schema.json), so the id cannot be spelled into it; the
    hash is always 23 characters, and 80 bits keeps two instances on one cluster from
    colliding. `/` can occur in neither part, so no two pairs hash the same input. A
    pure function of (instance, file), so a board keeps its uid — and every bookmark to
    it — across upgrades and reinstalls.
  - the `title`, the file's own title with `[{instance}]` appended, so a search across
    folders still says which instance a board reads.
  - the `namespace` and `instance` template variables, below.
  - the token `@dbnamespace@`, replaced in the file text with `metrics.databaseNamespace` (the shared
    database namespace), for boards that show the databases.
  - a per-instance TAG, `dc-` + the first 20 hex characters of sha256("{instance}"), added
    to the board's tags (23 characters; Grafana's tag limit is 50), and one `dashboards`
    LINK that lists every board carrying that tag. A link by tag can only ever offer this
    instance's boards, because no other instance renders the tag.
  - board-to-board references. A board file may write `@board:<file stem>@` anywhere in its
    text (a data link's `/d/@board:ingest@`, a link URL); it is replaced with that board's
    uid FOR THIS INSTANCE, which no file can spell for itself because the uid is a hash of
    the instance. A reference to a board that does not exist fails the render.

The `instance` template variable is REPLACED the same way, with a hidden constant holding
the instance ID, which is what the alert rules stamp on every alert as
`devicechain_instance` -- so a board's "Firing alerts" table
(`ALERTS{devicechain_instance="$instance"}`) lists this instance's alerts and no other's.
The ID and the namespace are different strings (the namespace is `dci-` + the ID), which
is why there are two variables and not one.

The conventions a board file follows (uid and title scheme, the alerts table to copy, units,
rate versus range) are in dashboards/README.md.

The `namespace` template variable is REPLACED with a hidden constant naming the
instance's NAMESPACE — which is not the instance id but the id behind the `dci-`
prefix, the same value metadata.namespace carries below. Every panel
already filters `namespace="$namespace"`, so the queries are untouched and a board can
only ever read its own instance's series. The files on disk carry that entry as an empty
constant; the whole entry is replaced here, so nothing in the file can leave a board
unscoped, and a board with no `namespace` entry fails the render.

🔴 THE CONFIGMAP NAME IS A PUBLISHED INTERFACE, not an implementation detail. It was
`{instance}-event-processing-dashboard` when this template hardcoded one filename, and
`{{ $.Values.instance.id }}-{{ base $path | trimSuffix ".json" }}-dashboard` reproduces
that byte-for-byte for dashboards/event-processing.json. Renaming it would orphan the
old ConfigMap on every existing install — Helm deletes what it no longer renders, but a
sidecar that has already loaded the dashboard, and anyone who pinned the name in their
own tooling, would not follow. The DATA KEY is a second published name — it is the file
the sidecar writes — changed here once, deliberately, from `<file>.json`.
hack/check-dashboards.sh pins both, and renders two instances to prove they stay apart.

🔑 `mustFromJson`, not `fromJson`: Sprig's fromJson answers a parse error with an EMPTY
MAP, which would render an empty board under a valid uid and title. The strict form fails
the render. `toPrettyJson` re-emits the parsed document with sorted keys and with `<`,
`>` and `&` \u-escaped, which is the same JSON. hack/check-dashboards.sh still parses the
files directly, because a board that is valid JSON can still name a series that does not
exist.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboards }}
{{- $id := .Values.instance.id }}
{{/* The namespace, spelled apart from the id and used only where a NAMESPACE is
     meant. $id stays the instance's: the uid hash input, the board title, the
     ConfigMap name, the grafana_folder and the data key are all identifiers of
     the instance, not of where its pods run. The two were the same string until an
     instance's namespace gained a prefix, which is what made spelling them apart
     necessary rather than merely tidy: a board scoped to the bare id renders
     perfectly, carries the right uid, title and folder, and shows nothing at all. */}}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{/* Every board's uid for THIS instance, computed up front so a board can name another
     (@board:<stem>@) without knowing a hash. */}}
{{- $files := .Files.Glob "dashboards/*.json" }}
{{- $uids := dict }}
{{- range $path, $_ := $files }}
{{- $stem := base $path | trimSuffix ".json" }}
{{- $_ := set $uids $stem (printf "dc-%s" (sha256sum (printf "%s/%s" $id $stem) | trunc 20)) }}
{{- end }}
{{/* The tag only this instance's boards carry. */}}
{{- $tag := printf "dc-%s" (sha256sum $id | trunc 20) }}
{{- range $path, $_ := $files }}
{{- $stem := base $path | trimSuffix ".json" }}
{{- $text := $.Files.Get $path }}
{{- range $other, $otherUid := $uids }}
{{- $text = replace (printf "@board:%s@" $other) $otherUid $text }}
{{- end }}
{{/* @dbnamespace@ is the shared database namespace (metrics.databaseNamespace), where the relational
     database and the backup object store live. A board cannot know it, and the instance's own namespace
     holds only its event store, so a board that shows the databases writes
     namespace=~"@dbnamespace@|$namespace". */}}
{{- $text = replace "@dbnamespace@" $.Values.metrics.databaseNamespace $text }}
{{- if contains "@board:" $text }}
{{- fail (printf "dashboard %s references a board that does not exist (an unresolved @board:<name>@). Known boards: %s." $path (keys $uids | sortAlpha | join ", ")) }}
{{- end }}
{{- $board := $text | mustFromJson }}
{{- $_ := set $board "uid" (get $uids $stem) }}
{{- $_ := set $board "title" (printf "%s [%s]" (get $board "title") $id) }}
{{- $scope := dict "text" $ns "value" $ns "selected" true }}
{{- $namespaceVar := dict "type" "constant" "name" "namespace" "label" "Instance" "query" $ns "hide" 2 "current" $scope "options" (list $scope) }}
{{- $instanceVar := dict "type" "constant" "name" "instance" "label" "Instance ID" "query" $id "hide" 2 "current" (dict "text" $id "value" $id "selected" true) "options" (list (dict "text" $id "value" $id "selected" true)) }}
{{- $_ := set $board "tags" (append (get $board "tags" | default list) $tag) }}
{{- $link := dict "type" "dashboards" "title" "DeviceChain boards" "tags" (list $tag) "asDropdown" true "includeVars" true "keepTime" true "icon" "external link" "tooltip" "The boards of this instance" "targetBlank" false "url" "" }}
{{- $_ := set $board "links" (append (get $board "links" | default list) $link) }}
{{- $templating := get $board "templating" | default dict }}
{{- $vars := list }}
{{- $scoped := false }}
{{- $named := false }}
{{- range (get $templating "list" | default list) }}
{{- if eq (get . "name") "namespace" }}
{{- $vars = append $vars $namespaceVar }}
{{- $scoped = true }}
{{- else if eq (get . "name") "instance" }}
{{- $vars = append $vars $instanceVar }}
{{- $named = true }}
{{- else }}
{{- $vars = append $vars . }}
{{- end }}
{{- end }}
{{- if not $scoped }}
{{- fail (printf "dashboard %s has no \"namespace\" template variable. Each board is scoped to its instance by replacing that variable with a constant; without one, its namespace=\"$namespace\" selectors would match nothing." $path) }}
{{- end }}
{{- if not $named }}
{{- fail (printf "dashboard %s has no \"instance\" template variable. Each board's firing-alerts table selects ALERTS by devicechain_instance=\"$instance\"; the variable is replaced here with the instance ID, and without one that selector matches nothing." $path) }}
{{- end }}
{{- $_ := set $templating "list" $vars }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $id }}-{{ $stem }}-dashboard
  namespace: {{ $ns }}
  labels:
    grafana_dashboard: "1"
    {{- include "devicechain.instanceLabels" $ | nindent 4 }}
  annotations:
    grafana_folder: devicechain-{{ $id }}
data:
  {{ $id }}-{{ $stem }}.json: |-
{{ toPrettyJson $board | indent 4 }}
{{- end }}
{{- end }}
