    results: [ProvisioningProfile!]!
    pagination: SearchResultsPagination!
}

# A device's possession claim (ADR-012): a one-time, optionally expiring secret an
# eventual owner presents to assign the device to a customer. The claim secret is
# write-only and is never exposed on this type.
type DeviceClaim implements Model {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    device: Device!
    status: String!
    expiresAt: String
    claimedTime: String
    claimedByCustomer: Customer
}

# Data required to open (or reopen) a device claim.
input DeviceClaimInitiateRequest {
    deviceToken: String!
    claimSecret: String!
    expiresAt: String
}

# Data required to redeem a device claim: the device, the claim secret (proof of
# possession), the customer to assign the device to, and the relationship type for
# the resulting device→customer ownership edge.
input DeviceClaimRequest {
    deviceToken: String!
    claimSecret: String!
    customerToken: String!
    relationshipType: String!
}

# Represents a type or class of assets
type AssetType implements Model & TokenReference & NamedEntity & BrandedEntity & MetadataEntity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    metadata: String
    # The DRAFT property contract for assets of this type: a JSON array of typed
    # field descriptors, in declaration order, or null when the type declares none.
    # It is the same descriptor shape a command definition uses for its parameters.
    # Editing it changes nothing an asset is validated against until the type is
    # published.
    propertySchema: String
    # The published version assets of this type are validated against, or null when
    # the type has never been published. An asset of an unpublished type may carry
    # no properties at all.
    activeVersion: Int
}

# An immutable published snapshot of an asset type's property contract. Assets are
# validated against the type's ACTIVE version, never against its draft, so
# publishing is what makes a contract binding. History is append-only; a rollback
# re-points the active version without deleting anything.
type AssetTypeVersion {
    version: Int!
    label: String
    description: String
    publishedAt: String!
    publishedBy: String
    # The frozen property contract this version publishes, in the same JSON form as
    # AssetType.propertySchema. Unlike a device profile version's snapshot this IS
    # exposed: an author needs to see what a version froze in order to decide whether
    # to roll back to it.
    propertySchema: String!
}

# Data required to create an asset type.
input AssetTypeCreateRequest {
    token: String!
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    metadata: String
    # The draft property contract (see AssetType.propertySchema). Rejected if it is
    # not a JSON array of descriptors, if it carries a key no descriptor declares
    # (so a typo'd "maximum" is refused rather than dropped), or if it declares a
    # contract nothing could satisfy — a duplicate name, an unknown data type, a
    # default outside its own enum.
    propertySchema: String
}

# A PARTIAL update to an asset type: omit a field to leave it alone, send null to
# clear it, send a value to set it. There is no `token` member — the mutation's own
# `token` argument names the row, so a token move is unrepresentable. It used to be
# the payload token that named the row, with the argument ignored, so a request
# whose two tokens disagreed silently updated the one in the payload.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the
# field arrive already-populated for a caller who never sent it, which collapses
# "omitted" back into "sent", and turns this input back into the full replace it
# replaces.
input AssetTypeUpdateRequest {
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    metadata: String
    # Replaces the draft property contract wholesale; null withdraws it. Omit to
    # leave the stored draft alone. It is validated the same way as on create, and a
    # rejection writes nothing at all.
    propertySchema: String
}

# Criteria used when searching for asset types.
input AssetTypeSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
}

# Search results returned from asset types query.
type AssetTypeSearchResults {
    results: [AssetType!]!
    pagination: SearchResultsPagination!
}

# Represents an asset instance
type Asset implements Model & TokenReference & NamedEntity & MetadataEntity & Entity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    name: String
    description: String
    assetType: AssetType!
    metadata: String
    # The asset's property document: a JSON object whose keys are the properties its
    # type's published contract declares. Null when the asset carries none.
    properties: String
}

# Data required to create an asset.
input AssetCreateRequest {
    token: String!
    name: String
    description: String
    assetTypeToken: String!
    metadata: String
    # The asset's property document, validated against the asset type's ACTIVE
    # PUBLISHED contract before anything is written. Refused when the type has no
    # published contract, when a key is not declared, when a value does not fit its
    # declared type/bounds/allowed values, or when a required property is missing —
    # and the refusal is total, so no asset is created.
    properties: String
}

# A PARTIAL update to an asset: omit a field to leave it alone, send null to clear
# it, send a value to set it. There is no `token` member — see AssetTypeUpdateRequest.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the
# field arrive already-populated for a caller who never sent it, which collapses
# "omitted" back into "sent", and turns this input back into the full replace it
# replaces.
input AssetUpdateRequest {
    name: String
    description: String
    # Re-points the asset at a different asset type. Omit to keep the current one.
    # Unlike DeviceTypeUpdateRequest.profileToken, NULL IS REFUSED here: every asset
    # must reference a type, so "no type" is not a state it can be in. An unknown
    # token is refused too, and the refusal is total — nothing is written.
    assetTypeToken: String
    metadata: String
    # Replaces the asset's property document wholesale; null clears it. Omit to keep
    # what is stored — but note that omitting it does NOT skip the check: a retype
    # re-validates the properties the asset already carries against the contract of
    # the type it is moving to, so an asset can never be left describing itself in a
    # vocabulary its type does not declare.
    properties: String
}

# Criteria used when searching for assets.
input AssetSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    assetTypeToken: String
}

# Search results returned from assets query.
type AssetSearchResults {
    results: [Asset!]!
    pagination: SearchResultsPagination!
}

