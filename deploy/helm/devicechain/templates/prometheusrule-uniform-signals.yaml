{{/*
Generic maintenance-task and processor-loop warnings.
Task success is aggregated across replicas: a replica that never wins a distributed
lock must not alert while another replica is completing the work. NaN means no
success yet; only a declared interval and its own old replica make that actionable.
A task that is configured off must not declare an interval.
A task that polls faster than it completes (its idle passes are skipped, which does not count as
success) also declares an expected success interval; the allowance is built from the larger of
that and the polling interval, so a healthy long cooldown is not read as a stall.
Increase reads raw counters before aggregation. Device-state has its own discard warning.
ProcessorLoopDropping copies each loop's metric name into a "metric" label inside a
subquery before increase(), because increase() drops __name__: one service runs several
loops whose *_messages_total series share every other label, and without the copy
Prometheus refuses the evaluation ("vector cannot contain metrics with the same labelset")
and the alert can never fire. hack/check-prometheus-rules.sh (promqlguard) refuses that shape.
The subquery samples every 15s, no slower than the scrape (the ServiceMonitor names no
interval, so the Prometheus default applies, 30s in kube-prometheus-stack). A slower step
can land on neither the seeded zero nor the scrape before the first drop, and miss it.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uniform-signals
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.uniform-signals
      rules:
        - alert: PeriodicTaskStalled
          expr: |
            (
              time() - max by (job, task) (label_replace(
                {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_last_success_timestamp_seconds",namespace="{{ $ns }}"},
                "task", "$1", "__name__", "[^_]+_[^_]+_(.+)_last_success_timestamp_seconds"))
              > 3 * max by (job, task) (label_replace(
                {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_pass_interval_seconds|devicechain_[a-z0-9]+_[a-z0-9_]+_expected_success_interval_seconds",namespace="{{ $ns }}"},
                "task", "$1", "__name__", "[^_]+_[^_]+_(.+)_(?:pass|expected_success)_interval_seconds")) + 300
            )
            or
            (
              (
                max by (job, task) (
                  (3 * max by (job, instance, task) (label_replace(
                  {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_pass_interval_seconds|devicechain_[a-z0-9]+_[a-z0-9_]+_expected_success_interval_seconds",namespace="{{ $ns }}"},
                  "task", "$1", "__name__", "[^_]+_[^_]+_(.+)_(?:pass|expected_success)_interval_seconds")) + 300)
                  < on (job, instance) group_left ()
                  (time() - process_start_time_seconds{namespace="{{ $ns }}"})
                )
              )
              and on (job, task)
              (
                max by (job, task) (label_replace(
                  {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_last_success_timestamp_seconds",namespace="{{ $ns }}"},
                  "task", "$1", "__name__", "[^_]+_[^_]+_(.+)_last_success_timestamp_seconds"))
                !=
                max by (job, task) (label_replace(
                  {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_last_success_timestamp_seconds",namespace="{{ $ns }}"},
                  "task", "$1", "__name__", "[^_]+_[^_]+_(.+)_last_success_timestamp_seconds"))
              )
            )
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#periodictaskstalled"
            summary: "A maintenance task is not completing successful passes"
            description: "No replica of this job and task has succeeded within three declared pass intervals plus five minutes (a task that completes less often than it polls declares its expected success interval, and that longer interval is used), or the task has never succeeded and a replica declaring its interval has been running longer than that allowance. This has persisted for ten minutes. Check the job and task labels, service logs, database and broker health, and distributed lock ownership. A replica that skips a pass because another replica holds the lock is normal; investigate whether any replica is completing the task."
        - alert: ProcessorLoopDropping
          expr: |
            sum by (job) (increase(label_replace(
              {__name__=~"devicechain_[a-z0-9]+_[a-z0-9_]+_messages_total",__name__!="devicechain_devicestate_state_messages_total",result="dropped",namespace="{{ $ns }}"},
              "metric", "$1", "__name__", "(.+)")[15m:15s])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#processorloopdropping"
            summary: "A job has processor loops giving up on messages"
            description: "In the last 15 minutes, processor loops in this job gave up on messages after their delivery attempts were exhausted. To find the loop, query {__name__=~\"devicechain_[a-z0-9]+_[a-z0-9_]+_messages_total\", result=\"dropped\"} restricted to this job. Check the service logs for the failed operation, then its database, broker and downstream dependencies. Policy-refused traffic counted as unwanted does not trigger this alert. Device-state discards are covered separately by DeviceStateDroppingEvents."
{{- end }}
