# The MANIFEST of one fence-set version: which fences it holds, and the content address of
# each one's geometry. It carries no geometry, which is what makes its size a function of the
# fence COUNT alone — so unlike geoFenceSetSnapshot it needs no pagination, at any fence count.
#
# This is how a holder of a version number learns what to resolve: an engine that missed the
# announcement, one starting cold, or a preview replaying last week. The geometry itself comes
# from geoFenceGeometry, keyed by the addresses named here.
"""
The manifest of one fence-set version: which fences it holds and the content address of each one's
geometry. It carries no geometry, so its size depends only on the fence count and it needs no
pagination. A holder of a version number uses it to learn what to resolve, then fetches the geometry
with geoFenceGeometry.
