"""
Authentication material for a device, which can be rotated. A device has any number of credentials;
each is one of ACCESS_TOKEN, MQTT_BASIC or X509_CERTIFICATE. Secrets are stored only as keyed
digests: an access token is returned once, in the response to the write that set it, and no password
or secret is ever returned on a read. Reading credentials requires device:write, because whoever
could read them could impersonate the device.
"""
type DeviceCredential implements Model & TokenReference & MetadataEntity {
    """
    Server-assigned numeric identifier, as a string. Address a credential by its token instead where
    you can.
    """
    id: ID!
    """When the credential was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the credential was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: a deleted credential is removed outright and is not returned."""
    deletedAt: String
    """
    Identifier of the credential record, unique within the tenant. It is not what a device presents;
    see credentialId.
    """
    token: String!
    """The device this credential authenticates."""
    device: Device!
    """The kind of credential: ACCESS_TOKEN, MQTT_BASIC or X509_CERTIFICATE."""
    credentialType: String!
    """
    What the device presents. For MQTT_BASIC, the username. For ACCESS_TOKEN, the access
    token itself ONLY in the response to the create, update or replacement that set it,
    which is the one time it can be read: the platform stores an access token as a keyed
    digest and cannot return it afterwards. Every later read returns a fingerprint that
    identifies the credential and cannot be presented as the token. If the token is lost,
    set a new one with updateDeviceCredential. For X509_CERTIFICATE it is the SHA-256 of the
    device certificate (hex), computed by the server; it is public and is not something a
    device presents.
    """
    credentialId: String!
    """
    Always null. It is accepted when a credential is written but never returned, so a stored secret
    such as an MQTT_BASIC password cannot be read back out through the API.
    """
    credentialValue: String
    """Whether the credential can authenticate. A disabled credential is kept but refused at connect."""
    enabled: Boolean!
    """When the credential stops authenticating, as an RFC 3339 timestamp. Null means it never expires."""
    expiresAt: String
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    """
    The provisioning profile whose registration issued this credential, or null for a credential
    an operator created. Requires device:read, unscoped.
    """
    provisioningProfile: ProvisioningProfile
    """
    The certificate an X509_CERTIFICATE credential pins, or null for any other type. Requires
    device:read, unscoped.
    """
    certificate: X509Certificate
}

"""The pinned device certificate of an X509_CERTIFICATE credential, read back from what is stored."""
type X509Certificate {
    """SHA-256 of the certificate, hex. The credential's id."""
    fingerprintSha256: String!
    """The certificate's subject common name: the device's external id when it registers itself."""
    subjectCn: String!
    """The certificate's serial number, hex."""
    serialHex: String!
    """When the certificate itself expires. The credential's expiresAt is the earliest expiry over its whole chain."""
    notAfter: String!
    """The trust anchor the certificate's chain must reach at every connect."""
    trustAnchor: DeviceTrustAnchor
}

"""Data required to create a device credential."""
input DeviceCredentialCreateRequest {
    """Identifier for the new credential record, unique within the tenant."""
    token: String!
    """Token of the device the credential authenticates. An unknown token is refused."""
    deviceToken: String!
    """The kind of credential: ACCESS_TOKEN, MQTT_BASIC or X509_CERTIFICATE. Any other value is refused."""
    credentialType: String!
    """
    The MQTT username, or the access token for ACCESS_TOKEN (at most 256 bytes). The token
    is stored only as a keyed digest and is returned once, in this mutation's response.
    """
    credentialId: String!
    """
    The password for an MQTT_BASIC credential: at least 16 bytes, counted as sent, and at
    most 4096. A shorter one is refused with extensions.code INVALID_VALUE. Write-only; it
    is stored only as a keyed digest. A password set before the 16-byte minimum keeps
    working until it is next changed.
    """
    credentialValue: String
    """Whether the credential can authenticate. A disabled credential is kept but refused at connect."""
    enabled: Boolean!
    """When the credential stops authenticating, as an RFC 3339 timestamp. Omit for never."""
    expiresAt: String
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
    """
    X509_CERTIFICATE only: the device certificate in PEM, optionally followed by the
    intermediates that link it to the trust anchor. The chain is verified when the credential
