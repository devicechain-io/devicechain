#
# CodeQL configuration for the javascript-typescript analysis ONLY.
#
# 🔴 `paths-ignore` HERE IS NOT THE SAME THING AS `paths` IN THE WORKFLOW, and
# the difference is why this file exists. The workflow's `on.pull_request.paths`
# decides whether the workflow RUNS at all. This decides what the extractor
# LOOKS AT once it is running — and unlike the Go analysis, where paths-ignore
# is inert because a compiled language analyzed with a build only sees what the
# build compiles, it is honoured for javascript-typescript, which is analyzed
# without building.
#
# Scoped to the frontend job deliberately: applying it to the Go analysis would
# silently do nothing, which is worse than not applying it, because the file
# would read as protection that is not there.
name: "DeviceChain frontend"

paths-ignore:
  # Generated by graphql-codegen from the served SDL. It is tracked (the
  # typecheck and the codegen-drift gate both need it in the tree) but nobody
  # edits it, so a finding here is not actionable — the fix would be overwritten
  # by the next `npm run codegen`. If a real defect ever appears in generated
  # output, the bug is in the generator or the schema, not in this directory.
  - "frontend/apps/console/src/gql/**"

  # Test fixtures and sample payloads. These deliberately contain the shapes a
  # scanner is built to flag — hard-coded tokens, unsanitised strings — and are
  # never served.
  - "frontend/testdata/**"

  # The archived pre-migration tree. `go.work` does not reference it and the Go
  # analysis never sees it; without this line the JS extractor WOULD, since it
  # needs no build to reach a file.
  - "_legacy/**"
