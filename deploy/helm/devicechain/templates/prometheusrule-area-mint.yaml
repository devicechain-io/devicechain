{{/*
Alerting rules for the area-bound service-token mint.

WHY THIS GROUP EXISTS. An area-bound area obtains service tokens only from user-management's
area-bound endpoint, with a credential of its own; the token's subject is that area, and the
authorities it may ask for THERE are its ceiling, enforced. (This watches that endpoint only: until
the area is given a restricted instance document its pod also holds the shared service secret, and
a request through the shared-secret endpoint is not counted here.) The area's code asks only for what is in its
ceiling, so a request for anything else -- an authority outside it, the super-authority, or a
subject of its choosing -- is never a misconfiguration the area made on its own: it is the area
running code it should not be running, or a credential that has left it. The request was refused,
so nothing was granted, but it is the one signal the refusal leaves behind.

The counter is devicechain_usermanagement_area_mint_requests_total{area,result}. Its area label is
closed (the area-bound areas, or "other" when no credential matched) and every series exists at zero
from user-management's start, so increase() sees the first refusal.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: area-mint
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.area-mint
      rules:
        - alert: AreaMintRefusedForbiddenRequest
          # No `for`: one such request is the event. The 10m window holds the alert for ten
          # minutes after the last one. Parenthesised so the comparison binds to the whole
          # expression (hack/check-prometheus-rules.sh refuses the unparenthesised form).
          expr: (sum by (area) (increase(devicechain_usermanagement_area_mint_requests_total{namespace="{{ $ns }}", area!="other", result=~"over_ceiling|wildcard|invalid_request"}[10m])) or vector(0)) > 0
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#areamintrefusedforbiddenrequest"
            summary: "An area-bound area asked for a service token it may never have"
            description: "user-management refused a service-token request presented with the mint credential of {{ "{{ $labels.area }}" }}: it asked for an authority outside that area's ceiling, for the super-authority, or to name the token's subject itself. The area is built never to ask for any of these, so either its pod is running code it should not be, or its credential is being used by something else. Nothing was granted. user-management's rate-limited 'area-bound service-token request refused' warning names the area, the result and the authorities asked for. Treat the area's pod as suspect: inspect it, then rotate its credential by deleting the Secret dci-<instance>-mint-<area> and running dcctl upgrade, which mints a new one. Both the area and user-management read the credential from its mounted file on every mint, so the new one is in force once the mounts refresh, without a restart."
        # A STEADY STREAM OF CREDENTIALS THAT MATCH NO AREA (area="other", result="bad_credential").
        # Kept out of the alert above on purpose, and given one of its own at a threshold, because
        # the two mean different things. A refusal the alert above counts carries a credential that
        # DID match, so a single one is evidence. A bad credential carries no area, and a few are
        # expected: rotating a credential (delete its Secret, dcctl upgrade) refreshes the area's
        # mount and user-management's at different moments, and the area's mints fail until both
        # agree -- a minute or two of failures, then none. Guessing a minted credential (32 random
        # bytes) is not a threat this measures; what it does catch is something on the internal
        # network presenting credentials that are not an area's, steadily, or a rotation whose two
        # sides never converged. So: more than 10 in a ten-minute window, sustained for 15 minutes
        # -- well past any rotation's skew -- and a warning, not a page.
        - alert: AreaMintBadCredentialsSustained
          for: 15m
          expr: (sum(increase(devicechain_usermanagement_area_mint_requests_total{namespace="{{ $ns }}", area="other", result="bad_credential"}[10m])) or vector(0)) > 10
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#areamintbadcredentialssustained"
            summary: "Service-token requests keep presenting an area credential that matches no area"
            description: "For at least 15 minutes, user-management's area-bound service-token endpoint has been refusing more than 10 requests every ten minutes because the credential presented matches no area-bound area. Nothing was granted. A short burst while a credential is being rotated is expected and does not raise this; a stream this long is either something on the instance's internal network presenting credentials that are not an area's, or a rotation whose two sides never agreed. Check whether an area-bound area's pod is failing to obtain tokens: if it is, its mounted credential and user-management's differ, so compare the Secret dci-<instance>-mint-<area> with what both pods mount, and restart the one that has not refreshed. If every area-bound area is obtaining tokens, the requests come from something else: the endpoint is served only on user-management's internal listener, so the caller is inside the instance's network. Find it and treat it as suspect."
{{- end }}
