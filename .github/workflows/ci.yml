  # ---------------------------------------------------------------------------
  # Helm chart: lint and template render.
  # ---------------------------------------------------------------------------
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned, because the unpinned action asks GitHub for the latest Helm and, when that
      # request fails, silently installs its own built-in default (v3.18.4) instead. The
      # chart guards below match Helm's schema-validation WORDING ("additional properties
      # 'limit' not allowed"), which differs between Helm 3 and Helm 4, so a fallback turned
      # a network blip into a red helm job on an unrelated pull request. A pinned version
      # fails closed: a Helm upgrade is a deliberate bump that re-runs these guards, never a
      # side effect of an API call. v4.3.0 is the version these guards have been passing on.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.0

      # The egress drift check needs a Go toolchain as well as helm: it compares the
      # COMPILED deny table against the RENDERED policy, so it runs two small commands
      # out of backend/core rather than scraping either source file. Reading the sources
      # is what made the previous version of that check unable to see a template edit.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh backend/core

      # The tenant-egress boundary is written twice — in Go for the paths that have a
      # dialer, in the chart's NetworkPolicy for the three that do not — and nothing at
      # compile or render time relates the two. This fails when they drift, which is
      # otherwise silent and always in the widening direction. --self-test first, so its
      # green is known to be a green that could have been red: four arms — two tamper the
      # real chart and render it, one tampers the Go EXTRACTION (not the Go source, which
      # it does not claim to), and one asserts the two sides are gathered independently,
      # so a gate comparing the chart with itself cannot pass.
      - name: egress deny-list drift check
        run: |
          hack/check-egress-ranges.sh --self-test

      - name: helm lint
        run: helm lint deploy/helm/devicechain

      - name: chart refusals actually refuse
        # 🔴 `helm lint` CANNOT FAIL ON A `fail`. It renders in LintMode, where a
        # template calling `fail` is reported as `[INFO] Fail: <message>` and the
        # run still exits 0 with "0 chart(s) failed". Every guard this chart states
        # in prose — the root key, the external-config constraints — is therefore
        # invisible to the step above, which is the gate-that-cannot-fail shape
        # applied to CI itself.
        #
        # So each refusal is asserted through `helm template`, which does exit
        # non-zero, and each has a POSITIVE control beside it: a suite that only
        # ever refuses is indistinguishable from a chart that cannot render at all.
        run: |
          set -euo pipefail

          refuses() { # <label> <expected fragment> <helm args...>
            local label="$1" want="$2"; shift 2
            local out
            if out="$(helm template deploy/helm/devicechain "$@" 2>&1)"; then
              echo "::error::$label rendered cleanly; the guard did not fire"; exit 1
            fi
            case "$out" in
              *"$want"*) echo "ok (refused): $label" ;;
              *) echo "::error::$label failed for another reason: $out"; exit 1 ;;
            esac
          }

          renders() { # <label> <helm args...>
            local label="$1"; shift
            helm template deploy/helm/devicechain "$@" >/dev/null || {
              echo "::error::$label did not render, so the refusals above prove nothing"
              exit 1
            }
            echo "ok (renders): $label"
          }

          KEY="$(openssl rand -base64 32)"
          SUM="$(printf inline | sha256sum | cut -d' ' -f1)"
          # Arrays, not strings: these hold several arguments each, and a bare
          # "$EXT" would pass them to helm as one word while an unquoted $EXT
          # relies on word-splitting (which shellcheck rightly refuses).
          NAME=(--set instance.existingSecret=dci-devicechain-config)
          # natsBrokerHost is the PodMonitor's own restate-value. It rides along in
          # EXT so that each case below fails for the reason it names, rather than
          # for the first unrelated gate the external path happens to trip.
          EXT=("${NAME[@]}" --set metrics.natsBrokerHost=dc-nats.dc-system)

          refuses "no root key" "rootKey is required"
          # The smallest profile too. It runs no area with integration credentials,
          # and used to render without a key for exactly that reason; user-management
          # now seals the token-signing key under it, and runs in every profile.
          refuses "no root key, ingest-only" "rootKey is required" --set profile=ingest-only
          refuses "external, renamed Secret" "must be named" \
            --set instance.existingSecret=somewhere-else \
            --set instance.existingSecretChecksum="$SUM" \
            --set metrics.natsBrokerHost=dc-nats.dc-system
          refuses "external, no checksum" "existingSecretChecksum must be set" "${EXT[@]}"
          refuses "external, malformed checksum" "must be a sha256 digest" \
            --skip-schema-validation "${EXT[@]}" \
            --set-string instance.existingSecretChecksum=notadigest
          refuses "external, PodMonitor host not restated" "natsBrokerHost set" \
            "${NAME[@]}" --set instance.existingSecretChecksum="$SUM"
          refuses "hand-set shutdown block" "set by the chart, not by hand" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set instance.config.infrastructure.shutdown.drainSeconds=9
          # An area's resources merge over the top-level ones, so a request raised for
          # one area can land above the limit it inherits; the API server would only
          # refuse the pod when the ReplicaSet creates it.
          refuses "area request above its merged limit" "request 512Mi is above the 256Mi limit" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.event-sources.resources.requests.memory=512Mi
          # A typo such as `limit:` would otherwise merge into the pod spec and the
          # limit it meant would silently not apply.
          refuses "unknown key under an area's resources" "additional properties 'limit' not allowed" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.event-sources.resources.limit.cpu=4
          # A measured request is a chart default the operator never wrote, so the
          # refusal has to say where it came from and how to turn it off.
          refuses "measured request above an area limit" "measuredRequests.cpu" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.device-management.resources.limits.cpu=300m
          refuses "unknown key under measuredRequests" "additional properties 'memory' not allowed" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.device-management.measuredRequests.memory=1Gi
          # The opt-out switches are the keys a typo hurts most: a misspelled one would
          # render and leave the rule it meant to turn off in place.
          refuses "misspelled key in an area's values" "additional properties 'avoidEventStorePrimry' not allowed" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.event-sources.avoidEventStorePrimry=false
          refuses "misspelled spread switch" "additional properties 'eventPathSpred' not allowed" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.event-sources.eventPathSpred=false
          renders "spread switched off for one area" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.event-sources.eventPathSpread=false
          # event-processing has its own CPU limit, so an operator's own limit below
          # its measured request is refused, naming the measured request; a top-level
          # limit no longer reaches it, so the same value set there renders.
          refuses "event-processing's own limit below its measured request" \
            "functionalAreas.event-processing.measuredRequests.cpu" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set functionalAreas.event-processing.resources.limits.cpu=300m
          renders "top-level limit below event-processing's measured request" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set resources.limits.cpu=300m
          renders "measured requests off, area limit lowered" \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY" \
            --set useMeasuredRequests=false \
            --set functionalAreas.device-management.resources.limits.cpu=300m

          # The filesystem object store is shared by every area that builds one, so the
          # claim is judged by the pods ACROSS those areas, and an override of
          # blobStorage.mountAreas is judged against the same default the mount uses.
          BLOB=(--set "instance.config.infrastructure.secrets.rootKey=$KEY"
            --set "enabledFunctionalAreas={user-management,device-management,update-management}"
            --set instance.config.infrastructure.blob.directory=/var/lib/dc/blob)
          refuses "two areas share a ReadWriteOnce claim" "but it is not ReadWriteMany" \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true
          renders "two areas share a ReadWriteMany claim" \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true \
            --set "blobStorage.persistence.accessModes={ReadWriteMany}"
          renders "two areas share an operator-provided claim" \
            "${BLOB[@]}" --set blobStorage.persistence.existingClaim=mine
          renders "one area on a ReadWriteOnce claim" \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true \
            --set "enabledFunctionalAreas={user-management,device-management}"
          refuses "a mountAreas override that omits update-management" "is not in blobStorage.mountAreas" \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true \
            --set "blobStorage.persistence.accessModes={ReadWriteMany}" \
            --set "blobStorage.mountAreas={user-management}"
          # update-management without the instance store (updates.objectStore: none) leaves the
          # pods that mount the claim, so two areas on a ReadWriteOnce claim become one pod -- and
          # the mountAreas rule above no longer applies to it. Anything but instance|none is refused.
          renders "update-management without the store beside a ReadWriteOnce claim" \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true \
            --set functionalAreas.update-management.config.updates.objectStore=none
          renders "update-management without the store, absent from mountAreas" \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true \
            --set functionalAreas.update-management.config.updates.objectStore=none \
            --set "blobStorage.mountAreas={user-management}"
          refuses "an updates.objectStore the chart does not know" 'must be "instance" or "none"' \
            "${BLOB[@]}" --set blobStorage.persistence.enabled=true \
            --set functionalAreas.update-management.config.updates.objectStore=off

          # The artifact upload route needs its own Ingress: nginx's defaults refuse a body
          # over 1 MiB and buffer the whole body before the service can authenticate it.
          #
          # These proxy-* / enable-access-log annotations are ingress-nginx's, so they are asserted
          # on the Ingress front end (ingress.controller=nginx) and, beside the Gateway, in the cutover
          # window (ingress.legacy.enabled). The Gateway front end has no such objects: it is held below.
          UPLOAD="$(helm template deploy/helm/devicechain             --set "instance.config.infrastructure.secrets.rootKey=$KEY"             --set "enabledFunctionalAreas={user-management,device-management,update-management}"             --set ingress.enabled=true --set ingress.controller=nginx)"
          for want in 'name: devicechain-update-upload' 'proxy-request-buffering: "off"' 'proxy-body-size: "1g"'; do
            case "$UPLOAD" in
              *"$want"*) echo "ok (renders): upload ingress carries $want" ;;
              *) echo "::error::the upload ingress is missing $want"; exit 1 ;;
            esac
          done
          NOUPLOAD="$(helm template deploy/helm/devicechain --set "instance.config.infrastructure.secrets.rootKey=$KEY" --set profile=telemetry --set ingress.enabled=true --set ingress.controller=nginx)"
          case "$NOUPLOAD" in
            *devicechain-update-upload*) echo "::error::the upload ingress renders without update-management"; exit 1 ;;
            *) echo "ok (renders): no upload ingress without update-management" ;;
          esac

          # The download route carries a capability in its query string, so it gets an Ingress of
          # its own with the access log off; the API Ingress would write it to the log.
          for want in 'name: devicechain-update-download' 'enable-access-log: "false"' 'updates/download/[^/]+'; do
            case "$UPLOAD" in
              *"$want"*) echo "ok (renders): download ingress carries $want" ;;
              *) echo "::error::the download ingress is missing $want"; exit 1 ;;
            esac
          done
          case "$NOUPLOAD" in
            *devicechain-update-download*) echo "::error::the download ingress renders without update-management"; exit 1 ;;
            *) echo "ok (renders): no download ingress without update-management" ;;
          esac

          # The Gateway front end and the cutover window. Gateway alone: the update-management routes
          # are rules of the API HTTPRoute, there is no upload or download Ingress, and no nginx
          # annotation of any kind is rendered (they would be ignored by the controller, and a
          # reader would believe the edge enforces them). Cutover: both front ends, and the legacy
          # upload and download Ingress objects keep the annotations that make them work.
          GW="$(helm template deploy/helm/devicechain             --set "instance.config.infrastructure.secrets.rootKey=$KEY"             --set "enabledFunctionalAreas={user-management,device-management,update-management}"             --set ingress.enabled=true --set ingress.controller=gateway)"
          case "$GW" in
            *"kind: HTTPRoute"*"/api/update-management"*) echo "ok (renders): the Gateway routes update-management" ;;
            *) echo "::error::the Gateway front end does not route update-management"; exit 1 ;;
          esac
          for banned in 'kind: Ingress' 'nginx.ingress.kubernetes.io' 'proxy-body-size' 'proxy-request-buffering' 'enable-access-log' 'devicechain-update-upload' 'devicechain-update-download'; do
            case "$GW" in
              *"$banned"*) echo "::error::the Gateway front end renders $banned"; exit 1 ;;
              *) echo "ok (renders): the Gateway front end has no $banned" ;;
            esac
          done
          CUT="$(helm template deploy/helm/devicechain             --set "instance.config.infrastructure.secrets.rootKey=$KEY"             --set "enabledFunctionalAreas={user-management,device-management,update-management}"             --set ingress.enabled=true --set ingress.controller=gateway --set ingress.legacy.enabled=true --set ingress.gateway.tlsSecretName=devicechain-tls-gateway)"
          for want in 'kind: Gateway' 'kind: HTTPRoute' 'name: devicechain-update-upload' 'name: devicechain-update-download' 'proxy-request-buffering: "off"' 'proxy-body-size: "1g"' 'enable-access-log: "false"' 'secretName: devicechain-tls' 'name: devicechain-tls-gateway'; do
            case "$CUT" in
              *"$want"*) echo "ok (renders): the cutover window carries $want" ;;
              *) echo "::error::the cutover window is missing $want"; exit 1 ;;
            esac
          done
          refuses "a Gateway and an Ingress naming one certificate Secret" "must differ from ingress.tls.secretName" --set "instance.config.infrastructure.secrets.rootKey=$KEY" --set ingress.enabled=true --set ingress.controller=gateway --set ingress.legacy.enabled=true
          refuses "legacy ingress beside the nginx front end" "needs ingress.controller: gateway"             --set "instance.config.infrastructure.secrets.rootKey=$KEY" --set ingress.enabled=true --set ingress.controller=nginx --set ingress.legacy.enabled=true

          renders "inline config" --set "instance.config.infrastructure.secrets.rootKey=$KEY"
          renders "inline config, ingest-only" --set profile=ingest-only \
            --set "instance.config.infrastructure.secrets.rootKey=$KEY"
          renders "external config" "${EXT[@]}" --set instance.existingSecretChecksum="$SUM"

      - name: cnpg-cluster chart
        # The database-store chart (ADR-020 A2.3). It lives under the OpenTofu
        # modules tree rather than in deploy/helm because it is an implementation
        # detail of a module — a Cluster custom resource cannot be a
        # kubernetes_manifest without its CRD existing at PLAN time, so a
        # helm_release is how the resource gets created at all.
        #
        # Linted here rather than nowhere: it is a Helm chart, it ships inside
        # dcctl, and until this step existed the ONLY thing that rendered it was a
        # real bootstrap against a real cluster.
        run: |
          helm lint deploy/opentofu/modules/cnpg-cluster/chart \
            --set name=dc-rdb --set imageName=example/pg:17 --set instances=3 \
            --set aliasServiceName=dc-postgresql --set storage.size=8Gi \
            --set bootstrap.database=devicechain --set bootstrap.owner=devicechain \
            --set bootstrap.secretName=dc-rdb-app-credentials

          # The guard that costs a third node, asserted rather than trusted.
          # Synchronous replication at two instances turns any standby loss into a
          # total write outage, and CloudNativePG's own webhook does NOT refuse it
          # (it refuses only number >= instances). If this render ever succeeds,
          # that topology has become reachable.
          if helm template dc-rdb deploy/opentofu/modules/cnpg-cluster/chart \
               --set name=dc-rdb --set imageName=example/pg:17 --set instances=2 \
               --set aliasServiceName=dc-postgresql --set storage.size=8Gi \
               --set bootstrap.database=devicechain --set bootstrap.owner=devicechain \
               --set bootstrap.secretName=dc-rdb-app-credentials \
               --set synchronous.enabled=true >/dev/null 2>&1; then
            echo "FAIL: the chart rendered synchronous replication at 2 instances." >&2
            echo "That topology stalls every write on the loss of a single standby." >&2
            exit 1
          fi
          echo "ok: synchronous replication is refused below three instances"

          # The reserved-owner guard (ADR-020 A2.4), asserted for the same reason:
          # it is refused today only because this chart happens to render a managed
          # role for the owner, and CloudNativePG's webhook rejects a reserved name
          # THERE. Measured on 1.30.0, `bootstrap.initdb.owner: postgres` is accepted
          # on its own — so make that block conditional and the store comes up
          # connecting as the real superuser, with enableSuperuserAccess: false
          # rendered meaningless and nothing reporting a problem.
          for reserved in postgres streaming_replica; do
            if helm template dc-tsdb deploy/opentofu/modules/cnpg-cluster/chart \
                 --set name=dc-tsdb --set imageName=example/pg:17 --set instances=3 \
                 --set aliasServiceName=dc-timescaledb-single --set storage.size=8Gi \
                 --set bootstrap.database=devicechain --set "bootstrap.owner=$reserved" \
                 --set bootstrap.secretName=dc-tsdb-app-credentials >/dev/null 2>&1; then
              echo "FAIL: the chart rendered a Cluster owned by the reserved role '$reserved'." >&2
              echo "The platform connects as the owner, so this means connecting as a" >&2
              echo "CloudNativePG-reserved role rather than as an application." >&2
              exit 1
            fi
          done
          echo "ok: reserved owner names are refused"

          # The counterweight. Refusing reserved owners is only safe while a valid
          # owner still renders — a guard that rejects everything passes the two
          # checks above and breaks every install.
          helm template dc-tsdb deploy/opentofu/modules/cnpg-cluster/chart \
            --set name=dc-tsdb --set imageName=example/pg:17 --set instances=3 \
            --set aliasServiceName=dc-timescaledb-single --set storage.size=8Gi \
            --set bootstrap.database=devicechain --set bootstrap.owner=devicechain \
            --set bootstrap.secretName=dc-tsdb-app-credentials >/dev/null
          echo "ok: a valid owner still renders"

          # The store's owner must not be able to create databases or roles. Every
          # instance gets its own login owning its own database; an owner that could
          # create databases would be a shared identity above all of them. Read back
          # from the render, with a presence check so an empty read cannot pass.
          rendered="$(helm template dc-rdb deploy/opentofu/modules/cnpg-cluster/chart \
            --set name=dc-rdb --set imageName=example/pg:17 --set instances=3 \
            --set aliasServiceName=dc-postgresql --set storage.size=8Gi \
            --set bootstrap.database=dc_owner --set bootstrap.owner=dc_owner \
            --set bootstrap.secretName=dc-rdb-app-credentials)"
          owner="$(printf '%s\n' "$rendered" | awk '
            $0 ~ /^      - name: / { on = ($0 == "      - name: dc_owner"); next }
            $0 ~ /^    services:/ { on = 0 }
            on && $0 !~ /^ *#/ { print }')"
          printf '%s\n' "$owner" | grep -q "login: true" || {
            echo "FAIL: the owner's role block was not found, so the check below would read nothing." >&2; exit 1; }
          if printf '%s\n' "$owner" | grep -Eq "create(db|role): true"; then
            echo "FAIL: the store's owner renders with CREATEDB or CREATEROLE." >&2; exit 1
          fi
          echo "ok: the store's owner can create neither databases nor roles"

      # Self-test first, and it plants each defect ALONE: a self-test that plants
      # all of them at once is satisfied by a checker that finds any one. Nineteen
      # defects here — a required group that stopped rendering, a render with no
      # rules at all, unparseable PromQL, a group accounted for nowhere, a listed
      # group that renders nothing, an untested alert, a stale test, a group with
      # no alerts, a missing test file, a rule inverted so it can never fire, and
      # nine covering the always-firing stage: the expression that actually shipped,
      # four respellings of it, a folded YAML block, a run under its alert floor, a
      # rule file read only in part, and a run with no rule files at all. Two clean
      # bundles have to come back clean for any of that to mean anything.
      - name: PrometheusRules guard self-test
        run: |
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-check
          hack/check-prometheus-rules.sh --self-test

      - name: PrometheusRules parse
        # Prometheus loads rule groups ATOMICALLY: one unparseable expression and
        # the entire group is rejected, every other alert in it included. It fails
        # in the server's log and in a counter — the PrometheusRule object stays
        # present and healthy-looking, and the alerts simply never fire.
        #
        # Nothing else catches this. `helm lint` checks YAML, not PromQL, and the
        # Prometheus Operator's admission webhook is optional and speaks only once
        # the release is already being applied. The chart ships five rule files now
        # (DETECT/REACT, JetStream replication, database backups, database control
        # plane, command delivery), and a break in one takes its neighbours down
        # with it.
        #
        # 🔴 IT CANNOT SEE A MISSPELLED SERIES. promtool parses PromQL and has no
        # idea which metrics this platform registers, so a rule naming a series
        # that does not exist parses perfectly and evaluates an empty vector —
        # which is not false, so the alert simply never fires. That gap is the
        # dashboard guard's, below.
        #
        # 🔴 NOR CAN IT SEE AN ALERT THAT CAN NEVER BE FALSE, which is the other
        # instrument this script now fronts: promtool answers "is this valid?",
        # and the question here is "can this ever return NOTHING?". Prometheus
        # fires on the PRESENCE of a sample, so an expression with no reachable
        # empty state is an alert that is always firing — and an always-firing
        # alert trains its recipients to ignore the channel the real ones arrive
        # on. `>` binds tighter than `or`, so `a or vector(0) > 0` parses as
        # `a or (vector(0) > 0)` and leaves a bare `a`. That is a question about
        # the parse tree, so backend/tools/promqlguard walks the AST with the
        # parser Prometheus itself uses rather than matching the text.
        run: |
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-check
          hack/check-prometheus-rules.sh

      # Self-test first, and it plants each defect ALONE: a self-test that plants
      # all of them at once is satisfied by a checker that finds any one.
      - name: dashboard guard self-test
        # PyYAML reads the rendered ConfigMaps; the script refuses to run without it.
        run: |
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-check
          hack/check-dashboards.sh --self-test

      - name: dashboards parse and name real series
        # Two gaps nothing else covers, both silent.
        #
        # templates/grafana-dashboard.yaml used to embed each dashboard with
        # `.Files.Get | indent`, which turns ANY bytes into a valid YAML block
        # scalar — so helm lint, helm template and kubectl apply all passed on
        # malformed JSON, and it failed in the Grafana sidecar's log at runtime.
        # The template now parses them, but this still names the file and why.
        #
        # And nothing checked that a series name exists. A misspelled metric in a
        # panel draws an empty graph; in an alert it never fires and never
        # complains.
        #
        # It also pins the dashboard ConfigMap names and data keys, and renders
        # two instances to fail on anything they would share in one Grafana: a
        # uid, a sidecar file, a folder, or a board not scoped to its instance.
        run: |
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-check
          hack/check-dashboards.sh

      - name: cnpg-cluster chart vs the real CRD schemas
        # The one failure the chart cannot protect itself from.
        #
        # Every guard in the step above is a `fail` on a VALUE. None of them can
        # see a misspelled FIELD, because Helm prunes unknown fields silently —
        # measured: `kubectl apply` rejects `spec.postgresql.synchronus` outright
        # while `helm install` exits 0 and creates an object without it. The
        # module applies through Helm, so a one-character slip yields a green
        # apply and a Cluster missing whatever that field controlled.
        #
        # A2.5 adds a second instance of the same shape and a worse one: misspell
        # `isWALArchiver` and the Cluster still carries the plugin and still names
        # its ObjectStore, but Postgres gets no archive_command and the instance
        # is not backed up. Nothing else in this repo would notice.
        #
        # Validates the rendered objects against the CRDs of the PINNED chart
        # versions, read from the OpenTofu variables rather than restated. Also
        # asserts the one field a schema CANNOT check — `barmanObjectName` lives
        # in a free-form parameters map, so it is checked by name and against the
        # ObjectStore actually rendered beside it.
        run: |
          # The runner image ships PyYAML today; installing it if absent keeps
          # this step from going red on an image change rather than on the chart.
          # The script still refuses to run without it, so this cannot turn into a
          # silent skip.
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-check
          hack/check-cnpg-chart-schema.sh

      - name: profile workloads
        # Renders EVERY profile and pins the workloads each one produces.
        #
        # This replaces a pair of render-to-/dev/null calls that caught template
        # errors and asserted nothing about the output. It still catches render
        # errors — a failed render fails the diff — but it also pins what an install
        # actually runs, which is what the published footprint measurement is taken
        # against. Moving a functional area into a profile used to invalidate that
        # number silently; now it fails here with instructions.
        #
        # It also covers telemetry and ingest-only, which were rendered by nothing.
        run: hack/check-profile-workloads.sh

      - name: Sparkplug commands flag derivation
        # command-delivery's Sparkplug verdict follows one flag that nobody authors: the chart sets
        # it exactly when a Sparkplug source enables commands. Off while a source sends leaves every
        # command refused as having no downlink; on with no source sending leaves commands accepted
        # and never answered. `helm lint` reports a template `fail` as INFO and exits 0, so this
        # asserts the flag both ways through `helm template`, and that the combinations that cannot
        # work fail the render. --self-test plants each defect alone first.
        run: |
          hack/check-sparkplug-commands-chart.sh --self-test
          hack/check-sparkplug-commands-chart.sh

      - name: OAuth discovery routing
        # An MCP client's discovery walk is three requests, each derived from a string a
        # service handed it, and nothing inside a service can tell whether the URL it
        # published reaches anything. The ingress decides that, in another language in
        # another directory — and the reference client aborts the whole walk on the FIRST
        # error, so one unrouted hop ends discovery rather than degrading it.
        #
        # All three were broken at once with every service test green: the endpoint was
        # mounted at /mcp while the ingress delivered the advertised /api/mcp as "/" (an
        # unauthenticated 404); the challenge advertised a path only the console matched;
        # and the authorization-server metadata, whose location a path-carrying issuer
        # puts under /.well-known/, was matched by the console too — which answers 200
        # with index.html, so the client reports a decode failure rather than a routing
        # problem. Package tests drive handlers directly and can see none of it.
        #
        # Expectations come from the RENDERED identifiers and from the suffix constants
        # read out of the Go source, not from constants restated in the script, so moving
        # either side without moving the other fails here.
        run: |
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-check
          hack/check-oauth-discovery-routing.sh
          hack/check-oauth-discovery-routing.sh --self-test

  # ---------------------------------------------------------------------------
  # OpenTofu: format, init (no backend), validate.
  # ---------------------------------------------------------------------------
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/opentofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          # The action's default is to install a Node WRAPPER on the PATH ahead of
          # the real binary, so that a step's tofu output can be read back as step
          # outputs. Nothing here consumes those, and the wrapper does not forward
          # the step's stdin to the child process — which is fatal for the
          # `tofu console` invocations below. They do not fail against it, they
          # BLOCK: the child waits on a pipe that is never closed, so the job holds
          # a runner until the workflow ceiling and the PR's check never resolves
          # rather than going red. fmt/init/validate read no stdin, which is why
          # only the last step hung and every earlier one passed.
          tofu_wrapper: false

          # D2-6: move every CI pin and all required_version floors together.
          # OpenTofu <1.10 evaluates both sides of &&, including invalid indexes.
          # Keep init -upgrade: a lock file from an older init keeps old providers.
          # Latest stable 1.10.x: https://github.com/opentofu/opentofu/releases/tag/v1.10.10
          tofu_version: 1.10.10

      # Provider plugins come from GitHub release assets via the registry redirect, which
      # has had outages (504). Cache the plugin directory (keyed on every .tf, since the
      # provider pins live there and no lock files are committed) and retry each init.
      - name: Restore OpenTofu providers
        id: tofu-plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/**/*.tf') }}
          restore-keys: tofu-plugins-${{ runner.os }}-${{ runner.arch }}-

      - name: Point OpenTofu at the plugin cache
        run: |
          mkdir -p "$HOME/.cache/tofu-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.cache/tofu-plugins" >> "$GITHUB_ENV"

      - name: tofu fmt
        run: tofu fmt -check -recursive

      # dcctl destroy drops the plan's "Changes to Outputs:" block from what it streams,
      # because a destroy given only two variables prints every other output at the
      # configuration's default. The filter is keyed on that header line, so this runs
      # the pinned binary over a scratch configuration and fails if the header changes
      # (the false list would come back) or if a destroy stops printing a default
      # (the list would be true, and the filter would be hiding it).
      - name: destroy prints outputs at their defaults
        working-directory: .
        run: hack/check-tofu-destroy-outputs.sh

      # 🔴 EVERY ROOT, NOT THE ONE THIS JOB HAPPENS TO SIT IN. `tofu validate` acts
      # on a single directory, and this job's working-directory is deploy/opentofu.
      # For as long as there was one root those were the same thing. A second root —
      # the cluster-prerequisite one — would be neither init'd nor validated here,
      # and nothing would say so: this step would keep passing, on the other root.
      # Broken HCL in the new one would then first surface on a user's machine.
      #
      # `tofu fmt -check -recursive` above already descends, so only these two
      # needed widening. hack/tofu-roots.sh refuses to return an empty list, so a
      # discovery that breaks fails the job rather than validating nothing.
      - name: tofu init and validate every root
        working-directory: .
        run: |
          set -euo pipefail
          hack/tofu-roots.sh | sed 's/^/  discovered root: /'
          hack/tofu-roots.sh | while IFS= read -r root; do
            echo "::group::$root"
            ( cd "$root" && "$GITHUB_WORKSPACE/hack/ci-retry.sh" tofu init -backend=false && tofu validate )
            echo "::endgroup::"
          done

      # The roots dcctl does not embed: deploy/gke and deploy/playground create a cluster
      # rather than installing into one, and later the fleet roots under deploy/fleet. They
      # are not among the roots above (hack/tofu-roots.sh lists what dcctl embeds, and other
      # checks rely on that), so they are discovered with `--all`, which walks the whole of
      # deploy/ and skips modules, tests, fixtures and premises.
      #
      # 🔴 A LOOP, NOT ONE STEP PER ROOT: a root added under deploy/ is then fmt-checked,
      # init'd, validated and tested the day it lands, instead of the day someone remembers
      # to write its step. The discovery's own self-test and the independent directory-set
      # cross-check (deploy/tofu_roots_test.go) keep the list honest, and the script refuses
      # an empty list.
      #
      # `tofu test` with no test files reports success, so for a root that HAS a tests
      # directory the pass count is required to be non-zero rather than the exit status
      # alone trusted. The output goes through tee so a failing run still prints its per-run
      # lines; pipefail keeps tofu's own status.
      - name: tofu fmt, init, validate and test every other root
        working-directory: .
        run: |
          set -euo pipefail
          hack/tofu-roots.sh --self-test
          hack/tofu-roots.sh --all > "$RUNNER_TEMP/all-roots.txt"
          # The install roots are covered by the step above; everything else is here.
          grep -v '^deploy/opentofu/' "$RUNNER_TEMP/all-roots.txt" > "$RUNNER_TEMP/other-roots.txt" || true
          [ -s "$RUNNER_TEMP/other-roots.txt" ] || { echo "no root outside deploy/opentofu was discovered"; exit 1; }
          # The fleet roots (deploy/fleet/*) ENFORCE state and plan encryption, so even `init` needs a
          # key. CI supplies a throwaway one; whether the `enforced` lines are really there is
          # checked statically and by a no-key plan in hack/check-fleet-roots.sh, not here.
          fleet_key='key_provider "pbkdf2" "ci" { passphrase = "ci-throwaway-passphrase-0123456789" }
          method "aes_gcm" "ci" { keys = key_provider.pbkdf2.ci }
          state { method = method.aes_gcm.ci }
          plan { method = method.aes_gcm.ci }'
          while IFS= read -r root; do
            echo "::group::$root"
            ( cd "$root"
              case "$root" in deploy/fleet/*) export TF_ENCRYPTION="$fleet_key" ;; esac
              tofu fmt -check -recursive
              "$GITHUB_WORKSPACE/hack/ci-retry.sh" tofu init -backend=false
              tofu validate
              if [ -d tests ]; then
                log="$RUNNER_TEMP/$(echo "$root" | tr '/' '-')-tftest.log"
                tofu test -no-color | tee "$log"
                grep -Eq '^Success! [1-9][0-9]* passed, 0 failed\.$' "$log"
              fi )
            echo "::endgroup::"
          done < "$RUNNER_TEMP/other-roots.txt"

      # The wait that ends the apply has a self-test against a scripted gcloud: it must
      # wait through RECONCILING and fail on a timeout, an always-failing gcloud and a
      # missing one, because a wait that cannot fail is a wait that returns early.
      - name: gke cluster-operations wait self-test
        working-directory: .
        run: deploy/opentofu/modules/gke-cluster/wait-for-cluster-operations.sh --self-test

      # The no-op plan gate for the deploy/gke -> modules/gke-cluster extraction. The self-test
      # runs first and shows the gate refusing each planted defect (a dropped moved block, a
      # renamed module call, a changed input, a changed settle trigger, an empty fixture
      # directory) on a synthetic pair; a gate that has not been shown to refuse anything cannot
      # tell "nothing to report" from "never looked". Then the sanitized states of the real root
      # (its current shape and the pre-for_each loadgen shape) must plan as pure no-ops. Offline:
      # a dummy token and -refresh=false, so no cloud is called.
      - name: gke extraction no-op plan gate
        working-directory: .
        run: |
          set -euo pipefail
          hack/check-gke-extraction-plans.sh --self-test
          hack/check-gke-extraction-plans.sh deploy/gke/fixtures

      # The fleet premise spike's harness runs against scripted gcloud/kubectl/psql/tofu: every
      # entry point must refuse what it should (a creation before the reaper preflight, an
      # unenforced encryption key, a forged termination) before any real measurement is trusted.
      # The self-test of each entry point also kills a preflight-bypass mutant.
      - name: fleet premise harness self-test
        working-directory: .
        run: |
          for e in hack/fleet-s0/E-*.sh hack/fleet-s0/reaper.sh hack/fleet-s0/run.sh; do
            bash "$e" --self-test
          done

      # The no-op plan gate for the deploy/gke -> modules/gke-cluster extraction. The self-test
      # runs first and shows the gate refusing each planted defect (a dropped moved block, a
      # renamed module call, a changed input, a changed settle trigger, an empty fixture
      # directory) on a synthetic pair; a gate that has not been shown to refuse anything cannot
      # tell "nothing to report" from "never looked". Then the sanitized states of the real root
      # (its current shape and the pre-for_each loadgen shape) must plan as pure no-ops. Offline:
      # a dummy token and -refresh=false, so no cloud is called.
      - name: gke extraction no-op plan gate
        working-directory: .
        run: |
          set -euo pipefail
          hack/check-gke-extraction-plans.sh --self-test
          hack/check-gke-extraction-plans.sh deploy/gke/fixtures

      # The fleet roots (deploy/fleet/*): what a manager runs, so enforced state and plan encryption
      # and a declared backend are checked, not trusted. fmt, init -backend=false, validate and
      # `tofu test` run WITH a throwaway pbkdf2 key; then, on a copy with no backend block, a plan
      # with NO key must be refused by the encryption configuration and the same plan WITH the key
      # must succeed (a gate that only refuses is an outage), and `init` with the backend block and
      # no backend configuration must fail (no implicit local backend). The static half
      # (`enforced = true` under both state and plan, the closed variable list, provider set and
      # outputs) is deploy/fleet_roots_test.go, in the `deploy` module's go job.
      - name: fleet roots
        working-directory: .
        run: hack/check-fleet-roots.sh

      # The provider's max_history default is 0, which keeps every revision of every
      # release forever. That is not a setting anyone chose, so a release added
      # without one is the expected mistake rather than an unusual one. The self-test
      # runs first: a check that has not been shown to refuse anything cannot
      # distinguish "nothing to report" from "never looked".
      - name: helm releases bound their history (self-test)
        working-directory: ${{ github.workspace }}
        run: hack/check-helm-release-history.sh --self-test

      - name: helm releases bound their history
        working-directory: ${{ github.workspace }}
        run: hack/check-helm-release-history.sh

      # `tofu validate` evaluates variables at their DEFAULTS and never runs a
      # validation block, so an inverted or misdirected condition passes every step
      # above. This supplies real values and asserts what is refused and — the
      # counterweight — what is still accepted.
      - name: variable validation blocks
        run: hack/check-tofu-validations.sh
        working-directory: .

      # What a module promises about its PLAN -- the object store's volume keeps
      # the size it was created at, whatever a later apply asks for -- is visible
      # to neither step above. The modules' `tofu test` suites run it against a
      # mocked provider, from a copy of the tree (the script says why).
      - name: module test suites
        run: hack/check-tofu-module-tests.sh
        working-directory: .

      # nats-server refuses to hot-reload the auth_callout block (and JetStream's
      # memory/store ceilings), and the refusal is wholesale — so without the pod
      # template's config checksum, a change is applied, reported successful by every
      # layer, and never adopted by the running broker. The only trace is one [ERR]
      # line in the broker's own log.
      - name: NATS config adoption
        run: hack/check-nats-config-adoption.sh
        working-directory: .

      # An unpinned chart version has to be resolved at APPLY time, so a chart-repo
      # hiccup surfaces as the helm provider's "inconsistent final plan ... .version:
      # was known, but now unknown" — which names neither the chart nor the network.
      # It also means two bootstraps of this commit install different software, under
      # modules that are sized against chart internals.
      - name: chart version pins
        run: hack/check-chart-pins.sh
        working-directory: .

      - name: chart version pins self-test
        run: bash hack/check-chart-pins.sh --self-test
        working-directory: .

      # The broker image is built on one nats-server library version, and the nats chart,
      # every module's requirement and the documented upstream rollback image must name the
      # same one. Dependabot moves the go.mod lines and nothing else, so the bump that
      # matters most is the one most likely to arrive alone. Self-test first: each skew is
      # planted alone and must be caught.
      - name: broker version skew guard self-test
        run: hack/check-broker-version-skew.sh --self-test
        working-directory: .

      - name: broker version skew
        run: hack/check-broker-version-skew.sh
        working-directory: .

      # Saved even when a later init failed: each provider is installed into the cache
      # atomically, so what is there is whole, and keeping it lets the re-run skip the
      # providers that did download instead of hitting the outage for all of them again.
      - name: Save OpenTofu providers
        if: always() && steps.tofu-plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/**/*.tf') }}

  # ---------------------------------------------------------------------------
  # Image smoke build: ko builds each service image locally (no push). This
  # catches image-build breakage. The matrix covers the discovered services
  # plus the operator (backend/k8s).
  # ---------------------------------------------------------------------------
  image-smoke:
    needs: discover
    # 🔴 SELECTED LIKE THE GO LEGS. hack/ci-select.py plans an image when its module runs whole on
    # this diff (changed, or requiring a changed module), or an input of its build changed
    # (SMOKE_INPUTS: .ko.yaml, and what the k8s and user-management legs' extra steps read). A
    # dependency-version, workflow or hack/ change, an unknown file, an empty diff and any
    # selection failure plan every image, as does every run that is not a pull request. Skipped
    # when none is planned, which ci-complete accepts only alongside a successful discover that
    # planned zero.
    if: needs.discover.outputs.smoke != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The planned images among the discovered services (backend/services/<name>), the
        # operator, the edge agent, the broker admin and the broker, assembled by discover.
        module: ${{ fromJson(needs.discover.outputs.smoke) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No Go cache here. ko builds with its own flags (static, trimmed), so none of the go job's
      # compiled packages are reusable, and the entries these legs used to save were 19 more keys
      # (~5.7 GB) in a cache already over its limit, for a measured 0.7 min a hit at a 25% hit rate.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh "${{ matrix.module }}"

      # Install ko ourselves rather than via ko-build/setup-ko. The action has now
      # failed this job in two different ways, and both come from it fetching over the
      # network with no retry and no verification:
      #
      #   1. Its default "latest-release" resolution is, inside the action:
      #        tag=$(curl -L -s -u "username:${GH_TOKEN}" \
      #                https://api.github.com/repos/ko-build/ko/releases/latest | jq -r '.tag_name')
      #      which makes every image-smoke job depend on GitHub's AUTHENTICATED API being
      #      healthy at that moment — and when it is not, the action pipes an HTML error
      #      page straight into jq, which dies with "Invalid numeric literal at line 1,
      #      column 10" and an empty tag, failing the job in ~10s before anything is
      #      built. That took out all 12 image-smoke jobs on 2026-07-16: GitHub was
      #      503-ing authenticated api.github.com requests while unauthenticated ones
      #      still returned 200, so the failure looked like a code problem and was not.
      #      Pinning a version dodged this by taking the action's `*)` branch.
      #
      #   2. Its download is `curl -fsL <url> | tar xzf -`, and 🔴 A PIPE CANNOT BE
      #      RETRIED. A truncated body is not visible to curl at all — it surfaces only
      #      downstream as `gzip: stdin: unexpected end of file`, after tar has already
      #      consumed the stream, so neither `--retry` nor a wrapper around the action
      #      can recover it. On 2026-08-12 this failed 2-3 of the ~15 matrix jobs on
      #      EVERY run, a different random subset each time, and one job failed three
      #      consecutive attempts. ~15 jobs pulling the same 12MB asset simultaneously
      #      is enough to get some of them throttled mid-stream.
      #
      # Downloading to a FILE is what makes the retry meaningful: curl can then restart
      # a failed transfer, and the checksum is checked before anything is unpacked or
      # executed. That turns a corrupt download into a named error instead of a
      # confusing tar failure — or, worse, a silently truncated binary.
      #
      # 🔴 KO_VERSION and KO_SHA256 must be bumped TOGETHER. The digest is the one for
      # ko_<version>_Linux_x86_64.tar.gz in that release's own checksums.txt — read it
      # from there, never from a local download, which would just be attesting to
      # whatever you happened to receive. Pinning both keeps the image build
      # reproducible (the same ko every run, not whatever shipped that morning) and is
      # what a pinned build tool is for.
      # 🔴 TWO INDEPENDENT SOURCES, BECAUSE RETRYING ONE HOST IS NOT RESILIENCE. Within
      # twenty minutes on 2026-08-12 the release-asset host went from truncating bodies
      # to returning a hard 503 for every request, and no retry policy reaches a host
      # that is down. The fallback is deliberately on DIFFERENT infrastructure — the Go
      # module proxy — so a single provider outage cannot stop every image build.
      #
      # The release tarball stays FIRST because it is a 12MB download versus compiling
      # ko from source. Its deps are not in any matrix module's go.sum, so setup-go's
      # per-module cache cannot hold them and the fallback recompiles on every job that
      # takes it. Fast path first, working path second.
      #
      # Both paths are pinned to KO_VERSION and both are integrity-checked: the tarball
      # against KO_SHA256, and `go install` against the Go checksum database, which is a
      # transparency log rather than a digest written down here. GOWORK=off matches how
      # this workflow already installs actionlint — without it the tool resolves against
      # this repo's workspace instead of its own module graph. GOWORK=off also discards
      # go.work's `toolchain` line, but setup-go has already installed the version named
      # in go.work, which satisfies ko's own floor; a box whose default toolchain is
      # older just downloads one via GOTOOLCHAIN rather than failing.
      - name: Install ko (pinned, verified, two sources)
        env:
          KO_VERSION: v0.19.1
          KO_SHA256: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
        run: |
          set -euo pipefail
          url="https://github.com/ko-build/ko/releases/download/${KO_VERSION}/ko_${KO_VERSION#v}_Linux_x86_64.tar.gz"
          dest="${RUNNER_TEMP}/ko-bin"
          mkdir -p "$dest"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --connect-timeout 15 \
                 -o "${RUNNER_TEMP}/ko.tar.gz" "$url"; then
              if echo "${KO_SHA256}  ${RUNNER_TEMP}/ko.tar.gz" | sha256sum -c -; then
                tar xzf "${RUNNER_TEMP}/ko.tar.gz" -C "$dest" ko
                echo "$dest" >> "$GITHUB_PATH"
                "$dest/ko" version
                exit 0
              fi
              echo "::warning::ko checksum mismatch on attempt ${attempt} (truncated or corrupt download)"
            fi
            echo "ko install attempt ${attempt} failed; retrying"
            rm -f "${RUNNER_TEMP}/ko.tar.gz"
            sleep $((attempt * 5))
          done

          echo "::warning::release asset unavailable after 3 attempts; building ${KO_VERSION} from the Go module proxy"
          GOWORK=off GOBIN="$dest" hack/go-mod-download.sh --retry -- go install "github.com/google/ko@${KO_VERSION}"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/ko" version

      - name: ko build (local, no push)
        working-directory: ${{ matrix.module }}
        env:
          KO_DOCKER_REPO: ghcr.io/devicechain-io
          # Built through hack/ko-build.sh, which points ko at the repo's .ko.yaml (ko reads
          # it from its working directory only; this step runs in the module directory).
          # 🔴 THE BROKER IS BUILT REPRODUCIBLY, so a release that did not change it publishes the
          # SAME digest and does not roll it: from its own go.mod (GOWORK=off; in workspace mode it
          # would link whatever versions the whole workspace selects, so a bump in an unrelated
          # module would change it) and with no VCS stamp (-buildvcs=false; the revision would make
          # every commit a new binary, and nats-server reports it as its git_commit). Every path that
          # builds the broker sets both: backend/broker/dc-nats-server/build_paths_test.go checks.
          GOWORK: ${{ matrix.module == 'backend/broker/dc-nats-server' && 'off' || '' }}
          GOFLAGS: ${{ matrix.module == 'backend/broker/dc-nats-server' && '-buildvcs=false' || '' }}
        # --local loads to the runner's Docker daemon and never pushes to a
        # registry. --base-import-paths keeps the local tag deterministic.
        #
        # Retry with backoff: the distroless base (cgr.dev/chainguard/static)
        # lives on a public registry that intermittently returns
        # MANIFEST_UNKNOWN for the :latest tag, flaking otherwise-green builds.
        # The retry absorbs those transient blips without masking a real
        # build failure (which fails all three attempts deterministically).
        run: |
          for attempt in 1 2 3; do
            if "$GITHUB_WORKSPACE/hack/ko-build.sh" --local --base-import-paths ./; then
              exit 0
            fi
            echo "::warning::ko build attempt ${attempt}/3 failed (likely a transient base-image registry blip); retrying..." >&2
            sleep $((attempt * 15))
          done
          echo "::error::ko build failed after 3 attempts" >&2
          exit 1

      # The break-glass path, in the REAL image. `dcctl instances break-glass mfa-reset` execs the
      # service binary at a fixed path inside the pod; ko names that binary after the last element
      # of the main package's import path (dc-user-management, not user-management), and nothing
      # but a built image can say so. This step runs the path the command uses, taken from the
      # constant itself, and expects the subcommand's own refusal outside a pod: that proves the
      # path exists AND that main hands `break-glass` to the subcommand instead of starting the
      # service. A wrong path fails at docker run, not at an operator's worst moment.
      - name: break-glass subcommand exists at the path dcctl execs
        if: matrix.module == 'backend/services/user-management'
        working-directory: ${{ matrix.module }}
        env:
          KO_DOCKER_REPO: ghcr.io/devicechain-io
        run: |
          set -euo pipefail
          bin="$(sed -n 's/^[[:space:]]*userManagementBinary[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/backend/cli/bootstrap/breakglass.go")"
          [ -n "$bin" ] || { echo "::error::userManagementBinary not found in backend/cli/bootstrap/breakglass.go"; exit 1; }
          img="$("$GITHUB_WORKSPACE/hack/ko-build.sh" --local --base-import-paths ./ | tail -n 1)"
          echo "image: $img  binary: $bin"
          set +e
          out="$(docker run --rm --entrypoint "$bin" "$img" break-glass mfa-reset --email x@example.com 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "::error::expected exit 1 (the subcommand's refusal), got $rc"; exit 1; }
          echo "$out" | grep -q "inside a user-management pod" || { echo "::error::the refusal was not the break-glass subcommand's"; exit 1; }

      # The watcher for the config line above. Builds ONE image (the operator, whose modules
      # this job has already downloaded) and reads the base ko recorded in it; it must be the
      # digest .ko.yaml pins. Without KO_CONFIG_PATH it records the bare tag and fails.
      - name: ko build uses the pinned base
        if: matrix.module == 'backend/k8s'
        env:
          KO_CHECK_MODULE: backend/k8s
        run: hack/check-ko-base-used.sh

      # The broker image is the one image whose job is on the wire, so it is RUN, not only
      # built: the module's tests run an embedded server, and this runs what the release
      # publishes (ko's build, the base image, its non-root user and its PATH) in a container
      # and checks it from outside — the device certificate request and the callout seeing the
      # chain, token devices unaffected, a SIGHUP and `-sl=reload` keeping the setting, the
      # chart's preStop `nats-server -sl=ldm` reaching a clean exit, and the negative control:
      # the same checks must FAIL against the upstream image. See hack/broker-image-smoke.sh.
      - name: broker image smoke (run it, then the upstream negative control)
        if: matrix.module == 'backend/broker/dc-nats-server'
        working-directory: ${{ matrix.module }}
        env:
          KO_DOCKER_REPO: ko.local/dc-nats-server
          # 🔴 THE BROKER IS BUILT REPRODUCIBLY, so a release that did not change it publishes the
          # SAME digest and does not roll it: from its own go.mod (GOWORK=off; in workspace mode it
          # would link whatever versions the whole workspace selects, so a bump in an unrelated
          # module would change it) and with no VCS stamp (-buildvcs=false; the revision would make
          # every commit a new binary, and nats-server reports it as its git_commit). Every path that
          # builds the broker sets both: backend/broker/dc-nats-server/build_paths_test.go checks.
          GOWORK: "off"
          GOFLAGS: -buildvcs=false
        run: |
          set -euo pipefail
          ref=""
          for attempt in 1 2 3; do
            if ref="$("$GITHUB_WORKSPACE/hack/ko-build.sh" --bare --local --platform=linux/amd64 ./ | tail -n1)" && [ -n "$ref" ]; then
              break
            fi
            echo "::warning::ko build attempt ${attempt}/3 failed; retrying..." >&2
            ref=""
            sleep $((attempt * 15))
          done
          [ -n "$ref" ] || { echo "::error::could not build the broker image" >&2; exit 1; }
          echo "built $ref"
          "$GITHUB_WORKSPACE/hack/broker-image-smoke.sh" "$ref"

      # A release that did not change the broker must not roll it, which needs the broker's
      # image to be a function of its own inputs and not of the commit. Build it at a SECOND
      # commit that changes nothing under the module (an empty commit: every VCS stamp moves)
      # and require the same image; then build once more WITHOUT -buildvcs=false and require a
      # DIFFERENT one, so a gate that could not see a stamp cannot pass. See
      # hack/broker-image-reproducible.sh.
      - name: broker image is reproducible across commits
        if: matrix.module == 'backend/broker/dc-nats-server'
        run: hack/broker-image-reproducible.sh

  # ---------------------------------------------------------------------------
  # API compatibility: does this change break a client written against the last
  # release? Every served GraphQL schema is compared with the same schema at the last
  # release on HEAD's line (hack/api-baseline.sh: on main, the newest minor, though it
  # was tagged on a release branch main never contains); a breaking change fails unless it
  # is declared in backend/tools/docsgql/sdlcompat/breaks.txt with a reason, and every
  # @deprecated must carry a reason that names the replacement. The same comparison
  # runs for the dcctl command tree (commands, aliases, flags), the device wire contract
  # (the contract/*.schema.json files) and the topic layout a device is granted; Helm
  # values and the Instance CRDs are reported and never fail. Each surface declares an
  # intended break in its own breaks.txt under backend/tools/docsgql. The public C# SDK
  # (PublicAPI.Shipped/Unshipped.txt, enforced by the build) and the five published npm
  # packages (committed API reports in frontend/api, compared with the last release) are
  # covered the same way; the release guard then refuses a release that has a live
  # declaration unless its highlights say so, and a declared removal must have been
  # deprecated for two minor releases (enforced from 1.0.0).
  # ---------------------------------------------------------------------------
  api-compat:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 — the baseline is a release TAG. On the default shallow clone
      # no tag is visible and the check (correctly) refuses to compare against nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      - name: go mod download
        run: hack/go-mod-download.sh backend/tools/docsgql backend/cli backend/core

      # End to end on the real served schemas, through the script and the built command:
      # identical trees pass with zero changes, a planted field removal fails naming the
      # field, a declaration covers it, and expired and stale declarations behave. Runs
      # first, so the green result below is known to be one that can fail.
      - name: GraphQL compatibility check self-test
        run: hack/check-graphql-compat.sh --self-test

      - name: Served GraphQL schemas are compatible with the last release
        run: hack/check-graphql-compat.sh

      # The same shape for the surfaces beyond GraphQL. Each self-test plants a break in a
      # copy of the working tree and must see it fail naming the element (and, for the
      # report-only surfaces, see it printed with a zero exit), so each green step after it
      # is known to be one that can fail.
      - name: dcctl compatibility check self-test
        run: hack/check-cli-compat.sh --self-test

      - name: dcctl accepts everything it accepted at the last release
        run: hack/check-cli-compat.sh

      - name: Schema compatibility check self-test
        run: hack/check-schema-compat.sh --self-test

      - name: Device wire contract is compatible with the last release
        run: hack/check-schema-compat.sh contract

      - name: Device topic layout is compatible with the last release
        run: hack/check-schema-compat.sh topics

      # Report only: Helm values and the Instance CRDs are not covered by the versioning
      # policy. A change prints here and never fails; it belongs in the release highlights.
      - name: Helm values schema and Instance CRD changes (report only)
        run: hack/check-schema-compat.sh reports

      # The C# SDK. The analyzer is the mechanism (a public symbol in neither PublicAPI file
      # fails the build; a removed one fails it too, until it is declared with *REMOVED*); the
      # script adds what the analyzer trusts: that PublicAPI.Shipped.txt really IS the API the
      # last release shipped (rebuilt from that tag's sources the first time, since it predates
      # the files), and that no declaration is stale. The self-test plants an undeclared type, a
      # removed member and a hand-edited Shipped file and must see each fail.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: C# API check self-test
        run: hack/check-csharp-api.sh --self-test

      - name: The C# SDK exposes everything it exposed at the last release
        run: hack/check-csharp-api.sh

      # The npm packages. api-extractor cannot run against the native TypeScript compiler this
      # repo pins, so the reports are read from the emitted declarations by a small tool with its
      # own TypeScript (hack/api-report). The reports are committed (frontend/api): a change
      # nobody meant fails as drift, and one compared with the last release's own rebuilt
      # declarations fails unless declared in frontend/api/breaks.txt.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            hack/api-report/package-lock.json

      - name: Install the frontend and the API report tool
        run: |
          npm ci --prefix frontend
          npm ci --prefix hack/api-report

      - name: Build the publishable packages
        run: npm run build:packages --prefix frontend

      - name: npm API tool unit tests
        run: node --test hack/api-report/compat.test.mjs

      - name: npm API check self-test
        run: hack/check-npm-api.sh --self-test

      - name: The npm packages export everything they exported at the last release
        run: hack/check-npm-api.sh

      # The release half and the deprecation window. Every declaration above is listed by one
      # script; the release guard refuses a release that has a live one unless its highlights
      # say it breaks (and, from 1.0.0, unless it is a new major), and a removal is allowed only
      # after the element has been deprecated for two minor releases.
      - name: Declared-breaks listing self-test
        run: hack/api-declared-breaks.sh --self-test

      - name: Deprecation window self-test
        run: hack/check-deprecation-window.sh --self-test

      - name: Declared removals are inside the deprecation window
        run: hack/check-deprecation-window.sh

  # ---------------------------------------------------------------------------
  # The payload decoder is a pure function of (document, input), and the readings it stores
  # must be byte-identical whichever CPU a replica runs on (a float operation fused into an
  # FMA on arm64 and not on amd64 is exactly the way two replicas would disagree about the
  # same uplink). backend/core/payloaddecode/testdata/determinism.golden was written on
  # amd64; the `go` matrix above runs the comparison on amd64, and this job runs it on a
  # native arm64 runner. A runner that is not arm64 fails loudly rather than comparing
  # amd64 with itself.
  # ---------------------------------------------------------------------------
  payloaddecode-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # backend/core is self-contained, so this job resolves and builds it alone (GOWORK=off)
      # instead of downloading every module in the workspace.
      - name: go mod download (backend/core)
        working-directory: backend/core
        env:
          GOWORK: "off"
        run: go mod download

      - name: the runner is arm64
        run: test "$(go env GOARCH)" = arm64

      - name: decoder output is identical to the amd64 golden
        working-directory: backend/core
        env:
          GOWORK: "off"
        run: go test ./payloaddecode -run 'Determinism' -count=1 -v

  # ---------------------------------------------------------------------------
  # Video recorder (hack/video-capture): the pure parts of the unattended console recorder -- shot-list
  # schema validation, target and mask building, the manifest and timeline, credential reading and the
  # redaction of its errors. No browser and no credential: the browser path is a maintainer-run recording
  # against a console.
  # ---------------------------------------------------------------------------
  video-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Recorder unit tests
        working-directory: hack/video-capture
        run: |
          python3 -c 'import yaml' # PyYAML ships on the runner image; fail here, not mid-test
          python3 -m unittest -v test_video_capture

      - name: Shipped shot lists validate
        working-directory: hack/video-capture
        run: |
          for f in shots/*.yaml; do python3 video_capture.py check "$f"; done

  # ---------------------------------------------------------------------------
  # The single required check.
  #
  # This job exists so branch protection has ONE stable name to require. The
  # alternative — listing the individual jobs — drifts silently in both
  # directions, and 38 of the ~56 check names are matrix-generated from the
  # workspace module list: adding a service leaves its `go (…)` check unrequired
  # (so it may go red and still merge), and removing one leaves a required name
  # that never reports again (so every PR waits forever).
  #
  # 🔴 `if: always()` IS LOAD-BEARING, AND WITHOUT IT THIS JOB IS WORSE THAN
  # NOTHING. A job whose `needs` failed is SKIPPED, not failed — and GitHub counts
  # a skipped required check as satisfied. So the obvious spelling of this job
  # (no `if:`, no body) reports success on exactly the runs it exists to block,
  # and does so while looking green in the UI. `always()` makes it run regardless,
  # and the step below is what turns the upstream results into a verdict.
  #
  # 🔴 The `needs` list is hand-written because Actions has no "needs: every job".
  # That is the same drift hazard one level up, so hack/check-ci-gate-complete.sh
  # asserts the list names every job in this file, and runs in the `actions` job.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The fleet runner (backend/fleet/tofurun): the server-side OpenTofu runner library, run against
  # a real OpenTofu at the pinned version and a real PostgreSQL (state backend and writer slot).
  # Behind the build tag fleetpg; the COUNT of passed TestFleetPG* tests is asserted per package,
  # because without the tag the tests are not compiled and a mistyped tag would report success over
  # nothing. A missing tofu or a missing database FAILS those tests; they never skip.
  # ---------------------------------------------------------------------------
  fleet-runner:
    needs: discover
    # Skipped when the diff reaches nothing the runner builds from or runs against (hack/ci-select.py
    # FLEET_RUNNER_INPUTS); ci-complete accepts the skip only with a successful discover that said so.
    if: needs.discover.outputs.fleet_runner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          # The action's default Node wrapper sits ahead of the real binary on PATH and breaks
          # stdin handling; the runner library execs the binary itself.
          tofu_wrapper: false
          # The premise record's version, and tofurun.PinnedVersion.
          tofu_version: 1.10.10

      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      - name: PostgreSQL
        run: |
          docker run -d --name fleet-runner-pg -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:55432:5432 postgres:16
          for _ in $(seq 1 60); do
            docker exec fleet-runner-pg pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready"
          exit 1

      - name: runner suite (real OpenTofu, real PostgreSQL)
        working-directory: backend/fleet
        env:
          DC_FLEET_PG_DSN: postgres://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable
        run: |
          set -o pipefail
          DC_FLEET_TOFU="$(command -v tofu)"
          export DC_FLEET_TOFU
          go test -tags fleetpg -count=1 -timeout 20m -json ./tofurun | ../../hack/check-fleetpg-count.sh TestFleetPG 1 10
          go test -tags fleetpg -count=1 -timeout 20m -json ./tofurun/slotfence | ../../hack/check-fleetpg-count.sh TestFleetPG 1 5

      # The image itself, built for real: the pinned tofu verified against its checksum, the roots
      # baked with their lock files and providers mirrored, the runner's own layout check run in
      # the build. The context is only what the Dockerfile copies.
      - name: runner image builds and checks itself
        run: |
          ctx="$(mktemp -d)"
          mkdir -p "$ctx/backend/core" "$ctx/deploy/opentofu/modules"
          cp backend/core/go.mod backend/core/go.sum "$ctx/backend/core/"
          cp -r backend/fleet "$ctx/backend/fleet"
          cp -r deploy/fleet "$ctx/deploy/fleet"
          cp -r deploy/opentofu/modules/gke-cluster "$ctx/deploy/opentofu/modules/gke-cluster"
          docker build -f "$ctx/backend/fleet/tofurun/image/Dockerfile" -t fleet-runner:ci "$ctx"
          docker run --rm fleet-runner:ci check

      - name: remove PostgreSQL
        if: always()
        run: docker rm -f fleet-runner-pg

  # ---------------------------------------------------------------------------
  # The install terminal UI on a real Windows console. Its packages and the cmd package run
  # natively on windows-latest: the console probe, the console modes, the stdin gate and the
  # Ctrl+C path are Windows code that the Linux legs only compile (go vet for GOOS=windows).
  # cmd includes TestInstallOnAConPTY, which runs dcctl on a pseudo console (ConPTY) through
  # --help, --dry-run and the terminal UI itself, and checks the console's modes are restored;
  # its count is asserted, because a test that skipped (no pseudo console) would otherwise read
  # as a pass. No envtest: apiserver_render_test.go is !windows. No -race: the Linux legs race
  # the same packages, and the race detector on Windows needs cgo for no new coverage.
  # ---------------------------------------------------------------------------
  tui-windows:
    needs: discover
    # Skipped when the diff reaches nothing in backend/cli that the terminal UI compiles, nor the
    # install command or its preflight, nor a Windows-only Go file in backend/cli (hack/ci-select.py
    # TUI_WINDOWS_* and windows_only); ci-complete accepts the skip only with a successful discover
    # that said so.
    if: needs.discover.outputs.tui_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # The goldens are compared byte for byte; a checkout that converts line endings is not the
      # tree that was reviewed.
      - name: no line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      - name: terminal UI and install command tests (windows)
        working-directory: backend/cli
        run: |
          set -o pipefail
          go test -count=1 -p 2 -timeout 20m ./internal/installtui/... ./internal/installflow/... ./internal/installplain ./internal/installchoice ./internal/proctree ./cmd

      - name: ConPTY smoke test ran and passed
        working-directory: backend/cli
        run: |
          set -o pipefail
          go test -count=1 -timeout 10m -json -run '^TestInstallOnAConPTY$' ./cmd | ../../hack/check-fleetpg-count.sh TestInstallOnAConPTY 6 1

  ci-complete:
    name: ci-complete
    if: always()
    runs-on: ubuntu-latest
    needs:
      - discover
      - self-tests
      - go
      - subscriptions
      - http-routing
      - data-access
      - migrations
      - migrations-timescaledb-next
      - integration
      - license
      - actions
      - docs
      - frontend
      - csharp
      - unity-compile-check
      - sim-traffic
      - demo-platform
      - demo-hud
      - towerpulse-model
      - harborpulse-model
      - helm
      - opentofu
      - fleet-runner
      - tui-windows
      - image-smoke
      - api-compat
      - payloaddecode-arm64
      - video-capture
    steps:
      # ANY result other than success fails the gate, including `skipped` and
      # `cancelled` — with exactly five exceptions, each tied to discover's own
      # answer: `go` may be skipped when discover SUCCEEDED and planned zero Go legs,
      # `integration` when it succeeded and planned zero integration legs,
      # `image-smoke` when it succeeded and planned zero images, `frontend` when it
      # succeeded and said the diff reaches nothing the frontend reads, and the two
      # `migrations` jobs when it succeeded and said `migrations` is false. A skip for
      # any other reason (an upstream failed, the run was cancelled, discover failed
      # and so produced no plan) still blocks: the exception reads the plan, never the
      # absence of one.
      #
      # 🔴 AND A DRAFT RUN FAILS, whatever else passed. A draft plans none of the heavy
      # jobs, so every skip above is "planned" — and a green gate on that head would
      # still be a green `ci-complete` on the commit when the pull request is marked
      # ready, until the ready_for_review run replaces it. So the gate passes only when
      # discover said, explicitly, `draft=false`; "true", a missing value or anything
      # else fails it. GitHub refuses to merge a draft in any case; this keeps its run
      # from ever counting as the check.
      # The results arrive through the environment rather than interpolated into
      # the script, so nothing from the workflow context is ever executed as shell.
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort > /tmp/results
          if [ ! -s /tmp/results ]; then
            echo "::error::no upstream results were reported; this gate examined nothing"
            exit 1
          fi
          column -t /tmp/results || cat /tmp/results
          # skip_ok <job> prints the reason a skipped <job> is intended, or nothing.
          skip_ok() {
            jq -r --arg job "$1" '
              .discover as $d
              | if $d.result != "success" then empty
                elif $job == "go" and $d.outputs.go_legs == "[]" then "discover planned no Go legs"
                elif $job == "integration" and $d.outputs.integration == "[]" then "discover planned no integration legs"
                elif $job == "image-smoke" and $d.outputs.smoke == "[]" then "discover planned no image-smoke legs"
                elif $job == "frontend" and $d.outputs.frontend == "false" then "the diff reaches nothing the frontend reads"
                elif $job == "fleet-runner" and $d.outputs.fleet_runner == "false" then "the diff reaches nothing the fleet runner builds from or runs against"
                elif $job == "tui-windows" and $d.outputs.tui_windows == "false" then "the diff reaches nothing the install terminal UI compiles in backend/cli"
                elif ($job == "migrations" or $job == "migrations-timescaledb-next") and $d.outputs.migrations == "false" then "the diff reaches nothing migration-diff.sh compiles"
                else empty end' <<<"$NEEDS"
          }
          bad=0
          while IFS=$'\t' read -r result job; do
            [ "$result" = success ] && continue
            if [ "$result" = skipped ] && why="$(skip_ok "$job")" && [ -n "$why" ]; then
              echo "  $job skipped on purpose: $why"
              continue
            fi
            echo "::error::$job: $result"
            bad=1
          done < /tmp/results
          if [ "$bad" -ne 0 ]; then
            echo "::error::one or more required jobs did not succeed (see the table above)"
            exit 1
          fi
          draft="$(jq -r '.discover.outputs.draft // "(missing)"' <<<"$NEEDS")"
          if [ "$draft" != false ]; then
            if [ "$draft" = true ]; then
              echo "::error::this is a DRAFT pull request: the go, integration, image-smoke and migrations jobs did not run. Mark it ready for review to run them."
            else
              echo "::error::discover's draft verdict is '$draft', not true or false; this gate cannot tell whether the heavy jobs were meant to run"
            fi
            exit 1
          fi
          echo "all $(wc -l < /tmp/results) jobs succeeded or were skipped by the plan"
