    count: Int!
}

"""Which integration's unregistered devices to return, and the page. Most recently seen first."""
input UnregisteredIntegrationDeviceSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
    """Token of the integration. An unknown token matches nothing."""
    integration: String!
}

"""A page of unregistered devices."""
type UnregisteredIntegrationDeviceSearchResults {
    """The unregistered devices on this page."""
    results: [UnregisteredIntegrationDevice!]!
    """Where this page sits in the whole result."""
    pagination: SearchResultsPagination!
}

"""
A device's possession claim: a one-time, optionally expiring secret that an eventual owner presents
to assign the device to a customer. The claim secret is write-only and is never exposed on this
type; only a keyed digest is stored.
"""
type DeviceClaim implements Model {
    """Server-assigned numeric identifier, as a string."""
    id: ID!
    """When the claim was first opened, as an RFC 3339 timestamp."""
    createdAt: String
