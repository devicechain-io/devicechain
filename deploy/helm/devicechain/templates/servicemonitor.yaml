{{/*
One ServiceMonitor per enabled functional area (gated on metrics.enabled).
Metrics use the dedicated ops port 8083, so each monitor
selects the area's Service and scrapes its named `ops` port at /metrics.
ServiceMonitor is a Prometheus-Operator CRD; this whole file is skipped when
metrics.enabled is false (set it false on clusters without those CRDs).
*/}}
{{- if .Values.metrics.enabled }}
{{- $root := . -}}
{{- range $area := splitList "," (include "devicechain.enabledAreas" .) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $area }}
  namespace: {{ include "devicechain.instanceNamespace" $root }}
  labels:
    {{- include "devicechain.areaLabels" (dict "root" $root "area" $area) | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "devicechain.instanceNamespace" $root }}
  selector:
    matchLabels:
      {{- include "devicechain.areaLabels" (dict "root" $root "area" $area) | nindent 6 }}
  endpoints:
    - port: ops
      path: /metrics
{{- end }}
{{- end }}
