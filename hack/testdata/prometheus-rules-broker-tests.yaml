#
# Unit tests for deploy/helm/devicechain/templates/prometheusrule-broker.yaml, run by
# hack/check-prometheus-rules.sh against the rendered rule (rendered-rules.yaml).

rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  - name: a healthy broker requesting certificates stays quiet
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_info{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics", library_version="2.15.1", build="go1.27.3-abc"}'
        values: '1x40'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-0"}'
        values: '12x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a listener that stops requesting certificates fires after ten minutes, and clears
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-1", container="nats", endpoint="dc-metrics"}'
        values: '1x60'
      # Requesting for 5 minutes, then the reload trap for 30, then requesting again.
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-1", container="nats", endpoint="dc-metrics"}'
        values: '1x5 0x30 1x25'
      - series: 'dc_broker_info{namespace="dci-devicechain", pod="dc-nats-1", container="nats", endpoint="dc-metrics", library_version="2.15.1", build="go1.27.3-abc"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 14m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []
      - eval_time: 17m
        alertname: BrokerMqttClientAuthLost
        exp_alerts:
          - exp_labels: &trap_labels
              severity: warning
              devicechain_instance: devicechain
              namespace: dci-devicechain
              pod: dc-nats-1
            exp_annotations: &annotations
              summary: "the broker is not requesting device client certificates"
              description: "The broker server named by the pod label is not asking MQTT devices for a client certificate, so devices that authenticate by certificate cannot connect. Devices that use a token or a password are not affected. Either the server is running but its MQTT listener stopped requesting certificates (a configuration reload that did not keep the setting, or the broker's own check of its listener keeps failing; its log says which), or the server is not running the DeviceChain broker image, for example after a rollback to the upstream nats image. Check the server's image with kubectl get pod -o jsonpath='{.spec.containers[0].image}'. On the DeviceChain image, restart the server pod, and report the log lines around the last configuration reload. On the upstream image, certificate devices stay refused until the DeviceChain image is restored."
      - eval_time: 38m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a short dip, such as a broker restart, does not fire
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-2", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-2", container="nats", endpoint="dc-metrics"}'
        values: '1x10 0x8 1x22'
    alert_rule_test:
      - eval_time: 20m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a listener without TLS cannot request a certificate, and is not this failure
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '0x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '0x40'
      - series: 'dc_broker_info{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics", library_version="2.15.1", build="go1.27.3-abc"}'
        values: '1x40'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-0"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a broker pod running the upstream image fires
    interval: 1m
    input_series:
      # The exporter reports the server; the DeviceChain broker's own series are absent.
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-0"}'
        values: '7x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []
      - eval_time: 15m
        alertname: BrokerMqttClientAuthLost
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              namespace: dci-devicechain
              pod: dc-nats-0
            exp_annotations: *annotations

  - name: another namespace's broker is not this instance's
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-other", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-other", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '0x40'
      - series: 'nats_varz_connections{namespace="dci-other", pod="dc-nats-1", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-1"}'
        values: '7x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: no broker series at all (monitoring of the broker off) stays quiet
    interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  # Leadership after a rolling restart: dc-nats-0 (restarted last) leads nothing, dc-nats-1 and
  # dc-nats-2 lead six replicated streams each. dc-nats-0 has no is_stream_leader="true" series at
  # all, so only the connection series reveals that it exists; the rule has to count it as zero.
  # Only streams the rebalancer may move are counted, and only those the services report at more
  # than one replica.
  - name: a server that leads nothing fires after thirty minutes, and clears once leadership is even
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x120'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x120'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-2"}'
        values: '10x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_resolved-events"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_derived-events"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_alarm-events"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-attribute"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-commands"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-desired"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-roster"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_entity-deleted"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_raise-alarm"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_failed-events"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_dead-letters"}'
        values: '3x120'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_max-deliveries"}'
        values: '3x120'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_derived-events", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_alarm-events", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-attribute", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-commands", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-desired", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_device-roster", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_entity-deleted", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_raise-alarm", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_failed-events", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_dead-letters", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_max-deliveries", is_stream_leader="true"}'
        values: '1x60 stale'
      # Minute 60: the rebalance ran; every server leads four of the twelve.
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_resolved-events", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_derived-events", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_device-roster", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_entity-deleted", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_raise-alarm", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_failed-events", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_dead-letters", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_max-deliveries", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_alarm-events", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_device-attribute", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_device-commands", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="devicechain_device-desired", is_stream_leader="true"}'
        values: '_x60 1x59'
    alert_rule_test:
      - eval_time: 25m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []
      - eval_time: 40m
        alertname: BrokerLeadershipImbalanced
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "one broker server leads far fewer streams than the others"
              description: "At least one broker server leads fewer than half the streams an even share would give it, so the others carry the replication and acknowledgement work for it. Only the streams that dcctl is allowed to move are counted: this instance's replicated streams other than the device-ingest ones (the broker's MQTT streams, the device capture stream and every stream an ingest area writes), which are never rebalanced because a leader change on them can lose messages already acknowledged to a device. After a rolling restart of the broker the server restarted last leads nothing, and at the load this was measured under that doubled publish acknowledgement latency and cost a few percent of HTTP ingest. dcctl upgrade evens leadership out after it rolls the broker, so this fires after a restart done any other way (a node drain, a pod loss, a manual rollout), or when that step was skipped or warned. Run dcctl broker rebalance <instance> to even it out; each move is a brief election for one stream. If it keeps returning, check the broker pods for repeated restarts."
      - eval_time: 100m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []

  # The ingest streams are never rebalanced, so an imbalance on them alone must not page: the alert
  # could never clear. dc-nats-0 leads none of them, dc-nats-1 leads them all.
  - name: an imbalance on the ingest streams alone stays quiet
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-2"}'
        values: '10x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_inbound-events", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_inbound-events"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-events-capture"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-reports", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-reports"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_command-responses", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_command-responses"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_failed-decode", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_failed-decode"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="$MQTT_msgs", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="$MQTT_msgs"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="$MQTT_rmsgs", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="$MQTT_rmsgs"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="$MQTT_out", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="$MQTT_out"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="$MQTT_sess", is_stream_leader="true"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="$MQTT_sess"}'
        values: '3x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []

  - name: an evenly led broker stays quiet
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_resolved-events"}'
        values: '3x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_derived-events"}'
        values: '3x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_alarm-events"}'
        values: '3x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-attribute"}'
        values: '3x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_resolved-events", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_derived-events", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_alarm-events", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-attribute", is_stream_leader="true"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []

  # Single-replica streams cannot be moved, so they are not judged: a server leading none of them is
  # what a broker with replica factor one looks like.
  - name: single-replica streams are not judged
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-2"}'
        values: '10x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_resolved-events"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_derived-events"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_alarm-events"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-attribute"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-commands"}'
        values: '1x60'
      - series: 'devicechain_eventprocessing_jetstream_replicas_actual{namespace="dci-devicechain", pod="dc-event-processing-0", job="devicechain/event-processing", stream="devicechain_device-desired"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_derived-events", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_alarm-events", is_stream_leader="true"}'
