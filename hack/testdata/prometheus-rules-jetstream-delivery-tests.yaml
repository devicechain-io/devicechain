#
# promtool UNIT TESTS for the JetStream delivery alerting rules (the jetstream-delivery group).
#
# WHAT THESE ARE FOR, over and above the parse check
#
# JetStreamDurableLostUnread is increase() over a counter that EVERY replica of a service
# keeps for the same durable, and that a pod restart resets to 0. Two properties follow,
# and both are pinned here:
#
#   - it must page on the FIRST loss after a counter appears. The counter is created at
#     0 when the reader is, so the first loss is an increase from 0 like any other; the
#     scenario below starts the series at 0 for exactly that reason.
#   - a series that APPEARS at n and stays flat must NOT page. That is what a pod
#     restart looks like from Prometheus's side (increase() treats the drop to a fresh
#     counter as a reset), and a restart is not a loss. A series that goes from n to
#     n+k after the restart must page.
#
# JetStreamStreamNearFull was widened from one service's streams to every service's.
# The fill case below is read from device-state's series, which the old selector —
# named for event-processing — could not see at all.
#
# THE SERIES, and what is known about each:
#
#   - devicechain_<area>_jetstream_consumer_unread_skipped_total{stream,durable} — a
#     CounterVec created at 0 per durable when the reader is constructed.
#   - devicechain_<area>_jetstream_consumer_unread_gap_messages{stream,durable} — a
#     GaugeVec created at 0 at the same moment. The quiet scenarios carry both AT ZERO
#     rather than omitting them: an alert silent because its series is missing and one
#     silent because nothing was lost look identical, and only one is a working alert.
#   - devicechain_<area>_jetstream_stream_used_bytes / _limit_bytes{stream} — gauges.
#
# ReaderHeldMessagePastAckWait watches a counter that should read 0 for the whole
# life of a healthy instance, so the quiet cases carry as much weight as the firing
# one: a pod whose counter sits at zero, and a pod whose ONE old occurrence has aged
# out of the window, must both stay silent. Unlike the unread counter it is summed
# across pods (each pod counts only the messages it held); the two-pod scenario
# fires ONE alert per durable and stage, not one per pod.
#
#   - devicechain_<area>_reader_held_past_ack_wait_total{durable,stage} -- a
#     CounterVec built by core messaging, exported under each adopting service's own
#     subsystem. Both stage series (worker, buffer) are initialised at 0 when a
#     capacity-bounded reader is created, so they EXIST on a healthy instance rather
#     than being absent; the quiet scenarios carry them at zero for the reason given
#     for the unread series above.
#   - devicechain_<area>_max_delivery_records_total{stream,outcome} -- a CounterVec
#     the max-delivery recorder keeps. ReplayCoveredDeliveriesExhausted reads only
#     outcome="replay-covered", which exists at 0 from the recorder's start for a
#     stream the area is declared replay-covered on. An area's replicas share one
#     recorder durable, so each exhaustion is counted by ONE pod: the rule sums.
#   - devicechain_<area>_jetstream_stream_used_messages{stream} -- the stream-fill gauge
#     every service reports for each stream it ensures. MaxDeliveryRecordsWaiting reads
#     it for the max-delivery capture only, a work queue whose count is the backlog of
#     abandoned deliveries nobody has recorded; every area samples it, so it arrives
#     from several pods at once with the same value.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml.
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # A live consumer loses messages to a full stream. Both replicas of the
  # reading service count the same removal; the alert is one per durable.
  #
  #   minutes  0- 9   flat at 0
  #   minute  10      5 unread messages stepped over
  #   minute  20      7 more
  #   minutes 21+     flat
  # ------------------------------------------------------------------
  - name: a durable that stepped over unread messages pages
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-aaaaa", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x9 5x9 12x60'
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-bbbbb", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x9 5x9 12x60'
      # Another service reading the same stream and keeping up: at 0 throughout.
      - series: 'devicechain_devicemanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-ccccc", job="devicechain/device-management", stream="devicechain_alarm-events", durable="devicechain_device-management_alarm-events"}'
        values: '0x80'
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_gap_messages{namespace="dci-devicechain", pod="dc-notification-management-7c9f-aaaaa", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      - eval_time: 12m
        alertname: JetStreamDurableLostUnread
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_alarm-events
              durable: devicechain_notification-management_alarm-events
            exp_annotations:
              summary: "a consumer lost messages it never read"
              description: "Durable devicechain_notification-management_alarm-events on stream devicechain_alarm-events stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamStreamNearFull and the consumer's own backlog tell the two apart."
      # 🔑 IT CLEARS ONCE THE WINDOW ROLLS PAST THE LAST LOSS. Widening the
      # window would make a one-off loss page for hours; this fails if it does.
      - eval_time: 45m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      # The gap gauge sat at 0 throughout: a live consumer has no standing gap.
      - eval_time: 12m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 A POD RESTART IS NOT A LOSS. The restarted pod's counter appears at a
  # value (here 7, from the counter's lifetime on this exact labelset before a
  # scrape gap) and stays flat. increase() over a flat series is 0.
  # ------------------------------------------------------------------
  - name: a counter that appears at n and stays flat is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_outboundconnectors_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch", durable="devicechain_outbound-connectors_connector-dispatch"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      - eval_time: 30m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []

  # ------------------------------------------------------------------
  # ...and one that goes from n to n+k afterwards IS a loss.
  # ------------------------------------------------------------------
  - name: a counter that rises from n pages
    interval: 1m
    input_series:
      - series: 'devicechain_outboundconnectors_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch", durable="devicechain_outbound-connectors_connector-dispatch"}'
        values: '7x10 9x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamDurableLostUnread
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_connector-dispatch
              durable: devicechain_outbound-connectors_connector-dispatch
            exp_annotations:
              summary: "a consumer lost messages it never read"
              description: "Durable devicechain_outbound-connectors_connector-dispatch on stream devicechain_connector-dispatch stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamStreamNearFull and the consumer's own backlog tell the two apart."

  # ------------------------------------------------------------------
  # A stalled durable with messages already discarded ahead of it.
  #
  #   minutes 0- 4   gap 0
  #   minutes 5-24   gap 18 (the consumer was handed nothing; the stream kept discarding)
  #   minutes 25+    gap 0  (it resumed and stepped over the hole)
  # ------------------------------------------------------------------
  - name: a stalled durable behind a discarding stream pages after 2m
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_unread_gap_messages{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0x4 18x19 0x30'
      # A second durable at 0 must not appear in the alert.
      - series: 'devicechain_eventmanagement_jetstream_consumer_unread_gap_messages{namespace="dci-devicechain", pod="dc-event-management-7c9f-fffff", job="devicechain/event-management", stream="devicechain_resolved-events", durable="devicechain_event-management_resolved-events"}'
        values: '0x60'
    alert_rule_test:
      # Over zero from minute 5, but the 2m `for` has not elapsed at minute 6.
      - eval_time: 6m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts: []
      - eval_time: 10m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "a consumer that stopped reading is losing messages it has not read"
              description: "Durable devicechain_device-state_resolved-events on stream devicechain_resolved-events has been handed no messages for at least two minutes, and the stream has already discarded 18 messages ahead of it. They will never be delivered. The consuming service is running, since it reports this, but its consumer is not reading: look for message handling stuck on a dependency such as the database, or pods waiting to become ready. If that cannot be fixed quickly, raise the stream's ceiling so it stops discarding."
      - eval_time: 40m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE WIDENING. device-state's stream is near full; the replaced alert
  # selected event-processing's series only and could not see this. A second
  # stream at half full stays quiet.
  # ------------------------------------------------------------------
  - name: a near-full stream in any service warns
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '900x40'
      - series: 'devicechain_devicestate_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '1000x40'
      - series: 'devicechain_devicestate_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_device-events"}'
        values: '500x40'
      - series: 'devicechain_devicestate_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_device-events"}'
        values: '1000x40'
    alert_rule_test:
      # Over the threshold from the first sample, but the 10m `for` has not elapsed.
      - eval_time: 5m
        alertname: JetStreamStreamNearFull
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
            exp_annotations:
              summary: "A JetStream stream is near its ceiling"
              description: "Stream devicechain_resolved-events is over 80% of its byte ceiling for 10m; the oldest messages will be discarded once it is full, and any consumer that has not read them by then will never see them (JetStreamDurableLostUnread)."

  # ------------------------------------------------------------------
  # A send ran past the acknowledgement window: one worker-stage count on
  # the notification service's reader.
  # ------------------------------------------------------------------
  - name: a send that ran past the acknowledgement window warns
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="worker"}'
        values: '0x10 1x30'
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="buffer"}'
        values: '0x40'
    alert_rule_test:
      # Before the increase: quiet.
      - eval_time: 9m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []
      - eval_time: 12m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              durable: devicechain_notification-management_alarm-events
              stage: worker
            exp_annotations:
              summary: "A service held a message past its acknowledgement window, so it was redelivered"
              description: "The reader for durable devicechain_notification-management_alarm-events held a message longer than the broker waits for an acknowledgement, so the broker handed it out again. stage=worker: a send was still running when that happened, so the message may have been sent twice -- look for a slow or unresponsive destination behind this service. stage=buffer: the reader dropped a message it had fetched but not yet handed to a worker, and the broker's redelivery is handled instead; nothing was sent twice, but the service is not keeping up."
      # 🔴 THE OCCURRENCE AGES OUT. Once the window no longer spans the increase the
      # alert clears, rather than paging forever over one old event.
      - eval_time: 35m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # Two pods of the connectors service each drop a buffered message: the
  # counts are per pod and summed, and the stage label says which kind.
  # ------------------------------------------------------------------
  - name: buffered drops on two pods are summed per durable and stage
    interval: 1m
    input_series:
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-aaaaa", durable="devicechain_outbound-connectors_connector-dispatch", stage="buffer"}'
        values: '0x5 1x20'
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-bbbbb", durable="devicechain_outbound-connectors_connector-dispatch", stage="buffer"}'
        values: '0x5 1x20'
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-aaaaa", durable="devicechain_outbound-connectors_connector-dispatch", stage="worker"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 8m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              durable: devicechain_outbound-connectors_connector-dispatch
              stage: buffer
            exp_annotations:
              summary: "A service held a message past its acknowledgement window, so it was redelivered"
              description: "The reader for durable devicechain_outbound-connectors_connector-dispatch held a message longer than the broker waits for an acknowledgement, so the broker handed it out again. stage=worker: a send was still running when that happened, so the message may have been sent twice -- look for a slow or unresponsive destination behind this service. stage=buffer: the reader dropped a message it had fetched but not yet handed to a worker, and the broker's redelivery is handled instead; nothing was sent twice, but the service is not keeping up."

  # ------------------------------------------------------------------
  # 🔴 A healthy instance: every series present and flat at zero. Must
  # never page.
  # ------------------------------------------------------------------
  - name: a healthy instance with every held-past series at zero is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="worker"}'
        values: '0x60'
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="buffer"}'
        values: '0x60'
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-aaaaa", durable="devicechain_outbound-connectors_connector-dispatch", stage="worker"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []
      - eval_time: 59m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # A counter that is already non-zero when first scraped (a pod that
  # counted before this Prometheus saw it) and stays flat is not a new
  # occurrence, and must not page.
  # ------------------------------------------------------------------
  - name: a held-past counter that appears at n and stays flat is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="worker"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # Another instance's namespace is not this instance's alert.
  # ------------------------------------------------------------------
  - name: another instance's held-past counter is not this instance's alert
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-other", pod="dc-notification-management-7c9f-abcde", durable="other_notification-management_alarm-events", stage="worker"}'
        values: '0x5 4x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # MaxDeliveryRecordsWaiting. The capture is a work queue, so its count is
  # the backlog nobody has recorded. Two pods sample the same stream and
  # report the same count: `max`, one alert.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-6f7d-aaaaa", stream="devicechain_max-deliveries"}'
        values: '0x5 2x30'
      - series: 'devicechain_eventprocessing_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-event-processing-5c4b-bbbbb", stream="devicechain_max-deliveries"}'
        values: '0x5 2x30'
    alert_rule_test:
      # Waiting, but not yet for the whole window: a recorder that is merely restarting.
      - eval_time: 15m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts: []
      - eval_time: 25m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_max-deliveries
            exp_annotations:
              summary: "Messages that ran out of delivery attempts are waiting to be recorded"
              description: "2 notice(s) of messages whose every delivery attempt ran out have been waiting on devicechain_max-deliveries for 15 minutes without being turned into dead letters. Each service records its own; one that is down or crash-looping records late, so first check that every service is running and look in its logs for errors from the max-delivery recorder. A notice that stays after every service is healthy names a consumer no running service reads any more (a reader removed by an upgrade); it will not be recorded, and can be deleted from the stream."

  # ------------------------------------------------------------------
  # 🔴 A healthy instance: the capture exists and is empty, and a busy
  # ordinary stream is not this alert's business.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-6f7d-aaaaa", stream="devicechain_max-deliveries"}'
        values: '0x60'
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-6f7d-aaaaa", stream="devicechain_raise-alarm"}'
        values: '500x60'
      - series: 'devicechain_notificationmanagement_jetstream_stream_used_messages{namespace="dci-other", pod="dc-notification-management-7c9f-abcde", stream="other_max-deliveries"}'
        values: '9x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts: []
      - eval_time: 59m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts: []

  # ------------------------------------------------------------------
  # ReplayCoveredDeliveriesExhausted. A checkpoint outage on a replay-covered
  # consumer exhausts deliveries in a burst. Two replicas share one recorder
  # durable, so each exhaustion is counted on ONE of them -- 3 on one pod and
  # 2 on the other are 5 exhaustions, and the rule must say 5, not 3.
  #
  #   minutes  0- 9   both at 0 (created at 0 by the recorder)
  #   minute  10      pod a counts 3, pod b counts 2
  #   minutes 11+     flat
  # ------------------------------------------------------------------
  - name: a replay-covered consumer that ran out of deliveries warns, summed across pods
    interval: 1m
    input_series:
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-aaaaa", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '0x9 3x60'
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-bbbbb", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '0x9 2x60'
      # A LETTERED exhaustion on another consumer of the same stream is the dead
      # letter's business, not this alert's.
      - series: 'devicechain_eventmanagement_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-management-7d8e-ccccc", job="devicechain/event-management", stream="devicechain_resolved-events", outcome="lettered"}'
        values: '0x9 4x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []
      - eval_time: 15m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: devicechain/event-processing
              stream: devicechain_resolved-events
            exp_annotations:
              summary: "A consumer ran out of delivery attempts because it could not save its checkpoint"
              description: "5 message(s) on devicechain_resolved-events ran out of delivery attempts to devicechain/event-processing in the last 15 minutes. This consumer re-reads the stream from its own saved checkpoint, so nothing has been lost and no dead letter is written, but its checkpoint has not been saved for longer than the broker keeps redelivering: look for the service's database or broker connection failing. While it is running it keeps what it has read in memory and saves it when the checkpoint succeeds. If it restarts first, it re-reads the stream from the last saved checkpoint, and a message the stream has already discarded (JetStreamStreamNearFull) cannot be re-read."
      # The window has passed and nothing new ran out: quiet again.
      - eval_time: 30m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 Quiet cases: the series at zero on a healthy instance, a counter that
  # APPEARS at n and stays flat (a restart, from Prometheus's side), and
  # another instance's namespace.
  # ------------------------------------------------------------------
  - name: a healthy, restarted or foreign replay-covered counter is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-aaaaa", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '0x60'
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-ddddd", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '7x60'
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-other", pod="dc-event-processing-5c4b-eeeee", job="other/event-processing", stream="other_resolved-events", outcome="replay-covered"}'
        values: '0x9 6x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []
      - eval_time: 59m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []
