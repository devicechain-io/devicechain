#
# The EU868 region, reduced to what an uplink needs: the default three channels
# (868.1, 868.3, 868.5 MHz) are built in, so none are listed.

[[regions]]
  id = "eu868"
  description = "EU868"
  common_name = "EU868"

  [regions.gateway.backend]
    enabled = "mqtt"

    [regions.gateway.backend.mqtt]
      topic_prefix = "eu868"
      server = "tcp://mosquitto:1883"
      json = true

  [regions.network]
    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 0
    rx2_frequency = 869525000
    adr_disabled = false
    min_dr = 0
    max_dr = 5
    enabled_uplink_channels = [0, 1, 2]
