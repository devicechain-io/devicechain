#
# promtool UNIT TESTS for event-management's alerting rules (the failed-events index).
#
# FailedEventsSustained reads the rate of devicechain_eventmanagement_failed_events_recorded_total,
# which counts EVERY record the reader saw (the table's flood bound hides the rate on purpose).
# The quiet cases carry as much weight as the firing one:
#
#   - a trickle (well under 1/s) of one reason must not page;
#   - a burst that stops before 15 minutes must not page;
#   - the rate is per REASON: two reasons at 0.6/s each must not page, because neither is
#     above 1/s on its own;
#   - a sustained 2/s of one reason fires, labelled with that reason, and clears once it stops.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml.
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # A trickle: 0.1 records a second.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_failed_events_recorded_total{namespace="dci-devicechain", pod="dc-event-management-aaaaa", source="device-management", reason="device_not_found"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: FailedEventsSustained
        exp_alerts: []

  # A burst at 2/s for 10 minutes, then silence: shorter than the 15 minutes it must last.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_failed_events_recorded_total{namespace="dci-devicechain", pod="dc-event-management-aaaaa", source="device-management", reason="unauthenticated"}'
        values: '0+120x10 1200x50'
    alert_rule_test:
      - eval_time: 40m
        alertname: FailedEventsSustained
        exp_alerts: []

  # Two reasons at 0.6/s each (1.2/s together): neither is above 1/s, so the per-reason
  # sum does not fire. The sum is by reason, not over everything.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_failed_events_recorded_total{namespace="dci-devicechain", pod="dc-event-management-aaaaa", source="device-management", reason="unauthenticated"}'
        values: '0+36x60'
      - series: 'devicechain_eventmanagement_failed_events_recorded_total{namespace="dci-devicechain", pod="dc-event-management-aaaaa", source="device-management", reason="device_not_found"}'
        values: '0+36x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: FailedEventsSustained
        exp_alerts: []

  # Sustained 2/s of one reason: fires after the 15m `for`, labelled with the reason, and
  # clears once the rate window has passed the end of the flood.
  - interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_failed_events_recorded_total{namespace="dci-devicechain", pod="dc-event-management-aaaaa", source="device-management", reason="unauthenticated"}'
        values: '0+120x30 3600x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: FailedEventsSustained
        exp_alerts: []
      - eval_time: 25m
        alertname: FailedEventsSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              reason: unauthenticated
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#failedeventssustained"
              summary: "the platform has been refusing more than one event a second for the same reason for 15 minutes"
              description: "Events are being refused or could not be stored at more than one a second for the reason named by the reason label, and have been for 15 minutes. That can be a single device sending that fast (2 a second from one device is enough to fire it) or many devices failing together: a credential or certificate that is wrong across many devices (unauthenticated), devices that were never registered (device_not_found), a gateway publishing for devices it does not hold (not_gateway_child), or a failing dependency (api_call_failed). The tenants' failedEvents query and the Ingest failures view in the console show which devices and what the platform said, at most ten rows per device an hour with the rest counted. Nothing is re-sent: the events were not stored, and fixing the cause makes the devices' next events succeed."
      - eval_time: 55m
        alertname: FailedEventsSustained
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # EntityDeletionWatermarksLarge: the deletion watermark table over 1 GiB (1073741824 bytes),
  # held an hour. The series is the shared append-only table size every service exports.
  # ---------------------------------------------------------------------------

  # Exactly on the line (1073741824), on both replicas: nothing fires. The boundary is
  # strict, so a `>=` or a threshold typed in MiB instead of bytes shows up here or below.
  - name: a watermark table at exactly 1 GiB raises nothing
    interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-aaaaa", table="entity_deletion_watermarks"}'
        values: '1073741824+0x180'
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-bbbbb", table="entity_deletion_watermarks"}'
        values: '1073741824+0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: EntityDeletionWatermarksLarge
        exp_alerts: []

  # Negative controls. A huge audit journal is NOT this alert (it is a different table with its
  # own volume alerts), and another instance's namespace must not raise this instance's alert.
  - name: only this instance's watermark table counts
    interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-aaaaa", table="audit_events"}'
        values: '50000000000+0x180'
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-other", pod="dc-event-management-zzzzz", table="entity_deletion_watermarks"}'
        values: '50000000000+0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: EntityDeletionWatermarksLarge
        exp_alerts: []

  # The device token holder table is on the same series and has no size alert: it is as large
  # as the fleet, which no absolute line can tell from a loop (see the rule template's header).
  # A holder table far over 1 GiB must not raise the watermark alert.
  - name: a large device token holder table is not the watermark alert
    interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-aaaaa", table="device_token_holders"}'
        values: '50000000000+0x180'
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-aaaaa", table="entity_deletion_watermarks"}'
        values: '1000+0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: EntityDeletionWatermarksLarge
        exp_alerts: []

  # Over 1 GiB on two replicas reporting the same table: pending at 45m (the `for` is an
  # hour), ONE alert at 90m (max by namespace, not one per replica), and it clears when the
  # table drops under the line (after a rewrite such as VACUUM FULL), so the alert can be answered by acting.
  - name: a watermark table over 1 GiB warns once, after an hour, and clears
    interval: 1m
    input_series:
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-aaaaa", table="entity_deletion_watermarks"}'
        values: '1073741825+0x119 1000+0x60'
      - series: 'devicechain_eventmanagement_append_only_table_bytes{namespace="dci-devicechain", pod="dc-event-management-bbbbb", table="entity_deletion_watermarks"}'
        values: '1073741825+0x119 1000+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: EntityDeletionWatermarksLarge
        exp_alerts: []
      - eval_time: 90m
        alertname: EntityDeletionWatermarksLarge
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              namespace: dci-devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#entitydeletionwatermarkslarge"
              summary: "the table that remembers deleted entities is over 1 GiB"
              description: "The deletion watermark table in the event store is over 1 GiB, with its indexes. It holds one row for each distinct token ever deleted (tenant, entity type and token) and nothing prunes it: the row is what keeps an entity created later under the same token from reading the deleted one's event history, so it is kept for the life of the tenant. A row is about 200 bytes, so this is several million distinct deleted tokens, far more than a fleet that is replaced a few times over. The size is allocated space, which also counts rows that were updated or removed and not yet reused, so check the live count before blaming a loop; when the count is in the millions it is nearly always one tenant creating and deleting entities under new tokens. On the event-store primary (dc-tsdb), by tenant:\n\n  SELECT tenant_id, count(*) FROM \"event-management\".entity_deletion_watermarks GROUP BY tenant_id ORDER BY 2 DESC LIMIT 10;\n\nStop the loop at its source. Purging the tenant removes its rows, but the table keeps the space for reuse and its size does not fall until it is rewritten (VACUUM FULL on the table, in a quiet period), so this alert can stay firing after the cause is gone. Otherwise the table is safe to leave: the growth is slow, and it only matters as part of the event store's volume, so keep the DatabaseVolumeFillingUp alerts for the dc-tsdb claim in view. Row counts are on the append_only_table_rows_estimate series and the size on append_only_table_bytes, both exported by event-management as table entity_deletion_watermarks."
      - eval_time: 150m
        alertname: EntityDeletionWatermarksLarge
        exp_alerts: []
