#
# The operand image's pins — the single source of truth. The Dockerfile, the
# local build script, the CI workflow and `hack/migration-diff.sh` all read this
# file, so a bump is one edit in one place.
#
# 🔴 BUMPING TIMESCALEDB_VERSION: move the OLD value into
# TIMESCALEDB_COMPAT_VERSIONS in the same commit, and KEEP everything already
# there. `verify-compat.sh` enforces the superset rule — this commit's
# {version} ∪ {compat} must cover the previous commit's — by reading the
# previously committed values out of git. Retiring an old version is a
# deliberate act (`DC_COMPAT_ALLOW_DROP`), never a side effect of a bump.

# CloudNativePG's own operand base, `standard` flavour. It is Debian + the PGDG
# packages, which is what makes the TimescaleDB apt packages installable at all.
# The Debian suite is NOT recorded here: the Dockerfile reads it out of the base
# image's /etc/os-release, so it cannot drift away from this pin.
#
# Note this is a MOVING tag — CNPG rebuilds it for base CVE fixes. That is why
# IMAGE_REVISION exists below: the tag we publish must change whenever the bits
# change, and the bits can change without this file changing.
PG_IMAGE=ghcr.io/cloudnative-pg/postgresql:17.10-standard-bookworm
PG_MAJOR=17

# TimescaleDB. Must stay >= 2.26.4, which carries the fix for timescale#9360 —
# a job that is mid-run when its node fails comes back with `next_start` at the
# `-infinity` sentinel and never runs again, so aggregation, retention and
# compression stop silently while the database reports healthy.
#
# Only the upstream version is pinned, not the Debian packaging revision
# (`~debian12-1710`): the build resolves the newest revision of THIS version. A
# Timescale repackage would therefore change the bits without changing this
# file — bump IMAGE_REVISION when that is known to have happened.
TIMESCALEDB_VERSION=2.28.3

# Older TimescaleDB versions whose shared libraries this image must STILL carry,
# space-separated. Empty is correct only for the first published image: nothing
# is running our operand yet, so no rolling update can land on it.
TIMESCALEDB_COMPAT_VERSIONS=

# Bump for any rebuild that should publish DIFFERENT bits under the same
# PostgreSQL and TimescaleDB versions — a base-image CVE rebake, a Dockerfile
# change, a known upstream repackage.
#
# 🔴 Without this the published tag would be mutable: `17.10-ts2.28.3` computed
# from the versions alone, rebuilt with new base bits, pushed over itself. With
# `imagePullPolicy: IfNotPresent` the nodes that already cached the tag keep the
# old image while every new pod — failover, scale-out, node replacement, a PITR
# restore — pulls the new one, so one CNPG cluster ends up running two different
# builds with nothing to indicate it. That is the exact failure this image was
# created to escape; re-creating it in our own registry would be worse, because
# here we would have chosen it.
IMAGE_REVISION=1
