# Defaults for the DeviceChain CNPG Cluster chart.
#
# 🔴 THE LOAD-BEARING FIELDS ARE DELIBERATELY NULL HERE. `required` in Helm
# fires only when a value is null or empty, so giving these a default would
# disarm every guard in templates/cluster.yaml -- a caller that forgot one
# would silently get whatever this file happened to say. The OpenTofu module
# supplies all of them on every path; leaving them unset here means a future
# caller that does not gets a render error naming the field.
#
# What DOES carry a default is anything where a wrong value is visible (a size,
# a resource request) or where the safe choice should not need restating.

# Cluster object name. Also the prefix for CNPG's own -rw / -ro / -r Services,
# which is why it must NOT be the legacy `dc-postgresql` name: that is the alias
# below, and CNPG reserves <cluster>-<service> for itself.
name: null

imageName: null

instances: null

storage:
  size: null
  # Empty uses the cluster default StorageClass (often reclaimPolicy: Delete).
  # For production durability point this at a Retain class.
  storageClass: ""

# A dedicated WAL volume. Off by default; it earns its keep once WAL archiving
# is on, because archiving that stalls accumulates WAL until the volume fills
# and stops Postgres -- a failure worth bounding to its own disk.
walStorage:
  enabled: false
  size: null
  storageClass: ""

resources: {}

# The alias Service that preserves the DNS contract -- the name every service,
# the Helm values and the DR rig already point at.
aliasServiceName: null

# 🔴 hostname, not zone. A topologyKey no node carries makes the anti-affinity
# term inert, which is how three instances end up on one node while every
# pod-counting check reports healthy.
topologyKey: kubernetes.io/hostname

# CNPG's own default. The upstream chart sets this true; the platform never
# connects as a superuser, so a superuser password would be a standing
# credential with no consumer.
enableSuperuserAccess: false

synchronous:
  # Off by default so a single-instance install is the safe path. At one
  # instance there is no standby, and `number: 1` would stall every write
  # forever -- the module derives this from the instance count rather than
  # leaving it to a caller to remember.
  enabled: false
  method: any
  number: 1
  # `required` holds the write until a standby confirms; `preferred` self-heals
  # to async when none is available. Which one is right is per-store and is
  # argued in the module, not here.
  dataDurability: required

bootstrap:
  database: null
  owner: null
  secretName: null
  # Explicit, never inferred. The operand image carries no locale, so an
  # unset encoding resolves to SQL_ASCII and every query later fails a
  # client_encoding error that says nothing about initdb.
  encoding: UTF8
  localeCollate: C.utf8
  localeCType: C.utf8
  # SQL run against template1 at initdb, inherited by every database the app
  # subsequently creates. Empty for a plain relational store.
  postInitTemplateSQL: []

# Postgres GUCs (spec.postgresql.parameters).
parameters: {}

# 🔴 A library named here and absent from the image makes Postgres refuse to
# start, and CNPG cannot recover from it without hands.
sharedPreloadLibraries: []

# WAL archiving + base backups via the Barman Cloud plugin.
#
# 🔴 OFF here, ON at the caller. The chart's default has to be the one that
# renders against a cluster with no barman plugin and no object store, because a
# chart that defaults to backup-enabled fails to render exactly where somebody is
# trying to stand up a minimal store to debug something else. The OpenTofu module
# supplies the whole block on every install where backups are on, and the
# template refuses a HALF-supplied one -- so the failure mode this default could
# have introduced (backups quietly configured against nothing) is unreachable.
backup:
  enabled: false

  # The bucket for THIS store. One bucket per store, never a shared bucket with
  # two prefixes: the point of two ObjectStores is two independent restore
  # domains, and a shared bucket makes them one.
  bucket: ""

  # S3 endpoint. In-cluster this is the object-store module's Service; on a cloud
  # it is the provider's endpoint, or empty for real AWS S3 -- which the template
  # refuses, deliberately, because "the endpoint I forgot to set" and "AWS" are
  # the same value and only one of them is ever intended here.
  endpointURL: ""

  # Secret holding the S3 credentials, and the keys within it. Supplied by the
  # object-store module's outputs rather than restated, so the two cannot drift.
  credentialsSecret: ""
  accessKeyIdKey: ""
  secretAccessKeyKey: ""

  # A private CA for an HTTPS endpoint whose certificate the plugin sidecar does
  # not already trust. {name, key} of a Secret or ConfigMap; empty for plain HTTP
  # in-cluster or a publicly-rooted cloud endpoint.
  endpointCASecret: {}

  # Path within the bucket. Empty means the Cluster's own name, which is right
  # for every install; a RESTORED cluster must set it, because CloudNativePG
  # refuses to archive back over the path it recovered from.
  serverName: ""

  # 🔴 SIX FIELDS. CloudNativePG cron includes SECONDS, unlike Kubernetes
  # CronJobs, and a five-field schedule is accepted by the API and then never
  # runs. This is 03:00 daily. Empty disables the recurring base backup and
  # leaves WAL archiving on, which is a destination that grows forever and
  # restores nothing -- the template lets you do it; nothing recommends it.
  schedule: "0 0 3 * * *"

  # A recovery WINDOW: the cluster stays restorable to any point within it.
  # Empty disables pruning entirely.
  retentionPolicy: "30d"

  # 🔴 Forces a WAL switch every interval, and it is what bounds the RPO on a
  # QUIET instance. Postgres defaults to 0 (switch only when a segment fills), so
  # a low-traffic instance can carry hours of unshipped WAL while every backup
  # check reads green. It is also what makes "seconds since last archival" a
  # usable alert instead of one that is red on every idle cluster.
  #
  # Move this and move the alert threshold in the chart's
  # prometheusrule-database-backup.yaml with it.
  archiveTimeout: 5min

  walCompression: gzip
  dataCompression: gzip

  # Parallelism for WAL archiving. The event store produces WAL at telemetry
  # rates, and an archiver that cannot keep up accumulates segments on the
  # database's own volume until it fills.
  walMaxParallel: 2

  # Parallel upload jobs for a base backup.
  dataJobs: 2

  # The plugin runs a sidecar in every instance pod. Requests only, matching the
  # database container: a memory limit here turns a large backup into an OOMKill
  # of the process taking the backup.
  #
  # 🔴 256Mi rather than the 128Mi first shipped, and the reason is about the
  # DATABASE pod rather than about the sidecar. This container gzips and uploads
  # with `jobs` / `maxParallel` concurrency, inside the PostgreSQL pod, and the
  # kubelet ranks a pod for eviction by its total usage above its total requests.
  # So an under-requested backup sidecar does not get itself evicted — it drags
  # the PRIMARY DATABASE up the eviction ranking during every backup. That is not
  # the failure the "requests without limits" reasoning above is protecting
  # against, and it is a worse one.
  sidecarResources:
    requests:
      cpu: 50m
      memory: 256Mi
