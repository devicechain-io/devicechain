#
# CodeQL static analysis for Go.
#
# Go only, deliberately, to start: it is where essentially all of this repo's
# authored logic and its whole attack surface live (ingest decoding, auth, the
# GraphQL layer, the SSRF-hardened outbound webhook path). Adding
# javascript-typescript for the frontend and csharp for the SDK is a later,
# separate decision — each is another full analysis job, and a scanner nobody
# reads the output of is worse than no scanner.
#
# ---------------------------------------------------------------------------
# WHY build-mode: manual, AND WHY `paths-ignore` IS NOT THE ANSWER. Both of these
# are non-obvious and both were checked against the extractor's own source rather
# than assumed.
#
# 1. `build-mode: none` DOES NOT EXIST FOR GO. CodeQL's Go extractor declares
#    exactly two build modes (autobuild, manual); the no-build path is available
#    for C/C++, C#, Java and Rust, and not for Go. So the code has to be built.
#
# 2. AUTOBUILD WOULD SCAN `_legacy/`. The Go autobuilder does not run
#    `go build ./...` at the root (which fails here — the root is not a module).
#    It finds go.work, extracts each `use` entry, AND THEN adds every stray
#    go.mod not referenced by go.work as its own workspace. `_legacy/` — the
#    archived pre-migration SiteWhere tree that CLAUDE.md says not to edit —
#    holds 7 such go.mod files. Autobuild would extract all of them: 22 modules
#    become 29, and the extra alerts are against code we deliberately do not
#    maintain and would never fix.
#
# 3. 🔴 `paths-ignore` CANNOT FIX THAT. It applies only to interpreted languages
#    and to compiled languages analyzed WITHOUT building. For a compiled language
#    that is built — Go, here — GitHub's documented answer is "specify
#    appropriate build steps"; the filter is simply not consulted. A
#    `paths-ignore: [_legacy/**]` here would parse, validate, look correct in
#    review, and exclude nothing. It is a cannot-fail configuration, so it is
#    absent on purpose. Do not add it.
#
# Manual mode makes the build the filter. Go extraction is TRACER-based: CodeQL
# intercepts each `go` invocation, so whatever we build is exactly what gets
# analyzed. `go list -m` reads go.work, so `_legacy/` is never built and
# therefore never extracted — by construction, with nothing to keep in step.
# ---------------------------------------------------------------------------
name: codeql

on:
  # 🔴 DELIBERATELY UNFILTERED. Every commit that lands on main is analyzed, so
  # main's code-scanning state always describes main's actual HEAD rather than
  # whatever was last considered worth analyzing. This run blocks nobody — it
  # happens after the merge — so its cost is not the cost anyone was complaining
  # about, and paying it keeps the branch authoritative.
  push:
    branches: [main]

  # The PR run IS on the critical path, and it is the expensive one: measured at
  # ~9-11 min against ~5 min for the whole `ci` workflow. The split is not what it
  # looks like — 422s of that is "Build every workspace module" and only 87s is
  # the analysis. Go extraction is TRACER-based, so the compiler genuinely has to
  # run; the caches already hit (setup-go reports a hit, zero `go: downloading`),
  # and no amount of further caching removes a build CodeQL must observe.
  #
  # So the only lever is not running it when there is nothing to analyze. Measured
  # over the last 20 merges: 8 touched no Go at all — docs, frontend, CI, chart
  # prose. Each of those paid ~10 minutes to analyze an unchanged tree.
  #
  # 🔴 DO NOT CONFUSE THIS WITH `paths-ignore` IN THE CODEQL CONFIG. The header
  # above explains at length that CodeQL's OWN path filtering does not apply to a
  # compiled language that gets built, and that adding it would silently exclude
  # nothing. That warning is about a different mechanism and does NOT transfer
  # here: `paths` on a workflow trigger is evaluated by Actions before the job is
  # ever created, so it genuinely skips. The two look alike and behave oppositely.
  #
  # 🔴 A WORKFLOW SKIPPED BY A PATH FILTER LEAVES ITS CHECKS "PENDING", NOT
  # "SKIPPED" — GitHub's documented behaviour. It is a DEADLOCK for any PR the
  # filter skips if "Analyze Go" is ever required: the PR waits forever on a check
  # that is never going to report.
  #
  # ⚠️ The condition this warning used to rest on has CHANGED. It said "harmless
  # today because `main` carries no branch protection"; `main` HAS been protected
  # since 2026-08-14 (ruleset 20872119). What keeps it harmless now is narrower and
  # deliberate: that ruleset requires exactly `ci-complete`, `dependency-review`
  # and `cla`, and "Analyze Go" is NOT among them. So the guidance is no longer
  # conditional — leave "Analyze Go" out of the required set, or pair this with a
  # job that reports success on the skipped path. Verify before assuming:
  #   gh api repos/devicechain-io/devicechain/rulesets/20872119 \
  #     --jq '.rules[]|select(.type=="required_status_checks")
  #           |.parameters.required_status_checks[].context'
  #
  # 🔑 The same fact is why this workflow's ~10 min is not on the merge critical
  # path: measured on #766, the required three went green at 4.8 min and this
  # analysis finished at 11.1 min. It is not a merge gate; it is a scanner whose
  # result lands shortly after. Optimising its wall clock was considered and
  # declined on those grounds — see the analysis note below.
  #
  # If you ever DO want it faster, the measured lever is not parallelism. A
  # per-module matrix compiles 9754 packages against a 2749-package union (3.55x)
  # and would report a `backend/core` finding ~20 times, once per category. The
  # real weight is one dependency: `bento/public/components/aws` is an
  # everything-with-AWS-auth bundle, and its elasticsearch/opensearch halves pull
  # 817 packages — 29.7% of the union, and half of outbound-connectors' own
  # compile time — that nothing here uses. Pruning them needs a fork or an
  # upstream narrow bundle, since `internal/impl/aws` cannot be imported directly
  # and the impls carry no build tags.
  pull_request:
    branches: [main]
    paths:
      # Anything the extractor could see. `**/*.go` is exhaustive by construction,
      # so this cannot miss a Go file by living somewhere unexpected.
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - "go.work.sum"
      # A change to the analysis itself must re-run the analysis. Without this,
      # editing this file is the one change guaranteed not to be tested.
      - ".github/workflows/codeql.yml"
      # Negation LAST — order decides, and a later negative overrides an earlier
      # positive. `_legacy/` is the archived pre-migration tree that go.work does
      # not reference, so the build step never compiles it and the extractor never
      # sees it. A PR touching only `_legacy/**` would otherwise trigger ten
      # minutes of analysis over a tree whose Go files are not analyzed at all.
      - "!_legacy/**"

  schedule:
    # Weekly, Wednesday 05:17 UTC. A scheduled run matters even though this also
    # runs per-PR: new QUERIES ship continuously, so the same unchanged code gets
    # re-analyzed against rules that did not exist when it merged.
    #
    # It is also the backstop for the PR filter above — `paths` is not evaluated
    # for scheduled events, so this run always analyzes the whole tree regardless
    # of what any recent PR touched.
    - cron: "17 5 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload results — required for every CodeQL workflow
      packages: read # fetch CodeQL packs
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Enumerate the modules BEFORE init, on purpose. Between init and analyze
      # every `go` invocation is intercepted by the CodeQL tracer; `go list -m` is
      # a query, not a build, and there is no reason to make the extractor reason
      # about it. Resolving the list up front keeps the traced region to actual
      # compilation.
      - name: Enumerate workspace modules
        run: |
          go list -m -f '{{.Dir}}' > "${RUNNER_TEMP}/modules.txt"
          echo "Modules to analyze: $(wc -l < "${RUNNER_TEMP}/modules.txt")"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: go
          build-mode: manual

      # The repo's own full-build idiom. Two details are load-bearing and are the
      # same trap CLAUDE.md documents for the local sweep:
      #
      #   - `rc=1` is accumulated rather than written as `... || echo "FAILED: $m"`.
      #     That obvious form makes the loop's exit status the status of the last
      #     `echo`, i.e. always 0 — every module could fail to compile and this
      #     step would still pass, leaving CodeQL to analyze whatever fragment did
      #     build and report success.
      #   - the subshell `( cd ... )` keeps each module's cd from leaking into the
      #     next iteration.
      - name: Build every workspace module
        run: |
          rc=0
          while read -r m; do
            echo "::group::go build $m"
            ( cd "$m" && go build ./... ) || { echo "FAILED: $m"; rc=1; }
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/modules.txt"
          exit "$rc"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:go"
