#
# promtool UNIT TESTS for the token-audience rules.
#
# The series are the spec: devicechain_<area>_token_audience_checks_total{plane, audience,
# verdict}, one counter per service, registered by core/auth (PromAudienceRecorder). The
# counter carries NO tenant label, so neither does the alert. In observe mode a request whose
# token is bound to another plane counts verdict="would_reject" and is served; in enforce mode
# it counts "rejected", which this alert deliberately does not watch.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the rendered
# group in beside this file as rendered-rules.yaml. Naming it below is not optional: promtool
# with no rule_files loads no rules, and every quiet assertion then passes against nothing.
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # MUST FIRE. A client sustains calls with another plane's token: a steady trickle of
  # would_reject for well over the hour. Pending for the `for` hour, firing after it.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_token_audience_checks_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-abcde", job="devicechain/event-sources", plane="graphql", audience="other_area", verdict="would_reject"}'
        values: '0+2x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: TokenAudienceWouldReject
        exp_alerts: []
      - eval_time: 90m
        alertname: TokenAudienceWouldReject
        exp_alerts:
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              job: devicechain/event-sources
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#tokenaudiencewouldreject"
              summary: "A client is sending tokens that enforce mode would refuse"
              description: "For at least an hour, devicechain/event-sources has been receiving requests whose access token is bound to a resource other than the one this service serves (and is not a registered MCP resource). They are being served only because this instance sets tokenAudience.enforcement to observe, and are counted as would_reject. Enforce mode, the default, refuses them. Find the client from the rate-limited 'token audience' warning in the service log, which names its client_id and the audience class, and have it request a token for the resource it actually calls before the observe setting is removed. See the v1.3 upgrade notes: https://docs.devicechain.io/deployment/releases-and-upgrades#v130-token-audience"

  # ------------------------------------------------------------------
  # MUST NOT FIRE. Every request is accepted: own-area tokens, MCP-forwarded tokens and
  # token-less calls, however fast they come. Accepted traffic is the normal state.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_token_audience_checks_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-abcde", job="devicechain/event-sources", plane="graphql", audience="own_area", verdict="accepted"}'
        values: '0+500x180'
      - series: 'devicechain_eventsources_token_audience_checks_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-abcde", job="devicechain/event-sources", plane="graphql", audience="mcp", verdict="accepted"}'
        values: '0+500x180'
      - series: 'devicechain_eventsources_token_audience_checks_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-abcde", job="devicechain/event-sources", plane="graphql", audience="none", verdict="accepted"}'
        values: '0+500x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TokenAudienceWouldReject
        exp_alerts: []
      - eval_time: 170m
        alertname: TokenAudienceWouldReject
        exp_alerts: []

  # ------------------------------------------------------------------
  # MUST NOT FIRE. The would_reject series exists but is flat at zero (the counter is created
  # on first use, and a client that once misbehaved and was fixed leaves it flat).
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_token_audience_checks_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-abcde", job="devicechain/event-sources", plane="graphql", audience="other_area", verdict="would_reject"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TokenAudienceWouldReject
        exp_alerts: []

  # ------------------------------------------------------------------
  # MUST NOT FIRE. A single stray would-reject, then nothing. It must not hold the alert for
  # an hour: the rate over the hour sees it for at most the hour after it, and the `for` hour
  # cannot be completed by one sample.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_token_audience_checks_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-abcde", job="devicechain/device-management", plane="graphql", audience="other_area", verdict="would_reject"}'
        values: '0 1x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: TokenAudienceWouldReject
        exp_alerts: []
      - eval_time: 75m
        alertname: TokenAudienceWouldReject
        exp_alerts: []
      - eval_time: 120m
        alertname: TokenAudienceWouldReject
        exp_alerts: []

  # ------------------------------------------------------------------
  # MUST NOT FIRE. Enforce mode: the same traffic is now "rejected" and refused, which the
  # next release's alert watches; this one must stay quiet so the two never double-report.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_eventsources_token_audience_checks_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-abcde", job="devicechain/event-sources", plane="graphql", audience="other_area", verdict="rejected"}'
        values: '0+2x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TokenAudienceWouldReject
        exp_alerts: []

  # ------------------------------------------------------------------
  # MUST FIRE, per service. Two services both observe would-rejects: one alert each, keyed by
  # job, so the operator sees which service the client is calling. mcp's own counter is a
  # different subsystem and is picked up by the by-name selector without a list to maintain.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_mcp_token_audience_checks_total{namespace="dci-devicechain", pod="dc-mcp-7c9f-abcde", job="devicechain/mcp", plane="graphql", audience="unlisted", verdict="would_reject"}'
        values: '0+1x180'
      - series: 'devicechain_usermanagement_token_audience_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", plane="graphql", audience="other_area", verdict="would_reject"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TokenAudienceWouldReject
        exp_alerts:
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              job: devicechain/mcp
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#tokenaudiencewouldreject"
              summary: "A client is sending tokens that enforce mode would refuse"
              description: "For at least an hour, devicechain/mcp has been receiving requests whose access token is bound to a resource other than the one this service serves (and is not a registered MCP resource). They are being served only because this instance sets tokenAudience.enforcement to observe, and are counted as would_reject. Enforce mode, the default, refuses them. Find the client from the rate-limited 'token audience' warning in the service log, which names its client_id and the audience class, and have it request a token for the resource it actually calls before the observe setting is removed. See the v1.3 upgrade notes: https://docs.devicechain.io/deployment/releases-and-upgrades#v130-token-audience"
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              job: devicechain/user-management
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#tokenaudiencewouldreject"
              summary: "A client is sending tokens that enforce mode would refuse"
              description: "For at least an hour, devicechain/user-management has been receiving requests whose access token is bound to a resource other than the one this service serves (and is not a registered MCP resource). They are being served only because this instance sets tokenAudience.enforcement to observe, and are counted as would_reject. Enforce mode, the default, refuses them. Find the client from the rate-limited 'token audience' warning in the service log, which names its client_id and the audience class, and have it request a token for the resource it actually calls before the observe setting is removed. See the v1.3 upgrade notes: https://docs.devicechain.io/deployment/releases-and-upgrades#v130-token-audience"

  # ==================================================================
  # OAuthResourceWouldReject: the authorization server's twin. The series is
  # devicechain_usermanagement_oauth_resource_checks_total{grant, resource, verdict}, no tenant.
  # ==================================================================

  # MUST FIRE. A client keeps asking for an unlisted resource at the authorization endpoint.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="authorization_code", resource="unlisted", verdict="would_reject"}'
        values: '0+2x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: OAuthResourceWouldReject
        exp_alerts: []
      - eval_time: 90m
        alertname: OAuthResourceWouldReject
        exp_alerts:
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              job: devicechain/user-management
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#oauthresourcewouldreject"
              summary: "A client is asking for tokens bound to a resource this instance does not serve"
              description: "For at least an hour, devicechain/user-management has been receiving token or authorization requests that name a resource this instance does not serve. They are being served only because this instance sets tokenAudience.enforcement to observe, and are counted as would_reject. Enforce mode, the default, refuses them (invalid_target, or invalid_grant on a refresh). Find the client from the rate-limited 'OAuth resource' warning in the user-management log, which names its client_id and the grant, and have it leave the resource out or use one this instance serves. See the v1.3 upgrade notes: https://docs.devicechain.io/deployment/releases-and-upgrades#v130-token-audience"

  # MUST NOT FIRE. Accepted requests of every class, however fast: the normal state.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="authorization_code", resource="mcp", verdict="accepted"}'
        values: '0+500x180'
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="client_credentials", resource="none", verdict="accepted"}'
        values: '0+500x180'
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="refresh_token", resource="area", verdict="accepted"}'
        values: '0+500x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: OAuthResourceWouldReject
        exp_alerts: []
      - eval_time: 170m
        alertname: OAuthResourceWouldReject
        exp_alerts: []

  # MUST NOT FIRE. Enforce mode: the same traffic is "rejected", which the next release's alert
  # watches; this one stays quiet so the two never double-report.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="client_credentials", resource="unlisted", verdict="rejected"}'
        values: '0+2x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: OAuthResourceWouldReject
        exp_alerts: []

  # MUST NOT FIRE. A single stray would-reject: it cannot complete the `for` hour.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="refresh_token", resource="malformed", verdict="would_reject"}'
        values: '0 1x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: OAuthResourceWouldReject
        exp_alerts: []
      - eval_time: 75m
        alertname: OAuthResourceWouldReject
        exp_alerts: []
      - eval_time: 120m
        alertname: OAuthResourceWouldReject
        exp_alerts: []

  # MUST NOT FIRE, pre-`for`. Sustained would-reject, evaluated before the hour is up: pending,
  # not firing.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="authorization_code", resource="multiple", verdict="would_reject"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 50m
        alertname: OAuthResourceWouldReject
        exp_alerts: []

  # MUST NOT FIRE. The series is flat at zero.
  - interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_oauth_resource_checks_total{namespace="dci-devicechain", pod="dc-user-management-7c9f-abcde", job="devicechain/user-management", grant="authorization_code", resource="unlisted", verdict="would_reject"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: OAuthResourceWouldReject
        exp_alerts: []
