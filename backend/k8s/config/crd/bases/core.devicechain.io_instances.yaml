---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: instances.core.devicechain.io
spec:
  group: core.devicechain.io
  names:
    kind: Instance
    listKind: InstanceList
    plural: instances
    shortNames:
    - dci
    singular: instance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .spec.imageVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: "Instance is the declaration of a DeviceChain instance.\n\n\U0001F534
          CLUSTER-SCOPED, AND THAT IS LOAD-BEARING RATHER THAN INCIDENTAL. The\ninstance
          namespace does not exist when this object is created — creating it is\npart
          of the bootstrap this object describes — so a namespaced CR would have\nnowhere
          to live at the one moment it is needed. Cluster scope also makes the\ninstance
          id unique cluster-wide, which is what lets the object serve as the\nclaim
          two operators race for rather than as a record each of them keeps."
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "InstanceSpec is the DESIRED state of a DeviceChain instance:
              everything dcctl\nneeds to reproduce this bootstrap from a different
              machine, and nothing else.\n\n\U0001F534 THE LIST IS CLOSED, AND IT
              IS TIGHTER THAN THE FILE IT REPLACES. dcctl used\nto record this in
              ~/.devicechain/<instance>/instance.json, under a rule\nalready stated
              there: identifiers only — a name, a flag or a timestamp,\nnothing else.
              That file sits in a 0700 directory beside a private key, so its\nthreat
              model is the worst available and the rule was still worth writing down.\n\nA
              CLUSTER-SCOPED CR IS DIFFERENT IN KIND. It is readable by anything holding\ncluster-wide
              get, and it turns up in `kubectl get -o yaml`, in GitOps diffs,\nin
              support bundles and in screenshots. So the rule tightens rather than\nrelaxes,
              and two categories are named here so that nobody adds them later:\n\n
              \ - NO VALUE THAT NAMES A FILESYSTEM PATH. --escrow-file,\n    --escrow-passphrase-file,
              --backup-credentials-file, --lwm2m-identities and\n    the --restore-*
              artifacts are reconnaissance on the operator's own machine,\n    and
              they are one-shot intents rather than properties of the instance.\n
              \ - NO SECRET, AND NOTHING DERIVED FROM ONE. Not a password, not a hash,
              not a\n    seed, not a key. Credentials live in Secrets that dcctl writes;
              what a\n    consumer gets is a name.\n\nkubeContext is dropped for a
              third reason: it is a name in the WRITER's\nkubeconfig, meaningless
              on anyone else's machine, and circular — you need the\ncontext to reach
              the CR that would tell you the context. It stays local, as\nthe one
              thing that legitimately remains machine-scoped.\n\ncreatedAt is dropped
              too, and not moved to the status: metadata.creationTimestamp\nis the
              same fact, maintained by the API server, and impossible to disagree
              with."
            properties:
              cluster:
                description: "Cluster is the provider's name for the cluster holding
                  this instance.\n\n\U0001F534 EMPTY IS A REAL VALUE AND IS HONEST.
                  An instance bootstrapped into a\ncluster dcctl did not create —
                  an adopted --kube-context — has no\nprovider-side cluster name,
                  and inventing one would make `dcctl destroy`\nconfident about a
                  cluster nobody named."
                type: string
                x-kubernetes-validations:
                - message: 'cluster is immutable: it is half of the binding between
                    this instance and the cluster it lives in, and rewriting it would
                    point destroy at a different cluster'
                  rule: self == oldSelf
              compact:
                description: Compact applies the small-footprint sizing preset.
                type: boolean
              enabledFunctionalAreas:
                description: |-
                  EnabledFunctionalAreas is an explicit set of functional areas to deploy, as
                  an alternative to a named Profile (ADR-022 decision 2). The set is rejected
                  if it omits a required core area or an enabled area's hard dependency.
                items:
                  type: string
                type: array
              ha:
                description: HA applies the replicated messaging topology (ADR-020
                  A0).
                type: boolean
              host:
                description: Host is the hostname the instance ingress is exposed
                  on.
                type: string
              imageRegistry:
                description: ImageRegistry is where this instance's images are pulled
                  from.
                type: string
              imageVersion:
                description: ImageVersion is the tag they are pulled at.
                type: string
              managed:
                description: |-
                  Managed reports whether the cluster itself is dcctl's to delete, as opposed
                  to one it was pointed at. `dcctl destroy` reads it: removing an instance from
                  a cluster somebody else owns must not remove the cluster.
                type: boolean
                x-kubernetes-validations:
                - message: 'managed is immutable: it decides whether destroy may delete
                    the cluster, and flipping it turns a scoped teardown into a cluster
                    deletion'
                  rule: self == oldSelf
              monitoring:
                description: |-
                  Monitoring reports whether the observability stack is part of this instance.
                  Stated positively rather than as the --no-monitoring flag it comes from: a
                  declaration reads as what the instance IS, and a reader should not have to
                  invert a negative to learn that Prometheus is installed.
                type: boolean
              profile:
                description: |-
                  Profile names a curated set of functional areas to deploy (e.g. "default",
                  "full", "telemetry", "ingest-only") — ADR-022 decision 2. Mutually exclusive
                  with EnabledFunctionalAreas; an empty profile with no explicit set resolves
                  to "default": the standard system. "full" additionally ships the areas that
                  reach outside the instance (AI inference, outbound connectors, MCP).
                type: string
              provider:
                description: |-
                  Provider names the infrastructure provider that resolved the cluster
                  ("local" today).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'provider is immutable: it identifies the cluster this
                    instance was bootstrapped into, and an instance cannot move between
                    providers in place'
                  rule: self == oldSelf
              restored:
                description: "Restored reports that this instance's databases were
                  recovered from an\narchive rather than created empty.\n\n\U0001F534
                  A FACT, NEVER A PATH. That a restore happened is a property of the\ninstance
                  and belongs to anyone reading it; WHERE the archive was is a\none-shot
                  argument on one operator's command line. Recording the second here\nwould
                  put a filesystem layout into a cluster-readable object to no one's\nbenefit."
                type: boolean
              restoredAt:
                description: RestoredAt is when that happened.
                format: date-time
                type: string
              tls:
                description: |-
                  TLS reports whether the ingress serves HTTPS. Positive for the same reason
                  as Monitoring; it comes from --no-tls.
                type: boolean
            required:
            - managed
            - provider
            type: object
            x-kubernetes-validations:
            - message: 'set profile or enabledFunctionalAreas, not both: they are
                two ways of naming the same set and the chart treats them as mutually
                exclusive'
              rule: '!(has(self.profile) && size(self.profile) > 0 && has(self.enabledFunctionalAreas)
                && size(self.enabledFunctionalAreas) > 0)'
          status:
            description: |-
              InstanceStatus is the OBSERVED state, and it is the operator's to write.

              Nothing here is an input. If dcctl needs a value to reproduce a bootstrap it
              belongs in the spec, and if a value is only ever read by a human it belongs in
              a condition with a reason that says what was seen.
            properties:
              conditions:
                description: "Conditions report what the operator can see of the instance's
                  workloads.\n\n\U0001F534 ABSENCE IS REPORTED WITH A REASON, NEVER
                  AS HEALTH. A resource whose CRD\nis not installed, one that has
                  not been created yet, and one that is failing\nare three different
                  answers, and collapsing any of them into \"not Ready\"\nthrows away
                  the only part a human can act on."
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation this status was computed from.
                  Without it a reader cannot tell a status that reflects the current spec from
                  one left over from the previous — and "stale but plausible" is the failure
                  mode a status exists to prevent.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
