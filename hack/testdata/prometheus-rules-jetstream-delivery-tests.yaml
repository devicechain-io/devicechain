#
# promtool UNIT TESTS for the JetStream delivery alerting rules (the jetstream-delivery group).
#
# WHAT THESE ARE FOR, over and above the parse check
#
# JetStreamDurableLostUnread is increase() over a counter that EVERY replica of a service
# keeps for the same durable, and that a pod restart resets to 0. Two properties follow,
# and both are pinned here:
#
#   - it must page on the FIRST loss after a counter appears. The counter is created at
#     0 when the reader is, so the first loss is an increase from 0 like any other; the
#     scenario below starts the series at 0 for exactly that reason.
#   - a series that APPEARS at n and stays flat must NOT page. That is what a pod
#     restart looks like from Prometheus's side (increase() treats the drop to a fresh
#     counter as a reset), and a restart is not a loss. A series that goes from n to
#     n+k after the restart must page.
#
# JetStreamStreamNearFull reads a stream's FILL only for a stream declared a sink (the
# failed-message records, the dead letters, the max-delivery capture), and not for one a
# service reports reading. A stream full of history its consumers have already read is
# QUIET: that was the defect, and the first fill scenario below is it, measured the way
# production reports it (the fill from the writer, the backlog from a different reader
# service). JetStreamDurableUnreadNearFull warns on a consumer's unread backlog instead.
#
# THE SERIES, and what is known about each:
#
#   - devicechain_<area>_jetstream_consumer_unread_skipped_total{stream,durable} — a
#     CounterVec created at 0 per durable when the reader is constructed.
#   - devicechain_<area>_jetstream_consumer_unread_gap_messages{stream,durable} — a
#     GaugeVec created at 0 at the same moment. The quiet scenarios carry both AT ZERO
#     rather than omitting them: an alert silent because its series is missing and one
#     silent because nothing was lost look identical, and only one is a working alert.
#   - devicechain_<area>_jetstream_stream_used_bytes / _limit_bytes{stream} — gauges,
#     as are _used_messages / _limit_messages; every service reports them for each stream
#     it ensures.
#   - devicechain_<area>_jetstream_stream_sink{stream} — 1 for a stream core/streams
#     declares a sink, 0 for any other, set beside the fill gauges. The quiet scenarios
#     carry it AT ZERO for the reason given for the unread pair below.
#   - devicechain_<area>_jetstream_consumer_unread_ratio{stream,durable} — a GaugeVec
#     exported by the service that READS a durable, except for a durable that gates its
#     stream, from its 30 s sample. Absent until the first sample and withdrawn when the
#     durable cannot be read. Every replica reports it, so the rule takes the max.
#   - devicechain_<area>_jetstream_consumer_pending_messages{stream,durable} — a GaugeVec
#     that, unlike the two above, is NOT created at 0: it appears at a pod's first sample
#     (30 s after the pod starts) and is withdrawn while the durable cannot be read. So a
#     series BORN above the threshold is the ordinary case -- every restart onto a backlog
#     -- and JetStreamDurableFallingBehind has a scenario for exactly that. Every replica
#     reports the same durable, so the rule takes the max.
#
# ReaderHeldMessagePastAckWait watches a counter that should read 0 for the whole
# life of a healthy instance, so the quiet cases carry as much weight as the firing
# one: a pod whose counter sits at zero, and a pod whose ONE old occurrence has aged
# out of the window, must both stay silent. Unlike the unread counter it is summed
# across pods (each pod counts only the messages it held); the two-pod scenario
# fires ONE alert per durable and stage, not one per pod.
#
#   - devicechain_<area>_reader_held_past_ack_wait_total{durable,stage} -- a
#     CounterVec built by core messaging, exported under each adopting service's own
#     subsystem. Both stage series (worker, buffer) are initialised at 0 when a
#     capacity-bounded reader is created, so they EXIST on a healthy instance rather
#     than being absent; the quiet scenarios carry them at zero for the reason given
#     for the unread series above.
#   - devicechain_<area>_max_delivery_records_total{stream,outcome} -- a CounterVec
#     the max-delivery recorder keeps. ReplayCoveredDeliveriesExhausted reads only
#     outcome="replay-covered", which exists at 0 from the recorder's start for a
#     stream the area is declared replay-covered on. An area's replicas share one
#     recorder durable, so each exhaustion is counted by ONE pod: the rule sums.
#   - devicechain_<area>_jetstream_stream_used_messages{stream} -- the stream-fill gauge
#     every service reports for each stream it ensures. MaxDeliveryRecordsWaiting reads
#     it for the max-delivery capture only, a work queue whose count is the backlog of
#     abandoned deliveries nobody has recorded; every area samples it, so it arrives
#     from several pods at once with the same value.
#
#   - devicechain_<area>_nats_connection_dead_last_timestamp_seconds -- a gauge every
#     service exports, at 0 from its start, set to the Unix time each time the service
#     gives up a broker connection that died without being closed. promtool's clock starts
#     at the epoch, so the scenarios below write small timestamps (60 = 1m) and the 0 a
#     healthy pod reports must stay quiet even though time() - 0 is "recent" at eval 1m.
#     BrokerConnectionDiedSilently reads it rather than increase() over the counter beside
#     it, so a series FIRST SEEN at a nonzero value (Prometheus was on the lost node and
#     missed the 0) still fires: that scenario is the one the alert exists for.
#   - devicechain_<area>_jetstream_backpressure_unread_ratio{stream,durable} -- a GaugeVec
#     exported by every service that WRITES a gated stream, for the consumers that gate
#     it (core/messaging/backpressure.go). Absent while not measured. Every writer pod
#     measures the same consumer, so the rule takes the max, never the sum.
#   - devicechain_<area>_jetstream_backpressure_engaged{stream} -- a gauge evaluated at
#     scrape time: 1 while that service is refusing new messages on the stream, including
#     while it cannot measure the backlog.
#
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml.
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # A live consumer loses messages to a full stream. Both replicas of the
  # reading service count the same removal; the alert is one per durable.
  #
  #   minutes  0- 9   flat at 0
  #   minute  10      5 unread messages stepped over
  #   minute  20      7 more
  #   minutes 21+     flat
  # ------------------------------------------------------------------
  - name: a durable that stepped over unread messages pages
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-aaaaa", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x9 5x9 12x60'
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-bbbbb", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x9 5x9 12x60'
      # Another service reading the same stream and keeping up: at 0 throughout.
      - series: 'devicechain_devicemanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-device-management-7c9f-ccccc", job="devicechain/device-management", stream="devicechain_alarm-events", durable="devicechain_device-management_alarm-events"}'
        values: '0x80'
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_gap_messages{namespace="dci-devicechain", pod="dc-notification-management-7c9f-aaaaa", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      - eval_time: 12m
        alertname: JetStreamDurableLostUnread
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_alarm-events
              durable: devicechain_notification-management_alarm-events
            exp_annotations:
              summary: "a consumer lost messages it never read"
              description: "Durable devicechain_notification-management_alarm-events on stream devicechain_alarm-events stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamDurableFallingBehind and JetStreamDurableUnreadNearFull, which watch this consumer's backlog, tell the two apart."
      # 🔑 IT CLEARS ONCE THE WINDOW ROLLS PAST THE LAST LOSS. Widening the
      # window would make a one-off loss page for hours; this fails if it does.
      - eval_time: 45m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      # The gap gauge sat at 0 throughout: a live consumer has no standing gap.
      - eval_time: 12m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 A POD RESTART IS NOT A LOSS. The restarted pod's counter appears at a
  # value (here 7, from the counter's lifetime on this exact labelset before a
  # scrape gap) and stays flat. increase() over a flat series is 0.
  # ------------------------------------------------------------------
  - name: a counter that appears at n and stays flat is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_outboundconnectors_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch", durable="devicechain_outbound-connectors_connector-dispatch"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      - eval_time: 30m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []

  # ------------------------------------------------------------------
  # ...and one that goes from n to n+k afterwards IS a loss.
  # ------------------------------------------------------------------
  - name: a counter that rises from n pages
    interval: 1m
    input_series:
      - series: 'devicechain_outboundconnectors_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch", durable="devicechain_outbound-connectors_connector-dispatch"}'
        values: '7x10 9x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamDurableLostUnread
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_connector-dispatch
              durable: devicechain_outbound-connectors_connector-dispatch
            exp_annotations:
              summary: "a consumer lost messages it never read"
              description: "Durable devicechain_outbound-connectors_connector-dispatch on stream devicechain_connector-dispatch stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamDurableFallingBehind and JetStreamDurableUnreadNearFull, which watch this consumer's backlog, tell the two apart."

  # ------------------------------------------------------------------
  # FAIL-CLOSED MQTT ON: the capture stream's evictions are skippable copies (and best-effort
  # QoS 0), so the capture durable does not page. The platform's fail-closed series is present
  # (it is registered only with the setting on); the capture counter rises 0 -> 500.
  # ------------------------------------------------------------------
  - name: capture evictions on a fail-closed instance are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0x9 500x50'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", durable="events"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: JetStreamDurableLostUnread
        exp_alerts: []

  # ------------------------------------------------------------------
  # FAIL-CLOSED MQTT OFF (no fail-closed series at all): the same capture eviction is real
  # loss of acknowledged messages and pages.
  # ------------------------------------------------------------------
  - name: capture evictions with fail-closed off page
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0x9 500x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: JetStreamDurableLostUnread
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture
            exp_annotations:
              summary: "a consumer lost messages it never read"
              description: "Durable devicechain_event-sources_device-events-capture on stream devicechain_device-events-capture stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamDurableFallingBehind and JetStreamDurableUnreadNearFull, which watch this consumer's backlog, tell the two apart."

  # ------------------------------------------------------------------
  # The exemption is for the capture durable ONLY. With fail-closed on, a different durable
  # that loses unread messages still pages.
  # ------------------------------------------------------------------
  - name: a non-capture durable still pages on a fail-closed instance
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_jetstream_consumer_unread_skipped_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-aaaaa", job="devicechain/notification-management", stream="devicechain_alarm-events", durable="devicechain_notification-management_alarm-events"}'
        values: '0x9 5x50'
      - series: 'devicechain_eventsources_mqtt_failclosed_durable_present{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", durable="events"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: JetStreamDurableLostUnread
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_alarm-events
              durable: devicechain_notification-management_alarm-events
            exp_annotations:
              summary: "a consumer lost messages it never read"
              description: "Durable devicechain_notification-management_alarm-events on stream devicechain_alarm-events stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamDurableFallingBehind and JetStreamDurableUnreadNearFull, which watch this consumer's backlog, tell the two apart."

  # ------------------------------------------------------------------
  # A stalled durable with messages already discarded ahead of it.
  #
  #   minutes 0- 4   gap 0
  #   minutes 5-24   gap 18 (the consumer was handed nothing; the stream kept discarding)
  #   minutes 25+    gap 0  (it resumed and stepped over the hole)
  # ------------------------------------------------------------------
  - name: a stalled durable behind a discarding stream pages after 2m
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_unread_gap_messages{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0x4 18x19 0x30'
      # A second durable at 0 must not appear in the alert.
      - series: 'devicechain_eventmanagement_jetstream_consumer_unread_gap_messages{namespace="dci-devicechain", pod="dc-event-management-7c9f-fffff", job="devicechain/event-management", stream="devicechain_resolved-events", durable="devicechain_event-management_resolved-events"}'
        values: '0x60'
    alert_rule_test:
      # Over zero from minute 5, but the 2m `for` has not elapsed at minute 6.
      - eval_time: 6m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts: []
      - eval_time: 10m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "a consumer that stopped reading is losing messages it has not read"
              description: "Durable devicechain_device-state_resolved-events on stream devicechain_resolved-events has been handed no messages for at least two minutes, and the stream has already discarded 18 messages ahead of it. They will never be delivered. The consuming service is running, since it reports this, but its consumer is not reading: look for message handling stuck on a dependency such as the database, or pods waiting to become ready. If that cannot be fixed quickly, raise the stream's ceiling so it stops discarding."
      - eval_time: 40m
        alertname: JetStreamDurableStalledBehindStream
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 THE DEFECT. resolved-events at 95% of its ceiling, measured as production
  # reports it: the fill from the service that WRITES it (device-management) and from a
  # reader that ensures it too (device-state), the backlog from device-state, which has
  # read all but 12 messages. That is a week of history consumers have read, and it
  # loses nothing. Before, JetStreamStreamNearFull fired a warning here, from 5M events
  # on, on every busy healthy install.
  # ------------------------------------------------------------------
  - name: a stream full of history its consumers have read is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '950x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '1000x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '9500x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '10000x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '0x40'
      - series: 'devicechain_devicestate_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '950x40'
      - series: 'devicechain_devicestate_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '1000x40'
      - series: 'devicechain_devicestate_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '9500x40'
      - series: 'devicechain_devicestate_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '10000x40'
      - series: 'devicechain_devicestate_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events"}'
        values: '0x40'
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '12x40'
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0.0012x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts: []
      - eval_time: 35m
        alertname: JetStreamStreamNearFull
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 NOT SELECTED BY ABSENCE. An ingest-only install: device-management writes
  # resolved-events and nothing that reads it is deployed, so no consumer backlog is
  # reported at all. The stream still fills with a week of history, and it is still
  # not a sink. A rule that selected "streams nobody reports reading" fires here.
  # ------------------------------------------------------------------
  - name: a stream whose readers are not deployed is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '950x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '1000x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '9500x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '10000x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # Sinks near their ceiling warn, at info, after 10m, one alert per stream across the
  # services that report it:
  #   - failed-events at 90% of its bytes, reported by both of its writers;
  #   - max-deliveries at 85%, whose recorder durable is never sampled;
  #   - connector-dispatch.dead with small records: 10% of its bytes but 90% of its
  #     MESSAGE ceiling, which is the limit it reaches first;
  #   - failed-decode at 50%: under the threshold, quiet.
  # ------------------------------------------------------------------
  - name: a sink near its ceiling warns at info
    interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_failed-events"}'
        values: '900x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_failed-events"}'
        values: '1000x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_failed-events"}'
        values: '90x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_failed-events"}'
        values: '10000x40'
      - series: 'devicechain_devicemanagement_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_failed-events"}'
        values: '1x40'
      - series: 'devicechain_eventmanagement_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-event-management-7c9f-bbbbb", job="devicechain/event-management", stream="devicechain_failed-events"}'
        values: '900x40'
      - series: 'devicechain_eventmanagement_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-event-management-7c9f-bbbbb", job="devicechain/event-management", stream="devicechain_failed-events"}'
        values: '1000x40'
      - series: 'devicechain_eventmanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-event-management-7c9f-bbbbb", job="devicechain/event-management", stream="devicechain_failed-events"}'
        values: '90x40'
      - series: 'devicechain_eventmanagement_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-event-management-7c9f-bbbbb", job="devicechain/event-management", stream="devicechain_failed-events"}'
        values: '10000x40'
      - series: 'devicechain_eventmanagement_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-event-management-7c9f-bbbbb", job="devicechain/event-management", stream="devicechain_failed-events"}'
        values: '1x40'
      - series: 'devicechain_eventsources_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_max-deliveries"}'
        values: '850x40'
      - series: 'devicechain_eventsources_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_max-deliveries"}'
        values: '1000x40'
      - series: 'devicechain_eventsources_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_max-deliveries"}'
        values: '1x40'
      - series: 'devicechain_outboundconnectors_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch.dead"}'
        values: '100x40'
      - series: 'devicechain_outboundconnectors_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch.dead"}'
        values: '1000x40'
      - series: 'devicechain_outboundconnectors_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch.dead"}'
        values: '9000x40'
      - series: 'devicechain_outboundconnectors_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch.dead"}'
        values: '10000x40'
      - series: 'devicechain_outboundconnectors_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-outbound-connectors-7c9f-ddddd", job="devicechain/outbound-connectors", stream="devicechain_connector-dispatch.dead"}'
        values: '1x40'
      - series: 'devicechain_eventsources_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '500x40'
      - series: 'devicechain_eventsources_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '1000x40'
      - series: 'devicechain_eventsources_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '50x40'
      - series: 'devicechain_eventsources_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '10000x40'
      - series: 'devicechain_eventsources_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '1x40'
    alert_rule_test:
      # Over the threshold from the first sample, but the 10m `for` has not elapsed.
      - eval_time: 5m
        alertname: JetStreamStreamNearFull
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts:
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              stream: devicechain_connector-dispatch.dead
            exp_annotations:
              summary: "A stream of records nothing processes is near its ceiling"
              description: "Stream devicechain_connector-dispatch.dead is over 80% of its ceiling. It holds records for an operator, not messages a service processes, so nothing has read what it holds, and once it is full it discards its oldest records to make room. On failed-decode, failed-events and connector-dispatch.dead those are the records of messages that failed; on max-deliveries they are notices not yet turned into dead letters (MaxDeliveryRecordsWaiting); on dead-letters, the letters themselves, which fires only while user-management, which stores them, does not report reading them, so check that user-management is running. Find what is filling it and fix that: a decoder rejecting a device's payloads, events that fail to resolve or store, a connector whose destination refuses every send. Raise the stream's ceiling only if the records must be kept for longer."
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              stream: devicechain_failed-events
            exp_annotations:
              summary: "A stream of records nothing processes is near its ceiling"
              description: "Stream devicechain_failed-events is over 80% of its ceiling. It holds records for an operator, not messages a service processes, so nothing has read what it holds, and once it is full it discards its oldest records to make room. On failed-decode, failed-events and connector-dispatch.dead those are the records of messages that failed; on max-deliveries they are notices not yet turned into dead letters (MaxDeliveryRecordsWaiting); on dead-letters, the letters themselves, which fires only while user-management, which stores them, does not report reading them, so check that user-management is running. Find what is filling it and fix that: a decoder rejecting a device's payloads, events that fail to resolve or store, a connector whose destination refuses every send. Raise the stream's ceiling only if the records must be kept for longer."
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              stream: devicechain_max-deliveries
            exp_annotations:
              summary: "A stream of records nothing processes is near its ceiling"
              description: "Stream devicechain_max-deliveries is over 80% of its ceiling. It holds records for an operator, not messages a service processes, so nothing has read what it holds, and once it is full it discards its oldest records to make room. On failed-decode, failed-events and connector-dispatch.dead those are the records of messages that failed; on max-deliveries they are notices not yet turned into dead letters (MaxDeliveryRecordsWaiting); on dead-letters, the letters themselves, which fires only while user-management, which stores them, does not report reading them, so check that user-management is running. Find what is filling it and fix that: a decoder rejecting a device's payloads, events that fail to resolve or store, a connector whose destination refuses every send. Raise the stream's ceiling only if the records must be kept for longer."

  # ------------------------------------------------------------------
  # A sink some service reports reading is that consumer's to watch: dead-letters at
  # 95%, read by user-management, is quiet while user-management reports its backlog.
  # ------------------------------------------------------------------
  - name: a sink a service reads is left to its consumer
    interval: 1m
    input_series:
      - series: 'devicechain_usermanagement_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-user-management-7c9f-aaaaa", job="devicechain/user-management", stream="devicechain_dead-letters"}'
        values: '950x40'
      - series: 'devicechain_usermanagement_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-user-management-7c9f-aaaaa", job="devicechain/user-management", stream="devicechain_dead-letters"}'
        values: '1000x40'
      - series: 'devicechain_usermanagement_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-user-management-7c9f-aaaaa", job="devicechain/user-management", stream="devicechain_dead-letters"}'
        values: '1x40'
      - series: 'devicechain_usermanagement_jetstream_consumer_pending_messages{namespace="dci-devicechain", pod="dc-user-management-7c9f-aaaaa", job="devicechain/user-management", stream="devicechain_dead-letters", durable="devicechain_user-management_dead-letters"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # Only the STORE's reading takes dead-letters off this alert. command-delivery also
  # reads it, to settle its commands, but a letter it has read is not stored: with
  # user-management down and command-delivery running, the letters nobody has stored
  # are near the ceiling and nothing else reports them. (Quiet if the `unless` matches
  # any reader of the stream.)
  # ------------------------------------------------------------------
  - name: dead-letters read only by command-delivery still fires
    interval: 1m
    input_series:
      - series: 'devicechain_commanddelivery_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-command-delivery-7c9f-aaaaa", job="devicechain/command-delivery", stream="devicechain_dead-letters"}'
        values: '950x40'
      - series: 'devicechain_commanddelivery_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-command-delivery-7c9f-aaaaa", job="devicechain/command-delivery", stream="devicechain_dead-letters"}'
        values: '1000x40'
      - series: 'devicechain_commanddelivery_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-command-delivery-7c9f-aaaaa", job="devicechain/command-delivery", stream="devicechain_dead-letters"}'
        values: '1x40'
      - series: 'devicechain_commanddelivery_jetstream_consumer_pending_messages{namespace="dci-devicechain", pod="dc-command-delivery-7c9f-aaaaa", job="devicechain/command-delivery", stream="devicechain_dead-letters", durable="devicechain_command-delivery_dead-letters"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts:
          - exp_labels:
              severity: info
              devicechain_instance: devicechain
              stream: devicechain_dead-letters
            exp_annotations:
              summary: "A stream of records nothing processes is near its ceiling"
              description: "Stream devicechain_dead-letters is over 80% of its ceiling. It holds records for an operator, not messages a service processes, so nothing has read what it holds, and once it is full it discards its oldest records to make room. On failed-decode, failed-events and connector-dispatch.dead those are the records of messages that failed; on max-deliveries they are notices not yet turned into dead letters (MaxDeliveryRecordsWaiting); on dead-letters, the letters themselves, which fires only while user-management, which stores them, does not report reading them, so check that user-management is running. Find what is filling it and fix that: a decoder rejecting a device's payloads, events that fail to resolve or store, a connector whose destination refuses every send. Raise the stream's ceiling only if the records must be kept for longer."

  # ------------------------------------------------------------------
  # A sink with no ceiling (both limits -1, as JetStream reports "unlimited") has
  # nothing to be near: quiet however much it holds. (Fires if a limit of -1 is
  # clamped to 1 instead of dropped, which reads 5000 bytes as 5000x full.)
  # ------------------------------------------------------------------
  - name: an unlimited sink is never near its ceiling
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_stream_used_bytes{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '5000x40'
      - series: 'devicechain_eventsources_jetstream_stream_limit_bytes{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '-1x40'
      - series: 'devicechain_eventsources_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '5000x40'
      - series: 'devicechain_eventsources_jetstream_stream_limit_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '-1x40'
      - series: 'devicechain_eventsources_jetstream_stream_sink{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="devicechain_failed-decode"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamStreamNearFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # A consumer's unread backlog over 80% of its stream: warns after 5m, once per
  # durable although two pods of the reading service report it.
  # ------------------------------------------------------------------
  - name: a consumer's unread backlog near the ceiling warns after 5m
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0.85x10'
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-fffff", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0.84x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts: []
      - eval_time: 6m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "A consumer is close to losing messages it has not read"
              description: "Durable devicechain_device-state_resolved-events has not yet read 85% of what stream devicechain_resolved-events can hold. Once its unread backlog reaches the stream's ceiling, the stream discards its oldest messages to make room, and this consumer will never process the ones it had not reached (JetStreamDurableLostUnread). New messages are still accepted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."

  # ------------------------------------------------------------------
  # 🔴 MAX, NOT SUM, and quiet cases each carrying its series:
  #   - two pods measuring the same consumer at 0.5 and 0.45 (a sum would be 0.95);
  #   - a spike over 0.8 shorter than the `for`;
  #   - another instance's namespace at 0.99.
  # ------------------------------------------------------------------
  - name: two readers under the threshold, a short spike and another instance are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0.5x10'
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-fffff", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0.45x10'
      - series: 'devicechain_eventprocessing_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-processing-7c9f-ggggg", job="devicechain/event-processing", stream="devicechain_derived-events", durable="devicechain_event-processing_derived-events"}'
        values: '0.85x3 0.5x7'
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-other", pod="dc-device-state-7c9f-zzzzz", job="other/device-state", stream="other_resolved-events", durable="other_device-state_resolved-events"}'
        values: '0.99x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts: []
      - eval_time: 9m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # The capture stream's unread backlog is growing 8 points a minute, as it did
  # in a perf run that lost acknowledged MQTT events: at minute 2 (16%) ten
  # minutes is not yet enough to fill it, at minute 3 (24%) it is, and one
  # minute of `for` later, at minute 4 (32%), it pages, once per durable although
  # two event-sources pods report it; it is still firing at minute 5 (40%).
  # ------------------------------------------------------------------
  - name: a capture backlog that will fill within ten minutes pages
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture_unfiltered"}'
        values: '0+0.08x12'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-bbbbb", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture_unfiltered"}'
        values: '0+0.075x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 3m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 4m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture_unfiltered
            exp_annotations:
              summary: "MQTT events the broker has already acknowledged are about to be lost"
              description: "Durable devicechain_event-sources_device-events-capture_unfiltered has not yet forwarded 32% of what stream devicechain_device-events-capture can hold, and at the rate that backlog grew over the last three minutes the stream will be full within ten. Every event in it was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. If event-sources is not busy on CPU, its publish window is the limit: devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"} grows by close to a second per second; add event-sources replicas, each of which brings its own window (capture.publishWindow already defaults to its maximum, 1024; raise it only if it was lowered). If inbound-events is refusing new events (JetStreamIngestBackpressureEngaged), the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume, and streamMaxMsgs too if the stream fills by message count first (small payloads); event-sources applies the new ceilings when it restarts."
      - eval_time: 5m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture_unfiltered
            exp_annotations:
              summary: "MQTT events the broker has already acknowledged are about to be lost"
              description: "Durable devicechain_event-sources_device-events-capture_unfiltered has not yet forwarded 40% of what stream devicechain_device-events-capture can hold, and at the rate that backlog grew over the last three minutes the stream will be full within ten. Every event in it was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. If event-sources is not busy on CPU, its publish window is the limit: devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"} grows by close to a second per second; add event-sources replicas, each of which brings its own window (capture.publishWindow already defaults to its maximum, 1024; raise it only if it was lowered). If inbound-events is refusing new events (JetStreamIngestBackpressureEngaged), the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume, and streamMaxMsgs too if the stream fills by message count first (small payloads); event-sources applies the new ceilings when it restarts."

  # ------------------------------------------------------------------
  # A backlog that sat still at 30% for ten minutes and then starts climbing
  # 10 points a minute. The rule must judge the rate it is growing at NOW,
  # over its three-minute window: at minute 11 (40%) the window still holds
  # the flat stretch and gives more than ten minutes, at 12 (50%) it gives
  # five, and one minute of `for` later it pages. A window long enough to
  # average the flat stretch in would still see more than ten minutes left
  # at minute 13 and say nothing until it was too late.
  # ------------------------------------------------------------------
  - name: a steady capture backlog that starts climbing pages on its current rate
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0.3x10 0.4 0.5 0.6 0.7'
    alert_rule_test:
      - eval_time: 12m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 13m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture
            exp_annotations:
              summary: "MQTT events the broker has already acknowledged are about to be lost"
              description: "Durable devicechain_event-sources_device-events-capture has not yet forwarded 60% of what stream devicechain_device-events-capture can hold, and at the rate that backlog grew over the last three minutes the stream will be full within ten. Every event in it was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. If event-sources is not busy on CPU, its publish window is the limit: devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"} grows by close to a second per second; add event-sources replicas, each of which brings its own window (capture.publishWindow already defaults to its maximum, 1024; raise it only if it was lowered). If inbound-events is refusing new events (JetStreamIngestBackpressureEngaged), the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume, and streamMaxMsgs too if the stream fills by message count first (small payloads); event-sources applies the new ceilings when it restarts."

  # ------------------------------------------------------------------
  - name: a foreign message dropped by the capture reader warns, then ages out
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_reader_foreign_dropped_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture_unfiltered"}'
        values: '0x9 2x40'
      - series: 'devicechain_eventsources_jetstream_reader_foreign_dropped_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-bbbbb", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture_unfiltered"}'
        values: '0x49'
    alert_rule_test:
      - eval_time: 8m
        alertname: JetStreamReaderForeignDropped
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamReaderForeignDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture_unfiltered
            exp_annotations:
              summary: "The device capture reader dropped messages that no device published"
              description: "Durable devicechain_event-sources_device-events-capture_unfiltered on stream devicechain_device-events-capture was handed messages stored under a subject it does not read, and dropped them without passing them on: 2 in the last 15 minutes. Its broker-side consumer reads the whole stream unfiltered, so the reader itself keeps only the subjects devices publish telemetry on. Device publishes never land there under another subject, so a dropped message was put into the stream some other way, most likely by a push consumer on another stream whose delivery subject is a device telemetry subject. Nothing was forwarded and no device event is missing, but whoever can create such a consumer is writing into device intake: look for push consumers with a device telemetry delivery subject (nats consumer ls on each stream) and at which login created them. The reader logs the subject and sequence of the first message it drops."
      - eval_time: 40m
        alertname: JetStreamReaderForeignDropped
        exp_alerts: []

  # ------------------------------------------------------------------
  # Quiet, each case carrying its series:
  #   - a capture backlog DRAINING from 60% (a negative slope is not a time left);
  #   - one at 30% growing so slowly it would take hours to fill;
  #   - a burst that stays under the 10% floor;
  #   - device-state's durable filling just as fast (the rule is for the capture
  #     durable only; JetStreamDurableUnreadNearFull covers every other one);
  #   - another instance's capture durable filling fast.
  # ------------------------------------------------------------------
  - name: a draining, slow or small capture backlog, another durable and another instance are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0.6-0.02x12'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ccccc", job="devicechain/event-sources", stream="slow_device-events-capture", durable="slow_event-sources_device-events-capture"}'
        values: '0.3+0.002x12'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ddddd", job="devicechain/event-sources", stream="burst_device-events-capture", durable="burst_event-sources_device-events-capture"}'
        values: '0 0.09x11'
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0+0.08x12'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-other", pod="dc-event-sources-7c9f-zzzzz", job="other/event-sources", stream="other_device-events-capture", durable="other_event-sources_device-events-capture"}'
        values: '0+0.08x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 10m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []

  # ------------------------------------------------------------------
  # THE EARLY TIER. A capture backlog growing 2 points a minute from empty needs
  # 0.9 / 0.02 = 45 minutes to fill from 10%, so it is outside the twenty-minute horizon
  # and the warning stays quiet throughout, as does the critical rule.
  # ------------------------------------------------------------------
  - name: a slow capture backlog is outside the twenty minute horizon
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0+0.02x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []
      - eval_time: 15m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []

  # ------------------------------------------------------------------
  # Growing 4 points a minute: the time left, (1 - ratio) / 0.04 per minute, is under
  # twenty once the ratio passes 20% (minute 5), so the early tier is pending from
  # minute 6 and warns at minute 8 (32%), after its two minutes of `for`. The critical
  # tier, whose horizon is ten minutes, is still quiet then (0.68 / 0.04 = 17 minutes
  # left); it takes over at minute 15 (60%), where both are firing.
  # ------------------------------------------------------------------
  - name: a capture backlog that will fill within twenty minutes warns before the critical tier
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0+0.04x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []
      - eval_time: 8m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture
            exp_annotations:
              summary: "MQTT events waiting to be forwarded are piling up faster than they leave"
              description: "Durable devicechain_event-sources_device-events-capture has not yet forwarded 32% of what stream devicechain_device-events-capture can hold, and at the rate that backlog grew over the last five minutes the stream will be full within twenty. This is the early warning for JetStreamCaptureBacklogWillOverflow, which fires when ten minutes remain. Every event in the backlog was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. Add event-sources replicas now, each of which brings its own publish window, and look at event-sources CPU and at devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"}; if JetStreamIngestBackpressureEngaged is firing, the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume."
      - eval_time: 8m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []

  # ------------------------------------------------------------------
  # Quiet, each case carrying its series: a draining backlog, one under the 10% floor
  # that grows fast, another durable growing just as fast, and another instance's capture
  # durable growing fast.
  # ------------------------------------------------------------------
  - name: a draining, small, other-durable and other-instance backlog do not warn early
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0.6-0.02x15'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ddddd", job="devicechain/event-sources", stream="burst_device-events-capture", durable="burst_event-sources_device-events-capture"}'
        values: '0 0.09x14'
      - series: 'devicechain_devicestate_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-device-state-7c9f-eeeee", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events"}'
        values: '0+0.04x15'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-other", pod="dc-event-sources-7c9f-zzzzz", job="other/event-sources", stream="other_device-events-capture", durable="other_event-sources_device-events-capture"}'
        values: '0+0.04x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []
      - eval_time: 14m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []

  # ------------------------------------------------------------------
  # THE LEADER CHANGE. The counter of each of two pods sits at 0 (it is created at 0 when
  # the stream is first read, so the first change is an increase from 0) while 100
  # messages a minute arrive, then steps to 1 at minute 10, as the capture stream's leader
  # did in the run that lost 59,964 acknowledged events. It warns at once (once, although
  # two pods count it), still warns at minute 20, and clears when the change ages out of
  # the 15-minute window.
  # ------------------------------------------------------------------
  - name: a capture stream leader change while events arrive warns, then ages out
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture"}'
        values: '0x9 1x40'
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-bbbbb", job="devicechain/event-sources", stream="devicechain_device-events-capture"}'
        values: '0x9 1x40'
      - series: 'devicechain_eventsources_total_inbound_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", source="gateway"}'
        values: '0+100x49'
    alert_rule_test:
      - eval_time: 8m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts: []
      - eval_time: 12m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
            exp_annotations:
              summary: "The MQTT capture stream changed leader while devices were publishing"
              description: "Stream devicechain_device-events-capture changed leader within the last 15 minutes while events were arriving. While a stream has no leader, which lasts several seconds, the broker's MQTT gateway still acknowledges device QoS 1 publishes into it and stores them nowhere, and nothing counts them: JetStreamDurableLostUnread does not fire for this loss, so MQTT events published during the change may have been acknowledged to their devices and lost. In a 12,000 events per second test one such step-down lost about five seconds of events. Look in the broker logs for 'Leader falling behind, stepping down': that is a leader whose node is overloaded, so check the broker's node CPU and whether the capture leader shares a node with the inbound-events leader. A planned broker restart moves leaders too and may lose events the same way, so schedule one at low traffic. This is a known limitation of MQTT ingest, described with the MQTT transport in the documentation."
      - eval_time: 20m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
            exp_annotations:
              summary: "The MQTT capture stream changed leader while devices were publishing"
              description: "Stream devicechain_device-events-capture changed leader within the last 15 minutes while events were arriving. While a stream has no leader, which lasts several seconds, the broker's MQTT gateway still acknowledges device QoS 1 publishes into it and stores them nowhere, and nothing counts them: JetStreamDurableLostUnread does not fire for this loss, so MQTT events published during the change may have been acknowledged to their devices and lost. In a 12,000 events per second test one such step-down lost about five seconds of events. Look in the broker logs for 'Leader falling behind, stepping down': that is a leader whose node is overloaded, so check the broker's node CPU and whether the capture leader shares a node with the inbound-events leader. A planned broker restart moves leaders too and may lose events the same way, so schedule one at low traffic. This is a known limitation of MQTT ingest, described with the MQTT transport in the documentation."
      - eval_time: 40m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts: []

  # ------------------------------------------------------------------
  # Quiet, each case carrying its series:
  #   - a stable leader (the counter flat at 0) with events arriving;
  #   - a pod restart: a series that appears at 3 and stays flat is a reset, not a change;
  #   - another stream's leader change (resolved-events) with events arriving;
  #   - another instance's capture leader change.
  # ------------------------------------------------------------------
  - name: a stable leader, a restart, another stream and another instance are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture"}'
        values: '0x30'
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-ddddd", job="devicechain/event-sources", stream="devicechain_device-events-capture"}'
        values: '_x9 3x20'
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_resolved-events"}'
        values: '0x9 1x20'
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-other", pod="dc-event-sources-7c9f-zzzzz", job="other/event-sources", stream="other_device-events-capture"}'
        values: '0x9 1x20'
      - series: 'devicechain_eventsources_total_inbound_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", source="gateway"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts: []
      - eval_time: 25m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts: []

  # A leader change on an instance with NO INGEST (the inbound counter is flat) loses
  # nothing and stays quiet.
  - name: a capture leader change on an instance with no ingest is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_stream_leader_changes_total{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture"}'
        values: '0x9 1x20'
      - series: 'devicechain_eventsources_total_inbound_messages{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", source="gateway"}'
        values: '500x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamCaptureLeaderChanged
        exp_alerts: []

  # ------------------------------------------------------------------
  # A send ran past the acknowledgement window: one worker-stage count on
  # the notification service's reader.
  # ------------------------------------------------------------------
  - name: a send that ran past the acknowledgement window warns
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="worker"}'
        values: '0x10 1x30'
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="buffer"}'
        values: '0x40'
    alert_rule_test:
      # Before the increase: quiet.
      - eval_time: 9m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []
      - eval_time: 12m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              durable: devicechain_notification-management_alarm-events
              stage: worker
            exp_annotations:
              summary: "A service held a message past its acknowledgement window, so it was redelivered"
              description: "The reader for durable devicechain_notification-management_alarm-events held a message longer than the broker waits for an acknowledgement, so the broker handed it out again. stage=worker: a send was still running when that happened, so the message may have been sent twice -- look for a slow or unresponsive destination behind this service. stage=buffer: the reader dropped a message it had fetched but not yet handed to a worker, and the broker's redelivery is handled instead; nothing was sent twice, but the service is not keeping up."
      # 🔴 THE OCCURRENCE AGES OUT. Once the window no longer spans the increase the
      # alert clears, rather than paging forever over one old event.
      - eval_time: 35m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # Two pods of the connectors service each drop a buffered message: the
  # counts are per pod and summed, and the stage label says which kind.
  # ------------------------------------------------------------------
  - name: buffered drops on two pods are summed per durable and stage
    interval: 1m
    input_series:
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-aaaaa", durable="devicechain_outbound-connectors_connector-dispatch", stage="buffer"}'
        values: '0x5 1x20'
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-bbbbb", durable="devicechain_outbound-connectors_connector-dispatch", stage="buffer"}'
        values: '0x5 1x20'
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-aaaaa", durable="devicechain_outbound-connectors_connector-dispatch", stage="worker"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 8m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              durable: devicechain_outbound-connectors_connector-dispatch
              stage: buffer
            exp_annotations:
              summary: "A service held a message past its acknowledgement window, so it was redelivered"
              description: "The reader for durable devicechain_outbound-connectors_connector-dispatch held a message longer than the broker waits for an acknowledgement, so the broker handed it out again. stage=worker: a send was still running when that happened, so the message may have been sent twice -- look for a slow or unresponsive destination behind this service. stage=buffer: the reader dropped a message it had fetched but not yet handed to a worker, and the broker's redelivery is handled instead; nothing was sent twice, but the service is not keeping up."

  # ------------------------------------------------------------------
  # 🔴 A healthy instance: every series present and flat at zero. Must
  # never page.
  # ------------------------------------------------------------------
  - name: a healthy instance with every held-past series at zero is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="worker"}'
        values: '0x60'
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="buffer"}'
        values: '0x60'
      - series: 'devicechain_outboundconnectors_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-outbound-connectors-5d8b-aaaaa", durable="devicechain_outbound-connectors_connector-dispatch", stage="worker"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []
      - eval_time: 59m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # A counter that is already non-zero when first scraped (a pod that
  # counted before this Prometheus saw it) and stays flat is not a new
  # occurrence, and must not page.
  # ------------------------------------------------------------------
  - name: a held-past counter that appears at n and stays flat is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-devicechain", pod="dc-notification-management-7c9f-abcde", durable="devicechain_notification-management_alarm-events", stage="worker"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # Another instance's namespace is not this instance's alert.
  # ------------------------------------------------------------------
  - name: another instance's held-past counter is not this instance's alert
    interval: 1m
    input_series:
      - series: 'devicechain_notificationmanagement_reader_held_past_ack_wait_total{namespace="dci-other", pod="dc-notification-management-7c9f-abcde", durable="other_notification-management_alarm-events", stage="worker"}'
        values: '0x5 4x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ReaderHeldMessagePastAckWait
        exp_alerts: []

  # ------------------------------------------------------------------
  # MaxDeliveryRecordsWaiting. The capture is a work queue, so its count is
  # the backlog nobody has recorded. Two pods sample the same stream and
  # report the same count: `max`, one alert.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-6f7d-aaaaa", stream="devicechain_max-deliveries"}'
        values: '0x5 2x30'
      - series: 'devicechain_eventprocessing_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-event-processing-5c4b-bbbbb", stream="devicechain_max-deliveries"}'
        values: '0x5 2x30'
    alert_rule_test:
      # Waiting, but not yet for the whole window: a recorder that is merely restarting.
      - eval_time: 15m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts: []
      - eval_time: 25m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_max-deliveries
            exp_annotations:
              summary: "Messages that ran out of delivery attempts are waiting to be recorded"
              description: "2 notice(s) of messages whose every delivery attempt ran out have been waiting on devicechain_max-deliveries for 15 minutes without being turned into dead letters. Each service records its own; one that is down or crash-looping records late, so first check that every service is running and look in its logs for errors from the max-delivery recorder. A notice that stays after every service is healthy names a consumer no running service reads any more (a reader removed by an upgrade); it will not be recorded, and can be deleted from the stream."

  # ------------------------------------------------------------------
  # 🔴 A healthy instance: the capture exists and is empty, and a busy
  # ordinary stream is not this alert's business.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-6f7d-aaaaa", stream="devicechain_max-deliveries"}'
        values: '0x60'
      - series: 'devicechain_devicemanagement_jetstream_stream_used_messages{namespace="dci-devicechain", pod="dc-device-management-6f7d-aaaaa", stream="devicechain_raise-alarm"}'
        values: '500x60'
      - series: 'devicechain_notificationmanagement_jetstream_stream_used_messages{namespace="dci-other", pod="dc-notification-management-7c9f-abcde", stream="other_max-deliveries"}'
        values: '9x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts: []
      - eval_time: 59m
        alertname: MaxDeliveryRecordsWaiting
        exp_alerts: []

  # ------------------------------------------------------------------
  # ReplayCoveredDeliveriesExhausted. A checkpoint outage on a replay-covered
  # consumer exhausts deliveries in a burst. Two replicas share one recorder
  # durable, so each exhaustion is counted on ONE of them -- 3 on one pod and
  # 2 on the other are 5 exhaustions, and the rule must say 5, not 3.
  #
  #   minutes  0- 9   both at 0 (created at 0 by the recorder)
  #   minute  10      pod a counts 3, pod b counts 2
  #   minutes 11+     flat
  # ------------------------------------------------------------------
  - name: a replay-covered consumer that ran out of deliveries warns, summed across pods
    interval: 1m
    input_series:
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-aaaaa", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '0x9 3x60'
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-bbbbb", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '0x9 2x60'
      # A LETTERED exhaustion on another consumer of the same stream is the dead
      # letter's business, not this alert's.
      - series: 'devicechain_eventmanagement_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-management-7d8e-ccccc", job="devicechain/event-management", stream="devicechain_resolved-events", outcome="lettered"}'
        values: '0x9 4x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []
      - eval_time: 15m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: devicechain/event-processing
              stream: devicechain_resolved-events
            exp_annotations:
              summary: "A consumer ran out of delivery attempts because it could not save its checkpoint"
              description: "5 message(s) on devicechain_resolved-events ran out of delivery attempts to devicechain/event-processing in the last 15 minutes. This consumer re-reads the stream from its own saved checkpoint, so nothing has been lost and no dead letter is written, but its checkpoint has not been saved for longer than the broker keeps redelivering: look for the service's database or broker connection failing. While it is running it keeps what it has read in memory and saves it when the checkpoint succeeds. If it restarts first, it re-reads the stream from the last saved checkpoint, and a message the stream has already discarded cannot be re-read (JetStreamDurableUnreadNearFull warns before that)."
      # The window has passed and nothing new ran out: quiet again.
      - eval_time: 30m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []

  # ------------------------------------------------------------------
  # 🔴 Quiet cases: the series at zero on a healthy instance, a counter that
  # APPEARS at n and stays flat (a restart, from Prometheus's side), and
  # another instance's namespace.
  # ------------------------------------------------------------------
  - name: a healthy, restarted or foreign replay-covered counter is quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-aaaaa", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '0x60'
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-devicechain", pod="dc-event-processing-5c4b-ddddd", job="devicechain/event-processing", stream="devicechain_resolved-events", outcome="replay-covered"}'
        values: '7x60'
      - series: 'devicechain_eventprocessing_max_delivery_records_total{namespace="dci-other", pod="dc-event-processing-5c4b-eeeee", job="other/event-processing", stream="other_resolved-events", outcome="replay-covered"}'
        values: '0x9 6x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []
      - eval_time: 59m
        alertname: ReplayCoveredDeliveriesExhausted
        exp_alerts: []

  # ------------------------------------------------------------------
  # JetStreamDurableFallingBehind. device-state's durable stays 20000 behind
  # on both replicas: one alert per durable, after the 15m `for`, carrying the
  # current backlog.
  # ------------------------------------------------------------------
  - name: a durable that stays behind its stream warns after 15m
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-aaaaa"}'
        values: '20000x40'
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-bbbbb"}'
        values: '20000x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 16m
        alertname: JetStreamDurableFallingBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "a consumer has stayed more than 10000 messages behind its stream for 15 minutes"
              description: "Durable devicechain_device-state_resolved-events on stream devicechain_resolved-events has had more than 10000 messages waiting for it for the last 15 minutes (20000 now). Whatever that service produces from the stream is that far behind: for device-state, a device's live state lags its stored events. Compare the consumer's rate with the stream's: if the service is keeping pace but not catching up, give it capacity (for device-state, its projection settings and its database); if it has stopped, JetStreamDurableStalledBehindStream and the service's logs say why. If the stream fills first, messages the consumer has not reached will be lost, except where the stream applies backpressure (inbound-events for device-management, resolved-events for event-management): there new events are refused instead (JetStreamIngestBackpressureEngaged)."

  # ------------------------------------------------------------------
  # Two replicas of one service read one durable and sample it a moment apart:
  # ONE alert, carrying the larger reading -- max, not sum, which would report
  # 27000 for a backlog of at most 15000.
  # ------------------------------------------------------------------
  - name: a falling-behind durable is one alert, not one per pod
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-aaaaa"}'
        values: '15000x30'
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-bbbbb"}'
        values: '12000x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: JetStreamDurableFallingBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "a consumer has stayed more than 10000 messages behind its stream for 15 minutes"
              description: "Durable devicechain_device-state_resolved-events on stream devicechain_resolved-events has had more than 10000 messages waiting for it for the last 15 minutes (15000 now). Whatever that service produces from the stream is that far behind: for device-state, a device's live state lags its stored events. Compare the consumer's rate with the stream's: if the service is keeping pace but not catching up, give it capacity (for device-state, its projection settings and its database); if it has stopped, JetStreamDurableStalledBehindStream and the service's logs say why. If the stream fills first, messages the consumer has not reached will be lost, except where the stream applies backpressure (inbound-events for device-management, resolved-events for event-management): there new events are refused instead (JetStreamIngestBackpressureEngaged)."

  # ------------------------------------------------------------------
  # 🔴 A SERIES BORN ABOVE THE THRESHOLD. The gauge does not exist until a
  # pod's first sample, so a pod that restarts onto a backlog starts its
  # series high. Pod A reads 0 and is replaced at minute 20; pod B's first
  # sample, at minute 21, is already 20000. "For 15 minutes" means from
  # minute 21: quiet at 25m and 35m, firing at 36m. An expression that
  # judged the window with min_over_time() would fire at minute 21, over
  # one sample -- this scenario is what fails it.
  # ------------------------------------------------------------------
  - name: a series born above the threshold waits the full 15m
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-aaaaa"}'
        values: '0x20 stale'
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-ccccc"}'
        values: '_x21 20000x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 35m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 36m
        alertname: JetStreamDurableFallingBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "a consumer has stayed more than 10000 messages behind its stream for 15 minutes"
              description: "Durable devicechain_device-state_resolved-events on stream devicechain_resolved-events has had more than 10000 messages waiting for it for the last 15 minutes (20000 now). Whatever that service produces from the stream is that far behind: for device-state, a device's live state lags its stored events. Compare the consumer's rate with the stream's: if the service is keeping pace but not catching up, give it capacity (for device-state, its projection settings and its database); if it has stopped, JetStreamDurableStalledBehindStream and the service's logs say why. If the stream fills first, messages the consumer has not reached will be lost, except where the stream applies backpressure (inbound-events for device-management, resolved-events for event-management): there new events are refused instead (JetStreamIngestBackpressureEngaged)."

  # ------------------------------------------------------------------
  # 🔴 Quiet cases, each carrying its series so that silence is the rule's
  # answer and not a missing input:
  #   - a burst worked off inside the window: over the threshold for 14
  #     minutes, then back to 0 -- quiet at every point, including the last
  #     minute over it;
  #   - a backlog AT the threshold (the comparison is strict);
  #   - a caught-up durable at 0;
  #   - event-processing's resolved-events durable, 60000 behind for 30
  #     minutes: DETECT's own alert watches it, and a takeover replays it by
  #     design;
  #   - another instance's namespace.
  # ------------------------------------------------------------------
  - name: a worked-off burst, the threshold, a caught-up durable, DETECT's replay and another instance are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/device-state", stream="devicechain_resolved-events", durable="devicechain_device-state_resolved-events", pod="dc-device-state-7c9f-aaaaa"}'
        values: '0x5 20000x13 0x30'
      - series: 'devicechain_eventmanagement_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/event-management", stream="devicechain_resolved-events", durable="devicechain_event-management_resolved-events", pod="dc-event-management-7c9f-aaaaa"}'
        values: '10000x50'
      - series: 'devicechain_commanddelivery_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/command-delivery", stream="devicechain_command-responses", durable="devicechain_command-delivery_command-responses", pod="dc-command-delivery-7c9f-aaaaa"}'
        values: '0x50'
      - series: 'devicechain_eventprocessing_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/event-processing", stream="devicechain_resolved-events", durable="devicechain_event-processing_resolved-events", pod="dc-event-processing-5c4b-aaaaa"}'
        values: '60000x50'
      - series: 'devicechain_eventprocessing_jetstream_consumer_pending_messages{namespace="dci-devicechain", job="devicechain/event-processing", stream="devicechain_resolved-events", durable="devicechain_event-processing_resolved-events_ackfloor", pod="dc-event-processing-5c4b-bbbbb"}'
        values: '60000x50'
      - series: 'devicechain_devicestate_jetstream_consumer_pending_messages{namespace="dci-other", job="other/device-state", stream="other_resolved-events", durable="other_device-state_resolved-events", pod="dc-device-state-7c9f-zzzzz"}'
        values: '60000x50'
    alert_rule_test:
      - eval_time: 18m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 19m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 30m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 45m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []

  # ------------------------------------------------------------------
  # A gating consumer's unread backlog sits over 80% of its stream: warns after 5m,
  # once per durable although two writer services (two pods) report it.
  # ------------------------------------------------------------------
  - name: a gating consumer's unread backlog near the ceiling warns after 5m
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_backpressure_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_inbound-events", durable="devicechain_device-management_inbound-events"}'
        values: '0.85x10'
      - series: 'devicechain_sparkplugingest_jetstream_backpressure_unread_ratio{namespace="dci-devicechain", pod="dc-sparkplug-ingest-7c9f-bbbbb", job="devicechain/sparkplug-ingest", stream="devicechain_inbound-events", durable="devicechain_device-management_inbound-events"}'
        values: '0.84x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: JetStreamUnreadBacklogNearFull
        exp_alerts: []
      - eval_time: 6m
        alertname: JetStreamUnreadBacklogNearFull
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_inbound-events
              durable: devicechain_device-management_inbound-events
            exp_annotations:
              summary: "A consumer's unread backlog is near its stream's ceiling"
              description: "Durable devicechain_device-management_inbound-events has not yet processed 85% of what stream devicechain_inbound-events can hold. At 90% the platform stops accepting new events on that stream, for every tenant, rather than discard events this consumer has not read: HTTP devices are answered 503 with a Retry-After, MQTT devices' events wait in the capture stream, and Sparkplug and LwM2M readings, and events from an external MQTT broker, are dropped and counted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."

  # ------------------------------------------------------------------
  # 🔴 MAX, NOT SUM, and quiet cases each carrying its series:
  #   - two pods measuring the same consumer at 0.5 and 0.45 (a sum would be 0.95);
  #   - a spike over 0.8 shorter than the `for`;
  #   - another instance's namespace at 0.99.
  # ------------------------------------------------------------------
  - name: two writers under the threshold, a short spike and another instance are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_backpressure_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_inbound-events", durable="devicechain_device-management_inbound-events"}'
        values: '0.5x10'
      - series: 'devicechain_eventsources_jetstream_backpressure_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-bbbbb", job="devicechain/event-sources", stream="devicechain_inbound-events", durable="devicechain_device-management_inbound-events"}'
        values: '0.45x10'
      - series: 'devicechain_devicemanagement_jetstream_backpressure_unread_ratio{namespace="dci-devicechain", pod="dc-device-management-7c9f-ccccc", job="devicechain/device-management", stream="devicechain_resolved-events", durable="devicechain_event-management_resolved-events"}'
        values: '0.85x3 0.5x7'
      - series: 'devicechain_eventsources_jetstream_backpressure_unread_ratio{namespace="dci-other", pod="dc-event-sources-7c9f-zzzzz", job="other/event-sources", stream="other_inbound-events", durable="other_device-management_inbound-events"}'
        values: '0.99x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: JetStreamUnreadBacklogNearFull
        exp_alerts: []
      - eval_time: 9m
        alertname: JetStreamUnreadBacklogNearFull
        exp_alerts: []

  # ------------------------------------------------------------------
  # The gate engaged: critical after 1m, one alert per stream across pods.
  # ------------------------------------------------------------------
  - name: an engaged gate pages after 1m
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_jetstream_backpressure_engaged{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_inbound-events"}'
        values: '0 1x5'
      - series: 'devicechain_eventsources_jetstream_backpressure_engaged{namespace="dci-devicechain", pod="dc-event-sources-7c9f-bbbbb", job="devicechain/event-sources", stream="devicechain_inbound-events"}'
        values: '0 1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: JetStreamIngestBackpressureEngaged
        exp_alerts: []
      - eval_time: 3m
        alertname: JetStreamIngestBackpressureEngaged
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_inbound-events
            exp_annotations:
              summary: "The platform is refusing new events so as not to lose unread ones"
              description: "Stream devicechain_inbound-events is refusing new events, for every tenant: a consumer's unread backlog reached 90% of the stream's ceiling, the events it has already processed that the full stream still holds ahead of its unread ones would be discarded within 30 seconds at the rate the stream is discarding them, or a service writing to it could not measure that backlog for 30 seconds. HTTP devices are answered 503 with a Retry-After and should retry. Events from MQTT devices were already acknowledged by the broker and wait in the capture stream, which discards its oldest once it is full (JetStreamDurableLostUnread). Sparkplug and LwM2M readings, and events from an external MQTT broker, are dropped and counted. JetStreamUnreadBacklogNearFull names the consumer that is behind; when it is quiet, it is the second case, and jetstream_backpressure_history_runway_seconds and the writing service's log name the consumer. If neither names a consumer, the writing service may not be reaching the broker at all: look in its log for \"Disconnected from NATS\" or a write to the NATS server that \"made no progress\", and for BrokerConnectionDiedSilently; the refusal then lifts once it has reconnected. The refusal lifts once the backlog is below 80% and, if the history was the cause, once that history would last a minute or the consumer has read everything."

  # ------------------------------------------------------------------
  # Quiet: an open gate at 0, and another instance's engaged gate.
  # ------------------------------------------------------------------
  - name: an open gate and another instance's engaged gate are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_jetstream_backpressure_engaged{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events"}'
        values: '0x5'
      - series: 'devicechain_eventsources_jetstream_backpressure_engaged{namespace="dci-other", pod="dc-event-sources-7c9f-zzzzz", job="other/event-sources", stream="other_inbound-events"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: JetStreamIngestBackpressureEngaged
        exp_alerts: []

  # ------------------------------------------------------------------
  # A broker connection that died without being closed: warns at once, per job, for 15m.
  # The gauge sits at 0 (never) and then holds the event's time, 120 (2m).
  # ------------------------------------------------------------------
  - name: a connection given up as dead warns per job for 15 minutes
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_nats_connection_dead_last_timestamp_seconds{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources"}'
        values: '0 0 0 120x20'
      - series: 'devicechain_eventsources_nats_connection_dead_last_timestamp_seconds{namespace="dci-devicechain", pod="dc-event-sources-7c9f-bbbbb", job="devicechain/event-sources"}'
        values: '0x22'
    alert_rule_test:
      - eval_time: 1m
        alertname: BrokerConnectionDiedSilently
        exp_alerts: []
      - eval_time: 4m
        alertname: BrokerConnectionDiedSilently
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: devicechain/event-sources
            exp_annotations:
              summary: "A service's connection to the message broker died without being closed"
              description: "devicechain/event-sources gave up a connection to the message broker 2m 0s ago, because the server had stopped answering without closing it, and reconnected. A machine that stops or restarts abruptly, a network partition, or a broker server that stopped reading looks like this. Until it gave the connection up, for up to 40 seconds, and then reconnected, that service could neither publish nor receive: if it is event-sources, HTTP ingest was refused or timed out. nats_connection_dead_total says how often, and whether pings or a stalled write detected it. Check whether a node was lost or restarted: kubectl get nodes, and the cloud provider's VM events, because Kubernetes records nothing for a machine that restarts within its node grace period (roughly 40 to 50 seconds). Run dcctl ha verify. Repeats for the same job with no node event point at the network between that service and the broker."
      - eval_time: 20m
        alertname: BrokerConnectionDiedSilently
        exp_alerts: []

  # ------------------------------------------------------------------
  # Prometheus missed the 0: it was on the node that was lost, and first sees the gauge
  # at the event's time. Still warns. increase() over the counter would read nothing here.
  # ------------------------------------------------------------------
  - name: a connection given up while Prometheus was away still warns
    interval: 1m
    input_series:
      - series: 'devicechain_eventsources_nats_connection_dead_last_timestamp_seconds{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources"}'
        values: '_ _ _ 60x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: BrokerConnectionDiedSilently
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              job: devicechain/event-sources
            exp_annotations:
              summary: "A service's connection to the message broker died without being closed"
              description: "devicechain/event-sources gave up a connection to the message broker 3m 0s ago, because the server had stopped answering without closing it, and reconnected. A machine that stops or restarts abruptly, a network partition, or a broker server that stopped reading looks like this. Until it gave the connection up, for up to 40 seconds, and then reconnected, that service could neither publish nor receive: if it is event-sources, HTTP ingest was refused or timed out. nats_connection_dead_total says how often, and whether pings or a stalled write detected it. Check whether a node was lost or restarted: kubectl get nodes, and the cloud provider's VM events, because Kubernetes records nothing for a machine that restarts within its node grace period (roughly 40 to 50 seconds). Run dcctl ha verify. Repeats for the same job with no node event point at the network between that service and the broker."

  # ------------------------------------------------------------------
  # Quiet: pods that never lost a connection, and another instance's event.
  # ------------------------------------------------------------------
  - name: no dead connection, and another instance's, are quiet
    interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_nats_connection_dead_last_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management"}'
        values: '0x5'
      - series: 'devicechain_eventsources_nats_connection_dead_last_timestamp_seconds{namespace="dci-other", pod="dc-event-sources-7c9f-zzzzz", job="other/event-sources"}'
        values: '0 60x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: BrokerConnectionDiedSilently
        exp_alerts: []

  # ==================================================================
  # THE BROKER'S OWN COUNT, FOR WHEN THE READER IS GONE.
  #
  # Every scenario below carries ONLY the message broker exporter's series
  # (nats_consumer_*, nats_stream_*): the reading service is down, so the reader's own
  # jetstream_consumer_* series are ABSENT, which is the case that used to leave these
  # alerts empty while the broker held the whole backlog. The broker reports a
  # consumer's pending count on the consumer's leader only, so each scenario carries a
  # follower at 0 as well.
  #
  # Exporter limits: 5,000,000 messages and 1 GiB per stream (the chart defaults), and
  # a stream that holds exactly the backlog at 250 bytes a message, which is what the
  # work-queue capture stream does.
  # ==================================================================

  # The capture backlog climbs 400,000 messages a minute from 600,000 while event-sources
  # is down: 1 GiB binds first (250 bytes x 600,000 is 14% of it), the backlog gains about
  # 9 points a minute, and the stream is full inside ten minutes.
  - name: a capture backlog the broker reports while event-sources is down pages and warns
    interval: 1m
    input_series:
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture", consumer_name="devicechain_event-sources_device-events-capture_unfiltered", is_consumer_leader="true"}'
        values: '600000+400000x12'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_device-events-capture", consumer_name="devicechain_event-sources_device-events-capture_unfiltered", is_consumer_leader="false"}'
        values: '0x12'
      - series: 'nats_consumer_num_ack_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture", consumer_name="devicechain_event-sources_device-events-capture_unfiltered", is_consumer_leader="true"}'
        values: '0x12'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture"}'
        values: '600000+400000x12'
      - series: 'nats_stream_total_bytes{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture"}'
        values: '150000000+100000000x12'
      - series: 'nats_stream_limit_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture"}'
        values: '5000000x12'
      - series: 'nats_stream_limit_bytes{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture"}'
        values: '1073741824x12'
    alert_rule_test:
      - eval_time: 1m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 6m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture_unfiltered
            exp_annotations:
              summary: "MQTT events the broker has already acknowledged are about to be lost"
              description: "Durable devicechain_event-sources_device-events-capture_unfiltered has not yet forwarded 69.85% of what stream devicechain_device-events-capture can hold, and at the rate that backlog grew over the last three minutes the stream will be full within ten. Every event in it was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. If event-sources is not busy on CPU, its publish window is the limit: devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"} grows by close to a second per second; add event-sources replicas, each of which brings its own window (capture.publishWindow already defaults to its maximum, 1024; raise it only if it was lowered). If inbound-events is refusing new events (JetStreamIngestBackpressureEngaged), the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume, and streamMaxMsgs too if the stream fills by message count first (small payloads); event-sources applies the new ceilings when it restarts."
      - eval_time: 6m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_device-events-capture
              durable: devicechain_event-sources_device-events-capture_unfiltered
            exp_annotations:
              summary: "MQTT events waiting to be forwarded are piling up faster than they leave"
              description: "Durable devicechain_event-sources_device-events-capture_unfiltered has not yet forwarded 69.85% of what stream devicechain_device-events-capture can hold, and at the rate that backlog grew over the last five minutes the stream will be full within twenty. This is the early warning for JetStreamCaptureBacklogWillOverflow, which fires when ten minutes remain. Every event in the backlog was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. Add event-sources replicas now, each of which brings its own publish window, and look at event-sources CPU and at devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"}; if JetStreamIngestBackpressureEngaged is firing, the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume."

  # ------------------------------------------------------------------
  # Quiet, each case carrying its series: a broker backlog that is DRAINING, one under the
  # 10% floor, another instance's capture stream growing fast, and a reader that is UP and
  # reporting a small backlog while the broker's figure is large (the reader's series wins;
  # the two are never added, and a durable the reader still reports is not judged twice).
  # ------------------------------------------------------------------
  - name: a draining, small, foreign and reader-reported capture backlog do not page from the broker
    interval: 1m
    input_series:
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture", consumer_name="devicechain_event-sources_device-events-capture_unfiltered"}'
        values: '3000000-200000x12'
      - series: 'nats_stream_limit_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture"}'
        values: '5000000x12'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="burst_device-events-capture", consumer_name="burst_event-sources_device-events-capture_unfiltered"}'
        values: '0 50000x12'
      - series: 'nats_stream_limit_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="burst_device-events-capture"}'
        values: '5000000x12'
      - series: 'nats_consumer_num_pending{namespace="dci-other", pod="dc-nats-1", stream_name="other_device-events-capture", consumer_name="other_event-sources_device-events-capture_unfiltered"}'
        values: '0+800000x12'
      - series: 'nats_stream_limit_messages{namespace="dci-other", pod="dc-nats-1", stream_name="other_device-events-capture"}'
        values: '5000000x12'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_device-events-capture", consumer_name="devicechain_event-sources_device-events-capture"}'
        values: '0+400000x12'
      - series: 'devicechain_eventsources_jetstream_consumer_unread_ratio{namespace="dci-devicechain", pod="dc-event-sources-7c9f-aaaaa", job="devicechain/event-sources", stream="devicechain_device-events-capture", durable="devicechain_event-sources_device-events-capture"}'
        values: '0.05x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 11m
        alertname: JetStreamCaptureBacklogWillOverflow
        exp_alerts: []
      - eval_time: 6m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []
      - eval_time: 11m
        alertname: JetStreamCaptureBacklogGrowing
        exp_alerts: []

  # ------------------------------------------------------------------
  # JetStreamDurableFallingBehind from the broker alone. device-state is down, its durable
  # holds 20,000 messages behind resolved-events for the whole window, and nothing reports it
  # but the broker: one alert, not one per broker pod (the follower reports 0). Quiet beside
  # it, each carrying its series: a backlog under the threshold, DETECT's replay durable, the
  # max-delivery stream, an ephemeral consumer, and another instance's stream.
  # ------------------------------------------------------------------
  - name: a durable the broker holds behind its stream warns without its reader
    interval: 1m
    input_series:
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_device-state_resolved-events"}'
        values: '20000x30'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-0", stream_name="devicechain_resolved-events", consumer_name="devicechain_device-state_resolved-events"}'
        values: '0x30'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_event-management_resolved-events"}'
        values: '9000x30'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_event-processing_resolved-events_ackfloor"}'
        values: '900000x30'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_max-deliveries", consumer_name="devicechain_device-state_max-deliveries"}'
        values: '900000x30'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="Xk3pQ9aZ"}'
        values: '900000x30'
      - series: 'nats_consumer_num_pending{namespace="dci-other", pod="dc-nats-1", stream_name="other_resolved-events", consumer_name="other_device-state_resolved-events"}'
        values: '900000x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: JetStreamDurableFallingBehind
        exp_alerts: []
      - eval_time: 20m
        alertname: JetStreamDurableFallingBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "a consumer has stayed more than 10000 messages behind its stream for 15 minutes"
              description: "Durable devicechain_device-state_resolved-events on stream devicechain_resolved-events has had more than 10000 messages waiting for it for the last 15 minutes (20000 now). Whatever that service produces from the stream is that far behind: for device-state, a device's live state lags its stored events. Compare the consumer's rate with the stream's: if the service is keeping pace but not catching up, give it capacity (for device-state, its projection settings and its database); if it has stopped, JetStreamDurableStalledBehindStream and the service's logs say why. If the stream fills first, messages the consumer has not reached will be lost, except where the stream applies backpressure (inbound-events for device-management, resolved-events for event-management): there new events are refused instead (JetStreamIngestBackpressureEngaged)."

  # ------------------------------------------------------------------
  # JetStreamDurableUnreadNearFull from the broker alone: 4,500,000 unread of a 5,000,000
  # message ceiling is 90%, and 100 bytes a message keeps the byte form well under it, so the
  # message form binds. A durable that gates its stream's writers (it exports
  # jetstream_backpressure_unread_ratio, which the writers keep reporting) is left to
  # JetStreamUnreadBacklogNearFull and stays out of this one.
  # ------------------------------------------------------------------
  - name: a durable near its stream's ceiling warns from the broker's count, and a gating one does not
    interval: 1m
    input_series:
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_device-state_resolved-events"}'
        values: '4500000x10'
      - series: 'nats_consumer_num_ack_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_device-state_resolved-events"}'
        values: '0x10'
      - series: 'nats_consumer_num_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_event-management_resolved-events"}'
        values: '4500000x10'
      - series: 'nats_consumer_num_ack_pending{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events", consumer_name="devicechain_event-management_resolved-events"}'
        values: '0x10'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events"}'
        values: '5000000x10'
      - series: 'nats_stream_total_bytes{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events"}'
        values: '500000000x10'
      - series: 'nats_stream_limit_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events"}'
        values: '5000000x10'
      - series: 'nats_stream_limit_bytes{namespace="dci-devicechain", pod="dc-nats-1", stream_name="devicechain_resolved-events"}'
        values: '1073741824x10'
      - series: 'devicechain_eventmanagement_jetstream_backpressure_unread_ratio{namespace="dci-devicechain", pod="dc-device-management-7c9f-aaaaa", job="devicechain/device-management", stream="devicechain_resolved-events", durable="devicechain_event-management_resolved-events"}'
        values: '0.9x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts: []
      - eval_time: 8m
        alertname: JetStreamDurableUnreadNearFull
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              stream: devicechain_resolved-events
              durable: devicechain_device-state_resolved-events
            exp_annotations:
              summary: "A consumer is close to losing messages it has not read"
              description: "Durable devicechain_device-state_resolved-events has not yet read 90% of what stream devicechain_resolved-events can hold. Once its unread backlog reaches the stream's ceiling, the stream discards its oldest messages to make room, and this consumer will never process the ones it had not reached (JetStreamDurableLostUnread). New messages are still accepted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."
