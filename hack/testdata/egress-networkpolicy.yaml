# The rendered egress NetworkPolicy. Generated by hack/check-egress-ranges.sh --update.
#
# Pinned so that a change to the policy AROUND the deny lists — a selector, policyTypes,
# a peer, an added rule, or a whole second policy document — is a diff somebody accepts on
# purpose. Comparing the prefix lists says nothing about whether the object enforces
# anything at all: policyTypes: [Ingress] leaves the prefixes identical and makes every
# egress rule inert.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        devicechain.io/functional-area: outbound-connectors
        devicechain.io/instance: devicechain
    name: devicechain-outbound-connectors-egress
    namespace: devicechain
spec:
    egress:
        - ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                    kubernetes.io/metadata.name: kube-system
        - ports:
            - port: 4222
              protocol: TCP
            - port: 5432
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                    devicechain.io/component: infrastructure
        - ports:
            - port: 8080
              protocol: TCP
          to:
            - podSelector:
                matchLabels:
                    devicechain.io/functional-area: user-management
                    devicechain.io/instance: devicechain
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
                except:
                    - 0.0.0.0/8
                    - 10.0.0.0/8
                    - 100.64.0.0/10
                    - 127.0.0.0/8
                    - 169.254.0.0/16
                    - 172.16.0.0/12
                    - 192.0.0.0/24
                    - 192.0.2.0/24
                    - 192.88.99.0/24
                    - 192.168.0.0/16
                    - 198.18.0.0/15
                    - 198.51.100.0/24
                    - 203.0.113.0/24
                    - 224.0.0.0/4
                    - 240.0.0.0/4
                    - 168.63.129.16/32
            - ipBlock:
                cidr: ::/0
                except:
                    - ::1/128
                    - ::/128
                    - 64:ff9b:1::/48
                    - 100::/64
                    - 100:0:0:1::/64
                    - 2001:2::/48
                    - 2001:db8::/32
                    - 3fff::/20
                    - 5f00::/16
                    - fc00::/7
                    - fe80::/10
                    - ff00::/8
    podSelector:
        matchLabels:
            devicechain.io/functional-area: outbound-connectors
            devicechain.io/instance: devicechain
    policyTypes:
        - Egress
