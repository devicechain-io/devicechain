#
# nginx server block for the DeviceChain web console (single-page app).
#
# Serves the static Vite bundle and falls back to index.html for unknown paths
# so client-side (react-router) routes resolve on a hard refresh / deep link.
# The backend GraphQL APIs are NOT proxied here — the cluster ingress routes
# /api/<area> straight to each functional-area service, while everything else
# falls through to this server (see deploy/helm/devicechain/templates/ingress.yaml).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative (e.g. /dash → /dash/): the container listens on 8080,
    # but it sits behind the ingress on :80/:443, so an absolute redirect would leak
    # :8080 and send the browser to an unexposed port.
    absolute_redirect off;

    # Fingerprinted build assets are immutable — let browsers cache them hard. They live
    # under /_app/ (build.assetsDir in apps/console/vite.config.ts), deliberately NOT
    # /assets/: that path is a console route (the asset registry, /assets/<token>), and a
    # static location of the same name would 404 every refresh or shared link to it. A miss
    # here stays a 404 and never falls back to index.html, or a missing chunk would be
    # cached for a year as HTML.
    location /_app/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The dash bundle's fingerprinted assets are immutable too (same as /_app/).
    location /dash/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The index HTMLs must not be cached, or a stale index keeps pointing at old
    # (deleted) fingerprinted bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /dash/index.html {
        add_header Cache-Control "no-cache";
    }

    # The single sign-on return pages. The identity provider sends the browser back here with
    # a one-time code in the query, so the response forbids a Referer outright (nothing the
    # page loads or links to can carry the address) and is never cached. Both serve the SPA's
    # index; the app takes the code out of the address bar before it renders. The headers are
    # repeated here because add_header in a location replaces what an enclosing block set.
    #
    # Forbidding the Referer is safe ONLY because these documents never render a map: the
    # app redeems the code and leaves by a full navigation, so the policy dies with the
    # document instead of following the person into the app, whose default basemap needs a
    # Referer. Keep them exact-match (`=`) locations: hack/check-osm-tile-policy.sh exempts
    # exactly these two blocks and fails on the header anywhere else.
    location = /login/sso/complete {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /dash/sso/complete {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /dash/index.html =404;
    }

    # The standalone dashboard app (base '/dash/'), served from its own subtree with
    # its own SPA fallback so deep links like /dash/<token> resolve to its index.
    # More specific than `location /`, so it wins for /dash/*.
    location = /dash {
        return 301 /dash/;
    }
    location /dash/ {
        try_files $uri /dash/index.html;
    }

    # SPA fallback: serve the requested file if it exists, otherwise hand back
    # index.html so the client router can render the route.
    location / {
        try_files $uri /index.html;
    }
}
