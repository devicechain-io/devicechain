"""One population of devices to cover."""
input AlarmSuppressionTargetInput {
    """DEVICE, DEVICE_TYPE, ENTITY_GROUP, AREA, ASSET, CUSTOMER or TENANT."""
    type: String!
    """Target token; omit for TENANT."""
    token: String
}
"""A half-open interval in which a window suppresses paging."""
type AlarmSuppressionInterval {
    """Inclusive opening instant, as an RFC 3339 timestamp."""
    start: String!
    """Exclusive closing instant, as an RFC 3339 timestamp."""
    end: String!
}
"""An operator-declared window that holds paging while alarms continue to track conditions."""
type AlarmSuppressionWindow implements Model & TokenReference & NamedEntity & MetadataEntity {
