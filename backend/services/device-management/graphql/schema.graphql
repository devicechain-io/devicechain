type GeoFenceSetManifest {
    """
    The version this manifest describes. 0 means the tenant had never created a fence: an empty
    fence set, known to be empty.
    """
    version: Int!
    """
    When the change that minted this version committed, as an RFC 3339 timestamp. For diagnosing how
    old a held fence set is; never used by containment tests.
    """
    mintedAt: String
    """The fences of this version, ordered by token."""
