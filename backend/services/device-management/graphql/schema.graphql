#
# Device Management GraphQL Schema
#
# Descriptions: a """string""" above an element is its PUBLIC description — served by
# introspection, read by every GraphQL tool, published on the docs site — and may not
# cite a decision record. A # comment is a maintainer note. backend/tools/docsgql/sdldesc
# enforces both.

# Base elements in gorm RDB model.
"""Fields every stored record carries: a server-assigned id and its timestamps."""
interface Model {
    """
    Server-assigned numeric identifier, as a string. Records are normally addressed by
    token; the ById lookups take this value.
    """
    id: ID!
    """When the record was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the record was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted records are not returned by this API."""
    deletedAt: String
}

"""A record addressed by a token, an identifier unique within the tenant among records of its kind."""
interface TokenReference {
    """
    Identifier of the record, unique within the tenant among records of its kind. Letters,
    digits, hyphens and underscores, starting with a letter or digit; at most 128 characters.
    """
    token: String!
}

"""A record with a human-readable name and description."""
interface NamedEntity {
    """Human-readable name. Null when none is set."""
    name: String
    """Free-text description. Null when none is set."""
    description: String
}

"""
Presentation hints a user interface can use when showing the record. The server stores
them as text and does not interpret them.
"""
interface BrandedEntity {
    """URL of an image representing the record."""
    imageUrl: String
    """Name of an icon representing the record. Not checked against any icon set."""
    icon: String
    """Background colour to display the record with, such as a CSS colour. Not validated."""
    backgroundColor: String
    """Foreground (text) colour to display the record with, such as a CSS colour. Not validated."""
    foregroundColor: String
    """Border colour to display the record with, such as a CSS colour. Not validated."""
    borderColor: String
}

"""A record that carries caller-defined metadata."""
interface MetadataEntity {
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
}

"""
Where a page of search results sits in the full result set. Positions are 1-based and
inclusive.
"""
type SearchResultsPagination {
	"""Position of the first result on this page within the full result set (1-based)."""
	pageStart: Int
	"""
	Position of the last result on this page within the full result set (1-based,
	inclusive). Lower than pageStart when the page is past the end of the results.
	"""
	pageEnd: Int
	"""Number of records matching the criteria across all pages."""
	totalRecords: Int
}

# The input analogue of the pageNumber/pageSize pair the search-criteria inputs carry
# inline; resolved through rdb.Pagination, so the same clamp applies.
"""Which page of results to return."""
input PaginationInput {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
}

# Represents a type or class of devices
"""
A kind of device: what it is (manufacturer and model), how it is displayed, and the device
profile that defines what its devices measure and accept. Every device has exactly one
device type, and many types may share one profile.
"""
type DeviceType implements Model & TokenReference & NamedEntity & BrandedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string. Address a device type by its token instead where you can."""
    id: ID!
    """When the device type was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the device type was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted device types are not returned."""
    deletedAt: String
    """Identifier of the device type, unique within the tenant."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """URL of an image representing the device type, up to 512 characters."""
    imageUrl: String
    """Name of an icon representing the device type, up to 128 characters. Not checked against any icon set."""
    icon: String
    """Background colour to display the device type with, up to 32 characters. Not validated."""
    backgroundColor: String
    """Foreground (text) colour to display the device type with, up to 32 characters. Not validated."""
    foregroundColor: String
    """Border colour to display the device type with, up to 32 characters. Not validated."""
    borderColor: String
    """
    The device profile this type adopts, or null when it adopts none. Devices of a type
    with no profile have no declared metrics or commands.
    """
    profile: DeviceProfile
    """
    The maintenance window that holds this type's disruptive commands until it opens, or
    null when the type has none. Commands whose definition has impact DISRUPTIVE or
    DESTRUCTIVE wait for the window; every other command is sent whenever the device is
    reachable.
    """
    maintenanceWindow: MaintenanceWindow
    """
    Manufacturer of the devices of this type: free text, up to 128 characters. facetValues
    lists the values already in use.
    """
    manufacturer: String
    """
    Model of the devices of this type: free text, up to 128 characters. facetValues lists
    the values already in use.
    """
    model: String
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
}

# A discovery facet (ADR-045 decision 8) whose in-use values suggest completions in the
# authoring UI.
"""A free-text classification field whose values in use facetValues can list."""
enum DeviceFacet {
    """The manufacturer field of device types."""
    MANUFACTURER
    """The model field of device types."""
    MODEL
    """The category field of device profiles."""
    CATEGORY
}

# Represents a device profile (ADR-045) — the reusable, tenant-scoped capability
# contract a device type adopts. Distinct from the type's taxonomy/appearance; many
# types may share one profile. It is the home for the metric and command
# definitions (ADR-045 slice b) and for the profile's detection rules (ADR-051),
# which are the one alarm-authoring path since the standalone alarm-definition
# model was torn down.
"""
The capability contract a device type adopts: the metrics its devices report, the
commands they accept, the detection rules evaluated against them and whether they report
their own position. What you edit is a draft; publishDeviceProfile freezes the draft into
a numbered version, and devices use only the active published version. Many device types
may share one profile.
"""
type DeviceProfile implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string. Address a profile by its token instead where you can."""
    id: ID!
    """When the profile was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the profile was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted profiles are not returned."""
    deletedAt: String
    """
    Identifier of the profile, unique within the tenant. It can be changed with
    renameDeviceProfile only while the profile has never been published and no device type
    currently adopts it.
    """
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """
    Functional class of the devices, such as thermostat or meter: free text, up to 64
    characters. facetValues lists the values already in use.
    """
    category: String
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    # The published version a device currently resolves through this profile
    # (ADR-045 versioning); null until the profile is first published — an
    # unpublished profile's definitions are inert (a device resolves nothing).
    """
    The published version devices currently use, or null if the profile has never been
    published. Until then devices of this profile have no declared metrics or commands.
    """
    activeVersion: Int
    # A profile is a shared contract, so editing its definitions affects every adopting
    # type; the authoring UI surfaces this before a publish.
    """Number of device types that currently adopt this profile."""
    deviceTypeCount: Int!
    """
    The metric definitions in the draft. Devices use the active published version, so a
    change here takes effect only when the profile is published.
    """
    metricDefinitions: [MetricDefinition!]!
    """
    The command definitions in the draft. Devices use the active published version, so a
    change here takes effect only when the profile is published.
    """
    commandDefinitions: [CommandDefinition!]!
    """
    The detection rules in the draft. Devices use the active published version, so a change
    here takes effect only when the profile is published.
    """
    detectionRules: [DetectionRule!]!
    # Note this is a single nullable object and not a list — a device reports its position
    # once — so null is the whole display rule: no declaration means no map, no track, no
    # last-fix panel.
    """
    The draft position declaration: present when devices of this profile report their own
    position, null when they do not. Like the other draft content, it reaches devices only
    when the profile is published.
    """
    location: DeviceLocationDeclaration
    """
    The profile's DRAFT device-visible configuration declaration: the shared attribute
    keys a device of this profile may see. Empty when nothing is declared, in which case
    a device sees an empty document. Like every draft field, it reaches devices only
    when the profile is published; the declaration frozen into each published version
    never changes.
    """
    configurationDeclaration: [ConfigurationKey!]!
    """
    The published version a device currently resolves through this profile, with the
    content frozen into it, or null until the profile is first published. Read the
    declaration devices actually see from here, not from the draft fields above.
    """
    activeProfileVersion: DeviceProfileVersion
    """
    The profile's activation log, newest first: every time a version became the one devices
    resolve, by publish or by rollback. Use it to find which version was active at a given
    time: it is the entry with the latest activatedAt not after that time. The log begins
    when the platform release that introduced it was installed, so a profile last activated
    before that has no entry for that activation; treat the absence as unknown, not as
    inactive. Page with first and after. Requires device:read.
    """
    activations(
        """Maximum number of entries to return, at least 1. Omitted, or above 1000, it is 1000; below 1 is refused."""
        first: Int
        """The nextCursor of the previous page. Omit it to start at the newest entry. A malformed cursor fails the request."""
        after: String
    ): DeviceProfileActivationPage!
}

"""One page of a profile's activation log."""
type DeviceProfileActivationPage {
    """The entries on this page, newest first."""
    entries: [DeviceProfileActivation!]!
    """The cursor to pass as after for the next page; null when this is the last page."""
    nextCursor: String
}

"""One moment a profile version became the version devices resolve."""
type DeviceProfileActivation {
    """The version that became active."""
    version: Int!
    """Why it became active: PUBLISH when the version was just published, ROLLBACK when an earlier version was made active again."""
    kind: String!
    """When it became active, as an RFC 3339 timestamp in UTC. For a rollback this is when the rollback happened, not when the version was published."""
    activatedAt: String!
    """Who did it: their username, or their email when there is no username. Null when not recorded."""
    activatedBy: String
}

"""One shared attribute key declared as device-visible configuration on a device profile."""
type ConfigurationKey {
    """The shared attribute key."""
    key: String!
    """How the key's value is typed: STRING, LONG, DOUBLE, BOOLEAN or JSON."""
    valueType: String!
    """An optional human-readable note."""
    description: String
}

"""
One key of a configuration declaration. The key must follow the attribute-key grammar
(letters, digits, hyphens and underscores, starting with a letter or digit), be unique
within the declaration, and carry a valid value type.
"""
input ConfigurationKeyInput {
    """The shared attribute key."""
    key: String!
    """How the key's value is typed: STRING, LONG, DOUBLE, BOOLEAN or JSON."""
    valueType: String!
    """An optional human-readable note."""
    description: String
}

# Declares that devices built on a profile report THEIR OWN position, and what an
# operator should expect of it. Its presence is the declaration; both fields inside
# are optional refinements, so an object with neither set still means "this device
# reports position" and is a different statement from a null declaration.
#
# It describes and displays — it never permits. A device that reports a position
# before anyone declares it keeps every fix it sent; the platform stores the data and
# surfaces the gap, rather than discarding data on the strength of an unedited
# profile.
#
# The coordinate contract is fixed platform-wide and cannot be overridden per device
# or per profile: WGS84 / EPSG:4326 decimal degrees, elevation in metres above the
# ellipsoid, accuracy in metres, speed in metres per second, heading in degrees
# clockwise from true north in [0, 360).
"""
A statement that devices report their own position, with what to expect of it. The object
being present is the statement; both fields are optional, so an empty object still means
the devices report position. It is descriptive only: location data is accepted and stored
whether or not a declaration exists.
"""
type DeviceLocationDeclaration {
    """
    Horizontal accuracy to expect from these devices, in metres, or null when not stated.
    Descriptive only: a less accurate fix is still stored unchanged.
    """
    expectedAccuracyMeters: Float
    # Nothing alarms on it here — an absence rule on the profile is the mechanism for that.
    """
    How often a position fix is expected, in seconds, or null when not stated. Descriptive
    only: nothing is raised when fixes arrive less often.
    """
    expectedUpdateIntervalSeconds: Int
}

"""
Sets a profile's position declaration. Supplying it states that the devices report their
own position; an empty object makes that statement with no expectations.
"""
input DeviceLocationDeclarationInput {
    """
    Horizontal accuracy to expect, in metres. Must be a positive finite number when sent;
    omit it or send null to state no expectation.
    """
    expectedAccuracyMeters: Float
    """
    How often a position fix is expected, in seconds. Must be positive when sent; omit it
    or send null to state no expectation.
    """
    expectedUpdateIntervalSeconds: Int
}

# An immutable published snapshot of a device profile's whole capability set
# (ADR-045 versioning): its metric, command, and detection-rule definitions
# frozen together.
# The snapshot blob is deliberately omitted here — the list stays light; a device
# resolves the active version server-side, and rollback re-points it by version.
"""
An immutable, published snapshot of a profile's metric, command and detection-rule
definitions and its position declaration. Versions are never deleted while the profile
exists; rollbackDeviceProfile makes an earlier one active again.
"""
type DeviceProfileVersion {
    """Version number: 1 for the first publish of the profile, increasing by one with each publish."""
    version: Int!
    """Optional label given at publish time, such as a release name. Not interpreted."""
    label: String
    """Optional notes given at publish time."""
    description: String
    """When the version was published, as an RFC 3339 timestamp."""
    publishedAt: String!
    """Who published it: their username, or their email when there is no username."""
    publishedBy: String
    """
    The device-visible configuration declaration frozen into this version: the shared
    attribute keys a device of the profile may see. Empty when the version declared
    nothing, including every version published before declarations existed. It never
    changes after publication.
    """
    configurationDeclaration: [ConfigurationKey!]!
    """
    This version as a W3C Web of Things Thing Model (TD 1.1), as JSON-LD text. Each metric
    is a read-only, observable property typed from its data type, with its unit, bounds,
    allowed values and descriptor (as the property's @type); each command is an action
    whose input is its typed parameters. A Thing Model describes every device of the
    profile, so it carries no device address, protocol binding or security. Detection
    rules, the location and configuration declarations, and metadata are not part of it.
    The title and description are the profile's current ones, so the text changes only
    when those do. A version holding a constraint a Thing Model cannot express exactly
    (allowed values that are not text, or that repeat once typed; bounds on a non-numeric
    metric) is refused with an error rather than exported without it. A descriptor is
    emitted as written, so it should be an absolute IRI or a prefixed term the consumer
    knows.
    """
    thingModel: String!
    """
    The metrics frozen into this version, in declaration order: what a device's measurements
    are validated against while this version is active. Calculated metrics are included and
    marked. It never changes after publication.
    """
    metrics: [PublishedMetric!]!
    """
    The commands frozen into this version, each with the impact it was published with. Empty
    when the version declares none, in which case a device accepts any command key. It never
    changes after publication.
    """
    commands: [PublishedCommand!]!
}

# Represents a typed, unit-bearing metric declared on a device profile (ADR-016/ADR-045).
"""
A measurement the devices of a profile report: its key, numeric type, unit and allowed
values. Inbound measurements whose key matches are validated against it; a measurement
whose key is not declared is not validated.
"""
type MetricDefinition implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string. Address a metric definition by its token instead where you can."""
    id: ID!
    """When the metric definition was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the metric definition was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted metric definitions are not returned."""
    deletedAt: String
    """Identifier of the metric definition, unique within the tenant."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """The profile this metric is declared on."""
    deviceProfile: DeviceProfile!
    """
    The key a measurement uses to report this metric, unique within the profile and at most
    128 characters.
    """
    metricKey: String!
    """The value type: DOUBLE, INT or BOOLEAN. A BOOLEAN value is stored as 0 or 1."""
    dataType: String!
    """
    Unit of measure, such as a UCUM code (Cel, kW). It is carried with each measurement
    of this metric; values are not converted.
    """
    unit: String
    """
    Smallest value accepted for a DOUBLE or INT metric, or null for no lower bound. A
    measurement below it is rejected.
    """
    minValue: Float
    """
    Largest value accepted for a DOUBLE or INT metric, or null for no upper bound. A
    measurement above it is rejected.
    """
    maxValue: Float
    """
    The allowed values as a JSON array of strings, or null when any value is allowed. A
    measurement must equal one of them exactly. A value that is not a non-empty array of
    strings restricts nothing.
    """
    enum: String
    """
    Optional semantic tag for the metric, such as a Web of Things type. Not interpreted on
    ingest; a published version's thingModel carries it as the property's @type.
    """
    descriptor: String
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    """
    The formula a calculated metric is computed from, written over the profile's measured
    metrics (for example `voltage * current / 1000`), and optionally over numbers a device
    carries in its metadata, as `device.name` (for example `voltage * device.calibration`).
    Null for a measured metric, which devices report.
    """
    expression: String
    """
    True when the metric is calculated from its formula rather than reported by devices.
    Fixed when the metric is created.
    """
    calculated: Boolean!
}

"""Fields for a new metric definition."""
input MetricDefinitionCreateRequest {
    """Identifier for the new metric definition. A token already in use in the tenant is refused with CONFLICT."""
    token: String!
    """Token of the profile to declare the metric on. An unknown token fails the request."""
    deviceProfileToken: String!
    """
    The key measurements will use for this metric, at most 128 characters. A key the
    profile already declares is refused with CONFLICT.
    """
    metricKey: String!
    """Human-readable name, up to 128 characters."""
    name: String
    """Free-text description, up to 1024 characters."""
    description: String
    """
    The value type: DOUBLE, INT or BOOLEAN. STRING is refused, because a metric must be
    numeric; report string values as attributes instead.
    """
    dataType: String!
    """Unit of measure, such as a UCUM code (Cel, kW)."""
    unit: String
    """Smallest value accepted for a DOUBLE or INT metric."""
    minValue: Float
    """Largest value accepted for a DOUBLE or INT metric."""
    maxValue: Float
    """Allowed values as a JSON array of strings. Must be valid JSON."""
    enum: String
    """Optional semantic tag, such as a Web of Things type."""
    descriptor: String
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
    """
    A formula, which makes the new metric calculated: its value is computed from the
    profile's measured metrics instead of reported by devices. Omit it for a measured
    metric. Which of the two a metric is cannot be changed later. At most 1024 bytes and not
    blank. The formula is checked when the profile is published, not here; use
    testMetricFormula to check it sooner. It may read up to 8 numbers from the device's
    metadata as `device.name`; naming one is declaring it, and a device whose metadata lacks
    it gets no value for the reading.
    """
    expression: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
#
# dataType is validated ONLY when the caller names it: an absent field has nothing to
# validate, and checking the stored value instead would refuse a rename over a type the
# caller never sent.
"""
A partial update to a metric definition. Omit a field to leave the stored value alone,
send a value to set it, or send an explicit null to clear it; the fields that cannot be
cleared say so. The definition is named by the mutation's token argument, so there is no
token here. Any refusal leaves the definition unchanged.
"""
input MetricDefinitionUpdateRequest {
    """
    Token of another profile to move the definition to. An explicit null or a blank value
    is refused, and an unknown token fails the whole update.
    """
    deviceProfileToken: String
    """
    New key for the metric, unique within the profile the definition ends up in. An
    explicit null or a blank value is refused.
    """
    metricKey: String
    """New name, or null to clear it."""
    name: String
    """New description, or null to clear it."""
    description: String
    """New value type: DOUBLE, INT or BOOLEAN. An explicit null is refused."""
    dataType: String
    """New unit, or null to clear it."""
    unit: String
    """New lower bound, or null to remove it."""
    minValue: Float
    """New upper bound, or null to remove it."""
    maxValue: Float
    """New allowed values as a JSON array of strings, or null to allow any value."""
    enum: String
    """New semantic tag, or null to clear it."""
    descriptor: String
    """New metadata (valid JSON, replacing the stored document), or null to clear it."""
    metadata: String
    """
    New formula for a calculated metric. Refused on a measured metric, which cannot become
    calculated. A null or blank value is refused on a calculated metric, which cannot become
    measured; delete it and create a new metric instead.
    """
    expression: String
}

"""One typed value for testMetricFormula: a measured input of the sample, or a device constant."""
input MetricValueInput {
    """The measured metric's key, or the device constant's name."""
    key: String!
    """
    The value as a device would send it, such as `230.5`, `12` or `true`; for a device
    constant, a number such as `1.02`.
    """
    value: String!
}

"""
What a calculated-metric formula gives for a sample. A formula that does not compile has
compileError and no value; one that compiles has exactly one of value or skippedReason.
"""
type MetricFormulaTest {
    """Why the formula was refused, or null when it compiles."""
    compileError: String
    """The value the formula produces for the sample, formatted as it would be stored."""
    value: String
    """
    Why the formula produces no value for the sample: missing_input, invalid_input,
    non_finite, div_zero, overflow, range, unstorable (a magnitude of 1e12 or more, which
    measurements cannot be stored with) or eval_error. No value is ever substituted.
    """
    skippedReason: String
    """
    The metrics the formula reads directly: measured metrics and, since a formula may read
    another calculated metric, calculated ones.
    """
    inputs: [String!]!
    """
    The calculated metrics the formula depends on, directly or through others, in the order
    they are evaluated, each computed from the sample through its own formula. Empty for a
    formula over measured metrics only.
    """
    chain: [String!]!
    """
    Every measured metric the evaluation reads: the formula's own and those read through the
    calculated metrics in the chain. These are the values a sample supplies; equal to inputs
    when the chain is empty.
    """
    measuredInputs: [String!]!
    """
    The device constants the formula reads as `device.name`, sorted. Each comes from a
    device's metadata when a reading is resolved; empty when the formula reads none.
    """
    constants: [String!]!
    """
    Advisory findings that do not stop a publish, such as a sample value no formula can
    read, or a result range wider than measurements can be stored with.
    """
    warnings: [String!]!
    """The formula's estimated worst-case cost; a formula above 100 is refused."""
    estimatedCost: Int
}

"""Criteria for searching metric definitions. Results are newest first."""
input MetricDefinitionSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
    """Return only definitions on the profile with this token. An unknown token matches nothing."""
    deviceProfile: String
    """Return only definitions with exactly this metric key."""
    metricKey: String
}

"""One page of metric definitions matching a search."""
type MetricDefinitionSearchResults {
    """The metric definitions on this page."""
    results: [MetricDefinition!]!
    """Where this page sits in the full result set."""
    pagination: SearchResultsPagination!
}

# ADR-081: the stamp a command, an update assignment or another device-derived record is
# written with, so a member limited to part of the tenant sees it exactly when one of these
# anchors is in its scope. Its own query, not a field on Device: a device may belong to
# several customers, and a field would show one customer another's token.
"""
The anchors of one device: what decides which members limited to part of the tenant can see
records about it.
"""
type DeviceScopeAnchors {
    """The device's token, as it was named in the request."""
    deviceToken: String!
    """
    One entry per tracked relationship from the device, written as type:token (for example
    customer:acme). Empty when the device has no tracked relationship.
    """
    anchors: [String!]!
}

# The ADR-043 decision 3 enqueue gate, evaluated here because this service owns the
# command vocabulary. A rejection is a verdict, not a GraphQL error, so a caller can tell
# an invalid command (relayable to its client) from an unavailable check (fail closed).
"""
Whether a command may be sent to a device. A refusal is reported here rather than as a
GraphQL error; an error means the check itself could not be made.
"""
type CommandEnqueueVerdict {
    """True when the command may be sent."""
    allowed: Boolean!
    """
    Why the command was refused, as a stable code; null when allowed. One of
    DEVICE_NOT_FOUND (no device has the token), DEVICE_DISABLED (the device is disabled and
    accepts no commands), COMMAND_NOT_IN_VOCABULARY (the device's published profile declares
    commands and this key is not one of them) PAYLOAD_SCHEMA_VIOLATION (the payload does
    not satisfy the command's parameters) or COMMAND_DESTRUCTIVE_REFUSED (a raw execute of an
    operation that wipes the device, such as LwM2M Factory Reset).
    Branch on this, not on reason.
    """
    code: String
    """
    Why the command was refused, in words a person can act on; null when allowed. The
    wording may change; use code to decide what to do.
    """
    reason: String
}

"""One device a batch command check refused, and why."""
type BatchEnqueueRefusal {
    """The refused device's token, exactly as it appeared in the request."""
    deviceToken: String!
    """
    Why the command was refused, as a stable code: DEVICE_NOT_FOUND, DEVICE_DISABLED,
    COMMAND_NOT_IN_VOCABULARY, PAYLOAD_SCHEMA_VIOLATION or COMMAND_DESTRUCTIVE_REFUSED, with the same meanings as in
    validateCommandEnqueue; commandDispatchSchedule adds WINDOW_AFTER_EXPIRY (the device
    type's maintenance window next opens after the command expires). Branch on this, not on
    reason.
    """
    code: String!
    """Why the command was refused, in words a person can act on. The wording may change."""
    reason: String!
}

# A maintenance window is a recurring weekly schedule in an IANA time zone. It gates the START
# of a disruptive operation: a command claimed inside the window finishes whenever it
# finishes. Assigned to a device type; slots are one JSON document because they are read and
# validated whole.
"""
A recurring weekly schedule, in an IANA time zone, during which disruptive commands may
start. Assign it to a device type; commands whose definition has impact DISRUPTIVE or
DESTRUCTIVE then wait for it to open.
"""
type MaintenanceWindow implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string. Address a window by its token instead where you can."""
    id: ID!
    """When the window was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the window was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted windows are not returned."""
    deletedAt: String
    """Identifier of the window, unique within the tenant."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """The IANA time zone the slots are read in, for example Europe/Berlin."""
    timezone: String!
    """
    The weekly openings as a JSON array of objects with day (MONDAY to SUNDAY), start (a
    24-hour HH:MM wall-clock time in the zone) and durationMinutes (1 to 10080, elapsed
    time). A slot may run past midnight and past the end of the week.
    """
    slots: String!
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
}

"""Fields for a new maintenance window."""
input MaintenanceWindowCreateRequest {
    """Identifier for the new window. A token already in use in the tenant is refused with CONFLICT."""
    token: String!
    """Human-readable name, up to 128 characters."""
    name: String
    """Free-text description, up to 1024 characters."""
    description: String
    """An IANA time zone name such as Europe/Berlin. Local and unknown names are refused."""
    timezone: String!
    """
    The weekly openings as a JSON array of {day, start, durationMinutes}, at least one and at
    most 56. Unknown keys and out-of-range values are refused.
    """
    slots: String!
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
}

# A PARTIAL update; there is deliberately no `token` field — the mutation's own argument
# identifies the window.
"""A partial update to a maintenance window: omit a field to leave it alone."""
input MaintenanceWindowUpdateRequest {
    """New name, or null to clear it."""
    name: String
    """New description, or null to clear it."""
    description: String
    """New time zone. An explicit null or an unknown zone is refused."""
    timezone: String
    """New weekly openings (validated as on create). An explicit null is refused."""
    slots: String
    """New metadata (valid JSON, replacing the stored document), or null to clear it."""
    metadata: String
}

"""Criteria for searching maintenance windows. Results are newest first."""
input MaintenanceWindowSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
}

"""One page of maintenance windows matching a search."""
type MaintenanceWindowSearchResults {
    """The windows on this page."""
    results: [MaintenanceWindow!]!
    """Where this page sits in the full result set."""
    pagination: SearchResultsPagination!
}

"""When an operation under a maintenance window may start."""
type MaintenanceWindowOpening {
    """False when no window has the token (it was deleted or never existed); the other fields are then meaningless."""
    found: Boolean!
    """True when the window is open at the instant asked about."""
    openNow: Boolean!
    """
    The earliest instant an operation may start, as an RFC 3339 timestamp: the instant asked
    about when the window is open, otherwise the next opening.
    """
    dispatchAfter: String!
    """When the opening dispatchAfter belongs to ends, as an RFC 3339 timestamp."""
    closes: String!
}

"""
A command bound to one opening of its device type's maintenance window: it may be sent only
between dispatchAfter and dispatchUntil. When the window is open now, dispatchAfter is already
past and the command may be sent at once, but only until the window closes.
"""
type CommandDispatchHold {
    """Token of the device the command is for."""
    deviceToken: String!
    """Token of the maintenance window that gates the command."""
    windowToken: String!
    """The earliest instant the command may be sent, as an RFC 3339 timestamp."""
    dispatchAfter: String!
    """When the opening closes, as an RFC 3339 timestamp. The command may not be sent at or after it."""
    dispatchUntil: String!
}

"""
The maintenance-window part of an enqueue decision for one or many devices: which commands
must wait, and which are refused because the window opens only after they expire.
"""
type CommandDispatchSchedule {
    """
    Commands gated by a window, whether it is open now or not. A device not listed here and not
    refused may be sent to at any time.
    """
    holds: [CommandDispatchHold!]!
    """
    Devices refused with the stable code WINDOW_AFTER_EXPIRY: the window next opens after the
    command expires, so it could only lapse unsent. Branch on code, not reason.
    """
    refusals: [BatchEnqueueRefusal!]!
    """
    Devices that exist, are enabled, and whose device type does not gate this command: no
    maintenance window, or a command that is not DISRUPTIVE or DESTRUCTIVE. Asked with
    alreadyHeld, only a device type with no maintenance window makes a device ungated. A device
    in none of the four lists does not exist or is disabled, and nothing is decided about it.
    """
    ungated: [String!]!
    """
    Devices that exist and are enabled, but whose device type's current profile version does not
    define this command at all.
    """
    undefined: [String!]!
}

"""One page of the devices an entity group contains, for use as the target of a command."""
type DeviceGroupTargetPage {
    """
    True when the group cannot be a command target. code and reason then explain why, and
    the empty deviceTokens list does not mean the group has no members.
    """
    rejected: Boolean!
    """
    Why the group was refused, as a stable code; null when not rejected. One of
    GROUP_NOT_FOUND, GROUP_NOT_A_DEVICE_GROUP (it contains something other than devices),
    GROUP_NOT_PUBLISHED (a dynamic group that was never published),
    GROUP_VERSION_NOT_FOUND (the requested version does not exist) or GROUP_NOT_VERSIONED
    (a version was requested for a static group).
    """
    code: String
    """Why the group was refused, in words a person can act on; null when not rejected."""
    reason: String
    """The device tokens on this page, in ascending order of the devices' ids."""
    deviceTokens: [String!]!
    # It is a String rather than an Int because it carries a row id, and GraphQL's Int is
    # a signed 32-bit value — an id beyond that would fail to marshal on the one field
    # whose entire job is to not lose members.
    """
    Opaque cursor to pass as afterId for the next page. Null when this page holds fewer
    tokens than the limit; a full page always carries a cursor, so a walk can end with
    an empty page.
    """
    nextCursor: String
    # Record it: it is what lets an audit answer "what did this group MEAN when the
    # command fired?" after someone edits the selector.
    """The dynamic group's published version this page was resolved from; null for a static group."""
    resolvedVersion: Int
}

# This is a snapshot copy frozen at publish — deliberately NOT a CommandDefinition,
# because it has no id or token to address: the draft row it was captured from may since
# have been edited or deleted.
"""
One command a device accepts, as frozen in its profile's active published version. To
edit commands, use the profile's command definitions and publish the profile.
"""
type PublishedCommand {
    """The key used to send this command."""
    commandKey: String!
    """Human-readable name, or null when none was set."""
    name: String
    """Free-text description, or null when none was set."""
    description: String
    """The command's parameters as a JSON array of parameter descriptors, or null when it takes no structured arguments."""
    parameterSchema: String
    """NORMAL, DISRUPTIVE or DESTRUCTIVE. The last two wait for the device type's maintenance window."""
    impact: String!
}

"""The commands a device currently accepts, from its profile's active published version."""
type DeviceCommandVocabulary {
    """
    True when the device accepts only the listed commands. False when its published
    profile declares no commands, or it has no published profile: any command key is then
    accepted, and commands is empty.
    """
    constrained: Boolean!
    """The accepted commands; empty when not constrained."""
    commands: [PublishedCommand!]!
}

# That distinction is the whole reason this type exists. A client that read the draft
# would show and hide a position panel on an unpublished edit, which is the same
# publish-boundary confusion deviceCommandVocabulary was added to prevent for commands.
"""
Whether a device reports its own position, according to the active published version of
its profile (not the draft). Location data is accepted whether or not it is declared, so
an undeclared device may still have stored positions.
"""
type DeviceLocationCapability {
    """
    True when the published version declares that the device reports position. False when
    the device's type has no profile, the profile was never published, or the published
    version declares nothing.
    """
    declared: Boolean!
    """
    The declaration, or null when declared is false. An empty object is a real answer:
    the device reports position and no expectations are stated.
    """
    declaration: DeviceLocationDeclaration
}

"""
The metrics a device's measurements are validated against, from the active published
version of its profile (not the draft).
"""
type DeviceMetricVocabulary {
    """
    The published metrics. Empty when the device's type has no profile, the profile was
    never published, or the published version declares no metric. Empty does not mean the
    device may send nothing: a measurement whose key is not declared is accepted without
    validation, provided its value is a number.
    """
    metrics: [PublishedMetric!]!
}

"""A metric in a device's published profile version, as inbound measurements are checked against it."""
type PublishedMetric {
    """The key a measurement uses to report this metric."""
    metricKey: String!
    """DOUBLE, INT or BOOLEAN; a measurement's value must parse as this type."""
    dataType: String!
    """The unit, or null when none is declared."""
    unit: String
    """The smallest value accepted, or null when there is no lower bound."""
    minValue: Float
    """The largest value accepted, or null when there is no upper bound."""
    maxValue: Float
    """The only values accepted, or null when any value of the type is accepted."""
    allowedValues: [String!]
    """True when the platform computes this metric from a formula over the device's other readings, so a device never reports it. A dashboard offers it like any other metric."""
    calculated: Boolean!
}

# Represents a typed command declared on a device profile (ADR-043/ADR-045). parameterSchema
# is the ordered []ParameterSpec argument contract as a JSON string, which drives the
# console command form and constrains an issued command's payload at enqueue (the
# validateCommandEnqueue gate).
"""
A command the devices of a profile accept, with the parameters its payload must satisfy.
Once the profile is published, a command sent to such a device must use one of the
published keys, and its payload is checked against the parameters.
"""
type CommandDefinition implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string. Address a command definition by its token instead where you can."""
    id: ID!
    """When the command definition was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the command definition was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted command definitions are not returned."""
    deletedAt: String
    """Identifier of the command definition, unique within the tenant."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """The profile this command is declared on."""
    deviceProfile: DeviceProfile!
    """
    The key used to send this command, unique within the profile. Letters, digits, hyphens
    and underscores, starting with a letter or digit; at most 128 characters.
    """
    commandKey: String!
    """
    The command's parameters as a JSON array of parameter descriptors, or null when the
    command takes no structured arguments, in which case payloads are not checked.
    """
    parameterSchema: String
    """
    How disruptive the command is to the device's work: NORMAL (a read or a benign write),
    DISRUPTIVE (interrupts it, such as a reboot) or DESTRUCTIVE (erases state, such as a
    wipe). DISRUPTIVE and DESTRUCTIVE commands wait for the device type's maintenance window
    when it has one; NORMAL commands never do.
    """
    impact: String!
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
}

"""Fields for a new command definition."""
input CommandDefinitionCreateRequest {
    """Identifier for the new command definition. A token already in use in the tenant is refused with CONFLICT."""
    token: String!
    """Token of the profile to declare the command on. An unknown token fails the request."""
    deviceProfileToken: String!
    """
    The key used to send the command. Letters, digits, hyphens and underscores, starting
    with a letter or digit; at most 128 characters. A key the profile already declares is
    refused with CONFLICT.
    """
    commandKey: String!
    """Human-readable name, up to 128 characters."""
    name: String
    """Free-text description, up to 1024 characters."""
    description: String
    """
    The command's parameters: a JSON array of descriptors, each with a name and optional
    description, kind (SCALAR, the default, or OBJECT with nested parameters), dataType
    (DOUBLE, INT, BOOLEAN or STRING), unit, required, default, minValue, maxValue and enum.
    Unknown keys and inconsistent constraints are refused. Omit it for a command without
    structured arguments.
    """
    parameterSchema: String
    """
    How disruptive the command is: NORMAL (the default), DISRUPTIVE or DESTRUCTIVE.
    DISRUPTIVE and DESTRUCTIVE commands wait for the device type's maintenance window. An
    unknown value fails the request.
    """
    impact: String
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
"""
A partial update to a command definition. Omit a field to leave the stored value alone,
send a value to set it, or send an explicit null to clear it; the fields that cannot be
cleared say so. The definition is named by the mutation's token argument, so there is no
token here. Any refusal leaves the definition unchanged.
"""
input CommandDefinitionUpdateRequest {
    """
    Token of another profile to move the definition to. An explicit null or a blank value is
    refused, and an unknown token fails the whole update. The command key must be unique in the profile the
    definition ends up in.
    """
    deviceProfileToken: String
    """
    New command key, in the same format as on create. An explicit null or a blank value is
    refused, and a key already declared on the profile is refused with CONFLICT.
    """
    commandKey: String
    """New name, or null to clear it."""
    name: String
    """New description, or null to clear it."""
    description: String
    """
    New parameters (validated as on create), or null to make the command one without
    structured arguments.
    """
    parameterSchema: String
    """
    New impact (NORMAL, DISRUPTIVE or DESTRUCTIVE). An explicit null or an unknown value is
    refused. The change reaches devices when the profile is published.
    """
    impact: String
    """New metadata (valid JSON, replacing the stored document), or null to clear it."""
    metadata: String
}

"""Criteria for searching command definitions. Results are newest first."""
input CommandDefinitionSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
    """Return only definitions on the profile with this token. An unknown token matches nothing."""
    deviceProfile: String
    """Return only definitions with exactly this command key."""
    commandKey: String
}

"""One page of command definitions matching a search."""
type CommandDefinitionSearchResults {
    """The command definitions on this page."""
    results: [CommandDefinition!]!
    """Where this page sits in the full result set."""
    pagination: SearchResultsPagination!
}

# A DETECT rule declared on a device profile (ADR-051 / ADR-053 §5 / ADR-045). The rule
# body — definition — is an opaque JSON document (the event-processing rules.Rule schema);
# device-management versions it with the profile but does not parse the detection taxonomy
# (that stays single-homed in event-processing, which compiles and cost-gates it at
# publish). DetectionRule is the one alarm-authoring path (ADR-057); its edge-triggered rules
# raise/resolve alarms through the contributor-set integrator, the sole alarm-raise path since the 6d
# cutover. (An alarm is still acknowledged and cleared by an operator through the mutations below.)
type DetectionRule implements Model & TokenReference & NamedEntity & MetadataEntity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    name: String
    description: String
    deviceProfile: DeviceProfile!
    # The authored rule as a JSON document (the rules.Rule schema).
    definition: String!
    # The optional visual-canvas document (ADR-053 CanvasDefinition JSON) this rule was
    # authored with, so the console re-opens it on the canvas — null for a form-authored rule.
    # Opaque authoring metadata; not parsed here and not frozen into the publish snapshot.
    authoringGraph: String
    enabled: Boolean!
    metadata: String
    # The optional group scope (ADR-062 S4): the published dynamic entity-group version whose
    # members the rule fires for. Both null for an unscoped (profile-wide) rule; set together
    # for a scoped rule (the engine fires it only for events whose resolved entity is a member
    # of entityGroupToken@entityGroupVersion).
    entityGroupToken: String
    entityGroupVersion: Int
}

# Data required to create a detection rule. definition is the rules.Rule JSON document as a
# string; device-management checks it is well-formed JSON on write, and event-processing
# performs the authoritative type/cost validation when the profile is published.
input DetectionRuleCreateRequest {
    token: String!
    deviceProfileToken: String!
    name: String
    description: String
    definition: String!
    # The optional canvas CanvasDefinition JSON sidecar (ADR-053 slice 9b). Omit for a
    # form-authored rule; when present it must be a JSON object. Stored verbatim, not parsed.
    authoringGraph: String
    enabled: Boolean!
    metadata: String
    # The optional group scope (ADR-062 S4): the published dynamic entity-group version whose
    # members the rule fires for. Omit both for an unscoped rule; set both together for a scoped
    # rule. Validated at save (must be a published dynamic group@version).
    entityGroupToken: String
    entityGroupVersion: Int
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
input DetectionRuleUpdateRequest {
    # Re-parents the rule. Null is refused; an unknown token refuses the whole update.
    deviceProfileToken: String
    name: String
    description: String
    # Required and unclearable: a rule with no definition detects nothing.
    definition: String
    # The canvas sidecar. Null DROPS it — what a form edit of a canvas-authored rule
    # needs, since the graph is then stale. Omitting it KEEPS it.
    authoringGraph: String
    # Required and unclearable. Null is refused rather than read as false, which would
    # park a live rule and report success.
    enabled: Boolean
    metadata: String
    # The optional group scope. The two are folded independently and then validated as a
    # PAIR against what the rule ends up with, so naming one without the other is refused
    # rather than silently discarded. Null on either un-scopes the rule.
    entityGroupToken: String
    entityGroupVersion: Int
}

# Criteria used when searching for detection rules.
input DetectionRuleSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    deviceProfile: String
}

# Search results returned from detection rule query.
type DetectionRuleSearchResults {
    results: [DetectionRule!]!
    pagination: SearchResultsPagination!
}

# An authored geofence: a region a device's reported position can be tested against by a
# DETECT rule, which names it by token. Geofencing is evaluated in Go by the detection
# engine, never in SQL — geometry is an opaque GeoJSON document here, with no spatial
# column, no spatial index and no PostGIS.
#
# The reason is replay determinism, not performance. A containment test issued at replay
# time would answer against the fences that exist NOW rather than the fences that existed
# when the position was reported. Instead, the tenant's active fence-set version is
# stamped onto each resolved LOCATION event at resolve time (see currentFenceSetVersion),
# so the fence set an event is evaluated against is frozen into the event itself. A fence
# edit that moves a boundary mints a new version; it is not a rule migration, and rules
# need not be republished. Renaming a fence mints nothing — the frozen shapes are the same.
type GeoFence implements Model & TokenReference & NamedEntity & MetadataEntity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    name: String
    description: String
    # The geometry as a self-describing JSON document: a kind discriminator plus a GeoJSON
    # geometry object, e.g.
    # {"kind":"POLYGON_2D","geometry":{"type":"Polygon","coordinates":[[[lon,lat],...]]}}.
    # Coordinates follow the platform-wide contract: WGS84 / EPSG:4326 decimal degrees.
    geometry: String!
    # The geometry kind, derived from the document above rather than stored separately.
    # POLYGON_2D today; POLYGON_2_5D (polygon + altitude band) and VOXEL_3D are reserved
    # names that are rejected on write until the engine can evaluate them. The kind belongs
    # to the FENCE, not to the rule language — a rule asks whether a device is inside a
    # fence, and that question does not change when the fence gains a third dimension.
    kind: String!
    metadata: String
}

# Data required to create a geofence. geometry is the JSON document described
# above; it is validated on write (kind, GeoJSON shape, coordinate ranges, and a vertex
# bound). Two limits are enforced at authoring time because nothing downstream can see
# them: a fence may carry at most 512 positions, and a tenant at most 100 fences. The
# publish-time rule cost gate estimates cost from the expression alone, so it cannot price
# a containment call whose real cost is the fence's vertex count times the fences in scope.
input GeoFenceCreateRequest {
    token: String!
    name: String
    description: String
    geometry: String!
    metadata: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
#
# A fence's token is IMMUTABLE — rules name fences by token, and a rename would leave
# them naming nothing. Under this input a rename is unrepresentable rather than refused.
# A caller who wants a different token creates the new fence FIRST and deletes the old
# one after; doing it the other way round can forfeit grandfathered position headroom and
# leave the fence unrecreatable.
input GeoFenceUpdateRequest {
    name: String
    description: String
    # Required and unclearable: a fence with no shape is not a fence. Omitting it leaves
    # the shape alone, which is what makes a rename or a metadata edit exempt from the
    # tenant's position ceiling — that ceiling refuses GROWTH, not size.
    geometry: String
    metadata: String
}

# Criteria used when searching for geofences.
input GeoFenceSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
}

# Search results returned from geofence query.
type GeoFenceSearchResults {
    results: [GeoFence!]!
    pagination: SearchResultsPagination!
}

# The FROZEN fence set of one fence-set version: the fences that were live at the instant
# an event stamped with that version was resolved. It is not an entity — it has no id and
# cannot be edited or deleted — it is the immutable content of a version.
#
# This is what makes replaying history CORRECT rather than vacuous. Evaluating last week's
# events against today's fences would answer a different question; each of those events
# names the version whose snapshot holds the geometry it was actually resolved against.
type GeoFenceSetSnapshot {
    # The version this set is the frozen state of. 0 means the tenant had never created a
    # fence when the event was resolved — an empty fence set as knowledge, not as absence.
    version: Int!
    # The fences as of this version, ordered by token, one bounded page at a time.
    #
    # It is PAGINATED because a fence set at the documented authoring ceiling does not fit
    # in one cross-service response: the service-token client that reads this door caps a
    # response at 1 MiB, and a hundred fences of five hundred vertices is more than that.
    # Unpaginated, the read failed for exactly the tenants who had used the product as
    # documented, and the failure surfaced only as containment eval errors. Read pages
    # until pagination.pageEnd reaches pagination.totalRecords.
    #
    # Paging a SNAPSHOT is safe in a way paging a live list is not: a version's fence set
    # is frozen at mint and nothing ever rewrites it, so two pages of one version cannot
    # come from two different fence sets however long the read takes.
    fences(pagination: PaginationInput!): GeoFenceSnapshotEntrySearchResults!
}

# One page of a frozen fence set's fences.
type GeoFenceSnapshotEntrySearchResults {
    results: [GeoFenceSnapshotEntry!]!
    pagination: SearchResultsPagination!
}

# One fence inside a frozen snapshot. Name and description are deliberately absent: the
# snapshot freezes only what changes what a rule computes, so a typo fix in a fence's name
# does not make history read differently.
type GeoFenceSnapshotEntry {
