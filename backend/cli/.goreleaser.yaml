#
# goreleaser config for the DeviceChain CLI (dcctl).
#
# Builds cross-platform `dcctl` binaries from the backend/cli module and
# attaches them (with archives + checksums) to the GitHub Release created for
# a vX.Y.Z tag. The release workflow runs this from the backend/cli directory,
# so this module IS the project root and `main: .` resolves to backend/cli/main.go.
#
# Version is stamped via ldflags into github.com/devicechain-io/dcctl/cmd.Version
# (and the existing gitCommit var), so `dcctl version` reports the release.

version: 2

project_name: dcctl

# No `go mod tidy` before-hook: the cli module depends on sibling modules via
# go.work + replace directives, and tidying outside the workspace rewrites
# go.mod/go.sum incorrectly. The committed go.mod is already tidy.

builds:
  - id: dcctl
    binary: dcctl
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/devicechain-io/dcctl/cmd.Version={{ .Version }}
      - -X github.com/devicechain-io/dcctl/cmd.gitCommit={{ .FullCommit }}
      # A released binary is the longest-lived dcctl there is — it sits on a PATH
      # for months, which is exactly the staleness `dcctl version` reports. Left
      # unstamped it would print "built: unknown", disabling the age and stale
      # warning precisely for the population that needs them most.
      - -X github.com/devicechain-io/dcctl/cmd.buildDate={{ .Date }}
      - -X github.com/devicechain-io/dcctl/cmd.gitTreeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}
      # Pin the default image version a released dcctl deploys to this release's
      # tag, so `dcctl bootstrap` (published path) pulls real images instead of
      # the unpublished ":dev".
      #
      # This MUST be {{ .Tag }}, not {{ .Version }}. goreleaser strips the leading
      # "v" for .Version, but the images ko pushes are tagged with the raw git tag
      # (the release workflow's ko job uses GITHUB_REF_NAME verbatim), and so is the
      # chart's appVersion. A released dcctl stamped with .Version therefore went
      # looking for ghcr.io/devicechain-io/<area>:0.8.2 when the registry only has
      # :v0.8.2 — every workload ImagePullBackOff, several minutes into a bootstrap
      # that looked healthy. That shipped in v0.8.1 and v0.8.2.
      #
      # IsUnpublishedImageVersion cannot catch this: "0.8.2" is shaped exactly like
      # a real published tag. The release workflow now verifies the built binary's
      # tag actually resolves in the registry, which is the only check that can.
      - -X github.com/devicechain-io/dcctl/bootstrap.DefaultImageVersion={{ .Tag }}

archives:
  - id: dcctl
    ids:
      - dcctl
    name_template: >-
      dcctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    # Windows users expect a .zip rather than a tarball.
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc

release:
  github:
    owner: devicechain-io
    name: devicechain
  # Mark the GitHub Release as a prerelease automatically when the tag carries
  # a prerelease segment (e.g. v1.2.3-rc.1). Stable tags publish a full release.
  prerelease: auto
  # 🔴 NO `header:` HERE ON PURPOSE. The release workflow passes
  # --release-header, which OVERRIDES this key entirely -- so a header written
  # here would look load-bearing, never be emitted, and drift away from the one
  # that is. The standing pre-1.0 notice and the per-release highlights are both
  # emitted by hack/build-release-notes-header.sh, which builds them from
  # .github/release-highlights.json: the same file the website manifest reads, so
  # the release notes and the website cannot disagree about what shipped.
  #
  # Running goreleaser BY HAND without that flag therefore produces a release body
  # with no pre-1.0 notice. That is the trade for having one source instead of two
  # that must agree, and releases are cut by the workflow, never by hand.
