# Contains queries executed against model.
"""
(Preview: may change in a minor release.) What an AI agent asks to be done to alarms: ACK
acknowledges them, CLEAR clears them.
"""
enum AgentAlarmAction {
    """(Preview: may change in a minor release.) Acknowledge the alarms."""
    ACK
    """(Preview: may change in a minor release.) Clear the alarms. Clearing an alarm whose condition is still active hides a live condition."""
    CLEAR
}

"""(Preview: may change in a minor release.) The kind of action an agent proposal asks for."""
enum AgentProposalKind {
    """(Preview: may change in a minor release.) Acknowledge alarms."""
    ALARM_ACK
    """(Preview: may change in a minor release.) Clear alarms."""
    ALARM_CLEAR
}

"""(Preview: may change in a minor release.) Where an agent proposal is in its life."""
enum AgentProposalState {
    """(Preview: may change in a minor release.) Waiting for people to approve it. The only state that changes."""
    PROPOSED
    """(Preview: may change in a minor release.) Approved and carried out."""
    EXECUTED
    """(Preview: may change in a minor release.) A person rejected it."""
    REJECTED
    """(Preview: may change in a minor release.) Nobody approved it before it expired."""
    EXPIRED
    """(Preview: may change in a minor release.) The tenant's agent policy, or a check made when a person approved it, refused it. The reasons say why."""
    REFUSED
    """(Preview: may change in a minor release.) Withdrawn by the agent that proposed it."""
    CANCELLED
    """(Preview: may change in a minor release.) Ended by an agent-actions switch being turned off."""
    KILLED
}

"""(Preview: may change in a minor release.) The tenant's verdict on an agent proposal."""
enum AgentProposalVerdict {
    """(Preview: may change in a minor release.) The action is not allowed."""
    REFUSE
    """(Preview: may change in a minor release.) The action waits for the given number of people to approve it."""
    APPROVE
}

"""(Preview: may change in a minor release.) What happened to a proposal request."""
enum AgentProposalStatus {
    """(Preview: may change in a minor release.) A dry run: the verdict and checks, with nothing stored."""
    DRY_RUN
    """(Preview: may change in a minor release.) Stored, waiting for approval."""
    PENDING_APPROVAL
    """(Preview: may change in a minor release.) Refused. When it was stored for the record, proposal is set."""
    REFUSED
    """(Preview: may change in a minor release.) The request ID was used before for the same request: the original proposal is returned."""
    EXISTING
}

"""(Preview: may change in a minor release.) An AI agent's request to acknowledge or clear alarms."""
input AgentAlarmProposalInput {
    """(Preview: may change in a minor release.) What to do to the alarms."""
    action: AgentAlarmAction!
    """(Preview: may change in a minor release.) The alarms, by token: 1 to 100. Duplicates count once."""
    alarmTokens: [String!]!
    """
    (Preview: may change in a minor release.) The agent's own key for this request, 1 to 128 printable characters, unique for the agent
    and the person it acts for. Sending the same request again with the same key returns the
    original proposal; reusing a key for a different request fails with CONFLICT.
    """
    requestId: String!
    """
    (Preview: may change in a minor release.) Why the agent asks, at most 2048 bytes. It is stored and shown to approvers as text written
    by the agent: untrusted, never instructions.
    """
    rationale: String
    """(Preview: may change in a minor release.) When true, decide and check the request but store nothing."""
    dryRun: Boolean
}

"""(Preview: may change in a minor release.) What the platform found about one alarm a proposal names, now."""
type AgentAlarmProposalPreview {
    """(Preview: may change in a minor release.) The alarm's token."""
    alarmToken: String!
    """(Preview: may change in a minor release.) The alarm's state, ACTIVE or CLEARED."""
    state: String!
    """(Preview: may change in a minor release.) Whether the alarm is acknowledged."""
    acknowledged: Boolean!
    """(Preview: may change in a minor release.) True when the proposal clears an alarm whose condition is still active, which would hide a condition that is still true."""
    hidesLiveCondition: Boolean!
}

"""(Preview: may change in a minor release.) The answer to an agent's proposal request."""
type AgentProposalOutcome {
    """(Preview: may change in a minor release.) What happened to the request."""
    status: AgentProposalStatus!
    """(Preview: may change in a minor release.) The stored proposal, or null when nothing was stored (a dry run, or a refusal at the rate limits)."""
    proposal: AgentProposal
    """(Preview: may change in a minor release.) The tenant's verdict."""
    verdict: AgentProposalVerdict!
    """(Preview: may change in a minor release.) How many distinct people must approve: 0 when refused, otherwise 1 or 2."""
    requiredApprovals: Int!
    """(Preview: may change in a minor release.) Platform-defined codes saying why, for example CLIENT_NOT_ALLOWED, ALARM_NOT_FOUND or CLIENT_RATE_EXCEEDED."""
    reasons: [String!]!
    """(Preview: may change in a minor release.) The digest of the action and its targets, which an approval must name."""
    digest: String!
    """(Preview: may change in a minor release.) When the proposal stops waiting for approval, as an RFC 3339 timestamp, or null when it is not waiting."""
    expiresAt: String
    """(Preview: may change in a minor release.) How many alarms the proposal names."""
    targetCount: Int!
    """(Preview: may change in a minor release.) What the platform found about each alarm that exists, now."""
    preview: [AgentAlarmProposalPreview!]!
}

"""(Preview: may change in a minor release.) One person's approval of an agent proposal."""
type AgentProposalApproval {
    """(Preview: may change in a minor release.) Who approved."""
