    """The content address of the fence's geometry document, to pass to geoFenceGeometry."""
    hash: String!
}

# One archived geometry document and the content address it is filed under. The address is
# the SHA-256 of exactly these bytes, so a caller can — and should — re-derive it to verify
# what it received rather than trusting the association.
"""
One archived geometry document and the content address it is filed under. The address is the SHA-256
of exactly these bytes, so a caller should re-derive it to verify what it received rather than trust
the association.
"""
type GeoFenceGeometry {
