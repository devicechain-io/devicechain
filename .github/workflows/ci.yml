# SPDX-License-Identifier: Apache-2.0
#
# Validation CI for the DeviceChain monorepo.
#
# This workflow validates only -- it never publishes images or artifacts.
# Image publishing lives in a separate, tag-triggered workflow.
#
# Services are enumerated dynamically from backend/services/* (via
# hack/list-services.sh), so adding a new service needs no edits here.

name: ci

on:
  pull_request:
    # The default three, plus ready_for_review: a DRAFT pull request does not run the heavy jobs
    # (go, integration, image-smoke, migrations) and its ci-complete fails, so marking it ready
    # has to start the run that does. See the `draft` output of discover, which is read from the
    # API when discover runs, not from this event's payload, so a re-run or a late-delivered push
    # run plans for what the pull request is now.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Run the full suite on a chosen commit. Pushes to main share ONE queue (see
  # concurrency below), so a main commit merged in a burst may never get a push run
  # of its own. When a specific commit needs its own green run -- a release tag, or
  # bisecting a main break across a burst -- dispatch it:
  #   gh workflow run ci.yml --ref vX.Y.Z-rc.N        # a tag
  #   git push origin <sha>:refs/heads/ci/<name>      # any other commit, then
  #   gh workflow run ci.yml --ref ci/<name>
  # A dispatch always selects every job (hack/ci-select.py), like a push.
  workflow_dispatch:

# Least privilege: validation jobs only need to read the repo.
permissions:
  contents: read

# Who waits for whom, by event:
#
#   pull_request   grouped by the PR's ref, and a new push to the PR CANCELS the run
#                  in progress: a superseded head is not evidence about anything.
#   push to main   ONE group for the branch, never cancelled. GitHub keeps at most one
#                  running and one PENDING run per group, and a newer pending run
#                  replaces the older pending one. So the run in progress always
#                  finishes, and the newest main commit always gets a run -- but a
#                  PENDING run is skipped (cancelled before it starts) when a newer
#                  push replaces it, so that commit gets no run of its own.
#   push elsewhere grouped by commit SHA (no such trigger today; kept so adding one
#                  for a release branch or tag cannot silently collapse its runs).
#   dispatch       a group of its own (run_id): a chosen commit is never queued
#                  behind, or replaced by, the main queue.
#
# Why main is a queue and not one run per commit: each main run is the FULL suite
# (~460 job-minutes; ci-select.py selects everything off a pull_request), and a merge
# burst of 32 PRs once queued 28 of them, starving every open PR of runners. Every PR
# must already be green to merge, and each main run tests the whole tree up to its
# commit, so a skipped commit is covered by the next main run; a break found there is
# bisected with the workflow_dispatch above.
#
# (Before this, push runs were grouped per SHA. Earlier still they were grouped by ref
# with cancel-in-progress on, so each merge cancelled the RUNNING main run and main
# could go hours without a completed run. Neither failure is possible here.)
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Enumerate services (image-smoke matrix) and Go modules (go matrix).
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so contents: read is restated.
    # pull-requests: read is for the one step that asks whether the pull request is a draft NOW
    # (see "Is the pull request a draft now?" below).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.svc.outputs.services }}
      modules: ${{ steps.mod.outputs.modules }}
      go_batches: ${{ steps.mod.outputs.go_batches }}
      # The FULL integration plan, which every leg re-checks against fresh discovery (DC_IT_PLAN).
      integration_all: ${{ steps.integ.outputs.integration }}
      # What this run executes, from hack/ci-select.py: a subset on a pull request, all of it otherwise.
      integration: ${{ steps.select.outputs.integration }}
      go_legs: ${{ steps.select.outputs.go_legs }}
      frontend: ${{ steps.select.outputs.frontend }}
      # Whether the two `migrations` jobs run: true unless no changed file reaches a package
      # hack/migration-diff.sh compiles (or its operand image). Always true off a pull request.
      migrations: ${{ steps.select.outputs.migrations }}
      # Whether the fleet-runner job runs: true unless the diff reaches nothing it builds or runs against.
      fleet_runner: ${{ steps.select.outputs.fleet_runner }}
      # Whether the tui-windows job runs: true unless the diff reaches nothing in backend/cli that the
      # install terminal UI compiles, none of the install command's own files or its preflight, and
      # no Go file in backend/cli that only a Windows build compiles.
      tui_windows: ${{ steps.select.outputs.tui_windows }}
      # The image-smoke legs this run executes: the images whose module runs whole (or one of
      # their image inputs changed), from hack/ci-select.py; every image off a pull request.
      smoke: ${{ steps.select.outputs.smoke }}
      # "true" only for a DRAFT pull request, which plans none of the heavy jobs and whose
      # ci-complete therefore fails. "false" everywhere else; ci-complete refuses any other value.
      draft: ${{ steps.select.outputs.draft }}
    steps:
      # 🔴 fetch-depth: 0 — "Select affected legs" diffs the pull request against its merge
      # base, which a shallow clone does not have. (The tooling self-tests that read the tag
      # history moved to the self-tests job, which keeps its own full clone.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Discover services
        id: svc
        run: |
          services="$(hack/list-services.sh)"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services: $services"

      # The toolchain is needed for `go list -m` below and for nothing else in this
      # job, so the build cache is off: this job compiles nothing, so there is no build
      # output worth persisting, and restoring/saving an entry here would only spend
      # time and cache quota on something no other job can use — the `go` matrix keys
      # its caches per module. (It is NOT off because the cache step would fail; it
      # would not. See the cache-dependency-path note in the `go` job for what setup-go
      # actually does when a cache path resolves to nothing.)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      # Self-test first, as with every guard in this workflow. The cross-check below
      # is only worth having while its second reader can be shown to read correctly —
      # and a parser that returns a plausible-looking count for a file it misparsed is
      # exactly the failure this pair exists to catch.
      - name: workspace-module reader self-test
        run: hack/list-workspace-modules.sh --self-test

      # Proves the tidy check can fail — on a missing requirement, an unused one, a
      # module left behind by a core bump, a direct import marked indirect and a stale
      # go.sum line — and that a module it cannot resolve is a refusal rather than
      # "tidy" or "drift", before the matrix relies on its green. Fully offline.
      - name: go.mod tidy check self-test
        run: hack/check-go-mod-tidy.sh --self-test

      - name: Go batching self-test
        run: |
          python3 hack/ci-go-batch.py --self-test
          python3 hack/test-ci-go-batch.py

      - name: Discover Go modules
        id: mod
        run: |
          # 🔴 DERIVED FROM go.work, NOT FROM A GLOB OF DIRECTORY NAMES. The glob this
          # replaced was backend/{cli,core,k8s,edge/*,services/*,sims/*,tools/*}, which
          # is a hand-maintained restatement of the workspace that nothing kept in step
          # with it — and it had already drifted: `deploy` (deploy/assets.go, the module
          # that embeds the chart and the OpenTofu tree into dcctl) is a workspace member
          # that matched no pattern, so NO job in this workflow built, vetted, tested or
          # scanned it. The failure is silent in the worst way: the matrix simply has one
          # fewer entry, every job it does run is green, and nothing anywhere says a
          # module went unexamined.
          #
          # `go list -m` reads go.work, so a module is covered the moment it joins the
          # workspace rather than the moment somebody remembers this list. It is the same
          # derivation the codeql workflow and the full-sweep in CLAUDE.md already use,
          # which is why those two DID cover deploy while this workflow did not.
          modules="$(go list -m -f '{{.Dir}}' | sed "s|^${PWD}/||" | jq -R . | jq -s -c .)"

          # 🔴 THE GUARD, because the failure mode of a DERIVED matrix is different from
          # the failure mode of a hard-coded one. An empty or truncated list does not
          # fail: `strategy.matrix` over zero entries runs zero jobs, every one of them
          # "succeeds" by not existing, and the `go` job reports green having compiled
          # nothing at all. So the count is cross-checked against a SECOND, independent
          # reader of the same file — hack/list-workspace-modules.sh, a plain awk over
          # go.work's `use` directives that needs no toolchain and shares no code with
          # the go command. Two readers disagreeing is the only cheap signal that one of
          # them silently dropped something.
          #
          # It is a script rather than an awk one-liner inline here because the
          # one-liner was WRONG: it read only the parenthesised `use (...)` block, so a
          # single-line `use ./backend/tools/x` — valid syntax — counted as zero and a
          # perfectly good go.work failed this check. The script parses both forms and
          # its --self-test pins them.
          want="$(hack/list-workspace-modules.sh | wc -l)"
          got="$(echo "$modules" | jq 'length')"
          if [ "$want" -eq 0 ] || [ "$got" -ne "$want" ]; then
            echo "::error::module discovery disagrees with go.work: go list -m gave $got, go.work declares $want."
            echo "$modules" | jq -r '.[]'
            exit 1
          fi

          # Preserve the independent count guard above, and also compare exact membership
          # against that reader. Then prove that batches partition the full list: no loss,
          # duplication or substitution can turn a shortened matrix green.
          batches="$(DISCOVERED_MODULES="$modules" WORKSPACE_MODULES="$(hack/list-workspace-modules.sh)" python3 hack/ci-go-batch.py discover)"
          echo "go_batches=$batches" >> "$GITHUB_OUTPUT"
          echo "Go batches: $batches"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Modules ($got): $modules"

      # The guard before the gate, the way the other hack/ checks do it. A `-run` filter that
      # matches nothing exits 0 with "no tests to run", which is indistinguishable from a pass
      # in every summary — and that is not hypothetical: the first draft of the runner covered
      # 8 of the 13 tagged tests and reported success. This proves the runner can tell an empty
      # run from a real one, and that the leg plan below refuses a stale or uncovering grouping,
      # BEFORE any integration leg's green result is used as evidence of anything.
      - name: integration runner self-test
        run: hack/integration-tests.sh --self-test

      # 🔴 Derived from go.work + the tag grep: a module that gains an integration test
      # joins the small leg automatically. A stale HEAVY entry fails here, as do zero legs:
      # a matrix over zero entries runs zero jobs green. Every leg independently re-derives
      # the set with the package loader and refuses a differing plan through DC_IT_PLAN.
      - name: Discover integration legs
        id: integ
        run: |
          set -euo pipefail
          plan="$(hack/integration-tests.sh --matrix)"
          if [ "$(jq 'length' <<<"$plan")" -le 0 ]; then
            echo "::error::integration discovery produced zero legs"
            exit 1
          fi
          echo "integration=$plan" >> "$GITHUB_OUTPUT"
          printf 'LEG\tMODULES\n'
          jq -r '.[] | [.name, .modules] | @tsv' <<<"$plan"

      - name: Build image-smoke module list
        id: smoke
        run: |
          # ko-buildable image modules = each discovered service (mapped to its
          # backend/services/<name> dir) PLUS the operator at backend/k8s PLUS the Tier-1
          # edge agent at backend/edge/dc-edge-agent (a standalone image, not a service —
          # list-services.sh globs backend/services/* only, so it is added explicitly).
          # Keep this list in step with release.yml's guard job (they are two textual
          # copies of the same set).
          #
          # pipefail, and the service list in its OWN statement: `$( { a | b; echo x; } | c )`
          # has the exit status of `c`, so a failing list-services.sh used to shrink this
          # to k8s + the edge agent and every job downstream stayed green over less. The
          # count is then cross-checked against a second reader (every service main.go),
          # so a list that is merely short fails too.
          set -euo pipefail
          services="$(hack/list-services.sh | jq -r '.[] | "backend/services/" + .')"
          want="$(find backend/services -mindepth 2 -maxdepth 2 -name main.go | wc -l)"
          got="$(printf '%s\n' "$services" | grep -c . || true)"
          if [ "$want" -eq 0 ] || [ "$got" -ne "$want" ]; then
            echo "::error::service discovery disagrees with the tree: list-services.sh gave $got, backend/services/*/main.go counts $want."
            exit 1
          fi
          smoke="$(
            { printf '%s\n' "$services"
              echo "backend/k8s"
              echo "backend/edge/dc-edge-agent"
              echo "backend/admin/dc-broker-admin"
              echo "backend/broker/dc-nats-server"
            } | jq -R . | jq -s -c .
          )"
          # The FULL list: hack/ci-select.py plans from it, and plans all of it off a pull request.
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Image modules: $smoke"

      # The selection's own guards, before its answer is used. The self-test proves the rails can
      # trip (a reverse dependency, go.work/.github/hack, an unknown path outside every module, an
      # empty diff); `check` proves the reader and split tables still describe the tree, and that
      # no module's Go code reaches outside the module from a package the reader table does not
      # name; go-leg's self-test proves a split package's shards partition its tests.
      - name: leg selection self-tests and tables
        run: |
          python3 hack/ci-select.py --self-test
          python3 hack/ci-select.py check
          hack/go-leg.sh --self-test

      # The rule that lets the required dependency-review check pass without running the review
      # on a diff that touches no manifest. That workflow reads it from the base commit, so it is
      # proved here, on the pull request that changes it, before it is ever relied on.
      - name: dependency-review scope self-test
        run: python3 hack/dependency-review-scope.py --self-test

      # 🔴 THE DRAFT VERDICT IS READ LIVE, NOT FROM THE EVENT PAYLOAD. The payload is frozen when
      # the event fires, and two ordinary sequences left a ready pull request with nothing but a
      # failing draft run:
      #   - a RE-RUN replays the original payload, so re-running a run that started while the pull
      #     request was a draft plans the draft again and its ci-complete fails again, after the
      #     pull request was marked ready -- and, being newest, that failure shadows the green
      #     ready_for_review run;
      #   - a push followed seconds later by `gh pr ready` can deliver the push's run (payload
      #     draft=true) AFTER the ready_for_review run, and the concurrency group then cancels the
      #     ready run in its favour.
      # Asking the API when discover runs answers the question the plan actually depends on: is
      # this pull request a draft at the moment its heavy jobs would be planned? Either answer is
      # safe for the gate -- "false" only runs MORE (the full plan for this diff), "true" plans no
      # heavy job and ci-complete fails the run -- so the verdict can only add work, never let
      # less through. If the API cannot answer, the payload's value is used, which is exactly the
      # behaviour before this step existed.
      - name: Is the pull request a draft now?
        id: draft
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          live=""
          for attempt in 1 2 3; do
            live="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft 2>/dev/null)" || live=""
            case "$live" in true|false) break ;; esac
            sleep $((attempt * 5))
          done
          case "$live" in
            true|false)
              [ "$live" = "$PAYLOAD_DRAFT" ] || echo "::notice::the event payload said draft=$PAYLOAD_DRAFT, but the pull request is draft=$live now; planning for draft=$live"
              ;;
            *)
              echo "::warning::could not read the pull request's draft state from the API; using the event payload's (draft=$PAYLOAD_DRAFT)"
              live="$PAYLOAD_DRAFT"
              ;;
          esac
          echo "draft=$live" >> "$GITHUB_OUTPUT"

      # 🔴 AFFECTED-MODULE SELECTION, PULL REQUESTS ONLY. A pull request runs the Go legs of the
      # modules its diff (against the merge base) changes, every module that requires one of them
      # through go.mod, transitively, and the test packages that READ a changed file from outside
      # their module (hack/ci-select.py's READERS table). Push, merge_group, schedule and dispatch
      # run everything; so does a change to go.work, go.work.sum, any go.mod or go.sum (the workspace
      # resolves one version of each dependency for every module), .github/ or hack/, a file outside
      # every module the tables do not account for, an empty diff, and any failure of the selection
      # itself. The log below names every module skipped and why. `modules` above is still the
      # count-cross-checked FULL list; this selects from it.
      #
      # If this step fails outright (as opposed to falling back to everything), discover fails and
      # ci-complete fails with it: an unknown selection is never read as an empty one.
      - name: Select affected legs
        id: select
        env:
          DISCOVERED_MODULES: ${{ steps.mod.outputs.modules }}
          GO_BATCHES: ${{ steps.mod.outputs.go_batches }}
          INTEGRATION_PLAN: ${{ steps.integ.outputs.integration }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The live verdict from the step above (empty off a pull request, where the step is skipped).
          PR_DRAFT: ${{ steps.draft.outputs.draft }}
          SMOKE_MODULES: ${{ steps.smoke.outputs.smoke }}
        run: |
          set -euo pipefail
          sel="$(python3 hack/ci-select.py plan)"
          # Select first, then remove unselected members from the fixed full-run batches.
          # ci-go-batch compares every original leg payload after flattening; empty batches
          # emit no matrix entry. Split/envtest/slow modules retain their original jobs.
          sel="$(printf '%s\n' "$sel" | python3 hack/ci-go-batch.py select)"
          go_legs="$(jq -c '.go' <<<"$sel")"
          integ="$(jq -c '.integration' <<<"$sel")"
          frontend="$(jq -r '.frontend' <<<"$sel")"
          case "$frontend" in true|false) ;; *) echo "::error::frontend verdict is '$frontend'"; exit 1 ;; esac
          migrations="$(jq -r '.migrations' <<<"$sel")"
          case "$migrations" in true|false) ;; *) echo "::error::migrations verdict is '$migrations'"; exit 1 ;; esac
          fleet_runner="$(jq -r '.fleet_runner' <<<"$sel")"
          case "$fleet_runner" in true|false) ;; *) echo "::error::fleet_runner verdict is '$fleet_runner'"; exit 1 ;; esac
          tui_windows="$(jq -r '.tui_windows' <<<"$sel")"
          case "$tui_windows" in true|false) ;; *) echo "::error::tui_windows verdict is '$tui_windows'"; exit 1 ;; esac
          smoke="$(jq -c '.smoke' <<<"$sel")"
          jq -e 'type == "array"' <<<"$smoke" >/dev/null || { echo "::error::smoke plan is '$smoke'"; exit 1; }
          draft="$(jq -r '.draft' <<<"$sel")"
          case "$draft" in true|false) ;; *) echo "::error::draft verdict is '$draft'"; exit 1 ;; esac
          # A run that is not a pull request must plan every module; the script asserts the same.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && { [ "$(jq -r '.full' <<<"$sel")" != true ] || [ "$migrations" != true ] || [ "$fleet_runner" != true ] || [ "$tui_windows" != true ] || [ "$draft" != false ] || [ "$smoke" != "$SMOKE_MODULES" ] \
             || ! jq -e '[.go[] | (.batch // [.])[]] | all(.race_scope == "all")' <<<"$sel" >/dev/null; }; then
            echo "::error::a $GITHUB_EVENT_NAME run selected a subset"
            exit 1
          fi
          {
            echo "go_legs=$go_legs"
            echo "integration=$integ"
            echo "frontend=$frontend"
            echo "migrations=$migrations"
            echo "fleet_runner=$fleet_runner"
            echo "tui_windows=$tui_windows"
            echo "smoke=$smoke"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The tooling self-tests: each script a later job (or a release, or a rig run by hand)
  # relies on is shown to be able to FAIL before its green is believed.
  # ---------------------------------------------------------------------------
  # These used to be steps of `discover`, about 85 s of its 105 s, and nothing discover
  # outputs reads any of them -- but every heavy job `needs: discover`, so each second here
  # was a second on the critical path of every run. They are a job of their own now, in
  # parallel with the matrix, and ci-complete needs it like every other job: a self-test
  # that fails still fails the gate. The self-tests the PLAN depends on (the module
  # reader, the tidy check, Go batching, the integration runner, leg selection, the
  # dependency-review scope) stay in discover, before the plan they guard is used.
  self-tests:
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 — the upgrade-rig self-test below reads the TAG HISTORY.
      # It checks that the rig would refuse to deploy the working tree's chart around
      # some other release's images, and the only honest way to ask that is against
      # real releases. On the default shallow clone it sees no tags at all and
      # (correctly) refuses to report clean, so the job fails for want of history
      # rather than for anything wrong with the tree. The clone is ~50 MB.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The workspace-sum check runs in every go matrix job; prove once, here, that
      # it can fail.
      - name: workspace-sum check self-test
        run: hack/check-go-work-sum.sh --self-test

      # The silent-skip gate runs after `go test` in every go leg; prove once, here, that it
      # can fail (an unlisted skip is red, a listed one green, empty or malformed output exit 2).
      - name: silent-skip gate self-test
        run: bash hack/check-no-silent-skips.sh --self-test

      # The fleet module's real-Postgres suite runs inside hack/migration-diff.sh verify, behind
      # the build tag fleetpg, and its count of passed TestFleetPG* tests is what proves the tag
      # compiled anything. Prove once, here, that the count check refuses an empty suite.
      - name: fleet real-Postgres count check self-test
        run: bash hack/check-fleetpg-count.sh --self-test

      # The release-candidate run script's exit-code, stop and liveness handling, against
      # stub rungs. Nothing else runs it, and it is what a 60-minute run's verdict is
      # reported through.
      - name: release-candidate run script self-test
        run: hack/loadtest-rc-run.sh --self-test

      # The performance-round collector and analyser against stub kubectl/curl: the steady
      # marker refusals, the missing-component and replaced-pod failures, --dry-run writing
      # nothing, and the per-event arithmetic. Needs jq (preinstalled on the runner image).
      - name: performance-round collector self-test
        run: |
          hack/perf-collect.sh --self-test
          hack/perf-analyze.sh --self-test

      # The calculated-metrics cost gate's pure checks (tier merge, counter and stored-row-shape
      # checks, the verdict table), each against a twin that must be refused. The rest of the
      # harness needs a cluster.
      - name: calculated-metrics cost gate self-test
        run: hack/calc-cost-gate.sh self-test

      # The website manifest publisher, against local bare repos for both website layouts:
      # an older tag and a wrong live version must each be refused.
      - name: release manifest publisher self-test
        run: hack/publish-release-manifest.sh --self-test

      # The evidence-pack generator and the OpenVEX generator, each against inputs it must refuse:
      # a stale, missing, failing, future-dated or edited rig result, an empty SBOM or VEX document,
      # a tampered or smuggled pack member, and a govulncheck report from a scan that never completed.
      - name: evidence pack and OpenVEX generator self-tests
        run: |
          hack/evidence-pack.sh --self-test
          hack/vex-from-govulncheck.sh --self-test
          hack/check-evidence-pack-workflow.sh --self-test
          hack/check-evidence-pack-workflow.sh

      # Proves the coverage check can fail before its green run is used as evidence.
      - name: dependabot module-coverage self-test
        run: hack/check-dependabot-modules.sh --self-test

      # A workspace module missing from Dependabot's gomod `directories` does not go
      # quietly stale — it BREAKS. Each module replaces core with the local ../../core,
      # so the next bump of core leaves an unlisted module's go.mod stale relative to
      # the core it resolves, and the `go.mod and go.sum are tidy` step in the `go`
      # job fails for that module. The module that fails is never the one that was
      # bumped, which is what made the original gap take four weekly PRs to read
      # correctly. Runs here, in discover, so it fails before the whole go matrix fans
      # out.
      - name: dependabot covers every workspace module
        run: hack/check-dependabot-modules.sh

      # The release pipeline calls this guard from two places (the workflow's first job
      # and build-release-manifest.sh), and it only runs on a tag — so without this the
      # first time anyone learns it is broken is mid-release. The self-test is the part
      # that runs on every PR; the guard itself has nothing to check until there is a tag.
      - name: release-highlights guard self-test
        run: hack/check-release-highlights.sh --self-test

      # The release job's changelog base runs only on a tag, and a wrong base publishes a
      # changelog that starts a minor too early (v1.5.0's started at v1.3.0). The self-test is
      # the part that runs on every PR, before a release needs the base.
      - name: changelog base self-test
        run: hack/changelog-base.sh --self-test

      # Every compatibility check picks its baseline in hack/api-baseline.sh, by a rule that
      # reads tags AND branch topology (main is compared with a minor tagged on a release branch
      # main never contains), so it is proven on planted histories, not on whatever tags exist.
      - name: compatibility baseline self-test
        run: hack/api-baseline.sh --self-test

      # The chart stamp runs only on a tag; a broken flag mislabels a release in Artifact Hub.
      # The self-test is the part that runs on every PR, before a release needs the stamp.
      - name: chart prerelease stamp self-test
        run: hack/stamp-chart-prerelease.sh --self-test

      # Same reasoning as the guard above, and the same blast radius: this builds the
      # header of the GitHub Release body, runs ONLY on a tag, and a break in it fails
      # the `cli` job after every image has already been pushed. The self-test is the
      # part that runs on every PR.
      - name: release-notes header self-test
        run: hack/build-release-notes-header.sh --self-test

      # The website's download manifest (devicechain.io/releases.json) is built in the
      # release workflow's last job, after the Release is already public — so a break here is
      # learned as "release shipped, website not updated". Stubbed gh, no network: both
      # products' tables carry their own checksum file's digests, and a missing archive or
      # checksum file is refused rather than published as a shorter menu.
      - name: release-manifest self-test
        run: hack/build-release-manifest.sh --self-test

      # The signature verifier is the user's way to check a release, and the identity regexp
      # it derives is what makes "signed" mean "signed by OUR release workflow for THIS tag".
      # The self-test proves that regexp matches only its own tag; the cosign-facing half is
      # exercised on PRs by release-signing-dryrun.yml.
      - name: release-signature verifier self-test
        run: hack/verify-release-signatures.sh --self-test

      # The govulncheck wrapper decides which findings are allowed to pass. Its
      # allowlist is the one place in CI where a known vulnerability is waved
      # through on purpose, so proving the checker can still fail — on an
      # unreviewed finding AND on an exception that has gone stale — matters more
      # here than anywhere else. Runs in discover, before the matrix fans out.
      - name: govulncheck wrapper self-test
        run: hack/govulncheck.sh --self-test

      # The Docker Hub mirror fallback every digest-pinned image pull goes through. Stubbed
      # docker, no network: Hub down + mirror up succeeds, both down fails loudly, no digest
      # is refused.
      - name: docker-pull fallback self-test
        run: hack/docker-pull.sh --self-test

      # The upgrade drill needs an hour and a kind cluster, so no part of it runs
      # on a PR -- which makes its string handling exactly the code that rots
      # unwatched, correct the day it was written and next exercised while a
      # release is waiting on it. This is the part that runs every time.
      #
      # 🔴 The POSITIVE case is what this buys. The drill's operator check was once
      # expected to FAIL on every real run, back when nothing moved the operator, so
      # its red said almost nothing on its own -- a check hard-wired to fail would
      # look identical. That gap is closed and a red there is now a regression, which
      # makes proving the check reports AGREEMENT when the versions agree the thing
      # that keeps its red meaningful.
      - name: upgrade-rig self-test
        run: hack/upgrade-rig.sh selftest

      # The bulk-change P-1 harness only runs by hand on the kind A/B rig, so its decision rule
      # (PASS, FAIL, INCONCLUSIVE, too few runs) would otherwise be read by nothing between uses.
      - name: bulk-change P-1 harness self-test
        run: hack/bulk-change-p1.sh --self-test

      # The race detector self-test below builds and runs Go; the build cache is off for the
      # same reason as in discover (nothing compiled here is reused by another job).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      # The race detector exits 0 when it finds nothing, which makes "no data
      # races" and "never instrumented" the same result. Dropping -race from the
      # command, a toolchain built without cgo or a missing C compiler each turn
      # the race step into a second, slower copy of `go test` that reports
      # success forever. This builds a module with a known race, runs it through
      # the race step's own entry point on this runner's toolchain and requires a
      # DATA RACE report — plus a
      # race-free control, since a checker that fails on everything proves
      # nothing either. ci-complete needs this job, so a detector that cannot fail blocks the merge.
      - name: race detector self-test
        run: hack/go-race.sh --self-test

      # Which modules the detector covers, said once, as a table. The race step
      # rides the whole per-module `go` matrix and runs on every module except the
      # exempt list in hack/go-race.sh, and a step
      # that decides not to run renders as the same green tick as one that ran —
      # so a reader cannot recover the covered set from the matrix. This is where
      # that set is legible.
      - name: race detector coverage
        run: hack/go-race.sh --list

  # ---------------------------------------------------------------------------
  # Go validation: small modules share jobs; split/envtest/slow modules keep their legs.
  # Every command still runs with its own module as the working directory.
  # ---------------------------------------------------------------------------
  #
  # 🔴 ONE ENTRY PER LEG, NOT PER MODULE. hack/ci-select.py plans the legs: a module runs as one
  # leg, or (SPLITS) as shards of its slowest packages plus one catch-all leg that runs the rest
  # and carries the module's static checks (`entry.static`: gofmt, build, vet, tidy, the workspace
  # sum, govulncheck), so those run once per module. A leg selected only because its tests read a
  # changed file runs just those packages, with no static checks: its module's code did not change.
  # Small modules are grouped by hack/ci-go-batch.py AFTER selection, using checked-in
  # successful push timings and the same cache group. go-ci-batch.sh runs every selected
  # member with its original flags and reports failures by module in logs and the summary.
  # Skipped when the plan has no Go legs (a pull request touching nothing Go reads); ci-complete
  # accepts that skip only when discover succeeded and planned zero legs.
  go:
    name: go (${{ matrix.entry.module }}${{ matrix.entry.leg != '' && format(' / {0}', matrix.entry.leg) || '' }})
    needs: discover
    if: needs.discover.outputs.go_legs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.go_legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The bootstrap snapshot-currency test reads the release tags. A shallow clone
          # still fetches every tag (`+refs/tags/*:refs/tags/*` at depth 1), which is all
          # `git tag --list` needs; DC_REQUIRE_TAGS on the go test step turns a tagless
          # checkout into a failure rather than a skip.
          fetch-tags: true

      # The fleet-operation foundation gate (device-management/model/fleet_operation_gate_test.go) needs
      # the release this build upgrades from, and a shallow clone has the tags but not their history, so
      # `git tag --merged HEAD` finds none. The newest stable tag that is not HEAD is the baseline.
      - name: Resolve the fleet-operation baseline tag
        run: echo "DC_BASELINE_TAG=$(hack/fleet-baseline-tag.sh)" >> "$GITHUB_ENV"

      # 🔴 THE GO BUILD CACHE IS RESTORED HERE AND SAVED BY ONE LEG PER GROUP, ON main ONLY.
      #
      # setup-go's own cache (`cache: true`) restores AND saves, on every event: each pull request
      # wrote entries no other pull request can read, every leg of a split module raced for one
      # write-once key (17 of 20 legs lost that race on one measured run), and 39 per-module keys
      # holding the module cache too needed ~16.6 GB against the repository's 10 GB. The cache
      # sat 1.6x over its limit, evicting continuously, and only 27% of restores hit.
      #
      # So, explicitly:
      #   - the key is the leg's CACHE GROUP (hack/ci-select.py CACHE_GROUPS, ~4 GB in all): modules
      #     sharing a dependency stack share one entry, because the build cache is content-addressed
      #     and a service reuses every package it compiles the same way device-management did;
      #   - the key hashes every go.mod/go.sum and the workspace files, because a workspace builds
      #     ONE version of each dependency for all modules; restore-keys still restores the newest
      #     entry of the group after a bump, which is stale only for what the bump moved;
      #   - only the BUILD cache (GOCACHE). The module cache was about 40% of each entry and buys
      #     seconds: the `go mod download` step below averaged 0.1 min a leg at a 73% miss rate;
      #   - pull requests restore only. The one leg with `cache_save` (its group saver's static
      #     leg) saves, at the end of the job, on a push to main and only after success.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        id: setup-go
        with:
          go-version-file: go.work
          cache: false

      # The path below is written out because actions/cache cannot ask go. If the toolchain or
      # the runner ever moved GOCACHE, the cache would silently restore into a directory go never
      # reads, so this fails instead.
      - name: GOCACHE is where the cache steps put it
        run: test "$(go env GOCACHE)" = "$HOME/.cache/go-build" || { echo "::error::GOCACHE is $(go env GOCACHE), not ~/.cache/go-build; update the cache steps"; exit 1; }

      - name: Restore the Go build cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-[${{ matrix.entry.cache_group }}]-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-[${{ matrix.entry.cache_group }}]-

      - name: Validate selected modules in this batch
        if: matrix.entry.batch
        env:
          BATCH_ENTRIES: ${{ toJson(matrix.entry.batch) }}
        run: bash hack/go-ci-batch.sh

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        if: ${{ !matrix.entry.batch }}
        env:
          # The windows vet step below loads files the linux listing skips (x/sys/windows
          # and friends), so prefetch that package set too or the vet step downloads it bare.
          DC_GOMOD_EXTRA_GOOS: ${{ matrix.entry.module == 'backend/cli' && 'windows' || '' }}
          # The tidy step at the end resolves the module ALONE and loads the tests of its
          # dependencies, every OS and every tag: a different, larger set than the build's,
          # and the step where both observed proxy stream resets landed. Prefetch it too.
          DC_GOMOD_TIDY: ${{ matrix.entry.static && '1' || '' }}
        run: hack/go-mod-download.sh "${{ matrix.entry.module }}"

      # Which packages (and, for a shard, which tests) this leg runs; the test and race steps both
      # read the result. hack/go-leg.sh derives a catch-all as `go list ./...` minus the split
      # packages and proves the arithmetic, and deals a shard round-robin over `go test -list`.
      - name: Resolve this leg's packages
        if: ${{ !matrix.entry.batch }}
        env:
          LEG_PKGS: ${{ matrix.entry.pkgs }}
          LEG_EXCLUDE: ${{ matrix.entry.exclude }}
          LEG_SHARD: ${{ matrix.entry.shard }}
        run: hack/go-leg.sh "${{ matrix.entry.module }}" "$RUNNER_TEMP/leg-args"

      - name: gofmt
        if: matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        run: |
          # gofmt -l prints files that need formatting; any output is a failure.
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: go build
        if: matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        run: go build ./...

      - name: go vet
        if: matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        run: go vet ./...

      # 🔴 THE OPERATOR'S CRD CARRIES CEL RULES, AND CEL IS ENFORCED BY AN API
      # SERVER — so testing it needs one. envtest supplies a real apiserver+etcd
      # pair as binaries, no cluster involved, and the suite takes about 25
      # seconds.
      #
      # This is installed rather than made optional. The suite FAILS when the
      # binaries are absent instead of skipping, and that is deliberate: the
      # rules it covers are what stand between a hand-edited Instance and a
      # `dcctl destroy` pointed at the wrong cluster, and a silent skip would
      # make every CI run green while checking none of them. A structural check
      # of the generated manifest was tried first and is what let a bypassable
      # rule through — it could see that a rule existed, not that it fired.
      #
      # backend/cli installs the chart into the same kind of API server, for every
      # profile dcctl renders, and drives Helm upgrades through it: a duplicate
      # list-map key, and every other pod-spec rule the API server enforces, is
      # invisible to a render, because a duplicate is valid YAML. A repeated
      # topology spread pair made every --ha install fail at Helm while every
      # render test passed.
      #
      # Only the modules that have such a suite pay for it. The working directory
      # is backend/k8s for both, literally: the Makefile that holds the version,
      # and `make envtest`, live there, so both modules exercise one API server
      # version.
      # The asset tarball comes from a GitHub release, which has had outages (504). The
      # directory is cached by version + OS and the download is retried; the kube-apiserver/etcd
      # check below runs AFTER the restore, so a stale or partial cache fails the step rather
      # than passing silently (setup-envtest also re-verifies the archive checksum on use).
      - name: Read the envtest version
        id: envtest-version
        if: matrix.entry.module == 'backend/k8s' || matrix.entry.module == 'backend/cli'
        working-directory: backend/k8s
        run: |
          version="$(sed -n 's/^ENVTEST_K8S_VERSION[[:space:]]*=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the envtest assets
        if: matrix.entry.module == 'backend/k8s' || matrix.entry.module == 'backend/cli'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dc-envtest
          key: envtest-${{ runner.os }}-${{ runner.arch }}-${{ steps.envtest-version.outputs.version }}

      - name: envtest binaries
        if: matrix.entry.module == 'backend/k8s' || matrix.entry.module == 'backend/cli'
        working-directory: backend/k8s
        run: |
          set -euo pipefail
          # The version comes from the Makefile, which is where `make test` reads it
          # too. Repeating it here would be two numbers that must agree, and the way
          # that fails is the local run and CI silently exercising different API
          # servers.
          version="$(sed -n 's/^ENVTEST_K8S_VERSION[[:space:]]*=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::could not read ENVTEST_K8S_VERSION from backend/k8s/Makefile"
            exit 1
          fi
          make envtest
          assets="$(../../hack/ci-retry.sh bin/setup-envtest use "$version" --bin-dir "$HOME/.cache/dc-envtest" -p path)"
          if [ ! -x "$assets/kube-apiserver" ] || [ ! -x "$assets/etcd" ]; then
            echo "::error::setup-envtest reported $assets but it holds no kube-apiserver/etcd; the API-server suites would fail for the wrong reason"
            exit 1
          fi
          echo "envtest $version at $assets"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"

      # 🔴 THE GENERATED CRD MUST MATCH THE SOURCE IT IS GENERATED FROM, and until
      # this step existed nothing checked it. That gap is not theoretical: the
      # committed CRD and the kubebuilder marker it comes from had already drifted
      # apart. A CEL rule's empty-string literals in the Go marker had been
      # corrupted into Unicode smart quotes, the YAML had been repaired by hand,
      # and the two disagreed silently — so the next person to run `make manifests`
      # would have regenerated a CRD carrying a CEL syntax error, which the API
      # server refuses outright. A bootstrap would have failed at the step that
      # installs the CRDs, several layers away from the comment that caused it.
      #
      # Committing generated output and never checking it is the same shape as a
      # gate that cannot fail: the artifact looks authoritative precisely because
      # nothing is comparing it to its source.
      - name: generated manifests are up to date
        if: matrix.entry.module == 'backend/k8s' && matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        run: |
          set -euo pipefail
          make manifests generate
          # Only the GENERATED artifacts are compared. `api/` also holds the
          # hand-written types, and including the whole directory would let an
          # ordinary source edit report itself as generated drift — a gate that
          # cries wolf is one somebody eventually stops reading.
          #
          # 🔴 `git status --porcelain`, not `git diff`. A plain diff compares
          # against the index and therefore says nothing about UNTRACKED files, so
          # a brand-new CRD for a brand-new kind — the case where forgetting to
          # commit generated output is most likely — would sail through a gate that
          # exists to catch exactly that. Porcelain reports both modified and
          # untracked paths.
          drift="$(git status --porcelain -- config/crd/bases config/rbac 'api/**/zz_generated*')"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::the committed CRDs/RBAC/deepcopy do not match what the source generates; run 'make manifests generate' in backend/k8s and commit the result"
            exit 1
          fi

      # The workspace sum must already contain every hash this module's build
      # needs. It is checked HERE, right after the build, because the build is
      # what reveals the gap: a `go` command in workspace mode silently APPENDS
      # missing hashes to go.work.sum rather than failing, so an incomplete file
      # looks fine everywhere until something refuses to run on a dirty tree.
      #
      # 🔴 THAT SOMETHING IS THE RELEASE. goreleaser aborts with "git is in a
      # dirty state" before it publishes anything, and the release job builds a
      # verification binary before it gets there — so an incomplete go.work.sum
      # is invisible on every PR and then kills the release. It did exactly that
      # on v0.12.1-rc.1, after a Dependabot bump regenerated the per-module
      # go.sum files it can reach and left the workspace sum, which it cannot,
      # nine hashes short.
      #
      # Per module rather than once, deliberately: each module needs its own
      # subset of hashes, and this way the failure names the module that wants
      # the missing one. It prints the hashes the build added; commit them.
      #
      # The check is hack/check-go-work-sum.sh, which the local sweep in
      # CLAUDE.md runs too, so the gate a maintainer runs before pushing and
      # the gate that runs here cannot drift apart.
      - name: workspace sum is complete
        if: matrix.entry.static
        run: hack/check-go-work-sum.sh --module "${{ matrix.entry.module }}"

      # Build-tagged tests are invisible to every step above: `go build`, `go vet` and
      # `go test` all skip a file whose tags are not set, so a tagged suite compiles
      # against nothing and rots silently — its first sign of trouble is the day someone
      # needs it and it no longer builds. The `integration` suite (event-management's
      # real-TimescaleDB write-path tests) and the `interop` suite (Leshan) both live
      # behind tags for good reasons: they need a server this job does not have.
      #
      # Vetting them RUNS nothing and needs no server; it only keeps them compiling
      # against the code they test. That is the cheap half of the guarantee, and it is
      # the half that actually decays. Running them is a separate, deliberate job.
      - name: go vet (build-tagged suites)
        if: matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        run: go vet -tags "integration interop" ./...

      # dcctl ships for Windows, and its tests must at least COMPILE there: a test-only
      # dependency that does not build on Windows takes every test in its package down
      # with it, platform-neutral ones included, and no Linux step can see that
      # (controller-runtime's envtest did exactly this to backend/cli/bootstrap). vet
      # type-checks every package and its tests for GOOS=windows, compiling their
      # dependencies, and links and runs nothing, so it needs no Windows runner. It
      # carries the same tags as the step above so a tagged suite is covered too, and
      # it also catches a non-test Windows break on a PR rather than at the release build.
      # backend/k8s is not here: the operator is built only for Linux. Its controllers
      # test package imports envtest and so does not build on Windows either, two
      # platform-neutral tests in it included.
      - name: go vet (windows)
        if: matrix.entry.module == 'backend/cli' && matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        env:
          GOOS: windows
        run: go vet -tags "integration interop" ./...

      # Known-vulnerability scan of this module's dependency graph. It lives here,
      # in the go matrix, rather than in a workflow of its own because govulncheck
      # has to run INSIDE a module (same constraint as every other Go gate here) and
      # this job already provides a warm per-module build cache. Measured on a warm
      # cache: 3.4s for core, 4.7s for outbound-connectors, which was then the slowest
      # module here (it has since shed its largest dependency tree).
      #
      # 🔑 A GREEN RUN DOES NOT MEAN "no vulnerable dependencies". It means nothing
      # REACHABLE — govulncheck resolves advisories down to the call graph, and a
      # vulnerability in a module we require but never call is reported and does not
      # fail. That is deliberate: core requires x/crypto@v0.54.0 carrying
      # GO-2026-5932 with "Fixed in: N/A", so failing on require-but-do-not-call
      # would paint the whole tree permanently red over a package nobody can
      # upgrade away from.
      #
      # The wrapper exists for the one module where that advisory IS reachable —
      # backend/cli, via helm's package-init chain — and it carries a reviewed,
      # justified, per-module exception that FAILS ONCE IT GOES STALE. The full
      # reasoning, and the JSON-mode exit-code trap that shapes the script, are in
      # hack/govulncheck.sh. Note the deliberate absence of continue-on-error.
      #
      # The vulnerability DB is fetched at run time, so this step can start failing
      # with no change to this repo. That is the point of it — a newly published
      # advisory against a dependency we already ship is exactly the news we want.
      #
      # COVERAGE, stated rather than left to be inferred from a green run: this rides
      # the discover matrix, which is now derived from go.work, so every workspace
      # module is scanned — including `deploy`, which the previous directory glob
      # missed entirely.
      #
      # 🔴 SCANNING `deploy` BUYS NOTHING ON THE VULNERABILITY SIDE, AND SAYING SO IS
      # THE POINT. Its go.mod requires nothing, so govulncheck has no dependency graph
      # to resolve and its green result is vacuous by construction — it is not evidence
      # that the module is clean, only that there was nothing to be dirty. What adding
      # deploy to the matrix genuinely buys is build, vet and test coverage. Do not
      # read this step's green on that module as scanning coverage that was gained.
      - name: govulncheck (reachable vulnerabilities)
        if: matrix.entry.static
        run: hack/govulncheck.sh "${{ matrix.entry.module }}"

      - name: go test
        if: ${{ !matrix.entry.batch }}
        working-directory: ${{ matrix.entry.module }}
        env:
          # The bootstrap snapshot-currency test fails instead of skipping when the
          # release tags are missing: the checkout above fetches them for exactly it.
          DC_REQUIRE_TAGS: "1"
        # Every package, the operator's controllers included. That package holds
        # the CEL suite the `envtest binaries` step installs an API server for, and
        # it used to be dropped here as "a scaffold that asserts nothing" — so the
        # suite guarding which cluster `dcctl destroy` acts on was installed for and
        # never run. Nothing is excluded now, which also leaves the race step and
        # this one testing the same packages without a list for them to agree on.
        #
        # -count=1 disables TEST-RESULT caching, and it is load-bearing here rather
        # than a habit. `go test` decides a cached result is still valid from the
        # module's own sources, and it does NOT track files outside the module at
        # all — not their contents, not their directory listings. Several gates read
        # exactly such files: the sim's golden dashboard fixtures and /dash paste
        # samples both live under frontend/testdata. Measured, not assumed: with a
        # cached pass in place, breaking a sample and re-running printed
        # "ok (cached)" over the broken tree, and only -count=1 failed.
        #
        # The setup-go cache above restores GOCACHE, so those stale results survive
        # into CI — a PR touching only a fixture is precisely the shape that would
        # replay someone else's green. This disables result caching only; the BUILD
        # cache (the expensive part) is untouched.
        #
        # -timeout 20m, the figure the race step started from, because go's own default is 10 minutes
        # PER PACKAGE and backend/core's messaging package runs real-time broker
        # failure scenarios (a connection frozen until its pings go unanswered, among
        # others) that already take about 8 minutes locally. Under the default, a
        # slower runner would fail it as a panic in whichever test was running, which
        # reads as that test hanging rather than the package being long.
        #
        # 🔴 A SKIP IS NOT A PASS. The run streams `go test -json` into
        # hack/check-no-silent-skips.sh, which fails the leg on any skipped test or
        # subtest not listed, with a reason, in hack/silent-skip-allowlist.txt. The log
        # still shows the plain test output. Both verdicts are taken: a test failure
        # wins, and a clean run with an unreviewed skip is red too.
        shell: bash
        run: bash "$GITHUB_WORKSPACE/hack/go-ci-test.sh" "${{ matrix.entry.module }}" "$RUNNER_TEMP/leg-args" "$RUNNER_TEMP"

      # The payload decoder's timing gates, alone: the perf gate (decode against Cut A's
      # flatten, paired in one process) and the ns-per-declared-cost checks. They are timing
      # comparisons, so it is skipped in the shared run
      # above, where 40 other packages compete for the CPU, and run here with nothing else
      # going (-p 1, after the suite). DECODE_PERF_GATE=1 is what turns it on; without it the
      # tests skip, and this step is the only place they run.
      - name: payload decoder perf gate
        if: matrix.entry.module == 'backend/core' && matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        env:
          DECODE_PERF_GATE: "1"
        run: go test -count=1 -p 1 -run '^(TestPerfGate|TestPerfGateGoesRed|TestNativeCostsMatchMeasuredTime|TestFixedCostNativesDoNotScaleWithTheFrame|TestNativeCostChecksFlagUnderDeclaration|TestCostTrackerOverhead)' -v ./payloaddecode/

      # The docs-command gate (backend/cli/cmd/docs_commands_test.go) already ran in the
      # step above: every `dcctl` invocation in a shell block of the published docs, in
      # every locale, must name a real command with flags it accepts and the arguments it
      # takes, and every hack/ path in one must exist. It runs again here with -v for one
      # reason: to PRINT what it did not check. A passing test's log is hidden, and a gate
      # whose silence reads as coverage is the failure this repo has shipped before — so
      # the count of skipped templates and of the shell commands no rule covers (kubectl,
      # curl, helm, ...) is on the page of every run, not implied by a green tick.
      - name: docs commands exist (coverage report)
        if: matrix.entry.module == 'backend/cli' && (matrix.entry.static || contains(matrix.entry.pkgs, './cmd/'))
        working-directory: ${{ matrix.entry.module }}
        run: go test -count=1 -run '^TestPublishedDocsCommandsExist$' -v ./cmd/

      # event-processing's broker suites a second time, with fetch-ahead ON. A hand-built
      # test configuration fetches one batch at a time, so the step above runs them with
      # fetch-ahead OFF, while production loads its configuration through ApplyDefaults
      # and runs with it ON at batch 128. DC_TEST_FETCH_AHEAD=1 (shared_broker_test.go)
      # builds every broker test's readers the way production does, so the live-gap and
      # integration suites run once with each setting. Only the processor package builds
      # a detect broker; the rest of the module does not read the switch.
      - name: go test (event-processing, fetch-ahead on)
        if: matrix.entry.module == 'backend/services/event-processing' && matrix.entry.static
        working-directory: ${{ matrix.entry.module }}
        env:
          DC_TEST_FETCH_AHEAD: "1"
        run: go test -count=1 -timeout 20m ./processor/

      # Data-race detection, on every module except the exempt ones.
      #
      # 🔴 THE STEP IS UNCONDITIONAL AND THE VERDICT IS A LINE IN THE LOG. An
      # `if:` here would skip on the exempt entries, and a skipped step and a
      # passing step render as the same green tick — so "this module was race
      # checked" and "this module was never race checked" would be
      # indistinguishable from the outside. Instead every entry runs the script
      # and every entry prints one of:
      #
      #   race: COVERED backend/core -- go test -race -count=1 -timeout 30m ./...
      #   race: NOT COVERED <module> -- exempt (hack/go-race.sh): <reason>
      #
      # and the step then requires that line to be present. A future edit that
      # leaves this returning 0 without deciding anything fails here rather than
      # passing quietly. The authoritative covered set is printed as a table by
      # `hack/go-race.sh --list` in `discover`; the exempt set, and the reason for
      # each entry, live in hack/go-race.sh.
      #
      # The detector's own liveness is established in `discover` by
      # `hack/go-race.sh --self-test`, which requires a DATA RACE report from a
      # program with a known race. Without that, a green step here would be
      # equally consistent with the instrumentation being off.
      #
      # 🔴 ON A PULL REQUEST THE SCOPE IS NARROWED (the maintainer's call, accepted with its
      # tradeoff). hack/ci-select.py plans each leg's `race_scope`: `all` (every event but a pull
      # request, and any doubt), `changed` (only `race_pkgs`: the leg's packages holding a changed
      # file, plus the packages directly importing one) or `none`. They print PARTIAL and SKIPPED
      # rather than COVERED, and the check below refuses either on any other event: a race the
      # narrowed scope does not reach surfaces on main's full run, which must therefore stay full.
      # The plain `go test` step above is NOT narrowed; it still runs every package of the leg.
      - name: race detector
        if: ${{ !matrix.entry.batch }}
        env:
          MODULE: ${{ matrix.entry.module }}
          DC_RACE_SCOPE: ${{ matrix.entry.race_scope }}
          RACE_PKGS: ${{ matrix.entry.race_pkgs }}
        run: bash hack/go-ci-race.sh "$MODULE" "$RUNNER_TEMP/leg-args" "$RUNNER_TEMP"

      # 🔴 THE WORKSPACE HIDES AN UNTIDY go.mod. Every other step here resolves
      # through go.work, where a module's own requirements are not what gets built,
      # so a go.mod missing a requirement, still listing one the code dropped,
      # marking a direct import `// indirect`, or left behind by a core bump that
      # Dependabot applied elsewhere builds, vets and tests green. This resolves the module
      # alone with `GOWORK=off go mod tidy -diff` and prints the diff and the fix:
      # `(cd <module> && GOWORK=off go mod tidy)`. hack/check-go-mod-tidy.sh is the
      # same script the local sweep runs; its --self-test runs in `discover`.
      #
      # LAST, and on `!cancelled()` rather than on success, on purpose: an untidy
      # module still gets its build, vet, test and race results, which a Dependabot
      # PR needs, and when an earlier step failed BECAUSE the go.mod is stale this
      # still runs and names the cause.
      #
      # COST, measured rather than assumed: tidy loads every OS and build tag, so it
      # needs modules the build never fetched (locally, about 0.6 GB for core and 0.3 GB
      # for k8s on top of the build's, ~15 s). The per-module cache key above hashes the
      # module's go.mod and go.sum and is write-once, so a cache entry saved before this
      # step existed lacks them and they are fetched again on each run — but only until
      # that module's key next changes (any go.mod/go.sum edit, e.g. every Dependabot
      # bump). setup-go saves the module cache on a key miss after the job succeeds, i.e.
      # after this step, so the next entry includes them. Entries therefore grow as keys
      # roll over; against a cache already at its quota that growth is ACCEPTED (it can
      # evict older warm entries), not avoided. A proxy outage fails this step as a
      # refusal (exit 2), never as "tidy".
      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() && matrix.entry.static }}
        run: hack/check-go-mod-tidy.sh --module "${{ matrix.entry.module }}"

      # The one writer of this leg's cache group (see the restore step): its saver module's static
      # leg, on a push to main, after every step above succeeded, and only when the exact key was
      # not already there (a key is write-once). A pull request never reaches this step.
      - name: Save the Go build cache
        if: success() && matrix.entry.cache_save && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # NOTE: a golangci-lint job is intentionally omitted for now — no golangci-lint
  # release yet supports Go 1.26 (it refuses: "the Go language version used to
  # build golangci-lint is lower than the targeted Go version"). gofmt + go vet
  # in the `go` job are the Go gates; re-add golangci-lint once a 1.26-compatible
  # release ships.

  # ---------------------------------------------------------------------------
  # Subscribe confirmation: a subscription the broker has never confirmed, and an
  # MQTT SUBACK whose result is never read.
  #
  # Both defects are silent by construction. Core NATS DROPS a publish with no
  # subscriber, so a component that subscribes, reports itself started, and is
  # handed nothing looks healthy from every side — the auth callout shipped that
  # way and refused real devices with a bare EOF. paho, meanwhile, never turns a
  # broker's REFUSAL into an error, so `token.Error()` is nil on a 0x80 and the
  # obvious spelling of "did my subscribe work" always says yes.
  #
  # 🔴 The guard is a go/analysis pass rather than a grep, and that is the point
  # of it. `.Subscribe(` matches four unrelated APIs in this repo and only two of
  # them are broken; the first inventory of the sites was done textually and was
  # wrong in both directions. The receiver's TYPE is the only thing that separates
  # them. See backend/tools/subconfirm/analyzer for what satisfies the check and
  # how a deliberate exemption is written.
  # ---------------------------------------------------------------------------
  subscriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      # Proves the checker can still fail, BEFORE its green run is read as
      # evidence. It plants a bare subscribe in a package inside backend/core, so
      # the analyzer is exercised against the REAL nats.go and paho rather than
      # against a stub that would only prove it agrees with the stub — and then
      # plants the same code written correctly, because "reports a bad subscribe"
      # is also satisfied by a checker that reports everything.
      #
      # The analyzer's own unit tests are not repeated here: backend/tools/subconfirm
      # is a workspace module, so the `go` matrix above already runs them.
      - name: subscribe-confirmation self-test
        run: hack/check-subscribe-confirmed.sh --self-test

      - name: every subscription is confirmed
        run: hack/check-subscribe-confirmed.sh

  # ---------------------------------------------------------------------------
  # HTTP routing and lifecycle phase: two properties of the whole tree that no single
  # call site shows, both about an HTTP surface that compiles and then is not there.
  #
  # Part one: nothing may register on net/http's package-global mux.
  #
  # 🔴 Every HTTP server here serves an EXPLICIT Handler — the mux its Microservice
  # owns — which makes http.DefaultServeMux a mux NOTHING SERVES. A registration on
  # it compiles, runs and returns; the route is simply absent, with no error and no
  # log line, and the endpoint answers 404. The one that matters most is
  # /auth/jwks: every peer fetches it to validate tokens, so losing it takes the
  # whole instance out of its Service endpoints while presenting as an auth fault.
  #
  # The guard parses rather than greps because a grep of this rule was written first
  # and defeated three ways that all compile — an alias through a variable, a call
  # split across lines, and a helper one directory outside the scanned subtree. What
  # it still cannot see is written in the script.
  #
  # Part two: nothing may be constructed in the wrong lifecycle phase.
  #
  # 🔴 core.LifecycleManager's state allow lists make ExecuteInitialize run AT MOST
  # ONCE per component instance and ExecuteStart run again after every stop. So an
  # http.Server, which cannot be restarted, must be built per start; while a mux
  # route and a Prometheus collector, which both PANIC on a duplicate, must be built
  # once. Either in the wrong phase breaks the SECOND start of a service whose first
  # start looked perfect.
  #
  # It follows a type-checked CALL GRAPH from the framework's own entry points rather
  # than matching names, because the phase a function runs in is a property of its
  # CALLER: this tree already contains a createNatsComponents that runs on start, an
  # initializer callback that is an anonymous closure, and a component reached only
  # through interface dispatch.
  # ---------------------------------------------------------------------------
  http-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      # Proves the checker can still fail BEFORE its green run is read as evidence.
      # It plants seven distinct evasion shapes, requires each to be caught AND
      # named with a file and line, requires the correct replacement shape to pass,
      # and requires an empty tree to be REFUSED rather than reported clean.
      - name: default-mux guard self-test
        run: hack/check-default-servemux.sh --self-test

      - name: nothing registers on http.DefaultServeMux
        run: hack/check-default-servemux.sh

      # Not a routing rule, but the same kind of check — a parsed, tree-wide property of
      # the request path — so it shares this job's Go setup. Every password and
      # client-secret compare must go through backend/core/credential, which applies the
      # kind's policy (a per-account backoff for passwords) and the unknown-principal
      # timing equalizer; a bcrypt, subtle.ConstantTimeCompare or hmac.Equal compare
      # anywhere else escapes both unless a member-scoped exemption states why it is not a
      # guessable check (the real run prints every exemption with its reason). The
      # self-test plants evasion shapes (import alias, line split, function-value alias,
      # dot-import, lookalike directories, a compare of another member inside an exempted
      # function, a same-named method, a stale exemption, ...) and requires each to be
      # named by file and line, requires legitimate arrangements to pass, and requires the
      # inputs it cannot use (an empty tree, a duplicate or malformed exemption) to exit 2.
      # It prints its own counts.
      - name: credential-compare guard self-test
        run: hack/check-credential-compare.sh --self-test

      - name: no bcrypt compare outside the credential primitive
        run: hack/check-credential-compare.sh

      - name: Mojibake guard self-test
        run: hack/check-mojibake.sh --self-test

      - name: No mojibake in tracked text files
        run: hack/check-mojibake.sh

      # Two red lines on what an AI agent can be made to do, enforced as parsed, tree-wide
      # properties. Declarative-only: no tenant code runtime (a script interpreter or a
      # WebAssembly runtime) may appear in any go.mod, go.sum, go.work or Go import, and the
      # allowance list is empty. Constant remediation: the text an error gives an agent is a
      # string literal or a constant, never formatted from runtime data. The self-test
      # plants a goja import, requirement, replace target and checksum line, the other
      # runtimes, and a Sprintf, a concatenation and a variable in a remediation, and requires
      # each to be named by file and line; it also requires clean shapes to pass and unusable
      # inputs (an empty tree, a file that does not parse) to exit 2.
      - name: red-lines guard self-test
        run: hack/check-redlines.sh --self-test

      - name: no tenant code runtime, constant agent remediation text
        run: hack/check-redlines.sh

      # Proves this checker can fail too, and does it BEFORE the green run below is
      # read as evidence. It plants 21 evasion shapes across all three phase rules —
      # each one a module that really type-checks against a miniature framework of
      # its own — requires every one to be caught AND named with a file and line,
      # requires five legitimate arrangements to pass untouched (including the prose
      # about the watched constructors, which is what defeats a grep), and requires
      # five instrument failures to exit 2 rather than 0 or 1.
      - name: lifecycle-phase guard self-test
        run: hack/check-lifecycle-phase.sh --self-test

      - name: nothing is constructed in the wrong lifecycle phase
        run: hack/check-lifecycle-phase.sh

  # ---------------------------------------------------------------------------
  # Data access: the query shapes that are unsafe in a way no call site shows.
  #
  # gorm's inline-condition form, `db.Find(&out, ids)`, DROPS an empty slice
  # instead of rendering a predicate that matches nothing — so it silently
  # degrades into an unfiltered, unpaginated SELECT. `xById(ids: [])` is a legal
  # GraphQL document, so that is reachable from the public API, and twenty-one
  # lookups across two services carried it at once.
  #
  # This is a job rather than a step inside `go` because every check here is a
  # property of the TREE, not of a module: the `go` matrix would run each of them
  # once per module and still only ever look at the whole repo.
  #
  # It sets up Go because two of the guards below are analyzers that PARSE the
  # tree rather than grep it — backend/tools/rdbguard, built from source on every
  # run so the gate cannot drift from the analyzer it runs.
  # ---------------------------------------------------------------------------
  data-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      # Self-test first, as with every guard here — this one is a grep, and a grep
      # whose pattern or path has drifted reports a clean tree it never read. It
      # also exercises the EXEMPTION list in both directions, which is the part
      # most likely to quietly swallow the repo.
      - name: inline-id-condition guard self-test
        run: hack/check-inline-id-conditions.sh --self-test

      - name: no inline id conditions outside rdb.FindByIds
        run: hack/check-inline-id-conditions.sh

      - name: rejection-code label guard self-test
        run: hack/check-rejection-code-labels.sh --self-test

      - name: every declared rejection code is allowed in a metric label
        # `batch_refusals_total` carries a `code` label, so the codes that may
        # reach it are an allowlist rather than whatever a caller sends — a label
        # fed from an open vocabulary is the unbounded-cardinality vector the
        # no-tenant-label rule exists to prevent.
        #
        # The failure this catches is silent in the direction that matters: a new
        # rejection code that nobody allowlists still WORKS, it just folds into
        # "other", so the panel that answers WHY fleet writes are being refused
        # quietly stops naming it. Nothing goes red at runtime.
        run: hack/check-rejection-code-labels.sh

      - name: partial-update guard wiring self-test
        run: hack/check-partial-update-guards.sh --self-test

      - name: every update* surface wires both partial-update guards
        # Two per-service Go guards protect the three-state update semantic
        # (omitted leaves a field alone, explicit null clears, a value sets):
        # one reflects over a service's Api, the other walks its served schema
        # for SDL defaults — a default makes every update OMITTING that field
        # write it, and is only reachable once an input has been converted.
        #
        # Neither can see a module that calls neither of them. A service added
        # with an `updateThing` mutation and no partial-update test has a fully
        # green suite and no coverage at all, and the observation that would
        # catch it is about a module's ABSENCE — so it is asked of the tree here
        # rather than from inside any module.
        run: hack/check-partial-update-guards.sh

      # Proves the checker can still fail BEFORE its green run is read as evidence.
      # Eleven evasion shapes, each planted alone and each required to be caught AND
      # named with a file and line; the sanctioned pattern and the four migrations'
      # COMMENTS about it required to pass; an empty tree and a stale allow-list
      # required to be refused rather than reported clean.
      - name: index-helper caller guard self-test
        run: hack/check-index-helper-callers.sh --self-test

      - name: no non-test caller of core/rdb's index helpers
        # An index NAME and its WHERE predicate are schema. Two of the three helpers
        # are documented in their own source as test fixtures with no non-test
        # callers; the third has exactly one, inside core's own secrets migration.
        # A migration that sources either from another module is silently rewritten
        # when that module changes: fresh installs start building a different index
        # while every existing database keeps the shape it was given, from a diff
        # that touched neither the migration nor the service nor their module — and
        # both then report a clean migration and hold different schemas.
        #
        # Until now that arrangement was comment-only. This is a parser rather than
        # a grep for a concrete reason: four service migrations explain in PROSE
        # that their own copy of the helper is deliberate, and a text scan reports
        # every one of those.
        run: hack/check-index-helper-callers.sh

      # Ten shapes, each planted alone and each required to be caught and located;
      # the scoped replacement and a comment quoting gorm's own error text — which
      # contains db.Table("users") — required to pass; an empty tree refused.
      - name: bare-table guard self-test
        run: hack/check-bare-table-statements.sh --self-test

      - name: no statement names its table as a string
        # A statement that names its table as a string is not tenant-scoped. Either
        # it carries no parseable schema, which the tenant-scope callback refuses
        # outright, or it parses into a shape with no TenantId — a projection
        # struct, or a Model()/Table() mismatch — which classifies as NOT
        # tenant-scoped, injects no predicate, and returns every tenant's rows with
        # a nil error. The second has no failure mode at the call site at all.
        #
        # The refusal shipped with a safety argument resting on an enumeration:
        # `.Table(` had zero non-test occurrences, so nothing legitimate was being
        # refused. Nothing kept that true, and the natural way to spell a bulk
        # update is the way that reaches it. This turns the snapshot into a check.
        run: hack/check-bare-table-statements.sh

      # Seven shapes (a Raw and an Exec over a tenant-scoped table, a quoted and
      # schema-qualified name, three forms of SQL that cannot be read statically, a
      # split chain) each planted alone and required to be caught and located; five
      # legitimate forms required to pass; a stale allow-list and an empty tree
      # refused. The allow-list mechanics run as Go tests against injected lists.
      - name: raw-sql guard self-test
        run: hack/check-raw-sql-statements.sh --self-test

      - name: raw SQL over a tenant-scoped table is allow-listed with a reason
        # The tenant-scope callback injects its predicate into statements it builds.
        # A Raw statement is finished SQL and an Exec runs with no callbacks, so
        # whether one is tenant-safe is a property of its text. This keeps every
        # such statement over a tenant-scoped table either gone or listed beside the
        # reason it is safe, and refuses an entry that no longer matches anything.
        # Defence in depth beside the callback, not a replacement for review.
        run: hack/check-raw-sql-statements.sh

      # Seven shapes (no tenant equality, a left join, the equality on the wrong table,
      # an association join, a dynamic join string, a second join in one string, a split
      # chain) each planted alone and required to be caught and located; four joins
      # that carry the equality or join an unscoped table required to pass; a stale
      # allow-list and an empty tree refused.
      - name: raw-join guard self-test
        run: hack/check-raw-joins.sh --self-test

      - name: tenant-scoped joins carry a tenant equality or are allow-listed
        # The callback filters the outer table of a statement; a joined table is
        # filtered by nothing. Each join over a tenant-scoped table either equates
        # the tenant columns in its ON clause or sits in the allow-list with the
        # reason its foreign key cannot cross tenants.
        run: hack/check-raw-joins.sh

  # ---------------------------------------------------------------------------
  # Migrations: prove every area's chain still reproduces its golden schema.
  #
  # THIS IS THE ONLY THING THAT CHECKS THE MIGRATIONS AT ALL. The unit tests build
  # their schema by AutoMigrating the LIVE structs on SQLite; nothing but main.go
  # and this harness ever runs a gormigrate chain, and nothing but this runs it
  # against real Postgres + Timescale. A migration can therefore be broken, or
  # silently changed, with every other gate green.
  #
  # What it catches that review cannot: a migration is supposed to be frozen in
  # time, but it is written in Go, so anything it REFERENCES can move underneath
  # it — and the diff that moves it need not touch the migration, the service, or
  # even the module. A core/rdb mixin embedded in a migration's snapshot struct is
  # the live example (~111 of them across the areas today). Gorm's own conventions
  # are another: adding a TableName() to a model that lacked one silently renames
  # its indexes, because core/rdb pins the NamingStrategy TablePrefix and that
  # prefix applies only to DERIVED names. That one was found by this harness, on a
  # change that looked like pure cleanup and passed every other gate.
  #
  # If it fails: either the change was unintended — fix it — or the schema really
  # did change, in which case re-snapshot the goldens IN THE SAME PR
  # (hack/migration-diff.sh snapshot) so the diff shows a human what moved.
  # ---------------------------------------------------------------------------
  #
  # 🔴 SKIPPED ON A PULL REQUEST THAT CANNOT REACH THEM, and only then. Both migrations jobs run
  # hack/migration-diff.sh verify, which compiles three Go roots (migrationdiff, core ./rdb/...,
  # cli ./bootstrap) and builds the operand image. discover's `migrations` output is false only
  # when no changed file reaches a package those roots compile, nor deploy/images/timescaledb
  # (hack/ci-select.py MIGRATION_ROOTS). Anything that runs everything — push, a go.mod, hack/,
  # .github/, an unknown path, a selection error — runs them. ci-complete accepts the skip only
  # when discover succeeded and said false. The first step below re-derives the package set with
  # `go list` and fails if the selection's own graph has stopped covering it.
  migrations:
    needs: discover
    if: needs.discover.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      # The skip rule above is only as good as the import graph it reads, which hack/ci-select.py
      # parses from source so discover can decide without a toolchain download. This asks the go
      # command which workspace packages the roots really compile, and fails if any is missing
      # from the graph: a missed edge would otherwise skip these jobs for a change that reaches them.
      - name: the selection watches every package these jobs compile
        run: python3 hack/ci-select.py migration-deps

      # Proves the duplicate-index check can fail, BEFORE its green run is used as
      # evidence of anything. Plants a duplicate in a copy of the goldens and
      # requires detection, then requires the clean goldens to still pass.
      - name: duplicate-index check self-test
        run: hack/check-duplicate-indexes.sh --self-test

      # Reads the goldens only — no container, no Postgres — so it is cheap and
      # runs before the two verify passes below. It asserts no area declares two
      # indexes over an identical key, which is a property of the EMITTED schema
      # rather than of the code style that produced it: the defect it was written
      # for (two snapshot structs describing one table, one pinning TableName) is
      # only one of the ways indexes can collide.
      - name: no duplicate indexes in any golden schema
        run: hack/check-duplicate-indexes.sh

      # Runs the production rdb.RdbManager path against a throwaway TimescaleDB
      # the script starts in docker (present on ubuntu-latest), then diffs each
      # area's pg_dump against backend/tools/migrationdiff/golden/.
      - name: migration-diff verify (PostgreSQL 16, the image the goldens came from)
        run: hack/migration-diff.sh verify

      # The SAME goldens, on the PostgreSQL 17 operand image the `tsdb` cluster
      # actually runs (ADR-020 A2.4). The pass above is NOT the deployed image —
      # it is the one the goldens were captured on, and it stays because the
      # goldens are version-sensitive. Measured, not assumed: the two
      # schemas are byte-identical today, which is why this can be `verify`
      # against the committed goldens rather than a separate golden set.
      #
      # It runs on EVERY pull request rather than only when the image directory
      # changes, and that is the whole point — the failure this catches is a new
      # migration that is fine on 16 and broken on 17, which lives in
      # backend/services/**, nowhere near deploy/images/. Catching it at the
      # cutover instead would mean discovering it as a pile of unrelated PRs to
      # unpick.
      # Retried with backoff, matching the image-smoke job below. This build
      # reaches ghcr (the CNPG base), deb.debian.org and packagecloud.io, which
      # puts three third-party hosts on the critical path of EVERY pull request
      # in the monorepo — a packagecloud 5xx would otherwise red-line a PR that
      # has nothing to do with any of them. The same failure class took out all
      # 12 image-smoke jobs on 2026-07-16, which is why that job already does
      # this. A real build failure still fails all three attempts.
      - name: Build the PostgreSQL 17 operand image
        run: |
          for attempt in 1 2 3; do
            if deploy/images/timescaledb/build.sh operand:ci; then
              exit 0
            fi
            echo "::warning::operand image build attempt ${attempt}/3 failed (likely a transient registry/apt blip); retrying..." >&2
            sleep $((attempt * 15))
          done
          echo "::error::operand image build failed after 3 attempts" >&2
          exit 1

      - name: migration-diff verify (PostgreSQL 17 operand image)
        env:
          MDIFF_IMAGE: operand:ci
          MDIFF_LAUNCH: operand
          MDIFF_CONTAINER: dc-mdiff-operand
        run: hack/migration-diff.sh verify

  # ---------------------------------------------------------------------------
  # The SAME verify (goldens, coverage, replay, the integration suites it runs) on the
  # NEXT TimescaleDB, so an upstream catalog change is a red check here instead of a
  # failed start after the pin moves.
  #
  # Why it exists: TimescaleDB 2.29.0 removed _timescaledb_catalog.chunk's schema_name,
  # table_name and compressed_chunk_id. Three event-management migrations read them
  # to find compressed chunks to lock, so on 2.29+ the chain failed to plan (42703) on
  # every start — a fresh install included — while every job above stayed green,
  # because they all run the pinned 2.28.3. Nothing in the tree ran a newer server.
  #
  # Its own job, not a third step in `migrations`, so it adds runner minutes but no
  # wall-clock. Pinned by DIGEST like the others (latest-pg16 as of 2026-10-16:
  # TimescaleDB 2.30.2 / PostgreSQL 16.15), so it moves only when a PR moves it. When
  # the main pin catches up with this one, point this at the next release — or delete
  # it if there is none worth tracking yet; a forward-compat pass on the pinned image
  # checks nothing the `migrations` job does not.
  # ---------------------------------------------------------------------------
  migrations-timescaledb-next:
    name: migrations (TimescaleDB next)
    needs: discover
    if: needs.discover.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      - name: migration-diff verify (TimescaleDB 2.30.2, PostgreSQL 16)
        env:
          MDIFF_IMAGE: timescale/timescaledb:latest-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
          MDIFF_CONTAINER: dc-mdiff-next
        run: hack/migration-diff.sh verify

      # NOT run here yet: the services' integration suites (hack/integration-tests.sh).
      # On 2.30 two of event-management's plan-shape tests fail. 2.30 plans a device
      # read through a new DeferredChunkAppend node, whose EXPLAIN JSON repeats a
      # "Plan" key per chunk instead of using a "Plans" array, and in that plan the
      # chunks are walked by the primary key rather than the tenant-led device index.
      # That is a finding for the pin bump, not a catalog read. Add the step once it
      # is settled.

  # ---------------------------------------------------------------------------
  # License header check (backend only, per CLAUDE.md).
  # ---------------------------------------------------------------------------
  # The integration-tagged suites, RUN rather than merely compiled.
  #
  # 🔴 UNTIL THIS JOB EXISTED, CI ONLY EVER VETTED THEM. The `go` job runs
  # `go vet -tags "integration interop" ./...`, which type-checks a tagged test and never
  # executes it — so device-management's geofence TOCTOU test, event-management's hypertable
  # and compression tests, core/rdb's guest-connection tests and migrationdiff's purge drill
  # could all have been failing for months with no red mark anywhere. They exist precisely
  # because sqlite cannot answer the questions they ask: row locking under real concurrency,
  # chunks, columnar compression, a real catalog, a real second database.
  #
  # The critical path was one 51-minute job. Now each heavy module has its own leg and all
  # small modules share one leg, so the slowest leg sets the integration critical path.
  # The container, the module discovery and the per-module verdicts all live in the script, so
  # a maintainer runs exactly what CI runs — and a module that GAINS an integration test is
  # covered the day it does, with no list here to fall out of step with go.work.
  integration:
    name: integration (${{ matrix.leg.name }})
    needs: discover
    # The selected legs (all of them off a pull request). Skipped when none are selected, which
    # ci-complete accepts only alongside a successful discover that planned zero.
    if: needs.discover.outputs.integration != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJson(needs.discover.outputs.integration) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true

      # The fleet-operation foundation gate (device-management/model/fleet_operation_gate_test.go) needs
      # the release this build upgrades from, and a shallow clone has the tags but not their history, so
      # `git tag --merged HEAD` finds none. The newest stable tag that is not HEAD is the baseline.
      - name: Resolve the fleet-operation baseline tag
        run: echo "DC_BASELINE_TAG=$(hack/fleet-baseline-tag.sh)" >> "$GITHUB_ENV"

      # Restore-only: the go job's entry for the cache group of this leg's first module (see the
      # restore step there). Nothing here saves, so no integration leg competes for that key or
      # writes an entry of its own; the integration build differs from the go job's only by a tag.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        id: setup-go
        with:
          go-version-file: go.work
          cache: false

      - name: GOCACHE is where the cache step puts it
        run: test "$(go env GOCACHE)" = "$HOME/.cache/go-build" || { echo "::error::GOCACHE is $(go env GOCACHE), not ~/.cache/go-build; update the cache steps"; exit 1; }

      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-[${{ matrix.leg.cache_group }}]-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-[${{ matrix.leg.cache_group }}]-

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        run: hack/go-mod-download.sh --workspace

      - name: integration tests against a real PostgreSQL
        env:
          DC_IT_PLAN: ${{ needs.discover.outputs.integration_all }}
          LEG_MODULES: ${{ matrix.leg.modules }}
        run: hack/integration-tests.sh --modules "$LEG_MODULES"

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # The tool is fetched outside any module's graph, so it gets the retry wrapper's own
      # fetch (and its fallback off the proxy) rather than going bare. It is INSTALLED and the
      # binary run below, not `go run ...@latest` there: `@latest` is a version query that goes
      # back to the proxy on every invocation, cache or no cache, so a prefetch followed by a
      # `go run @latest` would still put one bare proxy request in the check step.
      - name: Install addlicense
        run: |
          GOWORK=off GOBIN="$RUNNER_TEMP/addlicense" hack/go-mod-download.sh --retry -- go install github.com/google/addlicense@latest
          echo "$RUNNER_TEMP/addlicense" >> "$GITHUB_PATH"

      - name: Check SPDX headers
        # Go + hand-authored GraphQL/proto sources + the C# SDK + the demos. YAML and
        # the operator Dockerfile are excluded: those manifests are controller-gen-
        # generated, so a header would drift away on every `make manifests`
        # regeneration. .NET project/build files are excluded (addlicense has no
        # header style for them); the .cs sources are checked. In the Unity demo
        # projects the C# and Python sources are checked, and everything the Editor
        # writes (meta files, serialized assets, scenes, project settings, the
        # package lock) is excluded: Unity rewrites those files whole, so a header
        # would not survive the next save.
        run: >
          addlicense -check
          -ignore '**/*.yaml' -ignore '**/Dockerfile'
          -ignore '**/*.csproj' -ignore '**/*.sln' -ignore '**/*.props'
          -ignore '**/bin/**' -ignore '**/obj/**'
          -ignore '**/migrationdiff/golden/*.sql'
          -ignore '**/migrationdiff/testdata/prev-release/**/*.sql'
          -ignore 'demos/**/*.meta' -ignore 'demos/**/*.asset' -ignore 'demos/**/*.unity'
          -ignore 'demos/**/*.prefab' -ignore 'demos/**/*.mat' -ignore 'demos/**/*.inputactions'
          -ignore 'demos/**/ProjectSettings/**' -ignore 'demos/**/Packages/packages-lock.json'
          -f hack/license-header.txt backend sdks demos examples

      # The step above proves every SOURCE FILE says Apache-2.0. Nothing proved that
      # the ECOSYSTEM agrees — GitHub runs its own detector over LICENSE and publishes
      # one value from it, and that value is what the `license:` search filter, the repo
      # sidebar and every downstream SBOM actually read. A LICENSE it cannot match
      # yields NOASSERTION: the project drops out of license search and records as
      # unlicensed, with the file sitting in the tree looking correct and no header
      # check anywhere going red. A comparable project in this space is in exactly that
      # state today. See hack/check-detected-license.sh for why this asks GitHub rather
      # than running a detector locally, and what that costs.
      #
      # Self-test first, as with every guard here. A network check whose only evidence
      # is "it was green today" has never been shown to fail, and this one's failure
      # modes are mostly ABSENCES — a 404, an outage, a rate-limit HTML body — each of
      # which reads exactly like a clean answer if the status is not checked apart from
      # the body.
      - name: detected-license guard self-test
        run: hack/check-detected-license.sh --self-test

      - name: GitHub still detects this repository as Apache-2.0
        env:
          # Read-only; the workflow's top-level `contents: read` is all the license
          # endpoint needs. Passed explicitly so the request is authenticated and rides
          # the per-repo rate limit rather than the shared anonymous one.
          GITHUB_TOKEN: ${{ github.token }}
        run: hack/check-detected-license.sh

  # ---------------------------------------------------------------------------
  # Workflow hygiene: the CI configuration is itself un-gated code.
  #
  # Nothing else in this repo validates .github/workflows. A typo in a `runs-on`
  # label, an expression referencing a context field that does not exist, or a
  # `${{ github.event.* }}` interpolated straight into a `run:` block (a script
  # INJECTION — attacker-controlled text executing as shell in our runner) all
  # ship silently and are discovered, at best, on the next run and, at worst,
  # never. actionlint catches all three statically.
  # ---------------------------------------------------------------------------
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Proves the pin guard can fail before its green run is used as evidence —
      # same reason the guards in `discover` self-test. This one covers the two
      # extraction traps that make a pin checker silently vacuous (a substring
      # match on `statuses: write`, and subpath actions like
      # github/codeql-action/upload-sarif being skipped by an owner/repo pattern).
      - name: action-pin guard self-test
        run: hack/check-action-pins.sh --self-test

      # A mutable `@v4` ref is code an outsider can change without a diff here.
      - name: Every action is pinned to a commit SHA
        run: hack/check-action-pins.sh

      # The loadtest gate's L3 negative control and positive test must drive
      # different tenants: the positive run's clean-tenant precheck would otherwise
      # count the negative run's tail. The self-test proves the check can fail.
      - name: loadtest L3 tenant guard self-test
        run: hack/check-loadtest-l3-tenants.sh --self-test
      - name: The L3 contention runs use separate tenants
        run: hack/check-loadtest-l3-tenants.sh

      # The rc perf run's verdict is all three rungs: a failed rung must fail the
      # script and stop the other two, and an interrupt must leave no rung running.
      # Checked against stub harnesses, each failure case seen to fail.
      - name: rc perf run script self-test
        run: hack/loadtest-rc-run.sh --self-test

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      # 🔑 actionlint runs shellcheck against every `run:` block, but ONLY if a
      # shellcheck binary is on PATH — otherwise it silently skips that entire
      # class of check and still exits 0. ubuntu-latest ships one, so CI gets the
      # shell checks; a developer's machine usually does not, so a local green run
      # is WEAKER than this job and does not predict it. Measured: with shellcheck
      # absent, actionlint reported nothing on this repo; with it present, it found
      # two real defects (an unquoted $(...) here and an unquoted ${REGISTRY} in
      # release.yml). Run it locally as:
      #   actionlint -shellcheck=/path/to/shellcheck
      # The runner image stopped shipping shellcheck (2026-11-14), so install it from the
      # image's signed apt repository rather than depend on what the image happens to carry.
      - name: Install shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          }
          shellcheck --version
      - name: actionlint
        run: |
          GOWORK=off hack/go-mod-download.sh --retry -- go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on PATH; actionlint would silently skip"
            echo "all shell checks and still pass. Refusing to report a weaker result"
            echo "than this job promises."
            exit 1
          }
          "$(go env GOPATH)/bin/actionlint"

      # actionlint above covers the shell INSIDE workflows (`run:` blocks). The
      # standalone scripts were ungated, and that is where most of this repo's
      # shell actually lives — both validation rigs, every CI guard, the local
      # bring-up, the operand-image build.
      #
      # Self-test first, for the usual reason: this guard enumerates its own
      # inputs, and an enumeration that silently returns nothing is the classic
      # way a check reports "clean" about a tree it never looked at.
      - name: shellcheck and early-closing-pipe guard self-test
        run: hack/shellcheck.sh --self-test

      # The same script also refuses a pipe into a reader that can stop early
      # (grep -q, head, ...): under pipefail the writer's broken pipe becomes
      # the answer. A here-string cannot hit that, so the fix is always to
      # capture the output first: grep -q ... <<<"$(cmd)". It scans tracked
      # *.sh files only: the `run:` blocks in these workflows and any shell in a
      # Makefile are NOT checked for this shape (actionlint shellchecks the
      # run: blocks, but shellcheck has no rule for it).
      - name: shellcheck every tracked script, and refuse early-closing pipes
        run: hack/shellcheck.sh

      # The fuzz tests are fuzzed nightly (fuzz-nightly.yml), not per PR, and that
      # run is only as good as the script deciding what counts as a pass. Gating
      # the classifier HERE means it cannot lose its ability to fail between
      # nights -- for instance by reading `go test -fuzz`'s exit 0 on a pattern
      # that matched nothing as a clean run. Needs no Go toolchain and no fuzzing.
      - name: fuzz wrapper self-test
        run: hack/fuzz.sh --self-test

      # The base image of every artifact we publish lives on one line of
      # .ko.yaml, and no scanner reads it — Scorecard only parses Dockerfiles,
      # which is how it came to flag a dead kubebuilder Dockerfile while missing
      # this. The guard checks the pin is a digest AND that the workflow which
      # advances it is still alive; a frozen pin is worse than the mutable tag.
      - name: ko base-image pin guard self-test
        run: hack/check-ko-base-pin.sh --self-test

      # The pin above is only worth guarding if a build READS it. ko finds .ko.yaml in its
      # working directory only, so every build runs through hack/ko-build.sh, which sets
      # KO_CONFIG_PATH; this fails any bare ko elsewhere. The build-side
      # proof is the image-smoke job's "ko build uses the pinned base" step.
      - name: ko wrapper lint self-test
        run: hack/check-ko-base-used.sh --self-test

      - name: every ko invocation goes through the pinned-base wrapper
        run: hack/check-ko-base-used.sh --lint

      - name: ko base image is pinned and its bumper is alive
        env:
          GH_TOKEN: ${{ github.token }}
          # The liveness half needs the API. Without this, a missing token would
          # make the guard quietly check half of what it advertises — the same
          # shape as actionlint silently skipping shellcheck.
          REQUIRE_LIVENESS: '1'
        run: hack/check-ko-base-pin.sh

      # The same argument one level down: the ko base image is pinned, and every
      # image a script pulls should be too. One was not — the upgrade drill
      # started its local registry from the moving `registry:2` tag on Docker Hub,
      # anonymously, and a 500 from that registry during the v0.15.0 stable tag
      # failed the drill and skipped every publish job that depends on it.
      #
      # Self-test first, and it plants each of the two rules' defects alone: the
      # inline shape (which is how the failing site was written, with no variable
      # for a name-based rule to find) and the assignment shape.
      - name: image-pin guard self-test
        run: hack/check-image-pins.sh --self-test

      - name: every image a script pulls is pinned by digest
        run: hack/check-image-pins.sh

      # A digest pin can still be withdrawn by its registry: the object store's
      # was, and every fresh install failed while cached nodes looked fine. The
      # anonymous pull check itself runs weekly in ko-base-image.yml, not here —
      # a registry call on every pull request is what check-image-pins.sh exists
      # to avoid — and a failure there stops the heartbeat the guard above reads.
      # What runs here is its OFFLINE self-test: no network, and it proves each
      # verdict (ok, UNPULLABLE, RATE LIMITED, TIMED OUT) can be reached and that
      # its enumeration still finds the object store's pin.
      - name: image-pull check self-test (offline)
        run: hack/check-image-pulls.sh --self-test-offline

      # The module-prefetch retry loop is what lets a dropped proxy stream not fail a job, so
      # prove it can still tell a retry from a fallback from an honest failure. Fully offline
      # (a stand-in `go`), so it cannot flake on the network it exists to survive.
      - name: go mod download retry self-test
        run: hack/go-mod-download.sh --self-test

      # Every setup-go must take its version from go.work, not a module go.mod.
      # setup-go pins GOTOOLCHAIN=local, so a module's LANGUAGE floor (routinely
      # lower than the workspace's) installs a toolchain that `go build` inside
      # the workspace then refuses. ko-base-image.yml was the one workflow of
      # nineteen doing that, and it failed silently every week for three weeks
      # because its only consumer is the 40-day liveness window above.
      - name: go-version source guard self-test
        run: hack/check-go-version-source.sh --self-test

      - name: every setup-go takes its version from go.work
        run: hack/check-go-version-source.sh

      # The default basemap is the OpenStreetMap standard tile layer, whose usage
      # policy needs a Referer from browser clients. Adding a restrictive
      # Referrer-Policy is a one-line hardening that breaks nothing HERE and
      # blanks the map on installs nobody here can see — so the argument has to
      # meet the person writing that line. Self-test first, as ever: this is a
      # grep, and a grep with a wrong path reports a clean tree it never read.
      - name: OSM tile-policy guard self-test
        run: hack/check-osm-tile-policy.sh --self-test

      - name: No Referrer-Policy strips the Referer the default basemap needs
        run: hack/check-osm-tile-policy.sh

      # The ci-complete gate is the single check branch protection requires, and
      # it is only as complete as a hand-written `needs` list. A job added to this
      # file is unguarded by default — it runs, it can fail, and the gate goes
      # green — so this asserts the list still names every job, and that the gate
      # kept the two properties that make it work (always(), and a body).
      #
      # Self-test first, and it plants each defect ALONE: a self-test that plants
      # all of them at once is satisfied by a checker that finds any one.
      - name: ci-complete gate guard self-test
        run: hack/check-ci-gate-complete.sh --self-test

      - name: the required gate depends on every job
        run: hack/check-ci-gate-complete.sh

      # The upgrade gate runs on a PR only when the PR touches something that can
      # change what an existing instance holds, and hack/check-upgrade-gate-paths.sh
      # owns that rule outright: the workflow fires on every PR and asks the script,
      # so the drill can be a REQUIRED check without leaving unrelated PRs pending.
      #
      # A rule that stops matching fails in the worst direction available: nothing
      # errors, the drill simply does not appear, and "the upgrade drill did not
      # object" is indistinguishable from "the upgrade drill passed". This checks the
      # two claims that can be checked from the tree — every migration and baseline
      # file is matched, and the workflow has not grown a `paths:` filter that would
      # AND with the script invisibly. Same self-test-first rule as the guard above,
      # and its self-test covers the decision itself, which nothing here can.
      - name: upgrade-gate rule guard self-test
        run: hack/check-upgrade-gate-paths.sh --self-test

      - name: every migration triggers the upgrade drill
        run: hack/check-upgrade-gate-paths.sh

  # ---------------------------------------------------------------------------
  # Published documentation hygiene.
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Prove the guard can fail before trusting it to pass — it is a grep, and a
      # grep with a typo'd pattern is indistinguishable from a clean tree.
      - name: ADR-reference guard self-test
        run: hack/check-docs-adr-refs.sh --self-test

      # ADRs live in the private strategy repo, so a reference to one in the docs
      # site is a dead citation for every reader who has it.
      - name: No ADR references in published docs
        run: hack/check-docs-adr-refs.sh

      # Same rule, one surface the guard above does not scan: .github/release-highlights.json
      # publishes `theme` and `highlights[]` verbatim into the GitHub release body and into
      # devicechain.io/releases.json, while its `_comment` block is maintainer prose that
      # cites ADRs on purpose — so the check is two fields, not a file, and it lives with the
      # rest of that file's rules. The guard proper needs a tag and therefore runs only on a
      # release; this mode needs none, so the citation is caught on the PR that writes it
      # rather than on the tag that ships it.
      - name: No ADR references in the published release highlights
        run: hack/check-release-highlights.sh --publish-safety

      # Same reasoning as the guard above: prove it can fail first. This one
      # greps the tree for names, and a grep that finds everything is
      # indistinguishable from a tree that still matches.
      - name: Feature-draft rot guard self-test
        run: hack/check-docs-drafts-rot.sh --self-test

      # A feature draft's value is that every claim was checked against the code.
      # That decays silently as files move, and a stale map is worse than none.
      - name: Feature drafts still match the tree
        run: hack/check-docs-drafts-rot.sh

      # Third guard, same rule: prove it can go red before trusting it green. This
      # one compares two file listings, and a listing built from the wrong path is
      # empty — which compares equal to another empty listing and reports parity.
      - name: Locale-parity guard self-test
        run: hack/check-docs-locale-parity.sh --self-test

      # Docusaurus falls back to the English page when a translation is missing, so
      # an untranslated page ships as a clean build and a Spanish reader silently
      # gets English — no broken link, no warning. The cost lands at the release
      # tag, where `docs:version` freezes one snapshot per locale: drift at that
      # moment is frozen into a shipped version rather than fixed by writing a page.
      - name: Translated docs match English file-for-file
        run: hack/check-docs-locale-parity.sh

      # Release-notes FRAGMENTS: a PR adds docs/release-notes/unreleased/<slug>.md instead of
      # editing the release-notes page, so merges stop conflicting every other open PR. The
      # release-notes PR folds them in with hack/assemble-release-notes.py. Golden tests and one
      # test per refusal first, then the negative control (--check must exit 1 on each planted
      # bad fragment), then every fragment in the tree: all three locales present, a known
      # section, front matter that parses, no ADR reference, matching structure per locale.
      - name: Release-notes assembler tests
        working-directory: hack
        run: python3 -m unittest -v test_assemble_release_notes

      - name: Release-notes fragment check self-test
        run: python3 hack/assemble-release-notes.py --self-test

      - name: Release-notes fragments are well-formed
        run: python3 hack/assemble-release-notes.py --check

      # An alert is a page at 3 a.m. and the docs are its runbook. The chart's
      # PrometheusRule templates and the docs were edited independently, and a
      # quarter of the shipped alerts had no docs mention at all. Prove the check can
      # fail (a planted gap, a missing translation, a stale allowlist), then run it.
      - name: Alert-coverage guard self-test
        run: hack/check-docs-alert-coverage.sh --self-test

      - name: Every shipped alert is documented, in every locale
        run: hack/check-docs-alert-coverage.sh

      # The symbol cells of the transport matrix are generated from the conformance rig's results
      # (hack/conformance-rig.sh): a filled circle names the third-party-client checks behind it, and
      # the results say whether they passed. A hand-edited cell, in any of the three locales, is a
      # claim nothing substantiates. The check re-renders the pages and fails on any difference.
      # Self-test first: it proves the guard fails on a hand edit, on results from a dirty tree, on a
      # negative control that never went red and on stale results, before it is trusted to pass.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: backend/tools/transportmatrix/go.mod

      - name: Transport-matrix guard self-test
        run: hack/check-transport-matrix.sh --self-test

      - name: Transport-matrix cells match the conformance results, in every locale
        run: hack/check-transport-matrix.sh

      # An alert that reaches a person at 3 a.m. has to say what to do. Every rule carries a
      # runbook_url that lands on its entry in the published alert runbook, and the runbook (in
      # every locale) is generated from the rules, so neither can drift from the other. The
      # self-test plants each defect alone: a rule with no link, a link at the wrong anchor, a
      # stale page, a missing translation, an alert with no entry, and no rules at all.
      - name: Alert runbook guard self-test
        run: hack/check-alert-runbooks.sh --self-test

      - name: Every shipped alert links to its runbook entry
        run: hack/check-alert-runbooks.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      # The schema publisher's gates, including its own negative controls. The two
      # guards above cannot see the published schemas at all: they scan committed
      # sources, and these files are generated at build time into a gitignored
      # directory, so they exist only on Netlify. This is what covers that.
      - name: Schema publishing self-tests
        run: node --test docs/scripts/schema-publish.test.mjs

      - name: Translation freshness self-tests
        run: node --test docs/scripts/translation-freshness.test.mjs

      # What the docs search bar reports to PostHog: the query sanitizer (a query that
      # looks like an email, token or key must never leave the browser) and when events
      # fire (debounced, once per query, nothing when PostHog is absent or opted out).
      - name: Docs search analytics + URL scrubbing + selector-check self-tests
        run: node --test docs/src/search/analytics.test.mjs docs/src/search/analytics.hardening.test.mjs docs/scripts/analytics-scrub.test.mjs docs/scripts/check-search-selectors.test.mjs docs/scripts/analytics-init.test.mjs

      # The per-schema GraphQL reference pages are generated at docs build time, so —
      # like the published SDL above — they exist only on Netlify. These tests are what
      # a pull request sees: every served schema has a page in every locale (asserted
      # from the tree, so a new service cannot be silently missed), descriptions come
      # from """ strings and never # comments, and every page compiles as MDX. Unlike
      # the tests above they need the docs dependencies (graphql, and the MDX compiler).
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --no-audit --no-fund

      - name: GraphQL reference generator self-tests
        working-directory: docs
        run: node --test scripts/graphql-reference.test.mjs

      # The file-set guard above proves a translated page EXISTS; this proves it kept
      # English's skeleton — explicit heading anchors (console deep links and release
      # notes point at them, and the build's broken-anchor check only sees links from
      # inside the site), heading count per level, code fences and admonitions. Needs
      # the docs dependencies: the self-test pins its slug mirror against the real
      # github-slugger. Self-test first, so a green check is known to be able to fail.
      - name: Structure-parity guard self-test
        run: node --test docs/scripts/structure-parity.test.mjs

      - name: Translated docs keep English's anchors and structure
        run: node docs/scripts/check-structure-parity.mjs

      # English remains the reference; locale refreshes may happen in batches.
      # Report changed source pages without blocking unrelated English edits.
      - name: Chinese translation review status
        run: node docs/scripts/check-translation-freshness.mjs --locale zh-CN

      - name: Spanish translation review status
        run: node docs/scripts/check-translation-freshness.mjs --locale es

      # Netlify builds the docs site, not Actions — so a backend rename would break
      # the docs deploy AFTER merge, in a Go pull request that triggers no docs
      # build at all. Running the generator in check mode here puts the failure on
      # the pull request that caused it.
      - name: GraphQL schemas reconcile with the publish manifest
        run: node docs/scripts/generate-schema.mjs --check

      # A docs example is a string no compiler reads, so a renamed field or a changed
      # argument leaves the page that teaches it building and wrong. This validates every
      # fenced graphql block, in every locale, against the SDL the services serve, with
      # the services' own validator, and lists every block it deliberately skipped. The
      # same check runs as a test in the `go` job (module backend/tools/docsgql); it is
      # repeated here so a docs-only change fails in the docs job, next to the other
      # docs gates, with the skip list in the log.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: false

      - name: go mod download
        run: hack/go-mod-download.sh backend/tools/docsgql

      - name: GraphQL examples validate against the served schemas
        working-directory: backend/tools/docsgql
        run: go run . ../../..

      # The served SDL is the API reference, and its descriptions are what every tool and
      # the published schema show a reader. Every element must carry a """description"""
      # (a # comment is a maintainer note and does not count), except those still listed in
      # sdldesc/undescribed/ — a list that may only shrink. Also runs as a test in the go job.
      - name: Every served schema element is described
        working-directory: backend/tools/docsgql
        run: go run ./cmd/sdldesc -coverage ../../..

      # The decoder function reference is generated from the function library and committed,
      # because the docs build has no Go toolchain. This regenerates it in memory and diffs the
      # three locale copies, so a library change without a regenerated page fails here, in the
      # docs job, and not only in the `go` job. -count=1: the pages live outside the module.
      - name: Decoder function reference is current
        working-directory: backend/tools/docsgql
        run: go test -count=1 ./decoderfuncs

  # ---------------------------------------------------------------------------
  # Frontend: codegen drift check, typecheck, unit tests, build.
  # ---------------------------------------------------------------------------
  # Skipped on a pull request whose diff the frontend reads none of (hack/ci-select.py
  # FRONTEND_INPUTS: frontend/**, every GraphQL schema the codegen reads, event-processing's rule
  # sources the console's lockstep tests import, deploy/helm, hack/), and only then.
  frontend:
    needs: discover
    if: needs.discover.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Matches the frontend Dockerfile build stage (node:26-alpine) and
          # satisfies vite 8's engines floor (^20.19 || ^22.12 || >=24).
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 🔴 BEFORE `npm ci`, deliberately: these tests need no dependencies, and what
      # they cover is the RELEASE plumbing — the ordered package list, the version
      # stamper and the publisher helpers — which nothing else in CI executes at all.
      # Its one chance to be wrong is a tag, where the packages it publishes are
      # immutable, so it should fail in the first seconds of this job rather than
      # behind a two-minute install.
      - name: Release package plumbing tests
        run: npm run test:scripts

      # The user-guide screenshot recipes select on data-shot* attributes; a refactor that
      # drops one would only show up in a capture run against a live instance. This reads
      # recipes.ts and greps the console source, so it needs no dependencies and no cluster.
      - name: Guide capture anchors present
        run: node ../hack/guide-capture/check-anchors.mjs

      # The capture harness may read the instance superuser's password from the cluster; this
      # pins the resolution order (explicit env first) and that the value is never printed.
      # Node builtins only, so it too runs before `npm ci`.
      - name: Guide capture superuser resolution
        run: node --test ../hack/guide-capture/superuser.test.ts

      - name: Install dependencies
        run: npm ci

      # 🔴 BEFORE codegen, typecheck, lint and test — not merely before the build.
      # The apps consume the packages' `dist`, not their sources, so every step below
      # resolves @devicechain/{client,dashboards,widget-sdk,widgets} through built artifacts that
      # do not exist in a fresh checkout. (Each app script also depends on this through
      # a `pre*` hook, so the same thing cannot be reached stale by hand; the step is
      # here as well so a build failure is reported as a build failure rather than as a
      # confusing typecheck error twenty lines later.)
      - name: Build publishable packages
        run: npm run build:packages

      # 🔴 THE GATE THAT READS WHAT WOULD ACTUALLY BE UPLOADED. Everything else in this
      # job compiles the packages as workspace SOURCE; this packs them and checks the
      # tarball — the `files` allowlist, the `exports` targets, `publishConfig`, the
      # exact-pinned internal peer ranges, no bundler dialect in the portable entries,
      # and every entry loading under bare Node ESM out of a node_modules built only
      # from what the manifest declares.
      #
      # It runs on every pull request, and not only on a tag, because the release job's
      # copy of it is the LAST thing between a defect and an immutable npm version. A
      # gate whose first execution is the release is a gate nobody has seen work.
      - name: Verify the packed artifacts
        run: npm run verify:packages

      # The step above checks each tarball on its own; this one checks that somebody
      # outside the monorepo can BUILD a widget package from them. It copies
      # examples/widget-tank-level out of the checkout, installs the packed SDK tarballs
      # there, builds it, asserts its DOM-only entry bundles no ECharts, MapLibre or
      # built-in widget code, and then plants a chart import in that entry and requires
      # the check to fail. The work directory must lie outside the repository, or Node
      # would resolve a missing dependency from frontend/node_modules and prove nothing.
      - name: Widget package proof (example built from packed artifacts)
        env:
          DC_WIDGET_PROOF_WORK: ${{ runner.temp }}/widget-package-proof
        run: ../hack/widget-package-proof.sh all

      - name: Codegen drift check
        run: |
          # Regenerate and fail if the committed output in the console's src/gql
          # is stale (workspace layout: apps/console).
          npm run codegen
          git diff --exit-code -- apps/console/src/gql

      - name: Typecheck
        run: npm run typecheck

      # App and host-composition configs check JSX literal strings with their
      # configured exclusions. TypeScript libraries run bounded correctness lint;
      # brand runs its token verifier. This does not gate all widget prose on i18n.
      # workspace-lint.test.ts (in the Test step) discovers the root's workspaces
      # and fails if --if-present would silently skip a missing lint script.
      - name: Lint (app JSX strings, library correctness, brand verification)
        run: npm run lint

      - name: Test
        run: npm test

      # Brand drift gate. `npm run build` already fails if a generated stylesheet
      # is stale against tokens.json; this catches the other direction — a
      # consumer that stops importing and hand-declares the brand blue again.
      # That is not hypothetical: it is how the console, the dashboard and the
      # marketing site each ended up on a DIFFERENT blue, and a comment saying
      # "keep this in step" is what failed to stop it.
      #
      # The marketing site lives in another repo and is checked by hand with
      # DC_WEBSITE=... — nothing here can see it.
      - name: Brand token drift check
        run: npm run verify -w @devicechain/brand

      - name: Build
        run: npm run build

      # Board readability gate (apps/board-replay/e2e): every committed sim board, drawn by the
      # real renderer in Chromium at 960 and 1920 px in light and dark, fails on clipped or
      # overflowing text and on overlapping widgets, against a ratcheted known-failures list,
      # and a deliberately broken board must fail it. Here, in this job, rather than in a job
      # of its own: the packages it renders are already built above, and a separate job would
      # repeat the install and the package build to save the browser install.
      #
      # The browser is keyed on the EXACT Playwright version the lockfile installed, so a
      # Playwright bump downloads its own browser build instead of reusing one it may not
      # drive. The runner image (ImageOS, e.g. ubuntu24) and arch are in the key too: the
      # browser build is per distribution, and a key that survived an image move would restore
      # a build for the old one and never save the new one. On a cache hit the install still
      # runs: it skips the download and installs the system libraries, which live outside the
      # cached directory.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install the Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Board readability gate
        run: npm run test:readability -w @devicechain/board-replay

      # The replay bundle under `style-src 'self'` (no 'unsafe-inline'): builds dist/, serves it
      # with that policy and fails on any securitypolicyviolation or an undrawn board. Same browser
      # as the readability gate. The website serves this bundle under that policy.
      - name: Board replay strict-CSP gate
        run: npm run test:csp -w @devicechain/board-replay

      # ADVISORY: a full-page screenshot of every board the gate measured, for a reviewer to
      # look at. Nothing compares them with a baseline and nothing fails on them.
      - name: Upload the readability screenshots (advisory)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: board-readability
          path: frontend/apps/board-replay/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Console layout gate (apps/console/e2e): dashboard-editor controls drawn by the console's
      # own components in Chromium at phone to desktop widths, in English and Spanish, fail when
      # a control is cut off (the Version history drawer's Make live / Roll back) or sits on the
      # widget it edits (the canvas toolbar). Same job and same browser as the readability gate.
      - name: Console layout gate
        run: npm run test:layout -w @devicechain/console

      # ADVISORY: a screenshot of every case the layout gate measured.
      - name: Upload the console layout screenshots (advisory)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-layout
          path: frontend/apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # C# SDK (sdks/csharp): restore, build both TFMs (netstandard2.1 + net8.0), test.
  # TreatWarningsAsErrors + IsAotCompatible keep the Unity/IL2CPP guarantee honest.
  # ---------------------------------------------------------------------------
  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      # The MQTT client is tested against the broker the platform actually ships, not a
      # generic one — nats-server's MQTT gateway has its own behaviour (3.1.1 only, session
      # handling, client-id rules) and a different broker would prove the wrong thing.
      #
      # It is BUILT FROM THE VERSION THE BACKEND ALREADY PINS rather than downloaded: nats-server
      # is a direct dependency of backend/core, so `go build` yields exactly the version that
      # ships, with no second pin to keep in step and no checksum to maintain. A downloaded
      # release binary would be a version claim that drifts away from go.mod silently.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Prefetch the module graph with a bounded retry, then a different-infrastructure
      # fallback, so one dropped stream from the module proxy does not fail this job
      # before it builds anything. See hack/go-mod-download.sh for why the last attempt
      # rewrites the proxy list with `|` (any error) rather than the default `,` (404/410
      # only), and for the fact that checksum verification stays on. It resolves the module
      # graph the way the build does and fails if it modifies go.mod, go.sum or go.work.sum.
      - name: go mod download
        working-directory: .
        run: hack/go-mod-download.sh backend/core

      - name: Start the MQTT broker the platform ships
        working-directory: backend/core
        run: |
          go build -o "$RUNNER_TEMP/nats-server" github.com/nats-io/nats-server/v2
          "$RUNNER_TEMP/nats-server" --version
          mkdir -p "$RUNNER_TEMP/js"
          # ack_wait is how long the broker waits for a PUBACK before REDELIVERING a QoS-1
          # message, and it is set here because it is the only knob that makes redelivery
          # observable in a test: the default is 30 seconds, so a redelivery test on the default
          # either runs for half a minute or silently proves nothing. The SDK's redelivery test
          # FAILS rather than skips if no redelivery arrives, so dropping this line breaks the
          # csharp job loudly instead of quietly reducing what it covers.
          cat > "$RUNNER_TEMP/nats.conf" <<CONF
          port: 4222
          jetstream { store_dir: "$RUNNER_TEMP/js" }
          mqtt { port: 1883, ack_wait: "1s" }
          CONF
          "$RUNNER_TEMP/nats-server" -c "$RUNNER_TEMP/nats.conf" > "$RUNNER_TEMP/nats.log" 2>&1 &
          for _ in $(seq 1 30); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1883' 2>/dev/null; then
              echo "MQTT gateway is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "the MQTT gateway never came up:"; cat "$RUNNER_TEMP/nats.log"; exit 1

      # The SECOND broker: the same nats-server MQTT gateway, but behind the platform's real auth
      # callout, with a responder that admits seeded devices and mints their grants with the same
      # function device-management calls. The broker above is authless, which is right for protocol
      # behaviour and blind to admission: it accepts every connect, so a first connect the callout
      # would refuse, or a grant that does not cover a topic the SDK uses, cannot fail there.
      #
      # It listens on ephemeral ports and describes itself in a JSON file written only once it is
      # ready, so waiting for that file is the readiness check and there is no port to collide with
      # the broker above.
      - name: Start the MQTT broker behind the auth callout
        working-directory: backend/core
        run: |
          go build -o "$RUNNER_TEMP/calloutfixture" ./natsauth/cmd/calloutfixture
          "$RUNNER_TEMP/calloutfixture" -out "$RUNNER_TEMP/callout-fixture.json" > "$RUNNER_TEMP/calloutfixture.log" 2>&1 &
          for _ in $(seq 1 60); do
            if [ -s "$RUNNER_TEMP/callout-fixture.json" ]; then
              echo "the callout fixture is ready:"; cat "$RUNNER_TEMP/calloutfixture.log"
              exit 0
            fi
            sleep 1
          done
          echo "the callout fixture never became ready:"; cat "$RUNNER_TEMP/calloutfixture.log"; exit 1

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      # DC_REQUIRE_MQTT_BROKER is the half that stops a broken broker step from going unnoticed:
      # the real-broker tests skip themselves when DC_MQTT_BROKER is unset, and a skip reads as a
      # pass, so without this a silently-dead broker would leave the job green while testing
      # nothing. MqttRealBrokerGuardTests turns that into a failure.
      #
      # DC_REQUIRE_CALLOUT_FIXTURE is the same guard for the callout broker, and the step after
      # this one is the stronger form of it: it counts what the RealCallout category actually ran.
      - name: Test
        env:
          DC_MQTT_BROKER: tcp://127.0.0.1:1883
          DC_REQUIRE_MQTT_BROKER: '1'
          DC_CALLOUT_FIXTURE: ${{ runner.temp }}/callout-fixture.json
          DC_REQUIRE_CALLOUT_FIXTURE: '1'
        run: dotnet test --no-build -c Release

      # 🔴 A SKIPPED TEST READS AS A PASS, SO THE RUN IS COUNTED. The guard test above catches a
      # fixture variable that is missing; it cannot catch a category that matched nothing (a renamed
      # trait, a filter that drifted) or tests that skipped for another reason. This runs the
      # RealCallout category alone and fails unless every test in it PASSED -- not skipped, not
      # merely "no failures" -- and at least one existed.
      - name: Real-callout tests ran and passed (none skipped)
        env:
          DC_CALLOUT_FIXTURE: ${{ runner.temp }}/callout-fixture.json
        run: |
          dotnet test --no-build -c Release --filter "Category=RealCallout" \
            --results-directory "$RUNNER_TEMP/trx" --logger "trx;LogFileName=realcallout.trx"
          counters="$(grep -o '<Counters [^>]*>' "$RUNNER_TEMP/trx/realcallout.trx")"
          echo "$counters"
          total="$(sed -n 's/.* total="\([0-9]*\)".*/\1/p' <<<"$counters")"
          passed="$(sed -n 's/.* passed="\([0-9]*\)".*/\1/p' <<<"$counters")"
          if [ -z "$total" ] || [ "$total" -lt 1 ] || [ "$passed" != "$total" ]; then
            echo "::error::the RealCallout category ran $passed of $total tests to a pass; zero, or any skipped, is a failure here"
            exit 1
          fi

      # The rung the SDK README has been naming as missing. IsAotCompatible only turns on the
      # trim/AOT ANALYZERS, which read our source; they say nothing about whether the whole
      # closure — including MQTTnet's un-annotated IL — survives a real AOT compiler.
      #
      # 🔴 THE BINARY IS RUN, NOT JUST BUILT. AOT failures are overwhelmingly runtime failures
      # (a type that cannot be constructed, a path trimmed away), so a publish that is never
      # executed proves only that the compiler accepted the IL. The host drives a real MQTT
      # round-trip against an in-process scripted broker and exits non-zero if it breaks —
      # verified by breaking it deliberately and watching this step fail.
      #
      # 🔴 BOUNDARY, so a green run is not over-read: NativeAOT is NOT IL2CPP. They are
      # different AOT compilers, and dotnet test above runs on CoreCLR/JIT. This job is strong
      # evidence about the Unity path and proof of nothing about it; only a native Unity player
      # closes that gap.
      #
      # The broker started above is still running, so the native binary drives a REAL round-trip
      # rather than only the in-process scripted one — which is the strongest rung available here:
      # the platform's own broker, exercised by natively-compiled code.
      - name: Native-AOT publish-and-run gate
        env:
          DC_MQTT_BROKER: tcp://127.0.0.1:1883
          # Same reason as the Test step: this host skips its real-broker leg when the variable is
          # unset, and a skip reads as a pass. Without this the gate would quietly degrade to
          # scripted-only if the broker step ever broke.
          DC_REQUIRE_MQTT_BROKER: '1'
        run: |
          dotnet publish tests/DeviceChain.Sdk.AotHost -c Release -r linux-x64
          ./tests/DeviceChain.Sdk.AotHost/bin/Release/net8.0/linux-x64/publish/DeviceChain.Sdk.AotHost

      # Pack the package that will actually be published. Nothing else in CI does:
      # restore/build/test never open the packaging properties, so a <PackageIcon> or
      # <PackageReadmeFile> pointing at a file that is not there stays invisible until
      # a release run tries to publish and dies there (NU5019/NU5046). A version is
      # passed because the checked-in default is a deliberate placeholder, which also
      # makes this the only exercise of the release's own -p:Version= path.
      #
      # 🔴 A GREEN PACK IS NOT A GOOD PACKAGE, so the artifact is opened and read.
      # Measured, not assumed: NuGet reports a package with NO README as an
      # informational "missing a readme" line, packs it happily, and exits 0 — even
      # under -warnaserror, which does not promote it. Every listing field behaves the
      # same way. Deleting <PackageProjectUrl>, or dropping a Pack="true", produces a
      # package that builds clean and quietly lists worse. The assertions below are
      # what actually hold the listing together; -warnaserror is kept for the genuine
      # NU-warnings it does catch, and is not doing this job.
      - name: Pack the NuGet package
        run: |
          dotnet pack src/DeviceChain.Sdk -c Release --no-build \
            -p:Version=0.0.0-ci -warnaserror -o "$RUNNER_TEMP/nupkg"

          nupkg="$(ls "$RUNNER_TEMP/nupkg"/*.nupkg)"

          # The files a listing is made of must be IN the archive, not merely named.
          for want in avatar-400.png PACKAGE.md; do
            unzip -l "$nupkg" | grep -q " $want\$" \
              || { echo "::error::$want is missing from the packed nupkg"; exit 1; }
          done

          # ...and the nuspec must still carry the fields nuget.org renders from.
          nuspec="$(unzip -p "$nupkg" DeviceChain.Sdk.nuspec)"
          for el in icon readme projectUrl description tags copyright; do
            grep -q "<$el>" <<<"$nuspec" \
              || { echo "::error::the packed nuspec has no <$el>"; exit 1; }
          done
          # <repository> carries the url as an ATTRIBUTE, and packs with a commit but
          # no url when RepositoryUrl is unset -- so the element being present proves
          # nothing. Match the attribute.
          grep -q '<repository[^>]*url="http' <<<"$nuspec" \
            || { echo "::error::the packed nuspec has no repository url"; exit 1; }

          echo "packed and verified:"
          ls -1 "$RUNNER_TEMP/nupkg"

  # ---------------------------------------------------------------------------
  # Unity package (sdks/unity) tier-1 verification: compile the Runtime + Sample C# against real
  # UnityEngine reference assemblies (UnityEngine.Modules, reference-only) in BOTH platform branches
  # — desktop (#else) and WebGL (#if UNITY_WEBGL). Catches wrong-API / branch typos with no Editor,
  # license, or GUI. Editor/WebGL runtime behavior is out of scope here (game-ci + a browser smoke).
  # ---------------------------------------------------------------------------
  unity-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Tier-1 compile check (both platform branches)
        run: ./sdks/unity/tools/UnityCompileCheck/compile-check.sh

  # ---------------------------------------------------------------------------
  # Shared simulation traffic library (demos/shared/io.devicechain.sim-traffic): a source
  # Unity package whose Dotnet~/ sidecar compiles the SAME .cs files Unity compiles. No CI job
  # runs Unity, so this is the coverage those files get:
  #   - Runtime/ and Testing/ for netstandard2.1 + net8.0 at LangVersion 9, warnings as
  #     errors, AOT analyzers on net8.0 — how Unity compiles them (-langversion:9.0,
  #     .NET Standard 2.1), so a C# 10 construct fails here, not in the Editor;
  #   - Tests/ run under NUnit on net8.0, and compiled again for netstandard2.1 against the
  #     oldest NUnit 3.x with a .NET Standard build (Tests.Compat), the closest public stand-in
  #     for the NUnit 3.5 fork the Unity Test Runner uses. A stand-in, not the fork: the
  #     package's Unity host project run in batch mode remains the final check.
  # ---------------------------------------------------------------------------
  sim-traffic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/shared/io.devicechain.sim-traffic/Dotnet~
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build (runtime, test kit, tests, and the old-NUnit compile)
        run: dotnet build --no-restore -c Release

      # A non-terminating loop inside the library is bounded here, as a named hang, rather
      # than by the job's six-hour ceiling.
      - name: Test
        run: dotnet test --no-build -c Release --blame-hang-timeout 2m

      # Source rules neither compiler enforces: no conditional compilation in Runtime/, Testing/
      # or Tests/ (one set of files, one behaviour on every runtime), and no async tests. The
      # self-test runs first, so the green run below is one that could have been red; it covers
      # indented directives and a missing folder (grep rc=2), which must fail too.
      - name: Shared source rules self-test
        working-directory: .
        run: hack/check-unity-shared-sources.sh --self-test

      - name: No conditional compilation and no async tests in the shared sources
        working-directory: .
        run: hack/check-unity-shared-sources.sh demos/shared/io.devicechain.sim-traffic

      # Unity imports the package from these files with whatever .meta files are committed;
      # a missing one gets a new GUID on every machine. The self-test runs first so the green
      # run below is one that could have been red.
      - name: Unity .meta check self-test
        working-directory: .
        run: hack/check-unity-metas.sh --self-test

      - name: Every package file and folder has a committed .meta
        working-directory: .
        run: hack/check-unity-metas.sh demos/shared/io.devicechain.sim-traffic

  # ---------------------------------------------------------------------------
  # Shared demo platform (demos/shared/io.devicechain.demo-platform): the scenario-agnostic half of the
