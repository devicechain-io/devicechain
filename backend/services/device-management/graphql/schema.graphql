# Represents a device instance
"""
A device: one connected thing the platform receives events from and sends commands to.
What it measures and accepts comes from its device type's profile.
"""
type Device implements Model & TokenReference & NamedEntity & MetadataEntity & Entity {
    """Server-assigned numeric identifier, as a string. Address a device by its token instead where you can."""
    id: ID!
    """When the device was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the device was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted devices are not returned."""
    deletedAt: String
    """
    Identifier of the device, unique within the tenant. It cannot be changed after the
    device is created.
    """
    token: String!
    # ADR-049: opaque, not a credential, unique per tenant when set.
    """
    Optional business identifier you assign, such as a serial number or VIN, up to 256
    characters. Unique within the tenant when set. It is only a lookup key: devices are not
    addressed or authenticated by it.
    """
    externalId: String
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """The device's type."""
    deviceType: DeviceType!
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    """
    False when the device has been disabled. A disabled device's events are discarded
    rather than stored, it cannot open a new broker connection, and commands sent to it are
    refused with DEVICE_DISABLED. Its data, credentials and configuration are kept.
    """
    enabled: Boolean!
    """When the device was disabled, as an RFC 3339 timestamp; null while it is enabled."""
    disabledAt: String
    """
    The gateway this device is behind, or null when it is behind none. Only that gateway's
    credential may publish this device's telemetry on the gateway's own topics; the device's
    own credential still works as before.
    """
    gateway: Device
    """
    The devices behind this device, one page at a time. Empty unless the device is a
    gateway. Requires device:read.
    """
    children(
        """Which page to return."""
        pagination: PaginationInput!
    ): DeviceSearchResults!
}

"""Fields for a new device."""
input DeviceCreateRequest {
    """Identifier for the new device. A token already in use in the tenant is refused with CONFLICT."""
    token: String!
    """
    Optional business identifier, up to 256 characters. A value another device in the
    tenant already has is refused with CONFLICT.
    """
    externalId: String
    """Human-readable name, up to 128 characters."""
    name: String
    """Free-text description, up to 1024 characters."""
    description: String
    """Token of the device's type. An unknown token fails the request."""
    deviceTypeToken: String!
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
    """False to create the device already disabled. Omitted or null creates it enabled."""
    enabled: Boolean
    """
    Token of the gateway device to create this device behind. The same rules as
    assignDeviceGateway apply, and a refusal fails the create. Omitted or null creates the
    device behind no gateway.
    """
    gatewayToken: String
}

# There is no `token` member — the mutation's own `token` argument names the row. It used
# to be the payload token that named the row, with the argument ignored, so a request
# whose two tokens disagreed silently updated the device in the payload and returned it as
# though it were the one asked for.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the
# field arrive already-populated for a caller who never sent it, which collapses
# "omitted" back into "sent", and turns this input back into the full replace it
# replaces.
"""
A partial update to a device. Omit a field to leave the stored value alone, send a value
to set it, or send an explicit null to clear it; the fields that cannot be cleared say so.
The device is named by the mutation's token argument, so there is no token here. An empty
object changes nothing.
"""
input DeviceUpdateRequest {
    """New business identifier, or null to clear it. A value another device already has is refused with CONFLICT."""
    externalId: String
    """New name, or null to clear it."""
    name: String
    """New description, or null to clear it."""
    description: String
    """
    Token of a different device type to move the device to. An explicit null or an empty
    value is refused, because every device must have a type; an unknown token fails the
    whole update.
    """
    deviceTypeToken: String
    """New metadata (valid JSON, replacing the stored document), or null to clear it."""
    metadata: String
    """
    False to disable the device, true to enable it again. An explicit null is refused.
    Disabling a device that is already disabled keeps the time it was first disabled.
    """
    enabled: Boolean
}

"""
Creates many devices of one type from templates. Device n of the batch (n running from
startIndex to startIndex + count - 1) is rendered by replacing {n} with n, or {n:0Wd}
with n zero-padded to width W. Each template may be at most 256 characters, with a pad
width of at most 128. The whole batch is created or none of it is.
"""
input DeviceBulkCreateRequest {
    """Token of the device type for every device. An unknown token fails the request."""
    deviceTypeToken: String!
    """Number of devices to create, from 1 to 1000."""
    count: Int!
    """Index of the first device. Defaults to 1; values below 1 are refused."""
    startIndex: Int
    """
    Template for the device tokens. It must contain {n} or {n:0Wd} so each token is
    distinct, must not contain {random}, and every rendered token must be a valid token
    not already in use.
    """
    tokenTemplate: String!
    """Template for the device names. Optional; {random} is not allowed. A rendered name may be at most 128 characters."""
    nameTemplate: String
    """
    Template for the external ids. Optional. {random} renders a fresh random value per
    device. When creating more than one device the template must contain {n}, {n:0Wd} or
    {random}, since external ids are unique within the tenant. A rendered value may be at
    most 256 characters.
    """
    externalIdTemplate: String
    """Metadata given to every device. Must be valid JSON; an empty string means none."""
    metadata: String
}

"""How an import treats credentials. No mode generates a secret."""
enum DeviceImportMode {
    """Create devices only. Credential columns are refused."""
    NONE
    """
    Create each device together with the credential a factory supplied for it, in one
    transaction. credentialType and credentialId are required on every row.
    """
    FACTORY_CREDENTIALS
}

"""What happened to one row of an import."""
enum DeviceImportOutcome {
    """The device (and its credential, in FACTORY_CREDENTIALS mode) was created; on a dry run, would be."""
    CREATED
    """The device already exists exactly as the row describes it. A success; nothing was written."""
    EXISTS
    """The device, external id or credential id is taken by something different. Nothing was written."""
    CONFLICT
    """The row is malformed or names something that does not exist."""
    INVALID
    """The row is well-formed and was refused by a rule of the platform."""
    REFUSED
}

"""One device of an import file."""
input DeviceImportRow {
    """Identifier of the device, and the key a re-run matches on. Required."""
    token: String!
    """Token of the device's type. An unknown token makes the row INVALID."""
    deviceTypeToken: String!
    """Optional business identifier, up to 256 characters. Checked for conflicts; never the key."""
    externalId: String
    """Human-readable name, up to 128 characters."""
    name: String
    """Free-text description, up to 1024 characters."""
    description: String
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
    """ACCESS_TOKEN or MQTT_BASIC. FACTORY_CREDENTIALS mode only."""
    credentialType: String
    """The id the device presents (the access token itself, or the MQTT username). FACTORY_CREDENTIALS mode only."""
    credentialId: String
    """
    The MQTT_BASIC password, at least 16 bytes. Write-only: stored as a keyed digest, never
    returned, logged or compared on a re-run. FACTORY_CREDENTIALS mode only.
    """
    credentialValue: String
}

"""The outcome of one row of an import."""
type DeviceImportRowResult {
    """The row's position in the request, starting at 1."""
    row: Int!
    """The row's device token."""
    token: String!
    """What happened to this row: created, already present unchanged, in conflict with an existing device, invalid, or refused."""
    outcome: DeviceImportOutcome!
    """A machine-readable reason for every outcome but CREATED and EXISTS: CONFLICT, INVALID_VALUE, NOT_FOUND, LIMIT_EXCEEDED, DUPLICATE_IN_FILE or UNSUPPORTED."""
    code: String
    """What is wrong. It never contains a credential secret, but may repeat a token the row supplied, such as a device type token."""
    message: String
}

"""The per-row outcomes of an importDevices call, with their totals."""
type DeviceImportResult {
    """True when nothing was written."""
    dryRun: Boolean!
    """One outcome per request row, in request order."""
    rows: [DeviceImportRowResult!]!
    """Rows whose device was created (on a dry run: would be created)."""
    created: Int!
    """Rows whose device already exists exactly as described, so nothing was written."""
    exists: Int!
    """Rows that clash with an existing device or one of its unique values; nothing was written for them."""
    conflict: Int!
    """Rows refused because a value is malformed, missing or duplicated within the file."""
    invalid: Int!
    """Rows refused because what they ask for is not supported, such as an unsupported credential type."""
    refused: Int!
}

"""Criteria for searching devices. Results are newest first."""
input DeviceSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
    """Return only devices of the device type with this token. An unknown token matches nothing."""
    deviceType: String
}

"""Which customer's devices to return, and the page."""
input CustomerDeviceSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
    """Token of the customer."""
    customer: String!
    """Token of the relationship type linking each device to the customer, such as "assigned"."""
    relationshipType: String!
}

"""One page of devices matching a search."""
type DeviceSearchResults {
    """The devices on this page."""
    results: [Device!]!
    """Where this page sits in the full result set."""
    pagination: SearchResultsPagination!
}

# Represents a group of related devices.
type EntityGroup implements Model & TokenReference & NamedEntity & BrandedEntity & MetadataEntity & Entity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    metadata: String
    # The entity family this group collects: device | asset | area | customer.
    memberType: String!
    # How members are determined: static (explicit "member" edges) or dynamic
    # (a CEL selector over member-entity facet attributes — ADR-061 G3).
    membershipMode: String!
    # The CEL membership predicate, present only for dynamic groups.
    selector: String
    # The resolved members of this group — a static group's "member" edges or a
    # dynamic group's eval-on-read selector matches, transparently (a consumer does
    # not branch on mode). Always bounded + paginated (ADR-061 G4).
    members(pagination: PaginationInput!): EntityGroupMemberSearchResults!
    # The published version whose frozen selector a rule-scoped resolve reads
    # (ADR-062 S1). Null until a dynamic group is first published; always null for a
    # static group (never versioned). The live `selector` above is the mutable draft.
    activeVersion: Int
    # The group's published versions, newest first (ADR-062 S1). Empty for a group
    # that has never been published (and always empty for a static group).
    versions: [EntityGroupVersion!]!
    """
    Whether the group is an access scope: a group a member's access can be limited to. A member
    limited to it sees the devices in the group at its active version — and only while they
    are in it — and the history recorded while they were. Set with setEntityGroupAccessScope.
    """
    accessScope: Boolean!
}

# An immutable published snapshot of a DYNAMIC entity group's membership selector
# (ADR-062 S1). A rule scopes to a specific {group}@{version}, so its target set
# cannot drift under a later selector edit. Mirrors DeviceProfileVersion.
type EntityGroupVersion {
    # Monotonic per-group version number.
    version: Int!
    # The frozen lowerable-CEL membership selector captured at publish.
    selector: String!
    # The entity family the group collects, frozen with the version.
    memberType: String!
    # Optional user-supplied label (may embed a semver string; not parsed).
    label: String
    description: String
    # When the version was published (the row's creation time).
    publishedAt: String!
    # The identity that published it (username, falling back to email).
    publishedBy: String
}

# A resolved member of an entity group — the lightweight identity (row id + token)
# of a family entity, enough for a consumer to hydrate the full record. The family
# is the group's memberType, so it is not repeated per member.
type EntityGroupMember {
    id: ID!
    token: String!
}

# A paginated page of an entity group's resolved members.
type EntityGroupMemberSearchResults {
    results: [EntityGroupMember!]!
    pagination: SearchResultsPagination!
}

# The result of evaluating a CANDIDATE dynamic-group selector without saving it
# (ADR-061 G4). A selector that fails the publish gate (non-lowerable, over-budget,
# a parse/type error) returns valid=false with the console-surfaceable error in
# `error` and a null `members`, so the authoring UI can show the problem inline as
# the user types rather than treating it as a hard failure. When valid, `members`
# carries the eval-on-read matches (the live "matches N" preview).
type SelectorPreview {
    valid: Boolean!
    error: String
    members: EntityGroupMemberSearchResults
}

# Data required to create an entity group (ADR-061). membershipMode defaults to
# "static"; selector is only permitted (and required) for "dynamic".
# Editing one afterwards is EntityGroupUpdateRequest.
input EntityGroupCreateRequest {
    token: String!
    memberType: String!
    membershipMode: String
    selector: String
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    metadata: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
#
# memberType and membershipMode are absent for the same reason as token: all three are
# IDENTITY. Changing the member family would leave the group collecting a family its
# members do not belong to, and converting a static group to dynamic (or back) would
# orphan its members. A field that can only ever be a no-op or an error does not belong
# in an update input.
input EntityGroupUpdateRequest {
    # The CEL membership predicate, required (and only permitted) for a dynamic group. A
    # provided selector is re-compiled and cost-gated before it replaces the stored one.
    # Null is refused: a dynamic group with no selector matches nothing and cannot be
    # repaired into a valid group.
    selector: String
    name: String
    description: String
    imageUrl: String
    icon: String
    backgroundColor: String
    foregroundColor: String
    borderColor: String
    metadata: String
}

# Criteria used when searching for entity groups. memberType and membershipMode
# are optional filters.
input EntityGroupSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    memberType: String
    membershipMode: String
    """
    Keep only the groups that are (true) or are not (false) access scopes. Omit it for both.
    """
    accessScope: Boolean
}

# Search results returned from entity groups query.
type EntityGroupSearchResults {
    results: [EntityGroup!]!
    pagination: SearchResultsPagination!
}

# A per-tenant declaration that an EntityAttribute key, for a member family, is a
# classification facet (ADR-061 G2 / SD-5). It declares which keys are facets for
# the console browse/filter axes + typeahead; it does NOT store facet values (those
# stay as EntityAttribute rows on the member entities). Addressed by its natural
# key (memberType, key). Named FacetKey to avoid colliding with the ADR-045
# discovery-facet concept (DeviceFacet / facetValues).
type FacetKey implements Model {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    # The entity family this facet classifies: device | asset | area | customer.
    memberType: String!
    # The EntityAttribute key this facet declares (e.g. "climate", "country").
    key: String!
    # The value type the facet's attribute values carry: STRING | LONG | DOUBLE |
    # BOOLEAN | JSON.
    valueType: String!
    # Where the facet's values come from: "attribute" (v1) or "system" (a
    # predefined, non-deletable, modeled-column facet — declared seam, deferred).
    source: String!
    # An optional value vocabulary that powers the console typeahead; null when the
    # facet's values are free-form.
    values: [String!]
    # An optional human display label for the axis; null falls back to key.
    label: String
}

# Data required to declare (upsert) a facet key (ADR-061 G2). The natural key
# (memberType, key) selects the row; the remaining fields are (re)written. v1 only
# writes attribute-source facets, so there is no source field here.
input FacetKeySetRequest {
    memberType: String!
    key: String!
    valueType: String!
    values: [String!]
    label: String
}

# Criteria used when searching for facet keys. memberType is an optional filter
# (the console axis picker asks per family).
input FacetKeySearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    memberType: String
}

# Search results returned from the facet keys query.
type FacetKeySearchResults {
    results: [FacetKey!]!
    pagination: SearchResultsPagination!
}

# Represents rotatable authentication material for a device (ADR-014).
type DeviceCredential implements Model & TokenReference & MetadataEntity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    device: Device!
    credentialType: String!
    """
    What the device presents. For MQTT_BASIC, the username. For ACCESS_TOKEN, the access
    token itself ONLY in the response to the create, update or replacement that set it,
    which is the one time it can be read: the platform stores an access token as a keyed
    digest and cannot return it afterwards. Every later read returns a fingerprint that
    identifies the credential and cannot be presented as the token. If the token is lost,
    set a new one with updateDeviceCredential.
    """
    credentialId: String!
    # Write-only: accepted on create/update but never returned on read (always
    # null), so a stored secret (e.g. an MQTT_BASIC password) cannot be read back
    # out through the API.
    credentialValue: String
    enabled: Boolean!
    expiresAt: String
    metadata: String
}

# Data required to create a device credential.
input DeviceCredentialCreateRequest {
    token: String!
    deviceToken: String!
    credentialType: String!
    """
    The MQTT username, or the access token for ACCESS_TOKEN (at most 256 bytes). The token
    is stored only as a keyed digest and is returned once, in this mutation's response.
    """
    credentialId: String!
    """
    The password for an MQTT_BASIC credential: at least 16 bytes, counted as sent, and at
    most 4096. A shorter one is refused with extensions.code INVALID_VALUE. Write-only; it
    is stored only as a keyed digest. A password set before the 16-byte minimum keeps
    working until it is next changed.
    """
    credentialValue: String
    enabled: Boolean!
    expiresAt: String
    metadata: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
input DeviceCredentialUpdateRequest {
    # Re-points the credential at another device. Null is refused; an unknown token
    # refuses the whole update.
    deviceToken: String
    # Required and unclearable. credentialType is validated against the known vocabulary
    # when sent; credentialId is what a device presents at connect time.
    credentialType: String
    """
    The MQTT username, or the new access token for ACCESS_TOKEN. Setting it on an
    ACCESS_TOKEN credential rotates the token: the old one stops working at once and the
    new one is returned once, in this mutation's response. Required when this request
    changes the credential's type to or from ACCESS_TOKEN, and refused otherwise with
    extensions.code INVALID_VALUE.
    """
    credentialId: String
    # The secret material, nullable — a credential type that carries no secret is a real
    # state. OMITTING IT LEAVES THE SECRET IN PLACE, which is what makes editing anything
    # else on a credential safe; the input this replaces blanked it on every such edit.
    """
    The new password for an MQTT_BASIC credential: at least 16 bytes, counted as sent, and at
    most 4096. A shorter one is refused with extensions.code INVALID_VALUE. Required when this
    request changes the credential's type to MQTT_BASIC. Ignored for a type that has no
    password. Write-only; it is stored only as a keyed digest. A password set before the 16-byte minimum keeps
    working until it is next changed.
    """
    credentialValue: String
    # Required and unclearable: null is refused rather than read as false, which would
    # silently disable the credential and take the device offline at its next reconnect.
    enabled: Boolean
    # An RFC3339 timestamp. Null — or an empty string, which is what a cleared form field
    # sends — means "never expires".
    expiresAt: String
    metadata: String
}

# Criteria used when searching for device credentials.
input DeviceCredentialSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    device: String
    credentialType: String
    """
    An MQTT username, or for ACCESS_TOKEN either the access token or the fingerprint a read
    returns. The token is matched through its digest; it is never stored or compared as sent.
    """
    credentialId: String
    enabled: Boolean
}

# Search results returned from device credential query.
type DeviceCredentialSearchResults {
    results: [DeviceCredential!]!
    pagination: SearchResultsPagination!
}

# One append-only record of a physical unit swap: the failed hardware was retired
# and a new unit bound to the SAME logical device identity, so the device's events,
# alarms, relationships, group membership and command vocabulary carry forward
# unbroken. Written only by replaceDevice; there is no update or delete for it, and
# it carries no token, so it cannot be re-pointed.
type DeviceReplacement {
    id: ID!
    createdAt: String
    # The logical identity that survived the swap - unchanged by the operation.
    device: Device!
    # When the replacement was applied, from the server's clock. Never caller-supplied.
    occurredTime: String!
    # The authenticated subject that performed the replacement, from the caller's
    # token rather than the request body.
    actor: String!
    # The operator's free-text note ("water ingress", "RMA 41822").
    reason: String
    # The incoming physical unit's own identifier - a manufacturer serial or IMEI.
    # Recorded here and deliberately NOT written onto the device's externalId, which
    # is the stable business key of the logical thing and must survive a swap.
    unitIdentifier: String
    # Entity tokens of the credentials this replacement disabled. Tokens, never
    # credential ids: the id of an ACCESS_TOKEN credential is the device's token.
    retiredCredentialTokens: [String!]!
    # Entity token of the credential minted for the incoming unit.
    newCredentialToken: String!
    newCredentialType: String!
}

# Criteria used when searching the device-replacement journal.
input DeviceReplacementSearchCriteria {
    pageNumber: Int!
    pageSize: Int!
    # Narrow to one device by its token.
    device: String
}

# Search results returned from a device-replacement query, newest first.
type DeviceReplacementSearchResults {
    results: [DeviceReplacement!]!
    pagination: SearchResultsPagination!
}

"""
One immutable revision of a device's configuration document: the values of the shared
attribute keys its profile's active published version declares as device-visible.
Revisions are append-only; a new one is minted only when the document changes.
"""
type DeviceConfigurationRevision {
    """
    The revision number: 1 for the device's first document and one higher for each
    later one. A number is never reused for the same device.
    """
    revision: Int!
    """
    "sha256:" followed by the lowercase hex SHA-256 of the document bytes. A device
    converges on a revision by reporting this revision number and this digest. A device
    hashes the bytes it receives and never re-serializes them to check the digest.
    """
    digest: String!
    """
    The document as canonical JSON text: an object of declared key to typed value with
    keys sorted. These are exactly the bytes the digest covers.
    """
    document: String!
    """
    When the revision was minted.
    """
    createdAt: String
    """
    The authenticated subject whose attribute change minted the revision; empty when
    none was recorded.
    """
    actor: String!
}

"""
The configuration state a device last reported. Written only from the device's own
reports; no mutation sets it.
"""
type DeviceConfigurationReport {
    """
    The revision the device reported, or null when it has not reported one.
    """
    revision: Int
    """
    The digest the device reported for that revision.
    """
    digest: String
    """
    RECEIVED, APPLIED or REJECTED.
    """
    status: String
    """
    The device's reasons for a REJECTED report; empty otherwise.
    """
    errors: [String!]!
    """
    When the device made the report.
    """
    reportedAt: String
    """
    When the device last asked for its configuration.
    """
    lastSyncAt: String
}

"""
A device's configuration: the latest revision it should hold, what it last reported,
and whether the two agree.
"""
type DeviceConfiguration {
    """
    The latest minted revision, or null when none has been minted for this device.
    """
    desired: DeviceConfigurationRevision
    """
    The device's last report, or null when it has never reported.
    """
    reported: DeviceConfigurationReport
    """
    True when a revision exists and the device has not reported APPLIED for that same
    revision with that same digest. Equal values under a different revision or digest
    do not count as applied.
    """
    pending: Boolean!
    """
    True when the document the device's current profile declaration and shared
    attributes would build differs from the latest revision - for example after a
    profile publish declared new keys. A newer revision is minted when a declared
    key is next written or the device next synchronizes.
    """
    stale: Boolean!
    """
    The device's shared attribute keys that its declaration does not name. They are
    never part of the document.
    """
    undeclared: [String!]!
    """
    Declared keys whose stored value cannot be carried as the declared value type
    (written with another type, or unparseable). They are left out of the document.
    """
    invalid: [String!]!
}

"""
A page of a device's configuration revisions, newest first.
"""
type DeviceConfigurationRevisionSearchResults {
    """
    The revisions on this page, highest revision number first.
    """
    results: [DeviceConfigurationRevision!]!
    """
    Where this page sits in the device's whole revision history.
    """
    pagination: SearchResultsPagination!
}

# What a caller sends to swap the physical unit behind a device identity.
#
# It carries NO device identity fields, and that is the contract rather than an
# omission: there is no token, externalId, device type or name here, so a
# replacement cannot move the identity, the business key or the profile binding.
# "Rotate credentials, not identity" is unrepresentable to violate, not merely
# refused.
input DeviceReplaceRequest {
    # The surviving logical identity.
    deviceToken: String!
    # Credential type minted for the incoming unit. Defaults to ACCESS_TOKEN.
    credentialType: String
    # The identifier the new unit presents at connect time. Optional only for
    # ACCESS_TOKEN, where a fresh random token is minted and returned once in
    # newCredential; required for every other type, since the server cannot invent
    # an MQTT username.
    credentialId: String
    # Secret material for types that carry one separately (an MQTT password).
    # Write-only, as on any credential.
    """
    The password for an MQTT_BASIC credential: at least 16 bytes, counted as sent, and at
    most 4096. A shorter one is refused with extensions.code INVALID_VALUE. Write-only; it
    is stored only as a keyed digest. A password set before the 16-byte minimum keeps
    working until it is next changed.
    """
    credentialValue: String
    # Entity token for the new credential row. A UUID is minted when absent.
    credentialToken: String
    # Optional expiry for the new credential (RFC3339).
    expiresAt: String
    reason: String
    unitIdentifier: String
}

# What replaceDevice returns.
type DeviceReplaceResult {
    # The surviving identity, unchanged.
    device: Device!
    # The append-only record this call wrote.
    replacement: DeviceReplacement!
    # The credential minted for the incoming unit. This is the one moment the
    # material the new unit must be programmed with is readable (an access token is
    # stored only as a digest and cannot be read again), so copy it from here.
    newCredential: DeviceCredential!
    # Entity tokens of the credentials this call disabled. Tokens only: the
    # credential rows themselves stay behind the gated credential queries.
    retiredCredentialTokens: [String!]!
}

# A device provisioning profile (ADR-012): the shared key+secret a fleet presents
# to self-register, the strategy governing whether unknown devices may be created,
# and the device type stamped onto auto-created devices. The provision secret is
# write-only and is never exposed on this type.
type ProvisioningProfile implements Model & TokenReference & NamedEntity & MetadataEntity {
    id: ID!
    createdAt: String
    updatedAt: String
    deletedAt: String
    token: String!
    name: String
    description: String
    provisionKey: String!
    strategy: String!
    deviceType: DeviceType!
    credentialType: String!
    enabled: Boolean!
    expiresAt: String
    metadata: String
}

# Data required to create a provisioning profile.
input ProvisioningProfileCreateRequest {
    token: String!
    name: String
    description: String
    # Both are refused when empty or whitespace-only: a blank secret is no proof of
    # anything. A padded value is stored exactly as sent.
    provisionKey: String!
    provisionSecret: String!
    strategy: String!
    deviceTypeToken: String!
    credentialType: String
    enabled: Boolean!
    expiresAt: String
    metadata: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field — the record is identified by the mutation's
# `token` argument, and an update cannot move it.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
input ProvisioningProfileUpdateRequest {
    name: String
    description: String
    # The credentials a fleet presents to self-register. Both are required and
    # unclearable: a blank either side authenticates nothing. OMITTING provisionSecret
    # LEAVES IT IN PLACE — the input this replaces blanked it on every edit that failed to
    # restate it, after which the whole fleet failed to register.
    provisionKey: String
    provisionSecret: String
    # Required and unclearable; validated against the strategy vocabulary when sent.
    strategy: String
    # Stamped onto auto-created devices. Null is refused; an unknown token refuses the
    # whole update.
