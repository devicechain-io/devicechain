{{/*
Alerting rules for per-tenant governance ceilings.

WHY THIS GROUP EXISTS. Every service that enforces a per-tenant ceiling (ingest,
outbound, AI inference) reads each tenant's ceiling from user-management and caches it.
Until it has read one -- the first time it sees a tenant after it starts, or for as long
as user-management cannot be asked -- it meters that tenant at its PLATFORM DEFAULT. The
default is still a ceiling, never unlimited, so nothing fails and nothing is shed that
would not have been; but for a tenant whose tier sets a LOWER ceiling it admits more than
the tier allows, and no request reports it. Each service counts those admissions by cause
on <area>_governance_unresolved_admissions_total, and TenantsMeteredAtPlatformDefault
pages only on the cause an operator can act on: user-management unreachable or failing.
The other causes -- a tenant name user-management does not know, and a name nothing has
answered for yet -- are exactly what a spray of invented names produces, so paging on them
would hand whoever sends the spray a permanently firing alert.

The second alert watches the bound on those invented names. HTTP ingest takes its tenant
from the request path before any credential is checked, so each name that user-management
has not confirmed gets an allowance of its own only from a fixed set; past that set, every
such name shares one. RateLimiterOverflowInUse fires while that shared allowance is in use.

The next two watch the outbound ceiling's clock and its record. REACT and the connectors
service meter a tenant's outbound actions on the time the triggering telemetry reached the
platform, which the detection engine stamps; a dispatch without a stamp is metered on its
broker time or on arrival and counted on <area>_rate_clock_fallback_total, and a sustained
fallback means a catch-up can be shed as a flood again (RateMeteringClockFallback). A stamp
later than its message's broker time is capped at that time and counted as source "capped",
which the alert does not watch: it is the pod's and the broker's clocks disagreeing, not a
missing stamp, and it holds steadily on a healthy install whose clocks are skewed.
An action REACT sheds is dead-lettered within a per-tenant and a global budget; past the
budget it is only counted and summarised (ReactShedLettersOverBudget).

The outbound ceiling is enforced at BOTH ends on that same timeline, so the connectors
service shedding a dispatch for rate means it refused what the detection engine admitted
(ConnectorDispatchRateLimited): the two ends disagree about the ceiling, or failing sends
are being retried and every retry is metered again at the connectors end. A tenant over
quota is already reported where it is shed, at the source, by ReactConnectorEgressShedding
in the event-processing group.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: governance
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.governance
      rules:
        # `for` MUST exceed the 10m window. A restart empties every service's ceiling
        # cache, and the first reads after it race the first admissions -- and a
        # user-management that restarts alongside it is briefly unreachable. That blip
        # raises the counter for a minute or two and then stops; with `for` longer than
        # the window, the increase has fallen back to zero before the alert could fire.
        - alert: TenantsMeteredAtPlatformDefault
          expr: sum by (job, dimension) (increase({__name__=~"devicechain_[a-z0-9]+_governance_unresolved_admissions_total", cause="unreachable", namespace="{{ $ns }}"}[10m])) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A service cannot read tenant ceilings from user-management and is metering tenants at the platform default"
            description: "For at least 15 minutes, {{ "{{ $labels.job }}" }} has admitted {{ "{{ $labels.dimension }}" }} traffic for tenants whose ceilings it could not read because user-management was unreachable or failing, so it metered them at its platform default. For a tenant whose tier sets a lower ceiling, that admits more than the tier allows. Check user-management's health and this service's logs for 'Failed to refresh per-tenant setting'. Tenants whose ceilings were read before the problem started keep their last-known values. Traffic for tenant names user-management does not know is counted separately (cause=unknown-tenant) and does not fire this alert."
        - alert: RateLimiterOverflowInUse
          expr: sum by (job) (increase({__name__=~"devicechain_[a-z0-9]+_ratelimit_overflow_admissions_total", namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "HTTP ingest is receiving traffic for more unconfirmed tenant names than it keeps separate allowances for"
            description: "{{ "{{ $labels.job }}" }} has had more than 1024 unconfirmed tenant names active at once, so every further name shares one allowance. Almost always this means something is posting to many invented tenant paths on the HTTP ingest port. Legitimate tenants that have been confirmed, and every MQTT, NATS and LwM2M tenant, keep their own allowance. Find the source of the requests on the HTTP ingest port."
        # `for` equals the window, never less than it: an increase that stops clears inside one
        # window, and one that goes on for a full window is a tenant shedding faster than its
        # letters are recorded, not a burst.
        - alert: ReactShedLettersOverBudget
          expr: sum by (job, action) (increase({__name__=~"devicechain_[a-z0-9]+_react_connector_shed_unlettered_total", namespace="{{ $ns }}"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Outbound connector actions shed at the source are being summarised rather than recorded one by one"
            description: "For at least 10 minutes, {{ "{{ $labels.job }}" }} has shed {{ "{{ $labels.action }}" }} actions faster than its dead-letter budget records them, so the excess is counted and summarised in one dead letter per tenant per minute instead of recorded individually. A tenant is well over its outbound ceiling. Find it with `dcctl dead-letters` (reason shed) and check its rules, or raise its outboundMessagesPerSecond / outboundBurst if the traffic is legitimate."
        # `for` is an hour: an upgrade drains the dispatches that were in flight before the
        # engine stamped trigger times, and those fall back legitimately for minutes, not hours.
        - alert: RateMeteringClockFallback
          expr: sum by (job, source) (increase({__name__=~"devicechain_[a-z0-9]+_rate_clock_fallback_total", namespace="{{ $ns }}", source!="capped"}[30m])) > 0
          for: 1h
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Outbound actions are being metered on a fallback clock"
            description: "For at least an hour, {{ "{{ $labels.job }}" }} has metered outbound actions on the {{ "{{ $labels.source }}" }} clock because they carried no trigger time. The detection engine has stopped stamping trigger times, so actions are metered on broker or arrival time and a catch-up after a restart can be shed as a flood again. An upgrade's in-flight backlog clears well inside the hour. Check that event-processing and outbound-connectors run the same release."
        # Only rate_limited. The connectors service's other terminal outcomes (dead, blocked,
        # invalid, unsupported) are one tenant's configuration -- a broken webhook, a private
        # destination -- already dead-lettered and listed by `dcctl dead-letters`, and paging
        # the operator on them would hand every tenant a switch for the operator's pager.
        # dead_write_failed is DeadLetterWriteLost's. rate_limited is different: the source
        # sheds over-quota actions before they are dispatched, so a sustained shed HERE means
        # the two ends disagree about the ceiling, which is an operator's configuration, or
        # that retries of failing sends are being charged a second time at this end.
        # `for` is 15m to match ReactConnectorEgressShedding: a burst the smoothing wait
        # cannot absorb is not a disagreement.
        - alert: ConnectorDispatchRateLimited
          expr: sum by (job, action) (rate(devicechain_outboundconnectors_connector_dispatch_total{outcome="rate_limited", namespace="{{ $ns }}"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The connectors service is shedding outbound actions the detection engine admitted"
            description: "For at least 15 minutes, {{ "{{ $labels.job }}" }} has shed {{ "{{ $labels.action }}" }} dispatches for being over their tenant's outbound rate. The detection engine meters the same ceiling on the same timeline and sheds over-quota actions before dispatching them, so these were admitted at one end and refused at the other: the two ends disagree about the ceiling. The usual cause is the platform default configured differently for event-processing and outbound-connectors (outboundMessagesPerSecond and outboundBurst must match), or one of them metering at the default because it cannot read tenant ceilings (see TenantsMeteredAtPlatformDefault), or sends that are failing and being retried, since every retry is metered again here and only once at the source. Each shed dispatch is dead-lettered with reason rate_limited; inspect them with `dcctl dead-letters`."
{{- end }}
