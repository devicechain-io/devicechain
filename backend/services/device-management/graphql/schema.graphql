    Machine-readable classification of the refusal. ALARM_NOT_FOUND, meaning the token names no
    alarm, is the only value today; acknowledgement is idempotent and independent of ACTIVE or
    CLEARED, so no alarm state refuses it. Branch on this rather than on reason, and treat unknown
    values as a refusal.
