#
# promtool UNIT TESTS for the bulk-change alerting rules.
#
# THE SERIES (registered only by a build that serves bulk changes, every one at zero
# from startup):
#
#   - devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds,
#     _deadline_lag_seconds, _reconciler_lag_seconds, _operations{dispatch}, _holds{code} and
#     _activated -- instance-wide gauges every replica computes from the database, read with
#     max() (min() for activated);
#   - devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds -- per pod;
#     the newest pass decides;
#   - devicechain_devicemanagement_bulk_change_fence_pending_total{action} -- a counter.
#
# The quiet cases carry as much weight as the firing ones: a replica whose refresh is stale,
# a healthy replica beside a silent one, holds other than the authority hold, a single
# FENCE_PENDING that was retried, and a build that exports none of these series.
#
# Generated once from the rule text (the annotations must match it exactly); edit by hand.
# Run via hack/check-prometheus-rules.sh, which renders the chart first and copies the
# rendered group in beside this file as rendered-rules.yaml.
rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  # Advancing: the age stays under five minutes. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0+10x25'
      - series: 'devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="dci-devicechain", pod="dc-device-management-bbbbb"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BulkChangesNotAdvancing
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesStalled
        exp_alerts: []

  # One replica reports six minutes without progress from 10m; the other, stale, reports 0. max() fires the warning after its minute, never the page.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0x9 360x30'
      - series: 'devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="dci-devicechain", pod="dc-device-management-bbbbb"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: BulkChangesNotAdvancing
        exp_alerts: []
      - eval_time: 12m
        alertname: BulkChangesNotAdvancing
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesnotadvancing"
              summary: "Bulk changes are not advancing"
              description: "A running bulk change with lines still to apply has gone more than five minutes without applying one, and no authority, activation or pending-control hold explains it. Read the bulk change's executor, holdCode and lastErrorCode. STALLED with POST_ERROR means a line keeps failing in a way that is retried (database contention, a timeout, a lost connection), and the bulk change pauses itself after 24 hours of that; a device held by another writer or a shared posting rate shows no hold. Look in the device-management logs for the error, and pause the bulk change if the cause will not clear soon."
      - eval_time: 20m
        alertname: BulkChangesStalled
        exp_alerts: []

  # Sixteen minutes without progress: both fire; the age falls back and both clear.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '960x20 0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: BulkChangesNotAdvancing
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesnotadvancing"
              summary: "Bulk changes are not advancing"
              description: "A running bulk change with lines still to apply has gone more than five minutes without applying one, and no authority, activation or pending-control hold explains it. Read the bulk change's executor, holdCode and lastErrorCode. STALLED with POST_ERROR means a line keeps failing in a way that is retried (database contention, a timeout, a lost connection), and the bulk change pauses itself after 24 hours of that; a device held by another writer or a shared posting rate shows no hold. Look in the device-management logs for the error, and pause the bulk change if the cause will not clear soon."
      - eval_time: 5m
        alertname: BulkChangesStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesstalled"
              summary: "Bulk changes have stalled"
              description: "A running bulk change with lines still to apply has gone more than fifteen minutes without applying one, and no authority, activation or pending-control hold explains it. Its executor reads STALLED. Read lastErrorCode and the device-management logs for why each attempt fails, fix the dependency, and pause the bulk change if it cannot be fixed now. Settling applied lines against device reports is separate and has its own deadline."
      - eval_time: 30m
        alertname: BulkChangesNotAdvancing
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesStalled
        exp_alerts: []

  # Another instance's bulk changes are stalled. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_oldest_runnable_line_age_seconds{namespace="dci-other", pod="dc-device-management-aaaaa"}'
        values: '960x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BulkChangesNotAdvancing
        exp_alerts: []
      - eval_time: 20m
        alertname: BulkChangesStalled
        exp_alerts: []

  # Running bulk changes and a driver that passes every minute. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_operations{namespace="dci-devicechain", pod="dc-device-management-aaaaa", dispatch="RUNNING"}'
        values: '1x30'
      - series: 'devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: BulkChangesDriverSilent
        exp_alerts: []

  # The only driver stops after its pass at 5m: the gap passes 60 s at 7m, and two minutes later it fires.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_operations{namespace="dci-devicechain", pod="dc-device-management-aaaaa", dispatch="RUNNING"}'
        values: '1x30'
      - series: 'devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0+60x5 300x25'
    alert_rule_test:
      - eval_time: 8m
        alertname: BulkChangesDriverSilent
        exp_alerts: []
      - eval_time: 9m
        alertname: BulkChangesDriverSilent
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesdriversilent"
              summary: "Bulk change drivers are silent"
              description: "Running bulk changes exist and no device-management pod has completed a bulk change driver pass in the last sixty seconds, for two minutes; their executor reads UNKNOWN. Check that the device-management pods are running and ready, and look in their logs for driver errors or database connection failures. Nothing is applied while the driver is silent, and lines continue where they stopped once a pod completes a pass."
      - eval_time: 20m
        alertname: BulkChangesDriverSilent
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesdriversilent"
              summary: "Bulk change drivers are silent"
              description: "Running bulk changes exist and no device-management pod has completed a bulk change driver pass in the last sixty seconds, for two minutes; their executor reads UNKNOWN. Check that the device-management pods are running and ready, and look in their logs for driver errors or database connection failures. Nothing is applied while the driver is silent, and lines continue where they stopped once a pod completes a pass."

  # One replica's driver stops, another keeps passing: the newest pass decides. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_operations{namespace="dci-devicechain", pod="dc-device-management-aaaaa", dispatch="RUNNING"}'
        values: '1x30'
      - series: 'devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0+60x5 300x25'
      - series: 'devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-bbbbb"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BulkChangesDriverSilent
        exp_alerts: []

  # A silent driver with nothing running. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_operations{namespace="dci-devicechain", pod="dc-device-management-aaaaa", dispatch="RUNNING"}'
        values: '0x30'
      - series: 'devicechain_devicemanagement_bulk_change_operations{namespace="dci-devicechain", pod="dc-device-management-aaaaa", dispatch="DISPATCHED"}'
        values: '3x30'
      - series: 'devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BulkChangesDriverSilent
        exp_alerts: []

  # A driver that has never completed a pass (0) while bulk changes run fires.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_operations{namespace="dci-devicechain", pod="dc-device-management-aaaaa", dispatch="RUNNING"}'
        values: '1x30'
      - series: 'devicechain_devicemanagement_bulk_change_driver_last_pass_timestamp_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: BulkChangesDriverSilent
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesdriversilent"
              summary: "Bulk change drivers are silent"
              description: "Running bulk changes exist and no device-management pod has completed a bulk change driver pass in the last sixty seconds, for two minutes; their executor reads UNKNOWN. Check that the device-management pods are running and ready, and look in their logs for driver errors or database connection failures. Nothing is applied while the driver is silent, and lines continue where they stopped once a pod completes a pass."

  # Authority unavailable for ten minutes from 2m fires after five; other holds never do.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_holds{namespace="dci-devicechain", pod="dc-device-management-aaaaa", code="AUTHORITY_UNAVAILABLE"}'
        values: '0x1 1x10 0x20'
      - series: 'devicechain_devicemanagement_bulk_change_holds{namespace="dci-devicechain", pod="dc-device-management-aaaaa", code="POST_ERROR"}'
        values: '1x30'
      - series: 'devicechain_devicemanagement_bulk_change_holds{namespace="dci-devicechain", pod="dc-device-management-aaaaa", code="RATE_LIMIT"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: BulkChangesAuthorityUnavailable
        exp_alerts: []
      - eval_time: 8m
        alertname: BulkChangesAuthorityUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesauthorityunavailable"
              summary: "Bulk change authority checks are unavailable"
              description: "A running bulk change has been held for five minutes because device-management cannot get a fresh answer from user-management on whether the person it runs for still holds the authority to apply it. Nothing is applied while it is held, and it is not paused. Check that user-management is running and reachable from device-management, and read its logs. Posting resumes on the first fresh answer; there is no way around the check."
      - eval_time: 25m
        alertname: BulkChangesAuthorityUnavailable
        exp_alerts: []

  # Authority unavailable for three minutes only. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_holds{namespace="dci-devicechain", pod="dc-device-management-aaaaa", code="AUTHORITY_UNAVAILABLE"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: BulkChangesAuthorityUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: BulkChangesAuthorityUnavailable
        exp_alerts: []

  # Settlement lags under fifteen minutes. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_deadline_lag_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '600x20'
      - series: 'devicechain_devicemanagement_bulk_change_reconciler_lag_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '800x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: BulkChangesSettlementLagging
        exp_alerts: []

  # The deadline pass is over fifteen minutes behind. Fires.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_deadline_lag_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '1000x20'
      - series: 'devicechain_devicemanagement_bulk_change_reconciler_lag_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: BulkChangesSettlementLagging
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangessettlementlagging"
              summary: "Bulk change settlement is lagging"
              description: "An applied bulk change line is more than fifteen minutes past its settlement deadline, or a device report that could settle one has waited more than fifteen minutes. Check the device-management logs for settlement task errors and the database for load. Applied lines are not lost while this lags; they settle once the tasks catch up. An applied line is not proof that the device took the change, so read its evidence before resolving it by hand."

  # The reconciler is over fifteen minutes behind. Fires.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_deadline_lag_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0x20'
      - series: 'devicechain_devicemanagement_bulk_change_reconciler_lag_seconds{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: BulkChangesSettlementLagging
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangessettlementlagging"
              summary: "Bulk change settlement is lagging"
              description: "An applied bulk change line is more than fifteen minutes past its settlement deadline, or a device report that could settle one has waited more than fifteen minutes. Check the device-management logs for settlement task errors and the database for load. Applied lines are not lost while this lags; they settle once the tasks catch up. An applied line is not proof that the device took the change, so read its evidence before resolving it by hand."

  # A control request keeps meeting FENCE_PENDING for twenty minutes: fires once it has lasted ten.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_fence_pending_total{namespace="dci-devicechain", pod="dc-device-management-aaaaa", action="PAUSE"}'
        values: '0+1x20 20x20'
      - series: 'devicechain_devicemanagement_bulk_change_fence_pending_total{namespace="dci-devicechain", pod="dc-device-management-aaaaa", action="ABORT"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: BulkChangesFencePending
        exp_alerts: []
      - eval_time: 13m
        alertname: BulkChangesFencePending
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesfencepending"
              summary: "Bulk change controls keep waiting for posts"
              description: "For ten minutes, pause, abort, resume or start requests have kept timing out (FENCE_PENDING) while waiting for in-flight posting to finish. Look for long-running posting transactions and lock waits in the database. Retry the request once the in-flight work drains and confirm the dispatch state afterwards: a FENCE_PENDING answer means the change did not happen."
      - eval_time: 35m
        alertname: BulkChangesFencePending
        exp_alerts: []

  # One FENCE_PENDING, retried successfully. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_fence_pending_total{namespace="dci-devicechain", pod="dc-device-management-aaaaa", action="PAUSE"}'
        values: '0x4 1x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: BulkChangesFencePending
        exp_alerts: []
      - eval_time: 15m
        alertname: BulkChangesFencePending
        exp_alerts: []

  # Activated on every replica. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_activated{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '1x30'
      - series: 'devicechain_devicemanagement_bulk_change_activated{namespace="dci-devicechain", pod="dc-device-management-bbbbb"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: BulkChangesNotActivated
        exp_alerts: []

  # Not activated from 1m: fires after fifteen minutes.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_activated{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '1x1 0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: BulkChangesNotActivated
        exp_alerts: []
      - eval_time: 17m
        alertname: BulkChangesNotActivated
        exp_alerts:
          - exp_labels:
              severity: critical
              devicechain_instance: devicechain
            exp_annotations:
              runbook_url: "https://docs.devicechain.io/deployment/alert-runbook#bulkchangesnotactivated"
              summary: "Bulk changes are not activated"
              description: "For fifteen minutes the database has not enforced the device attribute writer protocol that bulk changes post under, or its state could not be read. Starting and resuming are refused and running bulk changes hold (NOT_ACTIVATED). Check that device-management's database migrations completed and that the enforcing trigger on the device attribute table is installed and enabled. Do not turn enforcement off to let posting proceed."

  # Not activated for ten minutes, then restored. Quiet.
  - interval: 1m
    input_series:
      - series: 'devicechain_devicemanagement_bulk_change_activated{namespace="dci-devicechain", pod="dc-device-management-aaaaa"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BulkChangesNotActivated
        exp_alerts: []
      - eval_time: 25m
        alertname: BulkChangesNotActivated
        exp_alerts: []

  # No bulk-change series at all (a build that does not serve bulk changes). Quiet.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: BulkChangesAuthorityUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesDriverSilent
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesFencePending
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesNotActivated
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesNotAdvancing
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesSettlementLagging
        exp_alerts: []
      - eval_time: 30m
        alertname: BulkChangesStalled
        exp_alerts: []
