rule_files:
  - rendered-rules.yaml
evaluation_interval: 1m
tests:

  # NotificationClearPickupFailing: sustained failures, pending window, burst, healthy and isolation cases.
  - interval: 1m
    input_series:
    - series: devicechain_notificationmanagement_escalation_scheduler_passes_total{namespace="dci-devicechain", outcome="failed"}
      values: 0+1x40
    alert_rule_test:
    - eval_time: 9m
      alertname: NotificationClearPickupFailing
      exp_alerts: []
    - eval_time: 20m
      alertname: NotificationClearPickupFailing
      exp_alerts:
      - exp_labels:
          severity: warning
          devicechain_instance: devicechain
        exp_annotations:
          runbook_url: https://docs.devicechain.io/deployment/alert-runbook#notificationclearpickupfailing
          summary: Notification escalation and clear pickup passes are failing
          description: For 10 minutes, the notification scheduler has reported hard failures while re-paging alarms
            or delivering pending clear notifications. Clear notifications may be delayed even though escalation already
            stopped. Check notification-management logs for announcing pending clears failed, channel reachability
            and credentials, and database errors. Partial passes that deliver clears and leave a backlog for the next
            tick do not trigger this alert.
  - interval: 1m
    input_series: []
    alert_rule_test:
    - eval_time: 20m
      alertname: NotificationClearPickupFailing
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: devicechain_notificationmanagement_escalation_scheduler_passes_total{namespace="dci-devicechain", outcome="failed"}
      values: 0+0x40
    alert_rule_test:
    - eval_time: 20m
      alertname: NotificationClearPickupFailing
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: devicechain_notificationmanagement_escalation_scheduler_passes_total{namespace="another-instance", outcome="failed"}
      values: 0+1x40
    alert_rule_test:
    - eval_time: 20m
      alertname: NotificationClearPickupFailing
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: devicechain_notificationmanagement_escalation_scheduler_passes_total{namespace="dci-devicechain", outcome="failed"}
      values: 0+0x5 1+0x35
    alert_rule_test:
    - eval_time: 20m
      alertname: NotificationClearPickupFailing
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: devicechain_notificationmanagement_escalation_scheduler_passes_total{namespace="dci-devicechain", outcome="partial"}
      values: 0+1x40
    alert_rule_test:
    - eval_time: 20m
      alertname: NotificationClearPickupFailing
      exp_alerts: []
