syntax="proto3";

option go_package = "/proto";

package io.devicechain.eventsources;

/**
 * Unresolved event that has been decoded by
 * an event source.
 */
message PUnresolvedEvent {
    string source_id = 1;
    optional string alt_id = 2;
    string device = 3;
    optional string relationship = 4;
    // The two envelope instants, each written in exactly ONE of two forms. The usual form is
    // occurred / processed (14 / 15): nanoseconds since the Unix epoch, nine bytes on the wire
    // with the tag. An instant outside what that count holds (before 1677 or after 2262: a
    // device clock can report one, and only resolution bounds it) is written here instead,
    // as an RFC 3339 string at full precision, which is also how every message written
    // before the numeric form existed carries it. A reader takes the number when it is
    // present and this string otherwise.
    string occurred_time = 5;
    string processed_time = 6;
    int64 event_type = 7;
    bytes payload = 8;
    // Credential presented by the connecting device (ADR-014). Used to
    // authenticate the device at the ingest->resolve boundary; absent when the
    // transport is trusted or authentication is disabled.
    optional string credential_type = 9;
    optional string credential_id = 10;
    // The presented secret SEALED for the hop to the resolver (never as the device sent
    // it: this message is stored for the stream's retention period). A value that is not
    // a sealed secret for this credential, such as a plaintext from a message written
    // before sealing, authenticates nothing.
    //
    // 🔴 READ ONLY: this is the TEXT form of the seal, written by producers before the
    // binary form (sealed_secret, 16) replaced it. A producer never writes it; a reader still
    // accepts it so a message already on the stream across an upgrade authenticates. Reserve
    // it once no stream can hold a message that old.
    optional string credential_secret = 11;
    // Set by an internal ingest source that authenticated the device at the
    // TRANSPORT (LwM2M DTLS-PSK / Sparkplug broker) upstream, so the device
    // presents no per-event credential. The resolver trusts the self-asserted
    // device token on such an event under deviceAuthMode=required (ADR-025 confines
    // inbound-events publish to the service account, so this is not device-forgeable
    // — see resolveDevice). NEVER set from device-controlled input.
    bool authenticated_transport = 12;
    // The ACCESS_TOKEN credential id SEALED for the hop to the resolver. A bearer token is the
    // credential, so it never crosses this stream as the device sent it; credential_id is left
    // empty for that credential type. A value that does not open for this tenant and credential
    // type, or a clear token left in a message from before sealing, is refused as unauthenticated.
    //
    // 🔴 READ ONLY, like credential_secret (11): the text form of the seal, replaced by the
    // binary sealed_token (17).
    optional string sealed_credential_id = 13;
    // The envelope instants as nanoseconds since the Unix epoch (see occurred_time, 5).
    // Fixed-width, because a present-day count needs nine varint bytes and eight fixed ones.
    // optional so an instant of exactly the epoch is still written: absence means the
    // instant is in the string form.
    optional sfixed64 occurred = 14;
    optional sfixed64 processed = 15;
    // The presented secret SEALED for the hop to the resolver, in the seal's binary form
    // (credential.SecretTransit). Same rule as credential_secret (11), which it replaces:
    // a value that is not a sealed secret for this credential authenticates nothing.
    optional bytes sealed_secret = 16;
    // The ACCESS_TOKEN credential id SEALED for the hop to the resolver, in the seal's binary
    // form. Same rule as sealed_credential_id (13), which it replaces.
    optional bytes sealed_token = 17;
    // Set ONLY by event-sources' capture source: the device is the one the platform MQTT
    // broker authenticated at CONNECT and confined to this topic, so the event presents no
    // per-event credential (and a body that carries one is refused before it gets here). The
    // resolver trusts the topic-derived device token on such an event under
    // deviceAuthMode=required, for every event type. Distinct from authenticated_transport
    // (12), whose trust is confined to the event types the LwM2M and Sparkplug services emit.
    // NEVER set from device-controlled input, and NEVER by an external-broker source.
    bool broker_asserted = 18;
    // gateway is the token of the GATEWAY device the platform MQTT broker authenticated, set only
    // when the event arrived on that gateway's own subject namespace
    // ("{instance}.{tenant}.gateways.{gateway}.devices.{device}.events"). Then device (the
    // subject's child) is the one the gateway claims to speak for, and the resolver accepts it
    // only if the device's gateway assignment names this gateway. Empty on every other event.
    // Same trust rule as broker_asserted: NEVER set from device-controlled input, and NEVER by an
    // external-broker or HTTP source.
    string gateway = 19;
    // integration is the token of the inbound integration (a LoRaWAN network server or a webhook
    // sender) that delivered this event over HTTP, set only by event-sources' integration route
    // after it authenticated the sender's bearer token. The resolver re-authenticates it with
    // sealed_integration_token (21), checks the device's type is in the integration's scope, and
    // only then trusts the device token. Empty on every other event.
    // NEVER set from device-controlled input, and NEVER by any other source.
    string integration = 20;
    // The integration's bearer token SEALED for the hop to the resolver (credential.SecretTransit,
    // bound to the tenant and to the integration token). It never crosses this stream as the
    // sender presented it. A value that does not open for this tenant and integration is refused
    // as unauthenticated.
    optional bytes sealed_integration_token = 21;
    // integration_identifier is the sender's own name for the device, as the integration route
    // resolved it to the device in this event (a DevEUI, a TTS device id, a webhook id), in the
    // canonical spelling. The resolver requires the device to hold an alias under the integration's
    // scheme with exactly this value NOW, so an alias removed or moved after the route cached its
    // answer refuses the event instead of storing it on the old device. Set only with integration.
    // NEVER set from device-controlled input, and NEVER by any other source.
    string integration_identifier = 22;
}

/**
 * Payload for creating a new relationship. The target is a uniform (type, token)
 * reference (ADR-013).
 */
message PUnresolvedNewRelationshipPayload {
    string relationship_type = 1;
    string target_type = 2;
    string target = 3;
}

/**
 * Single location entry for a location payload.
 */
message PUnresolvedLocationEntry {
    optional string latitude = 1;
    optional string longitude = 2;
    optional string elevation = 3;
    optional string occurred_time = 4;
    optional string accuracy = 5;
    optional string speed = 6;
    optional string heading = 7;
    // The sample's own instant as nanoseconds since the Unix epoch. An entry carries its time
    // in at most one form: this one, or occurred_time as an RFC 3339 string for an instant
    // this count cannot hold and for a message written before the numeric form existed.
    // Neither present: the device timed only the message.
    optional sfixed64 occurred = 8;
}

/**
 * Payload for a location event.
 */
message PUnresolvedLocationsPayload {
    repeated PUnresolvedLocationEntry entries = 1;
}

/**
 * Single measurement entry for a measurement payload.
 */
message PUnresolvedMeasurementsEntry {
    map<string, string> measurements = 1;
    optional string occurred_time = 2;
    // The sample's own instant as nanoseconds since the Unix epoch. An entry carries its time
    // in at most one form: this one, or occurred_time as an RFC 3339 string for an instant
    // this count cannot hold and for a message written before the numeric form existed.
    // Neither present: the device timed only the message.
    optional sfixed64 occurred = 3;
}

/**
 * Payload for a measurement event.
 */
message PUnresolvedMeasurementsPayload {
    repeated PUnresolvedMeasurementsEntry entries = 1;
}

/**
 * Single alert entry for an alerts payload.
 */
message PUnresolvedAlertEntry {
    string type = 1;
    uint32 level = 2;
    string message = 3;
    string source = 4;
    optional string occurred_time = 5;
    // The sample's own instant as nanoseconds since the Unix epoch. An entry carries its time
    // in at most one form: this one, or occurred_time as an RFC 3339 string for an instant
    // this count cannot hold and for a message written before the numeric form existed.
    // Neither present: the device timed only the message.
    optional sfixed64 occurred = 6;
}

/**
 * Payload for an alert event.
 */
message PUnresolvedAlertsPayload {
    repeated PUnresolvedAlertEntry entries = 1;
}

/**
 * Payload for a device presence state-change event (ADR-067). session_id is a
 * producer-supplied monotonic session id (a host-observed connect epoch) carried
 * as a string to survive a JSON decode without precision loss.
 */
message PUnresolvedStateChangePayload {
    string state = 1;
    string reason = 2;
    string session_id = 3;
    optional string occurred_time = 4;
    // Compare-and-set precondition on the projection's stored session; empty when the
    // producer makes no claim, which is every transport advisory. Carried as a string
    // for the same precision reason as session_id. Appended as a NEW field number so
    // an in-flight event written by an older producer still decodes.
    string expected_session_id = 5;
}
