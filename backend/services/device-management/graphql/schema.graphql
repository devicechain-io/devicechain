# Contains queries executed against model.
type Query {
    # Find device types by unique id.
    deviceTypesById(ids: [ID!]!): [DeviceType!]!
    # Find device types by unique token.
    deviceTypesByToken(tokens: [String!]!): [DeviceType!]!
    # List device types that meet criteria.
    deviceTypes(criteria: DeviceTypeSearchCriteria!): DeviceTypeSearchResults!
    # Find device profiles by unique id.
    deviceProfilesById(ids: [ID!]!): [DeviceProfile!]!
    # Find device profiles by unique token.
    deviceProfilesByToken(tokens: [String!]!): [DeviceProfile!]!
    # List device profiles that meet criteria.
    deviceProfiles(criteria: DeviceProfileSearchCriteria!): DeviceProfileSearchResults!
    # List a device profile's published versions, newest first (ADR-045 versioning).
    deviceProfileVersions(token: String!): [DeviceProfileVersion!]!
    # The distinct non-empty values a discovery facet currently holds across the
    # tenant's device types / profiles — the suggestions offered under the free-text
    # facet inputs (ADR-045 decision 8). Sorted; empty until values are in use.
    facetValues(facet: DeviceFacet!): [String!]!
    # List the tenant's declared facet keys, optionally for one member family
    # (ADR-061 G2). Powers the console browse/filter axis picker + typeahead.
    facetKeys(criteria: FacetKeySearchCriteria!): FacetKeySearchResults!
    # Find metric definitions by unique id.
    metricDefinitionsById(ids: [ID!]!): [MetricDefinition!]!
    # Find metric definitions by unique token.
    metricDefinitionsByToken(tokens: [String!]!): [MetricDefinition!]!
    # List metric definitions that meet criteria.
    metricDefinitions(criteria: MetricDefinitionSearchCriteria!): MetricDefinitionSearchResults!
    # Find command definitions by unique id.
    commandDefinitionsById(ids: [ID!]!): [CommandDefinition!]!
    # Find command definitions by unique token.
    commandDefinitionsByToken(tokens: [String!]!): [CommandDefinition!]!
    # List command definitions that meet criteria.
    commandDefinitions(criteria: CommandDefinitionSearchCriteria!): CommandDefinitionSearchResults!
    # Decide whether a command may be enqueued to a device (ADR-043 decision 3):
    # resolves device -> its profile's active PUBLISHED command vocabulary -> the
    # definition for commandKey, and validates the payload against its parameter
    # schema. Answers device existence, unknown command key, and payload validity in
    # one hop. A profile declaring no vocabulary allows free-form payloads (decision 4).
    validateCommandEnqueue(deviceToken: String!, commandKey: String!, payload: String): CommandEnqueueVerdict!
    # Decide the same question for MANY devices at once — the gate a fleet-wide command
    # write runs through. One command key and one payload apply to every device, so the
    # verdict depends only on each device's TYPE: the devices resolve in one lookup and
    # each distinct type's published vocabulary is resolved once, rather than once per
    # device.
    #
    # It answers with REFUSALS ONLY. A device that may receive the command produces no
    # entry, so a healthy fleet's answer is the empty list and the response scales with
    # the problems rather than with the fleet — but it also means silence is consent, so
    # send only tokens you intend to enqueue to. Duplicate tokens are collapsed and
    # refusals come back in the order each device was first named.
    #
    # The refusal codes are exactly validateCommandEnqueue's, never a batch-specific set,
    # so a device refused here is refused there for the same stated reason.
    validateCommandEnqueueBatch(deviceTokens: [String!]!, commandKey: String!, payload: String): [BatchEnqueueRefusal!]!
    # Resolve one page of the devices an entity group collects, for use as a command
    # target. Walk it by passing the previous page's nextCursor as afterId; a null
    # nextCursor means the group is exhausted.
    #
    # It is a KEYSET walk rather than page-number paging, and that is a correctness
    # difference: with offset paging, a device leaving the group between two pages shifts
    # every later row down a slot, so a device that was a member throughout is never
    # visited — it would receive no command and appear in no refusal list. A cursor
    # cannot skip a row that stays in the set. What a walk can still miss is a device
    # that JOINS below the cursor after it has passed, which is the honest semantic: the
    # target set is the group's membership as of the moment the walk began.
    #
    # A dynamic group resolves its FROZEN published version — the group's draft selector
    # is mutable, and a fleet actuation must not follow whatever someone last typed.
    # Name a version to pin one explicitly; omit it for the active published version.
    #
    # Three conditions come back as rejected=true with a code rather than as errors,
    # because each is a decided fact about the request the caller can act on: the group
    # does not exist, it collects something other than devices, or it is a dynamic group
    # that has never been published (so it has no frozen rule to fire at).
    resolveDeviceGroupTargets(groupToken: String!, version: Int, afterId: String, limit: Int!): DeviceGroupTargetPage!
    # List the commands a device currently accepts (ADR-043 decision 3) — the listing
    # counterpart of validateCommandEnqueue, which is ask-don't-list. Both are answered
    # from the same resolution, so what this offers is what the gate accepts.
    #
    # Null when the token resolves to no device. That is a normal state rather than a
    # caller error: a dashboard or saved view can hold a token whose device was since
    # deleted, and erroring would take the rest of a batched query down with it. It
    # matches devicesByToken, which omits tokens it cannot resolve.
    deviceCommandVocabulary(deviceToken: String!): DeviceCommandVocabulary
    # Answer "does THIS device report its position?" (ADR-078) in one hop: resolves
    # device -> its type -> its profile's active PUBLISHED version -> the position
    # declaration frozen into it. The published resolution is the point — the draft on
    # DeviceProfile.location is what an author is editing, not what a device resolves.
    #
    # Null when the token resolves to no device, matching deviceCommandVocabulary: a
    # saved view can outlive its device, and erroring would null out every sibling in a
    # batched document. A real device that declares nothing answers `declared: false`,
    # which is a different fact and stays distinguishable from this null.
    deviceLocationDeclaration(deviceToken: String!): DeviceLocationCapability
    # Find detection rules by unique id.
    detectionRulesById(ids: [ID!]!): [DetectionRule!]!
    # Find detection rules by unique token.
    detectionRulesByToken(tokens: [String!]!): [DetectionRule!]!
    # List detection rules that meet criteria.
    detectionRules(criteria: DetectionRuleSearchCriteria!): DetectionRuleSearchResults!
    # Find geofences by unique id.
    geoFencesById(ids: [ID!]!): [GeoFence!]!
    # Find geofences by unique token.
    geoFencesByToken(tokens: [String!]!): [GeoFence!]!
    # List geofences that meet criteria.
    geoFences(criteria: GeoFenceSearchCriteria!): GeoFenceSearchResults!
    # The tenant's active fence-set version — the number stamped onto resolved location
    # events, naming the frozen snapshot of the fences live at that moment. A change to the
    # fence SET mints the next one — a fence created, a boundary edited, a fence deleted.
    # Renaming a fence, or editing its description or metadata, does not: none of them appear
    # in the frozen snapshot, so a new version would name shapes identical to the current one.
    # 0 means the tenant has never had a fence, which is distinct from a minted version whose
    # fence set happens to be empty.
    currentFenceSetVersion: Int!
    # The FROZEN fence set of one fence-set version — the fences that were live when an
    # event stamped with that version was resolved. This is how a consumer resolves a
    # version it no longer holds in memory: an authoring preview replaying last week, a
    # late redelivery, a cold start. An unknown non-zero version is an error, because a
    # stamp naming a version that is not on record means the history was truncated and
    # answering "empty" would read as "no fences" rather than "cannot know".
    geoFenceSetSnapshot(version: Int!): GeoFenceSetSnapshot!
    # The frozen fence set of the tenant's CURRENT version — the version and its fences
    # read together, so the two cannot disagree across a concurrent fence edit.
    #
    # That guarantee holds WITHIN one response. A caller reading a multi-page fence set
    # must take page 1 from here and every later page from geoFenceSetSnapshot at the
    # version this one reported: asking here twice is two questions about a moving target,
    # and a fence edit between them yields two pages of two different sets stitched
    # together under one version number.
    currentGeoFenceSet: GeoFenceSetSnapshot!
    # The manifest of one fence-set version: which fences it held and the content address
    # of each one's geometry. Unlike geoFenceSetSnapshot this reads no geometry at all, so
    # it is a fixed cost per fence and needs no pagination.
    #
    # An unknown POSITIVE version is an error, for the same reason geoFenceSetSnapshot gives:
    # a stamp naming a version that is not on record means the history was truncated, and
    # answering "empty" would read as "no fences" rather than "cannot know". A negative
    # version is refused outright rather than sharing version 0's known-empty answer.
    geoFenceSetManifest(version: Int!): GeoFenceSetManifest!
    # The manifest of the tenant's CURRENT version — the version and its fences read from
    # one row, so the two cannot disagree across a concurrent fence edit. Reading the
    # version and the manifest as two queries would be two questions about a moving target.
    currentGeoFenceSetManifest: GeoFenceSetManifest!
    # The archived geometry documents stored under the given content addresses.
    #
    # An address this tenant does not hold is ABSENT from the result rather than an error:
    # the question is "which of these do you have?", and the set of answers is the answer.
    # Incompleteness is the caller's to interpret — a caller resolving a manifest must turn
    # a missing body into a fence that reports an ERROR, never one that is silently absent,
    # because an absent fence reads downstream as "this fence does not exist" and makes
    # containment answer "outside" for a device that is inside.
    #
    # Asking for more addresses than the per-request limit is an error rather than a partial
    # answer: a caller that asked for forty and silently received twenty-four could not tell
    # that from a tenant holding only twenty-four of them.
    geoFenceGeometry(hashes: [String!]!): [GeoFenceGeometry!]!
    # Find raised alarms by unique id.
    alarmsById(ids: [ID!]!): [Alarm!]!
    # Find raised alarms by unique token.
    alarmsByToken(tokens: [String!]!): [Alarm!]!
    # List raised alarms that meet criteria.
    alarms(criteria: AlarmSearchCriteria!): AlarmSearchResults!
    # List entity attributes that meet criteria.
    entityAttributes(criteria: EntityAttributeSearchCriteria!): EntityAttributeSearchResults!
    # Query the audit journal (ADR-019); tenant-scoped, newest first.
    auditEvents(criteria: AuditEventSearchCriteria!): AuditEventSearchResults!
    # Find devices by unique id.
    devicesById(ids: [ID!]!): [Device!]!
    # Find devices by unique token.
    devicesByToken(tokens: [String!]!): [Device!]!
    # Find devices by customer-owned external id (ADR-049).
    devicesByExternalId(externalIds: [String!]!): [Device!]!
    # List devices that meet criteria.
    devices(criteria: DeviceSearchCriteria!): DeviceSearchResults!
    # Find entity groups by unique id.
    entityGroupsById(ids: [ID!]!): [EntityGroup!]!
    # Find entity groups by unique token.
    entityGroupsByToken(tokens: [String!]!): [EntityGroup!]!
    # List entity groups that meet criteria (optionally by member family / mode).
    entityGroups(criteria: EntityGroupSearchCriteria!): EntityGroupSearchResults!
    # Evaluate a CANDIDATE dynamic-group selector for a member family WITHOUT saving
    # it — the console's live "matches N" authoring preview (ADR-061 G4 §4). Takes the
    # identical publish gate + lowering + bounded query as a saved dynamic group, so
    # the preview is exactly what the group would resolve. A non-lowerable / over-budget
    # / malformed selector returns valid=false with an inline error, never a hard fault.
    previewSelector(memberType: String!, selector: String!, pagination: PaginationInput!): SelectorPreview!
    # List a dynamic entity group's published versions, newest first (ADR-062 S1).
    entityGroupVersions(token: String!): [EntityGroupVersion!]!
    # Find device credentials by unique id.
    deviceCredentialsById(ids: [ID!]!): [DeviceCredential!]!
    # Find device credentials by unique token.
    deviceCredentialsByToken(tokens: [String!]!): [DeviceCredential!]!
    # List device credentials that meet criteria.
    deviceCredentials(criteria: DeviceCredentialSearchCriteria!): DeviceCredentialSearchResults!
    # List device-replacement records, newest first, optionally narrowed to one
    # device. There is no by-id or by-token door: a replacement is never addressed
    # on its own, only read as part of a device's history.
    deviceReplacements(criteria: DeviceReplacementSearchCriteria!): DeviceReplacementSearchResults!
    # The asset directly above this one in the hierarchy, or null when it is a
    # root. A root is a normal state, not an error.
    assetParent(token: String!): Asset
    # The path from an asset to its root, NEAREST ANCESTOR FIRST - the order a
    # breadcrumb is built from.
    assetAncestors(token: String!): [Asset!]!
    # A page of the assets directly below a parent. Omit parentToken to page the
    # ROOTS of the tree; a tree browser asks the same question at every level.
    assetChildren(parentToken: String, pagination: PaginationInput!): AssetSearchResults!
    # Find provisioning profiles by unique id.
    provisioningProfilesById(ids: [ID!]!): [ProvisioningProfile!]!
    # Find provisioning profiles by unique token.
    provisioningProfilesByToken(tokens: [String!]!): [ProvisioningProfile!]!
    # List provisioning profiles that meet criteria.
    provisioningProfiles(criteria: ProvisioningProfileSearchCriteria!): ProvisioningProfileSearchResults!
    # Get a device's current possession claim, or null if it has none.
    deviceClaim(deviceToken: String!): DeviceClaim

    # Find entity relationship types by unique id.
    entityRelationshipTypesById(ids: [String!]!): [EntityRelationshipType!]!
    # Find entity relationship types by unique token.
    entityRelationshipTypesByToken(tokens: [String!]!): [EntityRelationshipType!]!
    # List entity relationship types that meet criteria.
    entityRelationshipTypes(criteria: EntityRelationshipTypeSearchCriteria!): EntityRelationshipTypeSearchResults!
    # Find entity relationships by unique id.
    entityRelationshipsById(ids: [String!]!): [EntityRelationship!]!
    # Find entity relationships by unique token.
    entityRelationshipsByToken(tokens: [String!]!): [EntityRelationship!]!
    # List entity relationships that meet criteria.
    entityRelationships(criteria: EntityRelationshipSearchCriteria!): EntityRelationshipSearchResults!
    # Return the subset of the given (type, id) references that resolve to an
    # existing entity in the caller's tenant (ADR-044 decision 3). The
    # event-management reconciliation sweep uses this to find orphaned anchors whose
    # referenced entity was deleted.
    existingEntityRefs(refs: [EntityRefInput!]!): [EntityRef!]!

    # Find asset types by unique id.
    assetTypesById(ids: [ID!]!): [AssetType!]!
    # Find asset types by unique token.
    assetTypesByToken(tokens: [String!]!): [AssetType!]!
    # List asset types that meet criteria.
    assetTypes(criteria: AssetTypeSearchCriteria!): AssetTypeSearchResults!
    # Find assets by unique id.
    assetsById(ids: [ID!]!): [Asset!]!
    # Find assets by unique token.
    assetsByToken(tokens: [String!]!): [Asset!]!
    # List assets that meet criteria.
    assets(criteria: AssetSearchCriteria!): AssetSearchResults!
    # An asset type's published property-contract versions, newest first.
    assetTypeVersions(token: String!): [AssetTypeVersion!]!
    # The version an asset of this type is currently validated against, or null when
    # the type has never been published.
    activeAssetTypeVersion(token: String!): AssetTypeVersion

    # Find customer types by unique id.
    customerTypesById(ids: [ID!]!): [CustomerType!]!
    # Find customer types by unique token.
    customerTypesByToken(tokens: [String!]!): [CustomerType!]!
    # List customer types that meet criteria.
    customerTypes(criteria: CustomerTypeSearchCriteria!): CustomerTypeSearchResults!
    # Find customers by unique id.
    customersById(ids: [ID!]!): [Customer!]!
    # Find customers by unique token.
    customersByToken(tokens: [String!]!): [Customer!]!
    # List customers that meet criteria.
    customers(criteria: CustomerSearchCriteria!): CustomerSearchResults!

    # Find area types by unique id.
    areaTypesById(ids: [ID!]!): [AreaType!]!
    # Find area types by unique token.
    areaTypesByToken(tokens: [String!]!): [AreaType!]!
    # List area types that meet criteria.
    areaTypes(criteria: AreaTypeSearchCriteria!): AreaTypeSearchResults!
    # Find areas by unique id.
    areasById(ids: [ID!]!): [Area!]!
    # Find areas by unique token.
    areasByToken(tokens: [String!]!): [Area!]!
    # List areas that meet criteria.
    areas(criteria: AreaSearchCriteria!): AreaSearchResults!
}

# Contains mutations executed against model.
type Mutation {
    # Create a new device type.
    createDeviceType(request: DeviceTypeCreateRequest): DeviceType!
    # Update an existing device type.
    updateDeviceType(token: String!, request: DeviceTypeUpdateRequest!): DeviceType!
    # Delete a device type. Refused while any device references it. Its capability
    # definitions live on the DeviceProfile now (ADR-045), which survives. Returns
    # whether a row was deleted.
    deleteDeviceType(token: String!): Boolean!
    # Create a new device profile (ADR-045).
    createDeviceProfile(request: DeviceProfileCreateRequest): DeviceProfile!
    # Update an existing device profile, located by the token argument (ADR-045).
    updateDeviceProfile(token: String!, request: DeviceProfileCreateRequest): DeviceProfile!
    # Delete a device profile (ADR-045). Refused while any device type references
    # it; its owned metric, command, and detection-rule definitions are cascade-removed.
    # Returns whether a row was deleted.
    deleteDeviceProfile(token: String!): Boolean!
    # Publish the profile's current draft as a new immutable version and make it the
    # version devices resolve (ADR-045 versioning). label/description are optional.
    publishDeviceProfile(token: String!, label: String, description: String): DeviceProfileVersion!
    # Re-point the profile's active published version at an existing version — a
    # non-destructive rollback; the draft is untouched. Returns the updated profile.
    rollbackDeviceProfile(token: String!, version: Int!): DeviceProfile!
    # Create a new metric definition.
    createMetricDefinition(request: MetricDefinitionCreateRequest): MetricDefinition!
    # Update an existing metric definition.
    updateMetricDefinition(token: String!, request: MetricDefinitionUpdateRequest!): MetricDefinition!
    # Delete a single metric definition.
    deleteMetricDefinition(token: String!): Boolean!
    # Create a new command definition.
    createCommandDefinition(request: CommandDefinitionCreateRequest): CommandDefinition!
    # Update an existing command definition.
    updateCommandDefinition(token: String!, request: CommandDefinitionUpdateRequest!): CommandDefinition!
    # Delete a single command definition.
    deleteCommandDefinition(token: String!): Boolean!
    # Create a new detection rule.
    createDetectionRule(request: DetectionRuleCreateRequest!): DetectionRule!
    # Update an existing detection rule.
    updateDetectionRule(token: String!, request: DetectionRuleUpdateRequest!): DetectionRule!
    # Delete a single detection rule.
    deleteDetectionRule(token: String!): Boolean!
    # Create a new geofence. Takes device:write AND location:read: a fence is a question about
    # where a device is, and whoever can shape the question can extract the answer — a caller able
    # to mint fences can narrow one until a containment rule's raise/resolve edge reveals a
    # device's actual coordinates. Reading fences stays on device:read, since a fence's geometry
    # is a region someone drew, not a device's position.
    createGeoFence(request: GeoFenceCreateRequest!): GeoFence!
    # Update an existing geofence. Same authorities as creation, for the same reason: reshaping a
    # fence is the same question-shaping primitive as minting one. The request's `token` must
    # equal the `token` argument: a fence's token is immutable, because rules name fences by
    # token and this service cannot rewrite the rules that would be left naming nothing.
    updateGeoFence(token: String!, request: GeoFenceUpdateRequest!): GeoFence!
    # Delete a single geofence. device:write alone — removing a fence constructs no question and
    # answers none, and delete-then-recreate is no way around the gate on creation.
    deleteGeoFence(token: String!): Boolean!
    # Acknowledge a raised alarm (operator action). The acknowledging identity is the
    # authenticated subject, recorded server-side — not a client-supplied value.
    acknowledgeAlarm(token: String!): Alarm!
    # Acknowledge many raised alarms at once — the fan-out counterpart of acknowledgeAlarm, for
    # an operator working through an alarm storm. Same authority, same transition, and the same
    # server-side acknowledging identity.
    #
    # 🔑 IT IS PARTIAL. A token naming no alarm is REFUSED and named in `refusals`; every other
    # alarm is still acknowledged. A stale selection is the normal case here — alarms are being
    # erased and devices deleted while an operator works — so refusing the whole request over one
    # vanished row would leave no way to make progress but to bisect the list by hand.
    #
    # 🔴 AN EMPTY LIST ACKNOWLEDGES NOTHING. It is not "all alarms" and never has been.
    #
    # At most 2000 tokens per request. Over that is a GraphQL ERROR rather than a refusal list:
    # it is a fault in how the caller chunked its work, not a verdict about any alarm. Duplicate
    # tokens are collapsed and both result lists come back in the order each token was first
    # named, so the answer is a deterministic function of the request.
    acknowledgeAlarms(tokens: [String!]!): BulkAcknowledgeAlarmsResult!
    # Clear a raised alarm (manual operator override).
    clearAlarm(token: String!): Alarm!
    # Set (upsert) an entity attribute.
    setEntityAttribute(request: EntityAttributeSetRequest!): EntityAttribute!
    # Delete an entity attribute by its natural key.
    deleteEntityAttribute(entityType: String!, entity: String!, scope: String!, attrKey: String!): Boolean!
    # Create a new device.
    createDevice(request: DeviceCreateRequest): Device!
    # Create many devices in one transaction from a template (bulk fleet
    # provisioning): the server renders count devices from the token/name/
    # external-id templates and creates them all-or-nothing.
    createDevices(request: DeviceBulkCreateRequest!): [Device!]!
    # Update an existing device.
    updateDevice(token: String!, request: DeviceUpdateRequest!): Device!
    # Delete a device, cascade-removing its credentials and relationship edges.
    deleteDevice(token: String!): Boolean!
    # Create a new entity group (ADR-061). A static group's members are managed over
    # "member" relationship edges; a dynamic group carries a CEL selector and resolves
    # its members eval-on-read (validated + cost-gated at create).
    createEntityGroup(request: EntityGroupCreateRequest): EntityGroup!
    # Update an existing entity group's presentation fields (member family + mode
    # are immutable).
    updateEntityGroup(token: String!, request: EntityGroupUpdateRequest!): EntityGroup!
    # Delete an entity group, its relationship edges, and its frozen versions.
    # Refused (ErrEntityInUse) while a detection rule scopes to the group (ADR-062).
    deleteEntityGroup(token: String!): Boolean!
    # Publish a DYNAMIC entity group's current draft selector as a new immutable
    # version and make it the active version a rule-scoped resolve reads (ADR-062 S1).
    # label/description are optional. Rejected for a static group.
    publishEntityGroup(token: String!, label: String, description: String): EntityGroupVersion!
    # Re-point a dynamic group's active version at an existing version — a
    # non-destructive rollback; the draft is untouched. Returns the updated group.
    rollbackEntityGroup(token: String!, version: Int!): EntityGroup!
    # Declare (upsert) a facet key by its natural key (memberType, key) — ADR-061 G2.
    setFacetKey(request: FacetKeySetRequest): FacetKey!
    # Delete a facet key by its natural key. Returns whether a row was removed; a
    # system facet is non-deletable and its removal is refused.
    deleteFacetKey(memberType: String!, key: String!): Boolean!
    # Create a new device credential.
    createDeviceCredential(request: DeviceCredentialCreateRequest): DeviceCredential!
    # Update an existing device credential.
    updateDeviceCredential(token: String!, request: DeviceCredentialUpdateRequest!): DeviceCredential!
    # Delete a single device credential.
    deleteDeviceCredential(token: String!): Boolean!
    # Bind a NEW physical unit to an EXISTING logical device identity: retire every
    # credential the outgoing unit could authenticate with, mint one for the
    # incoming unit, and write an append-only record of the swap - all in one
    # transaction. The device's history, alarms, relationships, group membership and
    # command vocabulary carry forward because none of them are touched.
    replaceDevice(request: DeviceReplaceRequest!): DeviceReplaceResult!
    # Place an asset under a parent, replacing whatever parent it had. Refused when
    # it would make an asset its own ancestor, give it a second parent, or push the
    # tree past its depth limit. The asset's own children travel with it.
    setAssetParent(childToken: String!, parentToken: String!): EntityRelationship!
    # Detach an asset from its parent, making it a root. Its children travel with
    # it. Reports whether an edge was removed, so "already a root" is
    # distinguishable from "done".
    clearAssetParent(childToken: String!): Boolean!
    # Create a new provisioning profile.
    createProvisioningProfile(request: ProvisioningProfileCreateRequest): ProvisioningProfile!
    # Update an existing provisioning profile.
    updateProvisioningProfile(token: String!, request: ProvisioningProfileUpdateRequest!): ProvisioningProfile!
    # Delete a single provisioning profile.
    deleteProvisioningProfile(token: String!): Boolean!
    # Open (or reopen) a possession claim on a device with a secret an eventual
    # owner will present.
    initiateDeviceClaim(request: DeviceClaimInitiateRequest!): DeviceClaim!
    # Redeem a device's claim by presenting its secret, assigning the device to a
    # customer via a relationship of the given type. Returns the created edge.
    claimDevice(request: DeviceClaimRequest!): EntityRelationship!
    # Cancel a device's open claim without assigning it. Returns whether an open
    # claim was closed.
    cancelDeviceClaim(deviceToken: String!): Boolean!

    # Create a new entity relationship type.
    createEntityRelationshipType(request: EntityRelationshipTypeCreateRequest!): EntityRelationshipType!
    # Update an existing entity relationship type.
    updateEntityRelationshipType(token: String!, request: EntityRelationshipTypeUpdateRequest!): EntityRelationshipType!
    # Delete a relationship type. Refused while any edge still uses it.
    deleteEntityRelationshipType(token: String!): Boolean!
    # Create a new entity relationship.
    createEntityRelationship(request: EntityRelationshipCreateRequest!): EntityRelationship!
    # Remove a single relationship edge — the explicit "unassign" operation.
    removeEntityRelationship(token: String!): Boolean!
    # Create multiple entity relationships in one transaction (bulk "add members" /
    # "assign"). Auto-provisions the reserved "member" relationship type on first use.
    createEntityRelationships(requests: [EntityRelationshipCreateRequest!]!): [EntityRelationship!]!
    # Remove multiple relationship edges by token (bulk "remove members" / "unassign").
    removeEntityRelationships(tokens: [String!]!): Boolean!

    # Create a new asset type.
    createAssetType(request: AssetTypeCreateRequest): AssetType!
    # Update an existing asset type.
    updateAssetType(token: String!, request: AssetTypeUpdateRequest!): AssetType!
    # Delete an asset type. Refused while any asset references it; its published
    # version history goes with it.
    deleteAssetType(token: String!): Boolean!
    # Freeze an asset type's draft property contract into a new immutable version and
    # make it the one its assets are validated against. Refused when the type has no
    # draft contract to freeze.
    publishAssetType(token: String!, label: String, description: String): AssetTypeVersion!
    # Re-point an asset type's active version at an earlier published one. The draft
    # is untouched and nothing is deleted, so it can be rolled forward again.
    rollbackAssetType(token: String!, version: Int!): AssetType!
    # Create a new asset.
    createAsset(request: AssetCreateRequest): Asset!
    # Update an existing asset.
    updateAsset(token: String!, request: AssetUpdateRequest!): Asset!
    # Delete an asset and its relationship edges.
    deleteAsset(token: String!): Boolean!

    # Create a new customer type.
    createCustomerType(request: CustomerTypeCreateRequest): CustomerType!
    # Update an existing customer type.
    updateCustomerType(token: String!, request: CustomerTypeUpdateRequest!): CustomerType!
    # Delete a customer type. Refused while any customer references it.
    deleteCustomerType(token: String!): Boolean!
    # Create a new customer.
    createCustomer(request: CustomerCreateRequest): Customer!
    # Update an existing customer.
    updateCustomer(token: String!, request: CustomerUpdateRequest!): Customer!
    # Delete a customer and its relationship edges.
    deleteCustomer(token: String!): Boolean!

    # Create a new area type.
    createAreaType(request: AreaTypeCreateRequest): AreaType!
    # Update an existing area type.
    updateAreaType(token: String!, request: AreaTypeUpdateRequest!): AreaType!
    # Delete an area type. Refused while any area references it.
    deleteAreaType(token: String!): Boolean!
    # Create a new area.
    createArea(request: AreaCreateRequest): Area!
    # Update an existing area.
    updateArea(token: String!, request: AreaUpdateRequest!): Area!
    # Delete an area and its relationship edges.
    deleteArea(token: String!): Boolean!
}

# A single alarm state-change, pushed live to a subscriber (ADR-041 / ADR-037). It
# is the transition envelope re-emitted by the alarm integrator and the operator API — not
# the stored Alarm row — so it carries the transition kind (eventType) and, for a
# severity move, the prior severity, alongside a snapshot of the alarm after the
# change. Address the alarm by token to re-query it; the originator is the uniform
# (type, id) reference, with originatorToken resolved on demand for a device.
type AlarmEvent {
    # One of RAISED, ESCALATED, DEESCALATED, CLEARED, ACKNOWLEDGED.
    eventType: String!
    # Token of the alarm this event is about (stable across its lifecycle).
    alarmToken: String!
    originatorType: String!
    originatorId: ID!
    # The originator's token, resolved on demand (device originators only today);
    # null when the originator is not a device or no longer exists.
    originatorToken: String
    alarmKey: String!
    metricKey: String!
    # Alarm state after the transition: ACTIVE | CLEARED.
    state: String!
    # Severity after the transition.
    severity: String!
    # The severity held before an in-place change; set only for ESCALATED/DEESCALATED.
    previousSeverity: String
    acknowledged: Boolean!
    acknowledgedBy: String
    lastValue: Float
    message: String
    # When the current alarm cycle began (pairs with occurredTime for "active 42m").
    raisedTime: String
    # The event time that drove the transition (measurement time, or operation time
    # for an operator ack/clear).
    occurredTime: String!
}

# Live alarm stream (ADR-037). Pushes each alarm transition to the subscriber as it
# happens — scoped to the subscriber's tenant — from subscribe time onward with no
# historical backfill (use the alarm queries for current state). Optional filters
# narrow the feed to one originator, state, severity, or alarm key.
#
# Delivery is best-effort (at-most-once): the stored Alarm row is the source of
# truth, and an event may be dropped (a transient publish failure, or a slow
# consumer). A client that merges this stream into a live list must reconcile — re-run
# the alarm queries on reconnect and periodically — so a dropped event can't leave a
# stale row (e.g. a missed CLEARED showing a ghost active alarm).
type Subscription {
    # Streams alarm state-change events. When originator is supplied, originatorType
    # is required and the token is resolved to its id once at subscribe time.
    alarmStream(
        originatorType: String
        originator: String
        state: String
        severity: String
        alarmKey: String
    ): AlarmEvent!
}

schema {
    query: Query
    mutation: Mutation
    subscription: Subscription
}
