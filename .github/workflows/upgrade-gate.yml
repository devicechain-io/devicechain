# SPDX-License-Identifier: Apache-2.0
#
# THE UPGRADE GATE — does an existing instance's DATA survive this release?
#
# WHAT THIS GATES, and why nothing else can.
#
# Not the merge. Every change in a release is landable and CI-tested without a
# cluster. What needs a real upgrade is the CLAIM the release notes make: that an
# operator running the previous version can move to this one and still have what
# they had. `hack/migration-diff.sh verify` is the closest thing to it and it
# compares `pg_dump --schema-only`, so it captures NO ROWS — a migration that
# creates every table perfectly and then truncates the data inside them passes it
# with every area green. The load harness seeds its own world on a FRESH install.
# `dcctl destroy && bootstrap` is the INSTALL path, which structurally cannot see
# an upgrade defect at all.
#
# So this job installs the previous release, writes one of every entity through
# its real API, upgrades the way the documentation tells an operator to, and reads
# every row back. `hack/upgrade-rig.sh` is the drill; this file is the runner.
#
# 🔴 THERE ARE TWO DRILLS AND NO SKIP, and the second one exists because a release
# may deliberately not upgrade onto its predecessor. On such a release the paragraph
# above describes something that cannot happen — so what runs instead is a drill of
# the claim that release DOES make: the unsupported upgrade refuses, for the right
# reason, tells the operator to destroy and bootstrap, and damages nothing. That is
# precisely what every operator on the old version is about to hit, so it deserves
# measuring rather than waving through. Which drill runs is DECLARED in
# hack/upgrade-baseline-policy; the drill it selects is what falsifies a wrong
# declaration; and `ranwhat` at the end of the job refuses a run in which NEITHER
# happened. See the "Which drill" step.
#
# 🔴 IT RUNS `pull` ON THE RELEASE PATH, AND THAT IS THE POINT. The rig's default
# builds the working tree's images, which is right for a developer and wrong for a
# release: a source build of the same commit is not the same bytes, was not
# produced by the release pipeline, and has never been pushed anywhere. Called
# from release.yml it upgrades to the ALREADY-PUBLISHED tag — the artifact an
# operator actually installs. (The in-cluster pull is anonymous, so that tag's ghcr
# packages must be public; a private one surfaces here as a helm --wait timeout.)
#
# 🔴 THE `operator` STEP IS NO LONGER EXPECTED TO FAIL, AND THIS PARAGRAPH USED TO
# SAY THE OPPOSITE. The gap it described was real: the documented upgrade was a
# `helm upgrade`, the operator is not in the chart, and for a while no dcctl
# subcommand moved it, so the step was red by design. `dcctl upgrade` closed that
# — it moves the operator, the instance configuration document and the release
# together — and the drill now runs exactly that one command.
#
# 🔴 SO A RED HERE IS A REGRESSION, NOT THE KNOWN GAP, AND THE DISTINCTION IS THE
# WHOLE VALUE OF THIS STEP. While the text above still said "expected", a genuine
# failure to move the operator would have been read as the documented condition and
# waved through. The drill exits 3 for this finding and nothing else, so the summary
# can name it rather than reporting "the drill failed". See the step's own comment.
#
# Tools beyond the runner defaults (docker, kubectl, helm, git, curl are
# preinstalled): kind and tofu always; ko + a frontend docker build on the --build
# path only. Everything runs on ONE runner, because everything lives in one kind
# cluster on it.

name: upgrade-gate

on:
  # 🔴 THE TRIGGER THAT DID NOT EXIST, AND ITS ABSENCE IS WHY #838 REACHED A RELEASE.
  #
  # This gate used to run at a release cut and on demand, and nowhere else. So six
  # merged PRs carrying a stored-shape change had ZERO drill runs between them, and
  # the gate's first opportunity to see the defect was the commit that had already
  # fixed it by hand. A gate that runs once per release, on the release, is a gate
  # an arc cannot fail.
  #
  # 🔴 AND IT RUNS ON EVERY PULL REQUEST, WITH NO `paths:` FILTER, WHICH LOOKS LIKE
  # THE OPPOSITE OF WHAT IT IS. The drill is only worth having as a REQUIRED check —
  # a red gate nobody is obliged to look at is discipline wearing a gate's clothes,
  # and this repository merged a red `main` inside the arc that built this file. But a
  # required check that never reports leaves every unrelated pull request pending
  # forever, and a path filter is precisely a way of not reporting. So the filter
  # moved INSIDE the run: the `scope` job below asks hack/check-upgrade-gate-paths.sh
  # whether anything in this PR can change what an existing instance holds, and the
  # expensive job runs only if it can.
  #
  # That leaves ONE list, in the script, read both by the decision and by the
  # completeness check that guards it. The `paths:` block that used to live here was
  # a second copy waiting to happen, and reintroducing one is now itself a CI failure
  # — see claim 2 in that script, which fails if this trigger grows a filter again.
  pull_request:
    branches: [main]

  # Manual runs default to --build: the skew-free test of the checked-out tree,
  # which is what a developer wants and what a release must NOT settle for.
  workflow_dispatch:
    inputs:
      build:
        description: 'Build the working tree''s images (--build) -- skew-free test of the checked-out code. Uncheck to PULL `version` instead, which is what the release path does.'
        type: boolean
        default: true
      version:
        description: 'Published tag to upgrade TO when build is OFF (must exist in ghcr.io/devicechain-io and its packages must be public)'
        required: false
        default: ''
      baseline:
        description: 'Release to upgrade FROM. Leave empty to derive it: the highest stable tag below the target.'
        required: false
        default: ''
  # Reusable entry point for release.yml. Input names match workflow_dispatch so
  # every `inputs.*` read below works identically under either trigger.
  workflow_call:
    inputs:
      build:
        description: 'Build images vs pull `version`. Release passes false.'
        type: boolean
        default: true
      version:
        description: 'Published tag to upgrade TO when build is false.'
        type: string
        required: false
        default: ''
      baseline:
        description: 'Release to upgrade FROM; empty derives it.'
        type: string
        required: false
        default: ''

# Read-only: this bootstraps a throwaway kind cluster on the runner and either
# builds images locally or pulls PUBLIC ghcr images. It never pushes an image or
# writes to the repository.
permissions:
  contents: read

concurrency:
  group: upgrade-gate-${{ github.ref }}
  # On a dispatch or a release this is a MEASUREMENT run: a second one queues behind
  # the first rather than cancelling a mid-flight bring-up and throwing away the only
  # evidence the release's upgrade claim has.
  #
  # On a PULL REQUEST the opposite is right, and the difference is not a preference.
  # A drill against a commit that has already been superseded is not evidence about
  # anything anyone is going to merge, and leaving it running only delays the run
  # that IS about the head commit — on a gate that takes eight minutes and holds a
  # whole kind cluster while it does.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Is the expensive job warranted?
  # ---------------------------------------------------------------------------
  # Cheap by construction: a checkout and a python regex match, about fifteen seconds,
  # so that the eight-minute job below is entered only when something in the pull
  # request can change what an existing instance holds or how it is read.
  #
  # 🔴 EVERY UNCERTAINTY HERE RESOLVES TO `run=true`, and the asymmetry is the whole
  # design. Running the drill when it was not needed costs eight minutes. NOT running
  # it when it was needed produces a green pull request that was never drilled — which
  # is the outcome this gate exists to prevent, and is indistinguishable from a drill
  # that passed. The script fails closed on an empty file list; the step below fails
  # closed on an API error.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Granted here rather than at the top of the file, because a job-level block
    # REPLACES the workflow-level one: this is the only job that reads the API, and
    # `drill` — the job that builds images and runs a cluster — keeps the narrower
    # set it already had.
    #
    # The API is asked which files the pull request changed because that is the same
    # set GitHub's own `paths:` filter would have consulted. A merge-base diff would
    # be a second, subtly different answer to a question this workflow used to ask
    # GitHub directly: no fetch depth to get wrong, and no way to disagree with the
    # mechanism being replaced.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Can anything in this pull request change what an instance holds?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Not a pull request -- a dispatch, or a release calling this workflow --
          # so there is no file list to narrow by and the drill is the whole point of
          # the run. Tested on the PAYLOAD rather than on github.event_name, because
          # under workflow_call that name is the CALLER's event: release.yml invoking
          # this file on a tag push reports `push`, and a future caller reached from a
          # pull request would report `pull_request` while carrying a PR number that
          # has nothing to do with this workflow's own trigger.
          if [ "$EVENT" != "pull_request" ] || [ -z "${PR:-}" ]; then
            echo "Not a pull request (event: $EVENT); the drill runs unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same set GitHub's own path filter would have used. A failure here is
          # NOT "nothing changed": it is "we do not know what changed", and the two
          # must not produce the same answer.
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
                 --jq '.[].filename' > changed.txt; then
            echo "::warning::could not list this pull request's files; running the drill rather than guessing"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 🔴 THE API CAPS THIS LIST AT 3000 FILES, and truncation is silent: a
          # short list reads exactly like a complete one, and a dropped migration
          # would produce `run=false` on the pull request that most needed drilling.
          # No pull request here is anywhere near that, which is why the guard is
          # three lines rather than a pagination strategy -- but "surely not" is the
          # reasoning that produces the failures this gate exists for.
          if [ "$(wc -l < changed.txt)" -ge 3000 ]; then
            echo "::warning::this pull request touches 3000+ files, which is where the API truncates its file list; running the drill rather than deciding from a list that may be incomplete"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hack/check-upgrade-gate-paths.sh --match-changed < changed.txt >> "$GITHUB_OUTPUT"

  drill:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Two budgets, because the two paths are not the same job. The PULL path does
    # no image build at all -- it is a bring-up, a rollout and two probe runs, and
    # it is the one a release waits on. The --build path additionally ko-builds
    # every service image plus the frontend on 2 cores.
    #
    # 🔴 ONE BUDGET SIZED FOR THE SLOWER PATH IS NOT CONSERVATIVE, IT IS BLIND: a
    # release-path hang would burn two hours before anything noticed, on a job
    # whose honest work is well under one. A job that OVERRUNS is CANCELLED rather
    # than failed, and `if: failure()` is false for a cancelled job -- so the
    # diagnostics below would not run and the summary would read "not reached",
    # the least attributable red this workflow can emit. Catching that sooner is
    # worth more than headroom nobody uses.
    # Written as `== false` rather than `inputs.build && …`: an ABSENT input is
    # null, which is falsy, so the obvious spelling gives the SHORT budget to the
    # LONG path. Only an explicit false — which is what release.yml passes — buys
    # the tighter one.
    timeout-minutes: ${{ inputs.build == false && 60 || 120 }}
    steps:
      # 🔴 fetch-depth: 0 IS REQUIRED, twice over. The rig `git archive`s the
      # baseline tag out of THIS checkout to build that release's own dcctl, and
      # the derivation below reads the tag list. A shallow clone has neither, and
      # the failure would arrive as "not a tag in this repository" on a tag that
      # plainly exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # kind: the binary only, pinned to the same version loadtest-gate uses. The
      # rig runs `kind create cluster` itself from deploy/local's config, so this
      # job must never create one -- that would fight the rig for the name.
      - name: Install kind
        run: |
          curl -fsSL -o kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind
          rm -f kind
          kind version

      # dcctl's infrastructure step shells out to `tofu`. tofu_wrapper off so
      # exec.LookPath finds the real binary rather than the action's shim.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.9.1
          tofu_wrapper: false

      # ONE place that decides the run's shape, written into the environment for
      # every step below. The alternative — the same three-line `env:` block on
      # each of the five drill steps — is four copies of a rule, and the copies
      # drift in exactly the way that leaves one phase pulling while the rest build.
      #
      # `build` defaults to TRUE when the input is absent, matching the input's own
      # default: the skew-free source build is the safe shape for anything that is
      # not a release, and only an explicit `false` from release.yml selects the
      # published-image path.
      - name: Resolve the run's shape
        env:
          BUILD_IN: ${{ inputs.build }}
          VERSION_IN: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$BUILD_IN" = "false" ]; then
            images=pull
          else
            images=build
          fi
          {
            echo "DC_UPGRADE_IMAGES=$images"
            echo "DC_UPGRADE_TAG=$VERSION_IN"
          } >> "$GITHUB_ENV"
          echo "Image source: $images${VERSION_IN:+ (tag $VERSION_IN)}"

      # Only the build path shells out to ko. Gated on the RESOLVED mode rather
      # than on `inputs.build`: those are two encodings of one rule, and the run
      # that drifts them apart is the one where `inputs` is absent — ko then goes
      # uninstalled while the drill takes the path that needs it, and the failure
      # lands forty minutes later inside build-images.sh. (Note `github.event_name`
      # is the CALLER's event under workflow_call, so an event-name test is wrong
      # here for a third reason.)
      - name: Install ko (build path only)
        if: env.DC_UPGRADE_IMAGES == 'build'
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      # -------------------------------------------------------------------
      # Which release are we upgrading FROM?
      # -------------------------------------------------------------------
      # DERIVED, not pinned. A literal default in this file is bumped by hand once
      # per release, and the failure mode of a hand-bumped constant in a pipeline
      # that runs quarterly is that it is FORGOTTEN: v0.13.0 would drill
      # v0.11.0 -> v0.13.0 and report a green upgrade for a hop no release note
      # ever claimed, while the hop that WAS claimed went untested.
      #
      # The rule: the highest STABLE tag strictly below the target. A prerelease
      # target is reduced to its own stable version first, so v0.12.0-rc.1 drills
      # from v0.11.0 -- the release an operator is actually on -- rather than from
      # some earlier candidate of the release being cut.
      #
      # 🔴 An underivable baseline is a HARD FAILURE, never a default. Falling back
      # to a guess would run the whole drill against the wrong hop and report a
      # green result for it, which is worse than not running.
      - name: Derive the baseline release
        id: baseline
        env:
          BASELINE_IN: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          if [ -n "$BASELINE_IN" ]; then
            baseline="$BASELINE_IN"
            git rev-parse --verify "${baseline}^{commit}" >/dev/null 2>&1 || {
              echo "::error::baseline '$baseline' is not a tag in this repository."
              exit 1
            }
            echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
            echo "DC_BASELINE_TAG=$baseline" >> "$GITHUB_ENV"
            echo "Baseline (given): $baseline"
            exit 0
          fi

          # Stable tags only: a candidate is not a release anyone is running.
          # '[-]' rather than -- '-': the second spelling is a portability trap. GNU grep
          # reads it as a pattern; at least one drop-in replacement reads it as no
          # pattern at all and exits usage-error, which pipefail then turns into a
          # step failure nobody would attribute to a grep argument.
          stable="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v '[-]' | sort -V)"
          [ -n "$stable" ] || {
            echo "::error::no stable vX.Y.Z tags are visible. A shallow clone is the usual cause; this job checks out with fetch-depth: 0."
            exit 1
          }

          # On the pull path the target is the tag being released; on the build
          # path there is no target tag, so the newest stable release is the one an
          # operator would be upgrading from.
          if [ "$DC_UPGRADE_IMAGES" = "build" ]; then
            baseline="$(printf '%s\n' "$stable" | tail -1)"
            echo "Baseline (newest stable, build path): $baseline"
          else
            [ -n "$DC_UPGRADE_TAG" ] || {
              echo "::error::build is off but no version was given; there is nothing to upgrade TO."
              exit 1
            }
            # Strip any prerelease segment: an rc drills from the previous STABLE.
            target="${DC_UPGRADE_TAG%%-*}"
            baseline=""
            while read -r t; do
              [ "$t" = "$target" ] && break
              baseline="$t"
            done < <(printf '%s\n%s\n' "$stable" "$target" | sort -V -u)
            [ -n "$baseline" ] || {
              echo "::error::no stable release below $target, so there is no upgrade to drill. Tags seen: $(echo "$stable" | tr '\n' ' ')"
              exit 1
            }
            echo "Baseline (derived, upgrading to $DC_UPGRADE_TAG): $baseline"
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "DC_BASELINE_TAG=$baseline" >> "$GITHUB_ENV"

      # The self-test costs seconds and covers the rig's string handling, which no
      # cluster step exercises directly. Run BEFORE the hour-long part: a rig whose
      # own controls do not hold should not be trusted to spend an hour.
      - name: Rig self-test
        run: hack/upgrade-rig.sh selftest

      # -------------------------------------------------------------------
      # WHICH DRILL? And why there are two rather than a skip.
      # -------------------------------------------------------------------
      # 🔴 A RELEASE MAY DELIBERATELY NOT UPGRADE ONTO ITS PREDECESSOR. When it does,
      # the data drill below cannot run -- there is no upgrade to perform, so there is
      # no "did the rows survive it" to ask -- and the obvious answer is to stand this
      # gate down for that release. That answer is wrong twice: it makes a REQUIRED
      # check report a green nothing earned, which is the shape this whole file argues
      # against; and it leaves the thing every operator on the old version is about to
      # do -- type `dcctl upgrade` -- measured by nothing, on the one release where it
      # is guaranteed to fail.
      #
      # So the other case is a DRILL, not a skip. It requires the unsupported upgrade
      # to refuse for the right reason, to name destroy + bootstrap as the way through,
      # and to leave the instance on the same Helm revision, the same operator image
      # and every seeded row -- then it runs verify's own negative controls, because a
      # verify that has not been shown to fail certifies nothing there either.
      #
      # 🔴 THE CHOICE IS DECLARED IN hack/upgrade-baseline-policy AND NEVER INFERRED,
      # and the drill it selects is what checks it: the recreate drill fails if the
      # upgrade SUCCEEDS, and the data drill fails if it cannot. A wrong declaration is
      # loud in both directions. Read that file for the reasoning.
      #
      # 🔴 AND `ranwhat` AT THE END IS NOT DECORATION. Two conditional paths means two
      # conditions, and two false conditions is a job whose every expensive step was
      # skipped and whose result is success. That is the same failure the `upgrade-gate`
      # job below refuses to pass on when `scope` gives no usable answer, and it gets
      # the same treatment here.
      - name: Which drill does this baseline earn?
        id: drillmode
        run: |
          set -euo pipefail
          mode="$(hack/upgrade-rig.sh mode)"
          case "$mode" in
            data|recreate) ;;
            *)
              echo "::error::the rig resolved the drill mode to '$mode', which is neither"
              echo "'data' nor 'recreate'. Every step below is conditional on it, so an"
              echo "unusable answer would skip the whole drill and report success."
              exit 1
              ;;
          esac
          echo "DC_UPGRADE_MODE=$mode" >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # `:-` because the script runs under `set -u`, and the derive step above is
          # the only thing that sets this. If that ever stops being true, the wrong
          # failure to get is an unbound-variable abort on the reporting line.
          echo "Drill for baseline ${DC_BASELINE_TAG:-<unset>}: $mode"

      # -------------------------------------------------------------------
      # The drill, one phase per step.
      # -------------------------------------------------------------------
      # Split rather than `all` in one step so a red is attributable from the step
      # NAME alone. It also makes the operator step -- the one expected to fail --
      # structurally separate from every other failure, instead of a code the
      # summary has to parse out of a shared log.
      #
      # `up` is COMMON to both drills: both need the baseline installed and seeded,
      # because both measure what happens to those rows.
      - name: Install the baseline and seed one of every entity
        run: hack/upgrade-rig.sh up

      # The egress NetworkPolicy is API-VALIDATED here, because this job already has
      # the one thing that can do it: a real API server.
      #
      # 🔴 A CLIENT-side dry-run is worthless for this class. It accepted every invalid
      # form we tried -- an IPv4-mapped prefix, a bare address where a CIDR belongs, an
      # IPv4 prefix inside the ::/0 block -- all three of which the API server refuses.
      # And an invalid prefix makes the WHOLE policy invalid, so `helm install` fails
      # outright and the feature cannot be enabled anywhere. That shipped once: nothing
      # caught it, because `helm lint` does not execute the body of a false `if` and no
      # job rendered this template enabled.
      #
      # Rendered into `default` so it needs no namespace of its own, and the dry-run
      # persists nothing. Both arms of this check have been observed: the shipped policy
      # is accepted, and re-adding the mapped prefix reproduces the two errors above.
      #
      # 🔴 The WHOLE chart is rendered and the NetworkPolicy documents are selected by
      # KIND, not with `--show-only templates/networkpolicy.yaml`. That flag was the
      # original form and it is a blind spot: a policy added in a second template file is
      # invisible to it, and NetworkPolicies union, so one allow-all policy over the same
      # pods opens everything. The selector refuses to emit nothing, so an empty render
      # fails here rather than passing as "no objects to validate".
      - name: The egress NetworkPolicy is valid Kubernetes
        run: |
          set -euo pipefail
          helm template deploy/helm/devicechain \
            --set "instance.config.infrastructure.secrets.rootKey=$(openssl rand -base64 32)" \
            --set instance.id=default \
            --set 'enabledFunctionalAreas={user-management,device-management,event-processing,outbound-connectors}' \
            --set networkPolicy.enabled=true \
            --include-crds \
            | (cd backend/core && go run ./egress/internal/policyranges -policies) \
            | kubectl --context kind-devicechain-upgrade apply --dry-run=server -f -

      # -------------------------------------------------------------------
      # DRILL A -- the data drill. The baseline is upgradeable onto this release.
      # -------------------------------------------------------------------
      - name: Upgrade, the way the documentation says to
        if: env.DC_UPGRADE_MODE == 'data'
        run: hack/upgrade-rig.sh upgrade

      - name: THE DRILL -- every seeded row must read back unchanged
        if: env.DC_UPGRADE_MODE == 'data'
        run: hack/upgrade-rig.sh verify

      # The wider, shallower question, and the one verify structurally cannot ask.
      # verify round-trips the 24 rows it wrote; this calls every door the served
      # schemas expose -- about a hundred -- and requires that none ERRORS. A
      # derived artifact going stale (a frozen snapshot pointing at rows a
      # migration never rewrote) leaves every written row perfectly intact, which
      # is how the geofence archive's missing backfill passed this drill once
      # already.
      - name: THE READ SWEEP -- every served door must still answer
        if: env.DC_UPGRADE_MODE == 'data'
        run: hack/upgrade-rig.sh readsweep

      # Is "one of every entity" true? apiprobe's coverage table is a CLAIM, and
      # nothing has ever counted it against the database it claims to cover -- a
      # tenant-scoped table no entity writes to is invisible from the API side,
      # because no query returns "the rows you did not create".
      #
      # It seeds a SECOND tenant against the UPGRADED instance, with no baseline
      # constraint, and sweeps that one. The drill's own seed runs against the
      # baseline, so a table belonging to an entity that release cannot create is
      # legitimately empty -- for a reason that changes every release. A coverage
      # result that means something different each release is not a coverage result.
      #
      # It runs AFTER the read sweep so its failure cannot be mistaken for one:
      # verify and the sweep have already passed, which is what makes this a finding
      # about the drill's reach rather than about the instance's data.
      - name: THE TABLE SWEEP -- one of every entity, counted rather than claimed
        if: env.DC_UPGRADE_MODE == 'data'
        run: hack/upgrade-rig.sh tablesweep

      # The check on the checks. A verify whose ability to FAIL has not been shown
      # in this session has certified nothing -- it would report the same green
      # against an instance that had lost everything. The sweep's control carries
      # the extra claim: it damages a stored snapshot, requires the sweep to fail
      # with the exact UNREADABLE code, and requires verify to still PASS over the
      # same damage. Without that second half the two checks might be seeing the
      # same thing.
      - name: Negative controls -- break the instance three ways, require the right check to notice
        if: env.DC_UPGRADE_MODE == 'data'
        run: hack/upgrade-rig.sh control

      # 🔴 THIS MUST BE GREEN NOW, AND IT WAS RED BY DESIGN FOR A RELEASE. The
      # operator is applied by dcctl from its own embedded manifests and is not in
      # the chart, so while the documented upgrade was a `helm upgrade` nothing moved
      # it — and docs/docs/deployment/releases-and-upgrades.md promised one version
      # covering the services, the operator, the chart and the CLI with no skew. An
      # operator following the documentation exactly ended up with new services and
      # an old controller. This step said so out loud on the release path rather than
      # leaving it as a comment in the rig, and `dcctl upgrade` is what that produced.
      #
      # The upgrade step above now runs that single command, which moves all three
      # together. So a red here means the fix did not hold — read it as a defect in
      # this release, not as the condition this step was born describing.
      #
      # Exit 3 means THIS finding and only this finding; anything else from the step
      # is the check failing to run, which the rig reports separately and never
      # folds into the finding.
      - name: The operator must be running the version the services were upgraded to
        id: operator
        if: env.DC_UPGRADE_MODE == 'data'
        run: hack/upgrade-rig.sh operator

      # -------------------------------------------------------------------
      # DRILL B -- the recreate drill. This release does not upgrade onto the
      # baseline, so what is measured is the refusal an operator will actually meet.
      # -------------------------------------------------------------------
      # It asserts a PAIR, and the second half is what makes the first worth having: a
      # refusal on its own is satisfied by a command that fails for any reason at all,
      # including one that fails after it has already applied this release's operator
      # over the live one. So the drill measures the refusal's REASON -- the
      # pre-declaration message, naming destroy and bootstrap -- and then measures the
      # instance: same Helm revision, same operator image, every seeded row unchanged,
      # and the API still serving.
      #
      # There is no operator step here on purpose. Nothing was upgraded, so asking
      # whether the operator moved TO the new version would be asking for the defect
      # this drill exists to prove did not happen -- and the drill already asserts that
      # its image is exactly what it was.
      - name: THE RECREATE DRILL -- the unsupported upgrade must refuse and damage nothing
        if: env.DC_UPGRADE_MODE == 'recreate'
        run: hack/upgrade-rig.sh recreate

      # 🔴 THE CHECK ON THE CHECK, AND WITHOUT IT THE DRILL ABOVE IS HALF A RESULT. Its
      # "damaged nothing" half is verify reporting a pass, and a verify whose ability to
      # FAIL has not been demonstrated in this session would report exactly that green
      # against an instance the refused upgrade had emptied. These are the same two
      # controls the data drill runs -- a deleted row must read MISSING and a rewritten
      # field must read MISMATCH -- minus the read-sweep control, which cannot run here:
      # the sweep builds its documents from the WORKING TREE's schemas and the instance
      # is still the baseline, so every door this release added would be a finding.
      - name: Negative controls -- verify must be shown to fail before its pass means anything
        if: env.DC_UPGRADE_MODE == 'recreate'
        run: hack/upgrade-rig.sh controlverify

      # -------------------------------------------------------------------
      # Did a drill actually happen?
      # -------------------------------------------------------------------
      # 🔴 UNCONDITIONAL, WHICH IS THE ENTIRE POINT. Every step above is gated on
      # DC_UPGRADE_MODE, and a mode that matched neither branch would skip all of them
      # and leave this job GREEN having drilled nothing -- the gate-that-cannot-fail
      # shape, reached here by the same route the `upgrade-gate` job refuses when
      # `scope` gives no usable answer. The rig records which drill it performed, and
      # this asks: was one performed, and was it the one this baseline selected?
      - name: EXACTLY ONE DRILL RAN, and it was the one this baseline selected
        run: hack/upgrade-rig.sh ranwhat

      # -------------------------------------------------------------------
      # Reporting.
      # -------------------------------------------------------------------
      - name: Summary
        if: always()
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          # DC_UPGRADE_IMAGES/DC_UPGRADE_TAG come from the resolve step, so this
          # reports what the run actually did rather than what was asked for.
          TARGET: ${{ env.DC_UPGRADE_IMAGES == 'pull' && env.DC_UPGRADE_TAG || 'the working tree (built from source)' }}
          OPERATOR_OUTCOME: ${{ steps.operator.outcome }}
          # Which drill this run performed. Empty when the resolve step itself did not
          # get that far, which is why the table prints a placeholder rather than
          # leaving the row blank -- a blank reads as "data drill, nothing to report".
          MODE: ${{ steps.drillmode.outputs.mode }}
        run: |
          {
            printf '## Upgrade drill\n\n'
            printf '| | |\n|---|---|\n'
            printf '| baseline | %s |\n' "$BASELINE"
            printf '| drill | %s |\n' "${MODE:-not resolved}"
            # No backticks in this prose, deliberately: a backtick inside a shell
            # string is command substitution, and the spellings that make it safe
            # (escapes, a quoted heredoc that must then sit at column 0 inside a
            # YAML block scalar) are each a way to break this file for a code font.
            if [ "$MODE" = "recreate" ]; then
              printf '\n### This release does not upgrade onto %s\n\n' "$BASELINE"
              printf 'So the data drill did not run, and this is NOT a skip. What ran instead is the\n'
              printf 'drill for the claim this release actually makes: the unsupported upgrade must\n'
              printf 'REFUSE, for the pre-declaration reason rather than merely fail; it must name\n'
              printf 'destroy and bootstrap as the way through; and it must leave the instance on the\n'
              printf 'same Helm revision, the same operator image and every seeded row it had. Verify\n'
              printf 'was then shown to fail against a deleted row and a rewritten field, so its pass\n'
              printf 'is a measurement rather than an assumption.\n\n'
              printf 'Nothing here says anything about data surviving an upgrade, because no upgrade\n'
              printf 'happened. The boundary is declared in hack/upgrade-baseline-policy.\n'
            else
              printf '| upgraded to | %s |\n' "$TARGET"
              printf '| operator check | %s |\n\n' "${OPERATOR_OUTCOME:-not reached}"
            fi
            if [ "$OPERATOR_OUTCOME" = "failure" ]; then
              printf '### The operator was not upgraded\n\n'
              printf 'Every seeded row survived: the data half of this drill passed. What failed is\n'
              printf 'the operator check, and it is a **finding about the release**, not a broken rig.\n\n'
              printf 'The operator is not in the chart -- dcctl applies it from its own embedded\n'
              printf 'manifests. **dcctl upgrade** is what moves it, together with the instance\n'
              printf 'configuration document and the release, and the upgrade step above ran exactly\n'
              printf 'that one command. Meanwhile the deployment documentation promises one version\n'
              printf 'covering the services, the operator, the chart and the CLI together, with no\n'
              printf 'per-service skew to reason about.\n\n'
              printf 'Read this as a **regression**, not as a known gap -- the gap this check was\n'
              printf 'born describing is closed. Either the operator image for this tag was never\n'
              printf 'published or is not public and the new pod is stuck pulling, or the upgrade\n'
              printf 'applied a Deployment other than the one measured. The step log names the\n'
              printf 'images.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Ordinary `kubectl get` output is worth more than a re-run here: the cluster
      # is deleted with the runner, so whatever is not printed now is gone.
      - name: Diagnostics
        if: failure()
        run: |
          ctx=kind-devicechain-upgrade
          echo "::group::pods"; kubectl --context "$ctx" get pods -A -o wide || true; echo "::endgroup::"
          echo "::group::deployments in dc-k8s-system"; kubectl --context "$ctx" -n dc-k8s-system get deploy -o wide || true; echo "::endgroup::"
          # Every DeviceChain release, whatever it is called. Release names carry the
          # instance now, and both conventions can be present at once on a cluster the
          # drill bootstrapped from an older baseline — so a fixed name here prints
          # "release: not found" into a collapsed group, swallowed by `|| true`, on the
          # one run where the history is the thing worth having.
          echo "::group::helm releases"
          helm --kube-context "$ctx" list -n default --all || true
          for rel in $(helm --kube-context "$ctx" list -n default --all -o json 2>/dev/null \
                         | jq -r '.[] | select(.chart | startswith("devicechain-")) | .name'); do
            echo "--- history: $rel"
            helm --kube-context "$ctx" history "$rel" -n default || true
          done
          echo "::endgroup::"
          echo "::group::not-ready pods"
          kubectl --context "$ctx" get pods -A --field-selector=status.phase!=Running -o yaml || true
          echo "::endgroup::"
          echo "::group::recent events"
          kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "::endgroup::"
          # 🔴 The LOGS of whatever did not come up, and --previous for the ones that
          # already restarted. Without this a crash-loop is reported as a rollout
          # timeout and nothing on the page says why: a run that paired the wrong
          # chart with the wrong images produced exactly one useful line
          # ("CrashLoopBackOff") and no reason at all, and the cluster dies with the
          # runner, so what is not printed now cannot be asked for later.
          for ref in $(kubectl --context "$ctx" get pods -A \
              -o jsonpath='{range .items[?(@.status.phase!="Succeeded")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'); do
            ns="${ref%%/*}"; pod="${ref##*/}"
            ready="$(kubectl --context "$ctx" -n "$ns" get pod "$pod" \
              -o jsonpath='{.status.containerStatuses[*].ready}' 2>/dev/null || echo unknown)"
            case "$ready" in *false*|unknown) ;; *) continue ;; esac
            echo "::group::logs $ns/$pod"
            kubectl --context "$ctx" -n "$ns" logs "$pod" --all-containers --tail=80 || true
            kubectl --context "$ctx" -n "$ns" logs "$pod" --all-containers --tail=80 --previous 2>/dev/null || true
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # THE REPORTED RESULT. This is the check to require, not `drill`.
  # ---------------------------------------------------------------------------
  # `drill` is conditional, so on a pull request that changes no stored shape it does
  # not run. GitHub does map a skipped job onto a passing required check — but that is
  # an implicit rule about what a missing result means, and this repository has a
  # standing position against those: `ci-complete` in ci.yml refuses to read `skipped`
  # as success at all, precisely so that "did not run" can never be mistaken for
  # "passed". Requiring `drill` directly would depend on the opposite reading of the
  # same word, in the same repository, one file apart.
  #
  # So the reasoning is written down instead. This job always runs, always reports, and
  # says in its own log WHY it is green: either the drill ran and passed, or the
  # decision was made, recorded, and was that there is nothing here to drill.
  #
  # 🔴 IT ALSO CATCHES THE CONTRADICTION, which nothing else would. `scope` saying the
  # drill was needed while `drill` reports `skipped` is not a pass and not a normal
  # failure — it means the `if:` and the output disagree, i.e. the mechanism that
  # decides whether this gate runs is broken. That would otherwise present as a green
  # pull request, which is the exact failure this whole gate is built around.
  upgrade-gate:
    name: upgrade-gate
    if: always()
    needs: [scope, drill]
    runs-on: ubuntu-latest
    steps:
      # Results arrive through the environment rather than interpolated into the
      # script, so nothing from the workflow context is ever executed as shell.
      - name: Report
        env:
          SCOPE: ${{ needs.scope.result }}
          DRILL: ${{ needs.drill.result }}
          WANTED: ${{ needs.scope.outputs.run }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE wanted=${WANTED:-<none>} drill=$DRILL"

          if [ "$SCOPE" != "success" ]; then
            echo "::error::the scope job did not succeed ($SCOPE), so it is not known"
            echo "whether this pull request needed the upgrade drill. Refusing to pass."
            exit 1
          fi

          case "$WANTED" in
            false)
              if [ "$DRILL" != "skipped" ]; then
                echo "::error::scope decided the drill was not needed, but the drill"
                echo "reports '$DRILL' rather than 'skipped'. The job condition and the"
                echo "scope output disagree, which means the mechanism deciding whether"
                echo "this gate runs is broken. Refusing to pass."
                exit 1
              fi
              echo "Nothing in this pull request can change what an existing instance holds."
              echo "The drill was not needed. See the scope job's log for the file list."
              ;;
            true)
              if [ "$DRILL" != "success" ]; then
                echo "::error::the upgrade drill did not pass ($DRILL). This pull request"
                echo "changes something that can alter what an existing instance holds, and"
                echo "the drill is the only check that reads real rows back across a real"
                echo "upgrade. See the drill job's summary and diagnostics."
                exit 1
              fi
              echo "The upgrade drill ran and passed."
              ;;
            *)
              echo "::error::scope produced no usable decision (run='${WANTED:-<none>}')."
              echo "Refusing to pass on an answer that was never given."
              exit 1
              ;;
          esac
