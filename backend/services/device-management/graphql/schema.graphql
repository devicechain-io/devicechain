"""One measured metric a calculated metric's formula may read."""
type CalculatedMetricPlanInput {
    """The metric's key."""
    key: String!
    """The metric's data type: DOUBLE, INT or BOOLEAN."""
    dataType: String!
}

"""One calculated metric of a published profile version."""
type CalculatedMetricPlanMetric {
    """The metric's key."""
    key: String!
    """The formula source, a CEL expression over the version's other metrics."""
    expression: String!
    """The declared result type: DOUBLE, INT or BOOLEAN."""
    dataType: String!
    """The inclusive lower bound a computed value must meet, if the definition has one."""
    minValue: Float
    """The inclusive upper bound a computed value must meet, if the definition has one."""
    maxValue: Float
    """The unit stamped on computed values, if the definition has one."""
    unit: String
    """The metric definition's id, stamped on every value of it as its classifier."""
    classifier: Float!
    """
    True when the previous published version did not calculate this key (a first
    calculation, or one reinstated after a version without it).
    """
    newInVersion: Boolean!
    """
    True when an earlier published version calculated this key under a different
    expression, data type or bounds, so values computed then differ from what this
    version's formula gives.
    """
    changedSinceEarlier: Boolean!
    """
    True when another device profile of the tenant declares a metric (measured or
    calculated) with this key in its active version. Tenant-wide readings counted by
    metric name then include that profile's readings, so a count under this name
    cannot show this formula is working. Also true when the check could not be completed:
    more candidate versions than its bound, or another profile's version that could not be read.
    """
    nameSharedWithOtherProfiles: Boolean!
    """
    The metric keys the formula reads directly, measured or calculated, as this version
    compiles it. Null when the metric cannot run in this version (its formula does not
    compile here, or no formula can produce its data type), so it computes from nothing.
    """
    inputs: [String!]
    """
    The measured metrics the formula's value is computed from, including those read through
    the calculated metrics it reads, in the order of measured. Null exactly when inputs is.
    """
    measuredInputs: [String!]
    """
    The device constants the formula reads, including through the calculated metrics it reads,
    sorted and distinct. Null exactly when inputs is.
    """
    constants: [String!]
}

"""The calculated metrics of one published profile version, as the live resolver runs them."""
type CalculatedMetricPlan {
    """The version's token, profileToken@version."""
    versionToken: String!
    """The version number."""
    version: Int!
    """When the version became active; null unless it is the profile's active version."""
    activeSince: String
    """The measured metrics the formulas may read, in declaration order."""
    measured: [CalculatedMetricPlanInput!]!
    """
    The calculated metrics in the order the resolver evaluates them: a formula follows the
    ones it reads, and by key otherwise. A metric whose data type no formula can produce
    comes last, by key.
    """
    calculated: [CalculatedMetricPlanMetric!]!
    """The device constants the formulas read together, sorted and distinct."""
    constantKeys: [String!]!
}

"""One device of the profile a backfill walks."""
type CalculatedBackfillRosterEntry {
