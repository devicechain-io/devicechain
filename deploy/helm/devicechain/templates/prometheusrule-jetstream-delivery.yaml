{{/*
Alerting rules for JetStream DELIVERY: messages a stream discarded before a reader got
to them, streams approaching the ceiling (ADR-023) at which that starts, and messages a
capacity-bounded reader held past their acknowledgement window.

WHY THIS GROUP EXISTS. Every stream is bounded and discards its OLDEST message once
full (DiscardOld). That is the right policy for a platform that must keep ingesting,
and it is silent by construction: the broker removes the message, a durable that had
not reached it steps over the hole on its next pull, and nothing records that the
message was never read. The two per-durable series below are that record, sampled by
every service for the durables it reads (core/messaging/stream_metrics.go).

A stream's FILL cannot say whether any reader was behind what went: every stream keeps a
week of history, so a busy one sits at its ceiling full of messages its readers have
already read, which loses nothing. So the warning BEFORE a loss is per durable, on its
UNREAD backlog against the ceiling (jetstream_consumer_unread_ratio,
JetStreamDurableUnreadNearFull), and the fill alert is kept only for the streams declared
as sinks, where nothing processes what is held (JetStreamStreamNearFull).

🔑 SELECTED BY NAME, NOT LISTED — the same reasoning as DeadLetterWriteLost in
prometheusrule-dead-letter.yaml. Every service that reads a stream exports these series under its
own subsystem, so a regex over the name covers every reader with no list to keep.
`[a-z0-9]+`, NOT `.+`: the area segment never contains `_` (its dashes are stripped),
so the stricter form matches the one name core builds and nothing else.

🔑 `max by`, NEVER `sum`, for the broker-sampled series (the unread counter and gap,
and the fill gauges). Every replica of a service samples the same durable and counts
the same removal, so summing across pods would multiply one loss by the replica
count. The held-past-AckWait counter is the opposite case and is summed: each pod
counts only the messages IT held (see that rule).

A CONSUMER THAT STAYS BEHIND loses nothing and fails nothing, and is still wrong: what
its service derives from the stream (device-state's live state, say) lags by however
far behind it is. The per-durable backlog gauge, sampled beside the unread pair, is
that number; JetStreamDurableFallingBehind watches it.

A LATE DELIVERY is the other way a reader goes wrong without failing. A consumer that
falls behind its broker does not error: the broker redelivers what the consumer held
too long, and the consumer handles the redelivery as though it were new. For a service
whose handling is an EXTERNAL SEND -- a page to a human, a webhook to someone else's
server -- that is a second send nobody can take back, and nothing in the service's own
success metrics looks wrong while it happens. reader_held_past_ack_wait_total is the
only record of it.

THE MAX-DELIVERY RECORD is the third. A message whose every delivery ran out is
dead-lettered by the service that read it (core/messaging's recorder); the two rules at
the end watch that record: notices waiting unrecorded on the capture stream, and
exhaustions the recorder deliberately did NOT letter because the consumer re-reads the
stream from its own checkpoint -- which lose nothing, but mean that checkpoint is failing.

BACKPRESSURE is the exception to "discards its oldest". On the two ingest streams whose
unread loss is device data (inbound-events, gated on device-management's consumer, and
resolved-events, gated on event-management's), the services that write the stream refuse
new events while that consumer's UNREAD backlog is at 90% of the ceiling, until it is
below 80%, and, on a full stream, while the history that consumer has already read (which
DiscardOld removes first) would all be discarded within 30 s at the rate the stream is
discarding it (core/messaging/backpressure.go; the declaration is core/streams'
BackpressureReaders). The broker still discards old as the backstop, so the loss rules
above still apply there if the gate is ever outrun. JetStreamUnreadBacklogNearFull and
JetStreamIngestBackpressureEngaged watch it: a gating consumer's backlog nearing the gate,
and the gate engaged. Both are exported by the WRITERS of the stream, not its readers, and the
engaged gauge is evaluated at scrape time, so a gate that cannot measure (and so refuses)
reads 1 rather than a stale 0.

Same operator assumption and gating as the event-processing rules.

THE BROKER'S OWN COUNT, FOR WHEN THE READER IS GONE. Every per-durable backlog series above is
exported by the READING service, so it vanishes exactly while that service is down -- which is
the main way a stream backs up, and the case these alerts exist for. A rule over it then
evaluates an empty vector and stays quiet while the broker holds the whole backlog (measured:
152,000 messages held, no series, no alert). So the capture-backlog alerts, JetStreamDurableFallingBehind
and JetStreamDurableUnreadNearFull each read the reader's series FIRST and fall back, durable by
durable, to the message broker's exporter (nats_consumer_num_pending, nats_consumer_num_ack_pending
and the nats_stream_* limits, already scraped from the broker pods). The two helpers below build the
fallback; it is shaped like the reader's own series (labels stream and durable), so `or` merges them
and a durable the reader still reports is never counted twice.

Two things about that fallback. The broker knows a consumer's pending count only on the consumer's
LEADER, so every aggregation is `max by`. And it is scoped to this instance's streams by name
(`<instance id>_...`) rather than by namespace, because the broker may run in another namespace;
the max-delivery stream and ephemeral consumers (no `_` in their names) are left out, the first
because MaxDeliveryRecordsWaiting watches it and the second because they are not durable readers.
The one series the fallback cannot replace is the gap counter (JetStreamDurableStalledBehindStream):
messages removed ahead of a cursor are not something the broker reports.
*/}}
{{- define "devicechain.brokerUnreadRatio" -}}
max by (stream, durable) (label_replace(label_replace(max by (stream_name, consumer_name) (label_replace(sum by (stream_name, consumer_name) (max by (__name__, stream_name, consumer_name) ({__name__=~"nats_consumer_num_pending|nats_consumer_num_ack_pending", stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries", consumer_name=~"{{ .durable }}"})) / on (stream_name) group_left () max by (stream_name) (nats_stream_limit_messages{stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries"} > 0), "form", "m", "", "") or label_replace(sum by (stream_name, consumer_name) (max by (__name__, stream_name, consumer_name) ({__name__=~"nats_consumer_num_pending|nats_consumer_num_ack_pending", stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries", consumer_name=~"{{ .durable }}"})) * on (stream_name) group_left () (max by (stream_name) (nats_stream_total_bytes{stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries"}) / clamp_min(max by (stream_name) (nats_stream_total_messages{stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries"}), 1)) / on (stream_name) group_left () max by (stream_name) (nats_stream_limit_bytes{stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries"} > 0), "form", "b", "", "")), "stream", "$1", "stream_name", "(.+)"), "durable", "$1", "consumer_name", "(.+)"))
{{- end }}
{{- define "devicechain.brokerPending" -}}
max by (stream, durable) (label_replace(label_replace(nats_consumer_num_pending{stream_name=~"{{ .id }}_.+", stream_name!~".+_max-deliveries", consumer_name=~"{{ .durable }}"{{ if .except }}, consumer_name!~"{{ .except }}"{{ end }}}, "stream", "$1", "stream_name", "(.+)"), "durable", "$1", "consumer_name", "(.+)"))
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{/* The alert label below names the INSTANCE, not its namespace: those are the
     same string today and are about to stop being, so they are spelled apart. */}}
{{- $id := .Values.instance.id }}
{{/* The capture durable's unread ratio: the reader's own series, or where the reader reports none
     (event-sources is down) the broker's count of the same quantity. */}}
{{- $captureReader := printf "{__name__=~\"devicechain_[a-z0-9]+_jetstream_consumer_unread_ratio\", durable=~\".+_event-sources_device-events-capture(_unfiltered)?\", namespace=\"%s\"}" $ns }}
{{- $captureBroker := include "devicechain.brokerUnreadRatio" (dict "id" $id "durable" ".+_event-sources_device-events-capture(_unfiltered)?") }}
{{- $captureRatio := printf "(max by (stream, durable) (%s) or %s)" $captureReader $captureBroker }}
{{/* event-management's backlog on resolved-events: the reader's own series, or where the reader
     reports none (event-management is down) the broker's count of the same quantity. */}}
{{- $emReader := printf "{__name__=~\"devicechain_[a-z0-9]+_jetstream_consumer_pending_messages\", durable=~\".+_event-management_resolved-events\", namespace=\"%s\"}" $ns }}
{{- $emBroker := include "devicechain.brokerPending" (dict "id" $id "durable" ".+_event-management_resolved-events") }}
{{- $emPending := printf "(max by (stream, durable) (%s) or %s)" $emReader $emBroker }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jetstream-delivery
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.jetstream-delivery
      rules:
        # A durable's cursor moved past messages it was never handed. The counter
        # exists at 0 from the moment the reader is created, so increase() sees the
        # FIRST loss too; a pod restart resets it to 0, and a reset followed by a
        # flat series correctly stays silent.
        #
        # 🔑 THE CAPTURE DURABLE IS EXEMPT ON AN INSTANCE WITH FAIL-CLOSED MQTT ON
        # (infrastructure.nats.mqttFailClosed). There a QoS 1 publish is held by the broker's
        # message store, and the copy that also lands in the capture stream is one its reader
        # skips, so what the capture stream evicts is skippable copies plus QoS 0 publishes,
        # which are best effort by contract. The counter cannot tell those from real loss,
        # and in a load test it counted 8.48M skippable evictions as critical while the
        # acknowledged events that were really lost fired nothing. Fail-closed is detected
        # from the platform's own series: devicechain_eventsources_mqtt_failclosed_durable_present
        # is registered ONLY when the setting is on (see prometheusrule-event-sources.yaml),
        # so any sample of it means "on" and an off instance has none. The exemption is
        # for the capture durable ONLY: every other durable still pages, with the setting
        # on or off. If event-sources is down on a fail-closed instance the series is gone
        # and the capture durable pages again, which fails loud rather than quiet.
        - alert: JetStreamDurableLostUnread
          expr: |
            (
              max by (stream, durable) (increase({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_skipped_total", durable!~".+_event-sources_device-events-capture(_unfiltered)?", namespace="{{ $ns }}"}[10m])) > 0
            )
            or
            (
              (max by (stream, durable) (increase({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_skipped_total", durable=~".+_event-sources_device-events-capture(_unfiltered)?", namespace="{{ $ns }}"}[10m])) > 0)
              unless on ()
              (count(devicechain_eventsources_mqtt_failclosed_durable_present{namespace="{{ $ns }}"}) > 0)
            )
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a consumer lost messages it never read"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamDurableFallingBehind and JetStreamDurableUnreadNearFull, which watch this consumer's backlog, tell the two apart."
        # A durable that has stopped reading while the stream discards the messages
        # ahead of it. Its cursor does not move, so the counter above cannot see the
        # loss until it resumes; this gauge states it while it is happening. The gauge
        # is nonzero only for a durable handed NOTHING since the previous sample, so a
        # live reader that is merely slower than its producer (whose evictions the
        # counter above reports) does not fire this. It needs a running pod of the
        # reading service to report it: a service with no pods exports nothing.
        - alert: JetStreamDurableStalledBehindStream
          expr: max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_gap_messages", namespace="{{ $ns }}"}) > 0
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a consumer that stopped reading is losing messages it has not read"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} has been handed no messages for at least two minutes, and the stream has already discarded {{ "{{ $value }}" }} messages ahead of it. They will never be delivered. The consuming service is running, since it reports this, but its consumer is not reading: look for message handling stuck on a dependency such as the database, or pods waiting to become ready. If that cannot be fixed quickly, raise the stream's ceiling so it stops discarding."
        # A durable that has stayed behind its stream: it is reading, and losing nothing
        # yet, but whatever its service derives from the stream is that far behind. The
        # backlog gauge is sampled every 30 s by every service for the durables it reads.
        #
        # 🔑 `for: 15m` over the CURRENT value, not min_over_time() over a window. The
        # gauge is absent until a pod's first sample, and min_over_time() over a series
        # 30 s old is that one sample -- so a pod restarting onto a backlog (every rolling
        # upgrade under load) would fire on its first scrape. `for` is held on the
        # aggregated (stream, durable) series, which carries no pod label, so one pod's
        # restart does not restart it while another replica keeps that series alive; any
        # sample at or below the threshold does, which is what keeps a burst worked off
        # within 15 minutes quiet. With ONE replica (device-state in a small install), a
        # restart withdraws the series until the new pod's first sample, and that DOES
        # restart the clock: a pod that restarts more often than every 15 minutes under a
        # backlog never raises this warning, so its restarts are the signal there.
        #
        # event-processing's resolved-events durable is excluded: DETECT has its own tuned
        # backlog alert (DetectConsumerBacklogHigh) and a takeover replays that durable by
        # design, so this rule would page first on every long replay. The durable is named
        # for its acknowledgement policy: "..._resolved-events_ackfloor" now, and the ordinary
        # "..._resolved-events" of the previous release until the first leader retires it, so
        # both are excluded and a rollback is not paged either.
        - alert: JetStreamDurableFallingBehind
          expr: |
            (
              max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_pending_messages", durable!~".+_event-processing_resolved-events(_ackfloor)?", namespace="{{ $ns }}"})
              or
              {{ include "devicechain.brokerPending" (dict "id" $id "durable" ".+_.+" "except" ".+_event-processing_resolved-events(_ackfloor)?") }}
            ) > 10000
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a consumer has stayed more than 10000 messages behind its stream for 15 minutes"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} has had more than 10000 messages waiting for it for the last 15 minutes ({{ "{{ $value }}" }} now). Whatever that service produces from the stream is that far behind: for device-state, a device's live state lags its stored events. Compare the consumer's rate with the stream's: if the service is keeping pace but not catching up, give it capacity (for device-state, its projection settings and its database); if it has stopped, JetStreamDurableStalledBehindStream and the service's logs say why. If the stream fills first, messages the consumer has not reached will be lost, except where the stream applies backpressure (inbound-events for device-management, resolved-events for event-management): there new events are refused instead (JetStreamIngestBackpressureEngaged)."
        # A stream declared as a SINK is near its ceiling: the failed-message records
        # (failed-decode, failed-events, connector-dispatch.dead), the dead letters, and the
        # max-delivery capture. Nothing processes what a sink holds, so "full" means its
        # oldest records are about to be discarded unseen. Any other stream is left out:
        # what it holds at its ceiling is mostly a week of history its consumers have
        # already read, which loses nothing, and each consumer's own unread backlog is
        # watched by JetStreamDurableUnreadNearFull or, where the stream refuses writers
        # instead, JetStreamUnreadBacklogNearFull.
        #
        # 🔑 SELECTED BY DECLARATION, NOT BY A LIST OR BY ABSENCE. jetstream_stream_sink is
        # 1 for a stream core/streams declares NotLettered ("the stream is itself a sink, or
        # a report") and 0 for every other, so a new sink is covered by the declaration it
        # needs anyway. Selecting instead by "no consumer backlog is reported" would fire on
        # a healthy install whose readers are simply not deployed (resolved-events on the
        # ingest-only profile, device-commands without LwM2M) -- the same history-blind
        # alert this replaced, at another severity.
        #
        # `unless` drops dead-letters while user-management, the service that STORES the
        # letters, reports its consumer backlog there: while it runs, its unread letters are
        # its own to watch (JetStreamDurableUnreadNearFull). It matches that one durable, not
        # any reader of the stream: command-delivery also reads dead-letters, but only to
        # settle its commands, and letters it has read are not stored. Matching any reader
        # would keep this quiet while user-management is down and command-delivery is not,
        # which is exactly when nothing else reports the letters nobody has stored. The
        # max-delivery recorder's durable is deliberately not sampled (core/messaging
        # recorder.go), so max-deliveries stays in; MaxDeliveryRecordsWaiting fires long
        # before this there, and this one says the queue itself is about to discard.
        #
        # Fill is the higher of bytes and messages, as the sampler computes it: a sink of
        # small records reaches its message ceiling first. `> 0` on each limit keeps an
        # unlimited stream (a limit of -1) from dividing by it: that stream has no ceiling
        # to be near, so it drops out of that branch instead of reading as over it.
        #
        # 🔴 `info` IS DELIBERATE, and it is this chart's first use of that severity -- do
        # not "normalise" it to warning. What goes here is the oldest record of a failure,
        # kept for an operator, never a message a consumer would have processed. Note that
        # kube-prometheus-stack's default Alertmanager config suppresses info alerts
        # (InfoInhibitor); the docs tell operators to route it if they want it.
        - alert: JetStreamStreamNearFull
          expr: |
            (
              max by (stream) (
                {__name__=~"devicechain_[a-z0-9]+_jetstream_stream_used_bytes", namespace="{{ $ns }}"}
                / ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_limit_bytes", namespace="{{ $ns }}"} > 0)
              ) > 0.8
              or
              max by (stream) (
                {__name__=~"devicechain_[a-z0-9]+_jetstream_stream_used_messages", namespace="{{ $ns }}"}
                / ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_limit_messages", namespace="{{ $ns }}"} > 0)
              ) > 0.8
            )
            and on (stream)
              (max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_sink", namespace="{{ $ns }}"}) == 1)
            unless on (stream)
              max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_pending_messages", durable=~".+_user-management_dead-letters", namespace="{{ $ns }}"})
            # reader-only: the `unless` operand is the evidence that user-management IS reading the dead letters, so the rule needs the reader's own series by design
          for: 10m
          labels:
            severity: info
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A stream of records nothing processes is near its ceiling"
            description: "Stream {{ "{{ $labels.stream }}" }} is over 80% of its ceiling. It holds records for an operator, not messages a service processes, so nothing has read what it holds, and once it is full it discards its oldest records to make room. On failed-decode, failed-events and connector-dispatch.dead those are the records of messages that failed; on max-deliveries they are notices not yet turned into dead letters (MaxDeliveryRecordsWaiting); on dead-letters, the letters themselves, which fires only while user-management, which stores them, does not report reading them, so check that user-management is running. Find what is filling it and fix that: a decoder rejecting a device's payloads, events that fail to resolve or store, a connector whose destination refuses every send. Raise the stream's ceiling only if the records must be kept for longer."
        # A consumer's UNREAD backlog is over 80% of what its stream can hold. When it
        # reaches the ceiling the stream discards its oldest messages, read or not, and this
        # consumer never processes the ones it had not reached (JetStreamDurableLostUnread).
        # Unlike the stream's fill, history the consumer has already read does not count.
        # Exported by the service that READS the durable, for every durable it reads except
        # the ones whose stream refuses writers for them (JetStreamUnreadBacklogNearFull
        # watches those, from the writers' side), so the two rules never fire for the same
        # durable.
        #
        # event-processing's replay-covered resolved-events durable is included, and what it
        # measures there is the DURABLE, not DETECT's checkpoint (its real position, which
        # it replays from). DETECT acks a message only once its checkpoint covers it, so the
        # checkpoint is never behind what the durable has acknowledged and the ratio is at
        # least its exposure in normal operation: a message evicted before the checkpoint
        # covers it cannot be replayed either.
        #
        # `max by`: every replica measures the same durable. It needs a running pod of the
        # reading service, like the other per-durable rules.
        #
        # Where the reader reports nothing (its service is down) the broker's count of the same
        # ratio stands in for it, so the warning does not go quiet exactly while the backlog
        # builds. A durable whose backlog gates its stream's writers (it exports
        # jetstream_backpressure_unread_ratio instead, watched by JetStreamUnreadBacklogNearFull)
        # is left out of the fallback with `unless`, as it is left out of the reader's series.
        - alert: JetStreamDurableUnreadNearFull
          expr: |
            (
              max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_ratio", namespace="{{ $ns }}"})
              or
              (
                {{ include "devicechain.brokerUnreadRatio" (dict "id" $id "durable" ".+_.+") }}
                unless on (stream, durable)
                max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_backpressure_unread_ratio", namespace="{{ $ns }}"})
              )
            ) > 0.8
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A consumer is close to losing messages it has not read"
            description: "Durable {{ "{{ $labels.durable }}" }} has not yet read {{ "{{ $value | humanizePercentage }}" }} of what stream {{ "{{ $labels.stream }}" }} can hold. Once its unread backlog reaches the stream's ceiling, the stream discards its oldest messages to make room, and this consumer will never process the ones it had not reached (JetStreamDurableLostUnread). New messages are still accepted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."
        # The device-events capture stream will be full within ten minutes at the rate its
        # unread backlog is growing. It is the one stream where an unread message is an event a
        # device has ALREADY been told was accepted: the broker's MQTT gateway PUBACKs before
        # this stream stores the publish, so nothing can refuse it, and once the stream is full
        # it evicts the oldest unread events (core/streams DeviceEventsCapture). The 80%-for-
        # 5-minutes warning above is too late here: in a perf run the backlog went from empty to
        # evicting in about three minutes. So this predicts instead of thresholding: the time
        # left is (1 - ratio) / deriv(ratio), over three minutes of the 30 s samples, and it
        # needs a backlog of at least 10% so a momentary burst does not page.
        #
        # `max by` on both sides: every event-sources replica samples the same durable. The
        # `> 0` on the slope keeps a draining backlog (negative slope) out, rather than reading
        # it as a negative time left. The value is the ratio, from the left-hand side.
        - alert: JetStreamCaptureBacklogWillOverflow
          expr: |
            ({{ $captureRatio }} > 0.1)
            and on (stream, durable)
            (
              (1 - {{ $captureRatio }})
              / (deriv({{ $captureRatio }}[3m:30s]) > 0)
              < 600
            )
          for: 1m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "MQTT events the broker has already acknowledged are about to be lost"
            description: "Durable {{ "{{ $labels.durable }}" }} has not yet forwarded {{ "{{ $value | humanizePercentage }}" }} of what stream {{ "{{ $labels.stream }}" }} can hold, and at the rate that backlog grew over the last three minutes the stream will be full within ten. Every event in it was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. If event-sources is not busy on CPU, its publish window is the limit: devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"} grows by close to a second per second; add event-sources replicas, each of which brings its own window (capture.publishWindow already defaults to its maximum, 1024; raise it only if it was lowered). If inbound-events is refusing new events (JetStreamIngestBackpressureEngaged), the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume, and streamMaxMsgs too if the stream fills by message count first (small payloads); event-sources applies the new ceilings when it restarts."
        # The early tier of the rule above: the same capture backlog on course to fill within
        # TWENTY minutes. The critical rule fired 2 min 15 s before loss in the overload run
        # that added it, which is enough to look but not to add replicas and have them take
        # load. This one is a warning, so it can afford a longer horizon: it reads the slope
        # over five minutes rather than three (a slower, steadier line to extrapolate from),
        # needs the same 10% floor, and holds for two minutes. It stays a sibling rather than
        # a second threshold on one rule so the page and the heads-up route independently.
        - alert: JetStreamCaptureBacklogGrowing
          expr: |
            ({{ $captureRatio }} > 0.1)
            and on (stream, durable)
            (
              (1 - {{ $captureRatio }})
              / (deriv({{ $captureRatio }}[5m:30s]) > 0)
              < 1200
            )
          for: 2m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "MQTT events waiting to be forwarded are piling up faster than they leave"
            description: "Durable {{ "{{ $labels.durable }}" }} has not yet forwarded {{ "{{ $value | humanizePercentage }}" }} of what stream {{ "{{ $labels.stream }}" }} can hold, and at the rate that backlog grew over the last five minutes the stream will be full within twenty. This is the early warning for JetStreamCaptureBacklogWillOverflow, which fires when ten minutes remain. Every event in the backlog was sent by an MQTT device that the broker has already acknowledged, so the platform cannot refuse them: once the stream is full it discards the oldest unforwarded ones and the devices are never told (JetStreamDurableLostUnread). Devices are publishing faster than event-sources forwards. Add event-sources replicas now, each of which brings its own publish window, and look at event-sources CPU and at devicechain_eventsources_jetstream_publish_window_full_seconds_total{writer=\"capture\"}; if JetStreamIngestBackpressureEngaged is firing, the slow consumer is further downstream. To buy time, raise streamMaxBytes together with the JetStream volume."
        # The capture stream changed LEADER while events were arriving. Unlike every other
        # stream, nothing can refuse a publish into it: the broker's MQTT gateway writes each
        # device publish to it with no reply, after the device has had its acknowledgement. A
        # publish that arrives while the stream has no leader (an election takes seconds) is
        # stored nowhere, and no counter sees it: it never got a sequence, so
        # unread_skipped stays at zero and JetStreamDurableLostUnread cannot fire. A leader
        # change is therefore the only trace of that loss, which is why this alert exists.
        #
        # Exported by every service that reads the stream's info, from its 30 s sample: a
        # change of leader between two samples, or a sample that found the stream leaderless.
        # The series is created at zero when the stream is first read, so increase() sees the
        # first change. `max by (stream)`: every pod counts the same change. A change shorter
        # than one sample that comes back to the same server is not seen.
        #
        # "While ingest is active" is read from event-sources' inbound message counter having
        # moved in the same 15 minutes (any source: the gateway's name is operator-chosen), so
        # a leader change on an idle instance, which loses nothing, stays quiet. A warning, not
        # a page: a rolling restart of the broker moves leaders on purpose.
        - alert: JetStreamCaptureLeaderChanged
          expr: |
            (
              max by (stream) (increase({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_leader_changes_total", stream=~".*device-events-capture", namespace="{{ $ns }}"}[15m])) > 0
            )
            and on ()
            (
              sum(increase(devicechain_eventsources_total_inbound_messages{namespace="{{ $ns }}"}[15m])) > 0
            )
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The MQTT capture stream changed leader while devices were publishing"
            description: "Stream {{ "{{ $labels.stream }}" }} changed leader within the last 15 minutes while events were arriving. While a stream has no leader, which lasts several seconds, the broker's MQTT gateway still acknowledges device QoS 1 publishes into it and stores them nowhere, and nothing counts them: JetStreamDurableLostUnread does not fire for this loss, so MQTT events published during the change may have been acknowledged to their devices and lost. In a 12,000 events per second test one such step-down lost about five seconds of events. Look in the broker logs for 'Leader falling behind, stepping down': that is a leader whose node is overloaded, so check the broker's node CPU and whether the capture leader shares a node with the inbound-events leader. A planned broker restart moves leaders too and may lose events the same way, so schedule one at low traffic. This is a known limitation of MQTT ingest, described with the MQTT transport in the documentation."
        # A reader the broker does not filter for (the device-events capture's: its durable is
        # unfiltered on the broker, see core/messaging NewReader) dropped messages stored under a
        # subject it does not hand out. Device publishes cannot produce one; another stream's push
        # consumer delivering onto a device telemetry subject can, and that is a write into device
        # intake by something that is not a device. Nothing reached the platform, so a warning, but
        # any increase is a finding. The series is created at zero when the reader is built, so
        # increase() sees the first drop. `max by`: every event-sources replica counts its own.
        - alert: JetStreamReaderForeignDropped
          expr: max by (stream, durable) (increase({__name__=~"devicechain_[a-z0-9]+_jetstream_reader_foreign_dropped_total", namespace="{{ $ns }}"}[15m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The device capture reader dropped messages that no device published"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} was handed messages stored under a subject it does not read, and dropped them without passing them on: {{ "{{ $value }}" }} in the last 15 minutes. Its broker-side consumer reads the whole stream unfiltered, so the reader itself keeps only the subjects devices publish telemetry on. Device publishes never land there under another subject, so a dropped message was put into the stream some other way, most likely by a push consumer on another stream whose delivery subject is a device telemetry subject. Nothing was forwarded and no device event is missing, but whoever can create such a consumer is writing into device intake: look for push consumers with a device telemetry delivery subject (nats consumer ls on each stream) and at which login created them. The reader logs the subject and sequence of the first message it drops."
        # A gating consumer's UNREAD backlog is over 80% of what its stream can hold. At
        # 90% the stream's writers refuse new events (JetStreamIngestBackpressureEngaged).
        # Exported by every service that WRITES the stream, for the consumers that gate it
        # (device-management's on inbound-events, event-management's on resolved-events).
        # `max by`: every writer pod measures the same consumer.
        - alert: JetStreamUnreadBacklogNearFull
          expr: max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_backpressure_unread_ratio", namespace="{{ $ns }}"}) > 0.8
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A consumer's unread backlog is near its stream's ceiling"
            description: "Durable {{ "{{ $labels.durable }}" }} has not yet processed {{ "{{ $value | humanizePercentage }}" }} of what stream {{ "{{ $labels.stream }}" }} can hold. At 90% the platform stops accepting new events on that stream, for every tenant, rather than discard events this consumer has not read: HTTP devices are answered 503 with a Retry-After, MQTT devices' events wait in the capture stream, and Sparkplug and LwM2M readings, and events from an external MQTT broker, are dropped and counted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."
        # The gate is closed: the stream's writers are refusing new events. Evaluated at
        # scrape time, so it also reads 1 while a writer cannot measure the backlog (a gate
        # that cannot measure refuses). `max by`: any writer pod refusing is an outage.
        - alert: JetStreamIngestBackpressureEngaged
          expr: max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_backpressure_engaged", namespace="{{ $ns }}"}) > 0
          for: 1m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The platform is refusing new events so as not to lose unread ones"
            description: "Stream {{ "{{ $labels.stream }}" }} is refusing new events, for every tenant: a consumer's unread backlog reached 90% of the stream's ceiling, the events it has already processed that the full stream still holds ahead of its unread ones would be discarded within 30 seconds at the rate the stream is discarding them, or a service writing to it could not measure that backlog for 30 seconds. HTTP devices are answered 503 with a Retry-After and should retry. Events from MQTT devices were already acknowledged by the broker and wait in the capture stream, which discards its oldest once it is full (JetStreamDurableLostUnread). Sparkplug and LwM2M readings, and events from an external MQTT broker, are dropped and counted. JetStreamUnreadBacklogNearFull names the consumer that is behind; when it is quiet, it is the second case, and jetstream_backpressure_history_runway_seconds and the writing service's log name the consumer. If neither names a consumer, the writing service may not be reaching the broker at all: look in its log for \"Disconnected from NATS\" or a write to the NATS server that \"made no progress\", and for BrokerConnectionDiedSilently; the refusal then lifts once it has reconnected. The refusal lifts once the backlog is below 80% and, if the history was the cause, once that history would last a minute or the consumer has read everything."
        # A service gave up a broker connection that had died WITHOUT being closed: the
        # server left its pings unanswered, or a write to it made no progress for 10 s
        # (core/messaging/broker_liveness.go). That is the trace of a lost or restarted
        # node, a partition, or a server that stopped reading, and it is often the ONLY
        # trace: a machine that restarts inside the node-monitor grace period is never
        # marked NotReady. The service reconnected on its own; this records that it was cut
        # off meanwhile.
        #
        # 🔑 A TIMESTAMP, NOT increase() OVER THE COUNTER. A lost node is where Prometheus
        # itself may have been running, and increase() misses an event whose first sample it
        # never scraped (a counter that first appears at 1 has nothing to increase from).
        # The gauge holds the time of the last one, so any single sample within the 15
        # minutes fires the alert. It is 0 until the first event, hence `> 0` before the
        # max: a pod that never lost a connection is not one that lost it at the epoch.
        # `max by (job)`: the latest event among the job's pods.
        - alert: BrokerConnectionDiedSilently
          expr: time() - max by (job) ({__name__=~"devicechain_[a-z0-9]+_nats_connection_dead_last_timestamp_seconds", namespace="{{ $ns }}"} > 0) < 900
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A service's connection to the message broker died without being closed"
            description: "{{ "{{ $labels.job }}" }} gave up a connection to the message broker {{ "{{ $value | humanizeDuration }}" }} ago, because the server had stopped answering without closing it, and reconnected. A machine that stops or restarts abruptly, a network partition, or a broker server that stopped reading looks like this. Until it gave the connection up, for up to 40 seconds, and then reconnected, that service could neither publish nor receive: if it is event-sources, HTTP ingest was refused or timed out. nats_connection_dead_total says how often, and whether pings or a stalled write detected it. Check whether a node was lost or restarted: kubectl get nodes, and the cloud provider's VM events, because Kubernetes records nothing for a machine that restarts within its node grace period (roughly 40 to 50 seconds). Run dcctl ha verify. Repeats for the same job with no node event point at the network between that service and the broker."
        # A capacity-bounded reader held a message past its AckWait. Selected by name
        # like the rules above: core builds the counter for every capacity reader, under
        # the adopting service's own subsystem.
        - alert: ReaderHeldMessagePastAckWait
          # `sum`, not `max`: each pod counts only the messages IT held, so the pods' counts
          # add up rather than repeat one another. The series are initialised at 0 when the
          # reader is created, so increase() sees a pod's first occurrence rather than
          # missing it.
          expr: sum by (durable, stage) (increase({__name__=~"devicechain_[a-z0-9]+_reader_held_past_ack_wait_total", namespace="{{ $ns }}"}[15m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A service held a message past its acknowledgement window, so it was redelivered"
            description: "The reader for durable {{`{{ $labels.durable }}`}} held a message longer than the broker waits for an acknowledgement, so the broker handed it out again. stage=worker: a send was still running when that happened, so the message may have been sent twice -- look for a slow or unresponsive destination behind this service. stage=buffer: the reader dropped a message it had fetched but not yet handed to a worker, and the broker's redelivery is handled instead; nothing was sent twice, but the service is not keeping up."
        - alert: MaxDeliveryRecordsWaiting
          # The max-delivery capture is a WORK QUEUE: a recorder acks each advisory once it
          # has dead-lettered (or deliberately skipped) the message it names, and the ack
          # deletes it. So the stream's message count is exactly the abandoned deliveries no
          # recorder has written down yet, and on a healthy instance it drains to zero within
          # seconds. `max`, not `sum`: every pod that ensures the stream samples the same count.
          #
          # 🔴 `[a-z0-9]+`, NOT `.+` -- the reasoning is on DeadLetterWriteLost in
          # prometheusrule-dead-letter.yaml.
          expr: max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_used_messages", stream=~".+max-deliveries", namespace="{{ $ns }}"}) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Messages that ran out of delivery attempts are waiting to be recorded"
            description: "{{`{{ $value }}`}} notice(s) of messages whose every delivery attempt ran out have been waiting on {{`{{ $labels.stream }}`}} for 15 minutes without being turned into dead letters. Each service records its own; one that is down or crash-looping records late, so first check that every service is running and look in its logs for errors from the max-delivery recorder. A notice that stays after every service is healthy names a consumer no running service reads any more (a reader removed by an upgrade); it will not be recorded, and can be deleted from the stream."
        # A consumer declared REPLAY-COVERED ran out of deliveries. Such a consumer acks a
        # message only once its own checkpoint covers it, and after a restart re-reads the
        # stream from that checkpoint, so the broker giving up on a delivery loses nothing and
        # is deliberately not dead-lettered (core/streams: Stream.ReplayCovered). What it DOES
        # mean is that the consumer's checkpoint has not been saved for longer than the
        # broker's whole redelivery budget -- typically its database is unreachable -- and
        # this counter is the only place that shows up per stream.
        #
        # `sum`, not `max`: an area's replicas share one recorder durable, so each exhaustion
        # is counted by exactly one pod. The series exist at 0 from the recorder's start, so
        # increase() sees the first one. Selected by name like the rules above.
        - alert: ReplayCoveredDeliveriesExhausted
          expr: sum by (job, stream) (increase({__name__=~"devicechain_[a-z0-9]+_max_delivery_records_total", outcome="replay-covered", namespace="{{ $ns }}"}[15m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A consumer ran out of delivery attempts because it could not save its checkpoint"
            description: "{{`{{ $value }}`}} message(s) on {{`{{ $labels.stream }}`}} ran out of delivery attempts to {{`{{ $labels.job }}`}} in the last 15 minutes. This consumer re-reads the stream from its own saved checkpoint, so nothing has been lost and no dead letter is written, but its checkpoint has not been saved for longer than the broker keeps redelivering: look for the service's database or broker connection failing. While it is running it keeps what it has read in memory and saves it when the checkpoint succeeds. If it restarts first, it re-reads the stream from the last saved checkpoint, and a message the stream has already discarded cannot be re-read (JetStreamDurableUnreadNearFull warns before that)."
        # The event store cannot take writes. event-management HOLDS the events its database
        # refused (disk full, read-only, out of connections, unreachable): unacked, not counted
        # against their delivery budget, written again as soon as the store accepts. This is the
        # direct signal that persistence is down; the volume alerts (DatabaseVolumeFillsWithinDay,
        # DatabaseVolumeAlmostFull, DatabaseVolumeCritical) say why, before it happens. While it
        # holds, the writer stops reading, the unread backlog in resolved-events grows, and the
        # stream's backpressure gate refuses new events upstream (JetStreamIngestBackpressureEngaged)
        # rather than let the stream discard unread ones. `max`: any pod holding is an outage of
        # persistence for the instance.
        - alert: EventStoreRefusingWrites
          expr: max({__name__=~"devicechain_eventmanagement_persist_store_held_events", namespace="{{ $ns }}"}) > 0
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The event store is refusing writes; events are being held, not stored"
            description: "event-management is holding {{ "{{ $value }}" }} events its database refused. They are not lost: they stay unacknowledged in the message broker and are stored once the database accepts writes again. Nothing new is being stored meanwhile, and the longer this lasts the larger the backlog behind it; once the backlog fills 90% of the resolved-events stream the platform refuses new events (JetStreamIngestBackpressureEngaged), and MQTT events the broker has already acknowledged wait in the capture stream, which discards its oldest once full. The usual cause is a full volume: check DatabaseVolumeCritical and the event-store claim (kubectl get pvc, and the database pod's log for 'No space left on device'), and expand it (spec.storage.size on the dc-tsdb Cluster; online where the storage class allows it) or lower the event retention. Otherwise look for a read-only primary or an exhausted connection limit."
        # The same condition for every OTHER consumer that writes to a database (core/storehold):
        # device-management's event resolver, raise-alarm and device-reports consumers, and
        # command-delivery, notification-management and update-management's. Each HOLDS the
        # messages its database refused, unacked and outside their delivery budget, and runs them
        # again when the store answers; this gauge is the number held, per consumer. Before the
        # hold those messages were lettered and acked at their last delivery (about four minutes
        # in), so a database outage lost acknowledged data. `max by (job, consumer)` names the
        # service and the consumer; event-management has its own, above.
        - alert: ConsumerHoldingForDatabase
          expr: max by (job, consumer) ({__name__=~"devicechain_[a-z0-9]+_store_held_messages", namespace="{{ $ns }}"}) > 0
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A service is holding messages because its database refuses writes"
            description: "{{ "{{ $labels.job }}" }} is holding {{ "{{ $value }}" }} message(s) in its {{ "{{ $labels.consumer }}" }} consumer that its database refused. They are not lost: they stay unacknowledged in the message broker and are processed once the database accepts writes again. That consumer is not making progress meanwhile, so what it does is delayed: device events resolved, alarm edges applied, commands answered, notifications sent or update reports recorded, depending on the consumer. The usual cause is a full volume: check DatabaseVolumeCritical and the service's database claim (kubectl get pvc, and the database pod's log for 'No space left on device'), and expand it (spec.storage.size on the Cluster; online where the storage class allows it). Otherwise look for a read-only primary or an exhausted connection limit."
        # The event-management consumer is behind AND getting further behind. The existing
        # JetStreamDurableFallingBehind waits 15 minutes at 10000 messages; this one watches the
        # slope, which separates a store that is down from a burst being worked off: a backlog
        # that has risen steadily for ten minutes will not drain on its own. It reads the
        # broker's pending count, so it still reports while event-management is down.
        - alert: EventPersistBacklogGrowing
          expr: |
            (
              {{ $emPending }} > 1000
            )
            and on (stream, durable)
            (
              deriv({{ $emPending }}[10m:30s]) > 0
            )
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Events are arriving faster than the event store persists them"
            description: "Durable {{ "{{ $labels.durable }}" }} has {{ "{{ $value }}" }} events waiting and the backlog has grown steadily for ten minutes. Either the event store is down or refusing writes (EventStoreRefusingWrites, DatabaseVolumeCritical), or ingest is outrunning persistence: compare the batch-size histogram on the persistence dashboard and the database's CPU and IOPS, and raise persistence.writers or persistence.maxBatch. At 90% of the resolved-events ceiling new events are refused (JetStreamIngestBackpressureEngaged) rather than discarded."
{{- end }}
