{{/*
Optional Ingress exposing the console + GraphQL/HTTP surface, with cert-manager
TLS. The ingress-nginx controller and cert-manager themselves come from the
OpenTofu infra (deploy/opentofu); this renders the per-instance routing + Issuer
once those exist. Disabled by default.

Two routing concerns share one host:

  - /api/<area>  → the functional-area Service (the /api/<area> prefix is stripped
    so /api/<area>/graphql reaches the service's /graphql). This matches the
    browser contract in frontend/src/lib/graphql/client.ts, so the same relative
    URLs work in `vite dev` (proxy) and against a real instance.
  - /            → the web console Service, which serves the SPA and falls back to
    index.html for client-side routes.

These live on SEPARATE Ingress objects because they need different rewrite
behavior: the API ingress strips the prefix (rewrite-target), while the console
ingress must pass the path through untouched so nginx can serve assets and do its
own SPA fallback. ingress-nginx merges both for the host; the more-specific
/api/<area> regex locations are matched before the "/" prefix.

When TLS is on and selfSigned, a cert-manager self-signed Issuer is rendered in
this namespace (dev-grade: valid TLS, browser-untrusted); for real certs set
selfSigned=false and point clusterIssuer at a configured ClusterIssuer.
*/}}
{{- if .Values.ingress.enabled }}
{{- $root := . -}}
{{- $tls := .Values.ingress.tls -}}
{{- if and $tls.enabled $tls.selfSigned }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $tls.issuerName }}
  namespace: {{ .Values.instance.id }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devicechain-api
  namespace: {{ .Values.instance.id }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
  annotations:
    # Strip the /api/<area> prefix so the request reaches the service at its own root.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # The /auth/* endpoints (JWKS + the service-token mint, ADR-044 amendment) are
    # consumed by peers in-cluster via the Service DNS, never through this public
    # host. Refuse them at the edge so the mint — a shared-secret→token exchange —
    # is not a publicly reachable oracle; in-cluster callers hit the Service
    # directly and are unaffected.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* "^/api/[^/]+/auth(/|$)") { return 404; }
    {{- if $tls.enabled }}
    {{- if $tls.selfSigned }}
    cert-manager.io/issuer: {{ $tls.issuerName }}
    {{- else if $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* An area that serves no external API gets no public /api route: the
                 route would expose its Prometheus endpoint unauthenticated rather
                 than expose an API. The set is named in devicechain.areasWithoutPublicApi
                 — it used to be an inline "ne sparkplug-ingest" here, and lwm2m-ingest
                 was added in exactly the same shape without it. */ -}}
          {{- $noPublicApi := splitList "," (include "devicechain.areasWithoutPublicApi" $root) }}
          {{- range $area := splitList "," (include "devicechain.enabledAreas" $root) }}
          {{- if not (has $area $noPublicApi) }}
          - path: /api/{{ $area }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $area }}
                port:
                  name: graphql
          {{- end }}
          {{- end }}
{{- $mcpEnabled := has "mcp" (splitList "," (include "devicechain.enabledAreas" $root)) }}
{{- $asIssuer := include "devicechain.userManagementIssuerUrl" $root }}
{{- if or $mcpEnabled $asIssuer }}
---
{{/*
The OAuth metadata documents, at the locations a conformant client asks for.

WHY THIS IS A THIRD INGRESS OBJECT

Discovery is a three-request walk and it starts at a 401. The client POSTs the MCP
endpoint, reads the metadata URL out of the WWW-Authenticate challenge, fetches it, and
then fetches the AUTHORIZATION SERVER's metadata at a location it derives from the
`authorization_servers` entry in the first document. All three are required steps, and
the reference client aborts the whole walk on the first error rather than falling
through to a later candidate — so any one of them landing on the console is the end of
discovery, not a degraded path.

Requests two and three both start with /.well-known/, because both specifications build
their location by INSERTING the well-known suffix between the host and the identifier's
path. Neither therefore starts with /api/<area>, so the API ingress above does not match
either and the console's "/" does — and the console answers 200 with index.html, which a
client reports as a decode failure rather than as a routing problem.

They cannot be paths on the API ingress: its rewrite-target is /$2, built for paths
shaped /api/<area>/<rest>, and there is no way to write these in that shape such that
the rewrite produces the pod-local path. So they get their own object with NO rewrite,
which is also the better arrangement: the path a client asks for is the path the pod is
asked for, with nothing in between to keep in step.

🔴 THE PATHS HERE ARE THE CONSTANT SUFFIXES, ROUTED AS PREFIXES — the chart does NOT
compute the insertion. It could: it has both identifiers. But that would be a second
implementation of a construction rule that already exists in Go, written in another
language, exercised against its own expectations, and compared with the first by
nothing. The two would agree until the day they did not, and the symptom would be a
document reachable only at a path no client asks for. Routing the suffix instead hands
the whole namespace to the service that owns the identifier, and that service decides
which exact path is correct — one implementation, in core's WellKnownPath. Anything else
under a suffix is refused by that service, with a message naming the right location.

Handing over a whole /.well-known/ subtree is safe because each suffix is registered by
its own RFC for exactly one purpose, and in this instance exactly one service serves it:
protected-resource metadata is the MCP server's, authorization-server metadata is the
AS's. A test in core pins that neither suffix is a prefix of the other, since one
swallowing the other would route a client to the wrong service.

The AS rule renders only when an issuer is configured. The Authorization Server is a
separate switch from the mcp area, and with no issuer there is no AS to route to — mcp
then still serves its own metadata and no client can obtain a token, which is the
documented state rather than a routing gap.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devicechain-wellknown
  namespace: {{ .Values.instance.id }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
  annotations:
    # No rewrite, deliberately: each service serves its document at the exact path the
    # client asks for. No cert-manager annotation either — the API ingress owns the
    # Certificate for this host's secret and a second issuer annotation would race a
    # competing Certificate onto it.
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* pathType Prefix rather than Exact, and the distinction is smaller than
                 it looks: the API ingress above sets a rewrite-target, and ingress-nginx
                 turns EVERY path for a host into a case-insensitive regex location as
                 soon as any ingress for that host rewrites, ordering them by descending
                 length. "Exact" would therefore not be exact here either. Prefix is what
                 is meant in any case — the subtree belongs to the service — and the
                 service 404s the paths within it that are not its document. Both are
                 longer than the console's "/", so both win against it. */}}
          {{- if $mcpEnabled }}
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  name: graphql
          {{- end }}
          {{- if $asIssuer }}
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: user-management
                port:
                  name: graphql
          {{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devicechain-web
  namespace: {{ .Values.instance.id }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
  annotations:
    # No rewrite: the console nginx serves /assets/* verbatim and falls back to
    # index.html itself, so the path must reach it unchanged.
    #
    # No cert-manager annotation here: the API ingress above owns the Certificate
    # for this host's secret; this ingress only reuses that secret for TLS, so a
    # second issuer annotation would race a competing Certificate onto it.
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}
{{- end }}
