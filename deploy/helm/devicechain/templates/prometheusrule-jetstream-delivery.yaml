{{/*
Alerting rules for JetStream DELIVERY: messages a stream discarded before a reader got
to them, streams approaching the ceiling (ADR-023) at which that starts, and messages a
capacity-bounded reader held past their acknowledgement window.

WHY THIS GROUP EXISTS. Every stream is bounded and discards its OLDEST message once
full (DiscardOld). That is the right policy for a platform that must keep ingesting,
and it is silent by construction: the broker removes the message, a durable that had
not reached it steps over the hole on its next pull, and nothing records that the
message was never read. The two per-durable series below are that record, sampled by
every service for the durables it reads (core/messaging/stream_metrics.go).

A stream's FILL cannot say whether any reader was behind what went: every stream keeps a
week of history, so a busy one sits at its ceiling full of messages its readers have
already read, which loses nothing. So the warning BEFORE a loss is per durable, on its
UNREAD backlog against the ceiling (jetstream_consumer_unread_ratio,
JetStreamDurableUnreadNearFull), and the fill alert is kept only for the streams declared
as sinks, where nothing processes what is held (JetStreamStreamNearFull).

🔑 SELECTED BY NAME, NOT LISTED — the same reasoning as DeadLetterWriteLost in
prometheusrule-dead-letter.yaml. Every service that reads a stream exports these series under its
own subsystem, so a regex over the name covers every reader with no list to keep.
`[a-z0-9]+`, NOT `.+`: the area segment never contains `_` (its dashes are stripped),
so the stricter form matches the one name core builds and nothing else.

🔑 `max by`, NEVER `sum`, for the broker-sampled series (the unread counter and gap,
and the fill gauges). Every replica of a service samples the same durable and counts
the same removal, so summing across pods would multiply one loss by the replica
count. The held-past-AckWait counter is the opposite case and is summed: each pod
counts only the messages IT held (see that rule).

A CONSUMER THAT STAYS BEHIND loses nothing and fails nothing, and is still wrong: what
its service derives from the stream (device-state's live state, say) lags by however
far behind it is. The per-durable backlog gauge, sampled beside the unread pair, is
that number; JetStreamDurableFallingBehind watches it.

A LATE DELIVERY is the other way a reader goes wrong without failing. A consumer that
falls behind its broker does not error: the broker redelivers what the consumer held
too long, and the consumer handles the redelivery as though it were new. For a service
whose handling is an EXTERNAL SEND -- a page to a human, a webhook to someone else's
server -- that is a second send nobody can take back, and nothing in the service's own
success metrics looks wrong while it happens. reader_held_past_ack_wait_total is the
only record of it.

THE MAX-DELIVERY RECORD is the third. A message whose every delivery ran out is
dead-lettered by the service that read it (core/messaging's recorder); the two rules at
the end watch that record: notices waiting unrecorded on the capture stream, and
exhaustions the recorder deliberately did NOT letter because the consumer re-reads the
stream from its own checkpoint -- which lose nothing, but mean that checkpoint is failing.

BACKPRESSURE is the exception to "discards its oldest". On the two ingest streams whose
unread loss is device data (inbound-events, gated on device-management's consumer, and
resolved-events, gated on event-management's), the services that write the stream refuse
new events while that consumer's UNREAD backlog is at 90% of the ceiling, until it is
below 80% (core/messaging/backpressure.go; the declaration is core/streams'
BackpressureReaders). The broker still discards old as the backstop, so the loss rules
above still apply there if the gate is ever outrun. JetStreamUnreadBacklogNearFull and
JetStreamIngestBackpressureEngaged watch it: a gating consumer's backlog nearing the gate,
and the gate engaged. Both are exported by the WRITERS of the stream, not its readers, and the
engaged gauge is evaluated at scrape time, so a gate that cannot measure (and so refuses)
reads 1 rather than a stale 0.

Same operator assumption and gating as the event-processing rules.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{/* The alert label below names the INSTANCE, not its namespace: those are the
     same string today and are about to stop being, so they are spelled apart. */}}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jetstream-delivery
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.jetstream-delivery
      rules:
        # A durable's cursor moved past messages it was never handed. The counter
        # exists at 0 from the moment the reader is created, so increase() sees the
        # FIRST loss too; a pod restart resets it to 0, and a reset followed by a
        # flat series correctly stays silent.
        - alert: JetStreamDurableLostUnread
          expr: max by (stream, durable) (increase({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_skipped_total", namespace="{{ $ns }}"}[10m])) > 0
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a consumer lost messages it never read"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} stepped past messages that were removed before it read them, so they were never processed. If a tenant was being deleted, this is expected: the deletion purged messages the consumer had not reached yet. Otherwise the stream was full and discarding its oldest messages while this consumer was behind: either the stream's ceiling is too small for the traffic, or the consumer is slower than its producer. JetStreamDurableFallingBehind and JetStreamDurableUnreadNearFull, which watch this consumer's backlog, tell the two apart."
        # A durable that has stopped reading while the stream discards the messages
        # ahead of it. Its cursor does not move, so the counter above cannot see the
        # loss until it resumes; this gauge states it while it is happening. The gauge
        # is nonzero only for a durable handed NOTHING since the previous sample, so a
        # live reader that is merely slower than its producer (whose evictions the
        # counter above reports) does not fire this. It needs a running pod of the
        # reading service to report it: a service with no pods exports nothing.
        - alert: JetStreamDurableStalledBehindStream
          expr: max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_gap_messages", namespace="{{ $ns }}"}) > 0
          for: 2m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a consumer that stopped reading is losing messages it has not read"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} has been handed no messages for at least two minutes, and the stream has already discarded {{ "{{ $value }}" }} messages ahead of it. They will never be delivered. The consuming service is running, since it reports this, but its consumer is not reading: look for message handling stuck on a dependency such as the database, or pods waiting to become ready. If that cannot be fixed quickly, raise the stream's ceiling so it stops discarding."
        # A durable that has stayed behind its stream: it is reading, and losing nothing
        # yet, but whatever its service derives from the stream is that far behind. The
        # backlog gauge is sampled every 30 s by every service for the durables it reads.
        #
        # 🔑 `for: 15m` over the CURRENT value, not min_over_time() over a window. The
        # gauge is absent until a pod's first sample, and min_over_time() over a series
        # 30 s old is that one sample -- so a pod restarting onto a backlog (every rolling
        # upgrade under load) would fire on its first scrape. `for` is held on the
        # aggregated (stream, durable) series, which carries no pod label, so one pod's
        # restart does not restart it while another replica keeps that series alive; any
        # sample at or below the threshold does, which is what keeps a burst worked off
        # within 15 minutes quiet. With ONE replica (device-state in a small install), a
        # restart withdraws the series until the new pod's first sample, and that DOES
        # restart the clock: a pod that restarts more often than every 15 minutes under a
        # backlog never raises this warning, so its restarts are the signal there.
        #
        # event-processing's resolved-events durable is excluded: DETECT has its own tuned
        # backlog alert (DetectConsumerBacklogHigh) and a takeover replays that durable by
        # design, so this rule would page first on every long replay.
        - alert: JetStreamDurableFallingBehind
          expr: max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_pending_messages", durable!~".+_event-processing_resolved-events", namespace="{{ $ns }}"}) > 10000
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a consumer has stayed more than 10000 messages behind its stream for 15 minutes"
            description: "Durable {{ "{{ $labels.durable }}" }} on stream {{ "{{ $labels.stream }}" }} has had more than 10000 messages waiting for it for the last 15 minutes ({{ "{{ $value }}" }} now). Whatever that service produces from the stream is that far behind: for device-state, a device's live state lags its stored events. Compare the consumer's rate with the stream's: if the service is keeping pace but not catching up, give it capacity (for device-state, its projection settings and its database); if it has stopped, JetStreamDurableStalledBehindStream and the service's logs say why. If the stream fills first, messages the consumer has not reached will be lost, except where the stream applies backpressure (inbound-events for device-management, resolved-events for event-management): there new events are refused instead (JetStreamIngestBackpressureEngaged)."
        # A stream declared as a SINK is near its ceiling: the failed-message records
        # (failed-decode, failed-events, connector-dispatch.dead), the dead letters, and the
        # max-delivery capture. Nothing processes what a sink holds, so "full" means its
        # oldest records are about to be discarded unseen. Any other stream is left out:
        # what it holds at its ceiling is mostly a week of history its consumers have
        # already read, which loses nothing, and each consumer's own unread backlog is
        # watched by JetStreamDurableUnreadNearFull or, where the stream refuses writers
        # instead, JetStreamUnreadBacklogNearFull.
        #
        # 🔑 SELECTED BY DECLARATION, NOT BY A LIST OR BY ABSENCE. jetstream_stream_sink is
        # 1 for a stream core/streams declares NotLettered ("the stream is itself a sink, or
        # a report") and 0 for every other, so a new sink is covered by the declaration it
        # needs anyway. Selecting instead by "no consumer backlog is reported" would fire on
        # a healthy install whose readers are simply not deployed (resolved-events on the
        # ingest-only profile, device-commands without LwM2M) -- the same history-blind
        # alert this replaced, at another severity.
        #
        # `unless` drops dead-letters while user-management, the service that STORES the
        # letters, reports its consumer backlog there: while it runs, its unread letters are
        # its own to watch (JetStreamDurableUnreadNearFull). It matches that one durable, not
        # any reader of the stream: command-delivery also reads dead-letters, but only to
        # settle its commands, and letters it has read are not stored. Matching any reader
        # would keep this quiet while user-management is down and command-delivery is not,
        # which is exactly when nothing else reports the letters nobody has stored. The
        # max-delivery recorder's durable is deliberately not sampled (core/messaging
        # recorder.go), so max-deliveries stays in; MaxDeliveryRecordsWaiting fires long
        # before this there, and this one says the queue itself is about to discard.
        #
        # Fill is the higher of bytes and messages, as the sampler computes it: a sink of
        # small records reaches its message ceiling first. `> 0` on each limit keeps an
        # unlimited stream (a limit of -1) from dividing by it: that stream has no ceiling
        # to be near, so it drops out of that branch instead of reading as over it.
        #
        # 🔴 `info` IS DELIBERATE, and it is this chart's first use of that severity -- do
        # not "normalise" it to warning. What goes here is the oldest record of a failure,
        # kept for an operator, never a message a consumer would have processed. Note that
        # kube-prometheus-stack's default Alertmanager config suppresses info alerts
        # (InfoInhibitor); the docs tell operators to route it if they want it.
        - alert: JetStreamStreamNearFull
          expr: |
            (
              max by (stream) (
                {__name__=~"devicechain_[a-z0-9]+_jetstream_stream_used_bytes", namespace="{{ $ns }}"}
                / ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_limit_bytes", namespace="{{ $ns }}"} > 0)
              ) > 0.8
              or
              max by (stream) (
                {__name__=~"devicechain_[a-z0-9]+_jetstream_stream_used_messages", namespace="{{ $ns }}"}
                / ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_limit_messages", namespace="{{ $ns }}"} > 0)
              ) > 0.8
            )
            and on (stream)
              (max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_sink", namespace="{{ $ns }}"}) == 1)
            unless on (stream)
              max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_pending_messages", durable=~".+_user-management_dead-letters", namespace="{{ $ns }}"})
          for: 10m
          labels:
            severity: info
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A stream of records nothing processes is near its ceiling"
            description: "Stream {{ "{{ $labels.stream }}" }} is over 80% of its ceiling. It holds records for an operator, not messages a service processes, so nothing has read what it holds, and once it is full it discards its oldest records to make room. On failed-decode, failed-events and connector-dispatch.dead those are the records of messages that failed; on max-deliveries they are notices not yet turned into dead letters (MaxDeliveryRecordsWaiting); on dead-letters, the letters themselves, which fires only while user-management, which stores them, does not report reading them, so check that user-management is running. Find what is filling it and fix that: a decoder rejecting a device's payloads, events that fail to resolve or store, a connector whose destination refuses every send. Raise the stream's ceiling only if the records must be kept for longer."
        # A consumer's UNREAD backlog is over 80% of what its stream can hold. When it
        # reaches the ceiling the stream discards its oldest messages, read or not, and this
        # consumer never processes the ones it had not reached (JetStreamDurableLostUnread).
        # Unlike the stream's fill, history the consumer has already read does not count.
        # Exported by the service that READS the durable, for every durable it reads except
        # the ones whose stream refuses writers for them (JetStreamUnreadBacklogNearFull
        # watches those, from the writers' side), so the two rules never fire for the same
        # durable.
        #
        # event-processing's replay-covered resolved-events durable is included, and what it
        # measures there is the DURABLE, not DETECT's checkpoint (its real position, which
        # it replays from). DETECT acks a message only once its checkpoint covers it, so the
        # checkpoint is never behind what the durable has acknowledged and the ratio is at
        # least its exposure in normal operation: a message evicted before the checkpoint
        # covers it cannot be replayed either.
        #
        # `max by`: every replica measures the same durable. It needs a running pod of the
        # reading service, like the other per-durable rules.
        - alert: JetStreamDurableUnreadNearFull
          expr: max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_consumer_unread_ratio", namespace="{{ $ns }}"}) > 0.8
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A consumer is close to losing messages it has not read"
            description: "Durable {{ "{{ $labels.durable }}" }} has not yet read {{ "{{ $value | humanizePercentage }}" }} of what stream {{ "{{ $labels.stream }}" }} can hold. Once its unread backlog reaches the stream's ceiling, the stream discards its oldest messages to make room, and this consumer will never process the ones it had not reached (JetStreamDurableLostUnread). New messages are still accepted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."
        # A gating consumer's UNREAD backlog is over 80% of what its stream can hold. At
        # 90% the stream's writers refuse new events (JetStreamIngestBackpressureEngaged).
        # Exported by every service that WRITES the stream, for the consumers that gate it
        # (device-management's on inbound-events, event-management's on resolved-events).
        # `max by`: every writer pod measures the same consumer.
        - alert: JetStreamUnreadBacklogNearFull
          expr: max by (stream, durable) ({__name__=~"devicechain_[a-z0-9]+_jetstream_backpressure_unread_ratio", namespace="{{ $ns }}"}) > 0.8
          for: 5m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A consumer's unread backlog is near its stream's ceiling"
            description: "Durable {{ "{{ $labels.durable }}" }} has not yet processed {{ "{{ $value | humanizePercentage }}" }} of what stream {{ "{{ $labels.stream }}" }} can hold. At 90% the platform stops accepting new events on that stream, for every tenant, rather than discard events this consumer has not read: HTTP devices are answered 503 with a Retry-After, MQTT devices' events wait in the capture stream, and Sparkplug and LwM2M readings, and events from an external MQTT broker, are dropped and counted. Find out why the consumer is slow: its service's logs, its database, and JetStreamDurableFallingBehind. If the traffic has outgrown the stream, raise the stream's ceiling (and the JetStream volume with it)."
        # The gate is closed: the stream's writers are refusing new events. Evaluated at
        # scrape time, so it also reads 1 while a writer cannot measure the backlog (a gate
        # that cannot measure refuses). `max by`: any writer pod refusing is an outage.
        - alert: JetStreamIngestBackpressureEngaged
          expr: max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_backpressure_engaged", namespace="{{ $ns }}"}) > 0
          for: 1m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "The platform is refusing new events so as not to lose unread ones"
            description: "Stream {{ "{{ $labels.stream }}" }} is refusing new events, for every tenant: a consumer's unread backlog reached 90% of the stream's ceiling, or a service writing to it could not measure that backlog for 30 seconds. HTTP devices are answered 503 with a Retry-After and should retry. Events from MQTT devices were already acknowledged by the broker and wait in the capture stream, which discards its oldest once it is full (JetStreamDurableLostUnread). Sparkplug and LwM2M readings, and events from an external MQTT broker, are dropped and counted. JetStreamUnreadBacklogNearFull names the consumer that is behind; the refusal lifts once its backlog is below 80%."
        # A capacity-bounded reader held a message past its AckWait. Selected by name
        # like the rules above: core builds the counter for every capacity reader, under
        # the adopting service's own subsystem.
        - alert: ReaderHeldMessagePastAckWait
          # `sum`, not `max`: each pod counts only the messages IT held, so the pods' counts
          # add up rather than repeat one another. The series are initialised at 0 when the
          # reader is created, so increase() sees a pod's first occurrence rather than
          # missing it.
          expr: sum by (durable, stage) (increase({__name__=~"devicechain_[a-z0-9]+_reader_held_past_ack_wait_total", namespace="{{ $ns }}"}[15m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A service held a message past its acknowledgement window, so it was redelivered"
            description: "The reader for durable {{`{{ $labels.durable }}`}} held a message longer than the broker waits for an acknowledgement, so the broker handed it out again. stage=worker: a send was still running when that happened, so the message may have been sent twice -- look for a slow or unresponsive destination behind this service. stage=buffer: the reader dropped a message it had fetched but not yet handed to a worker, and the broker's redelivery is handled instead; nothing was sent twice, but the service is not keeping up."
        - alert: MaxDeliveryRecordsWaiting
          # The max-delivery capture is a WORK QUEUE: a recorder acks each advisory once it
          # has dead-lettered (or deliberately skipped) the message it names, and the ack
          # deletes it. So the stream's message count is exactly the abandoned deliveries no
          # recorder has written down yet, and on a healthy instance it drains to zero within
          # seconds. `max`, not `sum`: every pod that ensures the stream samples the same count.
          #
          # 🔴 `[a-z0-9]+`, NOT `.+` -- the reasoning is on DeadLetterWriteLost in
          # prometheusrule-dead-letter.yaml.
          expr: max by (stream) ({__name__=~"devicechain_[a-z0-9]+_jetstream_stream_used_messages", stream=~".+max-deliveries", namespace="{{ $ns }}"}) > 0
          for: 15m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "Messages that ran out of delivery attempts are waiting to be recorded"
            description: "{{`{{ $value }}`}} notice(s) of messages whose every delivery attempt ran out have been waiting on {{`{{ $labels.stream }}`}} for 15 minutes without being turned into dead letters. Each service records its own; one that is down or crash-looping records late, so first check that every service is running and look in its logs for errors from the max-delivery recorder. A notice that stays after every service is healthy names a consumer no running service reads any more (a reader removed by an upgrade); it will not be recorded, and can be deleted from the stream."
        # A consumer declared REPLAY-COVERED ran out of deliveries. Such a consumer acks a
        # message only once its own checkpoint covers it, and after a restart re-reads the
        # stream from that checkpoint, so the broker giving up on a delivery loses nothing and
        # is deliberately not dead-lettered (core/streams: Stream.ReplayCovered). What it DOES
        # mean is that the consumer's checkpoint has not been saved for longer than the
        # broker's whole redelivery budget -- typically its database is unreachable -- and
        # this counter is the only place that shows up per stream.
        #
        # `sum`, not `max`: an area's replicas share one recorder durable, so each exhaustion
        # is counted by exactly one pod. The series exist at 0 from the recorder's start, so
        # increase() sees the first one. Selected by name like the rules above.
        - alert: ReplayCoveredDeliveriesExhausted
          expr: sum by (job, stream) (increase({__name__=~"devicechain_[a-z0-9]+_max_delivery_records_total", outcome="replay-covered", namespace="{{ $ns }}"}[15m])) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "A consumer ran out of delivery attempts because it could not save its checkpoint"
            description: "{{`{{ $value }}`}} message(s) on {{`{{ $labels.stream }}`}} ran out of delivery attempts to {{`{{ $labels.job }}`}} in the last 15 minutes. This consumer re-reads the stream from its own saved checkpoint, so nothing has been lost and no dead letter is written, but its checkpoint has not been saved for longer than the broker keeps redelivering: look for the service's database or broker connection failing. While it is running it keeps what it has read in memory and saves it when the checkpoint succeeds. If it restarts first, it re-reads the stream from the last saved checkpoint, and a message the stream has already discarded cannot be re-read (JetStreamDurableUnreadNearFull warns before that)."
{{- end }}
