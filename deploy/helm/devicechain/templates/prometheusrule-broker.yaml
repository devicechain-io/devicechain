{{/*
Alerting rule for the BROKER'S DEVICE CERTIFICATE REQUEST.

WHY IT EXISTS. The broker is DeviceChain's own nats-server build (backend/broker/dc-nats-server):
upstream's main on the unmodified library, plus a setting the nats-server config file cannot
express, which makes the MQTT listener ASK each device for a client certificate without
requiring one. Devices that authenticate by certificate depend on it; token and password
devices never notice it. Upstream's configuration reload rebuilds the MQTT TLS settings and
drops it while reporting success, so the binary re-applies it on every reload. If anything ever
reaches the listener by another path, the failure is silent: every token device keeps working,
the broker looks healthy, and only certificate devices are refused, by a callout that sees no
certificate.

THE SIGNAL is the broker binary's own, read off the wire: it handshakes with its own MQTT
listener at start, after every reload and every minute, and reports whether a CertificateRequest
came back (dc_broker_mqtt_client_auth_request), next to whether the listener terminates TLS at
all (dc_broker_mqtt_tls). A probe that could not complete reports 0 too, on purpose: the
certificate path then cannot be confirmed. Both series come from the binary's own /metrics
(the dc-metrics port), scraped by podmonitor-nats.yaml.

IT FIRES on either of two states, each held for ten minutes:
  - a broker serving MQTT over TLS whose listener is not requesting certificates: the reload
    trap, or a probe that keeps failing;
  - a broker pod the exporter sidecar reports (nats_varz_connections) that does not export
    dc_broker_info: it is not running the DeviceChain broker build, which is what the documented
    upstream rollback image looks like, or its metrics endpoint is not being scraped.

QUIET when the listener does not terminate TLS (no certificate can be requested; a deployment
choice, not this failure), and when neither series exists. The second arm needs the exporter
sidecar, which the compact preset drops, so on a compact instance only the first arm speaks.

Ten minutes is longer than a broker start (the probe waits for the server to be ready) and than
a lame duck shutdown (the probe stops when it begins), so a rolling restart does not fire it.

No `or vector(0)`, for the reason prometheusrule-dead-letter.yaml gives in its header.

THE CERTIFICATE EXPIRY ALERTS (BrokerCertificateExpiringSoon, BrokerCertificateExpiryCritical)
exist because the broker's TLS certificate is good for a year and is renewed only when dcctl
upgrade runs: an instance nobody upgrades loses TLS on the anniversary of its bootstrap, and
nothing else says so.

THE SIGNAL IS THE BROKER'S OWN, NOT A DATE WRITTEN INTO THE RULE. dc_broker_mqtt_tls_cert_not_after_seconds
is the expiry of the certificate the MQTT listener presents to new connections right now, read
from the live TLS configuration and updated by a hot swap. Alerting on it means:
  - a renewal cannot leave a stale threshold. Nothing about the certificate is rendered into
    this rule, so there is no value to go out of date; the series moves when the broker starts
    presenting the new certificate, and the alert clears then and not before;
  - a renewal that was written but never picked up (a broker that did not reload) keeps
    alerting, which is correct: the old certificate is still what devices see;
  - it needs no operator metrics and no chart input, only the scrape podmonitor-nats.yaml
    already does.
(The alternatives considered were rendering the date as a constant into the rule, which is
correct only until the first path that renews without re-rendering the chart, and exporting a
gauge from the operator, which is disabled today and would read an annotation dcctl asserted
rather than the certificate the broker serves.)

THE TWO ALERTS ARE DISJOINT BY DESIGN: warning from 30 days out down to 7 days, critical below 7
days and after expiry (a negative remaining time still matches). One page at a time, escalating,
with no reliance on the alert manager inhibiting the weaker one. 30 days is where dcctl upgrade
starts renewing, so a warning means "the next upgrade will renew it".

QUIET when the listener does not terminate TLS (the series is 0, filtered out), and when the
series does not exist; a broker that is not exporting it is BrokerMqttClientAuthLost's
business. A compact instance whose dc-metrics port is broken alerts on nothing here (condition
only: the BrokerCertificateValid condition below is its sole signal). An instance with monitoring off is not covered here; the operator reports the same
expiry as the BrokerCertificateValid condition on the Instance. That condition also covers the
certificate authority, which this series does not.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts .Values.metrics.natsPodMonitor }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{- $id := .Values.instance.id }}
{{/* The broker's namespace, derived exactly as podmonitor-nats.yaml derives the one it scrapes. */}}
{{- $host := .Values.metrics.natsBrokerHost | default .Values.instance.config.infrastructure.nats.hostname | required "instance.config.infrastructure.nats.hostname is required to render the broker alerts; set metrics.natsPodMonitor=false if this instance uses a broker it does not name" }}
{{- $parts := splitList "." $host }}
{{- $natsNamespace := $ns }}
{{- if gt (len $parts) 1 }}
{{- $natsNamespace = index $parts 1 }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: broker
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.broker
      rules:
        - alert: BrokerMqttClientAuthLost
          expr: |
            (
              max by (namespace, pod) (dc_broker_mqtt_tls{namespace="{{ $natsNamespace }}"}) == 1
              and on (namespace, pod)
              max by (namespace, pod) (dc_broker_mqtt_client_auth_request{namespace="{{ $natsNamespace }}"}) == 0
            )
            or
            (
              max by (namespace, pod) (nats_varz_connections{namespace="{{ $natsNamespace }}"})
              unless on (namespace, pod)
              max by (namespace, pod) (dc_broker_info{namespace="{{ $natsNamespace }}"})
            )
          for: 10m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "the broker is not requesting device client certificates"
            description: "The broker server named by the pod label is not asking MQTT devices for a client certificate, so devices that authenticate by certificate cannot connect. Devices that use a token or a password are not affected. Either the server is running but its MQTT listener stopped requesting certificates (a configuration reload that did not keep the setting, or the broker's own check of its listener keeps failing; its log says which), or the server is not running the DeviceChain broker image, for example after a rollback to the upstream nats image. Check the server's image with kubectl get pod -o jsonpath='{.spec.containers[0].image}'. On the DeviceChain image, restart the server pod, and report the log lines around the last configuration reload. On the upstream image, certificate devices stay refused until the DeviceChain image is restored."
        - alert: BrokerLeadershipImbalanced
          # The streams counted are the ones the rebalancer may move: see RebalanceableStreams in
          # core/messaging/replication.go, which a test holds this list to. The ingest streams are left
          # out on purpose, so a clean rebalance clears this.
          expr: |
            min(
              (
                count by (pod) (
                  max by (pod, stream_name) (nats_stream_total_messages{namespace="{{ $natsNamespace }}", is_stream_leader="true", stream_name=~"{{ $id }}_(alarm-events|connector-dispatch|connector-dispatch_dead|dead-letters|derived-events|detection-rules-published|device-attribute|device-commands|device-desired|device-ownership|device-roster|entity-deleted|failed-events|geofence-set-manifest|max-deliveries|raise-alarm|resolved-events)"})
                  and on (stream_name)
                  label_replace(max by (stream) ({__name__=~"devicechain_.+_jetstream_replicas_actual", namespace="{{ $ns }}"}) > 1, "stream_name", "$1", "stream", "(.+)")
                )
                or
                (max by (pod) (nats_varz_connections{namespace="{{ $natsNamespace }}"}) * 0)
              )
            )
            <
            0.5 * avg(
              (
                count by (pod) (
                  max by (pod, stream_name) (nats_stream_total_messages{namespace="{{ $natsNamespace }}", is_stream_leader="true", stream_name=~"{{ $id }}_(alarm-events|connector-dispatch|connector-dispatch_dead|dead-letters|derived-events|detection-rules-published|device-attribute|device-commands|device-desired|device-ownership|device-roster|entity-deleted|failed-events|geofence-set-manifest|max-deliveries|raise-alarm|resolved-events)"})
                  and on (stream_name)
                  label_replace(max by (stream) ({__name__=~"devicechain_.+_jetstream_replicas_actual", namespace="{{ $ns }}"}) > 1, "stream_name", "$1", "stream", "(.+)")
                )
                or
                (max by (pod) (nats_varz_connections{namespace="{{ $natsNamespace }}"}) * 0)
              )
            )
            and on ()
            avg(
              (
                count by (pod) (
                  max by (pod, stream_name) (nats_stream_total_messages{namespace="{{ $natsNamespace }}", is_stream_leader="true", stream_name=~"{{ $id }}_(alarm-events|connector-dispatch|connector-dispatch_dead|dead-letters|derived-events|detection-rules-published|device-attribute|device-commands|device-desired|device-ownership|device-roster|entity-deleted|failed-events|geofence-set-manifest|max-deliveries|raise-alarm|resolved-events)"})
                  and on (stream_name)
                  label_replace(max by (stream) ({__name__=~"devicechain_.+_jetstream_replicas_actual", namespace="{{ $ns }}"}) > 1, "stream_name", "$1", "stream", "(.+)")
                )
                or
                (max by (pod) (nats_varz_connections{namespace="{{ $natsNamespace }}"}) * 0)
              )
            ) >= 3
          for: 30m
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "one broker server leads far fewer streams than the others"
            description: "At least one broker server leads fewer than half the streams an even share would give it, so the others carry the replication and acknowledgement work for it. Only the streams that dcctl is allowed to move are counted: this instance's replicated streams other than the device-ingest ones (the broker's MQTT streams, the device capture stream and every stream an ingest area writes), which are never rebalanced because a leader change on them can lose messages already acknowledged to a device. After a rolling restart of the broker the server restarted last leads nothing, and at the load this was measured under that doubled publish acknowledgement latency and cost a few percent of HTTP ingest. dcctl upgrade evens leadership out after it rolls the broker, so this fires after a restart done any other way (a node drain, a pod loss, a manual rollout), or when that step was skipped or warned. Run dcctl broker rebalance <instance> to even it out; each move is a brief election for one stream. If it keeps returning, check the broker pods for repeated restarts."
        - alert: BrokerCertificateExpiringSoon
          expr: |
            (
              max by (namespace, pod) (dc_broker_mqtt_tls_cert_not_after_seconds{namespace="{{ $natsNamespace }}"} > 0) - time()
            ) < 30 * 86400
            and
            (
              max by (namespace, pod) (dc_broker_mqtt_tls_cert_not_after_seconds{namespace="{{ $natsNamespace }}"} > 0) - time()
            ) >= 7 * 86400
          for: 1h
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "the broker's TLS certificate expires within 30 days"
            description: "The broker server named by the pod label presents a TLS certificate that expires in less than 30 days. When it expires the broker refuses TLS connections from devices and from this instance's own services. The certificate is renewed by dcctl upgrade, which re-issues it inside its last 30 days and swaps it in without restarting the broker when only the certificate changed, so running dcctl upgrade for this instance now clears this alert. If this keeps firing after an upgrade, the broker has not picked the new certificate up; check the server's log, and restart the server pod if it did not switch."
        - alert: BrokerCertificateExpiryCritical
          expr: |
            (
              max by (namespace, pod) (dc_broker_mqtt_tls_cert_not_after_seconds{namespace="{{ $natsNamespace }}"} > 0) - time()
            ) < 7 * 86400
          for: 10m
          labels:
            severity: critical
            devicechain_instance: {{ $id }}
          annotations:
            summary: "the broker's TLS certificate expires within 7 days, or already has"
            description: "The broker server named by the pod label presents a TLS certificate that expires in less than 7 days, or that has already expired. Once it has expired the broker's TLS connections fail for devices and for this instance's own services. Run dcctl upgrade for this instance now: it re-issues the certificate under the authority the instance keeps. An instance that does not keep its authority (one bootstrapped by an early release) cannot re-issue it in place and has to be rebuilt; dcctl upgrade says so when that is the case. If an upgrade has run and this still fires, the broker has not picked the new certificate up; restart the server pod."
{{- end }}
