{{/*
Alerting rule for CONTAINER RESTARTS in this instance's namespace.

WHY IT EXISTS. A DeviceChain service ends itself on purpose when it cannot do its job: a
message-read loop whose reads keep failing for two minutes with no answer from the broker
(core.ReadPacer), a component that declares the process unfit (Microservice.FailNow).
Kubernetes restarts the container, and the pod is Ready again within seconds. Without this
rule nothing reported that it happened: kube-prometheus-stack's KubePodCrashLooping fires
only for a pod still in a crash loop after 15 minutes, and a single restart, or several
services restarting together after a broker disturbance, never reaches it. The same goes
for the broker's own servers, which run in this namespace too.

`kube_pod_container_status_restarts_total` comes from kube-state-metrics, which the
monitoring stack installs. Without kube-state-metrics the series does not exist and the
rule never fires.

The counter is first collapsed to ONE logical series per container incarnation (namespace,
pod, uid, container) with max, and only then is increase() taken over it. The scrape identity
(instance, endpoint, service, and the kube-state-metrics replica) is not part of that
identity: when kube-state-metrics itself moves, for instance because its node was lost, it
comes back under a new `instance` label, and a pod that restarted meanwhile appears as a NEW
series whose first sample is already 1. increase() per raw series would read 0 for both the
old series and the new one and miss the restart; over the collapsed series it reads 0, gap, 1.
Two kube-state-metrics replicas reporting the same pod collapse to the same one series, so a
restart is one alert, not two.

The uid stays in the grouping. A pod REPLACED under the same name (a StatefulSet pod that was
deleted) is not a restart: its series is new, with a new uid, starting at 0. Without the uid
a replacement that overlaps its predecessor in kube-state-metrics would hide behind the
predecessor's higher count. Only a container Kubernetes restarted in place counts.

LIMITS. A restart that happens while kube-state-metrics is away for MORE than 15 minutes is
not reported: no sample from before the restart is left in the window. After an outage the
alert clears 15 minutes after kube-state-metrics last reported before the outage, which is
sooner than 15 minutes after the restart. A pod restarted before kube-state-metrics first saw
it is not reported, and neither is one restarted across a kube-state-metrics upgrade that
adds or removes the uid label.

No `for:`. A restart is an event, and the 15-minute window is what keeps the alert visible
long enough to be seen. No `or vector(0)`, for the reason prometheusrule-dead-letter.yaml
gives in its header.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.alerts }}
{{- $ns := include "devicechain.instanceNamespace" . }}
{{/* The alert label below names the INSTANCE, not its namespace: those are the
     same string today and are about to stop being, so they are spelled apart. */}}
{{- $id := .Values.instance.id }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: container-restarts
  namespace: {{ $ns }}
  labels:
    {{- include "devicechain.instanceLabels" . | nindent 4 }}
spec:
  groups:
    - name: devicechain.container-restarts
      rules:
        - alert: InstanceContainerRestarted
          expr: |
            sum by (pod, container) (
              increase(
                (max by (namespace, pod, uid, container) (
                  kube_pod_container_status_restarts_total{namespace="{{ $ns }}"}
                ))[15m:1m]
              )
            ) > 0
          labels:
            severity: warning
            devicechain_instance: {{ $id }}
          annotations:
            summary: "a container in this instance was restarted"
            description: "Kubernetes restarted the container named by the pod and container labels in the last 15 minutes. A DeviceChain service exits on purpose when it cannot do its job, and the reason is in the log of the container that exited: run kubectl logs --previous on the pod and read the last error line, usually after 'A component has declared this process unfit to continue'. A read loop that failed for two minutes with no answer from the message broker names its stream and its last error there. Several services restarting together point at the broker: check that its servers are running and run dcctl ha verify. If the restarted container is a broker server (dc-nats-*), read its previous log too; its streams take a few minutes to be current again. A container whose last state is OOMKilled needs a higher memory limit. Restarts in the first minutes of an install or upgrade are expected. Messages the container had read from the broker but not acknowledged are delivered again, but requests a device or client had in flight to it fail and must be retried, and every restart lengthens the outage it happened in."
{{- end }}
