# Unit tests for deploy/helm/devicechain/templates/prometheusrule-broker.yaml, run by
# hack/check-prometheus-rules.sh against the rendered rule (rendered-rules.yaml).

rule_files:
  - rendered-rules.yaml

evaluation_interval: 1m

tests:
  - name: a healthy broker requesting certificates stays quiet
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_info{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics", library_version="2.15.1", build="go1.27.3-abc"}'
        values: '1x40'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-0"}'
        values: '12x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a listener that stops requesting certificates fires after ten minutes, and clears
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-1", container="nats", endpoint="dc-metrics"}'
        values: '1x60'
      # Requesting for 5 minutes, then the reload trap for 30, then requesting again.
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-1", container="nats", endpoint="dc-metrics"}'
        values: '1x5 0x30 1x25'
      - series: 'dc_broker_info{namespace="dci-devicechain", pod="dc-nats-1", container="nats", endpoint="dc-metrics", library_version="2.15.1", build="go1.27.3-abc"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 14m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []
      - eval_time: 17m
        alertname: BrokerMqttClientAuthLost
        exp_alerts:
          - exp_labels: &trap_labels
              severity: warning
              devicechain_instance: devicechain
              namespace: dci-devicechain
              pod: dc-nats-1
            exp_annotations: &annotations
              summary: "the broker is not requesting device client certificates"
              description: "The broker server named by the pod label is not asking MQTT devices for a client certificate, so devices that authenticate by certificate cannot connect. Devices that use a token or a password are not affected. Either the server is running but its MQTT listener stopped requesting certificates (a configuration reload that did not keep the setting, or the broker's own check of its listener keeps failing; its log says which), or the server is not running the DeviceChain broker image, for example after a rollback to the upstream nats image. Check the server's image with kubectl get pod -o jsonpath='{.spec.containers[0].image}'. On the DeviceChain image, restart the server pod, and report the log lines around the last configuration reload. On the upstream image, certificate devices stay refused until the DeviceChain image is restored."
      - eval_time: 38m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a short dip, such as a broker restart, does not fire
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-2", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-2", container="nats", endpoint="dc-metrics"}'
        values: '1x10 0x8 1x22'
    alert_rule_test:
      - eval_time: 20m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a listener without TLS cannot request a certificate, and is not this failure
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '0x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '0x40'
      - series: 'dc_broker_info{namespace="dci-devicechain", pod="dc-nats-0", container="nats", endpoint="dc-metrics", library_version="2.15.1", build="go1.27.3-abc"}'
        values: '1x40'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-0"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: a broker pod running the upstream image fires
    interval: 1m
    input_series:
      # The exporter reports the server; the DeviceChain broker's own series are absent.
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-0"}'
        values: '7x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []
      - eval_time: 15m
        alertname: BrokerMqttClientAuthLost
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
              namespace: dci-devicechain
              pod: dc-nats-0
            exp_annotations: *annotations

  - name: another namespace's broker is not this instance's
    interval: 1m
    input_series:
      - series: 'dc_broker_mqtt_tls{namespace="dci-other", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '1x40'
      - series: 'dc_broker_mqtt_client_auth_request{namespace="dci-other", pod="dc-nats-0", container="nats", endpoint="dc-metrics"}'
        values: '0x40'
      - series: 'nats_varz_connections{namespace="dci-other", pod="dc-nats-1", container="prom-exporter", endpoint="prom-metrics", server_id="dc-nats-1"}'
        values: '7x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  - name: no broker series at all (monitoring of the broker off) stays quiet
    interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BrokerMqttClientAuthLost
        exp_alerts: []

  # Leadership after a rolling restart: dc-nats-0 (restarted last) leads nothing, dc-nats-1 and
  # dc-nats-2 lead six streams each. dc-nats-0 has no is_stream_leader="true" series at all, so
  # only the connection series reveals that it exists; the rule has to count it as zero.
  - name: a server that leads nothing fires after thirty minutes, and clears once leadership is even
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x120'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x120'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-2"}'
        values: '10x120'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s1", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s2", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s3", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s4", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s5", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s6", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s7", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s8", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s9", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s10", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s11", is_stream_leader="true"}'
        values: '1x60 stale'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s12", is_stream_leader="true"}'
        values: '1x60 stale'
      # Minute 60: the rebalance ran; every server leads four of the twelve.
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="s1", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="s2", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="s7", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="s8", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s9", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s10", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s11", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="s12", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s3", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s4", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s5", is_stream_leader="true"}'
        values: '_x60 1x59'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-2", stream_name="s6", is_stream_leader="true"}'
        values: '_x60 1x59'
    alert_rule_test:
      - eval_time: 25m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []
      - eval_time: 40m
        alertname: BrokerLeadershipImbalanced
        exp_alerts:
          - exp_labels:
              severity: warning
              devicechain_instance: devicechain
            exp_annotations:
              summary: "one broker server leads far fewer streams than the others"
              description: "At least one broker server leads fewer than half the streams an even share would give it, so the others carry the replication and acknowledgement work for it. After a rolling restart of the broker the server restarted last leads nothing, and at the load this was measured under that doubled publish acknowledgement latency and cost a few percent of HTTP ingest. dcctl upgrade evens leadership out after it rolls the broker, so this fires after a restart done any other way (a node drain, a pod loss, a manual rollout), or when that step was skipped or warned. Run dcctl broker rebalance <instance> to even it out; each move is a brief election for one stream. If it keeps returning, check the broker pods for repeated restarts."
      - eval_time: 100m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []

  - name: an evenly led broker, and a broker too small to judge, stay quiet
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="a", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-0", stream_name="b", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="c", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="d", is_stream_leader="true"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []

  # Two streams on one server of three is a small broker, not an imbalance worth a page.
  - name: fewer than three streams per server on average is not judged
    interval: 1m
    input_series:
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-0"}'
        values: '10x60'
      - series: 'nats_varz_connections{namespace="dci-devicechain", pod="dc-nats-1"}'
        values: '10x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="a", is_stream_leader="true"}'
        values: '1x60'
      - series: 'nats_stream_total_messages{namespace="dci-devicechain", pod="dc-nats-1", stream_name="b", is_stream_leader="true"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: BrokerLeadershipImbalanced
        exp_alerts: []
