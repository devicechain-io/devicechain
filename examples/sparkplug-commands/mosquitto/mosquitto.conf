# A plain, authenticated Mosquitto for the example. No TLS: it listens only on the local Docker
# network and a loopback port. For a real plant, terminate TLS here and use ssl:// in the source.

listener 1883
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
