#
# Tests for the Sitepulse board-replay converter (demos/sitepulse-unity/tools/
# recording_to_board.py): its refusals (fabricated row, credential in an allowed
# field, a file outside the input allowlist) and the committed excerpt's golden
# values and credential scan. The full recording is not in the repository, so the
# tests that need it skip here and run on the maintainer's machine.
#
# WHY A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml. ci.yml's `ci-complete` gate counts
# a SKIPPED job as a failure, and this job is path-filtered, so as a ci.yml job it
# would block every pull request that does not touch these paths. A workflow-level
# `paths:` filter in its own file has neither problem (frontend-windows.yml is the
# same arrangement). Not in the required-checks set.
name: sitepulse-board-replay

on:
  pull_request:
    paths:
      - "demos/sitepulse-unity/tools/recording_to_board.py"
      - "demos/sitepulse-unity/tools/test_recording_to_board.py"
      - "demos/towerpulse-unity/tools/**"
      - "frontend/testdata/board-replay/**"
      - "frontend/testdata/sim-dashboards/sp-dashboard.json"
      - ".github/workflows/sitepulse-board-replay.yml"
  push:
    branches: [main]
    paths:
      - "demos/sitepulse-unity/tools/recording_to_board.py"
      - "demos/sitepulse-unity/tools/test_recording_to_board.py"
      - "demos/towerpulse-unity/tools/**"
      - "frontend/testdata/board-replay/**"
      - "frontend/testdata/sim-dashboards/sp-dashboard.json"
      - ".github/workflows/sitepulse-board-replay.yml"

permissions:
  contents: read

concurrency:
  group: sitepulse-board-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: board-replay converter tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # the excerpt test hashes the board as it was at the commit the fixture pins
          fetch-depth: 0

      # Standard library only; the runner's python3 is enough.
      - name: Unit tests
        working-directory: demos/sitepulse-unity/tools
        run: python3 -m unittest -v test_recording_to_board

      # The Towerpulse profile of the same converter (demos/towerpulse-unity/tools/board-replay.profile.json), the committed Towerpulse fixture it must
      # reproduce byte for byte, and the acceptance checker's judgements.
      - name: Towerpulse profile and acceptance checker tests
        working-directory: demos/towerpulse-unity/tools
        run: |
          python3 -m unittest -v test_board_replay_profile
          python3 -m unittest -v test_acceptance_check
          python3 -m unittest -v test_binary_fresh

      # The take's shot plan is cut from what a recording says happened (the alarm, the command sent, the command done), and the frame check's pixel test.
      - name: Towerpulse take plan tests
        working-directory: demos/towerpulse-unity/tools/take
        run: python3 -m unittest -v test_take_plan
