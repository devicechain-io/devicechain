}

"""
A raised alarm, the operational alarm object. A DETECT rule whose condition holds raises it; there
is at most one live alarm per originator and alarm key, so a repeated crossing is folded into the
same row and its severity escalates in place. Its lifecycle is state (ACTIVE or CLEARED) crossed
with acknowledged. The originator is addressed by originatorType and originatorId, and is always a
device today. Requires alarm:read; a member whose access is limited to some customers sees only the
alarms of its own devices.
"""
type Alarm implements Model & TokenReference & MetadataEntity {
    """
    Server-assigned numeric identifier, as a string. Address an alarm by its token instead where you
    can.
    """
    id: ID!
    """
    When the alarm row was first created, as an RFC 3339 timestamp. A re-raise reuses the row, so
    this does not move; see raisedTime for the current cycle.
    """
    createdAt: String
    """When the alarm row was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """When the alarm was deleted, as an RFC 3339 timestamp; null for a live alarm."""
    deletedAt: String
    """
    Identifier of the alarm, unique within the tenant. It is stable for the alarm's whole life,
    across clears and re-raises.
    """
    token: String!
    """Entity type of the originator, the thing the alarm is about. Always device today."""
    originatorType: String!
    """
    Numeric id of the originator within the tenant, as a string. Use originatorToken to address it
    by token.
    """
    originatorId: ID!
    """
    The originator's token, resolved on demand. Null when the originator is not a device or no
    longer exists. Matches AlarmEvent.originatorToken, so a live list and a reconciling query
    address the originator the same way.
    """
    originatorToken: String
    """
    The alarm key the raising rule targets. It names which alarm on the originator this is; together
    with the originator it is unique among live alarms.
    """
    alarmKey: String!
    """Key of the measurement the raising rule watches, kept for display."""
    metricKey: String!
    """
    Lifecycle state: ACTIVE while a condition holds, CLEARED once every contributing condition has
    resolved or an operator cleared it. A cleared alarm that is raised again returns to ACTIVE on
    the same row.
    """
    state: String!
    """
    Whether an operator has acknowledged the alarm. Independent of state: either an ACTIVE or a
    CLEARED alarm may be acknowledged. Raising the alarm again starts a new cycle and resets this to
    false.
    """
    acknowledged: Boolean!
    """
    Current severity tier: CRITICAL, MAJOR, MINOR, WARNING or INDETERMINATE. It escalates in place
    to the highest tier among the conditions currently holding. Treat unknown values as a tier you
    do not recognise.
    """
    severity: String!
    """
    When the current cycle began, as an RFC 3339 timestamp: the first raise, or the most recent
    return to ACTIVE after a clear. Earlier cycles are not kept on the row.
    """
    raisedTime: String
    """When the alarm was last cleared, as an RFC 3339 timestamp. Null while the alarm is ACTIVE."""
    clearedTime: String
    """
    When an operator acknowledged the alarm, as an RFC 3339 timestamp. Null until acknowledged, and
    reset when the alarm is raised again.
    """
    acknowledgedTime: String
    """
    Subject that acknowledged the alarm, taken from the authenticated caller and never from client
    input. Null until acknowledged.
    """
    acknowledgedBy: String
    """
    The reading that most recently raised a contribution to this alarm. Only a value-bearing raise
    moves it; a resolve, or a raise from silence with no value, leaves it unchanged. Null when no
    reading has been recorded.
    """
    lastValue: Float
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    """
    The disposition of this alarm's current cycle (see setAlarmDisposition), or null when
    nobody has labelled it. A disposition belongs to the cycle it was written on: when the
    alarm is raised again, the new cycle starts unlabelled and the earlier disposition stays
    with the earlier cycle, where alarmDispositions still finds it. A cycle is named by its
    raisedTime, so two cycles of one alarm raised at the same instant share one disposition.
    """
    disposition: AlarmDisposition
    """Live suppression now; null for cleared alarms, non-device originators or alarms with no matching window."""
    suppression: AlarmSuppression
    """Window token stamped when the current cycle began, or null. "restricted" for scoped humans when the window is hidden or deleted."""
    raisedDuringSuppression: String
}

