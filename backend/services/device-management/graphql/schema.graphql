    ALLOW_NEW registers a device that does not exist yet and adopts an earmarked one;
    CHECK_PRE_PROVISIONED registers only earmarked devices that already exist. Neither adopts a
    device that was not earmarked for the profile.
    """
    strategy: String!
    """
    Token of the device type of every device the profile registers, and the only type it will adopt.
    An unknown token is refused.
    """
    deviceTypeToken: String!
    """
    Type of credential to issue. When sent it must be a type provisioning can mint; for a
    certificate profile it must be X509_CERTIFICATE.
    """
    credentialType: String
    """Whether the profile accepts registrations."""
    enabled: Boolean!
    """When the profile stops accepting registrations, as an RFC 3339 timestamp. Omit for never."""
    expiresAt: String
    """Caller-defined metadata. Must be valid JSON; an empty string means none."""
    metadata: String
    """The most devices the profile may register; at least 1. Omit or send null for no cap."""
    maxDevices: Int
    """
    Makes this a certificate profile: its devices authenticate by a client certificate whose
    chain reaches this trust anchor, and it has no provision secret. credentialType, when
    sent, must be X509_CERTIFICATE. A tenant may hold eight certificate profiles. A device
    earmarked for one must have the token derived from its externalId, and takes it when the
    token is left empty.
    """
    trustAnchorToken: String
}

"""
A partial update of a provisioning profile. Each field has three states: omit it to keep the stored
value, send null to clear it, or send a value to set it. The token is not here because the
mutation's token argument names the profile. The credential type cannot be edited and the secret is
replaced only by rotateProvisioningProfileSecret.
"""
input ProvisioningProfileUpdateRequest {
    """Human-readable name; null clears it."""
    name: String
    """Free-text description; null clears it."""
    description: String
    """
    The key a fleet presents to register itself. Required: null is refused, because a blank key
    authenticates nothing. The secret is not editable here; rotateProvisioningProfileSecret replaces
    it.
    """
    provisionKey: String
    """
    ALLOW_NEW or CHECK_PRE_PROVISIONED. Required: null is refused. Validated against the known
    strategies when sent.
    """
    strategy: String
    """
    Device type stamped onto auto-created devices. Null is refused, and an unknown token refuses the
    whole update.
    """
    deviceTypeToken: String
    # credentialType is deliberately absent. Provisioning can mint exactly one credential
    # type today (ACCESS_TOKEN), so every stored value is that one and an update naming
    # the field could only restate it or be refused — a field with no useful request does
    # not belong in an update input. It returns additively when a second type is mintable.
    """Whether the profile accepts registrations. Null is refused rather than read as false."""
    enabled: Boolean
    """
    When the profile stops accepting registrations, as an RFC 3339 timestamp. Null, or an empty
    string, means never expires.
    """
    expiresAt: String
    """
    The most devices the profile may register; at least 1. Null removes the cap. Lowering it
    below the number already registered only refuses further registrations.
    """
    maxDevices: Int
    """New metadata (valid JSON, replacing the stored document), or null to clear it."""
    metadata: String
    """
    Re-points a certificate profile at another trust anchor. Null is refused, and so is naming
    an anchor on a profile that authenticates by secret.
    """
    trustAnchorToken: String
}

"""Criteria for listing provisioning profiles. Every facet is optional and they AND together."""
input ProvisioningProfileSearchCriteria {
    """Page to return, starting at 1. Values below 1 are read as 1."""
    pageNumber: Int!
    """Results per page. Below 1 means the default of 100; above 1000 is capped at 1000."""
    pageSize: Int!
    """Only profiles that register devices of the device type with this token."""
    deviceType: String
    """Only profiles with this strategy: ALLOW_NEW or CHECK_PRE_PROVISIONED."""
    strategy: String
    """True selects enabled profiles and false disabled ones. Omit for either."""
    enabled: Boolean
}

"""One page of provisioning profiles."""
type ProvisioningProfileSearchResults {
    """The profiles on this page."""
    results: [ProvisioningProfile!]!
    """Where this page sits in the full result set."""
    pagination: SearchResultsPagination!
}

"""
A CA certificate a tenant trusts to vouch for its devices' client certificates. It is public
material. An X509_CERTIFICATE credential, and a certificate provisioning profile, name the
anchor their chain must reach, and it is checked at EVERY connect: disabling the anchor
withdraws the CA at once and ends the live sessions of the devices that rely on it. A root or
an intermediate may be an anchor; anchor at the narrowest intermediate to trust one sub-CA of a
manufacturer's PKI. Name constraints on an anchor or on any CA below it are not supported and
are refused: identity is the certificate's subject common name, which name constraints do not
cover.
"""
type DeviceTrustAnchor implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string."""
    id: ID!
    """When the anchor was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the anchor was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted anchors are not returned by this API."""
    deletedAt: String
    """Identifier of the anchor, unique within the tenant."""
    token: String!
    """Human-readable name. Null when none is set."""
    name: String
    """Free-text description. Null when none is set."""
    description: String
    """Free-form JSON the platform stores and does not interpret. Null when none is set."""
    metadata: String
    """The CA certificate, PEM."""
    certificatePem: String!
    """SHA-256 of the certificate, hex. Unique within the tenant."""
    fingerprintSha256: String!
    """The certificate's subject distinguished name."""
    subject: String!
    """The certificate's issuer distinguished name; equal to the subject for a root."""
    issuer: String!
    """When the certificate becomes valid, as an RFC 3339 timestamp."""
    notBefore: String!
    """When the certificate expires, as an RFC 3339 timestamp. Chains to it stop authenticating then."""
    notAfter: String!
    """False withdraws the CA: no chain to it authenticates, and the devices relying on it are disconnected."""
    enabled: Boolean!
    """How many credentials rely on the anchor, soft-deleted ones included (they hold the delete refusal too)."""
    credentialCount: Int!
    """How many provisioning profiles authenticate against the anchor."""
    profileCount: Int!
    """
    How the anchor treats the completeness of its revocation lists. ENTRIES (the default) refuses
    every certificate a stored list or manual entry names and admits the rest, however old the lists
    are; REQUIRE_CURRENT also refuses a certificate whose issuer has no current list.
    """
    revocationMode: CertificateRevocationMode!
    """
    How long past a list's nextUpdate it still counts as current under REQUIRE_CURRENT, as a Go
    duration (for example "24h0m0s"). The instance default when the anchor sets none.
    """
    revocationStaleGrace: String!
    """The current CRL of each issuer the anchor holds one for."""
    revocationLists: [DeviceRevocationList!]!
    """
    The worst freshness over the anchor's lists: NONE when it holds no list, otherwise the most
    stale of them.
    """
    revocationStatus: RevocationStatus!
    """
    Whether, and how strictly, a certificate's status is also asked of its issuer's online OCSP
    responder when a device connects. OFF (the default) asks nothing and sends no request.
    """
    ocspMode: CertificateOcspMode!
    """
    The responder every OCSP request for this anchor goes to, in place of each certificate's own
    Authority Information Access entry. Null when the certificates' own entries are used.
    """
    ocspResponderUrl: String
}

"""Data required to create a trust anchor."""
input DeviceTrustAnchorCreateRequest {
    """Identifier of the anchor, unique within the tenant."""
    token: String!
    """Human-readable name."""
    name: String
    """Free-text description."""
    description: String
    """
    Exactly one CA certificate in PEM: it must be a CA that may sign certificates, unexpired,
    use an RSA (2048 to 8192 bits), P-256, P-384 or Ed25519 key, be signed with a modern hash,
    and carry no name constraints. A private key anywhere in the text is refused. A tenant may
    hold 32 anchors.
    """
    certificatePem: String!
    """Defaults to true."""
    enabled: Boolean
    """Free-form JSON the platform stores and does not interpret."""
    metadata: String
}

"""
A PARTIAL update: omit a field to leave it, send null to clear a nullable one. The
certificate cannot be changed (another CA is another anchor).
"""
input DeviceTrustAnchorUpdateRequest {
    """Human-readable name. Null clears it."""
    name: String
    """Free-text description. Null clears it."""
    description: String
    """
    Required and unclearable. Setting it false ends the live sessions of the devices that rely
    on the anchor; if that cannot be confirmed the change is saved and the call answers that the
    sessions were not confirmed ended, and repeating it asks again.
    """
    enabled: Boolean
    """Free-form JSON the platform stores and does not interpret. Null clears it."""
    metadata: String
    """
    Required and unclearable. Switching to REQUIRE_CURRENT is refused while the anchor holds no
    current revocation list, or a registered certificate under it was issued by a CA that has none:
    the switch would refuse every such device.
    """
    revocationMode: CertificateRevocationMode
    """
    A Go duration of whole seconds, 0s to 168h. Null restores the instance default. While the
    anchor is in REQUIRE_CURRENT, a change is refused if it would leave an issuer without a current
    list.
    """
    revocationStaleGrace: String
    """
    Required and unclearable. OFF asks no responder. ENFORCE_KNOWN and REQUIRE_CURRENT are refused
    while the instance's OCSP switch is off; REQUIRE_CURRENT is refused unless the instance allows
    it, and needs ocspResponderUrl.
    """
    ocspMode: CertificateOcspMode
    """
    An http or https URL, without credentials, that replaces each certificate's own responder.
    Null clears it. The address it resolves to must be one the instance's egress policy allows.
    """
    ocspResponderUrl: String
}

"""How an anchor treats the completeness of its revocation lists."""
enum CertificateRevocationMode {
    """A listed certificate is refused; an issuer with no list, or a stale one, is allowed."""
    ENTRIES
    """A listed certificate is refused, and so is one whose issuer has no current list."""
    REQUIRE_CURRENT
}

"""
How an anchor uses its issuers' OCSP responders at connect. A certificate a responder says is
revoked is always refused (a verified revoked answer for any certificate on any verified path
wins); the modes differ in what an answer that could not be had means.
"""
enum CertificateOcspMode {
    """No responder is asked. The default for every anchor."""
    OFF
    """
    A revoked answer refuses; a status that could not be learned (a timeout, an unreachable or
    refused responder, an unusable answer) is ADMITTED and counted. Availability over completeness.
    """
    ENFORCE_KNOWN
    """
    A revoked answer refuses, and so does a certificate whose status could not be confirmed
    current. A responder outage refuses new connects once cached answers expire.
    """
    REQUIRE_CURRENT
}

"""How fresh a stored revocation list is."""
enum RevocationStatus {
    """No list is stored."""
    NONE
    """Less than three quarters of the list's validity has passed."""
    FRESH
    """Three quarters of its validity have passed, or nextUpdate has passed within the grace: push the next list."""
    EXPIRING
    """nextUpdate and the grace have both passed: REQUIRE_CURRENT no longer counts the list as current."""
    STALE
}

"""
The current CRL of one issuer under a trust anchor. Its entries are listed through
deviceRevokedCertificates.
"""
type DeviceRevocationList {
    """The CRL signer's subject, for display."""
    issuerSubject: String!
    """SHA-256 of the signer's public key, hex. With issuerName, identifies the issuer."""
    issuerKey: String!
    """SHA-256 of the signer's subject, hex."""
    issuerName: String!
    """The CRL number, as a decimal string (up to 20 octets)."""
    crlNumber: String!
    """The CRL's thisUpdate, as an RFC 3339 timestamp."""
    thisUpdate: String!
    """The CRL's nextUpdate, as an RFC 3339 timestamp."""
    nextUpdate: String!
    """How many certificates the list revokes."""
    entryCount: Int!
    """SHA-256 of the CRL's DER, hex."""
    crlSha256: String!
    """UPLOAD."""
    source: String!
    """The list's freshness now."""
    status: RevocationStatus!
}

"""The outcome of storing a revocation list."""
type DeviceRevocationListResult {
    """The list now in force for the issuer."""
    list: DeviceRevocationList!
    """How many certificates the list revokes that the issuer's previous list did not."""
    newlyRevoked: Int!
    """True when this very CRL was already the current list and nothing was written."""
    unchanged: Boolean!
    """
    True when the live broker sessions of the devices the list newly revokes were confirmed ended.
    False when the list is stored and new connects are refused, but a session already open could not
    be confirmed ended: the retry (automatic, and on repeating the upload, which is idempotent) ends
    it, or its token expires.
    """
    sessionsEnded: Boolean!
}

"""
Why a certificate was revoked (RFC 5280 section 5.3.1). A manual revocation that names none is
UNSPECIFIED.
"""
enum CertificateRevocationReason {
    """No reason given."""
    UNSPECIFIED
    """The certificate's private key is known or suspected to be compromised."""
    KEY_COMPROMISE
    """The key of the CA that issued the certificate is known or suspected to be compromised."""
    CA_COMPROMISE
    """The subject changed affiliation; the certificate no longer applies, and its key is not compromised."""
    AFFILIATION_CHANGED
    """The certificate was replaced by another."""
    SUPERSEDED
    """The certificate is no longer needed because its subject ceased operating."""
    CESSATION_OF_OPERATION
    """The certificate is suspended, not permanently revoked."""
    CERTIFICATE_HOLD
    """A privilege the certificate granted was withdrawn."""
    PRIVILEGE_WITHDRAWN
    """The key of an attribute authority is known or suspected to be compromised."""
    AA_COMPROMISE
}

"""
One revoked certificate in a trust anchor's revocation store. A MANUAL entry names a certificate by
fingerprint and refuses it wherever it appears on a verified path (a leaf or an intermediate),
registered or not, whatever later becomes of its credential or its device.
"""
type DeviceRevokedCertificate {
    """MANUAL (revoked here, by fingerprint) or CRL (from a stored CA revocation list)."""
    kind: String!
    """SHA-256 of the certificate, hex. Set on a MANUAL entry."""
    fingerprintSha256: String
    """SHA-256 of the issuing CA's public key, hex. Set on a CRL entry."""
    issuerKey: String
    """The certificate's serial number, hex. Set on a CRL entry."""
    serial: String
    """Why it was revoked."""
    reason: CertificateRevocationReason!
    """When it was revoked, as an RFC 3339 timestamp."""
    revokedAt: String!
    """
    Set only on the result of revokeDeviceCertificate, null everywhere else. True when the live
    broker sessions of the devices the revocation affects were confirmed ended. False when the
    revocation is saved and new connects are refused, but a session already open could not be
    confirmed ended: it may still be publishing until the retry (automatic, and on repeating the
    mutation, which is idempotent) ends it, or its token expires.
    """
    sessionsEnded: Boolean
}

"""Criteria used when listing the revoked certificates of a trust anchor."""
input DeviceRevokedCertificateSearchCriteria {
    """1-based page number."""
    pageNumber: Int!
    """Entries per page."""
    pageSize: Int!
    """Only MANUAL or only CRL entries."""
    kind: String
}

"""A page of revoked certificates."""
type DeviceRevokedCertificateSearchResults {
    """The entries on this page."""
    results: [DeviceRevokedCertificate!]!
    """Where this page sits in the whole result."""
    pagination: SearchResultsPagination!
}

"""Criteria used when searching for trust anchors."""
input DeviceTrustAnchorSearchCriteria {
    """1-based page number."""
    pageNumber: Int!
    """Anchors per page."""
    pageSize: Int!
    """Only anchors that are (or are not) enabled."""
    enabled: Boolean
}

"""A page of trust anchors."""
type DeviceTrustAnchorSearchResults {
    """The anchors on this page."""
    results: [DeviceTrustAnchor!]!
    """Where this page sits in the whole result."""
    pagination: SearchResultsPagination!
}

"""
An inbound integration: a tenant's authenticated sender of device data over HTTP, such as a
LoRaWAN network server or a webhook. It holds the bearer token the sender presents, the kind
of body it sends, and the device types it may resolve devices of. The token is generated by
the server, returned once by createIntegration and rotateIntegrationToken, and never exposed
on this type: only a keyed digest of it is stored.
"""
type Integration implements Model & TokenReference & NamedEntity & MetadataEntity {
    """Server-assigned numeric identifier, as a string."""
    id: ID!
    """When the integration was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the integration was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: deleted integrations are not returned by this API."""
    deletedAt: String
    """
    Identifier of the integration, unique within the tenant. It is part of the URL the
    sender posts to.
    """
    token: String!
    """Human-readable name. Null when none is set."""
    name: String
    """Free-text description. Null when none is set."""
    description: String
    """Free-form JSON the platform stores and does not interpret. Null when none is set."""
    metadata: String
    """
    The kind of sender, which fixes the body format its route parses: CHIRPSTACK_V4,
    TTS_V3, GENERIC_JSON or GENERIC_BINARY. It cannot be changed after creation.
    """
    type: String!
    """False while an operator has switched the integration off: its token authenticates, and nothing resolves through it."""
    enabled: Boolean!
    """
    How the sender names a device: DEV_EUI, DEVICE_ID, or ALIAS:custom.name for a generic
    sender.
    """
    identity: String!
    """
    A generic sender's settings as a JSON object: where the device identifier is (idFrom),
    and optionally an array of items (itemsPointer), the sender's own time (timePointer) and
    an encoded raw frame (framePointer, frameEncoding). Null for the other types.
    """
    generic: String
    """Whether the receive-link readings (signal strength, signal-to-noise ratio, gateway count) are stored beside the decoded values."""
    linkMetrics: Boolean!
    """
    The device types the integration may resolve devices of. A device of any other type is
    refused, whatever the sender claims.
    """
    deviceTypes: [DeviceType!]!
    """When the bearer token was last generated: at creation and at every rotation."""
    tokenIssuedAt: String!
    """How many uplinks arrived with nothing to read readings from."""
    undecodedCount: Int!
    """When the last such uplink arrived."""
    lastUndecodedAt: String
    """Up to 512 bytes of the last such frame, hex encoded."""
    lastUndecodedSample: String
    """When a request for this integration last failed authentication."""
    lastAuthFailureAt: String
}

"""
An integration together with the bearer token the server just generated for it. The token is
in the response to the write that issued it and nowhere else: the platform stores only a
digest, so it cannot be read again. Rotate it if it is lost.
"""
type IntegrationSecretResult {
    """The integration the token belongs to."""
    integration: Integration!
    """
    43 characters, 256 bits. Show it to the operator once; the sender presents it as
    Authorization: Bearer.
    """
    issuedToken: String!
}

"""Data required to create an integration."""
input IntegrationCreateRequest {
    """Identifier of the integration, unique within the tenant. It is part of the sender's URL."""
    token: String!
    """Human-readable name."""
    name: String
    """Free-text description."""
    description: String
    """CHIRPSTACK_V4, TTS_V3, GENERIC_JSON or GENERIC_BINARY."""
    type: String!
    """Whether the integration accepts traffic. A disabled integration can be enabled later."""
    enabled: Boolean!
    """Tokens of the device types the integration may resolve devices of; at least one, at most 50."""
    deviceTypeTokens: [String!]!
    """
    DEV_EUI (the default) for CHIRPSTACK_V4; DEV_EUI (the default) or DEVICE_ID for TTS_V3;
    required, as ALIAS:custom.name, for the generic types.
    """
    identity: String
    """
    The generic settings as a JSON object. Required for the generic types and refused for the
    others. idFrom is pointer:/path, header:Name or query:name; a binary body can only name a
    header or a query value.
    """
    generic: String
    """Store the receive-link readings beside the decoded values. Defaults to false."""
    linkMetrics: Boolean
    """Free-form JSON the platform stores and does not interpret."""
    metadata: String
}

# A PARTIAL update. Every field is optional in three senses, not two: omit it to leave
# the stored value untouched, send null to clear it, send a value to set it.
#
# There is deliberately no `token` field and no `type` field: the record is identified by the
# mutation's `token` argument, and the sender kind is fixed at creation.
#
# 🔴 Do NOT give any field in this input an SDL default value. A default makes the field
# arrive already-populated for a caller who never sent it, which collapses "omitted" back
# into "sent", and turns this input back into the full replace it replaces.
"""A partial update of an integration. Omitted fields keep their stored value."""
input IntegrationUpdateRequest {
    """Human-readable name. Null clears it."""
    name: String
    """Free-text description. Null clears it."""
    description: String
    """Required and unclearable."""
    enabled: Boolean
    """Replaces the scope. At least one device type; null is refused."""
    deviceTypeTokens: [String!]
    """Required and unclearable; validated against the integration's type."""
    identity: String
    """Replaces the generic settings; refused for the network-server types, and null is refused for the generic ones."""
    generic: String
    """Required and unclearable."""
    linkMetrics: Boolean
    """Free-form JSON the platform stores and does not interpret. Null clears it."""
    metadata: String
}

"""Criteria used when searching for integrations."""
input IntegrationSearchCriteria {
    """1-based page number."""
    pageNumber: Int!
    """Rows per page."""
    pageSize: Int!
    """Return only integrations of this type."""
    type: String
    """Return only integrations that are enabled (true) or disabled (false)."""
    enabled: Boolean
    """Return only integrations whose scope includes the device type with this token."""
    deviceType: String
}

"""A page of integrations."""
type IntegrationSearchResults {
    """The integrations on this page."""
    results: [Integration!]!
    """Where this page sits in the whole result."""
    pagination: SearchResultsPagination!
}

"""What resolveIntegrationDevice concluded."""
enum IntegrationDeviceOutcome {
    """The alias names a device whose type is in the integration's scope."""
    RESOLVED
    """
    No device in scope carries the alias. The sighting was recorded, unless a device outside the
    integration's scope holds the alias, in which case it reads the same but nothing is recorded:
    that value is not an unregistered device, and creating a device with it would be refused.
    """
    UNREGISTERED
    """
    The token matched an integration that an operator has switched off. This is not a failed
    credential: nothing is resolved or recorded.
    """
    DISABLED
    """No such integration, or the token did not match. One answer to both."""
    UNAUTHENTICATED
}

"""What the ingest path needs to know about the payload decoder of a device type."""
type IntegrationDecoderPlan {
    """
    Whether the active published version declares a decoder. True also when this build cannot run
    it: such an uplink must still reach the resolver, which records the failure.
    """
    present: Boolean!
    """The input an uplink must carry for the decoder to run; null when there is no decoder."""
    input: PayloadDecoderInput
    """The most readings one decode produces; 0 when there is no decoder this build can run."""
    maxReadings: Int!
    """The decoder's static worst-case cost; 0 when there is no decoder this build can run."""
    estimatedCost: Int!
    """
    The part of estimatedCost that does not depend on the size of the uplink: the decoder's
    expressions alone. The ingest charge adds the parse of the inputs the decoder reads at their
    actual sizes. 0 when there is no decoder this build can run.
    """
    composedCost: Int!
    """Whether the decoder reads the generic item's JSON, which is parsed and priced by size."""
    parsesJson: Boolean!
    """Whether the decoder reads the network server's decoded object, parsed and priced by size."""
    parsesDecoded: Boolean!
    """The profile version the answer is for, as "{profile}@{version}"; empty when there is no decoder."""
    profileVersionToken: String!
}

"""What the ingest path needs to know about the payload decoder of a device's type."""
type DeviceDecoderPlan {
    """Whether the active published version declares a decoder, usable or not."""
    present: Boolean!
    """The input an uplink must carry for the decoder to run; null when there is no decoder."""
    input: PayloadDecoderInput
    """The most readings one decode produces; 0 when there is no decoder this build can run."""
    maxReadings: Int!
    """The part of the static worst-case cost that does not depend on the size of the uplink."""
    composedCost: Int!
    """Whether the decoder reads the JSON body, parsed and priced by size."""
    parsesJson: Boolean!
    """The profile version the answer is for, as "{profile}@{version}"; empty when there is no decoder."""
    profileVersionToken: String!
}

"""The answer to resolveIntegrationDevice."""
type IntegrationDeviceResolution {
    """What happened."""
    outcome: IntegrationDeviceOutcome!
    """Token of the device the alias names. Set only when the outcome is RESOLVED."""
    deviceToken: String
    """Token of that device's type. Set only when the outcome is RESOLVED."""
    deviceTypeToken: String
    """
    True when the outcome is UNREGISTERED and the sighting was not stored because the
    integration already records 1000 distinct unregistered devices.
    """
    overflow: Boolean!
}

"""
A device a sender named that no device of the tenant carries an alias for, as an integration saw
