    relationshipType: String
}

"""One page of devices matching a search."""
type DeviceSearchResults {
    """The devices on this page."""
    results: [Device!]!
    """Where this page sits in the full result set."""
    pagination: SearchResultsPagination!
}

"""
A group of entities of one family: devices, assets, areas or customers. Membership is either static
(members are added explicitly over relationships of the member type) or dynamic (a selector over the
members' facet attributes, evaluated when the group is read). A dynamic group is versioned:
publishing freezes the selector as an immutable version, which detection rules and access scopes
then pin to.
"""
type EntityGroup implements Model & TokenReference & NamedEntity & BrandedEntity & MetadataEntity & Entity {
    """Server-assigned numeric identifier, as a string. Address a group by its token instead where you can."""
    id: ID!
    """When the group was created, as an RFC 3339 timestamp."""
    createdAt: String
    """When the group was last written, as an RFC 3339 timestamp."""
    updatedAt: String
    """Always null: a deleted group is removed outright and is not returned."""
    deletedAt: String
    """Identifier of the group, unique within the tenant. It cannot be changed after creation."""
    token: String!
    """Human-readable name, up to 128 characters. Null when none is set."""
    name: String
    """Free-text description, up to 1024 characters. Null when none is set."""
    description: String
    """URL of an image representing the group, up to 512 characters. Null when none is set."""
    imageUrl: String
    """
    Name of an icon representing the group, up to 128 characters. Not checked against any icon set.
    Null when none is set.
    """
    icon: String
    """
    Background colour to display the group with, up to 32 characters. Not validated. Null when none
    is set.
    """
    backgroundColor: String
    """
    Foreground (text) colour to display the group with, up to 32 characters. Not validated. Null
    when none is set.
    """
    foregroundColor: String
    """Border colour to display the group with, up to 32 characters. Not validated. Null when none is set."""
    borderColor: String
    """Caller-defined metadata as a JSON document, or null when none is set."""
    metadata: String
    # The entity family this group collects: device | asset | area | customer.
    """The entity family the group collects: device, asset, area or customer. Fixed at creation."""
    memberType: String!
    # How members are determined: static (explicit "member" edges) or dynamic
    # (a CEL selector over member-entity facet attributes — ADR-061 G3).
    """
    How members are determined: static, for members added explicitly, or dynamic, for members
    matched by selector. Fixed at creation.
    """
    membershipMode: String!
    # The CEL membership predicate, present only for dynamic groups.
    """
    The membership predicate, a CEL expression over the members' facet attributes. Present only for
    dynamic groups; null for a static group. This is the editable draft: the selector a published
    version froze is on that version.
    """
    selector: String
    # The resolved members of this group — a static group's "member" edges or a
    # dynamic group's eval-on-read selector matches, transparently (a consumer does
    # not branch on mode). Always bounded + paginated (ADR-061 G4).
    """
    The resolved members of the group: a static group's explicit members, or the entities a dynamic
    group's selector matches now. A consumer does not need to branch on mode. Always bounded and
    paginated.
    """
    members(
        """The page of members to return."""
        pagination: PaginationInput!
    ): EntityGroupMemberSearchResults!
    # The published version whose frozen selector a rule-scoped resolve reads
    # (ADR-062 S1). Null until a dynamic group is first published; always null for a
    # static group (never versioned). The live `selector` above is the mutable draft.
    """
    The published version whose frozen selector rule-scoped resolution reads. Null until a dynamic
    group is first published, and always null for a static group, which is never versioned.
    """
    activeVersion: Int
    # The group's published versions, newest first (ADR-062 S1). Empty for a group
    # that has never been published (and always empty for a static group).
    """
    The group's published versions, newest first. Empty for a group that has never been published,
    and always empty for a static group.
    """
    versions: [EntityGroupVersion!]!
    """
    Whether the group is an access scope: a group a member's access can be limited to. A member
    limited to it sees the devices in the group at its active version — and only while they
    are in it — and the history recorded while they were. Set with setEntityGroupAccessScope.
    """
    accessScope: Boolean!
}

"""
An immutable published snapshot of a dynamic entity group's selector. A detection rule scopes to a
specific group and version, so the set of entities it covers cannot change under a later selector
edit.
"""
type EntityGroupVersion {
    """Version number, increasing per group."""
    version: Int!
    """The membership selector frozen at publish."""
    selector: String!
    """The entity family the group collects, frozen with the version."""
    memberType: String!
    """Optional label given at publish. It may embed a semantic version string, which is not parsed."""
    label: String
    """Optional description of what the version changes. Null when none was given."""
    description: String
    """When the version was published, as an RFC 3339 timestamp."""
    publishedAt: String!
    """
    The identity that published the version: its username, falling back to its email. Null when not
    recorded.
    """
    publishedBy: String
}

"""
A resolved member of an entity group: the lightweight identity of one entity, enough to look up the
full record. The entity family is the group's memberType, so it is not repeated per member.
"""
type EntityGroupMember {
    """Numeric id of the member entity, as a string."""
    id: ID!
    """Token of the member entity."""
    token: String!
}

"""One page of an entity group's resolved members."""
type EntityGroupMemberSearchResults {
    """The members on this page."""
    results: [EntityGroupMember!]!
    """Where this page sits in the full member set."""
    pagination: SearchResultsPagination!
}

"""
The result of evaluating a candidate dynamic-group selector without saving it. A selector that fails
the publish checks (not expressible as a query, over the cost budget, or a parse or type error)
returns valid false with the error and no members, so an authoring form can show the problem inline
as the user types instead of treating it as a failure.
"""
type SelectorPreview {
